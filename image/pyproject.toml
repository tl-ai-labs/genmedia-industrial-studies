[project]
name = "genmedia-eval"
version = "0.1.0"
description = "GenMedia model comparison — image & voice evaluation runner (plan v1.2)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "pillow>=10.3",
    "numpy>=1.26",
    "imagehash>=4.3",
    "scikit-image>=0.24",
    "rapidocr-onnxruntime>=1.3",
    "openpyxl>=3.1",
    "google-genai>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["runner", "runner.adapters"]

[tool.setuptools.package-data]
runner = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
