# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-10 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-heavy.png — provenance in each sidecar .json
id: IMG-GAME-10
modality: image
task: image_edit
title: Combat pose sheet from one reference
inputs:
  source: assets/bank/IMG-GAME-base-heavy.png
params:
  size: auto
prompt: 'Using this figure as the character reference, show the same operator in four full-body
  combat poses in one image: a low ready stance, a shouldered aim, a crouched reload, and
  a sprint. Keep the suit, helmet, visor and equipment identical across all four. Plain light
  background, even lighting, full body visible in every pose.'
expected: 'Combat pose sheet from one reference. Capability under test: Identity under extreme
  pose and foreshortening change. Adherence clauses, check each: 1) Four distinct poses matching
  the four named actions  2) Same suit, helmet and visor across all four  3) Same equipment
  layout in every pose  4) Full body visible in each pose, limbs anatomically coherent'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- identity-&-consistency
- scenario-bank-game
- tier-high
