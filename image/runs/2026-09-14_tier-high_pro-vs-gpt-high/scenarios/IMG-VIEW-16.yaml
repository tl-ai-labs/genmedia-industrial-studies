# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-16 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-ui.png — provenance in each sidecar .json
# must_read_text: the sheet holds a placeholder ('strings read from the pinned screenshot at run time');
# replaced with the five strings visible in the pinned screenshot (German UI).
id: IMG-VIEW-16
modality: image
task: image_edit
title: Flat screenshot to an angled device mockup
inputs:
  source: assets/bank/IMG-VIEW-base-ui.png
params:
  size: auto
prompt: Place this flat screenshot onto a modern smartphone shown at a three-quarter angle,
  tilted about twenty-five degrees to the right and leaning slightly back, floating on a soft
  neutral background with a gentle drop shadow. The screen content must follow the phone's
  perspective correctly, and every text string visible in the original interface must remain
  legible and unchanged.
expected: 'Flat screenshot to an angled device mockup. Capability under test: Applying a perspective
  transform to flat content and keeping the text correct. Adherence clauses, check each: 1)
  Screenshot mapped onto a phone at roughly a twenty-five degree three-quarter angle  2) Screen
  content follows the device perspective, edges aligned to the screen  3) Every interface
  string still legible and correctly spelled  4) Soft neutral background and a plausible drop
  shadow, nothing cropped'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - In der Nähe
  - 'Zustand des Ortes:'
  - Existiert
  - Benötigt Foto
  - 'Ortstyp:'
criteria:
- edit_fidelity
- visual_quality
- realism_style
- text_accuracy
weights:
  edit_fidelity: 0.4
  visual_quality: 0.15
  realism_style: 0.15
  text_accuracy: 0.3
tags:
- technical-&-corrective
- scenario-bank-view
- tier-high
