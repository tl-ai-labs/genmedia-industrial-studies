# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-53 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-masked.png — provenance in each sidecar .json
# KNOWN ISSUE: the pinned 'masked' photo shows several suited people, one face visible through a visor; the
# prompt assumes one soldier with the face fully covered.
id: IMG-GAME-53
modality: image
task: image_edit
title: Third-person animation pose strip
inputs:
  source: assets/bank/IMG-GAME-base-masked.png
params:
  size: auto
prompt: 'Using this figure as the character reference, produce a four-frame movement strip
  as a horizontal row: contact, passing, push-off and recovery positions of a combat jog,
  all facing the same direction. Same suit, same colours, same character height and the same
  level of detail in every frame. Even spacing, identical frame widths, plain background,
  no text.'
expected: 'Third-person animation pose strip. Capability under test: Frame-to-frame coherence
  across a movement cycle. Adherence clauses, check each: 1) Four frames in a horizontal strip
  showing a readable jog cycle  2) Same suit, colours and character height in every frame  3)
  Foot contact position differs between frames, proving a real cycle  4) Identical frame widths,
  even spacing, plain background'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- style-&-production-assets
- scenario-bank-game
- tier-high
