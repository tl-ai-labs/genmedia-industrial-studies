id: IMG-STY-05
modality: image
task: image_edit
title: Photo to isometric render
inputs:
  source: assets/bank/IMG-STY-05-source.png
params:
  size: auto
prompt: Reinterpret this room photograph as a clean isometric 3D render. Keep the
  same furniture, same layout and same relative positions.
expected: 'Photo to isometric render. Capability under test: Perspective transformation
  as style. Adherence clauses, check each: 1) Isometric projection achieved  2) Same
  furniture items present  3) Relative layout preserved  4) Clean render aesthetic'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.45
  visual_quality: 0.25
  realism_style: 0.3
tags:
- style-transfer
- scenario-bank-edit
