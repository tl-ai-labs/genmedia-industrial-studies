  the light and the style. Don't change anything in the original area.
expected: 'Ultrawide city wallpaper. Capability under test: Extend the picture. Adherence clauses, check
  each: 1) Output is 21:9  2) Original area unchanged  3) Road edges and building lines continue straight
  across the seams  4) New billboards look like the same city, no garbled giant text  5) Lighting direction
  matches (sun from the upper left)'
