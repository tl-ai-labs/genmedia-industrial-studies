# Source: gaming-scenarios-image-6-games.xlsx (sheets/), row IMG-GEDIT-10
# Game: BGMI (Battle royale, realistic); test type E-2 Change the outfit, pose unchanged.
# Complexity tier: medium — run with Gemini 3.1 Flash | GPT Image 2 medium (tiers/gaming-medium.txt). Full outfit replacement with pose and slung rifle held.
# Inputs: source = IMG-GEDIT-10-source.png — real public images, provenance (URL, page, licence, sha256) in each sidecar .json.
id: IMG-GEDIT-10
modality: image
task: image_edit
title: Into the ghillie suit
inputs:
  source: assets/bank/gaming/image/IMG-GEDIT-10-source.png
params:
  size: auto
prompt: 'Dress this player in a full ghillie suit: shaggy strands of green, brown and dry-grass colours
  covering the helmet, shoulders, back, arms and legs. Keep exactly the same pose, the slung rifle, the
  player''s position in the frame, the buildings, and every on-screen button and number.'
expected: 'Into the ghillie suit. Capability under test: Change the outfit, pose unchanged. Adherence
  clauses, check each: 1) Ghillie covers head to feet; strands look like grass and burlap  2) Pose and
  position match the source  3) Slung rifle still visible and unchanged  4) Buildings, trees and HUD unchanged  5)
  Suit edges clean, no halo'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- game-bgmi
- test-e-2
- scenario-bank-image-gaming
- tier-medium
