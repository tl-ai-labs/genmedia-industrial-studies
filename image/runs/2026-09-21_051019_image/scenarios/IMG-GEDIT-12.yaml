id: IMG-GEDIT-12
modality: image
task: image_edit
title: Blur the player name
inputs:
  source: assets/bank/gaming/image/IMG-GEDIT-12-source.png
params:
  size: auto
prompt: Blur the player name tag floating in the middle of the picture, next to the small winged badge,
  together with the badge, so the name can't be read. Leave everything else sharp and unchanged, including
  the item names and prices above the figures, the character, and the caption text.
expected: 'Blur the player name. Capability under test: Blur player names, chat or kill feed. Adherence
