# Source: gaming-scenarios-image-6-games.xlsx (sheets/), row IMG-GT2I-20
# Game: Clash of Clans (Strategy, top-down); test type T2I-15 Facial expression on a named character.
# Complexity tier: low — run with Gemini 3.1 Flash Lite | GPT Image 2 low (tiers/gaming-low.txt). Single character expression portrait.
# Judging reference (NOT an input, never sent to the model): assets/bank/gaming/image/IMG-GT2I-20-reference.png
#   provenance in IMG-GT2I-20-reference.json. Why needed: A specific character design (the Barbarian) must be recognisable.
id: IMG-GT2I-20
modality: image
task: text_to_image
title: Barbarian battle-cry portrait
params:
  size: 1024x1024
  aspect_ratio: '1:1'
prompt: 'A square profile picture of the famous barbarian from a cartoon mobile strategy game: wild blond
  hair, a huge blond moustache, thick angry eyebrows and leather gear, a short sword raised in his right
  fist. He is mid battle-cry, mouth wide open, eyebrows pulled down hard, eyes narrowed. Head and shoulders,
  a softly blurred green village behind him. Chunky 3D cartoon render, bright colours.'
expected: 'Barbarian battle-cry portrait. Capability under test: Facial expression on a named character.
  Adherence clauses, check each: 1) Expression clearly a battle-cry: mouth wide open, brows down, eyes
  narrowed  2) Signature blond hair and moustache  3) Sword raised in the right fist, hand holds it properly  4)
  Square head-and-shoulders crop, cartoon 3D style  5) Not realistic, no gore'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- prompt_adherence
- visual_quality
- composition
- realism_style
weights:
  prompt_adherence: 0.4
  visual_quality: 0.25
  composition: 0.2
  realism_style: 0.15
tags:
- game-clash-of-clans
- test-t2i-15
- scenario-bank-image-gaming
- tier-low
