# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-UI-03 — prompt verbatim; weights follow the
# sheet's family guidance for 'UI mockups & layout'
id: IMG-UI-03
modality: image
task: text_to_image
title: Settings page with controls
prompt: Design a settings page with three toggle switches labelled Notifications,
  Dark mode, Auto-sync — the first on, the other two off — and a Save button at the
  bottom right.
params:
  size: 1024x1536
  aspect_ratio: '9:16'
expected: 'Settings page with controls. Capability under test: Control-type accuracy.
  Adherence clauses, check each: 1) Three toggles with exact labels  2) States correct:
  on, off, off  3) Save button bottom right  4) Recognisable settings layout'
checks:
  min_width: 700
  min_height: 900
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - Notifications
  - Dark mode
  - Auto-sync
  - Save
criteria:
- prompt_adherence
- visual_quality
- composition
- realism_style
- text_accuracy
weights:
  prompt_adherence: 0.25
  visual_quality: 0.15
  composition: 0.25
  realism_style: 0.05
  text_accuracy: 0.3
tags:
- ui-mockups-&-layout
- scenario-bank
