id: IMG-LE-02
modality: image
task: image_edit
title: Person removal from a group
inputs:
  source: assets/bank/IMG-LE-02-source.png
params:
  size: auto
prompt: Remove the person standing furthest to the right. Reconstruct the background
  behind them. Do not alter the other people.
expected: 'Person removal from a group. Capability under test: Background reconstruction
  under a large occluder. Adherence clauses, check each: 1) Target person absent  2)
  Remaining people unaltered — faces, poses, clothing  3) Background continuous with
  no smearing  4) Group spacing not recomposed'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  preservation:
    method: phash
    max_distance: 14
criteria:
- edit_fidelity
- preservation
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.333333
  preservation: 0.388889
  visual_quality: 0.166667
  realism_style: 0.111111
tags:
