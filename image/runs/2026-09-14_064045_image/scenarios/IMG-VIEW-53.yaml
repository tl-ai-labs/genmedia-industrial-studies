# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-53 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-portrait.png — provenance in each sidecar .json
id: IMG-VIEW-53
modality: image
task: image_edit
title: Standing person seen from directly overhead
inputs:
  source: assets/bank/IMG-VIEW-base-portrait.png
params:
  size: auto
prompt: Re-render this standing man seen from directly overhead, looking straight down, so
  the crown of his head and his shoulders are nearest the camera and his feet are hidden beneath
  them. His clothing, colouring and the position of his arms must stay consistent with the
  original. The floor becomes the background. Even lighting, plausible shadow directly beneath
  him.
expected: 'Standing person seen from directly overhead. Capability under test: Ninety-degree
  elevation change on a standing human figure. Adherence clauses, check each: 1) Camera directly
  overhead, looking straight down  2) Crown of the head and shoulders nearest the camera,
  feet occluded  3) Clothing, colouring and arm position consistent with the original  4)
  Floor reads as the background, shadow falls directly beneath'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.55
  visual_quality: 0.15
  realism_style: 0.3
tags:
- people-single-and-group-viewpoints
- scenario-bank-view
- tier-high
