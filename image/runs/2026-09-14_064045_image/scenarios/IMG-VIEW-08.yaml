# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-08 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-facade.png — provenance in each sidecar .json
id: IMG-VIEW-08
modality: image
task: image_edit
title: Street-level building to a drone aerial
inputs:
  source: assets/bank/IMG-VIEW-base-facade.png
params:
  size: auto
prompt: Re-photograph this building from a drone position about forty metres up and thirty
  metres back, looking down at roughly forty degrees, so the roof, the corner of the building
  and the surrounding streets are visible. Keep the masonry, the storey count, the window
  arrangement and the street-level detail faithful to the original, and keep the same light.
expected: 'Street-level building to a drone aerial. Capability under test: Large camera translation
  — inventing roof and surroundings while holding the seen facade. Adherence clauses, check
  each: 1) Elevated aerial viewpoint looking down at roughly forty degrees  2) Roof and surrounding
  streets now visible  3) Masonry, storey count and window arrangement faithful to the original  4)
  Same light and weather, no new signage invented'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- scene-&-interior-re-angle
- scenario-bank-view
- tier-high
