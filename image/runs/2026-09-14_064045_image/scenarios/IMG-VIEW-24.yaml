# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-24 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-shoe.png — provenance in each sidecar .json
id: IMG-VIEW-24
modality: image
task: image_edit
title: Side profile to a three-quarter pair shot
inputs:
  source: assets/bank/IMG-VIEW-base-shoe.png
params:
  size: auto
prompt: 'From this single side-on shoe, produce a three-quarter pair shot: both shoes of the
  pair, the original and its mirrored partner, angled about forty degrees toward the camera
  and slightly above, one set a little behind the other. The upper colour, sole, lacing and
  all markings must match the original exactly, and the second shoe must be a true mirror
  rather than a copy. Same plain background and lighting.'
expected: 'Side profile to a three-quarter pair shot. Capability under test: Rotation plus
  correct mirroring into a pair, with materials held. Adherence clauses, check each: 1) Both
  shoes present at roughly a forty-degree three-quarter angle  2) Second shoe is a true mirror
  of the first, not a duplicate  3) Upper colour, sole, lacing and markings match the original  4)
  Plain background, contact shadows and lighting consistent'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- product-&-object-rotation
- scenario-bank-view
- tier-high
