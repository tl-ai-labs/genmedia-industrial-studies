# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-06 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-room.png — provenance in each sidecar .json
id: IMG-VIEW-06
modality: image
task: image_edit
title: Eye-level room to a high corner angle
inputs:
  source: assets/bank/IMG-VIEW-base-room.png
params:
  size: auto
prompt: Re-photograph this room from a high corner angle, with the camera raised to about
  two and a half metres and angled down across the room. Keep every piece of furniture, its
  position and its material exactly as in the original, and keep the same daylight from the
  windows. More of the floor and the far corners should now be visible.
expected: 'Eye-level room to a high corner angle. Capability under test: Camera elevation
  and yaw change with the room''s contents and layout held fixed. Adherence clauses, check
  each: 1) Camera clearly raised and angled down from a corner  2) Sofa, low table, windows
  and floor covering all present in their original relative positions  3) More floor area
  and the far corners now visible  4) Same daylight direction and colour from the windows'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- scene-&-interior-re-angle
- scenario-bank-view
- tier-high
