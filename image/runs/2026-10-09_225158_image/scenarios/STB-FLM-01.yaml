prompt: 'Using this key frame as the world and the character, draw the shooting storyboard for the scene
  as one image: nine panels in a three-by-three grid, read left to right, top to bottom. Black-and-white
  pencil on white paper, with clean 2.39:1 frame lines inside each panel, consistent line weight and tonal
  shading throughout, like a professional film storyboard. Under each panel is a caption bar with exactly
  the text given, nothing more:

  1 · Astronaut enters the forest · WS · Static

  2 · Gloved hands tap the wrist device · CU · Push in

  3 · POV: glowing trunks ahead · MS · Handheld

  4 · Trees reflected in the visor · ECU · Static

  5 · Palm on the bark, light spreads · MS · Pan right

  6 · Device screen: pulse rising · Insert · Static

  7 · Looks up, spores falling · MCU · Tilt up

  8 · Whole forest pulses at once · EWS · Crane up

  9 · Silhouette in a beam of light · WS · Static


  Each drawing must match its own caption''s shot size: WS shows the whole figure small in the forest,
  CU and Insert fill the panel with the hands or the screen, ECU shows only the visor, EWS makes the figure
  tiny. Panels with a camera move carry a drawn arrow showing it: a push-in arrow toward the centre, a
  pan arrow to the right, a tilt arrow upward, a crane arrow rising. Keep the astronaut exactly as in
  the key frame: the bulky white suit, the orange band on the upper left arm, the device on the left forearm,
  the boxy back pack, the visor. The astronaut moves left to right through panels 1 to 5. The forest is
  the one in the key frame: tall straight trunks with glowing veins, low glowing moss, floating spores,
  one shaft of light from the upper right. No colour, no extra characters, no title, no page numbers.'
