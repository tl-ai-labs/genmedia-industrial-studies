prompt: 'From this one product photo, design a production bible for the can''s launch film as a single
  landscape sheet on a dark navy page, with thin gold rules between sections and small white sans labels.
  Across the top: "ANANAS & CO. — PINEAPPLE FIZZ — PRODUCTION BIBLE", and under it a palette strip of
  four swatches labelled "Cobalt", "Sun yellow", "Ice white" and "Navy", each swatch matching the colour
  it names on the can and the page.


  Section 1, "PRODUCT / HERO OBJECT REFERENCE": eight tiles of this exact can labelled "FRONT", "BACK",
  "LEFT", "RIGHT", "TOP", "HERO 3/4", "OPENED" and "POUR". The back shows the rest of the line-drawn pineapple
  wrapping round from the front; the top shows the silver ring-pull; OPENED shows the ring-pull lifted
  with fizz at the mouth; POUR shows the drink going into a tall glass of ice.


  Section 2, "ENVIRONMENT / SET DESIGN": one wide frame of the set (a dark slate plinth, a navy cyclorama,
  a block of clear ice beside the can) and a top-down lighting diagram with the can at the centre and
  four labelled markers: "KEY" at upper left, "RIM" behind on the right, "FILL" at the front right and
  "CAMERA" at the front.


  Section 3, "STORYBOARD": six frames in a row numbered and captioned exactly "1 Ice cracks", "2 Can rises
  from the ice", "3 Ring-pull opens", "4 Fizz in macro", "5 Pour into glass" and "6 End card".


  Section 4, "LIGHTING / MOOD / STYLE": four mood frames and a notes box with exactly these three lines:
  "Cold, crisp, high contrast", "Condensation on the lower two-thirds", "Script always reads uphill".


  In every tile and frame it is this can: matte cobalt blue, the yellow script "Ananas" running diagonally
  upward, "PINEAPPLE FIZZ" and "330 ml" in white, the white pineapple drawing on the right, condensation
  on the lower two-thirds. No other brands, no other text.'
