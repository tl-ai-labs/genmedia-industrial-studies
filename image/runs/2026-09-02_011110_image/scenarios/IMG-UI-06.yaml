# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-UI-06 — prompt verbatim; synthetic source
# assets (generated by gemini flash, outside the comparison)
id: IMG-UI-06
modality: image
task: image_edit
title: Responsive pair
inputs:
  source: assets/bank/IMG-UI-06-source.png
params:
  size: auto
prompt: Produce this screen at both phone ratio 9:16 and tablet ratio 4:3. Same content
  and labels in both; layout may reflow but nothing may be dropped.
expected: 'Responsive pair. Capability under test: Same content, two form factors.
  Adherence clauses, check each: 1) Both ratios produced  2) Identical text content
  in both  3) Sensible reflow  4) No dropped elements'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - Daily Steps
  - Calories
  - Sleep
criteria:
- edit_fidelity
- visual_quality
- realism_style
- text_accuracy
weights:
  edit_fidelity: 0.4
  visual_quality: 0.15
  realism_style: 0.05
  text_accuracy: 0.4
tags:
- ui-mockups-&-layout
- scenario-bank-edit
