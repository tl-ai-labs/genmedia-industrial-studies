# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-TXT-10 — prompt verbatim; synthetic source
# assets (generated by gemini flash, outside the comparison)
id: IMG-TXT-10
modality: image
task: image_edit
title: Typo correction in place
inputs:
  source: assets/bank/IMG-TXT-10-source.png
params:
  size: auto
prompt: In this image, correct the misspelled word 'Recieve' to 'Receive'. Match the
  existing font, size, colour and position. Change nothing else.
expected: 'Typo correction in place. Capability under test: Targeted text edit. Adherence
  clauses, check each: 1) Word now reads Receive  2) Font, weight, size and colour
  match surrounding text  3) Baseline and position preserved  4) Rest of image unchanged'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  preservation:
    method: phash
    max_distance: 8
  must_read_text:
  - Please Receive Your Order Here
criteria:
- edit_fidelity
- preservation
- visual_quality
- realism_style
- text_accuracy
weights:
  edit_fidelity: 0.25
  preservation: 0.15
  visual_quality: 0.1
  realism_style: 0.05
  text_accuracy: 0.45
tags:
- text-typography-infographics
- scenario-bank-edit
