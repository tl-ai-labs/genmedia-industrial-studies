id: IMG-TXT-09
modality: image
task: image_edit
title: Text on a curved surface
inputs:
  source: assets/bank/IMG-TXT-09-source.png
params:
  size: auto
prompt: Place the word HARVEST on the curved side of a ceramic mug so it wraps naturally
  with the surface and remains fully legible.
expected: 'Text on a curved surface. Capability under test: Geometric distortion with
  legibility. Adherence clauses, check each: 1) Word spelled correctly  2) Wraps with
  the curve rather than sitting flat  3) Fully legible  4) Mug otherwise unchanged'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  preservation:
    method: phash
    max_distance: 12
  must_read_text:
  - HARVEST
criteria:
- edit_fidelity
- preservation
- visual_quality
- realism_style
- text_accuracy
weights:
