# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-23 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-bottle.png — provenance in each sidecar .json
id: IMG-VIEW-23
modality: image
task: image_edit
title: Show the base of the product
inputs:
  source: assets/bank/IMG-VIEW-base-bottle.png
params:
  size: auto
prompt: Re-photograph this bottle from directly beneath, looking straight up at its base,
  so the base reads as a circle with the body receding above it. Keep the glass colour and
  the diameter faithful, and give the base a plausible moulded punt. Do not invent text or
  markings on the base. Same white background and soft lighting.
expected: 'Show the base of the product. Capability under test: Inventing a wholly unseen
  face under a no-copying constraint. Adherence clauses, check each: 1) Camera directly beneath,
  base facing the viewer  2) Base reads as a circle with the body receding above  3) No text
  or markings invented on the base  4) Glass colour, diameter, white background and lighting
  consistent'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- product-&-object-rotation
- scenario-bank-view
- tier-medium
