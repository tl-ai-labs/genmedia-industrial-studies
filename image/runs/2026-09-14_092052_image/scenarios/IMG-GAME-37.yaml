# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-37 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-urban.png — provenance in each sidecar .json
id: IMG-GAME-37
modality: image
task: image_edit
title: Three shot distances of one operator
inputs:
  source: assets/bank/IMG-GAME-base-urban.png
params:
  size: auto
prompt: 'Using this reference, produce three framings of the same person in one row: a tight
  head-and-shoulders close-up, a medium waist-up shot, and a full-body shot. Face, cap, shirt
  and build must be identical across all three, with detail added rather than changed as the
  framing tightens. Same lighting and plain background throughout.'
expected: 'Three shot distances of one operator. Capability under test: Detail scaling across
  framings without invention or identity drift. Adherence clauses, check each: 1) Three framings
  — close-up, waist-up and full body  2) Face, cap, shirt and build identical across all three  3)
  Extra detail in the close-up is consistent with, not different from, the wide shot  4) Same
  lighting and plain background in all three'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- identity-&-consistency
- scenario-bank-game
- tier-medium
