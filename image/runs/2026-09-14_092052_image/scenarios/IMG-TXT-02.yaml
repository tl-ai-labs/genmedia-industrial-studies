# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-TXT-02 — prompt verbatim; weights follow the
# sheet's family guidance for 'Text, typography, infographics'
id: IMG-TXT-02
modality: image
task: text_to_image
title: Small-type packaging
prompt: 'Create a food packaging front panel. Include an ingredients line in small
  type reading exactly: Oats, almonds, honey, sea salt. Product name in large type:
  MORNING FUEL.'
params:
  size: 1024x1536
  aspect_ratio: '2:3'
expected: 'Small-type packaging. Capability under test: Legibility at reduced size.
  Adherence clauses, check each: 1) Both strings exact  2) Ingredients line legible
  when rendered at 25% scale  3) Product name dominant  4) Panel reads as packaging'
checks:
  min_width: 700
  min_height: 900
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - MORNING FUEL
  - Oats, almonds, honey, sea salt
criteria:
- prompt_adherence
- visual_quality
- composition
- realism_style
- text_accuracy
weights:
  prompt_adherence: 0.25
  visual_quality: 0.1
  composition: 0.1
  realism_style: 0.1
  text_accuracy: 0.45
tags:
- text-typography-infographics
- scenario-bank
