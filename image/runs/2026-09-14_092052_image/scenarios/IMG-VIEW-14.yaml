# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-14 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-facade.png — provenance in each sidecar .json
id: IMG-VIEW-14
modality: image
task: image_edit
title: Correct converging verticals on a building
inputs:
  source: assets/bank/IMG-VIEW-base-facade.png
params:
  size: auto
prompt: Correct the perspective on this photograph so the building's verticals are truly vertical
  and parallel, as if shot with a tilt-shift lens from the same position. The building must
  no longer lean backwards. Keep the masonry, storey count, window arrangement and street-level
  detail exactly as they are, and keep the frame rectangular with no black wedges at the edges.
expected: 'Correct converging verticals on a building. Capability under test: Keystone correction
  — a controlled projective transform, not a redraw. Adherence clauses, check each: 1) Verticals
  upright and parallel, no backward lean  2) Masonry, storeys and window arrangement unchanged  3)
  Frame still rectangular with no black corners or wedges  4) No warping or stretching of
  the street-level detail'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.55
  visual_quality: 0.15
  realism_style: 0.3
tags:
- technical-&-corrective
- scenario-bank-view
- tier-medium
