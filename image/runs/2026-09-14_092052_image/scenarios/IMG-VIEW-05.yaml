# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-05 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-bottle.png — provenance in each sidecar .json
id: IMG-VIEW-05
modality: image
task: image_edit
title: Four-step turntable sheet
inputs:
  source: assets/bank/IMG-VIEW-base-bottle.png
params:
  size: auto
prompt: 'From this single product photograph, produce a four-panel turntable sheet in one
  image: the same bottle seen at zero, ninety, one hundred and eighty and two hundred and
  seventy degrees of rotation, arranged left to right on one shared baseline. Identical bottle,
  identical scale, identical lighting and identical white background in all four panels; only
  the rotation changes.'
expected: 'Four-step turntable sheet. Capability under test: Consistent multi-angle set from
  one view — scale, lighting and identity held across panels. Adherence clauses, check each:
  1) Four panels, left to right, at 0, 90, 180 and 270 degrees  2) Same bottle at the same
  scale in every panel  3) Highlight and seam positions shift consistently with the stated
  rotations  4) One shared baseline, identical lighting and background throughout'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- product-&-object-rotation
- scenario-bank-view
- tier-medium
