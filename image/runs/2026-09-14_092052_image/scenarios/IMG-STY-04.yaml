id: IMG-STY-04
modality: image
task: image_edit
title: Style consistency across a set
inputs:
  source: assets/bank/IMG-STY-04-source.png
  reference: assets/bank/IMG-STY-04-reference.png
  reference2: assets/bank/IMG-STY-04-reference2.png
  reference3: assets/bank/IMG-STY-04-reference3.png
params:
  size: auto
prompt: Apply the same illustration style to all four of these photographs so they
  read as a single coherent set.
expected: 'Style consistency across a set. Capability under test: Repeatability of
  a style. Adherence clauses, check each: 1) All four stylised  2) Style visually
  identical across the set  3) Each subject still recognisable  4) Consistent palette'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.45
  visual_quality: 0.25
  realism_style: 0.3
tags:
- style-transfer
- scenario-bank-edit
