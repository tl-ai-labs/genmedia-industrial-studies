# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-13 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-urban.png — provenance in each sidecar .json
id: IMG-GAME-13
modality: image
task: image_edit
title: Same operator, fifteen years on
inputs:
  source: assets/bank/IMG-GAME-base-urban.png
params:
  size: auto
prompt: 'Using this reference, show the same person fifteen years older: greying stubble,
  weathered skin, a heavier build, the cap replaced by a worn boonie hat and the plain shirt
  now a faded field shirt. He must still be recognisably the same person — same bone structure,
  same brow and jaw. Same neutral framing, plain background.'
expected: 'Same operator, fifteen years on. Capability under test: Recognisable identity preserved
  through deliberate age change. Adherence clauses, check each: 1) Visibly older — greying
  stubble, weathered skin, heavier build  2) Same bone structure, brow and jaw, still recognisable  3)
  Cap replaced by a worn boonie hat, shirt now a faded field shirt  4) Same neutral framing
  on a plain background'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- identity-&-consistency
- scenario-bank-game
- tier-medium
