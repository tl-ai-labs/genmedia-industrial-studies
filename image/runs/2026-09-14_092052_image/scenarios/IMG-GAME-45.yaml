# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-45 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-heavy.png — provenance in each sidecar .json
id: IMG-GAME-45
modality: image
task: image_edit
title: Elite variant of a base enemy
inputs:
  source: assets/bank/IMG-GAME-base-heavy.png
params:
  size: auto
prompt: 'Using this reference, create an elite variant of the same enemy: larger and heavier,
  scarred and pitted plating, a crown of welded spikes across the shoulders, glowing amber
  seams along the forearms, and a heavier weapon mount on one arm. It must read at a glance
  as the same unit promoted, not a different enemy. Same stance, plain background.'
expected: 'Elite variant of a base enemy. Capability under test: Recognisable escalation —
  the base enemy amplified rather than replaced. Adherence clauses, check each: 1) Clearly
  the same unit as the reference, visibly larger and heavier  2) Welded shoulder spikes and
  glowing amber forearm seams  3) Heavier weapon mount replacing the original  4) Same stance
  and plain background, colours still recognisable'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- variants-&-progression
- scenario-bank-game
- tier-medium
