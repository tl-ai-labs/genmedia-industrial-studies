# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-17 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-heavy.png — provenance in each sidecar .json
id: IMG-GAME-17
modality: image
task: image_edit
title: Battle-damaged state
inputs:
  source: assets/bank/IMG-GAME-base-heavy.png
params:
  size: auto
prompt: 'Using this reference, show the same operator badly damaged after a firefight: the
  visor cracked across one side, the chest plate scored and dented, one shoulder strap torn
  and hanging, soot streaked across the torso, and the glove on one hand shredded. Same figure,
  same colours, same stance and same plain background — only the damage is new. No blood.'
expected: 'Battle-damaged state. Capability under test: Additive damage state that keeps the
  base design intact. Adherence clauses, check each: 1) Cracked visor, scored chest plate,
  torn shoulder strap  2) Soot streaking and one shredded glove  3) Same colours, stance and
  proportions as the reference  4) Plain background unchanged, no blood, no new equipment'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- variants-&-progression
- scenario-bank-game
- tier-medium
