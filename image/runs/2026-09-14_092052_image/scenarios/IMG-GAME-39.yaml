# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-39 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-masked.png — provenance in each sidecar .json
# KNOWN ISSUE: the pinned 'masked' photo shows several suited people, one face visible through a visor; the
# prompt assumes one soldier with the face fully covered.
id: IMG-GAME-39
modality: image
task: image_edit
title: Four-panel kill-cam beat
inputs:
  source: assets/bank/IMG-GAME-base-masked.png
params:
  size: auto
prompt: 'Using this figure as the character reference, draw a four-panel sequence in a two-by-two
  grid telling one small beat: the operator spots something off-panel, raises a weapon, fires,
  then lowers it. Same character in every panel — same suit, hood, respirator and equipment
  — with the camera roughly at the same distance. Consistent style and lighting across all
  four, no text.'
expected: 'Four-panel kill-cam beat. Capability under test: Identity and style held across
  a multi-panel sequence. Adherence clauses, check each: 1) Four panels in a two-by-two grid
  showing the four described beats  2) Same suit, hood, respirator and equipment in every
  panel  3) Consistent style, lighting and camera distance across the sequence  4) No text,
  speech bubbles or panel numbers'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- identity-&-consistency
- scenario-bank-game
- tier-medium
