# Scenario bank row IMG-CHAR-02 — prompt verbatim; synthetic source
# assets (generated by gemini flash, outside the comparison)
id: IMG-CHAR-02
modality: image
task: image_edit
title: Same character, new lighting
inputs:
  source: assets/bank/IMG-CHAR-02-source.png
params:
  size: auto
prompt: 'Place this character in three settings: bright noon exterior, warm indoor
  lamplight, and cool overcast. Identity and outfit must not change.'
expected: 'Same character, new lighting. Capability under test: Identity under illumination
  change. Adherence clauses, check each: 1) Three lighting conditions clearly different  2)
  Same identity throughout  3) Outfit unchanged  4) Skin tone consistent under white
  balance normalisation'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- character-&-identity
- scenario-bank-edit
