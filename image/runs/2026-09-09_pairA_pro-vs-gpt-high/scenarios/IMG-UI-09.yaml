# Scenario bank row IMG-UI-09 — prompt verbatim; weights follow the
# sheet's family guidance for 'UI mockups & layout'
id: IMG-UI-09
modality: image
task: text_to_image
title: Email template with copy space
prompt: Design an email newsletter template with a header band, a hero image area,
  a body text block, and a footer. Leave the hero area empty as a placeholder. Width
  600px equivalent.
params:
  size: 1024x1536
  aspect_ratio: '2:3'
expected: 'Email template with copy space. Capability under test: Layout constraint
  compliance. Adherence clauses, check each: 1) Four distinct regions in order  2)
  Hero area left empty  3) Footer present at bottom  4) Proportions consistent with
  a 600px email width'
checks:
  min_width: 700
  min_height: 900
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- prompt_adherence
- visual_quality
- composition
- realism_style
weights:
  prompt_adherence: 0.357142
  visual_quality: 0.214286
  composition: 0.357143
  realism_style: 0.071429
tags:
- ui-mockups-&-layout
- scenario-bank
