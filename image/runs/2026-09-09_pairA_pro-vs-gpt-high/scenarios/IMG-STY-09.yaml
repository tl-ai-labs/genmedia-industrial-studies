id: IMG-STY-09
modality: image
task: image_edit
title: Blended styles
inputs:
  source: assets/bank/IMG-STY-09-source.png
params:
  size: auto
prompt: Apply a blend of pencil sketch and watercolour to this image, weighted roughly
  70% sketch and 30% watercolour. Subject must stay recognisable.
expected: 'Blended styles. Capability under test: Controlled ratio between two styles.
  Adherence clauses, check each: 1) Both styles evident  2) Sketch visibly dominant  3)
  Subject recognisable  4) Blend reads as deliberate'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.45
  visual_quality: 0.25
  realism_style: 0.3
tags:
- style-transfer
- scenario-bank-edit
