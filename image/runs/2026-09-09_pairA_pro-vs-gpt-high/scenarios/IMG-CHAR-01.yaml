# Scenario bank row IMG-CHAR-01 — prompt verbatim; synthetic source
# assets (generated by gemini flash, outside the comparison)
id: IMG-CHAR-01
modality: image
task: image_edit
title: Same character, three poses
inputs:
  source: assets/bank/IMG-CHAR-01-source.png
params:
  size: auto
prompt: Using this character reference, generate the same person standing, seated,
  and walking. Keep the face, hair, build and outfit identical across all three.
expected: 'Same character, three poses. Capability under test: Identity under pose
  variation. Adherence clauses, check each: 1) Three distinct poses  2) Same face
  across all  3) Same outfit and hair  4) Consistent build'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- character-&-identity
- scenario-bank-edit
