# Gaming pilot scenario IMG-GEDIT-05 (Real Cricket 24, Image Editing). Built from
# docs/sheets/gaming-scenarios-image.xlsx.
# Prompt origin: Real-based.
# Prompt source: https://help.seelab.ai/en/article/nano-banana-image-to-image-prompting-guide-19jba72/
# Test type: IEDIT-03 Change the colour of one object, nothing else changes
id: IMG-GEDIT-05
modality: image
task: image_edit
title: 'White ball to pink ball'
inputs:
  source: assets/bank/gaming/image/IMG-GEDIT-05-source.png
params:
  size: auto
prompt: 'Change the white ball to pink. Keep its size, position, seam and shine, and change nothing else in the picture.'
expected: 'White ball to pink ball. Capability under test: Change the colour of one object, nothing else changes. Adherence clauses, check each: 1) Ball is pink  2) Ball is the same size and in the same place  3) Seam still visible  4) No pink tint anywhere else  5) Rest of the picture identical'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  preservation:
    method: phash
    max_distance: 12
criteria:
- edit_fidelity
- preservation
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.333333
  preservation: 0.388889
  visual_quality: 0.166667
  realism_style: 0.111111
tags:
- gaming-pilot
- real-cricket-24
- real-based
- image-editing
