# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-50 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-heavy.png — provenance in each sidecar .json
# Fixed 2026-09-14: the sheet's preservation gate (global pHash vs source, max 14) was removed. It compares the
# whole four-panel output to a single-figure source, so no correct answer can pass — both arms of
# runs/2026-09-14_064045_image went invalid on it. The preservation criterion's 0.3 weight is redistributed
# proportionally. Geometry across panels is left to the judge via clause 2 of `expected`.
id: IMG-GAME-50
modality: image
task: image_edit
title: Palette-swap enemy family
inputs:
  source: assets/bank/IMG-GAME-base-heavy.png
params:
  size: auto
prompt: 'Using this reference, produce a four-panel enemy family sheet in one row: the same
  unit in four colourways — the original, a jungle variant in mossy green with brown webbing,
  a volcanic variant in charcoal with orange webbing, and an arctic variant in pale blue-white
  with ice-blue webbing. Only colour changes. Silhouette, pose, proportions and every piece
  of geometry stay identical across all four.'
expected: 'Palette-swap enemy family. Capability under test: Colour-only variation with a
  strict geometric preservation bound. Adherence clauses, check each: 1) Four panels with
  the four described colourways  2) Silhouette, pose and proportions identical in all four  3)
  No added or removed equipment in any variant  4) Same scale, lighting and background across
  the row'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.571429
  visual_quality: 0.214286
  realism_style: 0.214285
tags:
- variants-&-progression
- scenario-bank-game
- tier-high
