# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-UI-04 — prompt verbatim; synthetic source
# assets (generated by gemini flash, outside the comparison)
id: IMG-UI-04
modality: image
task: image_edit
title: HTML page to mockup
inputs:
  source: assets/bank/IMG-UI-04-source.png
params:
  size: auto
prompt: Recreate this web page as a single image. Preserve the layout, text content,
  element sizing and colour scheme exactly as shown.
expected: 'HTML page to mockup. Capability under test: Faithful reproduction of a
  supplied layout. Adherence clauses, check each: 1) Layout structure matches  2)
  All visible text reproduced correctly  3) Element proportions match  4) Colour scheme
  matches'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - Northwind Books
  - Bestsellers
  - Winter Reading List
  - Add to cart
criteria:
- edit_fidelity
- visual_quality
- realism_style
- text_accuracy
weights:
  edit_fidelity: 0.4
  visual_quality: 0.15
  realism_style: 0.05
  text_accuracy: 0.4
tags:
- ui-mockups-&-layout
- scenario-bank-edit
