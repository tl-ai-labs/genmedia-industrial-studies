# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-UI-01 — prompt verbatim; weights follow the
# sheet's family guidance for 'UI mockups & layout'
id: IMG-UI-01
modality: image
task: text_to_image
title: Login screen from spec
prompt: 'Design a mobile app login screen. Include: app name TIDEMARK at the top,
  an email field labelled Email, a password field labelled Password, a primary button
  reading Sign in, and a text link reading Forgot password. Light theme, 9:16.'
params:
  size: 1024x1536
  aspect_ratio: '9:16'
expected: 'Login screen from spec. Capability under test: Spec-to-layout translation.
  Adherence clauses, check each: 1) All five elements present  2) Label strings exact  3)
  Vertical order as listed  4) 9:16 ratio, light theme'
checks:
  min_width: 700
  min_height: 900
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - TIDEMARK
  - Email
  - Password
  - Sign in
  - Forgot password
criteria:
- prompt_adherence
- visual_quality
- composition
- realism_style
- text_accuracy
weights:
  prompt_adherence: 0.25
  visual_quality: 0.15
  composition: 0.25
  realism_style: 0.05
  text_accuracy: 0.3
tags:
- ui-mockups-&-layout
- scenario-bank
