id: IMG-BRAND-10
modality: image
task: image_edit
title: Clean cutout for compositing
inputs:
  source: assets/bank/IMG-BRAND-10-source.png
params:
  size: auto
prompt: Produce this product as a clean cutout on a transparent or pure white background
