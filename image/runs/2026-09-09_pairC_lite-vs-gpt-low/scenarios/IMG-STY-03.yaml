# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-STY-03 — prompt verbatim; synthetic source
# assets (generated by gemini flash, outside the comparison)
id: IMG-STY-03
modality: image
task: image_edit
title: Apply a supplied style reference
inputs:
  source: assets/bank/IMG-STY-03-source.png
  reference: assets/bank/IMG-STY-03-reference.png
params:
  size: auto
prompt: Apply the visual style of the first image to the content of the second. Keep
  the second image's subject and composition; take only colour palette, texture and
  brushwork from the first.
expected: 'Apply a supplied style reference. Capability under test: Style transfer
  from an exemplar. Adherence clauses, check each: 1) Content subject preserved  2)
  Palette matches the style reference  3) Texture/brushwork adopted  4) No content
  borrowed from the style image'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.45
  visual_quality: 0.25
  realism_style: 0.3
tags:
- style-transfer
- scenario-bank-edit
