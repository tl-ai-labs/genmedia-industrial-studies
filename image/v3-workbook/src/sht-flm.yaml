    60-second vertical micro-drama episode, landscape page, cream background, clean sans. Title:
    "हल्दी — एपिसोड 12". Six beat boxes in a row, each with a 9:16 thumbnail frame from this
    courtyard, the Hindi beat title, the time code and one English note. The beats exactly:

    1 · "हल्दी की रस्म" · 0:00–0:10
    2 · "माँ का पानी" · 0:10–0:18
    3 · "एक फ़ोन कॉल" · 0:18–0:30
    4 · "दादाजी चुप" · 0:30–0:42
    5 · "राज़ खुला" · 0:42–0:54
    6 · "दुल्हन की नज़र" · 0:54–1:00

    The six people in the thumbnails are the people in the photo. A bottom strip lists "CAST"
    with the six roles in English. No other text.
  exact_text:
    - "हल्दी — एपिसोड 12"
    - "हल्दी की रस्म"
    - "माँ का पानी"
    - "एक फ़ोन कॉल"
    - "दादाजी चुप"
    - "राज़ खुला"
    - "दुल्हन की नज़र"
  deliverable: "One landscape image, readable at full size."
  checks:
    - [text_accuracy, "Is the title exact in Devanagari?"]
    - [prompt_adherence, "Are there exactly six beat boxes?"]
    - [text_accuracy, "Is every Hindi beat title exact, including nuqtas?"]
    - [text_accuracy, "Are the time codes exact and contiguous, ending at 1:00?"]
    - [composition, "Is every thumbnail a 9:16 frame?"]
    - [reference_fidelity, "Are the people in the thumbnails the people in the photo?"]
    - [prompt_adherence, "Is the courtyard in the thumbnails the photo's courtyard?"]
    - [prompt_adherence, "Does beat 3's thumbnail show a phone call?"]
    - [prompt_adherence, "Is there a CAST strip at the bottom with six roles?"]
    - [text_accuracy, "Is every word readable?"]
    - [style, "Is the layout clean and consistent?"]
    - [prompt_adherence, "Are there no extra people in the thumbnails?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: "V3: beats 2 to 4 as consecutive vertical clips."

- id: SHT-FLM-03
  title: "Production-design bible for the 1970s drawing-room set"
  persona: "Production designer handing the art department a single page for the set's continuity."
  evidence: "Bibles with palette swatches are where colours drift from the imagery."
  levers: [exact-text, small-text, layout, count, locale, identity]
  inputs: [{source: SRC-SET-LIVING, role: source}]
  prompt: |
    From this photo of a dressed 1970s drawing-room set, design a production-design bible on one
    landscape page, white background, thin black rules, small grey sans labels. Title: "SET 04 —
    SHARMA DRAWING ROOM, 1974". Sections: "HERO VIEW" (the set as photographed); "PROP LIST", eight
    numbered callouts with leader lines touching the props in a second copy of the photo: 1 radio
    cabinet, 2 wedding photo, 3 teal vinyl sofa, 4 lace curtains, 5 rattan armchair, 6 brass floor
    lamp, 7 coffee table, 8 ceiling fan; "PALETTE", five swatches labelled "Wall green",
    "Sofa teal", "Rattan", "Brass", "Floor red", each matching its colour in the photo;
    "CONTINUITY FLAGS", listing exactly three anachronisms to remove: "Plastic bottle",
    "Modular switchboard", "LED bulb". No other text.
  exact_text:
    - "SET 04 — SHARMA DRAWING ROOM, 1974"
    - "PROP LIST"
    - "PALETTE"
    - "CONTINUITY FLAGS"
    - "Plastic bottle"
    - "Modular switchboard"
    - "LED bulb"
  deliverable: "One landscape image."
  checks:
    - [text_accuracy, "Is the title exact?"]
    - [prompt_adherence, "Are all four sections present with exact headings?"]
    - [prompt_adherence, "Are there exactly eight numbered prop callouts?"]
    - [prompt_adherence, "Does each leader line touch the right prop?"]
    - [prompt_adherence, "Are there five palette swatches with the given labels?"]
    - [prompt_adherence, "Does each swatch match its colour in the photo?"]
    - [text_accuracy, "Are the three continuity flags exact?"]
    - [reference_fidelity, "Is the hero view the set as photographed?"]
    - [text_accuracy, "Is every label readable?"]
    - [style, "Is the layout clean with thin rules and grey labels?"]
    - [prompt_adherence, "Is there no other text?"]
    - [visual_quality, "Are the photo copies sharp, not distorted?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""

