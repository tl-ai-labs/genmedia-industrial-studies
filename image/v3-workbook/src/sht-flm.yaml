# Production sheets — Film, OTT & micro-drama scenarios. Slots: sht.yaml.
code: SHT
scenarios:

- id: SHT-FLM-01
  seed: true
  sahil: beat-sheet
  title: "Time-coded beat sheet for a 45-second solo segment, 'The Last Transmission'"
  persona: "Director's assistant on an independent short, preparing the one-page beat sheet the editor and composer will both cut to."
  evidence: "Sahil's screen-share (screenshots 236–237): 'THE LAST TRANSMISSION — SEGMENT: DESCENT & FAREWELL', a solo character piece 0:00–0:45, nine beats each with a start and end frame, camera, sound and voice-over notes, plus key character, environment and props, on-screen text, music and sound plan and tech specs. Both tools produced it; the test is the density and accuracy."
  levers: [time-code, exact-text, small-text, count, identity, continuity, long-brief]
  inputs:
    - {source: SRC-RIDGE-WANDERER, role: source, note: "the lead character and the location"}
  prompt: |
    Using the man in this photo as the only character and this ridge and valley as the
    location, design a single landscape beat sheet for a film segment, on a warm off-white page
    with clean editorial typography. At the top, the title
    "THE LAST TRANSMISSION — SEGMENT: DESCENT & FAREWELL"
    and under it, smaller, "Solo character piece · 0:00–0:45 · 2.39:1 delivery".

    The main area is nine beat boxes in a three-by-three grid, in story order left to right, top
    to bottom. Each box has: an orange tag with the beat number and title, the time code at the
    top right, a START FRAME and an END FRAME side by side with an arrow between them (small
    photographic frames of the man in this location), and three short lines labelled CAMERA,
    SOUND and VO. The beats, with their exact titles and time codes:

    B1 RIDGE · ARRIVAL 0:00–0:06
    B2 RIDGE · STILLNESS 0:06–0:11
    B3 VALLEY · REVEAL 0:11–0:17
    B4 DESCENT · BEGIN 0:17–0:21
    B5 DESCENT · FOG 0:21–0:27
    B6 DETAIL · GRASS 0:27–0:30
    B7 VALLEY FLOOR · RUIN 0:30–0:36
    B8 GROUND · MEMORY 0:36–0:41
    B9 FINAL · STILLNESS 0:41–0:45

    The frames must show their beats: B1 he walks into frame on the ridge; B2 he stands still with
    the radio; B3 a wide of the fog-filled valley; B4 his first steps down the slope; B5 he is half
    lost in fog; B6 an extreme close-up of his hand brushing tall grass; B7 the stone ruin of a
    small radio hut on the valley floor; B8 he kneels and sets the radio on the ground; B9 he walks
    away into the fog, the radio left behind. Light moves from pale gold dawn in B1 to flat grey
    fog by B9.

    Only three beats have voice-over; write these lines exactly:
    in B2, VO: "They said no one would hear it."
    in B5, VO: "I kept talking anyway."
    in B9, VO: "Goodbye. Properly, this time."
    The other beats show VO: — .

    Along the bottom, a row of five panels: KEY CHARACTER (the man front, side and back), ENVIRONMENT
    & PROPS (ridge, valley, ruin, radio, satchel), ON-SCREEN TEXT (one overlay, "Day 41", in B1
    only), MUSIC & SOUND PLAN (a timeline 0:00 to 0:45 with wind, radio static and a single cello
    entering at 0:30) and TECH SPECS (2.39:1, 24 fps, 4K DCI, colour: muted, cool shadows). Every
    word must be readable at full size; no placeholder or invented text.
  exact_text:
    - "THE LAST TRANSMISSION — SEGMENT: DESCENT & FAREWELL"
    - "Solo character piece · 0:00–0:45 · 2.39:1 delivery"
    - "RIDGE · ARRIVAL"
    - "RIDGE · STILLNESS"
    - "VALLEY · REVEAL"
    - "DESCENT · BEGIN"
    - "DESCENT · FOG"
    - "DETAIL · GRASS"
    - "VALLEY FLOOR · RUIN"
    - "GROUND · MEMORY"
    - "FINAL · STILLNESS"
    - "They said no one would hear it."
    - "I kept talking anyway."
    - "Goodbye. Properly, this time."
    - "Day 41"
  deliverable: "One landscape image (at least 3:2), the full beat sheet, readable at full size."
  checks:
    - [text_accuracy, "Are the title and the subtitle spelled exactly as given?"]
    - [prompt_adherence, "Are there exactly nine beat boxes, in a three-by-three grid?"]
    - [text_accuracy, "Are all nine beat titles spelled exactly as given and in the right order?"]
    - [text_accuracy, "Is every time code exactly as given (0:00–0:06 through 0:41–0:45)?"]
    - [prompt_adherence, "Do the time codes run without gaps or overlaps and end at 0:45?"]
    - [prompt_adherence, "Does every beat box have both a start frame and an end frame with an arrow between them?"]
    - [text_accuracy, "Are the three voice-over lines exact and in beats B2, B5 and B9 only?"]
    - [reference_fidelity, "Is the man in every frame recognisably the man in the photo: grey beard, charcoal coat, rust scarf?"]
    - [set_consistency, "Does he carry the radio in every frame up to B8, and is it on the ground, left behind, in B9?"]
    - [prompt_adherence, "Does B3 show a wide of the fog-filled valley and B6 a close-up of a hand in grass?"]
    - [prompt_adherence, "Does B7 show a stone ruin of a small hut on the valley floor?"]
    - [prompt_adherence, "Does the light move from pale gold dawn in B1 to flat grey fog by B9?"]
    - [prompt_adherence, "Is there no second person anywhere on the sheet?"]
    - [prompt_adherence, "Are all five bottom panels present with the given headings?"]
    - [text_accuracy, "Does the on-screen text panel list only 'Day 41', for B1?"]
    - [prompt_adherence, "Does the music and sound timeline show the cello entering at 0:30?"]
    - [text_accuracy, "Do the tech specs read 2.39:1, 24 fps and 4K DCI?"]
    - [text_accuracy, "Is every word on the sheet readable, with no garbled or placeholder text?"]
    - [style, "Is the layout clean and editorial, with consistent type sizes for the same kind of label?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input; needs a high-resolution output setting so the small text can be judged."}
  video_followon: "V3: beats B4 to B6 as three consecutive clips using the start and end frames."

