# Product and brand — Advertising & agencies scenarios. Slots: prd.yaml.
code: PRD
scenarios:

- id: PRD-ADS-01
  seed: true
  title: "A payments-app campaign placed on a blank flyover hoarding: exact logo, colours and perspective"
  persona: "Media planner at an outdoor agency making the site mock-up the client approves before the flex is printed."
  evidence: "Ravi's walkthrough at 09:30: the box-and-logo scenario (IMG-BRAND-04, logo geometry on packaging) was in the high tier, with Lite invalid and Flash 7.2 against Pro 9.7. This adds a real site photo in perspective, hex colours and exact type."
  levers: [identity, multi-ref, physics, exact-text, keep-rest, layout, camera]
  inputs:
    - {source: SRC-ADS-BILLBOARD-SITE, role: source, note: "the site photo; everything except the panel stays"}
    - {source: SRC-ADS-LOGO, role: reference, note: "the logo, colours and wordmark"}
  prompt: |
    Put a finished advertisement on the blank white hoarding in this photo, as it would look once
    the printed flex is mounted, and change nothing else in the photo. The artwork fills the
    panel edge to edge with its four corners on the panel's four corners, following the panel's
    perspective exactly: the left edge nearer and taller, the right edge farther and shorter.

    The artwork: a flat deep indigo background, #2B2A8C. At the top left, the logo from the
    second image, exactly: the indigo circle (with a thin white outline so it reads on the indigo)
    holding the white myna head with the saffron #FF9F1C beak, and the lower-case wordmark
    "myna pay" in white to its right, with the same proportions as the reference. Across the left
    two-thirds, the headline "Pay in a blink." in a heavy white geometric sans, and under it in
    saffron, "UPI · Cards · Bills". On the right third, a large saffron circle with a white tick.

    It must look printed and mounted, not pasted on: the four lamp brackets keep casting their
    short shadows across the top edge of the artwork; the panel's even morning light falls on it
    with a slight falloff towards the far right; the frame and catwalk stay in front of it. The
    traffic, the bus, the autorickshaws, the trees and the sky stay exactly as they are.
  exact_text:
    - "myna pay"
    - "Pay in a blink."
    - "UPI · Cards · Bills"
  deliverable: "One image at the same size and framing as the site photo."
  checks:
    - [prompt_adherence, "Do the artwork's four corners sit on the panel's four corners?"]
    - [physics_plausibility, "Does the artwork follow the panel's perspective, left edge taller than the right?"]
    - [reference_fidelity, "Is the logo symbol the reference's: circle, white myna head facing right, saffron beak, eye-ring?"]
    - [reference_fidelity, "Does the symbol stay a true circle seen in perspective, not an egg or a squashed shape?"]
    - [reference_fidelity, "Does the wordmark read myna pay in lower case with the reference's proportions to the circle?"]
    - [prompt_adherence, "Is the background a flat deep indigo close to #2B2A8C, and the beak and subline saffron close to #FF9F1C?"]
    - [text_accuracy, "Is the headline exactly Pay in a blink. with the full stop?"]
    - [text_accuracy, "Is the subline exactly UPI · Cards · Bills?"]
    - [physics_plausibility, "Do the lamp-bracket shadows fall across the top edge of the artwork?"]
    - [physics_plausibility, "Does the frame and catwalk stay in front of the artwork?"]
    - [prompt_adherence, "Does the artwork's light match the panel, with a slight falloff to the far right?"]
    - [preservation, "Are the bus, the two autorickshaws and the cars unchanged?"]
    - [preservation, "Are the trees, the sky and the flyover unchanged?"]
    - [prompt_adherence, "Is there a saffron circle with a white tick on the right third?"]
    - [prompt_adherence, "Is there no other text or logo on the panel?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with two inputs."}
  video_followon: "V5: a slow push-in from the flyover towards the hoarding with the artwork locked to the panel."

- id: PRD-ADS-02
  title: "The perfume on a wet black rock by the sea at night with spray in the air; label unchanged"
  persona: "Fragrance brand's art director placing the packshot into a campaign scene."
  evidence: "Earlier bank IMG-BRAND-06 (label legibility through reflections) was medium tier; spray and wet stone add physics."
  levers: [identity, exact-text, physics, light-lock, keep-rest]
  inputs: [{source: SRC-ADS-PERFUME, role: source}]
  prompt: |
    Place this exact perfume bottle, Varsha No. 3, on a wet black volcanic rock by the sea at night,
    4:5. Waves break behind it and fine sea spray hangs in the air, catching a cold rim light from
    behind. A soft warm key from the front left lights the bottle and the label. The bottle keeps its
    exact shape, bevels, black cap, amber liquid and cream label reading "VARSHA", "No. 3" and "EAU DE
    PARFUM · 50 ml". Water droplets bead on the glass; the rock reflects the bottle faintly in its wet
    surface. No other text, no props.
  exact_text: ["VARSHA", "No. 3", "EAU DE PARFUM · 50 ml"]
  deliverable: "One image, 4:5."
  checks:
    - [reference_fidelity, "Is the bottle the same shape with the same bevels?"]
    - [text_accuracy, "Is the label text exact and readable?"]
    - [reference_fidelity, "Is the cap black and cylindrical?"]
    - [reference_fidelity, "Is the liquid pale amber?"]
    - [physics_plausibility, "Do droplets bead on the glass?"]
    - [physics_plausibility, "Does the wet rock reflect the bottle faintly?"]
    - [physics_plausibility, "Does spray hang in the air with a cold rim light?"]
    - [prompt_adherence, "Is there a warm key from the front left on the bottle?"]
    - [physics_plausibility, "Does the bottle sit on the rock with correct contact?"]
    - [prompt_adherence, "Are there no props or other text?"]
    - [visual_quality, "Is the glass free of artefacts?"]
    - [prompt_adherence, "Is it night?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: "V5: waves breaking behind the bottle in a 4-second spot."

- id: PRD-ADS-03
  title: "The scooter placed on a Bengaluru street at golden hour: matching shadow and puddle reflection"
  persona: "Agency retoucher compositing the launch scooter into a location for the press kit."
  evidence: "Integration (shadow, reflection, light) is where pasted products give themselves away."
  levers: [identity, physics, light-lock, locale, exact-text]
  inputs: [{source: SRC-ADS-SCOOTER, role: source}]
  prompt: |
    Place this exact scooter, the Hawa E1, parked on its side stand on a tree-lined Bengaluru street
    at golden hour, 16:9, in left side profile as photographed. The street: a cobbled kerb, a rain tree
    canopy, a café front with blurred warm lights behind, a shallow puddle on the road in front of the
    scooter. Low sun from behind the camera on the left throws the scooter's long shadow to the right
    on the road; the puddle reflects the scooter upside down; the matte teal body takes the warm light.
    The scooter's design and the small "HAWA" on its side panel are unchanged. No rider, no other text.
  exact_text: ["HAWA"]
  deliverable: "One image, 16:9."
  checks:
    - [reference_fidelity, "Is the scooter the same design: teal body, white apron, tan seat, five-spoke wheels?"]
    - [text_accuracy, "Is HAWA on the side panel unchanged?"]
    - [physics_plausibility, "Does it rest on its side stand, leaning correctly?"]
    - [physics_plausibility, "Does its shadow fall to the right on the road?"]
    - [physics_plausibility, "Does the puddle reflect it upside down?"]
    - [prompt_adherence, "Does the matte teal take the warm golden light?"]
    - [prompt_adherence, "Is the light direction consistent between scooter and street?"]
    - [prompt_adherence, "Is there a café front and a rain tree behind?"]
    - [prompt_adherence, "Is there no rider and no other text?"]
    - [visual_quality, "Is the scooter's geometry clean?"]
    - [physics_plausibility, "Is its scale right for the street?"]
    - [prompt_adherence, "Does it read as Bengaluru?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""

