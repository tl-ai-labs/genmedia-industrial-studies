# Family 9 — Spatial depth, light and physics (header). Scenarios: phy-*.yaml.

family: Depth, light and physics
code: PHY
number: 9
about: "Reflections, shadows, refraction, occlusion, contact and depth that a physics-literate viewer would catch."
outputs: "1"

rubric:
  weights: {physics_plausibility: 4, prompt_adherence: 3, preservation: 2, text_accuracy: 1, visual_quality: 1, style: 1, reference_fidelity: 1, composition: 1, set_consistency: 1}
  gate: [physics_plausibility]
  gate_rule: "No reflection, shadow, refraction or contact may contradict the scene."

targets:
  reflection: "A reflection is in the wrong place, not mirrored, or shows things that are not there"
  shadow-direction: "Shadows disagree with the light sources"
  occlusion: "Nearer things fail to hide farther things correctly"
  refraction: "Glass or water bends the view wrongly or not at all"
  contact: "Objects float, sink or intersect where they should touch"
  depth-scale: "Sizes do not shrink correctly with distance"
  light-mix: "Mixed light colours do not fall where their sources are"

