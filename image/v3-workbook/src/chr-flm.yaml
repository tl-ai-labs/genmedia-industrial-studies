# Character continuity — Film, OTT & micro-drama scenarios. Slots: chr.yaml.
code: CHR
scenarios:

- id: CHR-FLM-04
  seed: true
  title: "One joint family from three casting photos, held across four micro-drama frames"
  persona: "Producer of a Malayalam micro-drama series for a vertical-video app, making the episode's key frames from the three cast members' casting photos before the shoot is approved."
  evidence: "Call at 17:26: storyboarding 'multiple storyboards for one character' is the most common image use; earlier bank IMG-GAME-12 (squad line-up from three references) was in the high tier for blending features between references."
  levers: [set, identity, multi-ref, layout, locale, continuity, exclude]
  inputs:
    - {source: SRC-ACTOR-M, role: source, note: "the son, Arjun"}
    - {source: SRC-ACTOR-F, role: reference, note: "his wife, Meera"}
    - {source: SRC-ELDER-PORCH, role: reference, note: "his grandmother, Ammamma"}
  prompt: |
    These three photos are the cast of a family drama: the man is Arjun, the younger woman is
    Meera, his wife, and the elderly woman is Ammamma, his grandmother. Create one frame of
    their story, described below, as a still from the series. Each face must stay exactly the
    person in their own photo; do not mix their features, do not make them look related to each
    other beyond what the photos show, and do not lighten or smooth anyone's skin. Keep each
    person's marks: Arjun's moustache, the small scar through his right eyebrow and the steel
    kada on his right wrist; Meera's gold stud in her left nostril, the mole above the right
    corner of her lip and her black-bead mangalsutra; Ammamma's round wire spectacles, grey bun
    and off-white sari with the thin dark-green border. Heights stay true to life: Arjun is the
    tallest, Meera about a head shorter, Ammamma small and slightly stooped. Only these three
    people appear unless the frame says otherwise. Cinematic, natural colour, 9:16 vertical
    frame for a phone screen, no text.
  set_members:
    mode: separate
    must_stay_same:
      - "Arjun: face, moustache, scar through the right eyebrow, steel kada on the right wrist"
      - "Meera: face, gold stud in the left nostril, mole above the right corner of the lip, mangalsutra"
      - "Ammamma: face, round wire spectacles, grey bun, off-white sari with a dark-green border"
      - "Each person's skin tone as in their own photo"
      - "Height order: Arjun tallest, then Meera, then Ammamma"
    members:
      - name: "Breakfast"
        prompt: "Morning, a small dining table by a window. Ammamma sits at the head of the table in the middle of the frame, Arjun on her left side of the table, Meera on her right, all three laughing at something Ammamma said. Soft window daylight."
        checks:
          - [prompt_adherence, "Is Ammamma at the head of the table with Arjun and Meera on either side?"]
          - [prompt_adherence, "Are all three laughing?"]
          - [prompt_adherence, "Is the light soft daylight from a window?"]
      - name: "The argument"
        prompt: "Night, a narrow corridor lit by one ceiling bulb. Arjun and Meera stand facing each other in profile, arguing, Arjun on the left; Ammamma is a small figure in a doorway at the far end, watching."
        checks:
          - [prompt_adherence, "Are Arjun and Meera in profile facing each other, Arjun on the left?"]
          - [prompt_adherence, "Is Ammamma small in the background doorway?"]
          - [visual_quality, "Are both profiles anatomically right, with no warping?"]
      - name: "Temple steps"
        prompt: "Dusk, the stone steps of a small temple with oil lamps. Ammamma stands between them on a step holding Arjun's hand on her right and Meera's on her left; all three face the camera."
        checks:
          - [prompt_adherence, "Is Ammamma between them, holding Arjun's hand on her right and Meera's on her left?"]
          - [reference_fidelity, "Is Arjun's steel kada still on his right wrist, the hand Ammamma is not holding?"]
          - [prompt_adherence, "Is the main light warm from the oil lamps at dusk?"]
      - name: "Hospital waiting room"
        prompt: "Night, a hospital waiting area with blue plastic chairs under cold tube light. Meera sleeps with her head on Arjun's shoulder; Arjun is awake, staring ahead. Ammamma stands at a window behind them, back half-turned, looking out."
        checks:
          - [prompt_adherence, "Is Meera asleep on Arjun's shoulder with Ammamma standing at the window behind them?"]
          - [prompt_adherence, "Is the light cold tube light?"]
          - [reference_fidelity, "Is Ammamma recognisable from her half-turned side: spectacles, bun, border of the sari?"]
  deliverable: "Four images, 9:16 vertical, one per member."
  checks:
    - [set_consistency, "In every frame, is Arjun recognisably the man in the first photo?"]
    - [set_consistency, "In every frame, is Meera recognisably the woman in the second photo?"]
    - [set_consistency, "In every frame, is Ammamma recognisably the woman in the third photo?"]
    - [set_consistency, "Are the three faces clearly distinct from each other, with no feature borrowed between them?"]
    - [set_consistency, "Is Arjun's scar through the right eyebrow visible in every frame where that side of his face shows?"]
    - [set_consistency, "Is the steel kada on Arjun's right wrist in every frame where that wrist shows?"]
    - [set_consistency, "Is Meera's nose stud on the left nostril in every frame where that side shows?"]
    - [set_consistency, "Is Meera's mole above the right corner of the lip wherever her face is near enough to see it?"]
    - [set_consistency, "Does Ammamma wear her spectacles and the off-white sari with a dark-green border in every frame?"]
    - [set_consistency, "Does each person's skin tone stay as in their own photo across all four frames, without lightening?"]
    - [set_consistency, "Does the height order hold in every frame where they stand: Arjun, then Meera, then Ammamma?"]
    - [prompt_adherence, "Are there exactly three people in each frame, with no extra figures?"]
    - [composition, "Is every frame a true 9:16 vertical composition rather than a cropped landscape?"]
    - [text_accuracy, "Is there no text in any frame?"]
    - [visual_quality, "Are hands, especially the held hands in the temple frame, free of extra or fused fingers?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Each frame is one image edit with three inputs (adapters pass every input). The judge scores one image at a time; whole-set identity needs the set review."}
  video_followon: "V4: the breakfast frame as a first frame, three-second performance clip with all three identities held."

- id: CHR-FLM-01
  title: "The lead across four micro-drama frames: office, autorickshaw at night, rain, wedding stage"
  persona: "Producer of a Hindi micro-drama making an episode's key frames from the lead's casting photo."
  evidence: "Call at 17:26: 'generating multiple storyboards for one character and using that to create videos' is the most common image use."
  levers: [set, identity, locale, light-lock, continuity]
  inputs: [{source: SRC-ACTOR-M, role: source}]
  prompt: |
    This casting photo is the lead actor: medium-brown skin, short wavy black hair parted on his
    left, a thick moustache, light stubble, a small scar through his right eyebrow and a steel
    kada on his right wrist. Make one key frame of him for the episode, as described below, as a
    cinematic still. His face, scar, moustache, hair and kada stay exactly his; his skin is not
    lightened under any light. He is the only character in focus; anyone else in the frame is
    an anonymous background figure, soft and small. Match the natural grain and colour of a phone-
    first drama shot on a cinema camera. 9:16 vertical, no text.
  set_members:
    mode: separate
    must_stay_same:
      - "Face, hair parting, moustache, stubble"
      - "Scar through the right eyebrow; kada on the right wrist"
      - "Medium-brown skin tone under every light"
    members:
      - {name: "Office", prompt: "Morning, a crowded open-plan office, he is at a desk in a light blue shirt, typing, cool overhead light.", checks: [[reference_fidelity, "Is the scar on his right eyebrow?"], [reference_fidelity, "Is the kada on his right wrist at the keyboard?"]]}
      - {name: "Autorickshaw", prompt: "Night, in the back of an autorickshaw, his face lit by passing neon signs in magenta and green.", checks: [[prompt_adherence, "Is his face lit by coloured neon?"], [reference_fidelity, "Is his skin tone still medium brown under neon?"]]}
      - {name: "Rain", prompt: "Dusk, he stands soaked in rain at a bus stop, shirt clinging, looking at his phone.", checks: [[physics_plausibility, "Is he visibly wet?"], [reference_fidelity, "Is his hair still parted on his left?"]]}
      - {name: "Wedding stage", prompt: "Night, on a decorated wedding stage in a cream sherwani, garland in his hands, warm stage light.", checks: [[reference_fidelity, "Is the kada visible on his right wrist?"], [set_consistency, "Is he recognisably the same man?"]]}
  deliverable: "Four images, 9:16."
  checks:
    - [set_consistency, "Is he the man in the casting photo in all four frames?"]
    - [set_consistency, "Is the scar on the right eyebrow in every frame that shows it?"]
    - [set_consistency, "Is the kada on the right wrist in every frame that shows it?"]
    - [set_consistency, "Is the moustache the same in all four?"]
    - [set_consistency, "Is the hair parted on his left in all four?"]
    - [set_consistency, "Is his skin tone the same in all four, not lightened?"]
    - [prompt_adherence, "Does each frame have its described light: cool office, neon, dusk, warm stage?"]
    - [composition, "Is each frame a true 9:16 composition?"]
    - [prompt_adherence, "Is he the only clear face in each frame, with others background?"]
    - [text_accuracy, "Is there no readable text?"]
    - [visual_quality, "Are hands and face free of artefacts?"]
    - [prompt_adherence, "Does each frame show its described scene?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Four image edits from one reference; set agreement needs the set review."}
  video_followon: "V4: the autorickshaw frame as a 3-second performance clip."

- id: CHR-FLM-02
  title: "The actor at 20, 40 and 65 for a generational drama; mole and nose stud stay"
  persona: "Casting and prosthetics team on a generational drama checking an age-progression look."
  evidence: "Earlier bank IMG-GAME-13 (same operator fifteen years on) was medium tier; three ages with fixed marks is harder."
  levers: [set, identity, continuity, locale, exclude]
  inputs: [{source: SRC-ACTOR-F, role: source}]
  prompt: |
    This casting photo is the actor: dusky medium-dark skin, long black hair in a low braid, a gold
    stud in her left nostril, a small mole just above the right corner of her upper lip, a black-bead
    mangalsutra. Show her at the age described below, as a portrait from the waist up against a
    plain warm grey backdrop, soft daylight, in a plain cotton saree. She must be unmistakably the
    same woman: bone structure, eyes, the mole and the nose stud stay; age shows in skin, hair and
    posture only. Her skin tone stays dusky at every age. No text. 4:5.
  set_members:
    mode: separate
    must_stay_same:
      - "Bone structure and eyes"
      - "Mole above the right corner of the lip; gold stud on the left nostril"
      - "Dusky skin tone"
    members:
      - {name: "Age 20", prompt: "At twenty: fuller cheeks, smooth skin, hair long and loose, a light yellow saree.", checks: [[reference_fidelity, "Does she look about twenty?"], [reference_fidelity, "Is the mole above the right lip corner?"]]}
      - {name: "Age 40", prompt: "At forty: a few fine lines, a strand of grey, hair in a bun, a maroon saree.", checks: [[reference_fidelity, "Does she look about forty?"], [reference_fidelity, "Is the nose stud on the left?"]]}
      - {name: "Age 65", prompt: "At sixty-five: deep lines, mostly grey hair in a thin braid, slightly stooped, reading glasses, a white saree with a thin blue border.", checks: [[reference_fidelity, "Does she look about sixty-five?"], [set_consistency, "Is she still recognisably the same woman?"]]}
  deliverable: "Three images, 4:5."
  checks:
    - [set_consistency, "Is she recognisably the same woman at all three ages?"]
    - [set_consistency, "Is the mole above the right corner of the lip at all three ages?"]
    - [set_consistency, "Is the nose stud on the left nostril at all three ages?"]
    - [set_consistency, "Is the skin tone dusky at all three ages?"]
    - [prompt_adherence, "Do the three ages read as about 20, 40 and 65?"]
    - [prompt_adherence, "Does age show in skin, hair and posture, not a different face?"]
    - [set_consistency, "Are the backdrop and light the same in all three?"]
    - [set_consistency, "Is the bone structure the same?"]
    - [prompt_adherence, "Is she alone in each?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are faces free of artefacts?"]
    - [prompt_adherence, "Are the saree colours as described for each age?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Three image edits from one reference; set agreement needs the set review."}
  video_followon: ""

- id: CHR-FLM-03
  title: "The two children in four new scenes: classroom, river, festival, school bus"
  persona: "Director of a children's feature building key frames from the location still."
  evidence: "Child identity across scenes is fragile; two children together makes swaps visible."
  levers: [set, identity, layout, locale, continuity]
  inputs: [{source: SRC-KIDS-TREE, role: source}]
  prompt: |
    This still shows two ten-year-old Indian schoolchildren: a boy with short side-parted hair, a
    white shirt and navy shorts, and a girl with two plaits tied with red ribbons, a white shirt
    and a navy pinafore. Make one new frame of the same two children, in the scene described below,
    as a cinematic still. Both faces stay exactly theirs; their ages, builds and uniforms stay the
    same unless the scene says otherwise. The boy is always on the girl's right when they stand or
    sit side by side. 16:9, no text.
  set_members:
    mode: separate
    must_stay_same:
      - "Both children's faces, ages and builds"
      - "Girl's two plaits with red ribbons; boy's side-parted hair"
      - "The boy on the girl's right when side by side"
    members:
      - {name: "Classroom", prompt: "In a village classroom, sharing a wooden bench, writing on slates, morning light from the windows.", checks: [[prompt_adherence, "Is the boy on the girl's right on the bench?"], [reference_fidelity, "Are the red ribbons visible?"]]}
      - {name: "River", prompt: "Wading in a shallow river with their school shoes in their hands, uniforms rolled up, afternoon sun.", checks: [[set_consistency, "Are both faces the same children?"], [physics_plausibility, "Is the water at their shins?"]]}
      - {name: "Festival", prompt: "At a village fair at night in festival clothes (she in a green langa, he in a kurta), holding a paper windmill, lights behind.", checks: [[reference_fidelity, "Are the plaits and ribbons still there?"], [prompt_adherence, "Are they lit by festival lights?"]]}
      - {name: "School bus", prompt: "Looking out of a school bus window side by side, rain on the glass.", checks: [[prompt_adherence, "Is the boy on the girl's right?"], [physics_plausibility, "Are raindrops on the glass in front of them?"]]}
  deliverable: "Four images, 16:9."
  checks:
    - [set_consistency, "Is the boy the same boy in all four?"]
    - [set_consistency, "Is the girl the same girl in all four?"]
    - [set_consistency, "Do they stay about ten years old in all four?"]
    - [set_consistency, "Are the girl's plaits and ribbons in all four?"]
    - [set_consistency, "Is the boy on the girl's right whenever they are side by side?"]
    - [set_consistency, "Are uniforms the same where they wear them?"]
    - [prompt_adherence, "Are the two of them the clear subjects, with any others in the background?"]
    - [prompt_adherence, "Does each frame have its described light?"]
    - [prompt_adherence, "Does each frame show its scene?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are faces and hands clean?"]
    - [style, "Is the cinematic look the same as the still?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Four image edits from one base; set agreement needs the set review."}
  video_followon: "V4: the bus frame as a short clip with the rain running."

- id: CHR-FLM-05
  title: "The actor in the 1940s costume across four scenes, getting muddier in a fixed order"
  persona: "Costume continuity supervisor on a Telugu period film."
  evidence: "Progressive costume damage is a continuity sheet staple; it must accumulate, not reset."
  levers: [set, multi-ref, identity, continuity, multi-step, locale]
  inputs:
    - {source: SRC-ACTOR-F, role: source, note: "the actor"}
    - {source: SRC-COSTUME-REF, role: reference, note: "the costume"}
  prompt: |
    The first photo is the actor; the second is her costume: an indigo handloom sari with a mustard
    checked border, a maroon elbow-sleeve blouse and silver anklets. Make one frame of her wearing
    this costume in the scene below, cinematic, monsoon light. The costume's damage builds up in
    order and never resets: frame 1 clean; frame 2 mud splashed to the knees; frame 3 mud to the
    knees plus a torn left sleeve; frame 4 all of that plus the sari soaked dark. Her face, nose
    stud on the left, mole and braid stay hers. 16:9, no text.
  set_members:
    mode: separate
    must_stay_same:
      - "Her face, nose stud on the left, mole above the right lip corner, braid"
      - "Indigo sari with mustard checked border, maroon blouse, silver anklets"
      - "Damage accumulates in order: clean, mud, torn left sleeve, soaked"
    members:
      - {name: "1 Clean", prompt: "A village temple courtyard, she lights a lamp, costume clean.", checks: [[reference_fidelity, "Is the costume clean?"], [reference_fidelity, "Is the border mustard check?"]]}
      - {name: "2 Mud", prompt: "A paddy field bund, she runs, mud splashed to her knees.", checks: [[prompt_adherence, "Is mud to the knees?"], [reference_fidelity, "Are the sleeves intact?"]]}
      - {name: "3 Torn sleeve", prompt: "A forest path, she pushes through branches; the left sleeve is torn at the elbow.", checks: [[reference_fidelity, "Is the tear on the left sleeve?"], [reference_fidelity, "Is the mud from frame 2 still there?"]]}
      - {name: "4 Soaked", prompt: "Heavy rain on a riverbank, she stands soaked, the sari darker and clinging.", checks: [[physics_plausibility, "Is the sari soaked and darker?"], [reference_fidelity, "Are the mud and the torn left sleeve still there?"]]}
  deliverable: "Four images, 16:9."
  checks:
    - [set_consistency, "Is she the same woman in all four?"]
    - [set_consistency, "Is it the same costume in all four?"]
    - [set_consistency, "Does the damage build up in order without resetting?"]
    - [set_consistency, "Is the tear on the left sleeve in frames 3 and 4 only?"]
    - [set_consistency, "Are the silver anklets on both feet in every frame showing her feet?"]
    - [set_consistency, "Is the nose stud on the left in every frame?"]
    - [set_consistency, "Is her skin tone the same in all four?"]
    - [prompt_adherence, "Is the light monsoon-soft in all four?"]
    - [prompt_adherence, "Does each frame show its scene?"]
    - [prompt_adherence, "Is she the only person?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are hands and feet natural?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Four image edits with two inputs each; set agreement needs the set review."}
  video_followon: ""

