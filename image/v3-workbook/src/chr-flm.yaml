      - {name: "Smug", prompt: "Leaning on the parapet, one eyebrow up, smirking.", checks: [[prompt_adherence, "Is she smirking with one eyebrow up?"], [reference_fidelity, "Is the streak still on her right?"]]}
      - {name: "Surprise", prompt: "Frozen mid-step, eyes wide, mouth open.", checks: [[prompt_adherence, "Are her eyes wide and mouth open?"], [set_consistency, "Is the hoodie the same grey?"]]}
