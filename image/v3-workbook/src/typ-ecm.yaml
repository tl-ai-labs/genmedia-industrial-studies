- id: TYP-ECM-06
  title: "A supermarket shelf with six price tags, each with exact product, price and unit price"
  persona: "Retail chain's category manager mocking up shelf-edge labels."
  evidence: "Small text in a real scene, repeated with different values, is a strong exactness test."
  levers: [exact-text, small-text, count, layout, locale]
  prompt: |
    A photo of a supermarket shelf in an Indian store, straight on, 3:2, cool fluorescent light.
    One shelf of packaged rice and dal in plain unbranded bags, with six white shelf-edge price tags
    clipped below them, left to right, each with three lines exactly:
    "Basmati Rice 1 kg | ₹149 | ₹14.90/100 g"; "Sona Masoori 5 kg | ₹389 | ₹7.78/100 g";
    "Toor Dal 1 kg | ₹172 | ₹17.20/100 g"; "Moong Dal 500 g | ₹98 | ₹19.60/100 g";
    "Chana Dal 1 kg | ₹110 | ₹11.00/100 g"; "Masoor Dal 500 g | ₹76 | ₹15.20/100 g".
    The price is the largest line on each tag. The bags carry no readable text.
  exact_text:
    - "Basmati Rice 1 kg"
    - "₹149"
    - "Toor Dal 1 kg"
    - "₹17.20/100 g"
    - "Masoor Dal 500 g"
    - "₹15.20/100 g"
  deliverable: "One image, 3:2."
  checks:
    - [prompt_adherence, "Are there exactly six price tags?"]
    - [text_accuracy, "Is every product name exact and in order?"]
    - [text_accuracy, "Is every price exact?"]
    - [text_accuracy, "Is every unit price exact?"]
    - [prompt_adherence, "Is the price the largest line on each tag?"]
    - [prompt_adherence, "Is each tag below a matching product?"]
    - [text_accuracy, "Are the tags readable?"]
    - [prompt_adherence, "Is the light cool fluorescent?"]
    - [prompt_adherence, "Do the bags carry no readable text?"]
    - [prompt_adherence, "Is the shelf straight on?"]
    - [visual_quality, "Are the tags clean rectangles?"]
    - [prompt_adherence, "Does it read as an Indian supermarket?"]
  competitor: "Recraft"
  runnable_today: {status: "yes", note: "One text-to-image call."}
  video_followon: ""

- id: TYP-ECM-07
  title: "Localise the bottle listing infographic into Hindi; callouts and badge keep their places"
  persona: "Marketplace seller localising listing images for Hindi-speaking shoppers."
  evidence: "Localisation with leader lines and badges held is a standard e-commerce edit."
  levers: [exact-text, script, keep-rest, layout, locale]
  inputs: [{source: SRC-ECM-INFOGRAPHIC, role: source}]
  prompt: |
    Localise this water-bottle listing infographic into Hindi. Replace every line of English with the
    Hindi below, in the same position, size and navy colour, in a clean rounded Devanagari sans:
    "One bottle. All day." becomes "एक बोतल। पूरा दिन।"; "Cold for 24 hours" becomes "24 घंटे ठंडा";
    "Hot for 12 hours" becomes "12 घंटे गरम"; "100% leak-proof" becomes "100% लीक-प्रूफ़";
    "BPA-free steel" becomes "BPA-मुक्त स्टील"; "1 litre" becomes "1 लीटर". The bottle, the mint
    background, the icons and the leader lines stay exactly where they are.
  exact_text:
    - "एक बोतल। पूरा दिन।"
    - "24 घंटे ठंडा"
    - "12 घंटे गरम"
    - "100% लीक-प्रूफ़"
    - "BPA-मुक्त स्टील"
    - "1 लीटर"
  deliverable: "One image, 1:1."
  checks:
    - [text_accuracy, "Is the Hindi headline exact with both dandas?"]
    - [text_accuracy, "Are the four callouts exact?"]
    - [text_accuracy, "Is the badge exactly 1 लीटर?"]
    - [prompt_adherence, "Is each Hindi line where its English line was?"]
    - [preservation, "Do the leader lines still touch the bottle at the same points?"]
    - [preservation, "Are the icons unchanged?"]
    - [preservation, "Is the bottle and background unchanged?"]
    - [style, "Is the Hindi in a clean rounded sans, navy?"]
    - [text_accuracy, "Is no English left except BPA?"]
    - [visual_quality, "Are there no smudges where English was?"]
    - [prompt_adherence, "Are sizes similar to the original?"]
    - [text_accuracy, "Is every word readable?"]
  competitor: "Recraft"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""

- id: TYP-ECM-08
  title: "Change the can's flavour to Mango in the same hand-lettered script, following the curve"
  persona: "D2C beverage brand's designer making a new flavour's visual from the existing photo."
  evidence: "Font matching on a curved surface with condensation is a hard in-place text edit."
  levers: [exact-text, keep-rest, physics, identity, multi-step]
  inputs: [{source: SRC-ECM-SODA-CAN, role: source}]
  prompt: |
    This photo shows a cobalt-blue soda can with "Ananas" in big hand-lettered yellow script running
    diagonally upward, "PINEAPPLE FIZZ" in small white capitals and a white line-drawn pineapple.
    Make it the mango flavour: replace "Ananas" with "Mango" in the same hand-lettered script, same
    yellow, same diagonal angle and size; replace "PINEAPPLE FIZZ" with "MANGO FIZZ" in the same small
    white capitals; replace the pineapple drawing with a white line drawing of a mango in the same
    style and place. The new lettering wraps round the can's curve and sits under the condensation
    droplets. Everything else is unchanged.
  exact_text:
    - "Mango"
    - "MANGO FIZZ"
  deliverable: "One image at the same size."
  checks:
    - [text_accuracy, "Does the script read Mango?"]
    - [text_accuracy, "Does the small line read MANGO FIZZ?"]
    - [style, "Is Mango in the same hand-lettered script and yellow?"]
    - [prompt_adherence, "Does Mango run diagonally upward at the same angle?"]
    - [physics_plausibility, "Does the lettering wrap the can's curve?"]
    - [physics_plausibility, "Do condensation droplets sit over the new lettering?"]
    - [prompt_adherence, "Is the pineapple replaced by a mango line drawing?"]
    - [preservation, "Is 330 ml unchanged?"]
    - [preservation, "Is the can, background and light unchanged?"]
    - [visual_quality, "Are there no ghost letters from Ananas?"]
    - [text_accuracy, "Is there no other new text?"]
    - [reference_fidelity, "Is the can still cobalt blue?"]
  competitor: "Recraft"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""
