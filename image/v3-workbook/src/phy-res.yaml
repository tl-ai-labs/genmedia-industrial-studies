code: PHY
scenarios:

- id: PHY-RES-01
  seed: true
  title: "Low sun through a twelve-pane window: the grid falls across the floor and climbs an armchair"
  persona: "Interior visualiser at an architecture studio checking whether generated renders can replace ray-traced stills for client presentations."
  evidence: "Call at 17:26: 'spatial depth is off on certain kinds of images'. Sunlight through a gridded window is the standard test of a renderer: the pane count, the stretch of the projected grid and the way it bends over furniture are all checkable."
  levers: [physics, light-lock, count, layout, camera, long-brief]
  prompt: |
    A photoreal interior: a quiet reading room with white walls and a pale oak floor, late
    afternoon. On the left wall, a tall window divided by thin black mullions into twelve panes,
    three across and four high. Low sun, about 20 degrees above the horizon, shines through it
    from the left, so the window's grid is projected across the floor as twelve bright stretched
    parallelograms, longer than the panes are tall, running to the right. The projection reaches
    a white armchair standing in the middle of the room: the grid's lines break where they meet
    the chair, bend over its seat and climb up its front and back, then continue onto the right
    wall behind it. A clear glass vase of water on the windowsill throws a small bright caustic on
    the sill. Fine dust floats in the beams. The chair's legs cast thin shadows pointing right,
    away from the window. Camera at 1.2 metres from the room's back corner looking towards the
    window wall at an angle, 28 mm, verticals straight. No people, no other furniture, no text.
  deliverable: "One image, 3:2."
  checks:
    - [prompt_adherence, "Does the window have exactly twelve panes, three across and four high?"]
    - [prompt_adherence, "Does the projected grid on the floor show twelve light patches matching the panes?"]
    - [physics_plausibility, "Are the projected patches stretched longer than the panes, consistent with a low sun?"]
    - [physics_plausibility, "Do the light patches run to the right, away from the window?"]
    - [physics_plausibility, "Do the grid lines break and bend where they meet the armchair?"]
    - [physics_plausibility, "Does the grid climb the chair's front and continue onto the wall behind?"]
    - [physics_plausibility, "Do the chair legs' shadows point right, away from the window?"]
    - [physics_plausibility, "Is there a small bright caustic from the vase on the sill?"]
    - [prompt_adherence, "Are the dust beams aligned with the sun's direction through the window?"]
    - [prompt_adherence, "Is the light warm late-afternoon light?"]
    - [prompt_adherence, "Is the view from the back corner towards the window wall, with straight verticals?"]
    - [prompt_adherence, "Is the armchair in the middle of the room with no other furniture?"]
    - [prompt_adherence, "Are there no people and no text?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One text-to-image call."}
  video_followon: "V7: the same room over ten seconds as the sun lowers; the grid stretches and climbs the chair."

