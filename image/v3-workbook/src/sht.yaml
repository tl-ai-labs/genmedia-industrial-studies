# Family 3 — Production sheets: bibles, beat sheets, pitch boards (header). Scenarios: sht-*.yaml.

family: Production sheets
code: SHT
number: 3
about: "One dense sheet a production team works from: a bible built from one photo, a time-coded beat sheet, a pitch or breakdown board. Text-led."
outputs: "1 sheet"
text_family: true

rubric:
  weights: {text_accuracy: 4, prompt_adherence: 3, reference_fidelity: 2, set_consistency: 2, style: 1, visual_quality: 1, physics_plausibility: 1, composition: 1}
  gate: [text_accuracy]
  gate_rule: "A production sheet is read, so every word on it must be exact."

targets:
  section-missing: "A section the brief asks for is missing or empty"
  timecode: "Time codes are wrong, overlap or do not add up to the stated length"
  text-garble: "Dense text is garbled, misspelled or unreadable"
  product-drift: "The product or costume in the sheet does not match the input"
  frame-pair: "Start and end frames do not show the beat they are labelled with"
  palette: "Colour swatches do not match the imagery or the given values"

