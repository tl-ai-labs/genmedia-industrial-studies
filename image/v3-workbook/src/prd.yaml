# Family 7 — Product and brand fidelity (header). Scenarios: prd-*.yaml.

family: Product and brand
code: PRD
number: 7
about: "A real product or brand kept exact while it is placed into scenes, angles and packaging."
outputs: "1"

rubric:
  weights: {reference_fidelity: 4, text_accuracy: 3, prompt_adherence: 3, physics_plausibility: 2, preservation: 2, visual_quality: 1, style: 1, composition: 1}
  gate: [reference_fidelity, text_accuracy]
  gate_rule: "The product, its logo and its label text must be exactly the real ones."

targets:
  label-drift: "Label text or artwork on the product changes"
  shape-drift: "The product's shape or proportions change"
  colour-drift: "Brand or product colours shift from the given values"
  scale-wrong: "The product is the wrong size for the scene"
  logo-geometry: "The logo is distorted, re-drawn or wrongly placed"
  integration: "Light, shadow or reflections do not match the scene"

