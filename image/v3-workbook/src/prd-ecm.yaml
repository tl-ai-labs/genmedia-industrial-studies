# Product and brand — E-commerce, D2C & retail scenarios. Slots: prd.yaml.
code: PRD
scenarios:

- id: PRD-ECM-03
  seed: true
  title: "Four colourways of a leather tote in one line-up, each to an exact hex"
  persona: "Merchandiser at a D2C leather brand who needs colourway images for pre-orders before the new leathers come back from the tannery."
  evidence: "Earlier bank IMG-BRAND-09 (colourway variant) was one colour change and scored 9.5 on Lite; IMG-GAME-50 (palette-swap family) was in the high tier. This needs four colours at once with the leather grain, stitching rule and lock held, and one stitching exception."
  levers: [identity, count, layout, keep-rest, exclude, long-brief]
  inputs:
    - {source: SRC-ECM-HANDBAG, role: source, note: "the tan tote, the only photo"}
  prompt: |
    From this one photo of our tan tote, make a single wide product line-up of four copies of the
    same bag side by side on the same seamless off-white background, all in the same straight front
    view, the same size, evenly spaced along one baseline, lit the same way as the photo. Left to
    right, the body leather is:

    1. Tan, #B5763A, exactly as photographed
    2. Oxblood, #5C1A1B
    3. Forest green, #2F4B3A
    4. Ivory, #EDE4D3

    On each bag the handles are a darker shade of that bag's body colour. The pebbled grain, the
    shape, the flap, the brass turn-lock, the slight twist in one handle and the blind-embossed
    "KOSU" below the lock are identical on all four. The stitching is cream on the first three
    bags; on the ivory bag only, the stitching is tan #B5763A so it stays visible. Each bag has
    its own soft contact shadow. Remove the dust specks on all four. No labels, no swatches, no
    text, no props.
  exact_text: []
  deliverable: "One landscape image, about 3:1, four bags in a row."
  checks:
    - [prompt_adherence, "Are there exactly four bags in a row on one baseline?"]
    - [prompt_adherence, "Are the colours, left to right, tan, oxblood, forest green and ivory?"]
    - [prompt_adherence, "Is each body colour visibly close to its hex value?"]
    - [reference_fidelity, "Is the first bag the same tan as the photo?"]
    - [reference_fidelity, "Are all four the same shape, size and front view as the photo?"]
    - [reference_fidelity, "Is the pebbled grain visible on all four bags?"]
    - [reference_fidelity, "Is the brass turn-lock still brass on all four?"]
    - [reference_fidelity, "Is the blind-embossed KOSU below the lock on all four?"]
    - [reference_fidelity, "Does each bag keep the slight twist in the same handle?"]
    - [prompt_adherence, "Are the handles a darker shade of each bag's own body colour?"]
    - [prompt_adherence, "Is the stitching cream on the first three bags and tan on the ivory bag?"]
    - [preservation, "Are the dust specks gone from all four?"]
    - [prompt_adherence, "Are the four bags lit the same way, each with its own soft contact shadow?"]
    - [prompt_adherence, "Is there no text, swatch, label or prop?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: "V5: a 4-second turntable of the oxblood bag with grain and lock held."

