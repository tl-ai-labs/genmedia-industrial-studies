# Character continuity — Gaming scenarios. Slots: chr.yaml.
code: CHR
scenarios:

- id: CHR-GAM-01
  seed: true
  title: "The heroine in four skins: silhouette identical, materials changed"
  persona: "Live-ops art lead at a mobile game producing the skin-shop previews for a season; any change of silhouette breaks the in-game models."
  evidence: "Earlier bank IMG-GAME-50 (palette-swap enemy family, geometry identical across panels) was in the high tier. Skins are the main revenue art in mobile games; the test is that only materials change while face, proportions and side-specific details stay."
  levers: [set, identity, continuity, keep-rest, layout, long-brief]
  inputs:
    - {source: SRC-GAM-HERO, role: source, note: "the default look"}
  prompt: |
    This is the game heroine Ira in her default look. Make one skin-shop preview of her in the skin
    described below. Use exactly the same pose, the same camera angle and the same framing as the
    render, on a plain dark grey lobby background with a soft teal floor glow, so the skins can be
    compared side by side. Only the materials and colours of the outfit change. Her face, dark
    brown skin, build and proportions, the high ponytail with three rings, the nose ring on her
    left nostril, the outline of every armour piece, the sash-cape on her right shoulder only, the
    rune on the back of her left glove and the curved sword with the veena-head guard in her right
    hand all stay exactly as in the render. Stylised 3D, 2:3, no text.
  set_members:
    mode: separate
    must_stay_same:
      - "Pose, camera angle and framing"
      - "Face, skin tone, build and proportions"
      - "Ponytail with three rings; nose ring on the left"
      - "Outline of every armour piece (the silhouette)"
      - "Cape on the right shoulder only; rune on the left glove; sword in the right hand with the veena-head guard"
    members:
      - name: "Default"
        prompt: "The default skin exactly as in the render: charcoal bodysuit, copper plates, red cape, teal rune."
        checks:
          - [set_consistency, "Are the materials the same as the render: charcoal, copper, red, teal?"]
          - [prompt_adherence, "Is she on the dark grey lobby background with a teal floor glow?"]
      - name: "Monsoon festival"
        prompt: "Bodysuit deep indigo with small silver raindrop motifs; shoulder and shin plates silver instead of copper; the cape marigold yellow; the rune stays teal."
        checks:
          - [prompt_adherence, "Is the bodysuit indigo with silver raindrop motifs?"]
          - [prompt_adherence, "Are the plates silver and the cape marigold yellow?"]
          - [reference_fidelity, "Is the rune still teal?"]
      - name: "Battle-damaged"
        prompt: "The default materials, worn: scratches across the plates, a torn lower edge on the cape, a crack across the left shin plate, dust on the suit, the rune glowing dimmer."
        checks:
          - [prompt_adherence, "Is there a crack on the left shin plate specifically?"]
          - [prompt_adherence, "Is the cape's lower edge torn while it stays on the right shoulder?"]
          - [prompt_adherence, "Is the rune visibly dimmer than in the default?"]
      - name: "Gold legendary"
        prompt: "Plates in polished gold engraved with paisley; the bodysuit black with thin gold piping; the cape crimson with a gold border; the rune glowing gold; a thin gold inlay along the sword's blade."
        checks:
          - [prompt_adherence, "Are the plates gold with paisley engraving?"]
          - [prompt_adherence, "Is the rune gold and the blade inlaid with gold?"]
          - [reference_fidelity, "Is the sword guard still the veena head?"]
  deliverable: "Four images, 2:3, one per member."
  checks:
    - [set_consistency, "Is the pose identical in all four previews?"]
    - [set_consistency, "Are the camera angle and framing identical in all four?"]
    - [set_consistency, "Does the silhouette (outline of every armour piece) match across all four?"]
    - [set_consistency, "Is her face the same as the render in all four?"]
    - [set_consistency, "Is her dark brown skin tone the same in all four, never lightened?"]
    - [set_consistency, "Is the ponytail with three rings present in all four?"]
    - [set_consistency, "Is the nose ring on the left nostril in all four?"]
    - [set_consistency, "Is the cape on the right shoulder only in all four?"]
    - [set_consistency, "Is the rune on the back of the left glove in all four?"]
    - [set_consistency, "Is the sword in her right hand in all four, with the same blade shape?"]
    - [prompt_adherence, "Is every preview on the same dark grey lobby background?"]
    - [style, "Are all four in the same stylised 3D finish as the render?"]
    - [text_accuracy, "Is there no text in any preview?"]
    - [visual_quality, "Are her hands and the sword grip natural in all four?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Each skin runs as its own image edit from the same render. Whole-set comparison needs the set review."}
  video_followon: "V4: the gold legendary skin as a 4-second idle-animation clip, silhouette held."

- id: CHR-GAM-02
  title: "The five-member squad across three story frames; no character borrows another's features"
  persona: "Narrative artist illustrating the squad's story beats for the game's comic tie-in."
  evidence: "Earlier bank IMG-GAME-12 (squad line-up from three references, zero blending) was high tier."
  levers: [set, identity, count, layout, locale]
  inputs: [{source: SRC-GAM-SQUAD, role: source}]
  prompt: |
    This key art shows a five-character squad on a fort rampart: a tall bearded man with a shield
    and a blue turban; a short young woman with goggles and a drone on her shoulder; a heavy older
    man with a grey moustache and a rocket launcher; a lean woman archer with a white braid and a
    green scarf; a teenage boy with a skateboard and red headphones. Make one story frame of the
    squad as described below, in the same cel-shaded style. Each character keeps their own face,
    build, outfit and prop; no features or props move between them. 16:9, no text.
  set_members:
    mode: separate
    must_stay_same:
      - "Five distinct designs as in the key art"
      - "Each prop with its owner: shield, drone, rocket launcher, bow, skateboard"
      - "Cel-shaded style"
    members:
      - {name: "Campfire", prompt: "Night, the five around a campfire in the desert, the boy telling a story.", checks: [[prompt_adherence, "Are there five characters?"], [prompt_adherence, "Are they lit by the fire?"]]}
      - {name: "Market chase", prompt: "Day, running through a crowded bazaar, the archer leading.", checks: [[prompt_adherence, "Is the archer in front?"], [reference_fidelity, "Is the drone with the goggled woman?"]]}
      - {name: "Wounded", prompt: "Dusk, the heavy man wounded and propped on the shield-bearer's shoulder, the others guarding.", checks: [[reference_fidelity, "Is the heavy man the one wounded?"], [reference_fidelity, "Is the shield with the bearded man?"]]}
  deliverable: "Three images, 16:9."
  checks:
    - [prompt_adherence, "Are there five characters in each frame?"]
    - [set_consistency, "Are the five designs the same in all three?"]
    - [set_consistency, "Is each prop with its owner in all three?"]
    - [set_consistency, "Are the five faces distinct with no blending?"]
    - [set_consistency, "Is the archer's braid white and scarf green in all three?"]
    - [set_consistency, "Are the boy's headphones red in all three?"]
    - [prompt_adherence, "Does each frame have its described light?"]
    - [prompt_adherence, "Does each frame show its beat?"]
    - [style, "Is the cel-shaded style consistent?"]
    - [prompt_adherence, "Are there no extra squad members?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are hands clean?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Three image edits from one base; set agreement needs the set review."}
  video_followon: ""

- id: CHR-GAM-03
  title: "Six named expressions of the villain in the sketch style; mask stays on the left"
  persona: "Concept artist exploring the villain's acting range before the 3D model."
  evidence: "Earlier bank IMG-GAME-09 (expression sheet) was medium tier; a half-mask on one side adds an asymmetry test."
  levers: [set, identity, count, exact-text, continuity]
  inputs: [{source: SRC-GAM-VILLAIN, role: source}]
  prompt: |
    This pencil and grey-marker sketch shows the villain Kaal: a gaunt face, long white hair, a
    cracked bronze half-mask over the left side of his face, a vertical glowing third-eye slit on his
    forehead and a high coat collar. Draw a sheet of six head-and-shoulders studies of him in the
    same pencil and marker style, two rows of three, each labelled below exactly: "Contempt",
    "Rage", "Amusement", "Grief", "Cunning", "Fear". The mask covers the left side of his face in
    every study; only the visible right side and the eye slit carry the expression. No other text.
  exact_text: ["Contempt", "Rage", "Amusement", "Grief", "Cunning", "Fear"]
  set_members:
    mode: one-sheet
    must_stay_same:
      - "Half-mask on the left side of the face"
      - "Third-eye slit on the forehead; long white hair; high collar"
      - "Pencil and grey-marker style"
    members:
      - {name: "Contempt", prompt: "Lip curled on the visible side, eyes narrowed.", checks: [[prompt_adherence, "Does it read as contempt?"], [reference_fidelity, "Is the mask on the left?"]]}
      - {name: "Rage", prompt: "Mouth open, teeth bared, eye slit flaring.", checks: [[prompt_adherence, "Does it read as rage?"], [reference_fidelity, "Is the slit glowing brighter?"]]}
      - {name: "Amusement", prompt: "A thin smile, head tilted.", checks: [[prompt_adherence, "Does it read as amused?"], [set_consistency, "Is the hair the same?"]]}
      - {name: "Grief", prompt: "Brow pulled up, eye wet.", checks: [[prompt_adherence, "Does it read as grief?"], [reference_fidelity, "Is the mask on the left?"]]}
      - {name: "Cunning", prompt: "Sidelong glance, half smile.", checks: [[prompt_adherence, "Does it read as cunning?"], [reference_fidelity, "Is the collar high?"]]}
      - {name: "Fear", prompt: "Eyes wide, head pulled back.", checks: [[prompt_adherence, "Does it read as fear?"], [reference_fidelity, "Is the mask on the left?"]]}
  deliverable: "One image: six studies on one sheet."
  checks:
    - [prompt_adherence, "Are there six studies?"]
    - [text_accuracy, "Are the six labels exact?"]
    - [set_consistency, "Is the mask on the left side of the face in all six?"]
    - [set_consistency, "Is the third-eye slit on the forehead in all six?"]
    - [set_consistency, "Is the face the same character in all six?"]
    - [prompt_adherence, "Is each expression clearly the one labelled?"]
    - [style, "Is the pencil and marker style consistent and matching the sketch?"]
    - [prompt_adherence, "Are they in two rows of three?"]
    - [text_accuracy, "Is there no other text?"]
    - [visual_quality, "Are lines clean?"]
    - [set_consistency, "Is the hair long and white in all six?"]
    - [prompt_adherence, "Is there one character only?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit producing the sheet."}
  video_followon: ""

- id: CHR-GAM-04
  title: "The hover-bike in four race levels; decal, dent and stripe carried, damage accumulating"
  persona: "Vehicle artist showing the bike's wear across a race campaign."
  evidence: "Progressive damage must accumulate and side-specific details must hold."
  levers: [set, identity, continuity, multi-step, exact-text]
  inputs: [{source: SRC-GAM-MECH, role: source}]
  prompt: |
    This render shows a graphite hover-bike with an orange stripe from nose to tail, cyan-glowing
    pods, a curved windscreen, an orange seat, a white "07" decal on the rear fairing and a dent on
    the right front fairing. Make one in-race frame of the same bike as described below, stylised 3D,
    16:9, no rider's face visible. Damage builds up in order and never resets: level 1 as built;
    level 2 adds scorch marks along the left flank; level 3 adds a cracked windscreen; level 4 adds a
    missing left rear panel showing the frame. The 07 decal and the original dent stay throughout.
  exact_text: ["07"]
  set_members:
    mode: separate
    must_stay_same:
      - "Body shape, stripe, pods, seat"
      - "07 decal on the rear fairing; dent on the right front"
      - "Damage accumulates in order"
    members:
      - {name: "Level 1 — desert", prompt: "Racing over a desert canyon at noon, seen from the right.", checks: [[reference_fidelity, "Is the dent on the near right front?"], [prompt_adherence, "Is there no other damage?"]]}
      - {name: "Level 2 — city", prompt: "Through a neon city at night, seen from the left.", checks: [[prompt_adherence, "Are scorch marks on the left flank?"], [text_accuracy, "Is 07 on the rear fairing?"]]}
      - {name: "Level 3 — ice", prompt: "On a frozen lake at dawn, front three-quarter.", checks: [[prompt_adherence, "Is the windscreen cracked?"], [prompt_adherence, "Are the scorch marks still there?"]]}
      - {name: "Level 4 — volcano", prompt: "Beside lava flows at dusk, seen from the left rear.", checks: [[prompt_adherence, "Is the left rear panel missing?"], [prompt_adherence, "Are the crack and scorch still there?"]]}
  deliverable: "Four images, 16:9."
  checks:
    - [set_consistency, "Is it the same bike in all four?"]
    - [set_consistency, "Is the 07 decal on the rear in every frame that shows it?"]
    - [set_consistency, "Is the dent on the right front throughout?"]
    - [set_consistency, "Does damage build up in order without resetting?"]
    - [set_consistency, "Is the stripe orange in all four?"]
    - [prompt_adherence, "Does each level have its described light?"]
    - [prompt_adherence, "Does each frame show its level?"]
    - [style, "Is the stylised 3D consistent?"]
    - [text_accuracy, "Is 07 the only text?"]
    - [visual_quality, "Are hard edges clean?"]
    - [physics_plausibility, "Does it hover above the surface in all four?"]
    - [prompt_adherence, "Is there one bike?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Four image edits from one reference; set agreement needs the set review."}
  video_followon: ""

- id: CHR-GAM-05
  title: "The war-tiger in four frames: charging, resting, wounded, winter armour"
  persona: "Art director on a mythology game illustrating the mount's arc."
  evidence: "An animal's scars and markings drift between painted frames."
  levers: [set, identity, continuity, locale, light-lock]
  inputs: [{source: SRC-GAM-MOUNT, role: source}]
  prompt: |
    This painted illustration shows a war-tiger mount: a huge Bengal tiger with a torn left ear, a
    white scar across its right eye, a stripe pattern forming a clear "V" on its forehead, a
    turquoise and brass saddle with a red tasselled cloth and a small saddle bag on its left flank.
    Paint one frame of the same tiger as described below, in the same painterly style. The torn
    ear, the scar and the V stay on their sides in every frame. 16:9, no text, no rider's face.
  set_members:
    mode: separate
    must_stay_same:
      - "Torn left ear; scar across the right eye; V stripe on the forehead"
      - "Turquoise and brass saddle with red tassels (except in winter armour)"
      - "Painterly style"
    members:
      - {name: "Charging", prompt: "Charging head-on through a battlefield at golden hour.", checks: [[reference_fidelity, "Is the torn ear on frame right (its left)?"], [reference_fidelity, "Is the V visible on the forehead?"]]}
      - {name: "Resting", prompt: "Lying by a river at noon, seen from its left, the saddle bag visible.", checks: [[reference_fidelity, "Is the saddle bag on this left flank?"], [reference_fidelity, "Is the torn ear on this near side?"]]}
      - {name: "Wounded", prompt: "Lying wounded in the rain at night, a bandage on its right foreleg.", checks: [[set_consistency, "Is the scar across the right eye?"], [prompt_adherence, "Is the bandage on the right foreleg?"]]}
      - {name: "Winter armour", prompt: "In snow, wearing silver plate armour over the saddle, dawn.", checks: [[reference_fidelity, "Are the scar and V still visible on the face?"], [prompt_adherence, "Is it cold dawn light on snow?"]]}
  deliverable: "Four images, 16:9."
  checks:
    - [set_consistency, "Is it the same tiger in all four?"]
    - [set_consistency, "Is the torn ear on its left in all four?"]
    - [set_consistency, "Is the scar across its right eye in all four?"]
    - [set_consistency, "Is the V on the forehead in all four?"]
    - [set_consistency, "Is the saddle the same where worn?"]
