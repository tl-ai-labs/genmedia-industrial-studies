- id: CHR-GAM-09
  title: "A legendary sword in four states: in stone, in hand, broken, reforged"
  persona: "Item artist designing a quest weapon's progression."
  evidence: "Object identity (a glyph pattern) across states is the prop version of identity drift."
  levers: [set, identity, continuity, long-brief, physics]
  prompt: |
    A legendary sword for a fantasy game, stylised 3D, product-style render on a dark background,
