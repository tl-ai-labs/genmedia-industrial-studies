- id: CHR-GAM-06
  title: "The sage at 25, 50 and 80 for a flashback quest"
  persona: "Narrative artist painting the sage's past for a quest's flashbacks."
  evidence: "Age progression with fixed marks; earlier bank IMG-GAME-13 (fifteen years on) was medium tier."
  levers: [set, identity, continuity, locale, exclude]
  inputs: [{source: SRC-GAM-SAGE, role: source}]
  prompt: |
    This painted portrait shows an elderly sage of about eighty: deep brown skin, a long white beard
    tied with one wooden bead, a shaved head with three ash lines on the forehead, one cloudy left
    eye, a rudraksha mala and a saffron shawl. Paint him at the age described below, chest up,
    three-quarter view facing right, same warm ochre background, same painterly style. His bone
    structure and the cloudy left eye stay at every age (the eye was clouded in youth). Age shows in
    skin, hair and beard only. No text.
  set_members:
    mode: separate
    must_stay_same:
      - "Bone structure; cloudy left eye"
      - "Deep brown skin; three ash lines"
      - "Three-quarter view facing right; ochre background; painterly style"
    members:
      - {name: "Age 25", prompt: "At twenty-five: a warrior with a short black beard, long black hair tied up, a bronze armlet, no mala.", checks: [[prompt_adherence, "Does he look about twenty-five?"], [reference_fidelity, "Is the left eye cloudy?"]]}
      - {name: "Age 50", prompt: "At fifty: a grey-streaked beard, head newly shaved, the mala, a plain cotton shawl.", checks: [[prompt_adherence, "Does he look about fifty?"], [reference_fidelity, "Are the three ash lines present?"]]}
      - {name: "Age 80", prompt: "At eighty: as in the portrait.", checks: [[reference_fidelity, "Does it match the portrait?"], [reference_fidelity, "Is the bead on the beard?"]]}
  deliverable: "Three images, 4:5."
  checks:
    - [set_consistency, "Is he recognisably the same man at all three ages?"]
    - [set_consistency, "Is the left eye cloudy at all three ages?"]
    - [set_consistency, "Is his skin deep brown at all three ages?"]
    - [prompt_adherence, "Do the ages read as about 25, 50 and 80?"]
    - [set_consistency, "Are the ash lines present at 50 and 80?"]
    - [set_consistency, "Is the pose and background the same?"]
    - [style, "Is the painterly style consistent?"]
    - [set_consistency, "Is the bone structure the same?"]
    - [prompt_adherence, "Is he alone?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Is the face free of artefacts?"]
    - [prompt_adherence, "Are the costume changes as described?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Three image edits from one reference; set agreement needs the set review."}
  video_followon: ""

- id: CHR-GAM-07
  title: "A described dark-skinned heroine across four lighting set-ups; skin tone holds"
  persona: "Lighting artist testing whether the heroine's skin reads true in every game lighting."
  evidence: "Skin tone shifts lighter under bright keys and greyer under coloured light; dark skin shows it most."
  levers: [set, identity, light-lock, long-brief, physics]
  prompt: |
    An original game heroine rendered in a stylised 3D look, head and shoulders, three-quarter view.
    She is about twenty-five with very dark brown skin with warm undertones, short natural coiled hair
    with a single silver clip on the right, a small scar on her chin, and gold hoop earrings; she
    wears a high-collared olive flight jacket. Render her under the lighting described below. Her skin
    tone stays the same very dark brown with warm undertones in every set-up: brighter or tinted by
    the light, but never lightened, greyed or ashy. 1:1, plain dark background.
  set_members:
    mode: separate
    must_stay_same:
      - "Very dark brown skin with warm undertones"
      - "Coiled hair with a silver clip on the right; chin scar; gold hoops"
      - "Olive flight jacket; three-quarter view"
    members:
      - {name: "Noon sun", prompt: "Hard white sunlight from above.", checks: [[set_consistency, "Is her skin still very dark brown, not washed out?"], [prompt_adherence, "Are there hard top-light shadows?"]]}
      - {name: "Cyan neon", prompt: "A cyan neon key from the left, dark elsewhere.", checks: [[prompt_adherence, "Is she tinted cyan on the lit side?"], [set_consistency, "Is the unlit side still warm dark brown, not grey?"]]}
      - {name: "Firelight", prompt: "Warm firelight from below right.", checks: [[prompt_adherence, "Is the light warm from below?"], [set_consistency, "Is her tone deep and warm?"]]}
      - {name: "Overcast", prompt: "Soft overcast daylight.", checks: [[set_consistency, "Is her tone the same as the reference description?"], [set_consistency, "Is the silver clip on the right?"]]}
  deliverable: "Four images, 1:1."
  checks:
    - [set_consistency, "Is she the same character in all four?"]
    - [set_consistency, "Is her underlying skin tone the same in all four?"]
    - [set_consistency, "Is her skin never lightened or ashy?"]
    - [prompt_adherence, "Does each image show its lighting clearly?"]
    - [set_consistency, "Is the silver clip on the right in all four?"]
    - [set_consistency, "Is the chin scar in all four?"]
    - [set_consistency, "Are the gold hoops in all four?"]
    - [style, "Is the stylised 3D look consistent?"]
    - [prompt_adherence, "Is the view three-quarter in all four?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Is the face free of artefacts?"]
    - [set_consistency, "Is the jacket olive in all four?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Four text-to-image calls; set agreement needs the set review."}
  video_followon: ""

