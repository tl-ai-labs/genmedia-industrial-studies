# Precision editing — E-commerce, D2C & retail scenarios. Slots: edt.yaml.
code: EDT
scenarios:

- id: EDT-ECM-02
  seed: true
  title: "Five catalogue fixes on an on-model kurta photo without regenerating the model"
  persona: "Retoucher at an ethnic-wear marketplace turning one studio photo into the green colour variant and a square listing image."
  evidence: "Earlier banks IMG-BRAND-09 (single colourway) and IMG-LE-08 (expression change only) were in the low tier as single edits. Five stacked edits on a person are where tools start re-drawing the face and body; the failure target is exactly that over-edit."
  levers: [multi-step, keep-rest, identity, layout, locale, exclude]
  inputs:
    - {source: SRC-ECM-KURTA-MODEL, role: source, note: "the delivered studio photo"}
  prompt: |
    Make exactly these five changes to this catalogue photo and nothing else.
    1. Recolour the kurta from mustard to bottle green, #2E6B4F. The white floral block print and
       the five white buttons stay white and exactly where they are; the fabric's folds and
       shading stay the same.
    2. Remove the small safety pin at the kurta's right hem, leaving clean fabric.
    3. Re-drape the white dupatta so it hangs straight and evenly down the front of her left
       shoulder instead of crookedly.
    4. Change the canvas from 4:5 to square 1:1 by extending the warm beige paper backdrop equally
       on both sides, with the same texture and the same light falloff from the window on the left.
    5. Replace her silver jhumka earrings with small plain gold studs.
    Do not change her face, expression, hair, skin tone, body shape, pose, hands or the white
    palazzo pants. No smoothing, slimming or brightening of her skin. Her position in the frame
    stays centred.
  exact_text: []
  deliverable: "One square 1:1 image."
  checks:
    - [prompt_adherence, "Is the kurta bottle green, close to #2E6B4F?"]
    - [preservation, "Is the white floral print unchanged in pattern and still white?"]
    - [preservation, "Are the five white buttons still there and still white?"]
    - [prompt_adherence, "Is the safety pin gone with clean fabric where it was?"]
    - [prompt_adherence, "Does the dupatta now hang straight and evenly down the front of her left shoulder?"]
    - [prompt_adherence, "Is the image square, with the backdrop extended equally on both sides?"]
    - [prompt_adherence, "Does the extended backdrop match in texture and light falloff from the left?"]
    - [prompt_adherence, "Are the jhumkas replaced by small plain gold studs?"]
    - [reference_fidelity, "Is her face unchanged: same features, same expression?"]
    - [reference_fidelity, "Is her skin tone unchanged, with no smoothing or brightening?"]
    - [preservation, "Are her hair, pose, hands and body shape unchanged?"]
    - [preservation, "Are the white palazzo pants unchanged?"]
    - [preservation, "Is she still centred in the new square frame?"]
    - [visual_quality, "Is there no seam, smear or repeated texture where the backdrop was extended?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input; the output size must be set to square."}
  video_followon: "V6: the same recolour on a 5-second clip of the model turning, print held through the motion."

- id: EDT-ECM-01
  title: "Packshot clean-up: dust off, handle untwisted, background to a hex, new contact shadow"
  persona: "E-commerce retoucher preparing a packshot for the marketplace's white-background rule."
  evidence: "Packshot clean-up is the commonest e-commerce edit; over-smoothing the leather is the usual spill."
  levers: [multi-step, keep-rest, identity, physics]
  inputs: [{source: SRC-ECM-HANDBAG, role: source}]
  prompt: |
    Make exactly these four changes to this tote packshot, and nothing else.
    1. Remove the dust specks from the front flap.
    2. Untwist the twisted handle so both handles hang in the same clean arc.
    3. Change the off-white background to pure white, #FFFFFF, edge to edge.
    4. Replace the existing shadow with a soft, short contact shadow directly under the base.
    The leather's pebbled grain, its tan colour, the cream stitching, the brass turn-lock and the
    blind-embossed "KOSU" stay exactly as they are; the leather is not smoothed or brightened.
  exact_text: ["KOSU"]
  deliverable: "One image at the same size."
  checks:
    - [prompt_adherence, "Are the dust specks gone?"]
    - [prompt_adherence, "Are both handles in the same clean arc?"]
    - [prompt_adherence, "Is the background pure white edge to edge?"]
    - [physics_plausibility, "Is there a soft contact shadow directly under the base?"]
    - [preservation, "Is the pebbled grain unchanged and not smoothed?"]
    - [preservation, "Is the leather the same tan?"]
    - [preservation, "Is the stitching cream and unchanged?"]
    - [preservation, "Is the brass lock unchanged?"]
    - [text_accuracy, "Is KOSU still embossed below the lock?"]
    - [visual_quality, "Is the bag's edge clean against the white?"]
    - [preservation, "Is the bag's shape unchanged?"]
    - [prompt_adherence, "Are all four changes made?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""

