# Storyboards — Film, OTT & micro-drama scenarios. Slots: stb.yaml.
code: STB
scenarios:

- id: STB-FLM-01
  seed: true
  sahil: storyboard
  title: "Nine-panel pencil storyboard of an astronaut entering an alien forest, from one base frame"
  persona: "Storyboard artist on a science-fiction short, turning the production designer's one key frame into the shooting board the director will hand to the DP."
  evidence: "Sahil's screen-share (screenshots 234–235): a base image of an astronaut in a dark forest and a 3×3 pencil storyboard with captions such as 'Visor reflection • ECU • Static'. Sahil: the competitor's board 'has more detailing'; customers make videos from boards like these."
  levers: [count, exact-text, camera, continuity, identity, layout, long-brief]
  inputs:
    - {source: SRC-ASTRO-FOREST, role: source, note: "the key frame; sets the suit, the device, the forest and the light"}
  prompt: |
    Using this key frame as the world and the character, draw the shooting storyboard for the
    scene as one image: nine panels in a three-by-three grid, read left to right, top to
    bottom. Black-and-white pencil on white paper, with clean 2.39:1 frame lines inside each
    panel, consistent line weight and tonal shading throughout, like a professional film
    storyboard. Under each panel is a caption bar with exactly the text given, nothing more:

    1 · Astronaut enters the forest · WS · Static
    2 · Gloved hands tap the wrist device · CU · Push in
    3 · POV: glowing trunks ahead · MS · Handheld
    4 · Trees reflected in the visor · ECU · Static
    5 · Palm on the bark, light spreads · MS · Pan right
    6 · Device screen: pulse rising · Insert · Static
    7 · Looks up, spores falling · MCU · Tilt up
    8 · Whole forest pulses at once · EWS · Crane up
    9 · Silhouette in a beam of light · WS · Static

    Each drawing must match its own caption's shot size: WS shows the whole figure small in the
    forest, CU and Insert fill the panel with the hands or the screen, ECU shows only the visor,
    EWS makes the figure tiny. Panels with a camera move carry a drawn arrow showing it: a
    push-in arrow toward the centre, a pan arrow to the right, a tilt arrow upward, a crane arrow
    rising. Keep the astronaut exactly as in the key frame: the bulky white suit, the orange band
    on the upper left arm, the device on the left forearm, the boxy back pack, the visor. The
    astronaut moves left to right through panels 1 to 5. The forest is the one in the key frame:
    tall straight trunks with glowing veins, low glowing moss, floating spores, one shaft of light
    from the upper right. No colour, no extra characters, no title, no page numbers.
  exact_text:
    - "1 · Astronaut enters the forest · WS · Static"
    - "2 · Gloved hands tap the wrist device · CU · Push in"
    - "3 · POV: glowing trunks ahead · MS · Handheld"
    - "4 · Trees reflected in the visor · ECU · Static"
    - "5 · Palm on the bark, light spreads · MS · Pan right"
    - "6 · Device screen: pulse rising · Insert · Static"
    - "7 · Looks up, spores falling · MCU · Tilt up"
    - "8 · Whole forest pulses at once · EWS · Crane up"
    - "9 · Silhouette in a beam of light · WS · Static"
  deliverable: "One image, landscape, nine panels in a 3×3 grid with a caption bar under each."
  checks:
    - [prompt_adherence, "Are there exactly nine panels in a three-by-three grid?"]
    - [text_accuracy, "Does every caption match its given text exactly, with no misspelling, missing or extra word?"]
    - [text_accuracy, "Are the captions in the right order, 1 to 9, left to right and top to bottom?"]
    - [prompt_adherence, "Does panel 1 show the whole astronaut small in the forest, as a wide shot?"]
    - [prompt_adherence, "Does panel 2 fill the frame with gloved hands on the wrist device?"]
    - [prompt_adherence, "Is panel 3 a point of view with no astronaut visible, looking at glowing trunks?"]
    - [prompt_adherence, "Does panel 4 show only the visor, with trees reflected in it?"]
    - [prompt_adherence, "Does panel 6 fill the frame with the device screen showing a rising pulse line?"]
    - [prompt_adherence, "Does panel 8 make the figure tiny in a very wide view of the forest?"]
    - [prompt_adherence, "Do panels 2, 5, 7 and 8 carry arrows matching push in, pan right, tilt up and crane up?"]
    - [set_consistency, "Is the orange band (drawn as a band) on the upper left arm wherever that arm is visible?"]
    - [set_consistency, "Is the device on the left forearm in every panel where the forearms are visible?"]
    - [set_consistency, "Does the astronaut move left to right across panels 1 to 5?"]
    - [reference_fidelity, "Does the suit match the key frame: bulky, boxy back pack, visor?"]
    - [prompt_adherence, "Does the forest match the key frame: straight trunks with veins, moss, spores, light from upper right?"]
    - [style, "Are all nine panels in the same black-and-white pencil style and line weight?"]
    - [style, "Is there no colour anywhere in the image?"]
    - [composition, "Do the panels use 2.39:1 frame lines inside each box?"]
    - [prompt_adherence, "Is there exactly one astronaut and no other character in any panel?"]
    - [visual_quality, "Are the gloved hands drawn with the right number of fingers?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: "V2: panels 1, 4 and 8 as storyboard panel to shot, keeping shot size and camera move."

- id: STB-FLM-02
  title: "Six-panel board: the girl leaves, the boy follows with the bag"
  persona: "Storyboard artist on a Kannada coming-of-age feature boarding the tree scene from the location still."
  evidence: "Sahil's storyboard example (234–235) built a board from one base image; props carried between characters are a classic continuity break."
  levers: [count, exact-text, continuity, identity, locale, camera]
  inputs: [{source: SRC-KIDS-TREE, role: source}]
  prompt: |
    Using this still of two children under a banyan tree, draw a six-panel storyboard in a
    two-by-three grid, read left to right, top row first, in soft pencil with light grey wash,
    16:9 frame lines, a caption under each panel with exactly this text:

    1 · Both on the root, silent · WS · Static
    2 · She stands, brushes her skirt · MS · Static
    3 · She walks off frame right · WS · Pan right
    4 · He looks at the bag · CU · Push in
    5 · He picks up her bag · MS · Static
    6 · He follows her past the fence · WS · Static

    The girl has two plaits with ribbons and a pinafore; the boy has short side-parted hair and
    shorts. The brown school bag sits beside the girl until panel 5, when the boy picks it up;
    from then on he carries it. The girl always exits towards frame right and the boy follows the
    same way. The banyan, its roots and the fence match the still. No other text.
  exact_text:
    - "1 · Both on the root, silent · WS · Static"
    - "2 · She stands, brushes her skirt · MS · Static"
    - "3 · She walks off frame right · WS · Pan right"
    - "4 · He looks at the bag · CU · Push in"
    - "5 · He picks up her bag · MS · Static"
    - "6 · He follows her past the fence · WS · Static"
  deliverable: "One landscape image, six panels in a 2×3 grid with captions."
  checks:
    - [prompt_adherence, "Are there exactly six panels in a two-by-three grid?"]
    - [text_accuracy, "Is every caption exact?"]
    - [set_consistency, "Is the bag beside the girl in panels 1 to 4?"]
    - [set_consistency, "Is the bag in the boy's hands in panels 5 and 6?"]
    - [set_consistency, "Does the girl exit towards frame right and the boy follow the same way?"]
    - [reference_fidelity, "Is the girl drawn with two plaits and a pinafore in every panel?"]
    - [prompt_adherence, "Is panel 4 a close-up on the bag with a push-in arrow?"]
    - [prompt_adherence, "Does panel 3 carry a pan-right arrow?"]
    - [prompt_adherence, "Do the banyan and the fence match the still?"]
    - [style, "Is the pencil and grey wash style consistent?"]
    - [prompt_adherence, "Are there only the two children?"]
    - [visual_quality, "Are the children's hands and feet drawn cleanly?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: "V2: panels 3 and 5 as panel-to-shot clips."

- id: STB-FLM-03
  title: "Eight-panel rain chase from the chai stall; screen direction held"
  persona: "Action storyboard artist on a Mumbai thriller boarding a foot chase that starts at the chai stall."
  evidence: "The 180-degree rule is the first thing editors check in a chase; boards that flip direction cost a reshoot."
  levers: [count, exact-text, continuity, camera, locale, long-brief]
  inputs: [{source: SRC-CHAI-STALL, role: source}]
  prompt: |
    Using this still of a rainy chai stall at night, draw an eight-panel chase storyboard in a
    two-by-four grid, read left to right, top row first, in black ink with grey marker, 2.39:1 frame
    lines, caption under each panel exactly:

    1 · The rider drops his glass · MS · Static
    2 · The hoodie man bolts left to right · WS · Pan right
    3 · The rider gives chase · WS · Pan right
    4 · Feet splash through puddles · Insert · Tracking
    5 · Hoodie man vaults a handcart · MS · Static
    6 · Rider slips, catches a pole · MS · Handheld
    7 · Hoodie man turns into an alley · WS · Static
    8 · Rider stops, rain on his face · CU · Push in

    The hoodie man (grey hoodie) always runs from frame left to frame right; the rider (red rain
    jacket) always follows the same way. Rain in every panel. The stall in panel 1 matches the
    still: tube light, board, kettle. No other text.
  exact_text:
    - "1 · The rider drops his glass · MS · Static"
    - "2 · The hoodie man bolts left to right · WS · Pan right"
    - "3 · The rider gives chase · WS · Pan right"
    - "4 · Feet splash through puddles · Insert · Tracking"
    - "5 · Hoodie man vaults a handcart · MS · Static"
    - "6 · Rider slips, catches a pole · MS · Handheld"
    - "7 · Hoodie man turns into an alley · WS · Static"
    - "8 · Rider stops, rain on his face · CU · Push in"
  deliverable: "One landscape image, eight panels with captions."
  checks:
    - [prompt_adherence, "Are there exactly eight panels in a two-by-four grid?"]
    - [text_accuracy, "Is every caption exact?"]
    - [set_consistency, "Does the hoodie man always move left to right?"]
    - [set_consistency, "Does the rider always follow in the same direction?"]
    - [reference_fidelity, "Is the hoodie man in a hoodie and the rider in a rain jacket throughout?"]
    - [physics_plausibility, "Is rain drawn in every panel?"]
    - [prompt_adherence, "Is panel 4 an insert of feet in puddles?"]
    - [prompt_adherence, "Is panel 8 a close-up with a push-in arrow?"]
    - [prompt_adherence, "Does panel 1 match the stall in the still?"]
    - [style, "Is the ink and marker style consistent?"]
    - [composition, "Are the frame lines 2.39:1?"]
    - [visual_quality, "Are figures in motion drawn with readable poses?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""

