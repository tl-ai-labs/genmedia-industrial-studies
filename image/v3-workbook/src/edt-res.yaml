    - [prompt_adherence, "Is the floor wide-plank oak running towards the window?"]
    - [prompt_adherence, "Are the three sun panels in the same places on the new floor?"]
    - [preservation, "Is the window frame and view unchanged?"]
    - [preservation, "Is the wardrobe unchanged?"]
    - [preservation, "Is the switchboard unchanged?"]
    - [physics_plausibility, "Does the oak follow the room's perspective?"]
    - [visual_quality, "Are wall edges clean?"]
    - [preservation, "Is the room still empty?"]
    - [preservation, "Is the golden light unchanged?"]
    - [prompt_adherence, "Are both changes made?"]
