- id: EDT-RES-03
  title: "Day to twilight: sky to dusk, interior lights on, porch light on; the architecture unchanged"
  persona: "Real-estate photographer making the standard twilight version of a villa photo."
  evidence: "Day-to-dusk conversions often redraw the building; that over-edit is the target."
  levers: [multi-step, keep-rest, light-lock, physics, locale]
  inputs: [{source: SRC-RES-VILLA-EXT, role: source}]
  prompt: |
    Turn this daytime villa photo into a twilight photo with exactly these changes, and nothing else.
    1. The clear blue sky becomes a deep blue dusk sky with a warm orange glow low on the left.
    2. Every window glows with warm interior light; the glass door on the right shows a lit interior.
    3. A warm porch light comes on under the overhang, lighting the swing.
    4. A soft garden light uplights the frangipani.
    The building's shape, materials (teak, white, concrete), windows, overhang, gate, granite wall and
    straight verticals are unchanged, line for line.
  deliverable: "One image at the same size."
  checks:
    - [prompt_adherence, "Is the sky deep blue dusk with an orange glow on the left?"]
    - [prompt_adherence, "Are all windows glowing warm?"]
    - [prompt_adherence, "Is the porch light on, lighting the swing?"]
    - [prompt_adherence, "Is the frangipani uplit?"]
    - [preservation, "Is the building's shape unchanged?"]
    - [preservation, "Are materials unchanged?"]
    - [preservation, "Are windows in the same places?"]
    - [preservation, "Are the gate and wall unchanged?"]
    - [visual_quality, "Are verticals still straight?"]
    - [physics_plausibility, "Do lit windows cast light onto the lawn plausibly?"]
    - [visual_quality, "Is there no redrawn or warped edge?"]
    - [prompt_adherence, "Are all four changes made?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""

- id: EDT-RES-04
  title: "Plot preparation: boundary wall, gate at the track, path to the trees, the smaller cashew removed"
  persona: "Land developer's planner showing an investor the prepared plot."
  evidence: "Landscape edits stack; one is usually missed and landmarks drift."
  levers: [multi-step, keep-rest, layout, physics, locale]
  inputs: [{source: SRC-RES-PLOT-LAND, role: source}]
  prompt: |
    Make exactly these four changes to this photo of an empty Goa plot, and nothing else.
    1. Build a low laterite boundary wall, about a metre high, along the bottom edge of the plot from
       the survey marker to the right edge of the frame.
    2. Put a simple black iron gate in the wall where the access track meets it, at the centre.
    3. Lay a gravel path from the gate up to the larger cashew tree.
    4. Remove the smaller cashew tree on the right, leaving dry grass.
    The survey marker, the larger cashew, the dry stream bed, the electricity pole, the palms, the sea
    and the low sun from the right are unchanged.
  deliverable: "One image at the same size."
  checks:
    - [prompt_adherence, "Is there a low laterite wall along the bottom edge?"]
    - [prompt_adherence, "Is there a black iron gate at the centre where the track meets?"]
    - [prompt_adherence, "Is there a gravel path from the gate to the larger cashew?"]
    - [prompt_adherence, "Is the smaller cashew gone?"]
    - [prompt_adherence, "Is there one cashew tree now?"]
    - [preservation, "Is the survey marker unchanged?"]
    - [preservation, "Is the stream bed unchanged?"]
    - [preservation, "Is the pole unchanged?"]
    - [prompt_adherence, "Do the new wall and gate cast shadows to the left?"]
    - [physics_plausibility, "Does the wall follow the ground's slope?"]
    - [visual_quality, "Is there no seam where the tree was?"]
    - [prompt_adherence, "Are all four changes made?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""
