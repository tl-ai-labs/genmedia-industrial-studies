# Precision editing — Real estate, interiors & architecture scenarios. Slots: edt.yaml.
code: EDT
scenarios:

- id: EDT-RES-01
  title: "Listing clean-up: newspapers, laundry rack and wires gone, TV on, lights on, plant moved"
  persona: "Property portal's retoucher preparing a listing photo to the portal's standard."
  evidence: "Listing clean-ups stack several edits; one is usually missed."
  levers: [multi-step, keep-rest, layout, light-lock, locale]
  inputs: [{source: SRC-RES-LIVING-FLAT, role: source}]
  prompt: |
    Make exactly these six changes to this living-room listing photo, and nothing else.
    1. Remove the pile of newspapers from the sofa's left cushion.
    2. Remove the laundry rack from the balcony outside the glass door.
    3. Remove the loose wires hanging below the TV console.
    4. Switch the TV on, showing a calm blurred beach scene.
    5. Switch on the four recessed ceiling lights with a soft warm glow, keeping the daylight.
    6. Move the snake plant from beside the kitchen doorway to the right of the balcony door.
    The sofa, print, coffee table, rug, console, fan, floor tiles and the camera's straight verticals
    are unchanged.
  deliverable: "One image at the same size."
  checks:
    - [prompt_adherence, "Are the newspapers gone?"]
    - [prompt_adherence, "Is the laundry rack gone from the balcony?"]
    - [prompt_adherence, "Are the wires gone?"]
    - [prompt_adherence, "Is the TV on with a blurred beach scene?"]
    - [prompt_adherence, "Are the four recessed lights on with a warm glow?"]
    - [preservation, "Is the daylight still there?"]
    - [prompt_adherence, "Is the snake plant now right of the balcony door?"]
    - [preservation, "Is the kitchen doorway now clear of the plant?"]
    - [preservation, "Are the sofa, table and rug unchanged?"]
    - [visual_quality, "Are verticals still straight?"]
    - [visual_quality, "Are there no smudges?"]
    - [prompt_adherence, "Are all six changes made?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""

- id: EDT-RES-02
  title: "Repaint the far wall to a hex and lay oak flooring; the window view and sun panels stay"
