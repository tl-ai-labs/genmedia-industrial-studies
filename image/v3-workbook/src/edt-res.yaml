    1. Paint the far wall around the window a muted terracotta, #C9775A; the other walls stay
       off-white.
    2. Replace the grey-beige tiles with wide-plank natural oak flooring running towards the window.
    The three panels of golden sunlight still fall on the floor in the same places, now warming the
    oak; the window frame, the view of the hill, the wardrobe on the right and the switchboard on the
    left are unchanged.
  deliverable: "One image at the same size."
