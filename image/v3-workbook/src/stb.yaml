# Family 2 — Storyboards and shot sheets (header). Scenarios: stb-*.yaml.

family: Storyboards
code: STB
number: 2
about: "One grid of numbered panels with captions, from a base image or from a written script; the panels must match their own captions and each other."
outputs: "1 grid"

rubric:
  weights: {prompt_adherence: 3, set_consistency: 3, text_accuracy: 2, reference_fidelity: 2, style: 1, visual_quality: 1, physics_plausibility: 1, composition: 1, preservation: 1}
  gate: [set_consistency, text_accuracy]
  gate_rule: "No character, prop or costume may change between panels, and every caption must be exact."

targets:
  panel-count: "Wrong number of panels, or panels out of order"
  shot-size: "A panel's drawing does not match its caption's shot size or camera move"
  caption-text: "Caption text is misspelled, missing or garbled"
  continuity: "A character, prop or costume detail changes between panels"
  style-drift: "Panels are drawn in different styles"
  base-ignored: "The panels drift away from the base image's world or composition"
  axis-break: "Screen direction flips without a reason (the 180-degree rule is broken)"

