# Family 4 — Character and identity continuity sequences (header). Scenarios: chr-*.yaml.

family: Character continuity
code: CHR
number: 4
about: "The same character, or several, held across 3–6 frames of a story: new places, light, ages, costumes, poses."
outputs: "3–6 (set)"
set: {min: 3, max: 6}

rubric:
  weights: {set_consistency: 4, reference_fidelity: 3, prompt_adherence: 2, text_accuracy: 1, style: 1, visual_quality: 1, physics_plausibility: 1, composition: 1, preservation: 1}
  gate: [set_consistency]
  gate_rule: "The character must be the same person in every frame."

targets:
  identity-drift: "The face or character design changes between frames"
  age-drift: "An asked-for age change is wrong, or identity is lost with it"
  wardrobe-drift: "Costume details change when they should not, or do not change when asked"
  prop-drift: "A signature prop or mark moves, flips sides or disappears"
  expression: "The asked-for expression or pose is not delivered"
  ensemble-blend: "Features blend between characters when several are in frame"
  skin-tone: "Skin tone drifts lighter or darker across frames or light changes"

