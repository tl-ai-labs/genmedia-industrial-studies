  aspect: "16:9"
  resolution: "at least 2400 px on the long side"
  source_prompt: |
    A late-afternoon city street, shot straight on. A man of about thirty stands dead centre on
    a white zebra crossing, facing the camera, arms at his sides, calm expression. He wears a
    mustard-yellow short-sleeved camp-collar shirt, dark jeans and black over-ear headphones. Behind him, on
    the far side of the crossing, a minor two-car accident: a silver sedan with a crumpled bonnet
    and thin steam rising, nose-to-nose with a dark blue hatchback, and three men arguing beside
    the sedan, one pointing at the damage. Parked cars line the left kerb; leafy trees and
    low-rise shops with blank, unreadable signs fill the background. Warm sun from frame left,
    long soft shadows falling to the right. Camera at chest height, 40 mm perspective, the man
    from the knees up and sharp, the accident in gentle focus fall-off.
  avoid: ["readable shop names or number plates", "brand logos on clothes or cars", "watermark", "people looking at the camera other than the man"]
  must_contain:
    - "The man is centred horizontally"
    - "Headphones and yellow shirt clearly visible"
    - "Two damaged cars and exactly three men behind him"
    - "Steam from the sedan's bonnet"
    - "Sun from frame left, shadows falling right"
  alt_real: "A real or licensed street photo with this layout is also acceptable."

