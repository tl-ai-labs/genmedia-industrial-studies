  source_prompt: |
    A roadside tea stall in Mumbai on a monsoon night, heavy rain. The stall is a narrow tin
    shed facing the camera. Behind the counter, the vendor, a wiry man of about fifty in a
    vest and checked lungi, pours tea from a height between two steel pots. A large dented
    aluminium kettle sits on a kerosene stove at counter left, with no steam. Above the shed a
    painted tin board reads "RAJU TEA STALL" in red block capitals on white. A round wall clock
    behind the vendor shows ten past nine. One bare cyan-white tube light under the awning is
    the key light. In front of the counter, two customers under the dripping awning: on frame
    left a young man in a wet grey hoodie, sitting on a blue plastic stool, holding a
    smartphone in his right hand, its screen lighting his face; on frame right a delivery rider
    in a red rain jacket standing, holding a small glass of tea. Rain streaks across the frame,
    puddles on the road in the foreground reflecting the tube light and the red board. Camera
    at standing eye level from across the lane, 35 mm.
  avoid: ["any other people", "readable text other than the sign", "brand logos", "watermark"]
  must_contain:
