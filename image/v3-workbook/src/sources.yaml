    bright overcast daylight. Exactly six people. The bride, mid-twenties, sits centre-left on a
    low carved wooden stool in a plain yellow cotton suit, face and forearms smeared with
    turmeric paste, laughing with eyes half closed. Standing behind her on frame left, her
    mother in a green sari pours water from a brass lota over her head. Kneeling on frame right,
    two cousins in pink kurtas rub turmeric on her arms. On the far right edge an elderly
    grandfather in a white kurta and grey Nehru jacket sits on a cane chair, clapping. Behind
    the bride, a boy of about eight in an orange kurta holds a large brass bowl of turmeric
