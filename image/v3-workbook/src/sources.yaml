# Image v3 — sources: every input image the bank needs, with a model-neutral source prompt.
# Shape and rules: ../README.md. Written one industry at a time; Film, OTT & micro-drama first.
#
# role: scene      a base photo or frame that scenarios edit (a scene kit, reused 2–5 times)
#       reference  a character, product, costume, poster or sketch that scenarios copy from
# used_by must list exactly the slots that name this source (the build checks both ways).

sources:

# ------------------------------------------------------------ Film, OTT & micro-drama

- id: SRC-KIDS-TREE
  kind: image
  role: scene
  used_by: [COV-FLM-01, STB-FLM-02, CHR-FLM-03]
  aspect: "16:9"
  resolution: "at least 2400 px on the long side"
  source_prompt: |
    A still from a coming-of-age feature set in rural Karnataka. Two Indian children, about
    ten years old, sit side by side on one thick exposed root at the base of a very old banyan
    tree. The boy sits on frame left, the girl on frame right, shoulders almost touching, both
    looking slightly off camera to frame left. The boy wears a white half-sleeve school shirt and
    navy shorts; short side-parted hair. The girl wears a white school shirt and a navy pinafore;
    her hair is in two plaits tied with red ribbons. A brown canvas school bag leans against the
    root just to the right of the girl. Hanging aerial roots frame the left third. Behind them on
    the right, a weathered wooden rail fence runs from mid-frame to the right edge, with a dry
    grass field beyond. Time is about twenty minutes before sunset: the sun is low behind the tree
    at upper frame right, so both children are backlit with warm rim light on hair and shoulders
    and their faces sit in soft open shade. Camera at the children's seated eye height, about six
    metres away, natural 35 mm perspective, the children in the lower middle of the frame and
    about a third of frame height. Fine film grain, soft warm haze, deep shadows under the canopy.
  avoid: ["any other person", "readable text or logos", "watermark", "children looking into the lens", "a sun disc in frame"]
  must_contain:
    - "Exactly two children, boy on frame left, girl on frame right"
    - "Both faces fully visible and in focus"
    - "Two plaits with red ribbons on the girl"
    - "Brown school bag right of the girl, not cropped"
    - "Wooden fence visible on the right"
    - "Backlight from upper right: rim light on both children"
  alt_real: "A real or licensed photo of two children under a large tree at golden hour, matching this layout, is also acceptable."

- id: SRC-CROSSWALK
