# Multi-angle coverage — Film, OTT & micro-drama scenarios. Slots: cov.yaml.
code: COV
scenarios:

- id: COV-FLM-01
  seed: true
  sahil: angles
  title: "Six-shot coverage of two children under a banyan, from one approved still"
  persona: "Director of photography on a Hindi coming-of-age feature, building the shot list for a location day from the one still the director approved."
  evidence: "Sahil's screen-share, 'Angles' (screenshots 239–243): a base image of two children under a tree, then wide establishment, two-shot, close-up left-angled and close-up right-angle, each its own prompt. Call at 17:26: 'five shots of the same setup from different camera angles: is there consistency?'"
  levers: [set, unseen, identity, camera, light-lock, layout, locale]
  inputs:
    - {source: SRC-KIDS-TREE, role: source, note: "the approved frame; every member starts from it"}
  prompt: |
    This photo is the approved frame of a scene in a feature film: two Indian school children
    sitting on the root of an old banyan tree about twenty minutes before sunset. Produce one new
    camera angle of this exact moment, as if a second camera had been standing elsewhere on the
    same location at the same second. It is the same two children, the same clothes, the same
    tree, the same fence, the same bag and the same low sun behind the tree. Nobody moves and
    nothing is added: no other people, no animals, no vehicles, no text. Keep the warm backlight
    coming from behind the tree, so when the camera moves around the children the sun stays on
    the far side of the tree from the original camera, and every shadow agrees with that. Match
    the original's colour, film grain and soft haze so the new shot cuts straight into the
    original. Photoreal cinema still, 16:9, no borders, no labels. The camera position for this
    shot is described below.
  set_members:
    mode: separate
    must_stay_same:
      - "Both children's faces, hair and ages: the girl's two plaits with red ribbons, the boy's short side-parted hair"
      - "Uniforms: white shirts, the boy's navy shorts, the girl's navy pinafore"
      - "Seating: the boy on the girl's right-hand side (frame left in the original), shoulders almost touching"
      - "The brown canvas school bag against the root on the girl's other side"
      - "The banyan's root shape, the hanging aerial roots and the wooden rail fence"
      - "The low warm sun behind the tree; time of day and colour"
      - "Exactly two people in every shot where people are visible"
    members:
      - name: "Wide establishing"
        prompt: "Camera pulled back about twenty-five metres from the original position and raised to about three metres, 24 mm. The whole banyan canopy, the aerial roots, the fence and the field are in frame; the children are small, under a tenth of frame height, at the base of the trunk."
        checks:
          - [prompt_adherence, "Is the whole canopy in frame with the children under a tenth of frame height?"]
          - [prompt_adherence, "Is the fence on the same side of the tree as in the original?"]
          - [prompt_adherence, "Is the sun still behind the tree from this camera, lighting the canopy edges?"]
      - name: "Two-shot"
        prompt: "Medium two-shot from the original direction, closer: the children from mid-thigh up, both faces sharp, 50 mm at their seated eye height. The fence is soft in the background on the right."
        checks:
          - [prompt_adherence, "Are both children framed from about mid-thigh up?"]
          - [set_consistency, "Do both faces match the original closely enough to be the same child actors?"]
          - [prompt_adherence, "Is the boy on frame left and the girl on frame right?"]
      - name: "Close-up on the boy, angled from the left"
        prompt: "Close-up on the boy, camera moved about thirty degrees round to frame left of the original and set at his eye height, 85 mm. His face fills about half the frame height; the girl's shoulder is a soft shape at the right edge."
        checks:
          - [prompt_adherence, "Is the boy's face about half the frame height, seen from his front-left?"]
          - [prompt_adherence, "Is the girl's shoulder at the right edge and out of focus?"]
          - [prompt_adherence, "Is there warm rim light on his hair from behind?"]
      - name: "Close-up on the girl, angled from the right"
        prompt: "Close-up on the girl, camera moved about thirty degrees round to frame right of the original and set at her eye height, 85 mm. Her face fills about half the frame height; one red ribbon is visible; the boy's shoulder is a soft shape at the left edge."
        checks:
          - [prompt_adherence, "Is the girl's face about half the frame height, seen from her front-right?"]
          - [reference_fidelity, "Is at least one red ribbon visible on a plait?"]
          - [prompt_adherence, "Is the boy's shoulder at the left edge and out of focus?"]
      - name: "Reverse over the shoulders"
        prompt: "The reverse angle: camera behind the children at shoulder height, looking past the backs of their heads towards where the original camera stood. In front of them, a dry field slopes down to a dirt track and a line of palms. The sun is now behind this camera, so the backs of their heads are lit warm and their shadows fall forward into the frame."
        checks:
          - [prompt_adherence, "Is the camera behind the children, seeing the backs of their heads?"]
          - [prompt_adherence, "Is the girl now on frame left and the boy on frame right, as a true reverse requires?"]
          - [physics_plausibility, "Do their shadows fall forward into the frame, away from this camera?"]
          - [prompt_adherence, "Does the view show a field sloping to a track and palms, with no fence in front of them?"]
      - name: "Overhead"
        prompt: "Straight down from about six metres, through a gap in the canopy. The two children sit on the root with the radiating roots around them; the bag is beside the girl; long shadows point towards where the original camera stood."
        checks:
          - [prompt_adherence, "Is the view straight down, with no horizon visible?"]
          - [prompt_adherence, "Is the bag beside the girl, on the side away from the boy?"]
          - [physics_plausibility, "Do the shadows point away from the sun, towards the original camera's side?"]
  deliverable: "Six images, 16:9, one per member, each cut-ready against the original frame."
  checks:
    - [set_consistency, "Across all six shots, are the two children recognisably the same two children as in the original?"]
    - [set_consistency, "Is the girl's hair in two plaits with red ribbons in every shot where her head is visible?"]
    - [set_consistency, "Are the uniforms the same in every shot: white shirts, navy shorts on the boy, navy pinafore on the girl?"]
    - [set_consistency, "Is the boy on the girl's right-hand side in every shot, flipping on screen only in the reverse?"]
    - [set_consistency, "Is the school bag beside the girl, on the side away from the boy, wherever it is in frame?"]
    - [set_consistency, "Do the root, the aerial roots and the fence keep the same shape and position relative to the tree?"]
    - [prompt_adherence, "Does the sun stay behind the tree relative to the original camera in every shot?"]
    - [prompt_adherence, "Are the colour temperature, grain and haze close enough that the shots cut together?"]
    - [prompt_adherence, "Are there exactly two people in every shot that shows people, and no animals or vehicles?"]
    - [prompt_adherence, "Are the six camera positions clearly different from each other and from the original?"]
    - [prompt_adherence, "Does each shot's lens feel match its description (24 mm wide, 50 mm, 85 mm close-ups)?"]
    - [set_consistency, "Do the children look about ten years old in every shot, with no ageing or change of build?"]
    - [physics_plausibility, "Do shadows in every shot fall away from the sun's position?"]
    - [visual_quality, "Are hands, fingers and faces free of artefacts in every shot?"]
    - [text_accuracy, "Is there no text, logo or label anywhere in the six images?"]
    - [prompt_adherence, "Does every shot read as the same second in time, with nobody having moved?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Each member runs as its own image edit from the same base. The judge scores one image at a time, so whole-set agreement needs the set review."}
  video_followon: "V1 coverage: a camera move from the wide to the two-shot through the same space; V2: the two-shot as a storyboard panel to shot."

- id: COV-FLM-02
  title: "Reverse angle on the headphone man: the street behind the camera, invented and consistent"
  persona: "Second-unit director on an OTT drama who has one approved frame of the lead at a crossing and needs the opposite side for the cut."
  evidence: "Sahil's screen-share, 'Facing Headphone Man (Opposite Side)' (screenshot 244). Earlier bank IMG-VIEW-56 (reverse angle on a group) was in the high tier."
  levers: [set, unseen, identity, camera, light-lock, layout]
  inputs: [{source: SRC-CROSSWALK, role: source, note: "the approved frame"}]
  prompt: |
    This is the approved frame of a scene: a man in a mustard-yellow shirt and black headphones
    standing on a zebra crossing, with a two-car accident and three arguing men behind him.
    Produce one new camera angle of this same second, from the position described below, as if a
    second camera were rolling. He does not move. The accident, the steam and the three men stay
    exactly where they are. The sun is low on the left of the original frame, so when the camera
    moves, his lit side and the direction of every shadow must follow. The street behind the
    original camera, which the photo never shows, is a row of low shops with blank awnings, a
    bus stop and parked scooters; invent it once and keep it the same. Photoreal film still, 16:9,
    no readable text or number plates.
  set_members:
    mode: separate
    must_stay_same:
      - "His face, mustard shirt, dark jeans and black over-ear headphones"
      - "The silver sedan with crumpled bonnet and steam, the blue hatchback, three men beside them"
      - "Sun from the left of the original frame; long shadows to the right of it"
      - "The unseen street: low shops with blank awnings, a bus stop, parked scooters"
    members:
      - {name: "Reverse, from behind the accident", prompt: "Camera on the far side of the crossing behind the accident, chest height, 40 mm, looking back at him over the sedan's roof; he faces the camera, the unseen street behind him.", checks: [[prompt_adherence, "Is he seen from the accident side, past the sedan?"], [prompt_adherence, "Is the street behind him shops, a bus stop and scooters?"], [prompt_adherence, "Is his lit side now on frame right?"]]}
      - {name: "Profile", prompt: "Camera on the kerb to his left, 85 mm, a clean profile of him with the accident soft on one side of frame and the unseen street on the other.", checks: [[prompt_adherence, "Is it a clean side profile?"], [set_consistency, "Are the headphones on and the same?"]]}
      - {name: "High angle", prompt: "Camera on a first-floor balcony about six metres up, looking down at the crossing, 35 mm: the stripes, him, the two cars and the three men all visible.", checks: [[prompt_adherence, "Are there exactly three men by the cars?"], [physics_plausibility, "Do the shadows fall the same way as in the original?"]]}
      - {name: "Low wide", prompt: "Camera at kerb height in front of him, 20 mm, looking up; the stripes lead to his feet and the steam rises against the sky.", checks: [[prompt_adherence, "Is the camera at kerb height looking up?"], [prompt_adherence, "Is the steam behind him, above the sedan?"]]}
      - {name: "Insert", prompt: "Close insert of his hand at his side and the headphone cable, 100 mm, the stripes soft behind.", checks: [[reference_fidelity, "Does the shirt fabric and colour match?"], [visual_quality, "Is the hand natural with five fingers?"]]}
  deliverable: "Five images, 16:9, one per member."
  checks:
    - [set_consistency, "Is he the same man in all five shots?"]
    - [set_consistency, "Are the shirt, jeans and headphones the same in all five?"]
    - [set_consistency, "Are the two cars the same models and colours, with the same damage, wherever seen?"]
    - [set_consistency, "Are there exactly three men by the cars in every shot that shows them?"]
    - [set_consistency, "Is the steam rising from the sedan's bonnet in every shot that shows it?"]
    - [set_consistency, "Is the invented street the same in the shots that show it?"]
    - [prompt_adherence, "Does the sun stay on one side of the scene, with his lit side following the camera?"]
    - [physics_plausibility, "Do all shadows agree with that sun?"]
    - [prompt_adherence, "Do the five camera positions match their descriptions?"]
    - [prompt_adherence, "Does every shot read as the same second, with no one having moved?"]
    - [text_accuracy, "Are there no readable signs or number plates?"]
    - [visual_quality, "Are faces and hands free of artefacts?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Each member is its own image edit from the same base; set agreement needs the set review."}
  video_followon: "V1: an arc move from the original angle round to the reverse."

- id: COV-FLM-03
  title: "Haldi courtyard from five angles: six people in every angle that sees them"
  persona: "Cinematographer on a wedding web-series building coverage of the haldi scene from one location still."
  evidence: "Earlier bank IMG-VIEW-38 (raise the camera so every face is visible) and IMG-VIEW-59 (group of seven to overhead) were in the high tier for headcount and identity."
  levers: [set, count, identity, layout, locale, camera]
  inputs: [{source: SRC-HALDI, role: source}]
  prompt: |
    This photo is a haldi ceremony in a haveli courtyard with exactly six people: the bride on the
    low stool, her mother pouring water from a brass lota, two cousins in pink kurtas rubbing
    turmeric on her arms, the grandfather clapping on a cane chair at the right edge, and a boy in
    an orange kurta holding a brass bowl behind the bride. Produce one new angle of this same
    moment from the camera position described below. Nobody moves; nobody is added or lost; each
    person keeps their face, clothes and action. Keep the marigold strings, the sandstone arch and
    the yellow-splashed floor. Soft overcast daylight. Photoreal, 3:2, no text, no phones.
  set_members:
    mode: separate
    must_stay_same:
      - "Exactly six people, each with the same face, clothes and action"
      - "The lota pouring, the brass bowl held by the boy"
      - "Marigold strings, sandstone arch, yellow-splashed floor"
    members:
      - {name: "Over the mother's shoulder", prompt: "Camera behind the mother at her shoulder height, 35 mm, looking down at the bride's face as the water falls.", checks: [[prompt_adherence, "Is the view over the mother's shoulder onto the bride?"], [prompt_adherence, "Is the water falling from the lota?"]]}
      - {name: "From the grandfather's chair", prompt: "Camera at the grandfather's seated eye height beside his chair, 28 mm, looking across at the group; his clapping hands soft in the foreground.", checks: [[prompt_adherence, "Are his hands in the foreground?"], [prompt_adherence, "Are the other five people all visible?"]]}
      - {name: "Behind the bride", prompt: "Camera behind the bride, low, looking past her turmeric-covered shoulders towards the arch; the boy with the bowl is right beside camera.", checks: [[prompt_adherence, "Is the camera behind the bride?"], [prompt_adherence, "Is the boy with the bowl beside the camera?"]]}
      - {name: "Overhead", prompt: "Straight down from the first-floor balcony, about five metres, all six people seen from above with the yellow floor around them.", checks: [[prompt_adherence, "Are there exactly six people from above?"], [prompt_adherence, "Is it straight down?"]]}
      - {name: "Cousins close", prompt: "Close two-shot of the two cousins rubbing turmeric on the bride's arms, 85 mm, the bride's laughing face soft between them.", checks: [[reference_fidelity, "Are the cousins in pink kurtas?"], [visual_quality, "Are the hands natural?"]]}
  deliverable: "Five images, 3:2."
  checks:
    - [prompt_adherence, "Are there exactly six people in every angle that shows the whole group?"]
    - [set_consistency, "Is each person recognisably the same in every angle?"]
    - [set_consistency, "Are the clothes the same: yellow suit, green sari, pink kurtas, white kurta and grey jacket, orange kurta?"]
    - [set_consistency, "Is everyone doing the same action as in the photo?"]
    - [set_consistency, "Is the boy always behind the bride with the bowl?"]
    - [set_consistency, "Is the grandfather always on the cane chair at the group's edge?"]
    - [prompt_adherence, "Do the marigolds, arch and floor stay consistent with each view?"]
    - [prompt_adherence, "Is it soft overcast daylight in all five?"]
    - [prompt_adherence, "Does each camera position match its description?"]
    - [prompt_adherence, "Are there no phones or cameras in anyone's hands?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are faces and hands free of artefacts?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Five image edits from one base; set agreement needs the set review."}
  video_followon: "V1: a slow orbit round the stool through the same moment."

- id: COV-FLM-04
  title: "Rainy chai stall from five positions: the tube light and red board light each angle correctly"
  persona: "Gaffer on a Mumbai noir series planning the lighting continuity of the chai-stall scene."
  evidence: "Call at 17:26: customers find 'spatial depth is off' and consistency across angles breaks. Mixed practical light from one tube and a painted board is where angles drift."
  levers: [set, light-lock, physics, layout, locale, camera]
  inputs: [{source: SRC-CHAI-STALL, role: source}]
  prompt: |
    This is a frame of a roadside chai stall on a monsoon night: the vendor pouring tea, the young
    man on the blue stool with a phone, the delivery rider in a red jacket, the "RAJU TEA STALL"
    board, one cyan-white tube light under the awning as the only key light, rain and puddles.
    Produce one new angle of the same moment from the position below. The tube light stays the
    only key: from each new angle, faces and surfaces are lit from where the tube actually is,
    and the puddles reflect the tube and the board from where they actually are. The phone screen
    still lights the young man's face. Rain keeps falling. Photoreal, 16:9, no other readable text.
  set_members:
    mode: separate
    must_stay_same:
      - "Three people in the same places and actions"
      - "One cyan-white tube under the awning as the key light; the phone glow on the young man"
      - "The red-and-white board, the clock, the kettle, the blue stool"
      - "Rain and puddles"
    members:
      - {name: "Behind the counter", prompt: "Camera behind the vendor at his shoulder, 28 mm, looking out over the counter at the two customers and the rainy lane.", checks: [[prompt_adherence, "Are the customers lit from above by the tube, which is now near the camera?"], [prompt_adherence, "Is the young man on frame right from this side?"]]}
      - {name: "Low across the puddle", prompt: "Camera at puddle height across the lane, 35 mm; the stall and the board reflected upside down in the puddle in the foreground.", checks: [[physics_plausibility, "Are the board and tube reflected in the puddle, flipped?"], [prompt_adherence, "Is the camera at puddle height?"]]}
      - {name: "Side of the stall", prompt: "Camera at the side of the shed, 50 mm, a profile line of all three people, the tube light in frame at the top.", checks: [[prompt_adherence, "Are all three people in the profile line?"], [prompt_adherence, "Is the tube visible at the top lighting them from above?"]]}
      - {name: "Phone close-up", prompt: "Close-up of the young man's face lit by the phone, 85 mm, the tube's cyan rim on his hood.", checks: [[prompt_adherence, "Is his face lit from below by the phone, with a cyan rim from above?"], [set_consistency, "Is it the same young man in the grey hoodie?"]]}
      - {name: "High wide", prompt: "Camera from a first-floor window opposite, looking down at the stall, 24 mm; rain streaks visible against the dark lane.", checks: [[prompt_adherence, "Is it a high view from across the lane?"], [prompt_adherence, "Is the board readable as the same board from above?"]]}
  deliverable: "Five images, 16:9."
  checks:
    - [prompt_adherence, "In every angle, is the key light coming from the tube's real position?"]
    - [prompt_adherence, "Is the light colour cyan-white from the tube, with no new warm key?"]
    - [physics_plausibility, "Do puddle reflections show the tube and board where they really are from each angle?"]
    - [set_consistency, "Are the three people in the same places and actions in every angle?"]
    - [set_consistency, "Is the phone in the young man's right hand in every angle that shows it?"]
    - [set_consistency, "Is the board the same red-on-white board wherever seen?"]
    - [set_consistency, "Is the kettle without steam and the stool blue in every angle?"]
    - [set_consistency, "Is the rain the same intensity in all five?"]
    - [prompt_adherence, "Does each angle match its description?"]
    - [text_accuracy, "Is no text other than the board readable?"]
    - [prompt_adherence, "Are there exactly three people wherever the whole stall is seen?"]
    - [visual_quality, "Are faces and hands free of artefacts?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Five image edits from one base; set agreement needs the set review."}
  video_followon: "V1: a dolly from across the lane to behind the counter."

- id: COV-FLM-05
  title: "Sleeper bay from four positions: berths, trunk and suitcase keep their real sizes"
  persona: "Production designer on a railway-set Hindi feature checking whether generated coverage respects the real bay's dimensions."
  evidence: "Earlier bank IMG-VIEW-46 (ultra-wide to natural focal length) and IMG-VIEW-06 (room to high corner) were high tier; tight interiors are where scale drifts."
  levers: [set, layout, camera, locale, physics]
  inputs: [{source: SRC-TRAIN, role: source}]
  prompt: |
    This photo is one bay of a sleeper-class train compartment: two blue lower berths facing each
    other, the elderly man reading on the left, the young woman with a steel tiffin on the right,
    the green trunk under the left berth, the red suitcase on the right upper berth, the water
    bottle by the window, the empty grey partition wall on the right. Produce one new view of the
    same moment from the position described below. Everything keeps its real size: a berth is
    about 1.8 metres long and 60 centimetres wide, the trunk fits under the berth, the suitcase
    fits on the upper berth with room to spare. Hard daylight through the barred window, fields
    blurred outside. Photoreal, 3:2.
  set_members:
    mode: separate
    must_stay_same:
      - "Berth sizes and the gap between them"
      - "Green trunk under the left berth, red suitcase on the right upper berth"
      - "Both passengers in place, the man reading, the woman with the tiffin"
      - "Daylight from the barred window"
    members:
      - {name: "From the window", prompt: "Camera at the window end, seated height, 24 mm, looking back to the aisle between the two passengers.", checks: [[prompt_adherence, "Is the man now on frame right and the woman on frame left?"], [physics_plausibility, "Is the window light now behind the camera, lighting their faces?"]]}
      - {name: "From the upper berth", prompt: "Camera lying on the left upper berth looking down into the bay, 20 mm.", checks: [[prompt_adherence, "Is the view down from the upper berth?"], [physics_plausibility, "Does the red suitcase sit on the opposite upper berth at a plausible size?"]]}
      - {name: "Floor level", prompt: "Camera at floor level in the aisle, 24 mm, the trunk under the berth large in the foreground.", checks: [[physics_plausibility, "Does the trunk fit under the berth?"], [prompt_adherence, "Is the camera at floor level?"]]}
      - {name: "Two-shot", prompt: "A tighter two-shot from the aisle, 50 mm, both passengers in frame across the table.", checks: [[set_consistency, "Are both passengers the same people?"], [prompt_adherence, "Is the fold-down table between them?"]]}
      - {name: "Aisle wide", prompt: "Camera standing in the aisle two bays down, 35 mm, looking back into this bay over the partition edge; both berths, the trunk and the suitcase small in frame.", checks: [[physics_plausibility, "Do the bay's proportions read correctly from a distance?"], [prompt_adherence, "Are the trunk and suitcase visible in their places?"]]}
  deliverable: "Five images, 3:2."
  checks:
    - [physics_plausibility, "Do the berths keep the same length and width relative to the people in every view?"]
    - [physics_plausibility, "Does the trunk keep its size, fitting under the berth?"]
    - [physics_plausibility, "Does the suitcase keep its size on the upper berth?"]
    - [set_consistency, "Are the trunk and suitcase in the same places in every view?"]
    - [set_consistency, "Is the water bottle hanging by the window wherever visible?"]
    - [set_consistency, "Is the partition wall empty in every view that shows it?"]
    - [set_consistency, "Are both passengers the same people in the same actions?"]
    - [prompt_adherence, "Is the daylight coming from the window in every view?"]
    - [prompt_adherence, "Does each view match its described position?"]
    - [prompt_adherence, "Are there only two passengers in every view?"]
    - [text_accuracy, "Is no newspaper text readable?"]
    - [visual_quality, "Are the passengers' hands and the tiffin natural?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Four image edits from one base; set agreement needs the set review."}
  video_followon: "V1: a slow push from the aisle to the window."

- id: COV-FLM-06
  title: "The grandmother on the verandah at five focal lengths through the rain"
  persona: "Director of photography on a Malayalam feature testing lens choices for the grandmother's introduction."
  evidence: "Earlier bank IMG-VIEW-50 (telephoto compression versus wide angle) and IMG-VIEW-46 (ultra-wide to 35 mm) were medium and high tier; lens character is often ignored."
  levers: [set, camera, identity, light-lock, locale]
  inputs: [{source: SRC-ELDER-PORCH, role: source}]
  prompt: |
    This is a still of an elderly woman in a wooden easy chair on a Kerala verandah in monsoon
    rain, holding a steel tumbler, with an unlit brass lamp to her left and two wooden pillars.
    Produce one new shot of the same moment with the lens and camera position described below.
    The lens must show in the image: a wide lens exaggerates the near pillar and shows a lot of
    the verandah; a long lens compresses the rain and the garden into a flat soft wall behind her
    and makes the pillars look close together. Her face, spectacles, sari and pose stay the same.
    Soft grey daylight from the garden side. Photoreal, 3:2, no text.
  set_members:
    mode: separate
    must_stay_same:
      - "Her face, spectacles, grey bun and off-white sari with dark-green border"
      - "The easy chair, the tumbler in both hands, the unlit lamp to her left"
      - "Rain off the roof edge; grey daylight from the garden side"
    members:
      - {name: "24 mm", prompt: "24 mm from one metre in front of her at seated height; the near pillar large at the frame edge, the whole verandah visible.", checks: [[prompt_adherence, "Does the near pillar look exaggerated and the verandah wide?"], [visual_quality, "Is her face not distorted unpleasantly?"]]}
      - {name: "50 mm", prompt: "50 mm from three metres, her and the chair filling half the frame, the rain sheet behind.", checks: [[prompt_adherence, "Is the perspective natural, like the original?"], [reference_fidelity, "Is it clearly her?"]]}
      - {name: "85 mm", prompt: "85 mm head and shoulders from four metres, the garden soft behind.", checks: [[prompt_adherence, "Is it a head-and-shoulders shot with a soft background?"], [set_consistency, "Are the spectacles the same round wire frames?"]]}
      - {name: "135 mm from the garden", prompt: "135 mm from twelve metres out in the garden, through the falling rain; her small and framed by the pillars, which look close together.", checks: [[prompt_adherence, "Do the pillars look compressed together?"], [physics_plausibility, "Is rain falling between the camera and her?"]]}
      - {name: "Macro on the tumbler", prompt: "100 mm macro on her hands around the steel tumbler, droplets on its rim.", checks: [[reference_fidelity, "Is it a steel tumbler held in both hands?"], [visual_quality, "Are her fingers natural with wrinkles?"]]}
