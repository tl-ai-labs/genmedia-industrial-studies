- id: CMP-FLM-05
  title: "A tiny figure at the bottom of a huge stepwell in the rain"
  persona: "Production designer pitching a stepwell location for a thriller's climax."
  evidence: "Models enlarge subjects; a figure under five percent of frame height is the test."
  levers: [off-centre, camera, physics, locale, exclude]
  prompt: |
    A film still from the top edge of a vast Rajasthani stepwell in monsoon rain, looking down, 3:2.
    The stepwell's geometric flights of steps descend in a deep inverted pyramid of thousands of
    criss-crossing steps, wet and dark, rain streaking through the frame. At the very bottom, by the
    green water, a single figure in a white kurta stands looking up; he is tiny, under five percent
    of the frame's height, placed in the lower-left third. The steps' pattern leads the eye down to
    him. Grey flat light, deep wet stone colours, fine grain. No other people, no text.
  deliverable: "One image, 3:2."
  checks:
    - [composition, "Is the figure under five percent of the frame height?"]
    - [composition, "Is the figure in the lower-left third?"]
    - [composition, "Do the steps lead the eye down to him?"]
    - [prompt_adherence, "Is it shot from the top edge looking down?"]
    - [physics_plausibility, "Does the stepwell's scale read as vast?"]
    - [physics_plausibility, "Is rain streaking through the frame?"]
    - [prompt_adherence, "Is the figure in a white kurta looking up?"]
    - [prompt_adherence, "Is the light grey and flat?"]
    - [prompt_adherence, "Is there green water at the bottom?"]
    - [style, "Is the stone wet and textured?"]
    - [prompt_adherence, "Are there no other people or text?"]
    - [visual_quality, "Is the step geometry clean and consistent?"]
  competitor: "Midjourney"
  runnable_today: {status: "yes", note: "One text-to-image call."}
  video_followon: ""

- id: CMP-FLM-06
  title: "A woman cut by the left frame edge in a doorway, dirty foreground, frame within a frame"
  persona: "DP on a psychological drama pitching an unsettling composition."
  evidence: "Models avoid cropping subjects; deliberate edge-cropping is the test."
  levers: [off-centre, layout, camera, light-lock, locale]
  prompt: |
    A film still inside an old Kolkata house at dusk, 2.39:1. We look through a dark corridor towards
    a lit doorway in the middle distance; the doorway frames a room with a single bare bulb. A woman
    in a white sari with a red border stands at the left edge of the frame in the foreground, so the
    frame's edge cuts through her: only her right shoulder, the side of her face in profile and one
    eye are visible. The out-of-focus wooden door jamb fills the right edge as a dirty foreground.
    The lit doorway sits right of centre. Warm practical light ahead, cold blue dusk from an unseen
    window behind. Fine grain. No text.
  deliverable: "One image, 2.39:1."
  checks:
    - [composition, "Is the woman cut by the left frame edge, only part of her face visible?"]
    - [composition, "Is the lit doorway right of centre, framing the room?"]
    - [composition, "Is an out-of-focus door jamb filling the right edge?"]
    - [prompt_adherence, "Is there a clear foreground, middle and background?"]
    - [prompt_adherence, "Is she in a white sari with a red border?"]
    - [prompt_adherence, "Is there a single bare bulb in the room ahead?"]
    - [prompt_adherence, "Is there cold blue light from behind mixing with the warm light ahead?"]
    - [prompt_adherence, "Does it read as an old Kolkata house?"]
    - [style, "Is there fine grain?"]
    - [prompt_adherence, "Is she the only person?"]
    - [prompt_adherence, "Is there no text?"]
    - [visual_quality, "Is her visible eye and profile clean?"]
  competitor: "Midjourney"
  runnable_today: {status: "yes", note: "One text-to-image call."}
  video_followon: ""

