- id: CMP-FLM-10
  title: "Recompose the centred crosswalk photo: man on the left third, more accident on the right"
  persona: "Editor reframing a still for a poster where the title sits over the accident side."
  evidence: "Sahil's screen-share (screenshot 244) shows the man dead centre; the plan's edit example is recomposing a centred photo."
  levers: [off-centre, keep-rest, identity, unseen, layout]
  inputs: [{source: SRC-CROSSWALK, role: source}]
  prompt: |
    This photo has the man in the yellow shirt dead centre on the zebra crossing with a two-car
    accident behind him. Recompose it as a wider 21:9 frame so the man stands on the left third and
    the accident with the steaming sedan and the three arguing men sits on the right half, with more
    of the street revealed beyond them on the right: a continuation of the same low shops and trees.
    The man, the cars, the men and the light are unchanged; only the framing and the newly revealed
    area change, and the new area must match the photo's light, focus and grain. No readable text.
  deliverable: "One image, 21:9."
  checks:
    - [composition, "Is the man now on the left third?"]
    - [composition, "Is the accident on the right half?"]
    - [composition, "Is the frame 21:9?"]
    - [reference_fidelity, "Is the man unchanged: face, shirt, headphones?"]
    - [preservation, "Are the two cars and three men unchanged?"]
    - [preservation, "Is the steam still rising from the sedan?"]
    - [prompt_adherence, "Does the newly revealed area continue the same shops and trees?"]
    - [prompt_adherence, "Does the new area match the photo's light direction?"]
    - [style, "Does the new area match focus and grain?"]
    - [visual_quality, "Is there no seam between original and new areas?"]
    - [text_accuracy, "Is there no readable text?"]
    - [prompt_adherence, "Are there no new people in focus?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input; output size 21:9."}
