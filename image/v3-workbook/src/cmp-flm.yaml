- id: CMP-FLM-08
  title: "Ladakh plateau at harsh noon with the horizon in the top tenth"
  persona: "Landscape DP pitching an unusual frame for a road film."
  evidence: "Models default to horizons on the middle or a third; a top-tenth horizon is the test."
  levers: [off-centre, camera, light-lock, exclude]
  prompt: |
    A film still of a high-altitude plateau in Ladakh at harsh noon, 2.39:1. The horizon, a thin line
    of snow peaks, sits in the top tenth of the frame; the rest is the plateau's surface stretching
    towards the camera: cracked pale earth, scattered stones, tyre tracks curving from the lower
    left towards the peaks. A small white prayer-flag pole stands at the right edge, a third of the
    way down. Hard overhead sun, almost no shadows, bleached colours, intense blue sky in the thin
    strip above the peaks. Shot at 35 mm from standing height. No people, no vehicles, no text.
  deliverable: "One image, 2.39:1."
  checks:
    - [composition, "Is the horizon in the top tenth of the frame?"]
    - [composition, "Does the ground fill the rest of the frame?"]
    - [composition, "Do tyre tracks curve from the lower left towards the peaks?"]
    - [prompt_adherence, "Is the prayer-flag pole at the right edge, a third of the way down?"]
    - [prompt_adherence, "Is the light harsh overhead with almost no shadows?"]
    - [prompt_adherence, "Are colours bleached with a strip of intense blue sky?"]
    - [style, "Is the cracked earth textured?"]
    - [prompt_adherence, "Does the perspective read as 35 mm from standing height?"]
    - [prompt_adherence, "Are there no people or vehicles?"]
    - [prompt_adherence, "Is there no text?"]
    - [prompt_adherence, "Do the peaks read as Ladakh?"]
    - [visual_quality, "Is the frame free of artefacts?"]
  competitor: "Midjourney"
  runnable_today: {status: "yes", note: "One text-to-image call."}
  video_followon: ""

