# Composition and aesthetic — Film, OTT & micro-drama scenarios. Slots: cmp.yaml.
code: CMP
scenarios:

- id: CMP-FLM-01
  seed: true
  sahil: composition
  title: "Lone rider at sunset, small and off-centre, with a walker far behind"
  persona: "Cinematographer pitching the look of a western-style Indian period film, comparing tools for mood frames before the recce."
  evidence: "Sahil's screen-share, 'Texture / aesthetic' (screenshots 223–225): the same rider-at-sunset prompt in two tools. Call at 23:45: customers compare against a composition-led tool, 'Gemini models tend to center-frame everything, which they don't want'. Four more pairs in the same section (226–231) make the same point."
  levers: [off-centre, camera, light-lock, layout, exclude, long-brief]
  prompt: |
    A widescreen 2.39:1 film frame at sunset on open grassland with low hills. A lone rider on a
    horse stands still on a gentle rise, seen in full side profile facing frame right, as a near
    silhouette with a thin warm rim of light along the horse's back and the rider's hat. Place the
    rider on the left third of the frame: the horse's body sits between a quarter and two-fifths
    of the way across from the left edge, and horse and rider together are only about an eighth
    of the frame's height. Far behind and to the right, at about four-fifths of the way across,
    a second person walks on foot towards the rider, tiny, less than half the rider's height,
    soft with distance. The sun sits low in the upper right third, partly veiled by dust haze,
    not centred and not behind the rider. The horizon of the hills runs along the lower third of
    the frame, not through the middle. The bottom edge is filled with tall out-of-focus grass
    stems catching the light. Three layers of hills fade into warm haze behind each other. The
    look is shot on film: visible grain, gentle halation around the brightest edges, rich warm
    shadows that are not crushed to black, no digital sharpening. Leave the right half of the
    sky mostly empty. No lens-flare rings, no birds, no fences, no buildings, no text.
  deliverable: "One image, 2.39:1."
  checks:
    - [composition, "Is the horse's body between a quarter and two-fifths of the way across from the left edge?"]
    - [composition, "Are horse and rider together about an eighth of the frame height, clearly small?"]
    - [composition, "Is the rider facing frame right, into the open space?"]
    - [composition, "Does the horizon of the hills sit in the lower third, not through the middle?"]
    - [composition, "Is the sun in the upper right third and not behind the rider?"]
    - [composition, "Is the right half of the sky mostly empty?"]
    - [prompt_adherence, "Is there a second person on foot at about four-fifths of the way across, far behind?"]
    - [physics_plausibility, "Is the walker less than half the rider's height, consistent with distance?"]
    - [prompt_adherence, "Is the frame a true 2.39:1 widescreen?"]
    - [prompt_adherence, "Is there a thin warm rim light along the horse's back and the rider's hat, from the sun's side?"]
    - [prompt_adherence, "Is the sun veiled by dust haze rather than a hard disc?"]
    - [physics_plausibility, "Do three distinct hill layers fade into haze with distance?"]
    - [style, "Is there visible film grain and soft halation on the brightest edges?"]
    - [style, "Are the shadows warm and readable rather than crushed black or plastic-smooth?"]
    - [composition, "Is the bottom edge filled with out-of-focus grass stems?"]
    - [prompt_adherence, "Is there no lens-flare ring, bird, fence, building or text?"]
    - [visual_quality, "Does the horse have correct anatomy: four legs, one head, natural proportions?"]
  competitor: "Midjourney"
  runnable_today: {status: "yes", note: "One text-to-image call. A Midjourney arm is not wired today; compare against the existing arms until it is."}
  video_followon: "V8: the same frame as a slow push-in with the composition held."

- id: CMP-FLM-02
  title: "Dance floor in a Mumbai club: lead dancer off-centre, haze and real grain"
  persona: "Cinematographer on a nightlife OTT series building mood frames."
  evidence: "Sahil's screen-share (screenshot 226): a club dancer prompt where the other tool's frame had more texture and atmosphere."
  levers: [off-centre, light-lock, physics, locale, exclude]
  prompt: |
    A film still of a crowded dance floor in a Mumbai club at 1 a.m., 2.39:1. The lead dancer, a
    woman in her twenties with curly hair and a sequinned black top, is caught mid-move with both
    arms up, placed on the right third, her face turned towards frame left. Around and in front of
    her, the crowd is soft and partly cut by the frame, some hands blurring through the foreground.
    A mirror ball hangs at the upper left, throwing small specks of light across faces and haze.
    Magenta and cyan beams cut through thick haze from behind. The look is shot on fast film: heavy
    grain, halation round the brightest lights, skin with real texture and sweat sheen, motion blur
    on hands, deep blacks that are not crushed. No logos, no text, no lens flare rings.
  deliverable: "One image, 2.39:1."
  checks:
    - [composition, "Is the lead dancer on the right third, not centred?"]
    - [composition, "Is her face turned towards frame left, into the space?"]
    - [composition, "Is the crowd partly cut by the frame edges?"]
    - [composition, "Are there blurred hands in the foreground?"]
    - [prompt_adherence, "Is the mirror ball at the upper left?"]
    - [physics_plausibility, "Do mirror-ball specks fall on faces and haze?"]
    - [prompt_adherence, "Do magenta and cyan beams cut through haze from behind?"]
    - [style, "Is there heavy grain and halation?"]
    - [style, "Does skin show real texture and sweat sheen rather than plastic smoothness?"]
    - [physics_plausibility, "Is there motion blur on moving hands?"]
    - [prompt_adherence, "Are there no logos, text or flare rings?"]
    - [visual_quality, "Are faces and hands free of artefacts?"]
  competitor: "Midjourney"
  runnable_today: {status: "yes", note: "One text-to-image call. A Midjourney arm is not wired today."}
  video_followon: ""

