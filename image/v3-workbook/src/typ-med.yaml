    - [text_accuracy, "Is the fine print exact and complete?"]
    - [text_accuracy, "Is the fine print readable at small size?"]
    - [prompt_adherence, "Are the fields on the right and the car silhouette on the left?"]
    - [prompt_adherence, "Is the QR placeholder a plain grey square?"]
    - [prompt_adherence, "Is the fine print at the bottom?"]
    - [style, "Is it black with silver?"]
    - [prompt_adherence, "Are there four labelled fields?"]
    - [prompt_adherence, "Is there no other text?"]
    - [visual_quality, "Is the artwork clean?"]
    - [prompt_adherence, "Are the field labels aligned?"]
  competitor: "Recraft"
  runnable_today: {status: "yes", note: "One text-to-image call."}
