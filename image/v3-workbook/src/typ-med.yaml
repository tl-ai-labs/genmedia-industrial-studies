- id: TYP-MED-13
  title: "Localise the club poster into Telugu; the huge title block, frame and order stay"
  persona: "Event promoter's designer localising a Hyderabad club poster."
  evidence: "Localising a display-type poster without losing its weight and layout is a common task."
  levers: [exact-text, script, keep-rest, layout, locale]
  inputs: [{source: SRC-MED-EVENT-POSTER, role: source}]
  prompt: |
    Localise this club poster into Telugu. Replace each English line with the Telugu below in the
    same place, colour and relative size, using a Telugu face with similar weight: the huge yellow
    "NIGHT SHIFT" becomes "నైట్ షిఫ్ట్"; "with DJ KIRA" becomes "DJ కిరా తో"; "SAT 14 DEC · 10 PM TILL
    LATE" becomes "శని 14 డిసెం · రాత్రి 10 నుండి"; "Tickets ₹999 at the door" becomes "టికెట్లు ₹999
    గేట్ వద్ద"; the address line becomes "ది బేస్‌మెంట్, జూబ్లీ హిల్స్, హైదరాబాద్". The DJ photo, the
    red light and the thin yellow frame stay exactly as they are.
  exact_text:
    - "నైట్ షిఫ్ట్"
    - "DJ కిరా తో"
    - "శని 14 డిసెం · రాత్రి 10 నుండి"
    - "టికెట్లు ₹999 గేట్ వద్ద"
  deliverable: "One image, 2:3."
  checks:
    - [text_accuracy, "Is the Telugu title exact and correctly formed?"]
    - [text_accuracy, "Is every other Telugu line exact?"]
    - [text_accuracy, "Is the address line in Telugu and correct?"]
    - [prompt_adherence, "Is each line in its original place?"]
    - [preservation, "Is the title still huge yellow with heavy weight?"]
    - [prompt_adherence, "Are relative sizes kept?"]
    - [preservation, "Is the DJ photo and red light unchanged?"]
    - [preservation, "Is the yellow frame unchanged?"]
    - [text_accuracy, "Is no English left except DJ?"]
    - [visual_quality, "Are there no smudges where English was?"]
    - [text_accuracy, "Is the small line readable?"]
    - [text_accuracy, "Is the rupee price exact?"]
  competitor: "Recraft"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""

