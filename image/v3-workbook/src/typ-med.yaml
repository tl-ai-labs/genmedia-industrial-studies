  persona: "Event designer producing passes for a motor show."
  evidence: "Passes carry small fine print and structured fields."
  levers: [exact-text, small-text, layout, count]
  prompt: |
    A motor-show entry pass, flat artwork, landscape 2:1, black with a silver car silhouette on the
    left. Fields on the right, exactly: "AUTO EXPO 2027" at the top; "NAME  Rohan Mehta"; "ZONE  Hall
    3 · Electric"; "GATE  4"; "DAY  Saturday 6 February"; a grey QR-code placeholder square with no
    code in it; and a fine-print block at the bottom: "Non-transferable. Valid for one entry on the
    day shown. Photography allowed in public halls only. The organiser may refuse entry." No other
    text.
