# Typography and layout — Media, publishing & events scenarios. Slots: typ.yaml.
code: TYP
scenarios:

- id: TYP-MED-01
  seed: true
  sahil: typography
  title: "Club-night poster: a huge lower-case display word, date, headliners and a Devanagari line"
  persona: "Designer at a Bengaluru events company making the weekly poster for a lounge's Saturday night, posted to social and printed for the venue."
  evidence: "Sahil's screen-share (screenshot 238): an event poster with a photo of a crowd on top, a huge lower-case 'wknd' overlapping it, 'DIALOGUE SATURDAYS', '01 FEB', two headliner names, a Devanagari line, a sticker, small body text and a venue footer, compared with a type-led tool. 'To someone like me both look okay' — the test is the small things."
  levers: [exact-text, script, small-text, layout, exclude, long-brief]
  prompt: |
    Design a portrait 2:3 club-night poster on warm off-white paper with a light grain, black type
    and one red accent. The top 40 percent is a photo of a packed dance floor under white stage
    lights, hands in the air; in its top-left corner a thin white circle holding the venue logo
    text "DIALOGUE LOUNGE". Below, overlapping the photo's bottom edge so the tops of the letters
    sit over the photo, the word "wknd" in huge heavy lower-case sans, the full width of the
    poster. Under it, on the left, "DIALOGUE SATURDAYS" in bold condensed capitals on two lines,
    and on the right at the same size "01 FEB". Under that, on the left, the Hindi line
    "हर शनिवार, देर रात तक" in Devanagari, and on the right the headliners "AARAV · KIRA" in bold
    capitals. A round red sticker, tilted 10 degrees, sits on the photo's lower-left edge with
    white text "City's favourite 2-word party". Above the footer, one line of small body text:
    "Doors 9 pm. Entry on guest list only. Dress code: all black." A thin rule, then the footer:
    "XXY" on the left and "THE MAJESTIC RETREAT, MG ROAD, BENGALURU" in small capitals on the
    right. Sizes from largest to smallest: wknd; DIALOGUE SATURDAYS and 01 FEB; AARAV · KIRA;
    the Hindi line; the sticker; the body line and footer. No other words, no logos, no QR code.
  exact_text:
    - "DIALOGUE LOUNGE"
    - "wknd"
    - "DIALOGUE SATURDAYS"
    - "01 FEB"
    - "हर शनिवार, देर रात तक"
    - "AARAV · KIRA"
    - "City's favourite 2-word party"
    - "Doors 9 pm. Entry on guest list only. Dress code: all black."
    - "XXY"
    - "THE MAJESTIC RETREAT, MG ROAD, BENGALURU"
  deliverable: "One portrait 2:3 image."
  checks:
    - [text_accuracy, "Is the display word exactly wknd, in lower case?"]
    - [prompt_adherence, "Does wknd span the poster's width and overlap the bottom edge of the photo?"]
    - [text_accuracy, "Are DIALOGUE SATURDAYS and 01 FEB exact, left and right at the same size?"]
    - [text_accuracy, "Is the Hindi line exact and correctly formed, including the comma?"]
    - [text_accuracy, "Are the headliners exactly AARAV · KIRA, with the middle dot?"]
    - [text_accuracy, "Is the sticker text exact, with the apostrophe and the numeral 2?"]
    - [prompt_adherence, "Is the sticker round, red, tilted, on the photo's lower-left edge?"]
    - [text_accuracy, "Is the body line exact and complete?"]
    - [text_accuracy, "Is the footer exact: XXY on the left, the venue address on the right?"]
    - [text_accuracy, "Is DIALOGUE LOUNGE in a thin white circle at the photo's top-left?"]
    - [prompt_adherence, "Do the sizes follow the order given, wknd largest, footer smallest?"]
    - [style, "Is there exactly one accent colour, red, with everything else black on off-white?"]
    - [text_accuracy, "Is every word readable, with no garbled characters at small sizes?"]
    - [prompt_adherence, "Is there no other text, logo or QR code?"]
  competitor: "Recraft"
  runnable_today: {status: "yes", note: "One text-to-image call. A Recraft arm is not wired today; compare against the existing arms until it is."}
  video_followon: "V9: the poster as a 6-second animated post, the type arriving in size order, the Hindi line exact in every frame."

- id: TYP-MED-02
  title: "A stacked collage headline around a falling figure, with small body-text columns"
  persona: "Designer at a music magazine making a feature poster."
  evidence: "Sahil's screen-share (screenshots 238–239): the 'Falling Off The Face Of The Earth' collage poster compared with a type-led tool."
  levers: [exact-text, small-text, layout, off-centre, long-brief]
  prompt: |
    A portrait 3:4 collage poster on electric blue with black star scatter. A cut-out photo of a
    woman in a yellow jumpsuit falls diagonally through the middle, arms flung out. The headline in
    huge chunky white rounded serif, stacked on four lines, flowing around her: "Falling Off" / "The
    Face" / "Of The" / "Earth." with a small tilted black tab above the first line reading "I can't
    stop". Two small cut-out moon photos at the corners. Two narrow columns of small white body text
    on the right reading exactly "Nine songs about leaving." and "Out now on every platform that
    matters." A small white pill at the bottom right reads "where'd you go?". No other text.
  exact_text:
    - "Falling Off"
    - "The Face"
    - "Of The"
    - "Earth."
    - "I can't stop"
    - "Nine songs about leaving."
    - "Out now on every platform that matters."
    - "where'd you go?"
  deliverable: "One image, 3:4."
  checks:
    - [text_accuracy, "Are the four headline lines exact, including the full stop?"]
    - [text_accuracy, "Is the tab text exactly I can't stop, with the apostrophe?"]
    - [text_accuracy, "Are the two body-text lines exact?"]
    - [text_accuracy, "Is the pill exactly where'd you go? with the apostrophe?"]
    - [prompt_adherence, "Does the headline flow around the falling figure?"]
    - [prompt_adherence, "Is the figure falling diagonally through the middle?"]
    - [prompt_adherence, "Are the body-text columns on the right?"]
    - [style, "Is the headline chunky white rounded serif on electric blue?"]
    - [prompt_adherence, "Are there two moon cut-outs?"]
    - [text_accuracy, "Is the small body text readable?"]
    - [prompt_adherence, "Is there no other text?"]
    - [visual_quality, "Is the figure clean?"]
  competitor: "Recraft"
  runnable_today: {status: "yes", note: "One text-to-image call."}
  video_followon: ""

