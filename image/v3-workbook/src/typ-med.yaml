    - "Rohan Mehta"
    - "Hall 3 · Electric"
    - "Saturday 6 February"
    - "Non-transferable. Valid for one entry on the day shown. Photography allowed in public halls only. The organiser may refuse entry."
  deliverable: "One image, 2:1."
  checks:
