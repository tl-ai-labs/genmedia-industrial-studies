# Family 1 — Multi-angle coverage of one shot or room (header). Scenarios: cov-*.yaml.
# Slot fields and rules: ../README.md. Slots are written one industry at a time.

family: Multi-angle coverage
code: COV
number: 1
about: "The same moment or space from several camera positions: wide, two-shot, close-ups, reverse, overhead. Judged as one set."
outputs: "5–8 (set)"
set: {min: 5, max: 8}

rubric:
  weights: {set_consistency: 4, prompt_adherence: 3, reference_fidelity: 3, physics_plausibility: 2, text_accuracy: 1, style: 1, visual_quality: 1, preservation: 1}
  gate: [set_consistency]
  gate_rule: "The outputs must show one subject, one space and one moment."

targets:
  angle-wrong: "The delivered camera position is not the one asked for (asked for a reverse, got the same side)"
  layout-drift: "Objects or people change places between angles"
  identity-drift: "Faces, wardrobe or object details change between angles"
  light-drift: "The light direction does not follow the camera move (sun swaps sides)"
  unseen-invent: "What the base never shows is invented in a way that contradicts it"
  headcount: "People are added or lost between angles"
  scale-drift: "Relative sizes change between angles"
  lens-ignored: "The named lens or shot size is not honoured"

