# Family 6 — Typography and layout, multi-script (header). Scenarios: typ-*.yaml.

family: Typography and layout
code: TYP
number: 6
about: "Posters, title cards and layouts with exact copy in Latin, Devanagari, Telugu and Tamil, including localising a finished design. Compared with a type-led tool."
outputs: "1"
text_family: true

rubric:
  weights: {text_accuracy: 4, prompt_adherence: 3, style: 2, preservation: 2, visual_quality: 1, physics_plausibility: 1, composition: 1, set_consistency: 1, reference_fidelity: 1}
  gate: [text_accuracy]
  gate_rule: "Every letter must be right, in every script."

targets:
  string-exact: "A word is misspelled, missing, doubled or invented"
  script-render: "Devanagari, Telugu or Tamil letters are malformed or joined wrongly"
  hierarchy: "The type sizes and order do not follow the brief"
  layout-kept: "A localised or edited layout loses the original design"
  small-text: "Small text (credits, fine print) is garbled"
  font-match: "New text does not match the existing font, weight or treatment"

