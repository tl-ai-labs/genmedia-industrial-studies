# Storyboards — Gaming scenarios. Slots: stb.yaml.
code: STB
scenarios:

- id: STB-GAM-01
  seed: true
  title: "Nine-panel launch-trailer board for the game's heroine"
  persona: "Trailer director at a game publisher boarding the launch cinematic for the outsourced animation team."
  evidence: "Sahil's storyboard example (234–235) was a 3×3 pencil board with 'action • shot size • camera' captions from one base image. Gaming adds side-specific details (cape on one shoulder, rune on one glove) that a mirrored or careless drawing flips."
  levers: [count, exact-text, camera, continuity, identity, layout]
  inputs:
    - {source: SRC-GAM-HERO, role: source, note: "the heroine, Ira"}
  prompt: |
    Using this character render, draw the storyboard for the game's launch trailer as one image:
    nine panels in a three-by-three grid, read left to right, top to bottom, in black-and-white
    pencil with grey marker tones, 16:9 frame lines in each panel. Under each panel, a caption
    with exactly this text:

    1 · Rain on the rooftop · EWS · Crane down
    2 · Ira opens her eyes · ECU · Static
    3 · She draws the sword · MS · Push in
    4 · Rune flares on her glove · Insert · Static
    5 · She leaps the gap · WS · Track right
    6 · Mid-air, cape trailing · MS · Handheld
    7 · Lands, sword down · WS · Static
    8 · Enemies close in · OTS · Pan left
    9 · Title card · SHADOW RAAGA · Static

    Each drawing matches its shot size, and the panels with camera moves carry a drawn arrow for
    the move. Ira stays exactly the character in the render: high ponytail with three rings, the
    red sash-cape on her right shoulder only, the rune on the back of her left glove, the curved
    sword with the veena-head guard always in her right hand. In panels 5 to 7 she moves left to
    right. In panel 8 the enemies are three hooded figures, seen over her right shoulder. Panel 9
    is a title card with the words SHADOW RAAGA drawn as the game logo. No other text.
  exact_text:
    - "1 · Rain on the rooftop · EWS · Crane down"
    - "2 · Ira opens her eyes · ECU · Static"
    - "3 · She draws the sword · MS · Push in"
    - "4 · Rune flares on her glove · Insert · Static"
    - "5 · She leaps the gap · WS · Track right"
    - "6 · Mid-air, cape trailing · MS · Handheld"
    - "7 · Lands, sword down · WS · Static"
    - "8 · Enemies close in · OTS · Pan left"
    - "9 · Title card · SHADOW RAAGA · Static"
  deliverable: "One landscape image, nine panels in a 3×3 grid with captions."
  checks:
    - [prompt_adherence, "Are there exactly nine panels in a three-by-three grid?"]
    - [text_accuracy, "Does every caption match its given text exactly?"]
    - [prompt_adherence, "Is panel 1 an extreme wide of the rooftop in rain with a crane-down arrow?"]
    - [prompt_adherence, "Is panel 2 an extreme close-up of her eyes?"]
    - [prompt_adherence, "Is panel 4 a frame-filling insert of the rune on the back of a glove?"]
    - [reference_fidelity, "Is the rune on her left glove in panel 4 and wherever it shows?"]
    - [reference_fidelity, "Is the cape on her right shoulder in every panel where it shows?"]
    - [reference_fidelity, "Is the sword in her right hand in every panel, with the veena-head guard?"]
    - [set_consistency, "Does she move left to right in panels 5, 6 and 7?"]
    - [prompt_adherence, "Are there exactly three hooded enemies in panel 8, seen over her right shoulder?"]
    - [prompt_adherence, "Do panels 3, 5, 6 and 8 carry arrows or marks for push in, track right, handheld and pan left?"]
    - [text_accuracy, "Does panel 9 show SHADOW RAAGA spelled correctly as a title card?"]
    - [reference_fidelity, "Is her ponytail with three rings recognisable wherever her head is seen from the side or back?"]
    - [style, "Are all nine panels pencil with grey marker, in one consistent style?"]
    - [visual_quality, "Are her hands on the sword drawn with natural grip and finger count?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: "V2: panels 5 and 6 as storyboard panel to shot, cape and rune sides held."

- id: STB-GAM-02
  title: "Six-panel level-intro cutscene board through the temple courtyard"
  persona: "Cinematic designer boarding a level's intro from the built level."
  evidence: "Boards drift from the built level; landmarks with fixed states (broken tier, fallen pillar) make it checkable."
  levers: [count, exact-text, layout, camera, locale]
  inputs: [{source: SRC-GAM-TEMPLE-LEVEL, role: source}]
  prompt: |
    Using this screenshot of a ruined temple-courtyard level, draw a six-panel cutscene storyboard in
    grey-shaded 3D frames, two rows of three, 16:9. Captions exactly: "1 · Gopuram silhouette ·
    EWS", "2 · Through the gate · WS", "3 · Fallen pillar · MS", "4 · Stone chariot · LS", "5 ·
    Dry tank, shrine · WS", "6 · Hero's shadow falls · CU". The level's layout is respected: the
    gopuram's top tier is broken, the third pillar from the entrance is fallen, the chariot is in
    the centre, the tank and shrine are on the right as seen from the entrance. The low sun is on
    the right of the entrance view. No other text.
  exact_text:
    - "1 · Gopuram silhouette · EWS"
    - "3 · Fallen pillar · MS"
    - "6 · Hero's shadow falls · CU"
  deliverable: "One landscape image, six panels."
  checks:
    - [prompt_adherence, "Are there six panels?"]
    - [text_accuracy, "Are the captions exact?"]
    - [prompt_adherence, "Is the gopuram's top tier broken in panel 1?"]
    - [prompt_adherence, "Is a pillar fallen in panel 3, consistent with the third from the entrance?"]
    - [prompt_adherence, "Is the chariot in the courtyard's centre?"]
    - [prompt_adherence, "Are the tank and shrine on the side the level shows?"]
    - [prompt_adherence, "Do shadows fall consistently with a low sun from one side?"]
    - [prompt_adherence, "Does each panel match its shot size?"]
    - [style, "Is the grey 3D style consistent?"]
    - [prompt_adherence, "Is panel 6 a close view of a shadow on the paving?"]
    - [visual_quality, "Are perspective lines correct?"]
    - [prompt_adherence, "Is no character fully shown before panel 6?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: "V2: panel 2 as a shot through the gate."

