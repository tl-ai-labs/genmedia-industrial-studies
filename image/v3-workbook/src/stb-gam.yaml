    - [reference_fidelity, "Is the stripe orange and the decal 07 wherever visible?"]
    - [reference_fidelity, "Is the dent on the right front wherever that side shows?"]
    - [set_consistency, "Does the bike move left to right in panels 4 to 6?"]
    - [prompt_adherence, "Is panel 2 an insert of a pod glowing?"]
    - [prompt_adherence, "Is panel 3 an extreme close-up of a mirrored visor?"]
    - [style, "Is the ink and marker style consistent?"]
    - [prompt_adherence, "Is it night with cyan pod glow?"]
    - [prompt_adherence, "Is panel 5 inside a tunnel?"]
    - [visual_quality, "Is the bike's shape consistent?"]
    - [prompt_adherence, "Is there one rider?"]
