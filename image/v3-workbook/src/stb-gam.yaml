    - [prompt_adherence, "Is panel 4 a close-up of a drone launching from a shoulder?"]
    - [prompt_adherence, "Is panel 6 an extreme close-up of an arrow or eye?"]
    - [prompt_adherence, "Is the banner saffron in panel 8?"]
    - [style, "Is the cel-shaded style consistent?"]
    - [visual_quality, "Are figures clean?"]
    - [prompt_adherence, "Are the five squad members all present in panel 1?"]
