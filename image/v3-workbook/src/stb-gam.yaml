    - [set_consistency, "Is the prince in a red dhoti and gold crown throughout?"]
    - [prompt_adherence, "Does each panel show its caption?"]
    - [prompt_adherence, "Is a lotus offered in panel 3?"]
    - [prompt_adherence, "Is a river city below in panel 6?"]
