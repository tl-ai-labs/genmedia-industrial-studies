  prompt: |
    Using this render of a graphite hover-bike with an orange stripe, cyan pods, a "07" decal and a
    dent on the right front fairing, draw a six-panel storyboard in ink and marker, one row of six,
    2.39:1 frames. Captions exactly: "1 · Start grid at night · EWS · Crane down", "2 · Pods ignite
    · Insert · Static", "3 · Rider's visor · ECU · Static", "4 · Launch · WS · Whip pan", "5 ·
    Through the tunnel · MS · Tracking", "6 · Over the finish · LS · Static". The bike's stripe,
    decal and dent stay as in the render wherever visible; the bike moves frame left to frame
    right in panels 4 to 6. The rider wears a black suit and a mirrored visor. No other text.
  exact_text:
    - "1 · Start grid at night · EWS · Crane down"
    - "4 · Launch · WS · Whip pan"
    - "07"
  deliverable: "One wide image of six panels."
  checks:
