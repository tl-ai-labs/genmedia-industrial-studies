  levers: [time-code, exact-text, script, count, small-text, locale]
  prompt: |
    Design a shooting script sheet on one landscape page, white background, black and teal type, for
    a 30-second commercial for a fictional electric scooter in Hyderabad. Title: "HAWA E1 — 30s TVC".
    Eight beat boxes in two rows of four, each with a 16:9 thumbnail, the time code, and a Telugu
