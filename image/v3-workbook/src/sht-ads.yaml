- id: SHT-ADS-07
  title: "Food-styling sheet for a burger ad: exploded layers, plating notes, palette"
  persona: "Food stylist preparing the spec for a burger shoot."
  evidence: "Exploded-view sheets test layer order and labelled leader lines."
  levers: [count, exact-text, layout, small-text, physics]
  prompt: |
    Design a food-styling sheet on one landscape page, warm white, black labels. Title "THE
    SMOKEHOUSE — STYLING SPEC". On the left, an exploded side view of a burger with seven layers
    floating apart on one vertical axis, top to bottom, each with a leader line and label exactly:
    "Sesame bun top", "Pickled onion", "Smoked cheddar", "Beef patty 180 g", "Tomato x2", "Iceberg",
    "Bun base". On the right, the assembled burger as a hero photo. Below, "PLATING NOTES" with three
    lines exactly: "Cheese melted over the edge", "Two tomato slices, not one", "Sesame on top only".
    A palette strip of four swatches labelled "Bun", "Cheddar", "Patty", "Lettuce". No other text.
  exact_text:
    - "THE SMOKEHOUSE — STYLING SPEC"
    - "Beef patty 180 g"
    - "Tomato x2"
    - "PLATING NOTES"
    - "Two tomato slices, not one"
  deliverable: "One landscape image."
  checks:
    - [prompt_adherence, "Are there seven floating layers in the stated order?"]
    - [text_accuracy, "Are the seven labels exact?"]
    - [prompt_adherence, "Does each leader line point to its layer?"]
    - [prompt_adherence, "Are there two tomato slices in both the exploded and assembled views?"]
    - [set_consistency, "Does the assembled burger match the exploded layers?"]
    - [prompt_adherence, "Is the cheese melted over the edge in the hero?"]
    - [prompt_adherence, "Is sesame only on the top bun?"]
    - [text_accuracy, "Are the plating notes exact?"]
    - [prompt_adherence, "Are there four palette swatches with labels?"]
    - [prompt_adherence, "Do the swatches match the food colours?"]
    - [text_accuracy, "Is the title exact?"]
    - [visual_quality, "Is the food free of artefacts?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One text-to-image call."}
  video_followon: ""
