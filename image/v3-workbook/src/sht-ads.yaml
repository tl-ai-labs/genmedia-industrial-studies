    - [text_accuracy, "Is the Tamil big-idea line exact?"]
    - [prompt_adherence, "Are all four sections present with exact headings?"]
    - [prompt_adherence, "Are there four manifesto lines?"]
    - [prompt_adherence, "Are there three key-visual thumbnails?"]
    - [prompt_adherence, "Do the thumbnails match their descriptions?"]
    - [prompt_adherence, "Does the media grid have five rows and two columns?"]
    - [style, "Is the palette deep blue, yellow and white?"]
    - [prompt_adherence, "Are the scenes recognisably Tamil Nadu?"]
    - [text_accuracy, "Is every label readable?"]
    - [visual_quality, "Are thumbnails clean?"]
    - [prompt_adherence, "Is there no other text?"]
