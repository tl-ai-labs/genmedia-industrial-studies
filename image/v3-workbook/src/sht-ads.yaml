    fictional lime soda's cricket-season campaign in Tamil Nadu. Title: "சிக்ஸர் சோடா — PITCH".
    Sections with exact headings: "BIG IDEA" with the Tamil line "ஒவ்வொரு பந்தும் ஒரு கொண்டாட்டம்";
    "MANIFESTO" with four short English lines; "KEY VISUALS" with three thumbnails (a boy in a
    lungi hitting a tennis ball on a beach; a family cheering at a TV; a bottle sweating in a fan's
    hand in a stadium); "MEDIA" with a grid of five rows: "TV", "Outdoor", "Instagram", "YouTube",
