# Family 5 — Composition and cinematic aesthetic (header). Scenarios: cmp-*.yaml.

family: Composition and aesthetic
code: CMP
number: 5
about: "Framing, scale, horizon, negative space and texture against the default centred, clean look. Compared with a composition-led tool."
outputs: "1"

rubric:
  weights: {composition: 4, prompt_adherence: 3, style: 2, physics_plausibility: 1, visual_quality: 1, preservation: 1, text_accuracy: 1, reference_fidelity: 1}
  gate: [composition]
  gate_rule: "The framing must be the one described, not the default centred look."

targets:
  centre-bias: "The subject lands dead centre when the brief places it elsewhere"
  horizon: "The horizon is not where, or at the tilt, the brief asks"
  negative-space: "Not enough empty space where the brief asks for it"
  scale-small: "The subject is larger in frame than asked"
  lens-look: "The perspective does not match the named lens"
  texture-flat: "Clean, plastic surfaces instead of the asked-for texture, grain and atmosphere"
  crop-edge: "The subject is not cut by the frame edge as asked"

