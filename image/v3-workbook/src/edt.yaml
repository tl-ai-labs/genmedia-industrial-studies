# Family 8 — Precision multi-step editing (header). Scenarios: edt-*.yaml.

family: Precision editing
code: EDT
number: 8
about: "Several exact edits in one instruction on a real image, with everything else left as it was."
outputs: "1"

rubric:
  weights: {preservation: 4, prompt_adherence: 4, reference_fidelity: 3, text_accuracy: 2, physics_plausibility: 2, visual_quality: 1, style: 1}
  gate: [preservation]
  gate_rule: "Nothing outside the asked-for changes may be altered."

targets:
  spill: "Something outside the asked-for change is altered"
  step-missed: "One of the asked-for changes is not made"
  identity-drift: "A face or product in the image changes"
  text-damage: "Existing text is damaged, or new text is wrong"
  over-edit: "The change is heavier than asked (restyle instead of a fix)"

slots:
  # Film, OTT & micro-drama — 3 (3 edit · 2 hard, 1 extreme)
  - {id: EDT-FLM-01, task: edit, subject: group, style: cinematic, light: fog-rain, locale: IN, diff: extreme, target: spill, sources: [SRC-CHAI-STALL], script: devanagari, idea: "Five continuity fixes on the chai stall: phone to tea glass, sign into Hindi, clock time, kettle steam, stool colour"}
  - {id: EDT-FLM-02, task: edit, subject: interior, style: cinematic, light: practical, locale: IN, diff: hard, target: step-missed, sources: [SRC-SET-LIVING], idea: "Period clean-up of the 1970s set: remove the bottle and switchboard, warm the bulb, recover the sofa"}
  - {id: EDT-FLM-03, task: edit, subject: person, style: cinematic, light: golden, locale: IN, diff: hard, target: identity-drift, sources: [SRC-ROOFTOP], idea: "Night to dawn on the rooftop, remove the dish, add a washing line; the woman unchanged"}
