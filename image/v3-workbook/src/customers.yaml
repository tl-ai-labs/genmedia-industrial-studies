# Target customers: the kinds of business each scenario is for. Drafted by Claude on
# 2026-10-08 from each scenario's persona (where the persona works, then the brand category
# it serves) — to be reviewed. The build stops on an unknown code, a missing scenario or
# an id that is not in the bank.
# The types are shared with the video bank, which reads them from here.
types:
  AGY: {name: "Advertising Agencies", detail: "Creative, media and out-of-home agencies making campaigns for brands."}
  PRD: {name: "Production Studios", detail: "Film and series production houses, from features to micro-dramas."}
  OTT: {name: "Streaming Platforms", detail: "OTT services and vertical-video drama apps commissioning and promoting shows."}
  ANI: {name: "Animation Studios", detail: "2D, 3D and anime studios, including animated ads."}
  VFX: {name: "VFX & Post-production Studios", detail: "Visual effects, online editing and colour houses."}
  WED: {name: "Wedding Film Studios", detail: "Studios shooting and finishing wedding films."}
  GAM: {name: "Game Studios & Publishers", detail: "Studios and publishers making games, trailers, store art and merchandise."}
  ESP: {name: "Esports Organisers", detail: "Leagues and tournament organisers producing broadcasts and posters."}
  MKT: {name: "E-commerce Marketplaces", detail: "Marketplaces and their sellers producing listing images and videos."}
  D2C: {name: "D2C Brands", detail: "Direct-to-consumer brands selling on their own site and on marketplaces."}
  FDP: {name: "Food Delivery Platforms", detail: "Food-delivery apps and the cloud kitchens and restaurants listed on them."}
  RET: {name: "Retail Chains", detail: "Store chains producing in-store, sale and promo material."}
  FSH: {name: "Fashion Brands", detail: "Apparel, ethnic-wear, denim and accessories labels."}
  BTY: {name: "Beauty Brands", detail: "Skincare, cosmetics and fragrance brands."}
  FNB: {name: "Food & Beverage Brands", detail: "Packaged food, snack, spice, beverage and dairy brands."}
  AUT: {name: "Automotive Brands", detail: "Car, two-wheeler and EV makers and dealer networks."}
  ELE: {name: "Consumer Electronics Brands", detail: "Phone, wearable and hardware brands."}
  HOM: {name: "Home & Furniture Brands", detail: "Furniture, mattress, décor and kitchenware brands."}
  KID: {name: "Toy & Kids' Brands", detail: "Toy, children's product and kids' apparel brands."}
  SPT: {name: "Sportswear & Outdoor Brands", detail: "Sportswear, footwear and outdoor-gear brands."}
  PET: {name: "Pet Brands", detail: "Pet food and pet product brands."}
  FIN: {name: "Financial Services", detail: "Payments, insurance and other financial brands."}
  DEV: {name: "Real Estate Developers", detail: "Builders and developers marketing projects, show flats and plots."}
  POR: {name: "Property Portals & Brokers", detail: "Listing portals, brokers and agents preparing property listings."}
  ARC: {name: "Architecture & Interior Studios", detail: "Architects, interior designers and archviz studios presenting to clients."}
  HOS: {name: "Hotels & Hospitality", detail: "Hotels, resorts and venues marketing their spaces."}
  BLD: {name: "Building Products Makers", detail: "Cladding, facade and bath-fittings manufacturers."}
  PUB: {name: "Publishers", detail: "Magazines, book and comic publishers and travel or culture publications."}
  NEW: {name: "News & Broadcast", detail: "News channels and broadcasters making bulletins, promos and openers."}
  EVT: {name: "Event Organisers", detail: "Festivals, conferences, award shows and live-event companies."}
