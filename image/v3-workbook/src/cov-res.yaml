- id: COV-RES-08
  title: "Architect's pencil perspectives of a described garden pavilion from four points"
  persona: "Architect sketching a pavilion for a client meeting and testing whether a model can hold one design across viewpoints."
  evidence: "Plan's text-only coverage test in a sketch style; hand-drawn sets often drift in proportion."
  levers: [set, physics, layout, long-brief, camera]
  prompt: |
    One sheet of five pencil perspective sketches on white paper, 16:9 each, numbered 1 to 5, of the
    same small garden pavilion, drawn with confident architect's line and light hatching. The
    pavilion: a square 6 by 6 metre platform raised three steps; four slim steel columns at the
    corners; a thin flat roof overhanging 1 metre on all sides; one solid stone wall on the north
    side only; a built-in bench along that wall; a single neem tree to the south-east. Views: 1,
    from the south at eye level; 2, from the east at eye level; 3, from the north-west, behind the
    stone wall; 4, from a low point at the steps; 5, a bird's-eye view from the south-west. Numbers
    only, no other text.
  set_members:
    mode: one-sheet
    must_stay_same:
      - "Square platform with three steps, four corner columns, thin overhanging roof"
      - "One stone wall on the north side with a bench"
      - "Neem tree to the south-east"
    members:
      - {name: "1 South", prompt: "From the south at eye level.", checks: [[prompt_adherence, "Is the stone wall at the back?"], [prompt_adherence, "Is the tree on the right?"]]}
      - {name: "2 East", prompt: "From the east at eye level.", checks: [[prompt_adherence, "Is the stone wall on the right?"], [physics_plausibility, "Is the tree near the left?"]]}
      - {name: "3 North-west", prompt: "From the north-west behind the wall.", checks: [[prompt_adherence, "Is the wall in front, hiding the bench?"], [physics_plausibility, "Does the roof overhang show over the wall?"]]}
      - {name: "4 Steps", prompt: "Low at the steps.", checks: [[prompt_adherence, "Are there three steps?"], [prompt_adherence, "Is it low?"]]}
      - {name: "5 Bird's-eye", prompt: "From above the south-west.", checks: [[prompt_adherence, "Are there four columns?"], [prompt_adherence, "Is the wall on the north side?"]]}
  deliverable: "One image: five numbered sketches."
  checks:
    - [prompt_adherence, "Are there five numbered sketches?"]
    - [physics_plausibility, "Is the pavilion the same size and proportion in all five?"]
    - [prompt_adherence, "Are there four columns and three steps wherever visible?"]
    - [set_consistency, "Is the stone wall on the north side in all five?"]
    - [set_consistency, "Is the tree to the south-east in all five?"]
    - [physics_plausibility, "Is the perspective correct in each sketch?"]
    - [prompt_adherence, "Does each sketch match its viewpoint?"]
    - [style, "Is the pencil style the same across the five?"]
    - [text_accuracy, "Are the numbers the only text?"]
    - [prompt_adherence, "Are there no figures?"]
    - [visual_quality, "Are lines confident and clean?"]
    - [prompt_adherence, "Is the roof overhang about a metre on all sides?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One text-to-image call."}
  video_followon: ""

- id: COV-RES-09
  title: "A described architect on a described terrace garden, four angles plus a detail"
  persona: "Studio's PR lead making profile images of a fictional founder for a magazine mock-up."
  evidence: "Plan's text-only coverage test with a person and a space held together."
  levers: [set, identity, layout, locale, long-brief]
  prompt: |
    A terrace garden on the roof of a Bengaluru studio at golden hour, photoreal, 4:5. The architect:
    a woman of about forty-five with short grey-streaked hair, round tortoiseshell glasses, dark
    brown skin and a silver cuff on her right wrist, in an indigo linen shirt and charcoal trousers,
    holding a roll of drawings under her left arm. The terrace: a long concrete planter of tall
    grasses along the west edge; a single young frangipani in a round pot at the north-east corner;
    a wooden deck with a low teak bench in the middle; a steel railing with a view of the city to
    the east. Produce the view below of her standing beside the bench.
  set_members:
    mode: separate
    must_stay_same:
      - "Her face, glasses, hair, skin tone; silver cuff on the right wrist; drawings under her left arm"
      - "Indigo shirt, charcoal trousers"
      - "Planter west, frangipani pot north-east, bench middle, city to the east"
    members:
      - {name: "Front", prompt: "From the front at eye level, 50 mm.", checks: [[set_consistency, "Is the cuff on her right wrist?"], [set_consistency, "Are the drawings under her left arm?"]]}
      - {name: "From the planter", prompt: "From among the grasses on the west, 35 mm, city behind her.", checks: [[prompt_adherence, "Is the city behind her?"], [physics_plausibility, "Are grasses soft in the foreground?"]]}
      - {name: "From behind", prompt: "From behind her looking at the city.", checks: [[prompt_adherence, "Is the bench beside her?"], [set_consistency, "Is her hair the same?"]]}
      - {name: "High", prompt: "From a water-tank platform above, looking down.", checks: [[prompt_adherence, "Is the frangipani pot at the north-east corner?"], [prompt_adherence, "Is it a high view?"]]}
      - {name: "Detail", prompt: "Close on her hand with the cuff and the drawing roll.", checks: [[set_consistency, "Is it a silver cuff?"], [visual_quality, "Is her hand natural?"]]}
  deliverable: "Five images, 4:5."
  checks:
    - [set_consistency, "Is she the same woman in all five?"]
    - [set_consistency, "Is the cuff on her right wrist in every view that shows it?"]
    - [set_consistency, "Are the drawings under her left arm in every view?"]
    - [set_consistency, "Is her skin tone the same in all five?"]
    - [set_consistency, "Is the terrace layout the same in all five?"]
    - [prompt_adherence, "Is it golden hour from one direction in all five?"]
    - [prompt_adherence, "Does each view match its description?"]
    - [prompt_adherence, "Is she the only person?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are hands and glasses clean?"]
    - [style, "Is the grade consistent?"]
    - [set_consistency, "Are her glasses round tortoiseshell?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Five text-to-image calls with one brief; set agreement needs the set review."}
  video_followon: ""

- id: COV-RES-10
  title: "A described penthouse terrace party of eight people from five angles"
  persona: "Luxury developer's agency making lifestyle images for a penthouse before it is finished."
  evidence: "Earlier bank IMG-VIEW-38 and IMG-VIEW-59 (headcount in groups) were high tier; here the group is described in text only."
  levers: [set, count, identity, layout, long-brief, light-lock]
  prompt: |
    A penthouse terrace party in Mumbai at night, stylised 3D architectural render with realistic
    people, 16:9. The terrace: an infinity pool along the sea-facing west edge, lit cyan from
    within; a long dining table on the east side under a pergola strung with warm bulbs; a bar
    counter at the north end. Exactly eight guests: a man in a white linen suit and a woman in a red
    gown by the pool; three friends (a woman in yellow, a man in black, a man in a blue kurta)
    standing at the bar; a couple in green and grey seated at the table; and a bartender in a
    black apron behind the bar. Produce the view described below of this exact moment.
  set_members:
    mode: separate
    must_stay_same:
      - "Exactly eight people in the stated places and colours"
      - "Pool west, table under the pergola east, bar north"
      - "Cyan pool light, warm bulbs over the table"
    members:
      - {name: "From the table", prompt: "From the dining table looking west to the pool and the sea.", checks: [[prompt_adherence, "Are the two by the pool visible?"], [prompt_adherence, "Is the pool glowing cyan ahead?"]]}
      - {name: "From the pool", prompt: "From the pool's edge looking east to the table.", checks: [[prompt_adherence, "Is the seated couple at the table?"], [prompt_adherence, "Are warm bulbs over the table?"]]}
      - {name: "From the bar", prompt: "Over the bartender's shoulder looking south across the terrace.", checks: [[prompt_adherence, "Are the three friends at the bar in front?"], [prompt_adherence, "Is the pool on the right?"]]}
      - {name: "Overhead", prompt: "Straight down from above the terrace.", checks: [[prompt_adherence, "Are there exactly eight people?"], [prompt_adherence, "Is the layout pool west, table east, bar north?"]]}
      - {name: "Pool couple close", prompt: "Medium shot of the man in white and the woman in red by the pool.", checks: [[set_consistency, "Are their outfits white linen and red gown?"], [prompt_adherence, "Is cyan pool light on their faces from below?"]]}
  deliverable: "Five images, 16:9."
  checks:
    - [prompt_adherence, "Are there exactly eight people wherever the whole terrace is seen?"]
    - [set_consistency, "Is each guest in the same place and colour in all five?"]
    - [set_consistency, "Is the bartender behind the bar in every view that shows it?"]
    - [set_consistency, "Is the terrace layout the same in all five?"]
    - [prompt_adherence, "Is the pool cyan and the bulbs warm in every view?"]
    - [prompt_adherence, "Does each view match its description?"]
    - [prompt_adherence, "Are there no extra people?"]
    - [text_accuracy, "Is there no text?"]
    - [style, "Is the render style the same?"]
    - [visual_quality, "Are faces and hands clean?"]
    - [physics_plausibility, "Are reflections in the pool consistent?"]
    - [prompt_adherence, "Is the sea to the west in every view that shows it?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Five text-to-image calls with one brief; set agreement needs the set review."}
  video_followon: ""
