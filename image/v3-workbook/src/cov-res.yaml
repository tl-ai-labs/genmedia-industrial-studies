# Multi-angle coverage — Real estate, interiors & architecture scenarios. Slots: cov.yaml.
code: COV
scenarios:

- id: COV-RES-01
  seed: true
  title: "One listing living room from five positions, every object where it is"
  persona: "Listing photographer for a Mumbai property portal who has one wide photo of a flat and needs the full room set before the flat is let."
  evidence: "Call at 17:26: 'say you're all sitting in a room and they want five shots of the same setup from different camera angles: is there consistency?' Earlier bank IMG-VIEW-29 (kitchen from the opposite corner) was one view; this is five, including the reverse from the window, which must show the entrance wall the photo never shows."
  levers: [set, layout, unseen, camera, light-lock, keep-rest, locale]
  inputs:
    - {source: SRC-RES-LIVING-FLAT, role: source, note: "the one wide listing photo, from the entrance corner"}
  prompt: |
    This is a real-estate listing photo of a living room, taken from the entrance corner. Produce
    one more photo of the same room at the same moment, from the camera position described below,
    as a professional listing photographer would shoot it: chest height unless stated, verticals
    kept straight, the same natural daylight coming only from the balcony door, all ceiling
    lights off. Everything stays exactly where it is: the grey sofa on the left wall with the
    newspapers on its left cushion and the framed print above it; the kitchen doorway and the
    snake plant at the back left; the sliding balcony door with the laundry rack outside; the TV,
    switched off, over the white console with its hanging wires on the right wall; the round
    coffee table on the beige rug in the centre; the fan and recessed lights; the white floor
    tiles. Do not tidy, add or restyle anything, and add no people. 3:2.
  set_members:
    mode: separate
    must_stay_same:
      - "Sofa on the left wall (as seen from the entrance), newspapers on its left cushion, print above"
      - "Kitchen doorway and snake plant beside the balcony wall, on the sofa side"
      - "Balcony door with the laundry rack outside"
      - "TV over the white console on the wall opposite the sofa, wires hanging"
      - "Round coffee table on the beige rug in the centre"
      - "Daylight only from the balcony; ceiling lights off; no people"
    members:
      - name: "From the balcony door, looking back"
        prompt: "Camera standing just inside the balcony door, 16 mm, looking back at the entrance. The sofa is now on the right, the TV wall on the left, and the entrance door, which the original never shows, is on the far wall: a plain wooden door with a shoe rack beside it."
        checks:
          - [prompt_adherence, "Is the sofa now on the right and the TV wall on the left?"]
          - [prompt_adherence, "Is the entrance wall shown with a wooden door and a shoe rack?"]
          - [prompt_adherence, "Is the light now coming from behind the camera, falling forward into the room?"]
      - name: "From the sofa"
        prompt: "Camera at seated eye height at the sofa's left end, 24 mm, looking across the coffee table to the TV."
        checks:
          - [prompt_adherence, "Is the camera at seated height looking across the table at the TV?"]
          - [preservation, "Are the wires still hanging below the console?"]
      - name: "From the TV"
        prompt: "Camera in front of the TV console, 20 mm, looking straight at the sofa and the print above it, the balcony door at the right edge of the frame."
        checks:
          - [prompt_adherence, "Is the balcony door at the right edge as seen from the TV?"]
          - [preservation, "Are the newspapers still on the sofa's left cushion (frame right from this side)?"]
      - name: "From the kitchen doorway"
        prompt: "Camera in the kitchen doorway, 18 mm, looking diagonally across the room towards the TV wall and the entrance corner."
        checks:
          - [prompt_adherence, "Is the view diagonal from the back-left doorway across to the TV and entrance?"]
          - [prompt_adherence, "Is the snake plant right beside the camera position?"]
      - name: "High corner"
        prompt: "Camera raised to 2.6 metres in the corner between the TV wall and the balcony, 14 mm, angled down so the whole floor is visible."
        checks:
          - [prompt_adherence, "Is the camera high in the TV-balcony corner, looking down over the floor?"]
          - [prompt_adherence, "Are the sofa, table, rug and TV in a layout that matches the original?"]
          - [visual_quality, "Are the verticals still straight near the frame centre?"]
  deliverable: "Five images, 3:2, one per member."
  checks:
    - [set_consistency, "Is the sofa on the same wall, facing the TV, in every view?"]
    - [set_consistency, "Are the newspapers on the same cushion in every view where the sofa is seen?"]
    - [set_consistency, "Is the snake plant beside the kitchen doorway in every view that shows that corner?"]
    - [set_consistency, "Is the laundry rack visible on the balcony in every view facing the balcony?"]
    - [set_consistency, "Is the TV off, over the white console with wires hanging, in every view?"]
    - [set_consistency, "Is the round table on the beige rug at the room's centre in every view?"]
    - [set_consistency, "Is the flooring the same white tile everywhere?"]
    - [prompt_adherence, "Does daylight come only from the balcony door in all five, with the ceiling lights off?"]
    - [prompt_adherence, "Does each view's camera position match its description?"]
    - [prompt_adherence, "Are verticals straight in every view, as listing photography requires?"]
    - [physics_plausibility, "Do the room's proportions stay plausible, with no wall stretching or shrinking between views?"]
    - [prompt_adherence, "Is nothing tidied, added or restyled in any view?"]
    - [prompt_adherence, "Are there no people in any view?"]
    - [text_accuracy, "Is there no text or watermark in any view?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Each member runs as its own image edit from the same base. Whole-set agreement needs the set review."}
  video_followon: "V1: a walkthrough camera move from the entrance to the balcony through the same room."

- id: COV-RES-02
  title: "Empty bedroom from all four corners and the window; window and wardrobe keep their sizes"
  persona: "Builder's sales team making a full set of views of a show flat's bedroom from one photo."
  evidence: "Earlier bank IMG-VIEW-06 (room to high corner) was high tier; an empty room has few cues, so scale drifts easily."
  levers: [set, unseen, physics, camera, light-lock]
  inputs: [{source: SRC-RES-BEDROOM, role: source}]
  prompt: |
    This is an empty bedroom of about 3.5 by 4 metres: off-white walls, grey-beige tiles, a wide
    three-pane black-framed window on the far wall with a hill view, three panels of golden
    sunlight on the floor, a three-shutter white wardrobe on the right wall, a switchboard and an
    air-conditioner outlet on the left wall. Produce one more view of the same room at the same
    moment from the position below. The door wall, which the photo never shows, has a plain white
    door and a light switch beside it. The room keeps its true size. Photoreal, 3:2, verticals
    straight, no furniture.
  set_members:
    mode: separate
    must_stay_same:
      - "Room about 3.5 by 4 metres; three-pane window; three-shutter wardrobe"
      - "Switchboard and AC outlet on the left wall; plain door on the door wall"
      - "Three sun panels on the floor; no furniture"
    members:
      - {name: "Window corner left", prompt: "From the corner left of the window looking back across the room, 18 mm.", checks: [[prompt_adherence, "Is the wardrobe on the far side and the door ahead?"], [physics_plausibility, "Does the room size look the same?"]]}
      - {name: "Window corner right", prompt: "From the corner right of the window, 18 mm.", checks: [[prompt_adherence, "Is the wardrobe beside the camera?"], [prompt_adherence, "Do the sun panels fall toward the door?"]]}
      - {name: "Door corner right", prompt: "From the door-side corner by the wardrobe, 18 mm, towards the window.", checks: [[physics_plausibility, "Is the window the same width relative to the wall?"], [prompt_adherence, "Does the wardrobe have three shutters?"]]}
      - {name: "Door corner left", prompt: "From the door-side corner by the switchboard, 18 mm.", checks: [[prompt_adherence, "Is the switchboard beside the camera?"], [physics_plausibility, "Does the wardrobe look the right size across the room?"]]}
      - {name: "From the window", prompt: "From the window looking straight back at the door, 20 mm.", checks: [[prompt_adherence, "Is the door wall a plain white door with a switch?"], [prompt_adherence, "Is the sun behind the camera?"]]}
  deliverable: "Five images, 3:2."
  checks:
    - [physics_plausibility, "Is the room the same size in all five?"]
    - [prompt_adherence, "Does the window have three panes in every view that shows it?"]
    - [prompt_adherence, "Does the wardrobe have three shutters in every view that shows it?"]
    - [set_consistency, "Are the switchboard and AC outlet on the same wall in every view?"]
    - [prompt_adherence, "Do the sun panels on the floor agree with the window's position?"]
    - [set_consistency, "Is the door wall the same in every view that shows it?"]
    - [prompt_adherence, "Does each view match its description?"]
    - [visual_quality, "Are verticals straight?"]
    - [prompt_adherence, "Is the room empty?"]
    - [text_accuracy, "Is there no text?"]
    - [style, "Is the grade the same?"]
    - [set_consistency, "Is the hill view the same through the window?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Five image edits from one base; set agreement needs the set review."}
  video_followon: ""

- id: COV-RES-03
  title: "The villa from its front photo: both sides, rear garden and a drone view"
  persona: "Developer's marketing lead who has only the front elevation of a sold-out show villa and needs the other sides for the brochure."
  evidence: "Earlier bank IMG-VIEW-31 (building front to side elevation) and IMG-VIEW-08 (street-level to drone) were high tier."
  levers: [set, unseen, layout, camera, light-lock, locale]
  inputs: [{source: SRC-RES-VILLA-EXT, role: source}]
  prompt: |
    This is the front elevation of a contemporary two-storey villa: a white ground floor with a teak
    wall on the left and a wide glass door on the right; an exposed-concrete upper floor
    cantilevered two metres over the right side with a long horizontal window; an empty swing on
    the porch under the overhang; a black gate, a granite boundary wall and a frangipani on the
    left of the lawn. Produce one more view of the same villa from the position below. The sides
    and rear, which the photo never shows, follow the same materials: the rear has a full-width
    glass wall onto a lawn with a small plunge pool. Mid-morning sun from the left of the front
    view. Photoreal, 3:2, verticals straight.
  set_members:
    mode: separate
    must_stay_same:
      - "White ground floor, teak wall, glass door, concrete upper floor overhanging the right"
      - "Swing under the overhang; frangipani on the left of the front lawn"
      - "Rear: full-width glass wall, lawn and plunge pool"
      - "Mid-morning sun from the front-left"
    members:
      - {name: "Left side", prompt: "From the left side lawn, 24 mm.", checks: [[prompt_adherence, "Is the frangipani near the camera?"], [reference_fidelity, "Is the teak wall's return visible?"]]}
      - {name: "Right side", prompt: "From the right side under the overhang, 20 mm, looking along the porch.", checks: [[physics_plausibility, "Is the overhang visibly cantilevered above?"], [reference_fidelity, "Is the swing under it?"]]}
      - {name: "Rear", prompt: "From the rear garden looking back at the house.", checks: [[prompt_adherence, "Is the rear a full-width glass wall with a lawn and plunge pool?"], [prompt_adherence, "Is the overhang now on frame left?"]]}
      - {name: "Drone", prompt: "Drone from 40 metres, front-left, looking down.", checks: [[prompt_adherence, "Is the upper floor's overhang on the right of the front?"], [prompt_adherence, "Is the pool at the rear?"]]}
      - {name: "Gate view", prompt: "Through the open gate at standing height, 35 mm.", checks: [[prompt_adherence, "Is the gate framing the view?"], [prompt_adherence, "Is the sun from the left?"]]}
  deliverable: "Five images, 3:2."
  checks:
    - [set_consistency, "Is the massing the same in all five: overhang on one side?"]
    - [set_consistency, "Are the materials the same on every side?"]
    - [set_consistency, "Is the swing under the overhang wherever visible?"]
    - [set_consistency, "Is the frangipani on the same side of the front lawn?"]
    - [set_consistency, "Are the rear glass wall and pool the same in the views that show them?"]
    - [prompt_adherence, "Is the sun in one world direction with shadows agreeing?"]
    - [prompt_adherence, "Does each view match its description?"]
    - [visual_quality, "Are verticals straight?"]
    - [prompt_adherence, "Are there no people or cars?"]
    - [text_accuracy, "Is there no house number or text?"]
    - [physics_plausibility, "Are the house's proportions consistent?"]
    - [style, "Is the grade consistent?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Five image edits from one base; set agreement needs the set review."}
  video_followon: "V1: a drone orbit around the villa."

- id: COV-RES-04
  title: "Drone orbit of a tower at four compass bearings plus a top view"
  persona: "Developer's site-progress team producing the monthly drone set from one available frame."
  evidence: "Earlier bank IMG-VIEW-08 (street to drone) was high tier; compass-bearing views test whether each face shows what it should."
  levers: [set, camera, layout, unseen, light-lock]
  inputs: [{source: SRC-RES-TOWER-SITE, role: source}]
  prompt: |
    This drone photo shows a nearly finished 22-storey residential tower from the south-east: zig-zag
    balconies on the south face (frame left), a plain east face with one vertical window strip
    (frame right), a blue lift room on the roof, a yellow crane at the north-east corner, site
    cabins and a green fence at the base, a main road along the south. Produce one more drone
    view of the same moment from the bearing described below, at the same height and distance.
    The north and west faces, which the photo never shows, are plain with regular window rows.
    Harsh noon sun. Photoreal, 16:9, no readable signs.
  set_members:
    mode: separate
    must_stay_same:
      - "South face zig-zag balconies; east face single window strip; north and west faces with regular windows"
      - "Blue lift room on the roof; yellow crane at the north-east corner"
      - "Site cabins and green fence; main road to the south"
    members:
      - {name: "From the north-east", prompt: "Drone from the north-east at the same height.", checks: [[prompt_adherence, "Is the crane in the near foreground?"], [reference_fidelity, "Is the east face's window strip visible?"]]}
      - {name: "From the north-west", prompt: "Drone from the north-west.", checks: [[reference_fidelity, "Are the north and west faces plain with regular windows?"], [prompt_adherence, "Is the crane on the far side?"]]}
      - {name: "From the south-west", prompt: "Drone from the south-west.", checks: [[reference_fidelity, "Are the zig-zag balconies visible on the near south face?"], [prompt_adherence, "Is the road in front?"]]}
      - {name: "From the south", prompt: "Drone due south, face-on to the balconies.", checks: [[prompt_adherence, "Is the south face square to the camera?"], [prompt_adherence, "Is the crane peeking at the right edge?"]]}
      - {name: "Top", prompt: "Straight down over the roof.", checks: [[reference_fidelity, "Is the lift room blue?"], [prompt_adherence, "Is the crane at the north-east corner?"]]}
  deliverable: "Five images, 16:9."
  checks:
    - [set_consistency, "Does each face show the right treatment from each bearing?"]
    - [set_consistency, "Is the crane at the north-east corner in every view?"]
    - [set_consistency, "Is the lift room blue in every view that shows the roof?"]
    - [prompt_adherence, "Is the tower 22 storeys in every view that shows its height?"]
    - [prompt_adherence, "Is the road to the south in every view that shows it?"]
    - [prompt_adherence, "Is the noon sun high with short shadows in all five?"]
    - [prompt_adherence, "Does each view match its bearing?"]
    - [text_accuracy, "Are there no readable signs?"]
    - [visual_quality, "Are lines straight and the building undistorted?"]
    - [style, "Is the look consistent?"]
    - [set_consistency, "Are the site cabins and fence at the base in every view?"]
    - [prompt_adherence, "Is it the same height and distance in each view?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Five image edits from one base; set agreement needs the set review."}
  video_followon: "V1: a full drone orbit."

- id: COV-RES-05
  title: "Five eye-level rendered views from a floor plan's numbered camera marks"
  persona: "Architectural visualiser producing a client's first look at a flat from the plan alone."
  evidence: "Earlier bank IMG-VIEW-07 (room to top-down layout) was high tier; the reverse, plan to eye-level views, is the archviz task."
  levers: [set, layout, camera, count, unseen, long-brief]
  inputs: [{source: SRC-RES-PLAN, role: source}]
  prompt: |
    This is the floor plan of a three-bedroom flat with seven labelled rooms and five numbered camera
    marks, each with an arrow showing the view direction. Produce the eye-level interior render for
    the camera mark named below, at 1.5 metres height, 18 mm, as a finished evening architectural
    visualisation: warm interior lights on, white walls, light oak floors, the furniture drawn on
    the plan in the places it is drawn (a three-seat sofa and TV wall in the living room, a six-seat
    table in the dining area, a double bed in each bedroom). What the view shows must agree with
    the plan: which rooms are visible, which walls and openings. Photoreal, 3:2, no text.
  set_members:
    mode: separate
    must_stay_same:
      - "Room layout and openings as drawn on the plan"
      - "Furniture where the plan draws it"
      - "White walls, oak floors, warm evening interior light"
    members:
      - {name: "Mark 1", prompt: "Camera mark 1: living-room corner by the entrance looking towards the balcony.", checks: [[prompt_adherence, "Is the balcony ahead with the sofa and TV wall where the plan shows?"], [prompt_adherence, "Is dining visible to the side as the plan shows?"]]}
      - {name: "Mark 2", prompt: "Camera mark 2: in dining looking into the kitchen.", checks: [[prompt_adherence, "Is the dining table six-seat?"], [prompt_adherence, "Is the kitchen ahead through its opening?"]]}
      - {name: "Mark 3", prompt: "Camera mark 3: in the BED 1 doorway looking at the bed.", checks: [[reference_fidelity, "Is there a double bed?"], [prompt_adherence, "Does the room's window sit where the plan's outer wall is?"]]}
      - {name: "Mark 4", prompt: "Camera mark 4: on the balcony looking back into the living room.", checks: [[prompt_adherence, "Is the sofa on the side the plan shows from this direction?"], [prompt_adherence, "Is the interior lit warm against the evening outside?"]]}
      - {name: "Mark 5", prompt: "Camera mark 5: in the kitchen looking out to dining.", checks: [[prompt_adherence, "Is the dining table ahead?"], [prompt_adherence, "Is the view from inside the kitchen?"]]}
  deliverable: "Five images, 3:2."
  checks:
    - [prompt_adherence, "Does every view agree with the plan's rooms and openings?"]
    - [prompt_adherence, "Is furniture where the plan draws it in every view?"]
    - [prompt_adherence, "Does each view come from its numbered mark and face its arrow's direction?"]
    - [set_consistency, "Are materials the same across the five: white walls, oak floor?"]
    - [prompt_adherence, "Is it warm evening interior light in all five?"]
    - [set_consistency, "Do shared spaces (living, dining) look the same from different marks?"]
    - [prompt_adherence, "Are the counts right: one sofa, six chairs, one double bed per bedroom?"]
    - [visual_quality, "Are verticals straight?"]
    - [text_accuracy, "Is there no text?"]
    - [prompt_adherence, "Are there no people?"]
    - [style, "Is the render quality the same across the five?"]
    - [physics_plausibility, "Are room proportions plausible for the plan?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Five image edits from one plan; set agreement needs the set review."}
  video_followon: "V1: a walkthrough from mark 1 to mark 2."

- id: COV-RES-06
  title: "Goa plot from its four corners and a drone; marker, trees and stream bed stay put"
  persona: "Land broker making a full photo set of a plot from the one photo taken on the site visit."
  evidence: "Landscapes with few landmarks are where layout drifts; four fixed landmarks make it checkable."
  levers: [set, layout, camera, light-lock, locale]
  inputs: [{source: SRC-RES-PLOT-LAND, role: source}]
  prompt: |
    This photo shows an empty hillside plot in North Goa at golden hour from the access track at the
    bottom: a laterite survey marker in the lower left, two cashew trees mid-plot (the left one
    larger), a dry stream bed from the lower right up to the middle, an electricity pole at the top
    right by the ridge, coconut palms along the ridge, the sea as a thin line left of the ridge,
    tall dry grass, low sun from the right. Produce one more view of the same plot at the same
    moment from the position below. Every landmark keeps its place. Photoreal, 16:9, no buildings.
  set_members:
    mode: separate
    must_stay_same:
      - "Survey marker at the bottom-left corner of the plot"
      - "Two cashew trees mid-plot, the larger one west of the smaller"
      - "Dry stream bed from the bottom-right corner to the middle"
      - "Pole at the top-right by the ridge; sea beyond the ridge's west end; low sun"
    members:
      - {name: "Top-left corner", prompt: "From the top-left corner by the ridge looking down the plot.", checks: [[prompt_adherence, "Is the marker now at the far right bottom?"], [prompt_adherence, "Is the pole across at the other top corner?"]]}
      - {name: "Top-right corner", prompt: "From beside the pole looking down the plot.", checks: [[reference_fidelity, "Is the pole beside the camera?"], [prompt_adherence, "Does the stream bed run from the far left?"]]}
      - {name: "Bottom-right corner", prompt: "From the bottom-right corner where the stream bed starts.", checks: [[prompt_adherence, "Does the stream bed lead away from the camera?"], [prompt_adherence, "Is the sun beside the camera's right?"]]}
      - {name: "From the trees", prompt: "From between the two cashew trees looking down to the track.", checks: [[prompt_adherence, "Is the larger tree on the camera's right?"], [prompt_adherence, "Is the track below?"]]}
      - {name: "Drone", prompt: "Drone straight down from 50 metres, ridge at the top.", checks: [[prompt_adherence, "Are all four landmarks in their places?"], [prompt_adherence, "Are there two cashew trees?"]]}
  deliverable: "Five images, 16:9."
  checks:
    - [set_consistency, "Is every landmark in a consistent place across the five?"]
    - [prompt_adherence, "Are there two cashew trees in every view that shows them?"]
    - [set_consistency, "Is the left cashew larger in every view?"]
    - [set_consistency, "Is the stream bed the same course in all five?"]
    - [prompt_adherence, "Is the low sun in one world direction with shadows agreeing?"]
    - [prompt_adherence, "Does each view match its position?"]
    - [prompt_adherence, "Are there no buildings, people or vehicles?"]
    - [prompt_adherence, "Is the sea visible beyond the ridge's west end where it should be?"]
    - [style, "Is the grade golden in all five?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Is the grass natural, not repeating?"]
    - [reference_fidelity, "Is the marker laterite red?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: partly, note: "Five image edits from one base; set agreement needs the set review."}
  video_followon: "V1: a drone rise from the track to the ridge."

