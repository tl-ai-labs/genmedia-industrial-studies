# Storyboards — Advertising & agencies scenarios. Slots: stb.yaml.
code: STB
scenarios:

- id: STB-ADS-01
  seed: true
  title: "20-second chips commercial board with the brand mascot, eight time-coded panels"
  persona: "Art director at a Mumbai agency preparing the client board for a snack commercial; the animation studio will build the film from it."
  evidence: "Call at 23:45: storyboards with a lot of text are what customers compare tools on, and they make videos from them. Earlier bank IMG-GAME-39 (four-panel beat) held identity at one camera distance; this board changes shot size every panel and carries a mascot and a pack."
  levers: [count, exact-text, time-code, identity, multi-ref, continuity, camera]
  inputs:
    - {source: SRC-ADS-MASCOT, role: source, note: "the mascot, Chotu Mirchi"}
    - {source: SRC-ADS-CHIPS, role: reference, note: "the pack for panels 3, 7 and 8"}
  prompt: |
    Using this mascot and this chips pack, draw the client storyboard for a 20-second commercial
    as one image: eight panels in a four-by-two grid, read left to right, top row first. Each
    panel is a finished 3D animatic frame in the mascot's own polished 3D style, in 16:9, with a
    caption bar underneath carrying exactly the text given:

    1 · 0:00–0:03 · WS · Hostel room at night, books everywhere
    2 · 0:03–0:05 · CU · Riya sighs at the clock: 2 a.m.
    3 · 0:05–0:08 · MS · Chotu bursts out of the pack
    4 · 0:08–0:11 · MCU · Chotu: Mood off? Mirchi on!
    5 · 0:11–0:14 · WS · The room turns into a dance floor
    6 · 0:14–0:16 · Insert · One chip cracks in slow motion
    7 · 0:16–0:18 · MS · Friends pile in and grab the pack
    8 · 0:18–0:20 · Packshot · Mirchi Mood Masala Blast, ₹20

    Riya is a college student of about nineteen with a messy bun, round glasses and an oversized
    purple sweatshirt; she is the same person in panels 1, 2, 5 and 7. The room is the same small
    hostel room throughout: a desk with a green lamp on the left, a bunk bed on the right, a
    window behind with the night sky; in panel 5 the same room is lit with pink and cyan party
    light. Chotu must stay exactly the reference: the stalk quiff curling to his left, one gold
    tooth on his right side, four-fingered white gloves, white sneakers with red laces. The pack
    must stay exactly the reference wherever it appears, with "Mirchi Mood", "Masala Blast" and
    "₹20" readable in panels 3 and 8. Each drawing matches its caption's shot size. Panel 8 is a
    clean packshot: the pack upright, centred, Chotu leaning on its right side, on a red
    background. No other text, no logos besides the pack, no extra characters beyond Riya, two
    friends in panel 7 and Chotu.
  exact_text:
    - "1 · 0:00–0:03 · WS · Hostel room at night, books everywhere"
    - "2 · 0:03–0:05 · CU · Riya sighs at the clock: 2 a.m."
    - "3 · 0:05–0:08 · MS · Chotu bursts out of the pack"
    - "4 · 0:08–0:11 · MCU · Chotu: Mood off? Mirchi on!"
    - "5 · 0:11–0:14 · WS · The room turns into a dance floor"
    - "6 · 0:14–0:16 · Insert · One chip cracks in slow motion"
    - "7 · 0:16–0:18 · MS · Friends pile in and grab the pack"
    - "8 · 0:18–0:20 · Packshot · Mirchi Mood Masala Blast, ₹20"
  deliverable: "One landscape image, eight 16:9 panels in a 4×2 grid with captions."
  checks:
    - [prompt_adherence, "Are there exactly eight panels in a four-by-two grid?"]
    - [text_accuracy, "Does every caption match its given text exactly?"]
    - [text_accuracy, "Do the time codes run 0:00 to 0:20 with no gap or overlap?"]
    - [prompt_adherence, "Is panel 2 a close-up of Riya with a clock showing 2 o'clock?"]
    - [prompt_adherence, "Is panel 6 a frame-filling insert of a single chip cracking?"]
    - [prompt_adherence, "Is panel 5 a wide shot showing the whole room?"]
    - [reference_fidelity, "Is Chotu's stalk quiff curling to his left in every panel he is in?"]
    - [reference_fidelity, "Is Chotu's gold tooth on his right side wherever his grin shows?"]
    - [reference_fidelity, "Does Chotu keep four-fingered white gloves and red-laced white sneakers throughout?"]
    - [reference_fidelity, "Does the pack match the reference: red, yellow sunburst, mascot face, Mirchi Mood, Masala Blast, ₹20?"]
    - [text_accuracy, "Are Mirchi Mood, Masala Blast and ₹20 readable on the pack in panels 3 and 8?"]
    - [set_consistency, "Is Riya the same person (bun, round glasses, purple sweatshirt) in panels 1, 2, 5 and 7?"]
    - [set_consistency, "Is it the same room in every interior panel: desk and green lamp left, bunk right, window behind?"]
    - [prompt_adherence, "Is panel 5 lit with pink and cyan party light while the rest keep the lamp-lit night look?"]
    - [prompt_adherence, "Are there exactly two friends besides Riya in panel 7, and no extra characters elsewhere?"]
    - [composition, "Is panel 8 a clean packshot with the pack centred and Chotu leaning on its right side?"]
    - [style, "Are all eight panels in the same 3D style as the mascot reference?"]
    - [visual_quality, "Are hands and gloves drawn with the right number of fingers?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with two inputs."}
  video_followon: "V2 and V5: panels 3 and 4 as storyboard panel to shot with the mascot and pack held."

- id: STB-ADS-02
  title: "Nine-panel SUV commercial board climbing the ghat road"
  persona: "Agency art director boarding an SUV launch film for client approval."
  evidence: "Car films are boarded tightly with shot sizes and moves; the car must stay one design."
  levers: [count, exact-text, camera, identity, continuity]
  inputs: [{source: SRC-ADS-SUV, role: source}]
  prompt: |
    Using this hero frame of a white badge-less SUV on a Western Ghats hairpin at golden hour,
    draw a nine-panel commercial storyboard in marker sketch, three by three, 2.39:1 frame lines,
    captions exactly:

    1 · Mist in the valley · EWS · Crane down
    2 · SUV enters the hairpin · WS · Pan left
    3 · Tyre grips the bend · Insert · Static
    4 · Driver's hands on the wheel · CU · Static
    5 · SUV climbs past camera · MS · Whip pan
    6 · Aerial, road like a ribbon · EWS · Drone
    7 · Sunlight across the bonnet · CU · Track
    8 · SUV parks at the top · WS · Static
    9 · End frame, sun behind · WS · Static

    The SUV keeps its exact shape in every panel, with no badges. It climbs from frame right to
    frame left through panels 2 to 5. The low sun stays on the right. No other text.
  exact_text:
    - "1 · Mist in the valley · EWS · Crane down"
    - "5 · SUV climbs past camera · MS · Whip pan"
    - "9 · End frame, sun behind · WS · Static"
  deliverable: "One landscape image, nine panels."
  checks:
    - [prompt_adherence, "Are there exactly nine panels?"]
    - [text_accuracy, "Are the captions exact?"]
    - [reference_fidelity, "Is the SUV the same design in every panel?"]
    - [set_consistency, "Does it climb from frame right to left in panels 2 to 5?"]
    - [prompt_adherence, "Is the sun on the right throughout?"]
    - [prompt_adherence, "Is panel 3 an insert of a tyre on the bend?"]
    - [prompt_adherence, "Is panel 6 an aerial of the winding road?"]
    - [prompt_adherence, "Do the moves carry arrows or marks?"]
    - [prompt_adherence, "Are there no badges or lettering on the car?"]
    - [style, "Is the marker style consistent?"]
    - [visual_quality, "Are the car's proportions consistent?"]
    - [prompt_adherence, "Is panel 9 an end frame with the sun behind the car?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""

- id: STB-ADS-03
  title: "Six-panel colour board of the Diwali ad with Hindi voice-over captions"
  persona: "Agency copywriter and art director presenting a festive spot in Hindi to the client."
  evidence: "Devanagari captions on a board are where garbled matras show."
  levers: [count, exact-text, script, identity, locale, light-lock]
  inputs: [{source: SRC-ADS-DIWALI-FAMILY, role: source}]
  prompt: |
    Using this frame of a family on a Diwali balcony, draw a six-panel colour storyboard in warm
    gouache tones, two rows of three, 16:9 frame lines. Under each panel, the voice-over line in
    Devanagari, exactly:

    1 · "हर साल की तरह..."
    2 · "दादाजी की कहानियाँ,"
    3 · "माँ के हाथों के दीये,"
    4 · "पापा की मिठाइयाँ,"
    5 · "और गुड़िया की रंगोली।"
    6 · "दिवाली, घर जैसी।"

    Panel 2 shows the grandfather telling a story; 3 the mother lighting diyas; 4 the father with
    sweets; 5 the girl's rangoli; 6 the whole family together, the fireworks above. Each person
    looks the same as in the photo. The diyas are the warm main light. No other text.
  exact_text:
    - "हर साल की तरह..."
    - "दादाजी की कहानियाँ,"
    - "माँ के हाथों के दीये,"
    - "पापा की मिठाइयाँ,"
    - "और गुड़िया की रंगोली।"
    - "दिवाली, घर जैसी।"
  deliverable: "One landscape image, six colour panels."
  checks:
    - [prompt_adherence, "Are there exactly six panels?"]
    - [text_accuracy, "Is every Devanagari line exact, including punctuation?"]
    - [prompt_adherence, "Does each panel show the person its line names?"]
    - [reference_fidelity, "Are the four family members the same as in the photo?"]
    - [prompt_adherence, "Is the whole family of four in panel 6?"]
    - [prompt_adherence, "Is warm diya light the main light throughout?"]
    - [prompt_adherence, "Is the rangoli round in panel 5?"]
    - [style, "Is the gouache style consistent?"]
    - [prompt_adherence, "Are fireworks visible in panel 6?"]
    - [visual_quality, "Are faces and hands clean?"]
    - [prompt_adherence, "Are there no extra people?"]
    - [text_accuracy, "Is there no other text?"]
  competitor: "GPT Image 2 (high)"
  runnable_today: {status: "yes", note: "One image edit with one input."}
  video_followon: ""

