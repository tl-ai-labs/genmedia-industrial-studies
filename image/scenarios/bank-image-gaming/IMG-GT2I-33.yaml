id: IMG-GT2I-33
modality: image
task: text_to_image
title: Upside-down spinning kick
params:
  size: 1536x1024
  aspect_ratio: '16:9'
prompt: 'A frozen moment from a 3D arcade fighting game: a female kung-fu fighter spins upside down in
  mid-air, supported on nothing, her legs split straight out to both sides like helicopter blades, arms
  tucked. Her hair is in two buns wrapped in white ribbons; she wears a white and pale-blue tunic with
  a long back panel lined in pink, and light-blue leggings. Motion streaks circle her legs. Stage: a busy
  Chinese night market with red lanterns and a pagoda gate. Side-on camera, stylised realistic 3D, no
  on-screen display.'
expected: 'Upside-down spinning kick. Capability under test: Action frozen mid-motion. Adherence clauses,
  check each: 1) Body is upside down with legs split horizontally  2) Pose is physically believable: hips
  centred, no twisted limbs  3) Hair buns with white ribbons and the listed outfit colours  4) Motion
  streaks follow the direction of spin  5) Red lanterns and pagoda gate behind'
checks:
  min_width: 1000
  min_height: 540
  formats:
  - png
  - jpeg
  not_blank: true
