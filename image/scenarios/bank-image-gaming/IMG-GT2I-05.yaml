# Test type: T2I-11 An action frozen mid-motion with believable body position
id: IMG-GT2I-05
modality: image
task: text_to_image
title: 'Batsman hits a massive six'
params:
  size: 1536x1024
  aspect_ratio: '3:2'
prompt: 'T20 batsman hitting a massive six, ball flying into crowd, motion blur, dynamic angle, stadium floodlights, 70-200mm lens, ultra-realistic, high-speed photography style, 4K resolution'
expected: 'Batsman hits a massive six. Capability under test: An action frozen mid-motion with believable body position. Adherence clauses, check each: 1) Bat and body position read as a full-blooded shot  2) Ball is visible and heading toward the crowd  3) Floodlights present  4) Motion blur on bat or ball, face sharp  5) Correct anatomy: two arms, one bat, five fingers per hand'
checks:
  min_width: 1200
  min_height: 800
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- prompt_adherence
- visual_quality
- composition
- realism_style
weights:
  prompt_adherence: 0.45
  visual_quality: 0.2
  composition: 0.15
  realism_style: 0.2
tags:
- gaming-pilot
- real-cricket-24
- real
- text-to-image
