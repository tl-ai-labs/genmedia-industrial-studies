# Gaming pilot scenario IMG-GEDIT-07 (Real Cricket 24, Image Editing). Built from
# docs/sheets/gaming-scenarios-image.xlsx.
# Prompt origin: Real-based.
# Prompt source: https://kshare.in/prompt/ipl-2026-ai-photo-editing-prompts
# Test type: IEDIT-11 Change a character's expression or pose only
id: IMG-GEDIT-07
modality: image
task: image_edit
title: 'Standing batter to century celebration'
inputs:
  source: assets/bank/gaming/image/IMG-GEDIT-07-source.png
params:
  size: auto
prompt: 'Change the batter''s pose to removing the helmet after winning the match, helmet in one hand and bat raised in the other, sweat visible, emotional expression. Keep the same batter, kit, position on the pitch, camera and background.'
expected: 'Standing batter to century celebration. Capability under test: Change a character''s expression or pose only. Adherence clauses, check each: 1) Helmet is off the head and held in one hand  2) Bat raised in the other hand  3) Kit and body unchanged apart from pose  4) Feet still at the crease  5) Background identical'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  preservation:
    method: phash
    max_distance: 12
criteria:
- edit_fidelity
- preservation
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.333333
  preservation: 0.388889
  visual_quality: 0.166667
  realism_style: 0.111111
tags:
- gaming-pilot
- real-cricket-24
- real-based
- image-editing
