# Gaming pilot — BGMI (Battlegrounds Mobile India)
# Complexity tier: medium
# Inputs: source = IMG-BG-base-jeep.png — provenance in sidecar .json
id: IMG-BG-09
modality: image
task: image_edit
title: Vehicle livery swap — military jeep to neon crate-drop livery
inputs:
  source: assets/bank/IMG-BG-base-jeep.png
params:
  size: auto
prompt: 'Repaint this military vehicle with a flashy battle-royale crate-drop
  livery: matte black base coat with neon orange geometric stripes along the
  flanks, a large white stencilled airdrop parachute icon on the hood, and
  glowing cyan underglow lights visible beneath the chassis. The vehicle shape,
  wheels, background and lighting stay exactly the same — only the paint and
  the added underglow change.'
expected: 'Vehicle livery swap. Capability under test: Surface repaint with
  multiple graphic elements while preserving the vehicle structure. Adherence
  clauses, check each: 1) Matte black base coat with neon orange geometric
  stripes on flanks  2) White parachute icon stencilled on the hood  3) Cyan
  underglow lights beneath the chassis  4) Vehicle shape, wheels and background
  unchanged'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- variants-&-progression
- scenario-bank-game-pilot
- bgmi
- tier-medium
