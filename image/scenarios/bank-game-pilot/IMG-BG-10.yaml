# Gaming pilot — BGMI (Battlegrounds Mobile India)
# Complexity tier: medium
# Inputs: source = IMG-BG-base-soldier.png — provenance in sidecar .json
id: IMG-BG-10
modality: image
task: image_edit
title: Add Winner Winner Chicken Dinner victory banner
inputs:
  source: assets/bank/IMG-BG-base-soldier.png
params:
  size: auto
prompt: 'Add a victory screen overlay to this image. Centre a large gold banner
  across the middle third reading WINNER WINNER CHICKEN DINNER in bold serif
  capitals with a subtle metallic sheen. Below the text, add a small golden
  chicken trophy icon. The banner should have a semi-transparent dark vignette
  behind it so the text is legible against the photograph. Add a confetti shower
  of gold and white particles falling from the top of the frame. The underlying
  photograph must remain fully visible and unchanged beneath the overlay.'
expected: 'Chicken Dinner victory banner. Capability under test: Text overlay
  with decorative elements composited onto a photograph. Adherence clauses,
  check each: 1) WINNER WINNER CHICKEN DINNER in gold serif capitals, centred
  2) Golden chicken trophy icon below the text  3) Semi-transparent dark vignette
  behind the banner for legibility  4) Gold and white confetti particles, underlying
  photo unchanged'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- text_accuracy
weights:
  edit_fidelity: 0.3
  visual_quality: 0.3
  text_accuracy: 0.4
tags:
- ui-overlay
- scenario-bank-game-pilot
- bgmi
- tier-medium
