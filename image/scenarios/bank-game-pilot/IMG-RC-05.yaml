# Gaming pilot — RC24 (Real Cricket 24)
# Complexity tier: low
# Inputs: source = IMG-RC-base-batsman.png — provenance in sidecar .json
id: IMG-RC-05
modality: image
task: image_edit
title: Recolour batting kit from white to yellow with dark-green trim
inputs:
  source: assets/bank/IMG-RC-base-batsman.png
params:
  size: auto
prompt: 'Change this batsman''s entire cricket kit to a T20 franchise colour scheme:
  bright yellow jersey and trousers with dark-green trim on the collar, sleeve cuffs
  and side stripes. The helmet should also change to yellow with a dark-green grille.
  Keep the batting stance, gloves, bat, pads, face, background and every other detail
  exactly the same — only the fabric colours change.'
expected: 'Kit recolour. Capability under test: Uniform-wide colour replacement
  across multiple garment pieces and a helmet. Adherence clauses, check each:
  1) Jersey and trousers changed to bright yellow  2) Dark-green trim on collar,
  cuffs and side stripes  3) Helmet recoloured to yellow with dark-green grille
  4) Batting stance, bat, pads, gloves, face and background unchanged'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- variants-&-progression
- scenario-bank-game-pilot
- rc24
- tier-low
