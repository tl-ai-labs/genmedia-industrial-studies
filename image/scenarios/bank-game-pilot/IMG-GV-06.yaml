modality: image
task: image_edit
title: Streetwear to tailored charcoal suit, same face
inputs:
  source: assets/bank/IMG-GV-base-man.png
params:
  size: auto
prompt: 'Change this person''s outfit to a tailored charcoal suit with a crisp white
