expected: 'Outfit swap to a suit. Capability under test: Full clothing replacement
  while preserving identity. Adherence clauses, check each: 1) Charcoal tailored
  suit with visible lapels and breast pocket  2) White shirt, open collar, no tie
  3) Silver wristwatch on left wrist  4) Face, hair, skin tone, pose and background
  unchanged'
