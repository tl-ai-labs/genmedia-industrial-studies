# Gaming pilot — GTA V (Grand Theft Auto V)
# Complexity tier: medium
# Inputs: source = IMG-GV-base-car.png — provenance in sidecar .json
id: IMG-GV-08
modality: image
task: image_edit
title: Muscle car livery swap — stock paint to racing stripes with sponsor decals
inputs:
  source: assets/bank/IMG-GV-base-car.png
params:
  size: auto
prompt: 'Repaint this muscle car with a racing livery. Base colour matte midnight
  blue. Add two parallel white racing stripes running from the hood over the roof
  to the trunk. On the driver-side door, add a white circular race number 7 inside
  a red roundel. On the front fender, add a small rectangular sponsor decal reading
  LS CUSTOMS in white block letters on a black background. Keep the car''s shape,
  wheels, chrome trim, background and lighting exactly the same — only the paint
  and decals change.'
expected: 'Racing livery swap. Capability under test: Multi-element surface
  repaint with specific decals and text on a vehicle. Adherence clauses, check
  each: 1) Matte midnight blue base coat  2) Two parallel white racing stripes
  hood to trunk  3) Number 7 in a red roundel on the door  4) LS CUSTOMS decal
  on the fender, car shape and background unchanged'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- text_accuracy
weights:
  edit_fidelity: 0.4
  visual_quality: 0.2
  text_accuracy: 0.4
tags:
- variants-&-progression
- scenario-bank-game-pilot
- gta-v
- tier-medium
