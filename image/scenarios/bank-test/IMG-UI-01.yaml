# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-UI-01 — "Login screen from spec"
id: IMG-UI-01
modality: image
task: text_to_image
title: "Login screen from spec"

prompt: |
  Design a mobile app login screen. Include: app name TIDEMARK at the top,
  an email field labelled Email, a password field labelled Password, a primary
  button reading Sign in, and a text link reading Forgot password.
  Light theme, 9:16.

params:
  size: "1024x1536"
  aspect_ratio: "9:16"

expected: |
  A mobile login screen in a light theme, portrait 9:16. All five elements
  present in the listed vertical order: TIDEMARK app name at top, an Email
  field, a Password field, a primary "Sign in" button, and a "Forgot password"
  text link. All label strings exact; a plausible, clean modern UI.

checks:
  min_width: 700
  min_height: 1000
  formats: [png, jpeg]
  not_blank: true
  # independent labels (sheet: "OCR all strings and match") — each matched on
  # its own; a single concatenated phrase would penalise interleaved
  # placeholder text between the labels
  must_read_text: ["TIDEMARK", "Email", "Password", "Sign in", "Forgot password"]

tags: [scenario-bank, ui, text-exact]
