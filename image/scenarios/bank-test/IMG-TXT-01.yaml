# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-TXT-01 — "Exact headline poster"
# (prompt verbatim from the sheet; run settings note "3 seeds" — this simple
# test run generates one output per model)
id: IMG-TXT-01
modality: image
task: text_to_image
title: "Exact headline poster"

prompt: |
  Design an event poster. The headline must read exactly: RIVERSIDE JAZZ FESTIVAL.
  Beneath it, exactly: 14 MARCH 2027 - PIER SIX. Modern sans-serif, high contrast,
  portrait orientation.

params:
  size: "1024x1536"
  aspect_ratio: "9:16"

expected: |
  An event poster in portrait orientation. Headline reads exactly
  "RIVERSIDE JAZZ FESTIVAL" with "14 MARCH 2027 - PIER SIX" beneath it,
  modern sans-serif, high contrast, clear typographic hierarchy, no spelling
  or kerning errors.

checks:
  min_width: 700
  min_height: 1000
  formats: [png, jpeg]
  not_blank: true
  must_read_text: "RIVERSIDE JAZZ FESTIVAL 14 MARCH 2027 PIER SIX"

tags: [scenario-bank, typography, text-exact]
