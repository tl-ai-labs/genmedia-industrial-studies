# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-UI-07 — prompt verbatim; weights follow the
# sheet's family guidance for 'UI mockups & layout'
id: IMG-UI-07
modality: image
task: text_to_image
title: Form with error states
prompt: 'Design a signup form showing a validation error. The email field must display
  the error text: Enter a valid email address. The field border must be red. Other
  fields appear normal.'
params:
  size: 1024x1536
  aspect_ratio: '9:16'
expected: 'Form with error states. Capability under test: Conditional state rendering.
  Adherence clauses, check each: 1) Error string exact  2) Email field bordered red  3)
  Other fields in normal state  4) Form otherwise complete'
checks:
  min_width: 700
  min_height: 900
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - Enter a valid email address
criteria:
- prompt_adherence
- visual_quality
- composition
- realism_style
- text_accuracy
weights:
  prompt_adherence: 0.25
  visual_quality: 0.15
  composition: 0.25
  realism_style: 0.05
  text_accuracy: 0.3
tags:
- ui-mockups-&-layout
- scenario-bank
