id: IMG-STY-02
modality: image
task: image_edit
title: Photo to line art
inputs:
  source: assets/bank/IMG-STY-02-source.png
params:
  size: auto
prompt: Convert this photograph into clean black-and-white line art. Preserve the
  outline and structure of every major element. No shading, lines only.
expected: 'Photo to line art. Capability under test: High-abstraction style with content
  lock. Adherence clauses, check each: 1) Line art only, no fill shading  2) Major
  elements all present  3) Structure preserved  4) Monochrome'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.45
  visual_quality: 0.25
  realism_style: 0.3
tags:
- style-transfer
- scenario-bank-edit
