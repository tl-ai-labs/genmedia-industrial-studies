id: IMG-STY-01
modality: image
task: image_edit
title: Photo to watercolour
inputs:
  source: assets/bank/IMG-STY-01-source.png
params:
  size: auto
prompt: Convert this photograph into a loose watercolour painting. The subject, composition
  and all major elements must remain clearly recognisable.
expected: 'Photo to watercolour. Capability under test: Style applied, subject preserved.
  Adherence clauses, check each: 1) Reads as watercolour  2) Subject recognisable  3)
  Composition unchanged  4) No elements added or removed'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.45
  visual_quality: 0.25
  realism_style: 0.3
tags:
- style-transfer
- scenario-bank-edit
