# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row IMG-UI-05 — prompt verbatim; synthetic source
# assets (generated by gemini flash, outside the comparison)
id: IMG-UI-05
modality: image
task: image_edit
title: Dark mode variant
inputs:
  source: assets/bank/IMG-UI-05-source.png
params:
  size: auto
prompt: Produce a dark-mode version of this supplied light-mode screen. Keep every
  element, label and position identical — change only the colour scheme.
expected: 'Dark mode variant. Capability under test: Theme inversion with structure
  lock. Adherence clauses, check each: 1) Dark background, light text  2) All elements
  retained  3) All labels unchanged  4) Positions unchanged'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - Inbox
  - Sent
  - Archive
  - Settings
  - Compose
criteria:
- edit_fidelity
- visual_quality
- realism_style
- text_accuracy
weights:
  edit_fidelity: 0.4
  visual_quality: 0.15
  realism_style: 0.05
  text_accuracy: 0.4
tags:
- ui-mockups-&-layout
- scenario-bank-edit
