id: IMG-STY-07
modality: image
task: image_edit
title: Style transfer with readable text
inputs:
  source: assets/bank/IMG-STY-07-source.png
params:
  size: auto
prompt: Apply a bold poster-art style to this image, but keep all existing text perfectly
  legible and correctly spelled.
expected: 'Style transfer with readable text. Capability under test: Stylisation that
  spares typography. Adherence clauses, check each: 1) Style applied to imagery  2)
  All text still legible  3) Spelling unchanged  4) Text position preserved'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - GRAND OPENING
  - Saturday 10AM
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.45
  visual_quality: 0.25
  realism_style: 0.3
tags:
- style-transfer
- scenario-bank-edit
