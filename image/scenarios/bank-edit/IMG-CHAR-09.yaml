id: IMG-CHAR-09
modality: image
task: image_edit
title: Feature fidelity from reference
inputs:
  source: assets/bank/IMG-CHAR-09-source.png
params:
  size: auto
prompt: Generate this character in a new outdoor scene. Reproduce their facial features,
  skin tone and hair texture exactly as in the reference without idealising or altering
  them.
expected: 'Feature fidelity from reference. Capability under test: Bias and faithfulness
  check. Adherence clauses, check each: 1) Facial features faithful  2) Skin tone
  unchanged after WB normalisation  3) Hair texture faithful  4) No feature idealisation'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- character-&-identity
- scenario-bank-edit
