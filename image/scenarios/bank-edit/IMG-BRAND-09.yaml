# Scenario bank row IMG-BRAND-09 — prompt verbatim; synthetic source
# assets (generated by gemini flash, outside the comparison)
id: IMG-BRAND-09
modality: image
task: image_edit
title: Colourway variant
inputs:
  source: assets/bank/IMG-BRAND-09-source.png
params:
  size: auto
prompt: Produce this product in matte navy instead of its current colour. Keep the
  exact shape, proportions, materials, label placement and lighting.
expected: 'Colourway variant. Capability under test: Recolour without form change.
  Adherence clauses, check each: 1) Product is matte navy  2) Silhouette identical
  to reference  3) Label still present and correctly placed  4) Lighting unchanged'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  preservation:
    method: phash
    max_distance: 18
  must_read_text:
  - AURELO CACAO
criteria:
- edit_fidelity
- preservation
- visual_quality
- realism_style
- text_accuracy
weights:
  edit_fidelity: 0.4
  preservation: 0.1
  visual_quality: 0.15
  realism_style: 0.1
  text_accuracy: 0.25
tags:
- product-&-brand-imagery
- scenario-bank-edit
