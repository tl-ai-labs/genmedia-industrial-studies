id: IMG-BRAND-04
modality: image
task: image_edit
title: Logo geometry on packaging
inputs:
  source: assets/bank/IMG-BRAND-04-source.png
  reference: assets/bank/IMG-BRAND-04-reference.png
params:
  size: auto
prompt: Apply the supplied logo to the front of this box mockup, top-centre, at 30%
  of the box width. Preserve the logo's proportions and colours exactly.
expected: 'Logo geometry on packaging. Capability under test: Mark integrity under
  transformation. Adherence clauses, check each: 1) Logo present top-centre  2) Aspect
  ratio of the mark preserved  3) Colours unchanged  4) Width approximately 30% of
  box face'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  preservation:
    method: phash
    max_distance: 12
  must_read_text:
  - AURELO
criteria:
- edit_fidelity
- preservation
- visual_quality
- realism_style
- text_accuracy
weights:
  edit_fidelity: 0.4
  preservation: 0.1
  visual_quality: 0.15
  realism_style: 0.1
  text_accuracy: 0.25
tags:
- product-&-brand-imagery
- scenario-bank-edit
