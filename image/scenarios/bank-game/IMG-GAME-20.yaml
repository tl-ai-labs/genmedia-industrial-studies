# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-20 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: low (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-urban.png — provenance in each sidecar .json
id: IMG-GAME-20
modality: image
task: image_edit
title: Chibi version for a mobile store icon
inputs:
  source: assets/bank/IMG-GAME-base-urban.png
params:
  size: auto
prompt: 'Redraw this person as a chibi: roughly two heads tall, oversized head, tiny hands
  and feet, simplified clothing, bold clean outlines and bright flat colours. Keep the signature
  elements readable — the cap, the dark shirt and the facial features. Centred on a plain
  background with generous margins.'
expected: 'Chibi version for a mobile store icon. Capability under test: Aggressive proportion
  change while keeping the signature read. Adherence clauses, check each: 1) Roughly two heads
  tall with chibi proportions  2) Cap, dark shirt and facial features all still readable  3)
  Bold clean outlines, bright flat colours, simplified detail  4) Centred with margins on
  a plain background'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- style-&-production-assets
- scenario-bank-game
- tier-low
