id: IMG-GAME-49
modality: image
task: image_edit
title: Three body types in one loadout
inputs:
  source: assets/bank/IMG-GAME-base-urban.png
params:
  size: auto
prompt: 'Using this reference, show the same clothing and kit worn by three different body
  types in one row: slight, average and heavy-set. The shirt, cap and kit design stay identical
  across all three, refitted plausibly to each build with correct fabric drape and strap length.
  Same face and hairline on all three, same neutral framing, same lighting and plain background.'
expected: 'Three body types in one loadout. Capability under test: One design refitted across
  body types without distortion or redesign. Adherence clauses, check each: 1) Three visibly
  different builds — slight, average, heavy-set  2) Identical shirt, cap and kit design across
  all three  3) Fabric drape and strap length adjusted plausibly per build  4) Same face,
  hairline, framing, lighting and background throughout'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- variants-&-progression
- scenario-bank-game
- tier-high
