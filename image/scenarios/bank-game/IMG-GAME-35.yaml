# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-35 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-urban.png — provenance in each sidecar .json
id: IMG-GAME-35
modality: image
task: image_edit
title: Eight-emote sticker set
inputs:
  source: assets/bank/IMG-GAME-base-urban.png
params:
  size: auto
prompt: 'Using this reference, produce an eight-emote sticker sheet in a two-by-four grid:
  victory, salute, laughing, angry, sleeping, thinking, celebrating and confused. Each is
  the same character stylised consistently, with the same colours, outline weight and proportions,
  sized to read at small scale. Plain white background, even spacing, no text.'
expected: 'Eight-emote sticker set. Capability under test: Identity and line weight held across
  eight small-scale variations. Adherence clauses, check each: 1) Eight stickers in a two-by-four
  grid, matching the eight named emotes  2) Same colours, outline weight and proportions in
  every sticker  3) Each pose readable at small size, no fine detail that would vanish  4)
  Plain white background, even spacing, no text'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- identity-&-consistency
- scenario-bank-game
- tier-high
