# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-22 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-urban.png — provenance in each sidecar .json
id: IMG-GAME-22
modality: image
task: image_edit
title: Lobby portrait crop with a name plate
inputs:
  source: assets/bank/IMG-GAME-base-urban.png
params:
  size: auto
prompt: 'Crop and recompose this person into a square head-and-shoulders lobby portrait: face
  centred in the upper two-thirds, shoulders visible, background replaced with a flat deep
  navy. Add a thin gold rule across the lower edge with the callsign VESPER in small clean
  capitals beneath it. Face, cap, hairline and collar must be unchanged from the reference.'
expected: 'Lobby portrait crop with a name plate. Capability under test: Recompose to a UI
  crop and add exact typography without altering the face. Adherence clauses, check each:
  1) Square head-and-shoulders crop, face centred in the upper two-thirds  2) Flat deep-navy
  background with a thin gold rule near the lower edge  3) VESPER legible in small clean capitals
  beneath the rule  4) Face, cap, hairline and collar unchanged from the reference'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - VESPER
criteria:
- edit_fidelity
- visual_quality
- realism_style
- text_accuracy
weights:
  edit_fidelity: 0.4
  visual_quality: 0.15
  realism_style: 0.15
  text_accuracy: 0.3
tags:
- style-&-production-assets
- scenario-bank-game
- tier-medium
