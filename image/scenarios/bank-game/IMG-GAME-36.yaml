# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-36 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-masked.png — provenance in each sidecar .json
# KNOWN ISSUE: the pinned 'masked' photo shows several suited people, one face visible through a visor; the
# prompt assumes one soldier with the face fully covered.
id: IMG-GAME-36
modality: image
task: image_edit
title: One operator, three lighting environments
inputs:
  source: assets/bank/IMG-GAME-base-masked.png
params:
  size: auto
prompt: 'Using this figure as the character reference, show the same operator three times
  in one row under three lighting setups: cold blue moonlight from behind, warm orange flare
  light from below, and flat overcast daylight. The suit design, colours, pose and proportions
  stay identical in all three; only the lighting changes. Plain neutral backgrounds appropriate
  to each light.'
expected: 'One operator, three lighting environments. Capability under test: Design stability
  under lighting change without colour or detail drift. Adherence clauses, check each: 1)
  Three panels with the three named lighting setups  2) Same pose, proportions and suit design
  in all three  3) Local colours consistent — the suit still reads its own colour under every
  light  4) Shadows and rim light correct for each described light direction'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- identity-&-consistency
- scenario-bank-game
- tier-medium
