# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
id: IMG-GAME-07
modality: image
task: text_to_image
title: Uniform with a legible name tape and unit patch
params:
  size: 1024x1536
  aspect_ratio: '9:16'
prompt: Full-body character concept art of a fictional dropship crew operator in a fitted
  flight suit. Stitched onto the right chest is a rectangular name tape reading KESTREL in
  small block capitals, and on the left shoulder is a circular unit patch carrying the letters
  T-9. Both must sit on the fabric, curving with the body and creasing where the suit folds.
  Muted olive suit, three-quarter view, plain background, no real-world insignia, no other
  text.
expected: 'Uniform with a legible name tape and unit patch. Capability under test: Text rendered
  onto a curved fabric surface as part of the character. Adherence clauses, check each: 1)
  Name tape on the right chest reading KESTREL  2) Circular shoulder patch carrying T-9  3)
  Both curve with the fabric and crease with the folds, not flat overlays  4) Full body, three-quarter
  view, plain background, no other text'
checks:
  min_width: 700
  min_height: 1000
  formats:
  - png
  - jpeg
  not_blank: true
  must_read_text:
  - KESTREL
  - T-9
criteria:
- prompt_adherence
- visual_quality
- composition
- realism_style
- text_accuracy
weights:
  prompt_adherence: 0.25
  visual_quality: 0.15
  composition: 0.25
  realism_style: 0.05
  text_accuracy: 0.3
tags:
- concept-&-ideation
- scenario-bank-game
- tier-medium
