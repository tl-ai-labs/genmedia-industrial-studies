# Source: gaming-character-design-scenarios-v4.xlsx
# Scenario bank row IMG-GAME-59 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: medium (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-GAME-base-urban.png — provenance in each sidecar .json
id: IMG-GAME-59
modality: image
task: image_edit
title: Design readability at gameplay scale
inputs:
  source: assets/bank/IMG-GAME-base-urban.png
params:
  size: auto
prompt: 'Using this reference, render the same character as it would appear at third-person
  gameplay scale: the full figure occupying only about one eighth of the frame height, standing
  on plain ground, viewed from a raised third-person camera behind and above. Simplify detail
  to what would genuinely be visible at that size while keeping the silhouette, the cap shape
  and the signature colours unmistakable. Plain background, no interface elements, no text.'
expected: 'Design readability at gameplay scale. Capability under test: Whether a character''s
  silhouette and key colours survive being rendered small. Adherence clauses, check each:
  1) Character occupies roughly one eighth of the frame height  2) Raised third-person camera
  behind and above the figure  3) Silhouette, cap shape and signature colours still readable
  at that size  4) Detail simplified rather than shrunk; no interface elements or text'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- style-&-production-assets
- scenario-bank-game
- tier-medium
