# Scenario bank row IMG-VIEW-19 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: low (scenarios/tiers/scenario-tiers.csv).
id: IMG-VIEW-19
modality: image
task: text_to_image
title: Extreme low worm's-eye angle
params:
  size: 1024x1536
  aspect_ratio: '9:16'
prompt: A worm's-eye view photograph taken from ground level looking almost straight up at
  a row of glass office towers converging toward a small patch of blue sky at the centre of
  the frame. Strong upward convergence of all vertical lines, a skateboard and a few fallen
  leaves close to the lens in the foreground, midday sun flaring off one facade. Photorealistic,
  wide-angle lens.
expected: 'Extreme low worm''s-eye angle. Capability under test: Rendering a named extreme
  camera position with the correct convergence. Adherence clauses, check each: 1) Camera at
  ground level looking almost straight up  2) All verticals converging strongly toward the
  centre of the frame  3) Sky visible as a small patch between the tower tops  4) Skateboard
  and leaves close to the lens, plausibly foreshortened'
checks:
  min_width: 700
  min_height: 1000
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- prompt_adherence
- visual_quality
- composition
- realism_style
weights:
  prompt_adherence: 0.4
  visual_quality: 0.25
  composition: 0.2
  realism_style: 0.15
tags:
- camera-angle-from-scratch
- scenario-bank-view
- tier-low
