# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-07 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-room.png — provenance in each sidecar .json
id: IMG-VIEW-07
modality: image
task: image_edit
title: Room photo to a top-down layout view
inputs:
  source: assets/bank/IMG-VIEW-base-room.png
params:
  size: auto
prompt: Re-render this room seen from directly above, looking straight down, as if the ceiling
  had been removed. Every item from the photograph must appear in plan in its correct position
  and proportion — the seating, the low table, the floor covering and the window wall. Realistic
  materials, even light, no text or labels.
expected: 'Room photo to a top-down layout view. Capability under test: Full ninety-degree
  reprojection to plan with spatial relationships preserved. Adherence clauses, check each:
  1) Camera directly overhead, ceiling removed, everything seen in plan  2) Seating, low table,
  floor covering and window wall all present  3) Positions and relative proportions match
  the original room  4) Realistic materials, even light, no text or labels added'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.55
  visual_quality: 0.15
  realism_style: 0.3
tags:
- scene-&-interior-re-angle
- scenario-bank-view
- tier-high
