# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-33 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-shelf.png — provenance in each sidecar .json
id: IMG-VIEW-33
modality: image
task: image_edit
title: Angled shelf to a straight-on planogram elevation
inputs:
  source: assets/bank/IMG-VIEW-base-shelf.png
params:
  size: auto
prompt: Rectify this shelf photograph so the shelving is seen straight on, square to the camera,
  with the shelf edges perfectly horizontal and no products at the far end appearing smaller
  than those at the near end. Every shelf and every product must remain, in the same order
  and the same colours, and the shelf-edge label strips must stay legible.
expected: 'Angled shelf to a straight-on planogram elevation. Capability under test: Oblique-to-frontal
  rectification across a repeating array without dropping items. Adherence clauses, check
  each: 1) Shelving square to camera, shelf edges horizontal, no depth taper  2) All shelves
  present with every product in its original order and colour  3) Shelf-edge label strips
  still legible  4) No products duplicated, dropped or resized inconsistently'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
- text_accuracy
weights:
  edit_fidelity: 0.4
  visual_quality: 0.15
  realism_style: 0.15
  text_accuracy: 0.3
tags:
- scene-&-interior-re-angle
- scenario-bank-view
- tier-high
