# Source: viewing-angle-scenarios-v3.xlsx
# Scenario bank row IMG-VIEW-27 — prompt verbatim; runner fields from 'Runner mapping'.
# Complexity tier: high (scenarios/tiers/scenario-tiers.csv).
# Inputs: source = IMG-VIEW-base-laptop.png — provenance in each sidecar .json
# A real photograph of the target side view exists (see the sheet's 'Ground-truth target view'); not fed to models.
id: IMG-VIEW-27
modality: image
task: image_edit
title: Reveal the port edge of a device
inputs:
  source: assets/bank/IMG-VIEW-base-laptop.png
params:
  size: auto
prompt: Re-photograph this laptop from its left side, looking straight at the edge of the
  base, so the port cut-outs along that edge are clearly visible and the screen is seen edge-on.
  Keep the finish, the chassis thickness, the hinge design and the screen bezel proportions
  faithful to the original. Same plain background and studio lighting.
expected: 'Reveal the port edge of a device. Capability under test: Ninety-degree yaw to an
  unseen edge with plausible engineered detail. Adherence clauses, check each: 1) Camera square
  to the side, screen seen edge-on  2) Port cut-outs visible along the base edge  3) Finish,
  chassis thickness and hinge design consistent with the original  4) Plain background and
  studio lighting consistent with the new angle'
checks:
  min_width: 700
  min_height: 700
  formats:
  - png
  - jpeg
  not_blank: true
criteria:
- edit_fidelity
- visual_quality
- realism_style
weights:
  edit_fidelity: 0.5
  visual_quality: 0.2
  realism_style: 0.3
tags:
- product-&-object-rotation
- scenario-bank-view
- tier-high
