  FRAME and an END FRAME side by side with an arrow between them (small photographic frames of the man
  in this location), and three short lines labelled CAMERA, SOUND and VO. The beats, with their exact
  titles and time codes:

  B1 RIDGE · ARRIVAL 0:00–0:06

  B2 RIDGE · STILLNESS 0:06–0:11

  B3 VALLEY · REVEAL 0:11–0:17

  B4 DESCENT · BEGIN 0:17–0:21

  B5 DESCENT · FOG 0:21–0:27

  B6 DETAIL · GRASS 0:27–0:30

  B7 VALLEY FLOOR · RUIN 0:30–0:36

  B8 GROUND · MEMORY 0:36–0:41

  B9 FINAL · STILLNESS 0:41–0:45


  The frames must show their beats: B1 he walks into frame on the ridge; B2 he stands still with the radio;
  B3 a wide of the fog-filled valley; B4 his first steps down the slope; B5 he is half lost in fog; B6
