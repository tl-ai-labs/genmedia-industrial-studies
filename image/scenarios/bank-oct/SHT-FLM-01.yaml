  floor; B8 he kneels and sets the radio on the ground; B9 he walks away into the fog, the radio left
  behind. Light moves from pale gold dawn in B1 to flat grey fog by B9.


  Only three beats have voice-over; write these lines exactly: in B2, VO: "They said no one would hear
  it." in B5, VO: "I kept talking anyway." in B9, VO: "Goodbye. Properly, this time." The other beats
