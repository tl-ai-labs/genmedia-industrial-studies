[project]
name = "genmedia-panel"
version = "0.1.0"
description = "Blind human panel across the image, video and voice lanes, and its judge correlation"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
