<!doctype html>
<html lang="en">
<head>

<title>GenMedia Blind Human Panel</title>
<!--
  The blind panel's own page, served by `python -m runner.cli serve`.
  2026-11-04 (Sai): the same pages and look as the studies site's blind panel
  (ai-sdlc-multi-model-orchestration: views/BlindPanelLanding.tsx,
  views/BlindPanel.tsx), so a laptop session looks like the site:
    #/              the common landing page, a door per media type
    #/<media>       that media's landing page, one Start button
    #/<media>/review  the review
  `?lane=<media>` (the old address) opens that media's review; `?reviewer=`
  fills in the name. Results stay on the site (they name the models).
  Same server calls as before: api/config, items.json, api/votes, api/vote.
-->

<style>
  :root {

  .eyebrow::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--brand-500); animation: tl-pulse 2.4s infinite; }

  /* Review (BlindPanel.tsx). */

  .rhead .wrap6 { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding-top: .625rem; padding-bottom: .625rem; }
  .pill { border-radius: 999px; border: 1px solid var(--sky-200); background: var(--sky-50); padding: .125rem .625rem; font-size: .875rem; font-weight: 500;
          color: var(--sky-900); font-variant-numeric: tabular-nums; }
  .rhead .who { margin-left: auto; font-size: .875rem; color: var(--muted-text); }
  .rhead .who b { font-weight: 500; color: var(--ink); }
  .rhead .who button { margin-left: .375rem; }
  .rbody { flex: 1; display: flex; flex-direction: column; gap: .75rem; padding-top: 1rem; padding-bottom: 1rem; }
  .task { align-self: flex-start; border-radius: 999px; border: 1px solid var(--sky-200); background: var(--sky-50); padding: .25rem .875rem;
          font-size: 15px; font-weight: 500; color: var(--sky-900); }
  .block { display: flex; flex-direction: column; border-radius: .875rem; border: 1px solid; background: #fff; padding: .875rem; box-shadow: var(--shadow-card); }
  .block.sky { border-color: var(--sky-100); } .block.violet { border-color: var(--violet-100); } .block.amber { border-color: var(--amber-100); }
  .block-head { display: flex; align-items: center; gap: .5rem; }
  .badge { display: flex; align-items: center; justify-content: center; width: 1.25rem; height: 1.25rem; border-radius: 50%; color: #fff;
           font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sky .badge { background: var(--sky-500); } .violet .badge { background: var(--violet-500); } .amber .badge { background: var(--amber-500); }
  .block-head .aside { margin-left: auto; }
  .block-body { margin-top: .625rem; }
  .two { display: grid; gap: .75rem; }
  .prompt-grid { display: grid; gap: 1rem; }
  @media (min-width: 768px) { .two, .prompt-grid.with-inputs { grid-template-columns: 1fr 1fr; } .prompt-grid { align-items: start; } }
  .brief { min-width: 0; font-size: 15px; line-height: 1.65; color: var(--body); white-space: pre-line; font-family: var(--indic); }
  .inputs { display: grid; gap: .5rem; }
  .inputs.many { grid-template-columns: 1fr 1fr; }
  .inputs figure { margin: 0; min-width: 0; }
  .inbox { display: flex; align-items: center; justify-content: center; border-radius: .5rem; background: var(--sky-50); height: clamp(160px, 26vh, 280px); }
  .inputs.more .inbox { height: clamp(90px, 13vh, 140px); }
  figcaption { margin-top: .25rem; font-size: .75rem; color: var(--muted-text); }
  .side { display: flex; flex-direction: column; border-radius: .875rem; border: 1px solid var(--violet-100); background: var(--violet-50); padding: .75rem;

  .stage.audio { height: auto; padding: 1rem 0; }
  .frames { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; gap: 6px; height: 45vh; overflow: hidden; border-radius: .5rem; background: #fff; padding: 6px; }
  @media (min-width: 1024px) { .frames { grid-template-columns: repeat(3, 1fr); } }
  .frames figure { margin: 0; display: flex; flex-direction: column; min-height: 0; }
  .frames .fbox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .frames figcaption { margin-top: 2px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .media-img { width: 100%; height: 100%; object-fit: contain; border-radius: .375rem; cursor: zoom-in; }
  .media-video { width: 100%; height: 100%; object-fit: contain; border-radius: .375rem; }
  .media-audio { width: 100%; max-width: 420px; }
  .pick { margin-top: .75rem; width: 100%; border: 1px solid var(--violet-200); background: #fff; color: var(--violet-800); }

  .rfoot { position: sticky; bottom: 0; z-index: 20; border-top: 1px solid var(--sky-100); background: #fff; box-shadow: 0 -2px 8px rgba(15,23,42,.06); }
  .rfoot .wrap6 { display: flex; align-items: center; gap: .75rem; padding-top: .75rem; padding-bottom: .75rem; }
  .rfoot .mid { flex: 1; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: .25rem 1rem; text-align: center; font-size: .875rem; }
  .status-ok { font-weight: 500; color: var(--emerald-600); } .status-err { font-weight: 500; color: var(--rose-600); }
  .prev { border: 1px solid var(--sky-200); background: #fff; color: var(--sky-700); }
  .prev:hover { background: var(--sky-50); }
  .next { border: 1px solid var(--brand-200); background: var(--brand-50); color: var(--brand-700); }
  .next:hover { background: var(--brand-100); }
  .next.ready { border-color: transparent; background: var(--brand-500); color: #fff; box-shadow: var(--shadow-card); }
  .next.ready:hover { background: var(--brand-600); }
  .brandbtn { background: var(--brand-500); color: #fff; } .brandbtn:hover { background: var(--brand-600); }
  .note-card { margin: 0 auto; max-width: 36rem; border-radius: 1.125rem; border: 1px solid var(--line); background: #fff; padding: 3rem 1.5rem; text-align: center; box-shadow: var(--shadow-card); }

  /* Who is reviewing (ReviewerGate.tsx), as a card rather than a modal. */
  .gate { margin: 3rem auto; max-width: 28rem; }

  .gate .acts { display: flex; justify-content: flex-end; gap: .5rem; }

  /* Full-screen gallery (Lightbox). */
  .lightbox { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 1rem;
              background: rgba(0,0,0,.85); cursor: zoom-out; }
  .lightbox img { max-height: 94vh; max-width: 96vw; border-radius: .375rem; box-shadow: var(--shadow-pop); }
  .lb-btn { position: absolute; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,.1);
            color: #fff; line-height: 1; }
  .lb-btn:hover { background: rgba(255,255,255,.25); }
  .lb-close { top: 1rem; right: 1rem; width: 2.25rem; height: 2.25rem; font-size: 1.25rem; }
  .lb-prev, .lb-next { top: 50%; transform: translateY(-50%); width: 2.75rem; height: 2.75rem; font-size: 1.5rem; }
  .lb-prev { left: .75rem; } .lb-next { right: .75rem; }
  .lb-cap { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); border-radius: 999px; background: rgba(255,255,255,.1);
            padding: .375rem .875rem; font-size: .875rem; font-weight: 500; color: #fff; cursor: default; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>

<body>
<header class="site"><div class="wrap6"><a class="mark" href="#/"><i></i>GenMedia</a><span class="sep"></span><span class="name">Blind Human Panel</span></div></header>
<main id="main"></main>

<script>
(function () {
  'use strict';

  // ── What each media type asks of a reviewer (lib/blindPanelReport.ts) ──
  var MEDIA = {
    image: { label: 'Image', common: true, verb: 'Look at both pictures', tip: 'Click a picture to see it full screen.',
             title: 'Image review: which picture is better?', task: 'Look at both pictures and pick the better one.',
             intro: 'Two AI models were given the same prompt. You look at both pictures, without knowing which model made which, and pick the better one.',
             hint: ['sharp detail', 'missed part of the prompt'] },
    voice: { label: 'Voice', common: true, verb: 'Listen to both clips', tip: 'Headphones help. Clips are in English, Hindi, Hinglish and Telugu.',
             title: 'Voice review: which clip sounds better?', task: 'Listen to both audios and pick the better one.',
             intro: 'Two AI voices read the same text. You listen to both, without knowing which model made which, and pick the better one.',
             hint: ['clear pronunciation', 'rushed the numbers'] },
    video: { label: 'Video', common: false, verb: 'Watch both videos', tip: 'Use “Play both from the start” to compare them in step.',
             title: 'Video review: which video is better?', task: 'Watch both videos and pick the better one.',
             intro: 'Two AI models were given the same prompt. You see or hear both results side by side, without knowing which model made which, and pick the better one.',
             hint: ['smooth motion', 'flickers at the end'] }
  };
  var ROUND = 20;            // pairs per round; no totals are ever shown
  var OBS_MAX = 240;         // per box; the two travel as one reason of at most 500
  var NAME_RE = /^[A-Za-z0-9 ._@+-]{1,64}$/;   // the server's REVIEWER_RE

  var S = { items: null, lanes: [], mediaBase: 'media', reviewer: null, picks: null, err: null };
  var main = document.getElementById('main');
  window.__panel = S;        // read-only debugging handle; holds no model names

  // ── Order and sides (lib/panelOrder.ts): FNV-1a flip, mulberry32 order ──
  function fnv(s) { var h = 0x811c9dc5; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
  function mulberry(seed) {
    var s = seed;
    return function () { s = (s + 0x6d2b79f5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  function shuffled(list, seed) {
    var a = list.slice(), rnd = mulberry(seed);
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function sidesFor(seed, item) { return (fnv(seed + '|' + item.id) & 1) ? [item.pair[1], item.pair[0]] : [item.pair[0], item.pair[1]]; }
  function orderFor(seed, lane, items) { return shuffled(items, fnv(seed + '|' + lane)); }
  function nextOpen(order, from, voted) {
    for (var k = 1; k <= order.length; k++) { var j = (from + k) % order.length; if (!voted(order[j].id)) return j; }
    return -1;
  }

  // ── Observations: one per output, one reason field (lib/observations.ts) ──
  function joinObs(chosen, other) {
    var c = (chosen || '').trim(), o = (other || '').trim();
    return [c && 'Chosen: ' + c, o && 'Other: ' + o].filter(Boolean).join('\n');
  }
  function splitObs(reason) {
    var t = (reason || '').trim();
    if (!t) return { chosen: '', other: '' };
    var at = t.indexOf('\nOther: ');
    if (t.indexOf('Chosen: ') === 0) return at < 0 ? { chosen: t.slice(8).trim(), other: '' } : { chosen: t.slice(8, at).trim(), other: t.slice(at + 8).trim() };
    if (t.indexOf('Other: ') === 0) return { chosen: '', other: t.slice(7).trim() };
    return { chosen: t, other: '' };
  }

  // ── Small helpers ──
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function url(file) { return S.mediaBase + '/' + encodeURIComponent(file); }
  function api(path, opts) {
    return fetch(path, opts).then(function (r) {
      return r.json().then(function (j) { if (!r.ok || (j && j.error)) throw new Error((j && j.error) || r.status); return j; });
    });
  }
  function reduced() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
  function loadName() { try { return localStorage.getItem('panel.reviewer') || null; } catch (e) { return null; } }
  function saveName(n) { try { if (n) localStorage.setItem('panel.reviewer', n); else localStorage.removeItem('panel.reviewer'); } catch (e) {} }
  function setReviewer(n) { S.reviewer = n; S.picks = null; saveName(n); }
  function hasLane(l) { return S.lanes.indexOf(l) >= 0 && !!MEDIA[l]; }

  // ── Routing: #/  #/<media>  #/<media>/review ──
  function route() {
    var seg = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    if (seg[0] && hasLane(seg[0])) return { lane: seg[0], view: seg[1] === 'review' ? 'review' : 'landing' };
    return { lane: 'all', view: 'landing' };
  }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; window.scrollTo(0, 0); }
  window.addEventListener('hashchange', function () { render(); });

  var R = null;              // the review on screen, if any
  function render() {
    closeGallery();
    R = null;
    if (S.err) { main.innerHTML = '<div class="wrap"><p class="state err">' + esc(S.err) + '</p></div>'; return; }
    if (!S.items) { main.innerHTML = '<div class="wrap"><p class="state">Loading the panel…</p></div>'; return; }
    var r = route();
    if (r.view === 'review') { if (S.reviewer) review(r.lane); else gate(r.lane); }
    else landing(r.lane);
  }

  // ── Landing pages (BlindPanelLanding.tsx) ──
  function steps(lane) {
    var look = lane === 'all' ? 'Look at or listen to both' : MEDIA[lane].verb;
    var prompt = lane === 'voice' ? 'The text both AI models were asked to read aloud, and how to say it.'
      : lane === 'all' ? 'The instruction both AI models were given. For voice, it is the text they were asked to read aloud, and how.'
      : 'The instruction both AI models were given, with any picture supplied alongside it.';
    return [
      { t: lane === 'voice' ? 'Read the text' : 'Read the prompt', b: prompt },
      { t: look, b: 'Two results of that same prompt, one on the left and one on the right.' },
      { t: 'Pick the better one', b: 'Click “Left is better” or “Right is better”, add your observations if you like, then press Next. Go with your own judgement: does it do what was asked, and does it ' + (lane === 'voice' ? 'sound' : lane === 'image' ? 'look' : 'look or sound') + ' good?' },
      { t: 'Do a round, then decide', b: 'After ' + ROUND + ' pairs, picked at random, you choose whether to carry on, and from then on you can stop whenever you like. Every answer is saved as you go.' }
    ];
  }
  var FAIR = [
    { t: 'Model names are hidden', b: 'Nothing on the page says which model made which result.' },
    { t: 'The order is random', b: 'The pairs come in a shuffled order, different for every reviewer.' },
    { t: 'Left and right are random', b: 'Each pair is placed left or right at random, so the same model is not always on the same side. Judge what you see and hear, not the position.' },
    { t: 'Your answers are saved', b: 'They are kept under your name. Come back any time, on any device, with the same name, and you only get pairs you have not answered yet. Go back to a pair to change your answer.' }
  ];

  function landing(lane) {
    var m = lane === 'all' ? null : MEDIA[lane];
    // Totals are never shown; a media type with nothing to review has no door.
    var doors = S.lanes.filter(function (l) { return MEDIA[l] && MEDIA[l].common; });
    if (!doors.length) doors = S.lanes.filter(function (l) { return MEDIA[l]; });
    var title = m ? m.title : 'Which AI result is better? You decide.';
    var intro = m ? m.intro : 'Two AI models were given the same prompt. You see or hear both results side by side, without knowing which model made which, and pick the better one.';
    var nameBox = S.reviewer
      ? '<div class="label">Reviewing as</div><div class="who">' + esc(S.reviewer) + '</div><button class="change" data-act="unname">Not you? Change name</button>'
      : '<label><span class="label">Your name</span><input id="name" class="input" autocomplete="name" placeholder="e.g. Priya Sharma">' +
        '<span id="namehint" class="hint">Used only to save your answers, so you can pick up where you left off.</span></label>';
    var start = lane === 'all'
      ? '<div class="doors">' + doors.map(function (d) {
          return '<div class="card card-pad door"><h3 class="h3">' + MEDIA[d].label + ' review</h3><p class="small" style="margin-top:.25rem">' + MEDIA[d].verb +
            ', then pick the better one.</p><p class="small muted" style="margin-top:.25rem">' + MEDIA[d].tip + '</p>' +
            '<button class="btn btn-primary" data-start="' + d + '">Start ' + MEDIA[d].label.toLowerCase() + ' review ›</button></div>';
        }).join('') + '</div>'
      : '<div class="card card-pad ready"><div><p>' + m.verb + ', then pick the better one.</p><p class="small muted" style="margin-top:.25rem">' + m.tip +
        ' You start with a round of ' + ROUND + ' pairs; after that, stop whenever you like and come back later.</p></div>' +
        '<button class="btn btn-primary btn-wide" data-start="' + lane + '">Start the review ›</button></div>';
    main.innerHTML =
      '<section class="strip"><div class="wrap grid"><div>' +
        '<div class="eyebrow">GenMedia · Blind review' + (m ? ' · ' + m.label : '') + '</div>' +
        '<h1 class="h1">' + esc(title) + '</h1>' +
        '<p class="intro">' + esc(intro) + ' Each pair takes under a minute; a round is ' + ROUND + ' pairs.</p>' +
      '</div><div class="namebox">' + nameBox + '</div></div></section>' +
      '<section class="data"><div class="wrap">' +
        '<div><h2 class="h3">What you will do</h2><ol class="steps">' + steps(lane).map(function (s, i) {
          return '<li class="card card-pad"><div class="num">' + (i + 1) + '</div><h3 class="h4">' + esc(s.t) + '</h3><p>' + esc(s.b) + '</p></li>';
        }).join('') + '</ol></div>' +
        '<div><h2 class="h3">' + (lane === 'all' ? 'Start a review' : 'Ready?') + '</h2>' + start + '</div>' +
        '<div><h2 class="h3">Fair by design</h2><ul class="fair">' + FAIR.map(function (f) {
          return '<li><span class="tick" aria-hidden="true">✓</span><div><b>' + esc(f.t) + '</b><p>' + esc(f.b) + '</p></div></li>';
        }).join('') + '</ul></div>' +
      '</div></section>';

    var input = document.getElementById('name');
    function begin(l) {
      if (S.reviewer) { go('#/' + l + '/review'); return; }
      var n = (input.value || '').trim();
      if (!NAME_RE.test(n)) {
        var h = document.getElementById('namehint');
        h.textContent = 'Please enter your name first (letters, numbers and spaces).'; h.className = 'hint err';
        input.scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'center' });
        input.focus({ preventScroll: true });
        return;
      }
      setReviewer(n);
      go('#/' + l + '/review');
    }
    if (input) {
      input.addEventListener('input', function () { var h = document.getElementById('namehint'); h.textContent = 'Used only to save your answers, so you can pick up where you left off.'; h.className = 'hint'; });
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter' && lane !== 'all') begin(lane); });
    }
    main.querySelectorAll('[data-start]').forEach(function (b) { b.addEventListener('click', function () { begin(b.getAttribute('data-start')); }); });
    var un = main.querySelector('[data-act="unname"]');
    if (un) un.addEventListener('click', function () { setReviewer(null); render(); });
  }

  // ── Who is reviewing, when a review is opened without a name ──
  function gate(lane) {
    main.innerHTML = '<div class="wrap"><div class="card card-pad gate"><form>' +
      '<div><h2 class="h3">Who is reviewing?</h2><p class="small muted" style="margin-top:.25rem">Your name is stored with each answer, so what you chose is shown again when you come back.</p></div>' +
      '<label style="display:block"><span class="small" style="font-weight:500">Name</span><input id="gname" class="input" style="margin-top:.25rem" autocomplete="name" placeholder="Your name">' +
      '<span id="gerr" class="xs" style="display:block;margin-top:.25rem;color:var(--rose-600)" hidden>Letters, numbers and spaces only, up to 64 characters.</span></label>' +
      '<div class="acts"><button type="button" class="btn btn-secondary btn-sm" data-act="cancel">Cancel</button><button type="submit" class="btn btn-primary btn-sm">Start reviewing</button></div>' +
      '</form></div></div>';
    var f = main.querySelector('form'), inp = document.getElementById('gname');
    inp.focus();
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var n = inp.value.trim();
      if (!NAME_RE.test(n)) { document.getElementById('gerr').hidden = false; return; }
      setReviewer(n); render();
    });
    main.querySelector('[data-act="cancel"]').addEventListener('click', function () { go('#/' + lane); });
  }

  // ── The review (BlindPanel.tsx) ──
  function review(lane) {
    var m = MEDIA[lane];
    // A fresh shuffle on every visit: the seed is the name plus a random token.
    var seed = S.reviewer + '|' + Math.random().toString(36).slice(2);
    var V = R = { lane: lane, m: m, seed: seed, order: [], pos: 0, view: 'item', fresh: 0, roundsAsked: 0, busy: false,
                  notes: {}, stored: {}, noteTimer: null, players: [] };
    main.innerHTML = '<div class="review"><div class="rhead"><div class="wrap6">' +
      '<button class="lnk" data-act="home">‹ Instructions</button><h1 class="h3">' + m.label + ' review</h1>' +
      '<span class="pill" id="batch" hidden></span>' +
      '<span class="who">Reviewing as <b>' + esc(S.reviewer) + '</b><button class="lnk-brand" data-act="who">change</button></span>' +
      '</div></div><div class="wrap6 rbody" id="rbody"><p class="state">Loading the panel…</p></div><div id="rfoot" class="rfoot" hidden></div></div>';
    main.querySelector('[data-act="home"]').addEventListener('click', function () { leave(function () { go('#/' + lane); }); });
    main.querySelector('[data-act="who"]').addEventListener('click', function () { setReviewer(null); go('#/' + lane); });

    var picksReady = S.picks ? Promise.resolve(S.picks)
      : api('api/votes?reviewer=' + encodeURIComponent(S.reviewer)).then(function (j) { S.picks = j.picks || {}; return S.picks; });
    picksReady.then(function () {
      if (R !== V) return;
      var all = S.items.filter(function (i) { return i.lane === lane; });
      V.order = orderFor(seed, lane, all);
      var first = V.order.findIndex(function (i) { return !S.picks[i.id]; });
      V.pos = first < 0 ? 0 : first;
      V.view = first < 0 && V.order.length ? 'done' : 'item';
      paint();
    }).catch(function (e) {
      if (R !== V) return;
      document.getElementById('rbody').innerHTML = '<p class="state err">The panel server is not reachable (' + esc(e.message) + '). Open this page through `python -m runner.cli serve`, not as a file.</p>';
    });
  }

  function voted(id) { return !!(S.picks && S.picks[id]); }
  function cur() { return R && R.order[R.pos] || null; }

  function say(text, isErr) {
    if (!R) return;
    var el = document.getElementById('status');
    if (!el) return;
    el.className = isErr ? 'status-err' : 'status-ok';
    el.setAttribute('role', 'status');
    el.textContent = text;
    clearTimeout(R.noteTimer);
    R.noteTimer = setTimeout(function () { if (R) paintStatus(); }, isErr ? 3200 : 1400);
  }

  function paintStatus() {
    var el = document.getElementById('status'), it = cur();
    if (!el || !it) return;
    el.className = 'muted';
    el.removeAttribute('role');
    el.textContent = S.picks[it.id] ? 'Saved. Add observations if you like, then Next' : 'Pick the better one';
  }

  // Where the reviewer is inside the current round: never a total.
  function paintBatch() {
    var b = document.getElementById('batch'), it = cur();
    if (!b) return;
    var on = R.view === 'item' && !!it;
    b.hidden = !on;
    if (!on) return;
    var picked = !!S.picks[it.id];
    var done = Math.min(ROUND, Math.max(0, R.fresh - R.roundsAsked * ROUND));
    var at = Math.min(ROUND, Math.max(1, done + (picked ? 0 : 1)));
    b.textContent = at + ' / ' + ROUND;
    b.setAttribute('aria-label', 'Pair ' + at + ' of ' + ROUND + ' in this batch');
  }

  function paint() {
    var body = document.getElementById('rbody'), foot = document.getElementById('rfoot');
    if (!body) return;
    closeGallery();
    R.players = [];
    paintBatch();
    if (R.view === 'checkpoint') {
      foot.innerHTML = ''; foot.hidden = true;
      body.innerHTML = noteCard('🙌', 'That’s ' + R.fresh + ' done. Thank you!', 'Every answer is already saved. Would you like to carry on with ' + ROUND + ' more?',
        '<button class="btn brandbtn btn-wide" data-act="carry">Yes, continue</button><button class="btn btn-secondary btn-wide" data-act="stop">No, stop here</button>');
      on(body, 'carry', function () { R.view = 'item'; paint(); });
      on(body, 'stop', function () { R.view = 'stopped'; paint(); });
      return;
    }
    if (R.view === 'stopped') {
      foot.innerHTML = ''; foot.hidden = true;
      body.innerHTML = noteCard('🙏', 'Thank you for reviewing.', 'All your answers are saved. You can close this page, or come back any time with the same name to carry on with new pairs.',
        '<button class="btn btn-secondary btn-wide" data-act="keep">Actually, keep going</button><button class="btn btn-ghost" data-act="home2">‹ Back to the instructions</button>');
      on(body, 'keep', function () { R.view = 'item'; paint(); });
      on(body, 'home2', function () { go('#/' + R.lane); });
      return;
    }
    var it = cur();
    if (R.view === 'done' || !it) {
      foot.innerHTML = ''; foot.hidden = true;
      var others = S.lanes.filter(function (l) { return l !== R.lane && MEDIA[l] && MEDIA[l].common && S.items.some(function (i) { return i.lane === l && !voted(i.id); }); });
      body.innerHTML = '<div class="card card-pad" style="text-align:center;padding-top:3.5rem;padding-bottom:3.5rem"><div style="font-size:2.25rem">' + (others.length ? '🎉' : '🙏') + '</div>' +
        '<h2 class="h2" style="margin-top:.75rem">This review is complete. Thank you.</h2><p class="text-body" style="margin-top:.25rem">' +
        (others.length ? 'There is more to review in ' + others.map(function (l) { return MEDIA[l].label; }).join(' and ') + '.' : 'You have reviewed everything. You can close this page.') + '</p>' +
        '<div style="margin-top:1.25rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem">' +
        others.map(function (l) { return '<button class="btn btn-secondary" data-lane="' + l + '">Start ' + MEDIA[l].label.toLowerCase() + ' review</button>'; }).join('') +
        '<button class="btn btn-ghost" data-act="home2">‹ Back to the instructions</button></div></div>';
      body.querySelectorAll('[data-lane]').forEach(function (b) { b.addEventListener('click', function () { go('#/' + b.getAttribute('data-lane') + '/review'); }); });
      on(body, 'home2', function () { go('#/' + R.lane); });
      return;
    }

    var lr = sidesFor(R.seed, it), prior = S.picks[it.id] || null;
    // Observations follow the pair, keyed by media id so a changed pick keeps each note with its output.
    var o = splitObs(prior && prior.reason);
    R.notes = {};
    if (prior && prior.media) { R.notes[prior.media] = o.chosen; R.notes[prior.media === lr[0] ? lr[1] : lr[0]] = o.other; }
    var kind = it.kind;
    var imgsIn = it.inputs.filter(function (i) { return i.kind === 'image'; });

    var inputs = it.inputs.length ? '<div class="inputs' + (it.inputs.length > 1 ? ' many' : '') + (it.inputs.length > 2 ? ' more' : '') + '">' +
      it.inputs.map(function (inp, k) {
        return '<figure><div class="inbox">' + mediaHtml(inp.kind, inp.media, 'data-in="' + k + '"') + '</div><figcaption>' + esc(inp.label) +
          (inp.kind === 'image' && it.inputs.length === 1 ? ' · click to enlarge' : '') + '</figcaption></figure>';
      }).join('') + '</div>' : '';

    var aside2 = kind === 'video' ? '<button class="btn btn-ghost btn-sm" data-act="playboth">▶ Play both from the start</button>'
      : kind === 'image' ? '<span class="xs muted">Click a picture to enlarge it</span>' : '';

    var sides = lr.map(function (media, idx) {
      var frames = it.frames && it.frames[media];
      var stage = frames
        ? '<div class="frames">' + frames.map(function (f, k) {
            return '<figure><div class="fbox">' + mediaHtml('image', f.media, 'data-frame="' + idx + ':' + k + '"') + '</div><figcaption>' + esc(f.label) + '</figcaption></figure>';
          }).join('') + '</div>'
        : '<div class="stage' + (kind === 'audio' ? ' audio' : '') + '">' + mediaHtml(kind, media, 'data-side="' + idx + '"') + '</div>';
      return '<div class="side" data-sidebox="' + idx + '">' + stage +
        '<button class="btn pick" data-pick="' + idx + '"></button></div>';
    }).join('');

    var obs = lr.map(function (media, idx) {
      return '<label style="display:block"><textarea class="input obs" rows="2" maxlength="' + OBS_MAX + '" data-obs="' + idx + '" aria-label="Observations on the ' +
        (idx === 0 ? 'left' : 'right') + ' output" placeholder="What stood out? e.g. ' + R.m.hint[idx] + '"></textarea></label>';
    }).join('');

    body.innerHTML =
      '<p class="task">' + R.m.task + '</p>' +
      block(1, 'sky', R.lane === 'voice' ? 'The text to read' : 'The prompt', '',
        '<div class="prompt-grid' + (it.inputs.length ? ' with-inputs' : '') + '"><p class="brief">' + esc(it.brief || '(no text recorded)') + '</p>' + inputs + '</div>') +
      block(2, 'violet', 'Model outputs', aside2, '<div class="two">' + sides + '</div>') +
      block(3, 'amber', 'Your observations', '<span class="xs muted">Optional</span>', '<div class="two">' + obs + '</div>');

    foot.hidden = false;
    foot.innerHTML = '<div class="wrap6">' +
      '<button class="btn prev btn-wide" data-act="prev">‹ Previous</button>' +
      '<div class="mid"><span id="status" class="muted"></span>' +
      (R.fresh >= ROUND ? '<button class="lnk-brand" data-act="pause">Stop for now</button>' : '') + '</div>' +
      '<button class="btn next btn-wide" data-act="next">Next ›</button></div>';

    // Wire up.
    body.querySelectorAll('textarea[data-obs]').forEach(function (ta) {
      var media = lr[+ta.getAttribute('data-obs')];
      ta.value = R.notes[media] || '';
      ta.addEventListener('input', function () { R.notes[media] = ta.value; });
      ta.addEventListener('blur', function () { if (!R.busy) saveReason(); });
    });
    body.querySelectorAll('[data-pick]').forEach(function (b) { b.addEventListener('click', function () { vote(+b.getAttribute('data-pick') === 0 ? 'left' : 'right'); }); });
    body.querySelectorAll('[data-in]').forEach(function (img) {
      img.addEventListener('click', function () {
        var inp = it.inputs[+img.getAttribute('data-in')];
        openGallery(imgsIn.map(function (i) { return { src: url(i.media), label: i.label }; }), Math.max(imgsIn.indexOf(inp), 0));
      });
    });
    body.querySelectorAll('[data-frame]').forEach(function (img) {
      img.addEventListener('click', function () {
        var p = img.getAttribute('data-frame').split(':'), fr = it.frames[lr[+p[0]]];
        openGallery(fr.map(function (f) { return { src: url(f.media), label: f.label }; }), +p[1]);
      });
    });
    body.querySelectorAll('[data-side]').forEach(function (elm) {
      var idx = +elm.getAttribute('data-side');
      if (elm.tagName === 'IMG') elm.addEventListener('click', function () { openGallery([{ src: url(lr[0]), label: '' }, { src: url(lr[1]), label: '' }], idx); });
      else R.players[idx] = elm;
    });
    on(body, 'playboth', function () { R.players.forEach(function (p) { if (p) { p.currentTime = 0; p.play(); } }); });
    on(foot, 'prev', function () { goTo(R.pos - 1); });
    on(foot, 'next', function () { next(); });
    on(foot, 'pause', function () { saveReason().then(function (ok) { if (ok && R) { R.view = 'stopped'; paint(); } }); });
    paintPick();
    window.scrollTo(0, 0);
  }

  // A pick lights its side without redrawing the page, so a playing clip keeps playing.
  function paintPick() {
    var it = cur(); if (!it) return;
    var lr = sidesFor(R.seed, it), prior = S.picks[it.id] || null;
    var side = prior && prior.media === lr[0] ? 0 : prior && prior.media === lr[1] ? 1 : -1;
    document.querySelectorAll('[data-sidebox]').forEach(function (box) {
      var idx = +box.getAttribute('data-sidebox'), mine = side === idx;
      box.classList.toggle('mine', mine);
      box.classList.toggle('dimmed', side >= 0 && !mine);
      var b = box.querySelector('[data-pick]');
      b.classList.toggle('mine', mine);
      b.textContent = (mine ? '✓ ' : '👍 ') + (idx === 0 ? 'Left' : 'Right') + ' is better';
      b.disabled = R.busy;
    });
    var nx = document.querySelector('[data-act="next"]'), pv = document.querySelector('[data-act="prev"]');
    if (nx) { nx.classList.toggle('ready', side >= 0); nx.disabled = R.busy; }
    if (pv) pv.disabled = R.pos === 0 || R.busy;
    paintBatch();
    paintStatus();
  }

  function block(n, tone, title, aside, inner) {
    return '<section class="block ' + tone + '"><div class="block-head"><span class="badge" aria-hidden="true">' + n + '</span><h2 class="h4">' + title + '</h2>' +
      (aside ? '<div class="aside">' + aside + '</div>' : '') + '</div><div class="block-body">' + inner + '</div></section>';
  }
  function mediaHtml(kind, file, attr) {
    var src = esc(url(file));
    if (kind === 'image') return '<img class="media-img" src="' + src + '" alt="" draggable="false" title="Click to view full screen" ' + attr + '>';
    if (kind === 'video') return '<video class="media-video" src="' + src + '" controls playsinline preload="metadata" loop ' + attr + '></video>';
    return '<audio class="media-audio" src="' + src + '" controls preload="none" ' + attr + '></audio>';
  }
  function noteCard(icon, title, text, acts) {
    return '<div class="note-card"><div class="big">' + icon + '</div><h2 class="h2">' + esc(title) + '</h2><p class="text-body">' + esc(text) + '</p><div class="acts">' + acts + '</div></div>';
  }
  function on(root, act, fn) { var b = root.querySelector('[data-act="' + act + '"]'); if (b) b.addEventListener('click', fn); }
  function setBusy(v) { R.busy = v; paintPick(); }

  function reasonFor(it, pickedMedia) {
    var lr = sidesFor(R.seed, it), other = pickedMedia === lr[0] ? lr[1] : lr[0];
    return joinObs(R.notes[pickedMedia], R.notes[other]);
  }

  // Posts a pick and the observations typed so far; resolves false when it did not save.
  function save(pick) {
    var it = cur(), lr = sidesFor(R.seed, it), media = pick === 'left' ? lr[0] : lr[1];
    var why = reasonFor(it, media), before = R.stored[it.id], V = R;
    R.stored[it.id] = why;
    return api('api/vote', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                             body: JSON.stringify({ reviewer: S.reviewer, item: it.id, left: lr[0], right: lr[1], pick: pick, reason: why }) })
      .then(function () {
        if (!S.picks[it.id]) V.fresh++;
        S.picks[it.id] = { media: media, reason: why || null };
        return true;
      })
      .catch(function (e) {
        if (before === undefined) delete V.stored[it.id]; else V.stored[it.id] = before;
        say('Not saved: ' + e.message, true);
        return false;
      });
  }

  // Picking a side saves it and stays on the pair, so observations can follow.
  function vote(pick) {
    if (!R || R.busy || !cur()) return;
    setBusy(true);
    save(pick).then(function (ok) { if (!R) return; setBusy(false); if (ok) say('Saved 👍'); });
  }

  // Saves observations edited after the pick; resolves true when there was nothing to save or it saved.
  function saveReason() {
    var it = cur();
    if (!R || !it) return Promise.resolve(true);
    var prior = S.picks[it.id];
    if (!prior || !prior.media) return Promise.resolve(true);
    var have = R.stored[it.id] !== undefined ? R.stored[it.id] : (prior.reason || '');
    if (reasonFor(it, prior.media) === have) return Promise.resolve(true);
    var lr = sidesFor(R.seed, it);
    return save(prior.media === lr[0] ? 'left' : 'right').then(function (ok) { if (ok) say('Observations saved 👍'); return ok; });
  }

  function leave(then) { if (!R || R.busy) { then(); return; } saveReason().then(function () { then(); }); }

  function goTo(i) {
    if (!R || i < 0 || i >= R.order.length || R.busy) return;
    setBusy(true);
    saveReason().then(function (ok) { if (!R) return; R.busy = false; if (ok) { R.pos = i; R.view = 'item'; paint(); } else paintPick(); });
  }

  // Next: the next pair not yet answered; after each round of new answers, ask first.
  function next() {
    if (!R || R.busy) return;
    setBusy(true);
    saveReason().then(function (ok) {
      if (!R) return;
      R.busy = false;
      if (!ok) { paintPick(); return; }
      var target = nextOpen(R.order, R.pos, voted);
      if (target < 0 || (target === R.pos && voted(R.order[R.pos].id))) { R.view = 'done'; paint(); return; }
      R.pos = target === R.pos ? Math.min(R.pos + 1, R.order.length - 1) : target;
      var rounds = Math.floor(R.fresh / ROUND);
      if (rounds > R.roundsAsked) { R.roundsAsked = rounds; R.view = 'checkpoint'; } else R.view = 'item';
      paint();
    });
  }

  // Shift+arrows move between pairs; bare arrows do nothing (voting is clicks only).
  window.addEventListener('keydown', function (e) {
    if (G || !R || R.view !== 'item') return;
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if (e.key === 'ArrowLeft' && e.shiftKey) { e.preventDefault(); goTo(R.pos - 1); }
    else if (e.key === 'ArrowRight' && e.shiftKey) { e.preventDefault(); next(); }
  }, true);

  // One clip at a time: when a voice clip starts, the other pauses.
  document.addEventListener('play', function (e) {
    if (!(e.target instanceof HTMLAudioElement)) return;
    document.querySelectorAll('audio').forEach(function (a) { if (a !== e.target && !a.paused) a.pause(); });
  }, true);

  // ── Full-screen gallery: ←/→ step through, Escape or a click outside closes ──
  var G = null;
  function openGallery(items, index) {
    closeGallery();
    var cur = index;
    var box = document.createElement('div');
    box.className = 'lightbox';
    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-label', 'Image preview');
    function draw() {
      var it = items[cur];
      box.innerHTML = '<img src="' + esc(it.src) + '" alt="' + esc(it.label) + '" draggable="false">' +
        '<button class="lb-btn lb-close" aria-label="Close">×</button>' +
        (items.length > 1 ? '<button class="lb-btn lb-prev" aria-label="Previous image">‹</button><button class="lb-btn lb-next" aria-label="Next image">›</button>' +
          '<div class="lb-cap">' + (it.label ? esc(it.label) + ' · ' : '') + (cur + 1) + ' / ' + items.length + '</div>' : '');
      var p = box.querySelector('.lb-prev'), n = box.querySelector('.lb-next'), c = box.querySelector('.lb-cap');
      if (p) p.addEventListener('click', function (e) { e.stopPropagation(); step(-1); });
      if (n) n.addEventListener('click', function (e) { e.stopPropagation(); step(1); });
      if (c) c.addEventListener('click', function (e) { e.stopPropagation(); });
    }
    function step(d) { cur = (cur + d + items.length) % items.length; draw(); }
    function onKey(e) {
      if (e.key === 'Escape') { e.stopPropagation(); closeGallery(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); step(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); step(1); }
    }
    box.addEventListener('click', closeGallery);
    window.addEventListener('keydown', onKey, true);
    var overflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    document.body.appendChild(box);
    draw();
    G = function () { window.removeEventListener('keydown', onKey, true); document.body.style.overflow = overflow; box.remove(); };
  }
  function closeGallery() { if (G) { var g = G; G = null; g(); } }

  // ── Boot ──
  try {
    var q = new URLSearchParams(location.search);
    var n = (q.get('reviewer') || q.get('name') || '').trim();
    S.reviewer = NAME_RE.test(n) ? n : loadName();
    if (NAME_RE.test(n)) saveName(n);
    var wanted = q.get('lane');
  } catch (e) { S.reviewer = loadName(); }
  render();
  // Where the media lives is the server's to say (PANEL_MEDIA_BASE): its own
  // dist/media on a laptop, the studies console's files when hosted.
  fetch('api/config', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (c) { if (c && c.media_base) S.mediaBase = String(c.media_base).replace(/\/$/, ''); })
    .catch(function () {})
    .then(function () { return fetch('items.json', { cache: 'no-store' }); })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (j) {
      S.items = j.items || []; S.lanes = (j.lanes || []).filter(function (l) { return MEDIA[l]; });
      // `?lane=<media>` (the old address, one lane per page) opens that media's review.
      if (!location.hash && wanted && hasLane(wanted)) { location.replace('#/' + wanted + '/review'); return; }
      render();
    })
    .catch(function () { S.err = 'items.json not found: run the exporter first (python -m runner.cli export).'; render(); });
})();
</script>
</body>
</html>
