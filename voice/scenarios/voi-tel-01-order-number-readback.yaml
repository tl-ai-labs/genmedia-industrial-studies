# VOI-TEL-01 - Order number readback (Transactional / telephony)
#
# Capability under test: Long digit sequence accuracy
#
# SCRIPT ADAPTED FROM THE BANK, deliberately. The bank's prompt column is
# an instruction to a conversational agent:
#     "Read back this order number clearly, grouped for comprehension:
#      4471 8802 3915."
# A TTS engine has no agent to instruct - what you send is what it says.
# Sent verbatim on 2026-09-01, ElevenLabs read the preamble aloud while
# Gemini spoke only the digits, and the WER gate punished Gemini for the
# more sensible behaviour. The script below is the UTTERANCE a telephony
# agent would actually speak. Digit accuracy - the capability under test
# - is unchanged; both models got every digit right even when the framing
# differed.
#
# Bank's automated check: ASR transcript digit extraction: exact string
#   match required. Any single digit error = fail
id: voi-tel-01
modality: voice
task: text_to_speech
title: "Order number readback - Transactional / telephony"

input:
  script: |
    Your order number is 4471 8802 3915.
  language: en-IN

params:
  voice: female_mid_warm
  format: wav
  sample_rate: 24000
  speed: 1.0

expected: |
  1) All twelve digits correct and in order  2) Grouped into readable chunks
  3) No digits merged or dropped  4) Clear at telephony bandwidth Delivered
  at an unhurried telephony pace, every digit distinct.

checks:
  duration_s: {min: 2.0, max: 20.0}
  max_silence_s: 2.5
  no_clipping: true
  max_wer: 0.10
  # The bank's check: digit-exact, not WER. One wrong digit is a total
  # failure however good the clip sounds.
  must_say_digits: "447188023915"

tags: [telephony, transactional, digits, voi-tel-01]
