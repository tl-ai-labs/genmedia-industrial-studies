# VOI-TEL-08 - OTP digit sequence (Transactional / telephony)
#
# Capability under test: Isolated digit clarity
#
# SCRIPT ADAPTED FROM THE BANK, deliberately. The bank's prompt column is
# an instruction to a conversational agent:
#     "Read this one-time code digit by digit with brief pauses: 7 3 9 1 5
#      2."
# A TTS engine has no agent to instruct - what you send is what it says.
# Sent verbatim on 2026-09-01, ElevenLabs read the preamble aloud while
# Gemini spoke only the digits, and the WER gate punished Gemini for the
# more sensible behaviour. The script below is the UTTERANCE a telephony
# agent would actually speak. Digit accuracy - the capability under test
# - is unchanged; both models got every digit right even when the framing
# differed.
#
# Bank's automated check: ASR digit sequence exact match. Verify inter-digit
#   silence gaps present
id: voi-tel-08
modality: voice
task: text_to_speech
title: "OTP digit sequence - Transactional / telephony"

input:
  script: |
    Your one-time code is 7 3 9 1 5 2.
  language: en-IN

params:
  voice: female_mid_warm
  format: wav
  sample_rate: 24000
  speed: 1.0

expected: |
  1) All six digits correct in order  2) Read individually, not as a number
  3) Audible pause between digits  4) No repetition Delivered at an
  unhurried telephony pace, every digit distinct.

checks:
  duration_s: {min: 2.0, max: 20.0}
  max_silence_s: 2.5
  no_clipping: true
  max_wer: 0.10
  # The bank's check: digit-exact, not WER. One wrong digit is a total
  # failure however good the clip sounds.
  must_say_digits: "739152"

tags: [telephony, transactional, digits, voi-tel-08]
