# md-te-04 - Interrogation — Telangana number plate — two voices (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-te-04: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-te-04
# LANGUAGE. Tenglish (Romanised). DIFFICULTY. Hard. SETTING. Serialised drama.
# USE CASE. Thriller / crime.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms, Audiobook Platforms.
# WHAT THIS TESTS. A cold interrogator and a defiant suspect in Telugu-English, with a Telangana number plate
# SPEECH SKILLS. Numbers: codes, dates/times; Pronunciation: names, acronyms; Emotion; Conversation: 2 voices.
# PICKED AS. Gemini-lean - delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.
#
# TWO VOICES. Each line starts with its speaker's label. Gemini gets the
# labelled script with one prebuilt voice per label; ElevenLabs gets one
# Text to Dialogue input per line, label removed.

id: md-te-04
modality: voice
task: styled_tts
title: "Interrogation — Telangana number plate — two voices - Tenglish"

input:
  script: |
    A: Nee car number TS 09 EQ 7712, aa raatri padakondu gantalaki toll gate CCTV lo kanipinchindi.
    B: Car naa friend daggara undi. I wasn't even in Hyderabad!
    A: Stop lying, Ravi — nee phone location kuda akkade undi. Ekkada unnaavu?
  language: te-IN
  style: "A: cold, pressing interrogation; B: defiant, rattled"

params:
  speakers:
    - {label: A, voice: female_mid, style: "cold, pressing interrogation"}
    - {label: B, voice: male_young, style: "defiant, rattled"}
  format: wav
  sample_rate: 24000

expected: |
  1) Every turn read in order, nothing dropped
  2) The two speakers are clearly different voices, each consistent in voice and age across turns (judge)
  3) Contrasting emotions held: A stays cold and pressing, B stays defiant — no bleed from one speaker to the other (judge)
  4) Telugu segments pronounced correctly; code-switch reads native (judge)
  5) Plate "TS 09 EQ 7712" recoverable

checks:
  duration_s: {min: 7.6, max: 37.4}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, tenglish, micro-drama-entertainment, thriller-crime, hard, gemini-lean, v2-bank]
