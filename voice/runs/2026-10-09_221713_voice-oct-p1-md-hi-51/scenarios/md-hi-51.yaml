id: md-hi-51
modality: voice
task: styled_tts
title: "Couple banter — late again - Hinglish"

input:
  script: |
    "Tum phir late ho." "Traffic tha, I swear!" "Har baar traffic?" "Okay fine, main so gaya tha. Happy?"
  language: hi-IN
  style: "playful couple banter, two distinct voices"

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read
  2) Two voices distinguishable (judge)
  3) Punchline lands (judge)

checks:
  duration_s: {min: 3.6, max: 19.8}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

