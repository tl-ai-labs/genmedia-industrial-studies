# ret-hi-34 - Loyalty points and tier threshold (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-34: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-34
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Loyalty & subscriptions - SuperCoins, Prime, tiers, NeuCoins.
# TARGET CUSTOMER. E-commerce Marketplaces.
# WHAT THIS TESTS. A points figure plus a named loyalty tier
# SPEECH SKILLS. Numbers: amounts; Pronunciation: brands.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-34
modality: voice
task: text_to_speech
title: "Loyalty points and tier threshold - Hinglish"

input:
  script: |
    Aapke paas abhi teen hazaar aath sau SuperCoins hain. Sirf do sau points aur, aur aap Gold tier unlock kar lenge, jisme free delivery milegi.
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) Points figure "teen hazaar aath sau" recoverable exactly
  2) Tier name "Gold tier" recoverable exactly
  3) Benefit clause intelligible

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, ecommerce-retail, loyalty-subscriptions, medium, gemini-lean, v2-bank]
