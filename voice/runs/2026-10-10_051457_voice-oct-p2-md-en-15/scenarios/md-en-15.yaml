id: md-en-15
modality: voice
task: styled_tts
title: "Quarterly loss: furious CEO, calm CFO - English"

input:
  script: |
    A: A loss of Rs 25 crore? In one quarter? How did this happen, Mehra?
    B: Sir, please sit down. Rs 18 crore of that is a one-time write-off on the Pune plant.
    A: One-time? You said the same thing last year!
    B: That's why I made this report. Look at page 7, it's all there.
  language: en-IN
  style: "A: furious, cutting; B: calm, measured"

params:
  speakers:
    - {label: A, voice: male_older, style: "furious, cutting"}
    - {label: B, voice: female_older, style: "calm, measured"}
  format: wav
  sample_rate: 24000

expected: |
  1) Every turn in order
  2) Two clearly different voices, no emotional bleed (judge)
  3) Both crore amounts recoverable
  4) "Mehra" and "Pune" natural

checks:
  duration_s: {min: 10.4, max: 49.8}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  wer_reference: "A loss of Rs 25 crore? In one quarter? How did this happen, Mehra?\nSir, please sit down. Rs 18 crore of that is a one-time write-off on the Pune plant.\nOne-time? You said the same thing last year!\nThat's why I made this report. Look at page 7, it's all there."

