# bank-hi-15 - Credit limit increase, card last four (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-hi-15: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-hi-15
# LANGUAGE. Hindi (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Cards - dispatch, limits, dues, rewards, declines, replacement.
# TARGET CUSTOMER. Credit Card Issuers, Retail Banks.
# WHAT THIS TESTS. Two raw lakh numerals plus a four-digit masked card reference, with a disclosure limit on how many digits are spoken
# SPEECH SKILLS. Numbers: codes, amounts; Pronunciation: brands, acronyms.
# PICKED AS. Gemini-lean - lakh / crore amounts (ElevenLabs garbled these in Sept); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-hi-15
modality: voice
task: text_to_speech
title: "Credit limit increase, card last four - Hindi"

input:
  script: |
    आपके SBI Card, जिसके last four digits हैं two, two, zero, nine, की credit limit ₹1,80,000 से बढ़ाकर ₹2,50,000 कर दी गई है।
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Amount spoken in the Indian system (lakh/crore), not the international convention — the numeral was sent as-written, the model decides how to say it — for both amounts ("ढाई लाख" and "दो लाख पचास हज़ार" both pass)
  2) Card digits "2209" recoverable; no longer digit run spoken
  3) "SBI" as letters

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, banking-financial-services, cards, hard, gemini-lean, v2-bank]
