# trv-hi-01 - PNR, train number, coach and berth (Travel & mobility)
#
# SOURCE. v2 text-to-speech bank, scenario trv-hi-01: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/trv-hi-01
# LANGUAGE. Hindi (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Train - PNR, train numbers, waitlist, platform changes.
# TARGET CUSTOMER. Rail Booking Platforms.
# WHAT THIS TESTS. A ten-digit PNR, a five-digit train number, a train name and a coach/berth code, stacked
# SPEECH SKILLS. Numbers: codes; Pronunciation: names, brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: trv-hi-01
modality: voice
task: text_to_speech
title: "PNR, train number, coach and berth - Hindi"

input:
  script: |
    आपका PNR number है four, two, one, seven, seven, zero, nine, three, eight, five। Train 12951, Mumbai Rajdhani Express, coach B3, berth 42, lower berth confirm है।
  language: hi-IN

params:
  voice: male_mid
  format: wav
  sample_rate: 24000

expected: |
  1) PNR "4217709385" recoverable digit-for-digit
  2) Train number "12951" read as railway staff say it ("one-two-nine-five-one" or "बारह नौ पाँच एक") (judge)
  3) Coach "B3" and berth "42" recoverable

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, travel-mobility, train, hard, even-contest, v2-bank]
