# ret-hi-07 - Exchange offer with no-cost EMI option (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-07: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-07
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Checkout & payments - COD, no-cost EMI, Pay Later, failed payments.
# TARGET CUSTOMER. E-commerce Marketplaces, Consumer Electronics Brands.
# WHAT THIS TESTS. A currency discount amount plus a financial term (EMI) inside one sentence
# SPEECH SKILLS. Numbers: amounts, dates/times; Pronunciation: acronyms.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-07
modality: voice
task: text_to_speech
title: "Exchange offer with no-cost EMI option - Hinglish"

input:
  script: |
    Is smartphone par exchange offer mein aapko char hazaar rupaye ka discount milega, ya aap ise teen mahine ki no-cost EMI par bhi le sakte hain.
  language: hi-IN

params:
  voice: male_older
  format: wav
  sample_rate: 24000

expected: |
  1) Amount "char hazaar rupaye" recoverable exactly
  2) "no-cost EMI" said with EMI as individual letters (judge)
  3) Tenure "teen mahine" recoverable

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, ecommerce-retail, checkout-payments, medium, gemini-lean, v2-bank]
