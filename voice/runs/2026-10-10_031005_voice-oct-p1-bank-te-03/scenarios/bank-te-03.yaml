# bank-te-03 - Gold-loan renewal — Telugu script (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-te-03: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-te-03
# LANGUAGE. Telugu (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Loans & EMI - EMI reminders, approvals, prepayment, gold loans, collections.
# TARGET CUSTOMER. Retail Banks, NBFCs & Lenders.
# WHAT THIS TESTS. An NBFC brand, a letter/digit loan number and a Hyderabad locality inside a Telugu-script sentence
# SPEECH SKILLS. Numbers: codes; Pronunciation: names, brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-te-03
modality: voice
task: text_to_speech
title: "Gold-loan renewal — Telugu script - Telugu"

input:
  script: |
    మీ Manappuram gold loan, loan number G, L, seven, four, zero, two, one, వచ్చే వారం mature అవుతుంది. Renew చేయడానికి మీ Kukatpally branch ని visit చేయండి.
  language: te-IN

params:
  voice: female_older
  format: wav
  sample_rate: 24000

expected: |
  1) "GL74021" Recoverable character-for-character, read in confirmable chunks, not run together
  2) "Manappuram" and "Kukatpally" natural (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, telugu, banking-financial-services, loans-emi, hard, even-contest, v2-bank]
