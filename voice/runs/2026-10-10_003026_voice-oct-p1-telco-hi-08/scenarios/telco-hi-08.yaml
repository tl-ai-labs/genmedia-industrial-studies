# telco-hi-08 - Vi Hero plan — price, validity, rollover, night window (Telecom)
#
# SOURCE. v2 text-to-speech bank, scenario telco-hi-08: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/telco-hi-08
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Recharge & plans.
# TARGET CUSTOMER. Mobile Network Operators.
# WHAT THIS TESTS. A brand plan name, raw price, validity, data quota and a night time window stacked in one passage
# SPEECH SKILLS. Numbers: amounts, dates/times, units/%; Pronunciation: brands.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: telco-hi-08
modality: voice
task: text_to_speech
title: "Vi Hero plan — price, validity, rollover, night window - Hinglish"

input:
  script: |
    Aapke Vi Hero Unlimited plan mein, Rs 365 mein, 28 din ki validity, roz 2GB data, aur weekend data rollover milta hai — saath hi raat barah se subah chhah baje tak unlimited data free.
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Price and validity recoverable
  2) "Vi Hero Unlimited" natural
  3) Time window "raat barah se subah chhah baje" recoverable

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, telecom, recharge-plans, hard, gemini-lean, v2-bank]
