# bank-hi-32 - Card transaction alert — merchant, amount, DTMF — mixed script (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-hi-32: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-hi-32
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Fraud & security - OTP, fraud alerts, new-device login, scam warnings.
# TARGET CUSTOMER. Retail Banks, Credit Card Issuers.
# WHAT THIS TESTS. A raw amount, a retailer brand and a Mumbai locality under an urgent register, Hindi in both scripts — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: amounts; Pronunciation: names, brands, acronyms; Emotion.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-hi-32
modality: voice
task: text_to_speech
title: "Card transaction alert — merchant, amount, DTMF — mixed script - Hinglish"

input:
  script: |
    सावधान! Aapke HDFC credit card par ₹14,999 ka ek transaction abhi हुआ है, merchant है Croma, Andheri। अगर यह आपने nahi kiya, तो turant ek dabaaiye; OTP किसी को bhi मत बताइए।
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) Amount "चौदह हज़ार नौ सौ निन्यानवे" recoverable
  2) "Croma, Andheri" natural
  3) Urgent but controlled (judge)
  4) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  5) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, banking-financial-services, fraud-security, hard, gemini-lean, v2-bank]
