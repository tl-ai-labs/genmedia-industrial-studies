# telco-hi-11 - Postpaid bill breakdown — plan, roaming, GST, paise (Telecom)
#
# SOURCE. v2 text-to-speech bank, scenario telco-hi-11: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/telco-hi-11
# LANGUAGE. Hindi (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Postpaid & broadband billing.
# TARGET CUSTOMER. Mobile Network Operators, Broadband Providers.
# WHAT THIS TESTS. Four raw amounts (two with paise), an acronym (GST) and a numeral due date in one passage
# SPEECH SKILLS. Numbers: amounts, dates/times, units/%; Pronunciation: brands, acronyms.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: telco-hi-11
modality: voice
task: text_to_speech
title: "Postpaid bill breakdown — plan, roaming, GST, paise - Hindi"

input:
  script: |
    आपका Airtel Black bill ₹2,847.50 है — इसमें ₹1,599 का plan, ₹748 का international roaming usage, और ₹500.50 GST शामिल है। Due date 21 अक्टूबर है।
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) All four amounts recoverable, paise read as paise (judge)
  2) "GST" as letters
  3) Date "इक्कीस अक्टूबर" recoverable

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, telecom, postpaid-broadband-billing, hard, gemini-lean, v2-bank]
