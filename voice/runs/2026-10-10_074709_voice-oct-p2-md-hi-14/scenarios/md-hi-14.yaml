# md-hi-14 - Late-night confession, vulnerable (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-14: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-14
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Serialised drama.
# USE CASE. Romance & coming-of-age.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms, Audiobook Platforms.
# WHAT THIS TESTS. A soft, hesitant register that does not harden when the sentence switches to English
# SPEECH SKILLS. Emotion.
# PICKED AS. Gemini-lean - delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-14
modality: voice
task: styled_tts
title: "Late-night confession, vulnerable - Hinglish"

input:
  script: |
    Main tumhe kabse yeh batana chahta tha... I think I've loved you since the day we met, par darr lagta tha tumhe khone ka.
  language: hi-IN
  style: "soft, vulnerable, hesitant"

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) One continuous prosody; the emotion does not reset at the language switch

checks:
  duration_s: {min: 4.8, max: 25.1}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, micro-drama-entertainment, romance-coming-of-age, medium, gemini-lean, v2-bank]
