# fqc-hi-02 - Order confirmed — restaurant and dish names — mixed script (Food & quick commerce)
#
# SOURCE. v2 text-to-speech bank, scenario fqc-hi-02: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/fqc-hi-02
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Order & ETA.
# TARGET CUSTOMER. Food Delivery Apps, Quick-commerce Apps.
# WHAT THIS TESTS. A restaurant brand and two dish names plus a minute ETA, in Devanagari — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: dates/times; Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: fqc-hi-02
modality: voice
task: text_to_speech
title: "Order confirmed — restaurant and dish names — mixed script - Hinglish"

input:
  script: |
    आपका Swiggy order confirm ho gaya है — Meghana Foods से chicken biryani aur paneer 65। Delivery 32 minute में hogi।
  language: hi-IN

params:
  voice: male_older
  format: wav
  sample_rate: 24000

expected: |
  1) "Meghana Foods" natural
  2) "paneer 65" read as "paneer sixty-five"
  3) ETA "बत्तीस minute" recoverable
  4) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  5) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, food-quick-commerce, order-eta, medium, even-contest, v2-bank]
