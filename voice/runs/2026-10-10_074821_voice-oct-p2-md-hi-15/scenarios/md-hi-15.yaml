# md-hi-15 - College farewell speech (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-15: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-15
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Easy. SETTING. Serialised drama.
# USE CASE. Romance & coming-of-age.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms, Audiobook Platforms.
# WHAT THIS TESTS. A sentimental, slightly emotional register sustained across the switch
# SPEECH SKILLS. Numbers: dates/times; Emotion.
# PICKED AS. Gemini-lean - delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-15
modality: voice
task: styled_tts
title: "College farewell speech - Hinglish"

input:
  script: |
    Four years pehle hum strangers the, aaj hum family hain. In yaadon ko kabhi mat bhoolna, chahe zindagi humein kahin bhi le jaaye.
  language: hi-IN
  style: "sentimental, warm, slightly emotional"

params:
  voice: female_young
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) One continuous prosody; the emotion does not reset at the language switch

checks:
  duration_s: {min: 4.6, max: 24.2}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, micro-drama-entertainment, romance-coming-of-age, easy, gemini-lean, v2-bank]
