# telco-en-06 - Porting code (UPC) readback (Telecom)
#
# SOURCE. New English scenario written for this run, modelled on v2 telco-hi-15 (https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/telco-hi-15): same industry, use case, speaker, tests and difficulty.
# LANGUAGE. English (Indian English). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Porting (MNP / UPC) & retention.
# TARGET CUSTOMER. Mobile Network Operators.
# SPEECH SKILLS. Numbers: codes, dates/times; Pronunciation: acronyms.
# PICKED AS. Even contest.

id: telco-en-06
modality: voice
task: text_to_speech
title: "Porting code (UPC) readback - English"

input:
  script: |
    Your porting code, or UPC, is PK51234567. This code is valid for four days.
  language: en-IN

params:
  voice: female_young
  format: wav
  sample_rate: 24000

expected: |
  1) "PK51234567" recoverable character for character, read in chunks
  2) "UPC" as letters
  3) "four days" recoverable

checks:
  duration_s: {min: 2.8, max: 16.3}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  max_wer: 0.05

tags: [oct-2026, english, telecom, porting-mnp-upc-retention, hard, even-contest, new-english]
