# telco-hi-12 - Bill payment receipt number (Telecom)
#
# SOURCE. v2 text-to-speech bank, scenario telco-hi-12: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/telco-hi-12
# LANGUAGE. Hindi (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Postpaid & broadband billing.
# TARGET CUSTOMER. Mobile Network Operators, Broadband Providers.
# WHAT THIS TESTS. A raw amount and a letter/digit receipt number inside a Devanagari sentence
# SPEECH SKILLS. Numbers: codes, amounts; Pronunciation: brands.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: telco-hi-12
modality: voice
task: text_to_speech
title: "Bill payment receipt number - Hindi"

input:
  script: |
    ₹1,199 का आपका Jio Postpaid bill payment मिल गया है। Receipt number है R, C, P, T, four, four, seven, zero, one, nine।
  language: hi-IN

params:
  voice: male_older
  format: wav
  sample_rate: 24000

expected: |
  1) "RCPT447019" Recoverable character-for-character, read in confirmable chunks, not run together
  2) Amount "ग्यारह सौ निन्यानवे" / "एक हज़ार एक सौ निन्यानवे" recoverable

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, telecom, postpaid-broadband-billing, hard, gemini-lean, v2-bank]
