# fqc-hi-01 - Delivery-partner ETA plus order code (Food & quick commerce)
#
# SOURCE. v2 text-to-speech bank, scenario fqc-hi-01: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/fqc-hi-01
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Order & ETA.
# TARGET CUSTOMER. Food Delivery Apps, Quick-commerce Apps.
# WHAT THIS TESTS. A delivery-platform brand name plus a short alphanumeric order code
# SPEECH SKILLS. Numbers: codes, dates/times; Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: fqc-hi-01
modality: voice
task: text_to_speech
title: "Delivery-partner ETA plus order code - Hinglish"

input:
  script: |
    Aapka delivery partner, Zomato se, ab paanch minute door hai. Order ID hai, Z, X, nine, nine, one, two.
  language: hi-IN

params:
  voice: female_young
  format: wav
  sample_rate: 24000

expected: |
  1) "ZX9912" recoverable character-for-character
  2) Confusable characters (0/O, 1/I) handled without ambiguity
  3) Read in confirmable chunks, not run together

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, food-quick-commerce, order-eta, medium, even-contest, v2-bank]
