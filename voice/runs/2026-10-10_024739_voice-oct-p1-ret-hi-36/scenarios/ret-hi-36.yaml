# ret-hi-36 - Plus Premium tier and partner redemption brands (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-36: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-36
# LANGUAGE. Hindi (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Loyalty & subscriptions - SuperCoins, Prime, tiers, NeuCoins.
# TARGET CUSTOMER. E-commerce Marketplaces.
# WHAT THIS TESTS. A tier name, a raw points figure and three partner brands in one Devanagari passage
# SPEECH SKILLS. Numbers: amounts; Pronunciation: brands.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-36
modality: voice
task: text_to_speech
title: "Plus Premium tier and partner redemption brands - Hindi"

input:
  script: |
    बधाई हो! आप Flipkart Plus Premium member बन गए हैं। आपके पास अब 2,450 SuperCoins हैं, जिन्हें आप Cleartrip, Swiggy या Myntra पर use कर सकते हैं।
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) Points "दो हज़ार चार सौ पचास" recoverable
  2) Tier "Plus Premium" natural
  3) Every named brand pronounced the way a native speaker would say it, not spelled out letter-by-letter (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, ecommerce-retail, loyalty-subscriptions, hard, gemini-lean, v2-bank]
