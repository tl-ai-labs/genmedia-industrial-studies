# ret-hi-09 - Pay Later limit raised, bill due — mixed script (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-09: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-09
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Checkout & payments - COD, no-cost EMI, Pay Later, failed payments.
# TARGET CUSTOMER. E-commerce Marketplaces, Consumer Electronics Brands.
# WHAT THIS TESTS. Two raw limit amounts and a bill amount plus a date, inside a Devanagari-matrix sentence — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: amounts, dates/times; Pronunciation: brands.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-09
modality: voice
task: text_to_speech
title: "Pay Later limit raised, bill due — mixed script - Hinglish"

input:
  script: |
    आपकी Flipkart Pay Later limit ₹10,000 se badhkar ₹25,000 हो गई है, aur आपका pichhla bill ₹3,480 दस तारीख तक due hai।
  language: hi-IN

params:
  voice: male_mid
  format: wav
  sample_rate: 24000

expected: |
  1) All three amounts recoverable in Hindi numbering
  2) Date "दस तारीख" recoverable
  3) "Pay Later" natural
  4) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  5) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, ecommerce-retail, checkout-payments, medium, gemini-lean, v2-bank]
