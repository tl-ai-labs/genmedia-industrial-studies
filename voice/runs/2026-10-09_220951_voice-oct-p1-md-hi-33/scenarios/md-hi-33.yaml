# md-hi-33 - Layoff announcement — leader takes responsibility — mixed script (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-33: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-33
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Medium. SETTING. Serialised drama.
# USE CASE. Corporate / business.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms, Audiobook Platforms.
# WHAT THIS TESTS. A grave, empathetic leadership register with a head-count figure, across the switch — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: amounts; Emotion.
# PICKED AS. Gemini-lean - rupee amounts; delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-33
modality: voice
task: styled_tts
title: "Layoff announcement — leader takes responsibility — mixed script - Hinglish"

input:
  script: |
    मैं जानती हूँ yeh sunna aasaan नहीं है। Due to restructuring, हमें is quarter mein team के 40 लोगों को let go karna pad raha है — और iski zimmedaari मेरी है।
  language: hi-IN
  style: "grave, empathetic leadership"

params:
  voice: female_older
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) One continuous prosody; the emotion does not reset at the language switch
  5) Figure "40" recoverable
  6) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  7) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.4, max: 32.2}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, micro-drama-entertainment, corporate-business, medium, gemini-lean, v2-bank]
