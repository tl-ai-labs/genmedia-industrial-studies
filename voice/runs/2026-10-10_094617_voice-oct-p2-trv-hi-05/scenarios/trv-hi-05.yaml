# trv-hi-05 - Howrah Rajdhani — platform, time, PNR — mixed script (Travel & mobility)
#
# SOURCE. v2 text-to-speech bank, scenario trv-hi-05: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/trv-hi-05
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Train - PNR, train numbers, waitlist, platform changes.
# TARGET CUSTOMER. Rail Booking Platforms.
# WHAT THIS TESTS. A train number and name, a platform, a clock time and a ten-digit PNR, Hindi in both scripts — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: codes, dates/times; Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: trv-hi-05
modality: voice
task: text_to_speech
title: "Howrah Rajdhani — platform, time, PNR — mixed script - Hinglish"

input:
  script: |
    आपकी train 12301, Howrah Rajdhani Express, platform number 9 se शाम 4:50 पर nikalegi। आपका PNR है two, four, one, five, zero, eight, seven, seven, three, six।
  language: hi-IN

params:
  voice: male_mid
  format: wav
  sample_rate: 24000

expected: |
  1) PNR "2415087736" recoverable
  2) Train number and platform recoverable
  3) "4:50" read as a time
  4) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  5) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, travel-mobility, train, hard, even-contest, v2-bank]
