# trv-hi-12 - Ride-safety check — route deviation (Travel & mobility)
#
# SOURCE. v2 text-to-speech bank, scenario trv-hi-12: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/trv-hi-12
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Cabs & mobility - ride OTP, number plates, safety.
# TARGET CUSTOMER. Ride-hailing Apps.
# WHAT THIS TESTS. A Karnataka plate read as a ride reference, plus a DTMF instruction, in a calm-urgent register
# SPEECH SKILLS. Numbers: codes; Pronunciation: brands; Emotion.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: trv-hi-12
modality: voice
task: text_to_speech
title: "Ride-safety check — route deviation - Hinglish"

input:
  script: |
    Namaste, yeh Ola safety team hai. Aapki ride, K, A, zero, five, M, N, four, four, one, eight, ne route change kiya hai. Kya aap surakshit hain? Haan ke liye ek dabaayein.
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) "KA05MN4418" Recoverable character-for-character, read in confirmable chunks, not run together
  2) Confusable characters (0/O, 1/I, 5/S, 8/B) handled without ambiguity
  3) Calm but urgent (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, travel-mobility, cabs-mobility, hard, even-contest, v2-bank]
