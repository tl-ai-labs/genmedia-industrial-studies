# ret-hi-11 - Payment failed but debited — transaction ID (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-11: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-11
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Checkout & payments - COD, no-cost EMI, Pay Later, failed payments.
# TARGET CUSTOMER. E-commerce Marketplaces, Consumer Electronics Brands.
# WHAT THIS TESTS. A raw amount, a working-day window and a letter/digit transaction ID in one Hinglish passage
# SPEECH SKILLS. Numbers: codes, amounts, dates/times; Emotion.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-11
modality: voice
task: text_to_speech
title: "Payment failed but debited — transaction ID - Hinglish"

input:
  script: |
    Aapka Rs 2,349 ka payment fail ho gaya, lekin amount aapke account se debit ho gaya hai. Yeh paisa teen se paanch working days mein automatically refund ho jaayega. Transaction ID hai T, X, N, eight, eight, zero, two, one, four.
  language: hi-IN

params:
  voice: male_mid
  format: wav
  sample_rate: 24000

expected: |
  1) "TXN880214" Recoverable character-for-character, read in confirmable chunks, not run together
  2) Amount recoverable in Hindi numbering
  3) Reassuring register

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, ecommerce-retail, checkout-payments, hard, gemini-lean, v2-bank]
