# fqc-hi-04 - Handover OTP and cash to collect (Food & quick commerce)
#
# SOURCE. v2 text-to-speech bank, scenario fqc-hi-04: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/fqc-hi-04
# LANGUAGE. Hindi (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Delivery - OTP, partner, address.
# TARGET CUSTOMER. Food Delivery Apps, Quick-commerce Apps.
# WHAT THIS TESTS. A delivery-partner name, a four-digit OTP with repeated pairs and a raw cash amount
# SPEECH SKILLS. Numbers: codes, amounts; Pronunciation: names, brands, acronyms.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: fqc-hi-04
modality: voice
task: text_to_speech
title: "Handover OTP and cash to collect - Hindi"

input:
  script: |
    आपके Zepto delivery partner इमरान शेख़ बाहर हैं। Handover के लिए OTP है three, eight, three, eight — और ₹1,247 cash में देना है।
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) OTP "3838" recoverable
  2) Amount "बारह सौ सैंतालीस" / "एक हज़ार दो सौ सैंतालीस" recoverable
  3) Name natural

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, food-quick-commerce, delivery, hard, gemini-lean, v2-bank]
