# bank-te-04 - EMI with raw lakh numeral — Telugu script (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-te-04: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-te-04
# LANGUAGE. Telugu (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Loans & EMI - EMI reminders, approvals, prepayment, gold loans, collections.
# TARGET CUSTOMER. Retail Banks, NBFCs & Lenders.
# WHAT THIS TESTS. A raw lakh numeral converted to Indian numbering inside a Telugu-script sentence
# SPEECH SKILLS. Numbers: amounts, dates/times; Pronunciation: brands, acronyms.
# PICKED AS. Gemini-lean - lakh / crore amounts (ElevenLabs garbled these in Sept); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-te-04
modality: voice
task: text_to_speech
title: "EMI with raw lakh numeral — Telugu script - Telugu"

input:
  script: |
    మీ HDFC home loan EMI ₹1,25,475, ఐదో తేదీన auto-debit అవుతుంది. దయచేసి sufficient balance ఉంచండి.
  language: te-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Amount spoken in the Indian system (lakh), not the international convention
  2) Date "ఐదో తేదీ" recoverable
  3) "EMI" as letters

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false
  # Expected item: the lakh reading of the amount written in Indian digit
  # grouping. Added 2026-10-10. Telugu bends the word, and the check matches
  # whole words, so each form is listed (లక్ష, లక్షా, లక్షల, లక్షలు, లక్షలా -
  # the last added after bank-te-08, where both models said "ఏడు లక్షలా"), with
  # the Roman and Devanagari spellings in case the transcript comes back in those.
  must_say_any:
    - ["lakh", "लाख", "లక్ష", "లక్షా", "లక్షల", "లక్షలు", "లక్షలా"]

tags: [oct-2026, telugu, banking-financial-services, loans-emi, hard, gemini-lean, v2-bank]
