# hlt-hi-08 - Thyroid and calcium — strengths and dosing — mixed script (Healthcare & pharma)
#
# SOURCE. v2 text-to-speech bank, scenario hlt-hi-08: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/hlt-hi-08
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Pharmacy - medicine names, strengths, dosing, refills.
# TARGET CUSTOMER. Online Pharmacies.
# WHAT THIS TESTS. Two medicine brands with strengths (mcg, mg) and two dosing instructions, Hindi in both scripts — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: dates/times; Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: hlt-hi-08
modality: voice
task: text_to_speech
title: "Thyroid and calcium — strengths and dosing — mixed script - Hinglish"

input:
  script: |
    आपकी Apollo 24/7 order mein hain: Thyronorm 50 mcg — roz सुबह khaali pet, aur Shelcal 500 — din में ek baar खाने ke baad।
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) "Thyronorm 50 mcg" and "Shelcal 500" recoverable exactly
  2) "mcg" read as "M C G" / "microgram"
  3) Dosing attached to the right medicine
  4) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  5) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, healthcare-pharma, pharmacy, hard, even-contest, v2-bank]
