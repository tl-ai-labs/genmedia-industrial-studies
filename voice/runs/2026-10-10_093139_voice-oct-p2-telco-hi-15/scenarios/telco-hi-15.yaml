# telco-hi-15 - Porting code (UPC) readback (Telecom)
#
# SOURCE. v2 text-to-speech bank, scenario telco-hi-15: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/telco-hi-15
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Porting (MNP / UPC) & retention.
# TARGET CUSTOMER. Mobile Network Operators.
# WHAT THIS TESTS. A letter/digit UPC code plus a validity-days figure
# SPEECH SKILLS. Numbers: codes, dates/times.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: telco-hi-15
modality: voice
task: text_to_speech
title: "Porting code (UPC) readback - Hinglish"

input:
  script: |
    Aapka porting code hai, P, K, five, one, two, three, four, five, six, seven. Yeh code char din tak valid rahega.
  language: hi-IN

params:
  voice: female_young
  format: wav
  sample_rate: 24000

expected: |
  1) "PK51234567" Recoverable character-for-character, read in confirmable chunks, not run together
  2) Confusable characters (0/O, 1/I, 5/S, 8/B) handled without ambiguity
  3) Validity "char din" recoverable

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, telecom, porting-mnp-upc-retention, hard, even-contest, v2-bank]
