# md-hi-52 - Split-the-bill fight — three voices, four amounts (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-52: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-52
# LANGUAGE. Hindi (Native script). DIFFICULTY. Hard. SETTING. Serialised drama.
# USE CASE. Multi-voice scenes (2–3 characters, one narrator).
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms.
# WHAT THIS TESTS. Three distinguishable voices trading four raw amounts and two payment-app brands under rising irritation
# SPEECH SKILLS. Numbers: amounts; Pronunciation: brands; Emotion; Conversation: narrated, 3 characters.
# PICKED AS. Gemini-lean - rupee amounts; delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-52
modality: voice
task: styled_tts
title: "Split-the-bill fight — three voices, four amounts - Hindi"

input:
  script: |
    "Bill ₹2,340 का है, हम तीन लोग — हर किसी का ₹780।" "Bro, Swiggy वाला ₹450 तो मैंने already pay किया था!" "तो तू बस ₹330 भेज दे, PhonePe पर। अभी!"
  language: hi-IN
  style: "rising irritation among three friends, three distinct voices"

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages
  2) Three voices distinguishable and consistent (judge)
  3) All four amounts recoverable in Hindi numbering
  4) Irritation rises without swallowing the numbers

checks:
  duration_s: {min: 6.2, max: 31.3}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, micro-drama-entertainment, multi-voice-scenes-2-3-characters-one-narrator, hard, gemini-lean, v2-bank]
