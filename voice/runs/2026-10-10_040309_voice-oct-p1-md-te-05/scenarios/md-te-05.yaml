# md-te-05 - Alibi questioned — Telugu script (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-te-05: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-te-05
# LANGUAGE. Telugu (Native script). DIFFICULTY. Hard. SETTING. Serialised drama.
# USE CASE. Thriller / crime.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms, Audiobook Platforms.
# WHAT THIS TESTS. A cold investigator against a defensive suspect, with two clock times, in Telugu script
# SPEECH SKILLS. Emotion; Conversation: 2 voices.
# PICKED AS. Even contest - delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.
#
# TWO VOICES. Each line starts with its speaker's label. Gemini gets the
# labelled script with one prebuilt voice per label; ElevenLabs gets one
# Text to Dialogue input per line, label removed.

id: md-te-05
modality: voice
task: styled_tts
title: "Alibi questioned — Telugu script - Telugu"

input:
  script: |
    A: ఆ రాత్రి పదకొండు గంటలకు నువ్వు ఎక్కడ ఉన్నావు, Suresh?
    B: I told you — ఇంట్లోనే ఉన్నాను! Ask my wife!
    A: మీ wife చెప్పింది నువ్వు రాత్రి ఒంటి గంటకు వచ్చావని. Explain that.
  language: te-IN
  style: "A: cold, measured interrogation; B: defensive, rattled"

params:
  speakers:
    - {label: A, voice: male_older, style: "cold, measured interrogation"}
    - {label: B, voice: male_mid, style: "defensive, rattled"}
  format: wav
  sample_rate: 24000

expected: |
  1) Every turn read in order, nothing dropped
  2) The two speakers are clearly different voices, each consistent in voice and age across turns (judge)
  3) Contrasting emotions held: A stays cold, B stays defensive — no bleed from one speaker to the other (judge)
  4) Telugu segments pronounced correctly; code-switch reads native (judge)

checks:
  duration_s: {min: 5.4, max: 27.8}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, telugu, micro-drama-entertainment, thriller-crime, hard, even-contest, v2-bank]
