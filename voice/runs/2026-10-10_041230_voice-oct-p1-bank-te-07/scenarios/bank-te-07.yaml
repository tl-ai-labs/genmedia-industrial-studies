# bank-te-07 - OTP with warning — Telugu (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-te-07: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-te-07
# LANGUAGE. Tenglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Fraud & security - OTP, fraud alerts, new-device login, scam warnings.
# TARGET CUSTOMER. Retail Banks, Credit Card Issuers.
# WHAT THIS TESTS. Six digits with a repeated pair switched to English mid-Telugu sentence, with a warning clause
# SPEECH SKILLS. Numbers: codes; Pronunciation: acronyms.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-te-07
modality: voice
task: text_to_speech
title: "OTP with warning — Telugu - Tenglish"

input:
  script: |
    Mee transaction OTP — seven, zero, seven, one, one, four. Ee OTP evvaritho share cheyyakandi; bank eppudu OTP adagadu.
  language: te-IN

params:
  voice: female_older
  format: wav
  sample_rate: 24000

expected: |
  1) All six digits recoverable
  2) Warning clause intelligible

checks:
  # Minimum lowered from 6.0 s on 2026-10-10 (round 1), before running: a
  # complete read of a short line can come in under 6 s. Now 0.2 s a word,
  # as in the drama scenarios (a read faster than 5 words a second is too short).
  duration_s: {min: 3.8, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, tenglish, banking-financial-services, fraud-security, medium, even-contest, v2-bank]
