# telco-hi-18 - Customer name and service-request ID (Telecom)
#
# SOURCE. v2 text-to-speech bank, scenario telco-hi-18: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/telco-hi-18
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Complaints & service requests.
# TARGET CUSTOMER. Mobile Network Operators.
# WHAT THIS TESTS. An Indian person's name plus a short alphanumeric service-request ID
# SPEECH SKILLS. Numbers: codes; Pronunciation: names.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: telco-hi-18
modality: voice
task: text_to_speech
title: "Customer name and service-request ID - Hinglish"

input:
  script: |
    Namaste, main baat kar raha hoon Ananya Iyer se? Aapki service request, S, R, seven, seven, eight, eight, registered ho gayi hai.
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) "SR7788" recoverable character-for-character
  2) Confusable characters (0/O, 1/I) handled without ambiguity
  3) Read in confirmable chunks, not run together

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, telecom, complaints-service-requests, medium, even-contest, v2-bank]
