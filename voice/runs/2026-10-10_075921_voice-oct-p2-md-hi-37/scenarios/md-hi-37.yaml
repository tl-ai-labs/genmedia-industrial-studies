# md-hi-37 - Cricket-commentary excitement (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-37: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-37
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Serialised drama.
# USE CASE. Comedy & light entertainment.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms.
# WHAT THIS TESTS. Rapid, escalating excitement sustained through a fast bilingual sentence
# SPEECH SKILLS. Numbers: amounts; Emotion.
# PICKED AS. Gemini-lean - rupee amounts; delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-37
modality: voice
task: styled_tts
title: "Cricket-commentary excitement - Hinglish"

input:
  script: |
    Aur woh dekhiye — last ball, six runs chahiye, aur batsman ne maara ek massive six! Stadium mein sannata... no wait, crowd is going absolutely crazy!
  language: hi-IN
  style: "rapid, escalating excitement, crowd energy"

params:
  voice: male_mid
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) One continuous prosody; the emotion does not reset at the language switch

checks:
  duration_s: {min: 5.2, max: 26.9}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, micro-drama-entertainment, comedy-light-entertainment, medium, gemini-lean, v2-bank]
