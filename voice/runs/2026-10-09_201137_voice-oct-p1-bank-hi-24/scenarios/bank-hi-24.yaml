# bank-hi-24 - Gold-loan maturity and renewal (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-hi-24: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-hi-24
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Loans & EMI - EMI reminders, approvals, prepayment, gold loans, collections.
# TARGET CUSTOMER. Retail Banks, NBFCs & Lenders.
# WHAT THIS TESTS. An NBFC brand name plus a letter/digit loan number inside a Hinglish reminder
# SPEECH SKILLS. Numbers: codes, dates/times; Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-hi-24
modality: voice
task: text_to_speech
title: "Gold-loan maturity and renewal - Hinglish"

input:
  script: |
    Aapka Muthoot Finance gold loan, jiska loan number hai G, L, two, four, six, eight, one, agle hafte mature ho raha hai. Renew karne ke liye apni nearest branch visit karein.
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) "GL24681" Recoverable character-for-character, read in confirmable chunks, not run together
  2) "Muthoot" pronounced as a native speaker says it (judge)
  3) Relative date "agle hafte" intelligible

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, banking-financial-services, loans-emi, medium, even-contest, v2-bank]
