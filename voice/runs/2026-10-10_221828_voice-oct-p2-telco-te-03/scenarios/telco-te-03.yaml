# telco-te-03 - Port-in status — number and request ID, Telugu (Telecom)
#
# SOURCE. v2 text-to-speech bank, scenario telco-te-03: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/telco-te-03
# LANGUAGE. Tenglish (Romanised). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Porting (MNP / UPC) & retention.
# TARGET CUSTOMER. Mobile Network Operators.
# WHAT THIS TESTS. A ten-digit number, two operator brands and a letter/digit porting request ID
# SPEECH SKILLS. Numbers: codes; Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: telco-te-03
modality: voice
task: text_to_speech
title: "Port-in status — number and request ID, Telugu - Tenglish"

input:
  script: |
    Mee number nine, eight, four, eight, zero, one, two, three, three, seven, Airtel nundi Jio ki port avutondi. Request ID M, N, P, six, one, zero, nine.
  language: te-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) Number "9848012337" recoverable
  2) "MNP6109" Recoverable character-for-character, read in confirmable chunks, not run together

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, tenglish, telecom, porting-mnp-upc-retention, hard, even-contest, v2-bank]
