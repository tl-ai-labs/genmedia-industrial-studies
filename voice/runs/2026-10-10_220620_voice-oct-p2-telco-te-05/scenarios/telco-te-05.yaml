# telco-te-05 - Network complaint — Madhapur tower, Telugu mixed script — mixed script (Telecom)
#
# SOURCE. v2 text-to-speech bank, scenario telco-te-05: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/telco-te-05
# LANGUAGE. Telugu (Mixed script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Complaints & service requests.
# TARGET CUSTOMER. Mobile Network Operators.
# WHAT THIS TESTS. An empathetic register with a letter/digit ticket and a locality, Telugu in both scripts — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: codes, dates/times; Emotion.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: telco-te-05
modality: voice
task: text_to_speech
title: "Network complaint — Madhapur tower, Telugu mixed script — mixed script - Telugu"

input:
  script: |
    Sorry sir, మీకు మూడు రోజులుగా network problem undi ani మాకు తెలుసు. Mee ticket number C, M, P, eight, two, two, zero, five; Madhapur tower రేపు check chestaam.
  language: te-IN

params:
  voice: female_young
  format: wav
  sample_rate: 24000

expected: |
  1) "CMP82205" Recoverable character-for-character, read in confirmable chunks, not run together
  2) Genuine empathy (judge)
  3) "Madhapur" natural
  4) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  5) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, telugu, telecom, complaints-service-requests, hard, even-contest, v2-bank]
