# trv-hi-11 - Bike-taxi captain ETA and fare — mixed script (Travel & mobility)
#
# SOURCE. v2 text-to-speech bank, scenario trv-hi-11: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/trv-hi-11
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Cabs & mobility - ride OTP, number plates, safety.
# TARGET CUSTOMER. Ride-hailing Apps.
# WHAT THIS TESTS. A brand, a captain name, a minute ETA and a raw fare in Devanagari — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: amounts, dates/times; Pronunciation: names, brands, acronyms.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: trv-hi-11
modality: voice
task: text_to_speech
title: "Bike-taxi captain ETA and fare — mixed script - Hinglish"

input:
  script: |
    आपका Rapido captain संदीप 3 minute mein pahunch raha है। Fare ₹87 hai, आप cash या UPI se pay kar sakte हैं।
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Fare "सत्तासी रुपये" recoverable
  2) "Rapido" natural; "UPI" as letters
  3) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  4) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, travel-mobility, cabs-mobility, medium, gemini-lean, v2-bank]
