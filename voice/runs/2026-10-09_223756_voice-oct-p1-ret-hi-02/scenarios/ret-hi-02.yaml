# ret-hi-02 - Festival-sale date reminder (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-02: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-02
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Easy. SETTING. Call centre.
# USE CASE. Sale events & offers - festive sales, coupons, bank offers, restock.
# TARGET CUSTOMER. E-commerce Marketplaces.
# WHAT THIS TESTS. A retail brand name plus a festival name and a specific date
# SPEECH SKILLS. Numbers: dates/times; Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-02
modality: voice
task: text_to_speech
title: "Festival-sale date reminder - Hinglish"

input:
  script: |
    Flipkart ki Diwali sale, agle hafte, teesri tareek se shuru ho rahi hai. Mat bhooliye apni wishlist check karna!
  language: hi-IN

params:
  voice: female_older
  format: wav
  sample_rate: 24000

expected: |
  1) Every named brand pronounced the way a native speaker would say it, not spelled out letter-by-letter (judge)
  2) Brand names stay in English inside the Hindi sentence without a jarring register break

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, ecommerce-retail, sale-events-offers, easy, even-contest, v2-bank]
