# ret-hi-12 - Courier brand plus tracking ID (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-12: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-12
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Order confirmation & tracking - order IDs, AWBs, couriers, delays.
# TARGET CUSTOMER. E-commerce Marketplaces, Logistics & Courier Companies.
# WHAT THIS TESTS. A logistics brand name plus a short letter/digit tracking code
# SPEECH SKILLS. Numbers: codes; Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-12
modality: voice
task: text_to_speech
title: "Courier brand plus tracking ID - Hinglish"

input:
  script: |
    Aapka order, Blue Dart courier ke through bheja gaya hai. Tracking ID hai, B, D, seven, seven, two, four, four, one.
  language: hi-IN

params:
  voice: female_older
  format: wav
  sample_rate: 24000

expected: |
  1) "BD772441" Recoverable character-for-character, read in confirmable chunks, not run together
  2) Confusable characters (0/O, 1/I, 5/S, 8/B) handled without ambiguity
  3) "Blue Dart" natural

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, ecommerce-retail, order-confirmation-tracking, medium, even-contest, v2-bank]
