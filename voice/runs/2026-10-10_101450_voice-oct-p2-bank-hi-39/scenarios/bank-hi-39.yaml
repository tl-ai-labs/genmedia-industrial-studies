# bank-hi-39 - Bereavement — life-insurance death claim (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-hi-39: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-hi-39
# LANGUAGE. Hindi (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Deposits, wealth & insurance - FD, SIP, policies, health claims, RM callbacks.
# TARGET CUSTOMER. Insurers, Investment & Wealth Platforms.
# WHAT THIS TESTS. Condolence register held while reading a raw lakh amount, a day window, a claim code and the deceased's full name
# SPEECH SKILLS. Numbers: codes, amounts, dates/times; Pronunciation: names, brands, acronyms; Emotion.
# PICKED AS. Gemini-lean - lakh / crore amounts (ElevenLabs garbled these in Sept); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-hi-39
modality: voice
task: text_to_speech
title: "Bereavement — life-insurance death claim - Hindi"

input:
  script: |
    हमें आपके पिता, श्री रघुनाथ प्रसाद तिवारी, के निधन का बहुत दुःख है। उनकी LIC policy का death claim, ₹15,00,000, हम 7 working days में settle कर देंगे। आपका claim number है D, C, L, nine, zero, two, two, seven।
  language: hi-IN

params:
  voice: male_older
  format: wav
  sample_rate: 24000

expected: |
  1) Compassionate, unhurried condolence register — never brisk or promotional (judge)
  2) Amount read as "पंद्रह लाख", not the international convention
  3) "DCL90227" recoverable character-for-character
  4) Name "श्री रघुनाथ प्रसाद तिवारी" said with care and correct pronunciation

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false
  # Expected item: the lakh reading of the amount written in Indian digit
  # grouping. Added 2026-10-10 so it is checked, as in English and Hinglish;
  # listed in both writing systems.
  must_say_any:
    - ["lakh", "लाख"]

tags: [oct-2026, hindi, banking-financial-services, deposits-wealth-insurance, hard, gemini-lean, v2-bank]
