# md-hi-04 - Grandmother's blessing (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-04: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-04
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Easy. SETTING. Serialised drama.
# USE CASE. Family drama.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms.
# WHAT THIS TESTS. A slow, warm elder register carried across a closing English clause
# SPEECH SKILLS. Emotion.
# PICKED AS. Gemini-lean - delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-04
modality: voice
task: styled_tts
title: "Grandmother's blessing - Hinglish"

input:
  script: |
    Beta, aashirwad hai mera tumhare saath, hamesha. Zindagi mein jo bhi karo, apne dil ki suno — that's the only advice I have for you.
  language: hi-IN
  style: "warm, slow, elder tenderness"

params:
  voice: female_elder
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) One continuous prosody; the emotion does not reset at the language switch

checks:
  duration_s: {min: 5.0, max: 26.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, micro-drama-entertainment, family-drama, easy, gemini-lean, v2-bank]
