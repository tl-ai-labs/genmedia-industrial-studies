# bank-hi-17 - International transaction declined — foreign currency — mixed script (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-hi-17: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-hi-17
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Cards - dispatch, limits, dues, rewards, declines, replacement.
# TARGET CUSTOMER. Credit Card Issuers, Retail Banks.
# WHAT THIS TESTS. A foreign-currency code (AED) and amount, where the international reading is correct, inside a Devanagari-matrix sentence — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: amounts; Pronunciation: names, acronyms.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-hi-17
modality: voice
task: text_to_speech
title: "International transaction declined — foreign currency — mixed script - Hinglish"

input:
  script: |
    आपके card par Dubai Duty Free में AED 1,250 ka transaction decline हुआ है, kyunki आपके card पर international usage abhi off है।
  language: hi-IN

params:
  voice: male_mid
  format: wav
  sample_rate: 24000

expected: |
  1) "AED" said as individual letters (or as "dirham") — not as a word (judge)
  2) Amount "1,250" recoverable
  3) "Dubai Duty Free" pronounced naturally
  4) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  5) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, banking-financial-services, cards, medium, gemini-lean, v2-bank]
