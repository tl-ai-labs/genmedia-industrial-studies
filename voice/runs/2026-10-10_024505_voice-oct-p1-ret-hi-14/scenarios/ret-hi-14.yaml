# ret-hi-14 - Order confirmed — 14-character order ID (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-14: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-14
# LANGUAGE. Hindi (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Order confirmation & tracking - order IDs, AWBs, couriers, delays.
# TARGET CUSTOMER. E-commerce Marketplaces, Logistics & Courier Companies.
# WHAT THIS TESTS. A 14-character order ID (two letters + twelve digits) plus a weekday and numeral date
# SPEECH SKILLS. Numbers: codes, dates/times; Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-14
modality: voice
task: text_to_speech
title: "Order confirmed — 14-character order ID - Hindi"

input:
  script: |
    आपका Flipkart order confirm हो गया है। Order ID है O, D, three, three, one, two, zero, eight, seven, seven, five, four, zero, one। Delivery बुधवार, 15 अक्टूबर तक होगी।
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) "OD331208775401" Recoverable character-for-character, read in confirmable chunks, not run together
  2) "O" (letter) vs "0" (zero) kept distinct (judge)
  3) Date "पंद्रह अक्टूबर" recoverable

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, ecommerce-retail, order-confirmation-tracking, hard, even-contest, v2-bank]
