# trv-hi-04 - Tatkal booking opens (Travel & mobility)
#
# SOURCE. v2 text-to-speech bank, scenario trv-hi-04: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/trv-hi-04
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Easy. SETTING. Call centre.
# USE CASE. Train - PNR, train numbers, waitlist, platform changes.
# TARGET CUSTOMER. Rail Booking Platforms.
# WHAT THIS TESTS. A booking-scheme name and a clock time in one short sentence
# SPEECH SKILLS. Numbers: dates/times; Pronunciation: brands, acronyms.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: trv-hi-04
modality: voice
task: text_to_speech
title: "Tatkal booking opens - Hinglish"

input:
  script: |
    Kal ke liye Tatkal booking subah das baje AC class ke liye khul jaayegi.
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) "Tatkal" natural
  2) "das baje" recoverable
  3) "AC" as letters

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, travel-mobility, train, easy, even-contest, v2-bank]
