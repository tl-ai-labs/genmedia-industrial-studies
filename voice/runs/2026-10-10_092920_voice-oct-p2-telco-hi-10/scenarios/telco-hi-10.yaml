# telco-hi-10 - Postpaid bill due-date reminder (Telecom)
#
# SOURCE. v2 text-to-speech bank, scenario telco-hi-10: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/telco-hi-10
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Postpaid & broadband billing.
# TARGET CUSTOMER. Mobile Network Operators, Broadband Providers.
# WHAT THIS TESTS. A telecom brand name plus a currency amount and a due date
# SPEECH SKILLS. Numbers: amounts, dates/times; Pronunciation: brands.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: telco-hi-10
modality: voice
task: text_to_speech
title: "Postpaid bill due-date reminder - Hinglish"

input:
  script: |
    Aapka Airtel postpaid bill, chhah sau chaubees rupaye ka, is mahine ki dus tareek tak due hai.
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Amount "chhah sau chaubees rupaye" recoverable exactly
  2) Date "dus tareek" recoverable exactly
  3) "Airtel postpaid" intelligible inside the Hindi sentence

checks:
  # Minimum lowered from 6.0 s on 2026-10-10 (round 1): a complete read of
  # this short line came in under 6 s. Now 0.2 s a word, as in the drama
  # scenarios (a read faster than 5 words a second is too short).
  duration_s: {min: 3.4, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, telecom, postpaid-broadband-billing, medium, gemini-lean, v2-bank]
