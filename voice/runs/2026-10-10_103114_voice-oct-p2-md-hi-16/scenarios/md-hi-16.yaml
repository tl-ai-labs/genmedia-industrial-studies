# md-hi-16 - Airport goodbye — flight time and two cities (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-16: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-16
# LANGUAGE. Hindi (Native script). DIFFICULTY. Medium. SETTING. Serialised drama.
# USE CASE. Romance & coming-of-age.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms, Audiobook Platforms.
# WHAT THIS TESTS. A raw clock time and two city names held inside a tender, near-tearful register
# SPEECH SKILLS. Numbers: dates/times; Pronunciation: names; Emotion.
# PICKED AS. Gemini-lean - delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-16
modality: voice
task: styled_tts
title: "Airport goodbye — flight time and two cities - Hindi"

input:
  script: |
    मीरा, मेरी flight कल सुबह 6:40 की है, Mumbai से Toronto। मुझे नहीं पता मैं कब लौटूँगा — but I promise, हर रात call करूँगा।
  language: hi-IN
  style: "tender, aching, holding back tears"

params:
  voice: male_mid
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) One continuous prosody; the emotion does not reset at the language switch
  5) "6:40" read as a time ("छह चालीस" / "six forty" both pass)

checks:
  duration_s: {min: 5.0, max: 26.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, micro-drama-entertainment, romance-coming-of-age, medium, gemini-lean, v2-bank]
