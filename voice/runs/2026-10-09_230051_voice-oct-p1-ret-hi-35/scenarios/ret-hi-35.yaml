# ret-hi-35 - Subscription auto-renewal notice (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-35: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-35
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Loyalty & subscriptions - SuperCoins, Prime, tiers, NeuCoins.
# TARGET CUSTOMER. E-commerce Marketplaces.
# WHAT THIS TESTS. A subscription brand name plus a date and a currency amount in one sentence
# SPEECH SKILLS. Numbers: amounts, dates/times; Pronunciation: brands.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-35
modality: voice
task: text_to_speech
title: "Subscription auto-renewal notice - Hinglish"

input:
  script: |
    Aapki Amazon Prime membership, agle mahine ki paanchvi tareek ko renew hogi, jiska amount hoga chaar sau nabbe rupaye.
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Amount stated in the Indian numbering system, not the international convention
  2) Date/validity phrase ("paanchvi tareek") recoverable exactly
  3) English domain terms (EMI/due/auto-debit etc.) stay intelligible inside the Hindi sentence
  4) Calm, unhurried call-centre pace, every digit distinct

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, ecommerce-retail, loyalty-subscriptions, medium, gemini-lean, v2-bank]
