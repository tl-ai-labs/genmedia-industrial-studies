# ret-te-01 - No-cost EMI breakdown — Telugu (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-te-01: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-te-01
# LANGUAGE. Tenglish (Romanised). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Checkout & payments - COD, no-cost EMI, Pay Later, failed payments.
# TARGET CUSTOMER. E-commerce Marketplaces, Consumer Electronics Brands.
# WHAT THIS TESTS. Two raw amounts and a tenure in a Telugu-English sentence
# SPEECH SKILLS. Numbers: amounts; Pronunciation: brands, acronyms.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-te-01
modality: voice
task: text_to_speech
title: "No-cost EMI breakdown — Telugu - Tenglish"

input:
  script: |
    Mee Samsung Galaxy order meeda no-cost EMI select chesaaru — Rs 64,999 ni aaru nelalu, prathi nela Rs 10,833.
  language: te-IN

params:
  voice: male_older
  format: wav
  sample_rate: 24000

expected: |
  1) Both amounts read correctly, not the international convention for the larger one
  2) "EMI" as letters

checks:
  # Minimum lowered from 6.0 s on 2026-10-10 (round 1), before running: a
  # complete read of a short line can come in under 6 s. Now 0.2 s a word,
  # as in the drama scenarios (a read faster than 5 words a second is too short).
  duration_s: {min: 3.8, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, tenglish, ecommerce-retail, checkout-payments, hard, gemini-lean, v2-bank]
