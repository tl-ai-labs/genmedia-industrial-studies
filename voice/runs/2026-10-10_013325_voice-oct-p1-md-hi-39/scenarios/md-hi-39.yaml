# md-hi-39 - In-story brand placement — last-minute party gift (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-39: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-39
# LANGUAGE. Hindi (Native script). DIFFICULTY. Medium. SETTING. Serialised drama.
# USE CASE. Comedy & light entertainment.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms.
# WHAT THIS TESTS. Three brand names and two minute counts delivered in panicky-then-relieved comic timing
# SPEECH SKILLS. Numbers: dates/times; Pronunciation: brands; Emotion.
# PICKED AS. Gemini-lean - delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-39
modality: voice
task: styled_tts
title: "In-story brand placement — last-minute party gift - Hindi"

input:
  script: |
    अरे यार, party में सिर्फ़ 20 minute बचे हैं और मेरे पास gift नहीं है! रुक — Blinkit खोल... done! 10 minute में Cadbury Celebrations और एक Titan watch — sorted!
  language: hi-IN
  style: "panicky then triumphant comic energy"

params:
  voice: female_young
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) One continuous prosody; the emotion does not reset at the language switch
  5) Brand names "Blinkit", "Cadbury Celebrations", "Titan" natural — placement sounds in-story, not like an ad read (judge)
  6) Panic → relief turn lands

checks:
  duration_s: {min: 6.2, max: 31.3}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, micro-drama-entertainment, comedy-light-entertainment, medium, gemini-lean, v2-bank]
