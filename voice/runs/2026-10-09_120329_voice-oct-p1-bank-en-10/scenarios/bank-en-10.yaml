# bank-en-10 - Replacement card dispatched: AWB and security acronyms (Banking & financial services)
#
# SOURCE. New English scenario written for this run, modelled on v2 bank-hi-18 (https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-hi-18): same industry, use case, speaker, tests and difficulty.
# LANGUAGE. English (Indian English). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Cards - dispatch, limits, dues, rewards, declines, replacement.
# TARGET CUSTOMER. Credit Card Issuers, Retail Banks.
# SPEECH SKILLS. Numbers: codes; Pronunciation: brands, acronyms.
# PICKED AS. Even contest.

id: bank-en-10
modality: voice
task: text_to_speech
title: "Replacement card dispatched: AWB and security acronyms - English"

input:
  script: |
    Your replacement credit card has been dispatched through Blue Dart, AWB number 7815503294. When it arrives, do not share your CVV or PIN with anyone.
  language: en-IN

params:
  voice: female_older
  format: wav
  sample_rate: 24000

expected: |
  1) AWB "7815503294" recoverable digit for digit, read in chunks
  2) "AWB" and "CVV" as letters; "PIN" as the word "pin" (judge)
  3) Warning clause intelligible

checks:
  duration_s: {min: 5.0, max: 26.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  max_wer: 0.05

tags: [oct-2026, english, banking-financial-services, cards, hard, even-contest, new-english]
