# ret-hi-32 - Extended-warranty claim — appliance serial number (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-32: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-32
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Returns, refunds, exchange & warranty.
# TARGET CUSTOMER. E-commerce Marketplaces, Specialty Retailers.
# WHAT THIS TESTS. A retailer, an appliance brand and a mixed letter/digit serial number in one Hinglish passage
# SPEECH SKILLS. Numbers: codes; Pronunciation: brands, acronyms.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-32
modality: voice
task: text_to_speech
title: "Extended-warranty claim — appliance serial number - Hinglish"

input:
  script: |
    Aapka Reliance Digital extended warranty claim register ho gaya hai. Aapki LG washing machine ka serial number hai four, zero, eight, K, W, P, X, two, two, one.
  language: hi-IN

params:
  voice: female_older
  format: wav
  sample_rate: 24000

expected: |
  1) "408KWPX221" Recoverable character-for-character, read in confirmable chunks, not run together
  2) Confusable characters (0/O, 1/I, 5/S, 8/B) handled without ambiguity
  3) "LG" as letters

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, ecommerce-retail, returns-refunds-exchange-warranty, hard, even-contest, v2-bank]
