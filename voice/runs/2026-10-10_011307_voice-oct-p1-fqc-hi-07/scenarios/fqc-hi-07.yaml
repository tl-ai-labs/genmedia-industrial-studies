# fqc-hi-07 - Membership coupon code — percent, cap, minimum order (Food & quick commerce)
#
# SOURCE. v2 text-to-speech bank, scenario fqc-hi-07: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/fqc-hi-07
# LANGUAGE. Hindi (Native script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Refunds & coupons.
# TARGET CUSTOMER. Food Delivery Apps.
# WHAT THIS TESTS. A letter/digit coupon code, a percentage, a cap and a minimum-order amount stacked
# SPEECH SKILLS. Numbers: codes, amounts, units/%; Pronunciation: brands.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: fqc-hi-07
modality: voice
task: text_to_speech
title: "Membership coupon code — percent, cap, minimum order - Hindi"

input:
  script: |
    Zomato Gold पर आज का code है G, O, L, D, five, zero — ₹299 से ऊपर के order पर 50% off, ₹150 तक।
  language: hi-IN

params:
  voice: female_older
  format: wav
  sample_rate: 24000

expected: |
  1) "GOLD50" Recoverable character-for-character, read in confirmable chunks, not run together
  2) Percent, cap and minimum all recoverable and not confused

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, food-quick-commerce, refunds-coupons, hard, gemini-lean, v2-bank]
