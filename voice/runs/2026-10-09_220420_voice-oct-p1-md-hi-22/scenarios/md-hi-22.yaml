# md-hi-22 - Courtroom cross-examination — two voices (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-22: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-22
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Hard. SETTING. Serialised drama.
# USE CASE. Thriller / crime.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms, Audiobook Platforms.
# WHAT THIS TESTS. A sharp lawyer and a nervous witness trading turns across the code-switch; a clock time that the witness changes
# SPEECH SKILLS. Numbers: dates/times; Emotion; Conversation: 2 voices.
# PICKED AS. Even contest - delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.
#
# TWO VOICES. Each line starts with its speaker's label. Gemini gets the
# labelled script with one prebuilt voice per label; ElevenLabs gets one
# Text to Dialogue input per line, label removed.

id: md-hi-22
modality: voice
task: styled_tts
title: "Courtroom cross-examination — two voices - Hinglish"

input:
  script: |
    A: Objection, Your Honor — the witness is speculating. Mere paas sabooth hai ki mere client us raat ghar par hi tha.
    B: Main... main sirf wahi bata rahi hoon jo maine dekha, sir. Raat ke saadhe gyaarah baje the.
    A: Saadhe gyaarah? Pichhli baar aapne kaha tha das baje. Which one is it?
  language: hi-IN
  style: "A: formal, sharp, controlled intensity; B: nervous, faltering"

params:
  speakers:
    - {label: A, voice: male_older, style: "formal, sharp, controlled intensity"}
    - {label: B, voice: female_mid, style: "nervous, faltering"}
  format: wav
  sample_rate: 24000

expected: |
  1) Every turn read in order, nothing dropped
  2) The two speakers are clearly different voices, each consistent in voice and age across turns (judge)
  3) Contrasting emotions held: A stays sharp and controlled, B stays nervous and faltering — no bleed from one speaker to the other (judge)
  4) Hindi segments pronounced correctly; code-switch reads native (judge)
  5) Times "saadhe gyaarah" and "das baje" recoverable

checks:
  duration_s: {min: 10.2, max: 48.9}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, micro-drama-entertainment, thriller-crime, hard, even-contest, v2-bank]
