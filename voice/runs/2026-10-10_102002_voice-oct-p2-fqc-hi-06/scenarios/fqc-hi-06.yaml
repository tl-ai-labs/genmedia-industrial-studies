# fqc-hi-06 - Order delivered (Food & quick commerce)
#
# SOURCE. v2 text-to-speech bank, scenario fqc-hi-06: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/fqc-hi-06
# LANGUAGE. Hindi (Native script). DIFFICULTY. Easy. SETTING. Call centre.
# USE CASE. Delivery - OTP, partner, address.
# TARGET CUSTOMER. Food Delivery Apps, Quick-commerce Apps.
# WHAT THIS TESTS. A brand name inside a short, warm Devanagari sentence
# SPEECH SKILLS. Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: fqc-hi-06
modality: voice
task: text_to_speech
title: "Order delivered - Hindi"

input:
  script: |
    आपका Zomato order deliver हो गया है। खाने का आनंद लीजिए!
  language: hi-IN

params:
  voice: male_mid
  format: wav
  sample_rate: 24000

expected: |
  1) "Zomato" natural
  2) Warm register

checks:
  # Minimum lowered from 6.0 s on 2026-10-10 (round 1): a complete read of
  # this short line came in under 6 s. Now 0.2 s a word, as in the drama
  # scenarios (a read faster than 5 words a second is too short).
  duration_s: {min: 2.2, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, food-quick-commerce, delivery, easy, even-contest, v2-bank]
