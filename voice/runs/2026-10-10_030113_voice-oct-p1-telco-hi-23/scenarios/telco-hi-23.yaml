# telco-hi-23 - DTH recharge — channel names (Telecom)
#
# SOURCE. v2 text-to-speech bank, scenario telco-hi-23: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/telco-hi-23
# LANGUAGE. Hindi (Native script). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Broadband, DTH & roaming.
# TARGET CUSTOMER. Broadband Providers, DTH Providers.
# WHAT THIS TESTS. A raw amount and three TV channel brand names (one with a number) in one Devanagari passage
# SPEECH SKILLS. Numbers: amounts; Pronunciation: brands.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
