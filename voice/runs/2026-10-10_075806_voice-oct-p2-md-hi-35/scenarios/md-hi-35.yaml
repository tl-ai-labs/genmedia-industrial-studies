id: md-hi-35
modality: voice
task: styled_tts
title: "Wedding-day nerves, warm comedy - Hinglish"

input:
  script: |
    Mummy, relax karo na. Sab kuch theek ho jaayega — the caterer is two hours late, the band abhi tak nahi aaya, but arrey, yeh toh Indian wedding hai, kuch bhi normal nahi hota!
  language: hi-IN
  style: "warm, breathless comic energy"

params:
  voice: female_young
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) One continuous prosody; the emotion does not reset at the language switch

checks:
  duration_s: {min: 6.8, max: 33.9}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

