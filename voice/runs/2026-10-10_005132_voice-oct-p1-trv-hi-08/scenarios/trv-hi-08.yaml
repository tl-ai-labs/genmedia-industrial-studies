# trv-hi-08 - Baggage belt and bag tag (Travel & mobility)
#
# SOURCE. v2 text-to-speech bank, scenario trv-hi-08: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/trv-hi-08
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Flights - PNR, flight numbers, gates, delays, baggage.
# TARGET CUSTOMER. Airlines, Online Travel Agencies.
# WHAT THIS TESTS. A belt number and a letter/digit bag-tag reference
# SPEECH SKILLS. Numbers: codes.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
