# checklist below, judged by listeners and the judge.

id: trv-hi-08
modality: voice
task: text_to_speech
title: "Baggage belt and bag tag - Hinglish"

input:
  script: |
    Aapka baggage belt number six par aayega. Agar baggage na mile, toh baggage tag number A, I, four, four, zero, one, two ke saath counter par sampark karein.
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) "AI44012" Recoverable character-for-character, read in confirmable chunks, not run together
  2) "belt number six" recoverable

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, travel-mobility, flights, medium, even-contest, v2-bank]
