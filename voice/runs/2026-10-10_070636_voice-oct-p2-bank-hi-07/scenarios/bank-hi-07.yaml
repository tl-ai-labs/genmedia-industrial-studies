# bank-hi-07 - IFSC aur account number readback, Hindi-wrapped (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-hi-07: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-hi-07
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Payments & transfers - UPI ID, IFSC, NEFT/IMPS/RTGS, cheques.
# TARGET CUSTOMER. Retail Banks, Payment Apps.
# WHAT THIS TESTS. Bank brand name plus a letter/digit-mixed IFSC and long account number, code-switched mid-sentence
# SPEECH SKILLS. Numbers: codes; Pronunciation: names, brands, acronyms.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-hi-07
modality: voice
task: text_to_speech
title: "IFSC aur account number readback, Hindi-wrapped - Hinglish"

input:
  script: |
    Main aapko beneficiary details padh kar sunata hoon. Bank hai Kotak Mahindra Bank, Andheri branch. IFSC code hai K, K, B, K, zero, zero, zero, one, two, three, four. Account number hai five, zero, one, zero, zero, one, two, three, four, five, six, seven, eight, nine. Kya main is beneficiary ko add kar doon?
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) "KKBK0001234" recoverable character-for-character
  2) Confusable characters (0/O, 1/I) handled without ambiguity
  3) Read in confirmable chunks, not run together

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, banking-financial-services, payments-transfers, hard, even-contest, v2-bank]
