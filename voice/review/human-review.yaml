# Human review of the voice bank - schema and rules in README.md beside this file.
#
# TWO RECORDS, KEPT APART. `observations` are what a listener heard and never
# touch a number. `corrections` change an automated result the listener found
# wrong, and the page marks every one with what the instrument originally said.
#
# STATE, 2026-09-14: no listening session has been recorded yet. Both lists are
# empty. The scaffold below lists every scenario on the committed report
# (v3 re-run, passes voice-p1 and voice-p2, models gemini-3-1-flash-tts and
# elevenlabs-v3) so a reviewer can uncomment and fill in as they listen.
# Clips are in dashboard/audio/ as <scenario>--<model>--[<variant>--]<pass>.mp3.

reviewers:
  - id: sai
    name: Sai Nadh
    role: voice lane

corrections: []

observations: []

