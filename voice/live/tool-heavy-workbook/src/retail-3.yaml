# Ecommerce & Retail — tool-heavy scenarios ret-117 … ret-124 (RET-3 Returns, RET-4 Installation & warranty, RET-5 Kartly Fresh).
code: ret
scenarios:

- id: ret-117
  g: RET-3
  lang: en
  diff: Hard
  dir: in
  title: "Moving to Dubai on Saturday — five returns, three cancellations, one not returnable, membership, balance spent"
  basis: "Customers relocating abroad unwind everything open on their account before they fly, item by item."
  caller: "M 26-45 · engineer in Bengaluru relocating to Dubai on Saturday, efficient, a little stressed"
  goal: "Get money back for everything he can before he flies, cancel what hasn't shipped, stop his membership, and spend his Kartly balance on things for the move."
  role: "You handle returns and orders. Large items need a large-item pickup slot. Kartly balance can't be withdrawn to a bank."
  context: "He flies on Sat 10 Oct and keeps his Indian card and UPI."
  tasks:
    - task: "Find everything open"
      calls:
        - "list_orders() → KT-75010 (delivered Sat 26 Sep), KT-75033 (delivered Tue 29 Sep), KT-75060 (packing), KT-75071 (dispatched)"
        - "get_order(order_id=KT-75010) → bookshelf ₹6,499; office chair ₹8,999; air fryer ₹5,499; paid by card"
        - "get_order(order_id=KT-75033) → winter jacket ₹4,299; trekking shoes ₹5,999; electric kettle ₹1,499; paid by UPI"
        - "get_order(order_id=KT-75060) → curtains ₹2,199; bedside lamp ₹1,299; plant pots set ₹899; laptop stand ₹1,599; paid by card"
    - task: "Eligibility for the delivered items"
      calls:
        - "check_return_eligibility(order_id=KT-75010, item_id=bookshelf) → returnable until Tue 6 Oct"
        - "check_return_eligibility(order_id=KT-75010, item_id=office chair) → returnable until Tue 6 Oct"
        - "check_return_eligibility(order_id=KT-75010, item_id=air fryer) → not returnable: used appliance, 7-day window ended Sat 3 Oct"
        - "check_return_eligibility(order_id=KT-75033, item_id=winter jacket) → returnable until Fri 9 Oct"
        - "check_return_eligibility(order_id=KT-75033, item_id=trekking shoes) → returnable until Fri 9 Oct"
        - "check_return_eligibility(order_id=KT-75033, item_id=electric kettle) → returnable until Tue 6 Oct"
    - task: "Five returns"
      calls:
        - "create_return(order_id=KT-75010, item_id=bookshelf, reason=relocating abroad, pickup_date=Wed 7 Oct) → error: large-item pickups for 560034 are full on Wed 7 Oct"
        - "create_return(order_id=KT-75010, item_id=bookshelf, reason=relocating abroad, pickup_date=Thu 8 Oct) → return RT-75101; large-item pickup Thu 8 Oct, 9 am-12 pm; refund ₹6,499"
        - "create_return(order_id=KT-75010, item_id=office chair, reason=relocating abroad, pickup_date=Thu 8 Oct) → return RT-75102; large-item pickup Thu 8 Oct, 9 am-12 pm; refund ₹8,999"
        - "create_return(order_id=KT-75033, item_id=winter jacket, reason=relocating abroad, pickup_date=Wed 7 Oct) → return RT-75103; pickup Wed 7 Oct; refund ₹4,299"
        - "create_return(order_id=KT-75033, item_id=trekking shoes, reason=relocating abroad, pickup_date=Wed 7 Oct) → return RT-75104; pickup Wed 7 Oct; refund ₹5,999"
        - "create_return(order_id=KT-75033, item_id=electric kettle, reason=relocating abroad, pickup_date=Wed 7 Oct) → return RT-75105; pickup Wed 7 Oct; refund ₹1,499"
    - task: "All refunds to the original payment"
      calls:
        - "set_refund_route(return_id=RT-75101, route=original payment) → card, 5-7 days after pickup"
        - "set_refund_route(return_id=RT-75102, route=original payment) → card, 5-7 days after pickup"
        - "set_refund_route(return_id=RT-75103, route=original payment) → UPI, 2-3 days after pickup"
        - "set_refund_route(return_id=RT-75104, route=original payment) → UPI, 2-3 days after pickup"
        - "set_refund_route(return_id=RT-75105, route=original payment) → UPI, 2-3 days after pickup"
    - task: "Cancel three of the packing order, keep the laptop stand"
      calls:
        - "cancel_item(order_id=KT-75060, item_id=curtains, reason=relocating abroad, refund_to=original payment) → cancelled; ₹2,199 to card in 5-7 days"
        - "cancel_item(order_id=KT-75060, item_id=bedside lamp, reason=relocating abroad, refund_to=original payment) → cancelled; ₹1,299 to card in 5-7 days"
        - "cancel_item(order_id=KT-75060, item_id=plant pots set, reason=relocating abroad, refund_to=original payment) → cancelled; ₹899 to card in 5-7 days"
    - task: "The suitcases before he flies"
      calls:
        - "track_shipment(awb=EK 7507 1101) → Ekart, at Bengaluru hub, delivery Fri 9 Oct"
        - "reschedule_delivery(awb=EK 7507 1101, date=Wed 7 Oct, slot=9 am-12 pm) → rescheduled"
    - task: "Membership"
      calls:
        - "get_membership() → Kartly Plus yearly, renews Sun 3 Jan 2027, ₹799; benefits used"
        - "cancel_membership_autorenew() → auto-renew off; benefits until 3 Jan 2027"
        - "refund_membership(reason=relocating abroad) → not refundable: benefits already used this year"
    - task: "Spend the Kartly balance on the move"
      calls:
        - "get_wallet() → Kartly balance ₹1,840 (can't be withdrawn)"
        - "check_stock(sku=universal travel adapter, pincode=560034) → in stock"
        - "check_stock(sku=digital luggage scale, pincode=560034) → in stock"
        - "add_to_cart(sku=universal travel adapter, qty=2) → added, ₹1,198"
        - "add_to_cart(sku=digital luggage scale, qty=1) → added, ₹599"
        - "place_order(address=Flat 3C, 14th Main, Koramangala, Bengaluru 560034, payment_mode=Kartly balance) → order KT-75180, ₹1,797 from Kartly balance; delivery Wed 7 Oct"
    - task: "Summary"
      calls:
        - "send_sms(template=relocation_summary) → sent"
  forbid: ["cancel_order(order_id=KT-75060)", "create_return(order_id=KT-75010, item_id=air fryer)"]
  lines:
    - [open, "Hi, I'm moving to Dubai on Saturday and I need to sort out everything on my Kartly account before I fly. Can you pull up all my orders?"]
    - [after, "Right. Everything that's been delivered and can go back — I want to return it. Check each one."]
    - [after, "The air fryer can't go back? Fine, I'll give it to a friend."]
    - [after, "Pick the small things up on Wednesday. The bookshelf and chair also Wednesday — if that's full, Thursday is the last day I can do."]
    - [after, "All refunds to wherever I paid from, please. Not Kartly balance — I can't use it from Dubai."]
    - [after, "The order that's still packing — cancel the curtains, the lamp and the plant pots. Keep the laptop stand, I'm taking it with me."]
    - [after, "There's also a suitcase set coming. I need it before Saturday — can it come Wednesday morning?"]
    - [after, "I have Kartly Plus. Stop it renewing. Can I get money back for it?"]
    - [after, "Okay. How much Kartly balance do I have?"]
    - [after, "Then let me spend it. Two universal travel adapters and a luggage scale, Wednesday delivery if possible."]
    - [after, "How much is coming back to my card and UPI in total?"]
    - [after, "And when exactly is each pickup?"]
    - [after, "Send me everything by SMS. Thanks — that's a big weight off."]
  key:
    - "Checks all six delivered items; says the air fryer can't be returned"
    - "Books the jacket, shoes and kettle for Wed 7 Oct; when large-item Wednesday is full, says so and books the bookshelf and chair for Thu 8 Oct"
    - "Sets every refund to the original payment, not Kartly balance"
    - "Cancels curtains, lamp and plant pots one by one; keeps the laptop stand; does not cancel the whole order"
    - "Moves the suitcases to Wed 7 Oct; turns off Kartly Plus renewal and says it is not refundable"
    - "Spends the ₹1,840 balance on two adapters and a scale (KT-75180, ₹1,797)"
    - "States ₹31,692 back: ₹19,895 to card and ₹11,797 to UPI"
  checks: {digits: ["RT-75101", "KT-75180", "Thu 8 Oct"], say: [["31,692", "thirty-one thousand six hundred ninety-two", "thirty one thousand six hundred and ninety two"]], tool_order: [check_return_eligibility, create_return]}
  guard: "Each request names items by what they are; the Thursday fallback comes with the pickup request; L9–L11 ask for amounts whatever the agent already said."

- id: ret-118
  g: RET-3
  lang: hg
  diff: Medium
  dir: out
  title: "Returns team calls — two of five returns failed the check: wrong speaker in the box, tablet charger missing"
  basis: "Returns that fail the quality check are held; the customer is called to sort them out item by item."
  caller: "F 26-45 · interior designer in Chandigarh, surprised then embarrassed"
  goal: "Get the right items picked up for the two failed returns, send refunds where she wants for the three that passed, and re-buy two things in different sizes."
  role: "You are calling from Kartly's returns team because two of the customer's five returns failed the quality check: RT-76003 (a different speaker was in the box) and RT-76004 (charger missing). Open the call: greet, name Kartly, say why you are calling."
  context: "Refunds for returns that failed the check are released only after the correct item is collected."
  tasks:
    - task: "All five returns"
      calls:
        - "get_return(return_id=RT-76001) → smartwatch, check passed"
        - "get_return(return_id=RT-76002) → running shoes size 6, check passed"
        - "get_return(return_id=RT-76003) → bluetooth speaker, check failed: a different brand's used speaker was in the box"
        - "get_return(return_id=RT-76004) → tablet, check failed: charger missing"
        - "get_return(return_id=RT-76005) → kurta, check passed"
    - task: "Refunds for the three that passed"
      calls:
        - "check_refund(order_id=KT-75801, item_id=smartwatch) → ₹3,999 ready; route not chosen"
        - "check_refund(order_id=KT-75801, item_id=running shoes) → ₹3,299 ready; route not chosen"
        - "check_refund(order_id=KT-75822, item_id=kurta) → ₹1,299 ready; route not chosen"
        - "set_refund_route(return_id=RT-76001, route=Kartly balance) → ₹3,999 credited now"
        - "set_refund_route(return_id=RT-76002, route=Kartly balance) → ₹3,299 credited now"
        - "set_refund_route(return_id=RT-76005, route=original payment) → UPI, 2-3 days"
    - task: "The two that failed"
      calls:
        - "check_refund(order_id=KT-75810, item_id=bluetooth speaker) → ₹4,499 on hold until the correct item is collected"
        - "check_refund(order_id=KT-75810, item_id=tablet) → ₹18,999 on hold until the charger is collected"
        - "reschedule_pickup(return_id=RT-76003, date=Wed 7 Oct) → pickup Wed 7 Oct, 10 am-1 pm, for the correct speaker"
        - "raise_ticket(category=wrong item returned, summary=RT-76003: customer's brother's old speaker sent by mistake; send it back to her) → ticket WR 76031"
        - "reschedule_pickup(return_id=RT-76004, date=Wed 7 Oct) → pickup Wed 7 Oct, 10 am-1 pm, for the charger"
    - task: "Re-buy in different sizes"
      calls:
        - "check_stock(sku=running shoes size 7, pincode=160022) → in stock"
        - "add_to_cart(sku=running shoes size 7, qty=1) → added, ₹3,299"
        - "find_alternatives(sku=smartwatch) → smartwatch 41 mm ₹3,799, in stock; smartwatch 45 mm ₹4,299, in stock"
        - "check_stock(sku=smartwatch 41 mm, pincode=160022) → in stock"
        - "add_to_cart(sku=smartwatch 41 mm, qty=1) → added, ₹3,799"
        - "get_wallet() → Kartly balance ₹7,298"
        - "place_order(address=House 112, Sector 22, Chandigarh 160022, payment_mode=Kartly balance) → order KT-76140, ₹7,098 from Kartly balance; delivery Thu 8 Oct"
    - task: "Follow-up and summary"
      calls:
        - "schedule_callback(date=Wed 7 Oct, slot=5-6 pm, topic=RT-76003 and RT-76004 collected, refunds released) → booked"
        - "send_sms(template=returns_qc_summary) → sent"
  forbid: ["set_refund_route(return_id=RT-76003, route=Kartly balance)", "cancel_return(return_id=RT-76004)"]
  lines:
    - [open, "Hello?"]
    - [after, "Haan, Ritika bol rahi hoon. Kya hua returns mein?", "Yes, Ritika speaking. What happened with the returns?"]
    - [after, "Speaker alag tha? Oh no... woh mere bhai ka purana speaker hoga, dono same box mein the. Asli wala ghar pe hai.", "A different speaker? Oh no... that must be my brother's old speaker, both were in the same box. The real one is at home."]
    - [after, "Tablet ka charger bhi mil gaya, drawer mein tha. Sorry!", "I've found the tablet charger too, it was in a drawer. Sorry!"]
    - [after, "Dono ko Wednesday subah utha lo. Aur bhai ka speaker wapas bhej dena.", "Pick both up on Wednesday morning. And send my brother's speaker back."]
    - [after, "Baaki teen ka paisa — watch aur shoes ka Kartly balance mein, kurta ka UPI pe.", "The money for the other three — the watch and shoes into Kartly balance, the kurta to UPI."]
    - [after, "Shoes ka size chhota tha, saat number mein mil jayega?", "The shoes were too small — can I get them in size seven?"]
    - [after, "Aur watch bada tha. Chhota wala hai kya?", "And the watch was too big. Is there a smaller one?"]
    - [after, "Forty-one wala. Dono order kar do, balance se.", "The 41 mm one. Order both, from the balance."]
    - [after, "Speaker aur tablet ka paisa kab aayega?", "When will the money for the speaker and tablet come?"]
    - [after, "Wednesday shaam ko confirm kar dena ki dono utha liye.", "Confirm on Wednesday evening that both were collected."]
    - [after, "SMS bhej do. Thanks for calling, aur sorry for the mess!", "Send an SMS. Thanks for calling, and sorry for the mess!"]
  key:
    - "Opens naming Kartly and the two failed checks; explains each"
    - "Sets Kartly balance for the watch and shoes (₹7,298) and UPI for the kurta"
    - "Explains the speaker (₹4,499) and tablet (₹18,999) refunds are held until collection; books both pickups for Wed 7 Oct, 10 am-1 pm; raises WR 76031 to send the old speaker back"
    - "Orders size 7 shoes and the 41 mm watch from balance (KT-76140, ₹7,098)"
    - "Books Wednesday's call-back and sends the SMS"
  checks: {lang: hg, digits: ["KT-76140", "WR 76031", "7,298"], tool_order: [set_refund_route, place_order]}
  guard: "Every line reacts to the check results the agent must give; she names each item by what it is; L9 picks a size from the alternatives the agent must offer."

- id: ret-119
  g: RET-4
  lang: en
  diff: Medium
  dir: in
  title: "New flat — six installations booked, one slot full, warranties, a missed geyser visit, an old microwave claim"
  basis: "A new home brings several appliances, each with its own technician visit and warranty."
  caller: "F 26-45 · doctor in Kochi, short on time, wants everything in two days"
  goal: "Get every new appliance installed this week, extended warranty on the big ones, the missed geyser visit redone and an old microwave fixed."
  role: "You handle installation and warranty. Book one visit per appliance."
  context: "The chimney needs a ducting kit, sold separately."
  tasks:
    - task: "Read both orders"
      calls:
        - "get_order(order_id=KT-77010) → bedroom split AC; living-room split AC; washing machine; kitchen chimney; delivered Sat 3 Oct"
        - "get_order(order_id=KT-77024) → 55-inch TV with wall mount; water purifier; delivered Sun 4 Oct"
    - task: "One visit per appliance"
      calls:
        - "book_installation(order_id=KT-77010, item_id=bedroom split AC, date=Tue 6 Oct, slot=10 am-1 pm) → technician visit booked"
        - "book_installation(order_id=KT-77010, item_id=living-room split AC, date=Tue 6 Oct, slot=2-5 pm) → technician visit booked"
        - "book_installation(order_id=KT-77010, item_id=washing machine, date=Wed 7 Oct, slot=10 am-1 pm) → technician visit booked"
        - "book_installation(order_id=KT-77010, item_id=kitchen chimney, date=Wed 7 Oct, slot=2-5 pm) → error: slot full"
        - "book_installation(order_id=KT-77010, item_id=kitchen chimney, date=Thu 8 Oct, slot=10 am-1 pm) → technician visit booked"
        - "book_installation(order_id=KT-77024, item_id=55-inch TV, date=Wed 7 Oct, slot=2-5 pm) → wall-mount visit booked"
        - "book_installation(order_id=KT-77024, item_id=water purifier, date=Wed 7 Oct, slot=2-5 pm) → technician visit booked"
    - task: "Ducting kit for the chimney"
      calls:
        - "check_stock(sku=chimney ducting kit, pincode=682020) → in stock"
        - "add_to_cart(sku=chimney ducting kit, qty=1) → added, ₹1,450"
        - "place_order(address=Flat 9A, Marine Drive, Kochi 682020, payment_mode=UPI) → order KT-77140, ₹1,450; delivery Wed 7 Oct"
    - task: "Extended warranty on the big ones"
      calls:
        - "add_extended_warranty(order_id=KT-77010, item_id=bedroom split AC, years=3) → plan added, ₹2,999"
        - "add_extended_warranty(order_id=KT-77010, item_id=living-room split AC, years=3) → plan added, ₹2,999"
        - "add_extended_warranty(order_id=KT-77024, item_id=55-inch TV, years=2) → plan added, ₹3,499"
    - task: "The geyser that was never installed"
      calls:
        - "get_installation(order_id=KT-76890, item_id=geyser) → visit on Sat 3 Oct not done; technician did not turn up"
        - "book_installation(order_id=KT-76890, item_id=geyser, date=Tue 6 Oct, slot=10 am-1 pm) → technician visit booked"
    - task: "Old microwave"
      calls:
        - "register_warranty_claim(order_id=KT-74001, item_id=microwave, serial=MW23K0981, issue=not heating) → claim WC 77210; visit Fri 9 Oct"
    - task: "Follow-up and summary"
      calls:
        - "schedule_callback(date=Thu 8 Oct, slot=6-7 pm, topic=all installations done) → booked"
        - "send_sms(template=installations_summary) → sent"
  forbid: ["add_extended_warranty(order_id=KT-77010, item_id=washing machine)"]
  lines:
    - [open, "Hi, I've just moved into a new flat in Kochi and I have six appliances waiting to be installed. I want them all done this week."]
    - [after, "Two ACs on Tuesday — bedroom in the morning, living room in the afternoon."]
    - [after, "Wednesday — washing machine in the morning, chimney in the afternoon. If any slot's full, take the next morning."]
    - [after, "The TV wall mount and the water purifier — Wednesday afternoon too, both."]
    - [after, "Oh, the chimney needs a ducting kit? Order it — UPI. It should come before they install."]
    - [after, "Add three years' extended warranty on both ACs and two on the TV. Not the washing machine."]
    - [after, "Also — my geyser from last week. Nobody came on Saturday. Can you check?"]
    - [after, "Put the geyser on Tuesday morning too, with the bedroom AC."]
    - [after, "And my old microwave has stopped heating. Serial M W two three K zero nine eight one. It's still under warranty."]
    - [after, "What do the warranties cost altogether?"]
    - [after, "Can someone call me Thursday evening to check everything's done?"]
    - [after, "Send me the full schedule by SMS. Thanks!"]
  key:
    - "Books one visit per appliance: ACs Tue 6 Oct morning and afternoon; washing machine Wed 7 Oct morning"
    - "When the chimney's Wednesday afternoon slot is full, says so and books Thu 8 Oct morning"
    - "Books the TV wall mount and purifier for Wed 7 Oct afternoon; orders the ducting kit (KT-77140) to arrive Wed 7 Oct"
    - "Adds 3-year plans on both ACs and 2-year on the TV, not the washing machine; states ₹9,497"
    - "Finds the geyser visit missed and rebooks it Tue 6 Oct morning; registers the microwave claim WC 77210 (Fri 9 Oct)"
  checks: {digits: ["KT-77140", "WC 77210", "Thu 8 Oct"], say: [["9,497", "nine thousand four hundred ninety-seven", "nine thousand four hundred and ninety seven"]], tool_order: [get_installation, book_installation]}
  guard: "Each appliance's day and slot, and the full-slot fallback, come before booking; L5 reacts to the ducting note the agent must give; L10 asks for the total whatever was said."

- id: ret-120
  g: RET-4
  lang: hi
  diff: Hard
  dir: in
  title: "Power surge — five appliances: four warranty claims, one out of warranty, stabilisers bought and fitted"
  basis: "Voltage surges damage several appliances at once; each has its own purchase, warranty and claim."
  caller: "M 46-60 · government officer in Lucknow, upset after a storm, serials ready"
  goal: "Get every damaged appliance looked at, a paid repair or replacement for the one out of warranty, and protection so it does not happen again."
  role: "You handle warranty and service. Surge damage is covered under the standard warranty for the first year only."
  context: ""
  tasks:
    - task: "Find each appliance's order"
      calls:
        - "list_orders() → KT-70221 TV (Mar 2026), KT-68810 fridge (Dec 2025), KT-71500 AC (Apr 2026), KT-66104 washing machine (Jul 2025), KT-55210 microwave (Feb 2023)"
        - "get_order(order_id=KT-70221) → 43-inch TV, warranty until Mar 2027"
        - "get_order(order_id=KT-68810) → double-door fridge, warranty until Dec 2026"
        - "get_order(order_id=KT-71500) → 1.5-ton split AC, warranty until Apr 2027"
        - "get_order(order_id=KT-66104) → front-load washing machine, warranty until Jul 2027 (2 years)"
        - "get_order(order_id=KT-55210) → microwave, warranty ended Feb 2024"
    - task: "Four warranty claims"
      calls:
        - "register_warranty_claim(order_id=KT-70221, item_id=43-inch TV, serial=TV43A7712, issue=no power after surge) → claim WC 78101; visit Wed 7 Oct"
        - "register_warranty_claim(order_id=KT-68810, item_id=double-door fridge, serial=RF34K2208, issue=not cooling after surge) → claim WC 78102; visit Tue 6 Oct"
        - "register_warranty_claim(order_id=KT-71500, item_id=1.5-ton split AC, serial=AC15S9031, issue=PCB burnt after surge) → claim WC 78103; visit Wed 7 Oct"
        - "register_warranty_claim(order_id=KT-66104, item_id=front-load washing machine, serial=WM70F4410, issue=display dead after surge) → claim WC 78104; visit Thu 8 Oct; surge damage in year 2 is a paid repair, estimate after inspection"
    - task: "Microwave out of warranty — replace"
      calls:
        - "raise_ticket(category=paid repair quote, summary=KT-55210 microwave out of warranty, surge damage) → ticket PR 78110"
        - "find_alternatives(sku=microwave 25 L) → convection microwave 25 L ₹10,490; solo microwave 20 L ₹5,990"
    - task: "Protection"
      calls:
        - "check_stock(sku=AC voltage stabiliser, pincode=226010) → in stock"
        - "check_stock(sku=fridge voltage stabiliser, pincode=226010) → in stock"
        - "check_stock(sku=surge-protected extension board, pincode=226010) → in stock"
        - "add_to_cart(sku=AC voltage stabiliser, qty=1) → added, ₹3,299"
        - "add_to_cart(sku=fridge voltage stabiliser, qty=1) → added, ₹1,899"
        - "add_to_cart(sku=surge-protected extension board, qty=2) → added, ₹1,598"
        - "add_to_cart(sku=solo microwave 20 L, qty=1) → added, ₹5,990"
        - "place_order(address=B-17, Gomti Nagar, Lucknow 226010, payment_mode=card) → order KT-78150, ₹12,786; delivery Wed 7 Oct"
        - "book_installation(order_id=KT-78150, item_id=AC voltage stabiliser, date=Wed 7 Oct, slot=2-5 pm) → technician visit booked"
    - task: "Extended warranty on the two newest"
      calls:
        - "add_extended_warranty(order_id=KT-70221, item_id=43-inch TV, years=2) → plan added, ₹2,199; covers surge"
        - "add_extended_warranty(order_id=KT-71500, item_id=1.5-ton split AC, years=3) → plan added, ₹2,999; covers surge"
    - task: "Follow-up and summary"
      calls:
        - "schedule_callback(date=Thu 8 Oct, slot=5-6 pm, topic=claims WC 78101-78104 and repair quote PR 78110) → booked"
        - "send_sms(template=warranty_claims_summary) → sent"
  forbid: ["register_warranty_claim(order_id=KT-55210, item_id=microwave)"]
  lines:
