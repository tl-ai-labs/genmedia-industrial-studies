        - "book_appointment(doctor_id=D-7110, date=Wed 7 Oct, slot=10:30 am, patient=Subrahmanyam P) → AP 71141, ₹900; ECG at the visit"
        - "find_doctor(speciality=radiology, branch=Banjara Hills, date=Wed 7 Oct) → chest X-ray desk (D-7115)"
        - "get_slots(doctor_id=D-7115, date=Wed 7 Oct) → 11:00 am, 11:30 am"
        - "book_appointment(doctor_id=D-7115, date=Wed 7 Oct, slot=11:30 am, patient=Subrahmanyam P) → AP 71142, ₹600"
        - "find_doctor(speciality=internal medicine, branch=Banjara Hills, date=Wed 7 Oct) → Dr Fatima (D-7120)"
        - "get_slots(doctor_id=D-7120, date=Wed 7 Oct) → 12:00 pm"
        - "book_appointment(doctor_id=D-7120, date=Wed 7 Oct, slot=12:00 pm, patient=Subrahmanyam P) → AP 71143, ₹800; diabetes clearance"
        - "find_doctor(speciality=anaesthesia, branch=Banjara Hills, date=Thu 8 Oct) → Dr Kiran (D-7125)"
        - "get_slots(doctor_id=D-7125, date=Thu 8 Oct) → 11:00 am, 3:00 pm"
        - "book_appointment(doctor_id=D-7125, date=Thu 8 Oct, slot=11:00 am, patient=Subrahmanyam P) → AP 71144, ₹700"
