        - "request_cashless(admission_id=AD 71150, insurer=Kavach Insurance, policy_no=KV-H-660218) → pre-authorisation sent; ₹1,20,000 approved"
        - "get_admission(admission_id=AD 71150) → twin sharing, Sun 11 Oct; cashless ₹1,20,000 approved; family share ₹20,000"
