    - [after, "Hospital కి వెళ్ళడానికి wheelchair cab కావాలి. Address పన్నెండు డాష్ నాలుగు, Labbipet.", "We need a wheelchair cab to go to the hospital. The address is 12-4, Labbipet."]
    - [after, "మందులు అయిపోతున్నాయి. Paracetamol, pantoprazole పంపండి. Injection ఇంకా ఉంది.", "The medicines are running out. Send the paracetamol and pantoprazole. We still have the injection."]
    - [after, "ఈరోజే సాయంత్రం పంపగలరా?", "Can you send them this evening itself?"]
    - [after, "ఇంకో విషయం — కుట్ల దగ్గర కొంచెం ఎర్రగా ఉంది. ఏమైనా cream రాయాలా?", "One more thing — there's a little redness near the stitches. Should we apply some cream?"]
    - [after, "సరే, nurse తో మాట్లాడతాను. ముందు అన్ని dates ఒకసారి చెప్పండి.", "Okay, I'll talk to the nurse. First tell me all the dates once."]
    - [after, "మొత్తం ఎంత అవుతుంది?", "How much will it all cost?"]
    - [after, "సరే, nurse ని connect చేయండి.", "Okay, connect the nurse."]
    - [after, "Thanks అండి.", "Thank you."]
  key:
