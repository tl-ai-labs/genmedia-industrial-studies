    - [after, "The surgeon's list says blood tests, cardiology with an ECG, chest X-ray, a diabetes check and anaesthesia. Tests at home tomorrow morning — he can fast."]
    - [after, "Add HbA1c and creatinine to the tests too. The doctors on Wednesday, one after another, starting at ten. If a slot's gone, the next one with the same doctor. Anaesthesia on Thursday morning."]
    - [after, "He'll be admitted on the eleventh. Twin sharing is fine. He has Kavach Insurance, policy K V H six six zero two one eight. I'll hand you to him now — he has a question, in Telugu."]
