        - "reschedule_collection(collection_id=LB 81040, date=Wed 14 Oct, slot=7-8 am) → moved"
        - "get_lab_order(order_id=LB 81041) → Rina: TSH, free T4; collection Wed 7 Oct (still right for Thu 8 Oct)"
        - "send_sms(template=appointments_summary) → sent"
        - "schedule_callback(date=Thu 15 Oct, slot=5-6 pm, topic=confirm Fri 16 Oct appointments) → booked"
