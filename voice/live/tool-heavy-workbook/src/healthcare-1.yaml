    - [after b, "ఈ వారం ఏ రోజు ఎక్కడికి వెళ్ళాలో ఒకసారి చెప్పండి.", "Tell me once which day I go where this week."]
    - [after b, "సరే, ఆ మాత్ర గురించి nurse తో మాట్లాడిస్తారా?", "Okay, will you let me talk to the nurse about that tablet?"]
    - [after b, "చాలా thanks అమ్మా.", "Thank you so much."]
    - [after b, "సరే.", "Okay."]
