    - "Books Wednesday's clearances in a row; when cardiology 10:00 is taken, says so and books 10:30; X-ray 11:30, internal medicine 12:00; anaesthesia Thu 11:00"
    - "Books admission AD 71150 for Sun 11 Oct (twin sharing, estimate ₹1,40,000) and requests cashless: ₹1,20,000 approved"
    - "Replies in Telugu from L5; does not say whether to stop clopidogrel; connects the nurse"
    - "Explains ₹20,000 is the family's share and sends a ₹20,000 deposit link to the caller's (the daughter's) number"
    - "Reads the week's schedule"
  checks: {lang_from: {L5: te}, digits: ["AD 71150", "AP 71141", "1,20,000"], tool_order: [book_home_collection, book_admission]}
  guard: "The daughter sets every booking rule and the policy number before the handover; the father's first question must not be answered with advice."

