      calls:
        - "cancel_appointment(appointment_id=AP 81003) → cancelled, ₹800 refunded"
        - "book_appointment(doctor_id=D-8101, date=Fri 16 Oct, slot=7:00 pm, patient=Mili Das, mode=video) → AP 81030, ₹800"
        - "send_teleconsult_link(appointment_id=AP 81030) → link sent by SMS"
