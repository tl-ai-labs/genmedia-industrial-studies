    - "Does not advise on the wound; connects the nurse; reads every date"
    - "States ₹5,970: ₹4,800 physio, ₹1,000 surgeon, ₹170 medicines (test and cab billed separately)"
  checks: {lang: te, digits: ["AP 52310", "HC 52320", "PH 52350"], say: [["5,970", "ఐదు వేల తొమ్మిది వందల డెబ్బై"]], tool_order: [find_doctor, book_appointment]}
  guard: "The physio rule (days, time) comes in L2; L8 asks a wound question the agent must hand to the nurse; L11 asks for the transfer after the read-back."

