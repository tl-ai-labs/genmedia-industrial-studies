- id: bank-132
  g: BANK-5
  lang: hg
  diff: Hard
  dir: in
  title: "Father retires, group cover ends — port three family members to their own policies, cover, riders, autopay, hospitals"
  basis: "When an employer's group cover ends at retirement, each family member is ported to an individual policy to keep waiting-period credit."
  caller: "M 26-45 · son in Pune who will pay the premiums, thorough; speaker b: M 60+ · his father Dinesh, the retiring employee"
  goal: "Port his father, mother and sister to individual policies before the deadline, raise each cover, add the right riders, pay from his account and check the hospitals they use."
  role: "You handle policies for Kavach Insurance. Only members of the group policy can be ported, and the employee must agree. Verify the son before setting his account for payment."
  context: "Group policy KV-G-880001 ends on 31 Oct with Dinesh Joshi's retirement. Porting must be done by 15 Oct; waiting periods carry over."
  tasks:
    - task: "Verify the father and read the group policy"
      calls:
        - "verify_caller(name=Dinesh Joshi, dob=14 Oct 1964) → verified; employee on group policy KV-G-880001"
        - "get_policy(policy_no=KV-G-880001) → group cover ₹5,00,000 for Dinesh, Vandana and Pooja Joshi; ends 31 Oct; port by 15 Oct; diabetes declared for Dinesh in 2019"
    - task: "Port each member"
      calls:
        - "port_policy(policy_no=KV-G-880001, member=Dinesh Joshi) → individual policy KV-H-880210 from 1 Nov; waiting periods carried over"
        - "port_policy(policy_no=KV-G-880001, member=Vandana Joshi) → individual policy KV-H-880228 from 1 Nov; waiting periods carried over"
        - "port_policy(policy_no=KV-G-880001, member=Pooja Joshi) → individual policy KV-H-880236 from 1 Nov; waiting periods carried over"
        - "get_policy(policy_no=KV-H-880210) → Dinesh Joshi, ₹5,00,000, premium ₹38,900"
        - "get_policy(policy_no=KV-H-880228) → Vandana Joshi, ₹5,00,000, premium ₹24,600"
        - "get_policy(policy_no=KV-H-880236) → Pooja Joshi, ₹5,00,000, premium ₹7,800"
    - task: "Raise each cover to ₹10 lakh"
      calls:
        - "change_sum_insured(policy_no=KV-H-880210, sum_insured=₹10,00,000) → from start; premium +₹14,200"
        - "change_sum_insured(policy_no=KV-H-880228, sum_insured=₹10,00,000) → from start; premium +₹9,100"
        - "change_sum_insured(policy_no=KV-H-880236, sum_insured=₹10,00,000) → from start; premium +₹2,400"
    - task: "Riders for each"
      calls:
        - "add_rider(policy_no=KV-H-880210, rider=chronic care for diabetes) → added; premium +₹6,500"
        - "add_rider(policy_no=KV-H-880210, rider=room rent waiver) → added; premium +₹3,200"
        - "add_rider(policy_no=KV-H-880228, rider=critical illness) → added; premium +₹4,300"
        - "add_rider(policy_no=KV-H-880228, rider=room rent waiver) → added; premium +₹2,700"
        - "add_rider(policy_no=KV-H-880236, rider=maternity) → added; premium +₹3,900"
    - task: "The son pays"
      calls:
        - "verify_caller(name=Ankit Joshi, dob=2 Jun 1993) → verified"
        - "get_account(account_last4=4802) → balance ₹2,64,000"
        - "set_premium_autopay(policy_no=KV-H-880210, account_last4=4802) → first debit 25 Oct, then yearly"
        - "set_premium_autopay(policy_no=KV-H-880228, account_last4=4802) → first debit 25 Oct, then yearly"
        - "set_premium_autopay(policy_no=KV-H-880236, account_last4=4802) → first debit 25 Oct, then yearly"
    - task: "Nominees"
      calls:
        - "update_nominee(policy_no=KV-H-880210, nominee=Vandana Joshi, relation=wife, share=100%) → nominee updated"
        - "update_nominee(policy_no=KV-H-880228, nominee=Dinesh Joshi, relation=husband, share=100%) → nominee updated"
        - "update_nominee(policy_no=KV-H-880236, nominee=Vandana Joshi, relation=mother, share=100%) → nominee updated"
    - task: "Their hospitals"
      calls:
        - "check_network_hospital(policy_no=KV-H-880210, hospital=Shreeyash Hospital, Kothrud) → cashless yes"
        - "check_network_hospital(policy_no=KV-H-880228, hospital=Pune Heart Institute, Aundh) → cashless yes"
        - "check_network_hospital(policy_no=KV-H-880236, hospital=Greenfield Hospital, Whitefield, Bengaluru) → not in network; reimbursement only"
    - task: "Continuity letter, follow-up, summary"
      calls:
        - "raise_ticket(category=porting, summary=continuity letter from employer for KV-G-880001; three members ported) → ticket PT 88050"
        - "schedule_callback(date=Mon 26 Oct, slot=6-7 pm, topic=confirm KV-H-880210, 880228, 880236 issued) → booked"
        - "send_sms(template=porting_summary) → sent"
  forbid: ["port_policy(policy_no=KV-G-880001, member=Ankit Joshi)"]
  lines:
    - [open, "Hello, main Ankit Joshi, Pune se. Papa is mahine retire ho rahe hain, unki company ki health policy khatam ho jayegi. Mummy, papa aur behen sab usi mein hain.", "Hello, I'm Ankit Joshi from Pune. Papa retires this month, and his company's health policy will end. Mummy, Papa and my sister are all on it."]
    - [after, "Papa yahin hain, unse baat kar lijiye.", "Papa is right here, please speak to him."]
    - [after b, "Haan ji, Dinesh Joshi. Janam tithi chaudah October unnees sau chaunsath.", "Yes, Dinesh Joshi. Date of birth fourteenth October 1964."]
    - [after b, "Teenon ki policy alag-alag kar dijiye. Purani bimariyon ka waiting period phir se shuru nahi hona chahiye.", "Make separate policies for all three. The waiting period for old illnesses shouldn't start again."]
    - [after, "Main bhi papa ki company policy mein aa sakta hoon kya? Saath mein port ho jaaye?", "Can I also come under Papa's company policy? Get ported along with them?"]
    - [after, "Theek hai. Teenon ka cover das lakh kar dijiye.", "Okay. Make the cover ten lakh for all three."]
    - [after, "Papa ko sugar hai — unke liye chronic care wala rider, aur room rent ki limit hatane wala bhi. Mummy ke liye critical illness aur room rent wala. Pooja ki shaadi agle saal hai, uske liye maternity.", "Papa has diabetes — for him the chronic-care rider, and the one that removes the room-rent limit. For Mummy, critical illness and the room-rent one. Pooja's getting married next year, maternity for her."]
    - [after, "Premium main bharunga, mere account se. Ankit Joshi, do June unnees sau tirannave. Account chaar aath shunya do.", "I'll pay the premiums, from my account. Ankit Joshi, second June 1993. Account 4802."]
    - [after, "Teenon ka saal ka kul premium kitna hua?", "What is the total yearly premium for the three?"]
    - [after, "Nominee — papa ki policy mein mummy, mummy ki mein papa, Pooja ki mein mummy.", "Nominees — Mummy on Papa's policy, Papa on Mummy's, Mummy on Pooja's."]
    - [after, "Papa Kothrud ke Shreeyash mein dikhate hain, Mummy Aundh ke Pune Heart Institute mein. Pooja Bengaluru mein hai, Whitefield ka Greenfield Hospital.", "Papa sees doctors at Shreeyash in Kothrud, Mummy at Pune Heart Institute in Aundh. Pooja is in Bengaluru — Greenfield Hospital in Whitefield."]
    - [after, "Papa ki company se kuch letter chahiye hoga kya?", "Will we need some letter from Papa's company?"]
    - [after, "Policies aa jaayein toh confirm karne ke liye chhabbees tareekh ko shaam ko call kar dena.", "Call on the twenty-sixth in the evening to confirm the policies have come."]
    - [after, "Sab SMS kar do. Bahut shukriya.", "SMS everything. Thanks a lot."]
  key:
    - "Verifies Dinesh, the employee, before porting; ports Dinesh, Vandana and Pooja with waiting periods carried over"
    - "Explains Ankit was never on the group policy and cannot be ported; does not port him"
    - "Raises each cover to ₹10,00,000 and adds chronic care and room rent waiver for Dinesh, critical illness and room rent waiver for Vandana, maternity for Pooja"
    - "Verifies Ankit before setting 4802 for all three autopays (first debit 25 Oct)"
    - "States the yearly total ₹1,17,600 (₹62,800, ₹40,700 and ₹14,100)"
    - "Sets the three nominees; Shreeyash and Pune Heart Institute are cashless, Greenfield is not"
    - "Raises PT 88050 for the employer's continuity letter and books the 26 October call-back"
  checks: {lang: hg, digits: ["KV-H-880210", "KV-H-880228", "KV-H-880236", "PT 88050"], say: [["1,17,600", "ek lakh satrah hazaar chhe sau", "one lakh seventeen thousand six hundred"]], tool_order: [port_policy, change_sum_insured]}
  guard: "The father consents before any porting; L5 must be refused; each rider and nominee is named with its person; L9 asks for the total whatever was said."
