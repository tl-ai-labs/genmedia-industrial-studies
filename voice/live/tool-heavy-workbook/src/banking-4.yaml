# Banking & insurance — tool-heavy scenarios bank-125 … bank-132 (BANK-5 Insurance, Kavach Insurance).
code: bank
scenarios:

- id: bank-125
  g: BANK-5
  lang: en
  diff: Hard
  dir: in
  title: "Father's surgery at a non-network hospital — three reimbursement claims, nine documents, mother's pending claim, renewal"
  basis: "Reimbursement claims split into hospitalisation, pre-hospitalisation and ambulance, each with its own documents."
  caller: "F 26-45 · daughter and policyholder in Bengaluru, tired after a week at the hospital"
  goal: "File every claim for her father's surgery with the right documents, finish her mother's pending claim, renew the policy and set the payout account."
  role: "You handle health claims for Kavach Insurance. Post-hospitalisation expenses are claimed after the treatment, with the bills, within 60 days of discharge."
  context: "The parents' policy covers 30 days before and 60 days after a hospital stay, and ambulance up to ₹5,000."
  tasks:
    - task: "Verify and read the policy"
      calls:
        - "verify_caller(name=Meera Krishnan, dob=4 Apr 1988) → verified; proposer on KV-H-610292"
        - "get_policy(policy_no=KV-H-610292) → Kavach parents' health: Ramanathan K (68), Saraswathi R (63); sum insured ₹5,00,000; ambulance up to ₹5,000; renews 20 Oct, premium ₹42,800; no nominee"
        - "check_network_hospital(policy_no=KV-H-610292, hospital=Lakeside Hospital, Jayanagar) → not in network; reimbursement only"
    - task: "Hospitalisation claim and its documents"
      calls:
        - "register_claim(policy_no=KV-H-610292, member=Ramanathan K, kind=hospitalisation, amount=₹2,84,000) → claim KC 77301; documents: discharge summary, final bill, payment receipts, pharmacy bills, lab reports, cancelled cheque"
        - "send_document_link(claim_id=KC 77301, document=discharge summary) → upload link sent by SMS"
        - "send_document_link(claim_id=KC 77301, document=final bill) → upload link sent by SMS"
        - "send_document_link(claim_id=KC 77301, document=payment receipts) → upload link sent by SMS"
        - "send_document_link(claim_id=KC 77301, document=pharmacy bills) → upload link sent by SMS"
        - "send_document_link(claim_id=KC 77301, document=lab reports) → upload link sent by SMS"
        - "send_document_link(claim_id=KC 77301, document=cancelled cheque) → upload link sent by SMS"
    - task: "Pre-hospitalisation tests"
      calls:
        - "register_claim(policy_no=KV-H-610292, member=Ramanathan K, kind=pre-hospitalisation, amount=₹18,500) → claim KC 77302; documents: prescriptions, test bills"
        - "send_document_link(claim_id=KC 77302, document=prescriptions) → upload link sent by SMS"
        - "send_document_link(claim_id=KC 77302, document=test bills) → upload link sent by SMS"
    - task: "Ambulance"
      calls:
        - "register_claim(policy_no=KV-H-610292, member=Ramanathan K, kind=ambulance, amount=₹3,500) → claim KC 77303; documents: ambulance receipt"
        - "send_document_link(claim_id=KC 77303, document=ambulance receipt) → upload link sent by SMS"
    - task: "Payout account on all three"
      calls:
        - "set_claim_payout(claim_id=KC 77301, account_last4=5521) → payout account set"
        - "set_claim_payout(claim_id=KC 77302, account_last4=5521) → payout account set"
        - "set_claim_payout(claim_id=KC 77303, account_last4=5521) → payout account set"
    - task: "Her mother's pending claim"
      calls:
        - "get_claim(claim_id=KC 77120) → Saraswathi R, cataract, ₹38,000; pending: pharmacy bills"
        - "send_document_link(claim_id=KC 77120, document=pharmacy bills) → error: link service timed out"
        - "send_document_link(claim_id=KC 77120, document=pharmacy bills) → upload link sent by SMS"
    - task: "Renewal, autopay, nominee"
      calls:
        - "renew_policy(policy_no=KV-H-610292, pay_from_account_last4=5521) → renewed until 19 Oct 2027; ₹42,800 debited"
        - "set_premium_autopay(policy_no=KV-H-610292, account_last4=5521) → autopay set from the next renewal"
        - "update_nominee(policy_no=KV-H-610292, nominee=Meera Krishnan, relation=daughter, share=100%) → nominee updated"
    - task: "Follow-up and summary"
      calls:
        - "schedule_callback(date=Thu 15 Oct, slot=5-6 pm, topic=status of KC 77301, 77302, 77303) → booked"
        - "send_sms(template=claims_summary) → sent"
  forbid: ["register_claim(policy_no=KV-H-610292, member=Ramanathan K, kind=post-hospitalisation)"]
  lines:
    - [open, "Hi, my father had gallbladder surgery last week and I need to file the insurance claim. The policy is in my name, for my parents."]
    - [after, "Meera Krishnan, fourth April nineteen eighty-eight."]
    - [after, "He was at Lakeside Hospital in Jayanagar. They said it isn't cashless there, so we paid. The bill was two lakh eighty-four thousand."]
    - [after, "What documents do you need? Send me a link for each one, it's easier for me to upload from my phone."]
    - [after, "There were also tests before the surgery, about eighteen and a half thousand. And the ambulance was three and a half thousand."]
    - [after, "Claim those too, with their links."]
    - [after, "He'll have follow-up visits and medicines for the next two months. Can you register that claim now as well, to save time?"]
    - [after, "Okay, I'll do it later then. Where will the money be paid? Use my savings account ending five five two one, for all of them."]
    - [after, "My mother had a cataract claim in August that's stuck. Can you check it?"]
    - [after, "Send me that link too."]
    - [after, "The policy renews this month, right? Renew it now from the same account, and set autopay for next year."]
    - [after, "There's no nominee on it? Put me."]
    - [after, "Can someone call me in ten days with an update?"]
    - [after, "Thanks. Send me the claim numbers by SMS."]
  key:
    - "Checks Lakeside is not a network hospital and files a reimbursement claim of ₹2,84,000 (KC 77301) with six document links"
    - "Files pre-hospitalisation ₹18,500 (KC 77302) and ambulance ₹3,500 (KC 77303) with their links"
    - "Explains post-hospitalisation is claimed after the treatment, with bills, within 60 days; does not register it now"
    - "Sets 5521 as payout on all three claims"
    - "Finds KC 77120 pending pharmacy bills; when the link fails, says so and resends"
    - "Renews for ₹42,800, sets autopay and Meera as nominee; books the call-back for 15 October"
  checks: {digits: ["KC 77301", "KC 77302", "KC 77303", "42,800"], tool_order: [check_network_hospital, register_claim]}
  guard: "Each claim's amount is given with it; L7 must be refused whatever the agent offered; L8 accepts the refusal and gives the payout account for all claims."

- id: bank-126
  g: BANK-5
  lang: hg
  diff: Medium
  dir: in
  title: "Renewal month — newborn added, father refused, cover raised, OPD, car and scooter renewed with riders"
  basis: "Families renew health and motor policies together and change members and riders at renewal."
  caller: "M 26-45 · new father in Noida, cheerful, sleep-deprived"
  goal: "Add his baby to the family floater, raise the cover and add OPD, check the hospital, renew all three policies with autopay and nominees."
  role: "You handle policies for Kavach Insurance. The family floater accepts members up to age 65 at entry; a separate senior policy is available for older parents."
  context: ""
  noise: {bed: kids_home, snr_db: 14}
  tasks:
    - task: "Verify and read the floater"
      calls:
        - "verify_caller(name=Amit Saxena, dob=21 Jan 1989) → verified"
        - "get_policy(policy_no=KV-H-720115) → family floater for Amit and Pallavi Saxena; ₹5,00,000; entry age up to 65; renews 10 Oct; premium ₹21,400"
    - task: "Baby, cover, OPD"
      calls:
        - "add_policy_member(policy_no=KV-H-720115, member=Kiaan Saxena, relation=son, dob=12 Aug 2026) → added; premium +₹3,900"
        - "change_sum_insured(policy_no=KV-H-720115, sum_insured=₹10,00,000) → from renewal; premium +₹6,300"
        - "add_rider(policy_no=KV-H-720115, rider=OPD cover) → added; premium +₹2,800"
        - "check_network_hospital(policy_no=KV-H-720115, hospital=Kailash Hospital, Noida) → cashless yes"
    - task: "Renew the floater"
      calls:
        - "renew_policy(policy_no=KV-H-720115, pay_from_account_last4=6611) → renewed until 9 Oct 2027; ₹34,400 debited"
        - "set_premium_autopay(policy_no=KV-H-720115, account_last4=6611) → autopay set from the next renewal"
        - "update_nominee(policy_no=KV-H-720115, nominee=Pallavi Saxena, relation=wife, share=100%) → nominee updated"
    - task: "The car"
      calls:
        - "get_policy(policy_no=KV-M-720231) → Hyundai Creta UP16 DK 2210; renews 18 Oct; premium ₹14,200; NCB 35%; no zero-depreciation"
        - "add_rider(policy_no=KV-M-720231, rider=zero depreciation) → added; premium +₹3,100"
        - "add_rider(policy_no=KV-M-720231, rider=roadside assistance) → added; premium +₹450"
        - "renew_policy(policy_no=KV-M-720231, pay_from_account_last4=6611) → renewed until 17 Oct 2027; ₹17,750 debited"
        - "update_nominee(policy_no=KV-M-720231, nominee=Pallavi Saxena, relation=wife, share=100%) → owner-driver cover nominee updated"
    - task: "The scooter"
      calls:
        - "get_policy(policy_no=KV-M-720249) → Honda Activa UP16 EK 9034; renews 25 Oct; premium ₹1,850"
        - "renew_policy(policy_no=KV-M-720249, pay_from_account_last4=6611) → renewed until 24 Oct 2027; ₹1,850 debited"
    - task: "Autopay on both vehicles, tax certificate, summary"
      calls:
        - "set_premium_autopay(policy_no=KV-M-720231, account_last4=6611) → autopay set from the next renewal"
        - "set_premium_autopay(policy_no=KV-M-720249, account_last4=6611) → autopay set from the next renewal"
        - "request_statement(policy_no=KV-H-720115, kind=80D premium certificate) → emailed"
        - "send_sms(template=renewals_summary) → sent"
  forbid: ["add_policy_member(policy_no=KV-H-720115, member=Ravi Saxena)"]
  lines:
    - [open, "Hello! Main Amit Saxena. Hamari family health policy renew honi hai, aur ghar mein ek naya member aaya hai.", "Hello! I'm Amit Saxena. Our family health policy is due for renewal, and there's a new member at home."]
    - [after, "Date of birth ikkees January unnees sau navaasi.", "Date of birth twenty-first January 1989."]
    - [after, "Beta hua hai, Kiaan, baarah August ko. Usko policy mein daal do.", "We've had a son, Kiaan, on the twelfth of August. Add him to the policy."]
    - [after, "Aur mere papa bhi, Ravi Saxena, sadsath saal ke. Unko bhi isi mein daal do.", "And my father too, Ravi Saxena, sixty-seven. Add him to this one as well."]
    - [after, "Achha, unke liye baad mein alag dekhenge. Cover paanch se das lakh kar do. Aur OPD bhi chahiye, bachche ke doctor visits bahut hain.", "Okay, we'll look at a separate one for him later. Raise the cover from five to ten lakh. And I want OPD too — lots of doctor visits for the baby."]
    - [after, "Kailash Hospital Noida mein cashless hai na? Wahin dikhate hain.", "Kailash Hospital in Noida is cashless, right? That's where we go."]
    - [after, "Theek hai, renew kar do, mere account chhe chhe ek ek se. Agle saal se autopay. Nominee meri wife Pallavi.", "Okay, renew it from my account 6611. Autopay from next year. Nominee my wife Pallavi."]
    - [after, "Car aur scooter ki policy bhi isi mahine hai. Car mein zero dep aur roadside assistance add kar do.", "The car and scooter policies are this month too. Add zero-dep and roadside assistance on the car."]
    - [after, "Dono renew kar do, usi account se. Car mein bhi nominee Pallavi.", "Renew both from the same account. Pallavi as nominee on the car too."]
    - [after, "Dono gaadiyon pe bhi autopay laga do.", "Set autopay on both vehicles as well."]
    - [after, "Aaj kul kitna kata?", "How much was debited in total today?"]
    - [after, "Tax ke liye health wala certificate email kar do.", "Email the health certificate for tax."]
    - [after, "Bas, SMS bhej do. Thank you!", "That's it, send an SMS. Thank you!"]
  key:
    - "Adds Kiaan (+₹3,900); explains Ravi, at 67, is above the floater's entry age and suggests a senior policy; does not add him"
    - "Raises cover to ₹10,00,000 and adds OPD before renewing; confirms Kailash Hospital is cashless"
    - "Renews the floater for ₹34,400 from 6611 with autopay and Pallavi as nominee"
    - "Adds zero-dep and roadside assistance and renews the car for ₹17,750; renews the scooter for ₹1,850; autopay on both"
    - "States ₹54,000 debited today; emails the 80D certificate"
  checks: {lang: hg, digits: ["34,400", "17,750"], say: [["54,000", "chauvan hazaar", "fifty-four thousand"]], tool_order: [add_policy_member, renew_policy]}
  guard: "Changes to each policy are asked for before its renewal; L5 accepts the refusal whatever words it came in; L11 asks for the total whatever was said."

- id: bank-127
  g: BANK-5
  lang: hi
  diff: Medium
  dir: in
  title: "Car hit from behind, wife hurt — motor claim, garage, towing, survey, documents, and cashless admission for her"
  basis: "A road accident brings a motor claim and a health claim in the same call, each with its own steps."
  caller: "M 46-60 · businessman in Jaipur, at the roadside, shaken but organised"
  goal: "Start the car claim with towing to his dealer's garage and a survey, and get his wife admitted cashless."
  role: "You handle motor and health claims for Kavach Insurance. Ask whether anyone is hurt before anything else."
  context: "Towing is covered up to ₹2,500."
  noise: {bed: street_traffic, snr_db: 10}
  tasks:
    - task: "Verify and read the car policy"
      calls:
        - "verify_caller(name=Mahesh Choudhary, dob=6 Jun 1971) → verified"
        - "get_policy(policy_no=KV-M-830412) → Maruti Ciaz RJ14 CD 4521; comprehensive with zero-depreciation; towing up to ₹2,500; NCB 25%"
    - task: "Car claim, garage, towing, survey"
      calls:
        - "register_motor_claim(policy_no=KV-M-830412, vehicle=RJ14 CD 4521, incident=hit from behind by a tempo, place=Tonk Road, Jaipur) → claim MC 41290"
        - "find_garage(pincode=302018) → Rathi Motors (Maruti dealer), Sharma Auto Works"
        - "assign_garage(claim_id=MC 41290, garage=Rathi Motors) → cashless repair confirmed"
        - "arrange_towing(claim_id=MC 41290, pickup=Tonk Road near Durgapura flyover, drop=Rathi Motors) → tow truck in about 40 minutes"
        - "book_survey(claim_id=MC 41290, date=Tue 6 Oct, slot=10 am-12 pm, address=Rathi Motors) → surveyor Anil Mathur"
    - task: "Car documents"
      calls:
        - "send_document_link(claim_id=MC 41290, document=RC) → upload link sent by SMS"
        - "send_document_link(claim_id=MC 41290, document=driving licence) → upload link sent by SMS"
        - "send_document_link(claim_id=MC 41290, document=FIR copy) → upload link sent by SMS"
        - "send_document_link(claim_id=MC 41290, document=accident photos) → upload link sent by SMS"
    - task: "His wife's admission"
      calls:
        - "get_policy(policy_no=KV-H-830420) → family floater for Mahesh, Sunita, Aditi, Rohan Choudhary; ₹5,00,000"
        - "check_network_hospital(policy_no=KV-H-830420, hospital=Shubh Hospital, Malviya Nagar) → cashless yes"
        - "request_cashless(policy_no=KV-H-830420, member=Sunita Choudhary, hospital=Shubh Hospital, Malviya Nagar, estimate=₹45,000) → pre-authorisation PA 41301; ₹40,000 approved now"
        - "send_document_link(claim_id=PA 41301, document=doctor's admission note) → upload link sent by SMS"
        - "send_document_link(claim_id=PA 41301, document=ID proof) → upload link sent by SMS"
    - task: "The other driver, status, follow-up"
      calls:
        - "raise_ticket(category=third-party recovery, summary=MC 41290; tempo RJ14 GB 8812 hit from behind) → ticket TP 41310"
        - "get_claim(claim_id=MC 41290) → registered; pending: RC, driving licence, FIR copy, accident photos"
        - "schedule_callback(date=Tue 6 Oct, slot=1-2 pm, topic=survey outcome MC 41290) → booked"
        - "send_sms(template=accident_claims_summary) → sent"
  forbid: ["assign_garage(claim_id=MC 41290, garage=Sharma Auto Works)"]
  lines:
    - [open, "हैलो, मेरी गाड़ी का एक्सीडेंट हुआ है, टोंक रोड पर। पीछे से टेम्पो ने ठोक दिया।", "Hello, my car has had an accident on Tonk Road. A tempo hit it from behind."]
    - [after, "मैं ठीक हूँ। पत्नी के हाथ में चोट है, शायद हड्डी टूटी है। एम्बुलेंस बुला ली है।", "I'm fine. My wife has hurt her arm, maybe a fracture. We've called an ambulance."]
    - [after, "महेश चौधरी। जन्मतिथि छह जून उन्नीस सौ इकहत्तर।", "Mahesh Choudhary. Date of birth sixth June 1971."]
    - [after, "गाड़ी चल नहीं रही। सियाज़ है, आर जे चौदह सी डी चार पाँच दो एक। क्लेम कर दीजिए।", "The car won't move. It's a Ciaz, RJ14 CD 4521. File the claim."]
    - [after, "गाड़ी मारुति के डीलर के पास ही जाए। पास में कौन-सा है?", "The car should go to the Maruti dealer. Which one is near?"]
    - [after, "हाँ, राठी मोटर्स ठीक है। टो ट्रक भेज दीजिए, दुर्गापुरा फ्लाईओवर के पास खड़े हैं।", "Yes, Rathi Motors is fine. Send a tow truck, we're near the Durgapura flyover."]
    - [after, "सर्वेयर कब आएगा? कल सुबह हो सकता है?", "When will the surveyor come? Can it be tomorrow morning?"]
    - [after, "कौन-कौन से कागज़ चाहिए? हर एक का लिंक भेज दीजिए। एफ़आईआर करवा ली है।", "Which papers are needed? Send a link for each. We've filed the FIR."]
    - [after, "अब पत्नी को शुभ हॉस्पिटल, मालवीय नगर ले जा रहे हैं। वहाँ कैशलेस है? उनका नाम सुनीता चौधरी।", "Now we're taking my wife to Shubh Hospital, Malviya Nagar. Is it cashless there? Her name is Sunita Choudhary."]
    - [after, "डॉक्टर ने अंदाज़ा पैंतालीस हज़ार बताया है। कैशलेस शुरू कर दीजिए।", "The doctor has estimated forty-five thousand. Start the cashless process."]
    - [after, "टेम्पो का नंबर आर जे चौदह जी बी आठ आठ एक दो। उसका क्या होगा?", "The tempo's number is RJ14 GB 8812. What happens about him?"]
    - [after, "मेरी कार क्लेम में अभी क्या-क्या बाक़ी है?", "What is still pending on my car claim?"]
    - [after, "कल सर्वे के बाद मुझे फ़ोन कर दीजिए। और सब कुछ SMS में भेज दीजिए।", "Call me tomorrow after the survey. And send everything by SMS."]
    - [after, "धन्यवाद, आपने बहुत मदद की।", "Thank you, you've been a great help."]
  key:
    - "Asks first whether anyone is hurt"
    - "Registers MC 41290, assigns Rathi Motors, sends a tow truck (about 40 minutes) and books the survey for Tue 6 Oct, 10 am-12 pm"
    - "Sends four document links: RC, licence, FIR, photos"
    - "Confirms Shubh Hospital is cashless and gets pre-authorisation PA 41301 with ₹40,000 approved now"
    - "Raises third-party recovery TP 41310 for the tempo; reads what is pending on MC 41290"
    - "Books the call-back after the survey and sends the SMS"
  checks: {lang: hi, digits: ["MC 41290", "PA 41301", "40,000"], tool_order: [register_motor_claim, assign_garage]}
  guard: "L2 answers the injury question whether or not it was asked; L6 accepts the dealer once the agent names it; each document and hospital request names what it is for."

- id: bank-128
  g: BANK-5
  lang: te
  script: te-mix
  diff: Hard
  dir: in
  title: "Two planned surgeries for parents — network hospitals, two cashless requests with caps, documents, early renewal"
  basis: "Families plan surgeries around network hospitals and policy caps, member by member."
  caller: "F 26-45 · daughter in Hyderabad, planning ahead, asks for every limit"
  goal: "Get cashless approval for her father's knee replacement and her mother's cataract, understand the caps, and renew early with higher cover."
  role: "You handle health policies for Kavach Insurance. Explain room-rent and cataract limits when they reduce an approval."
  context: "Room rent is capped at 1% of the sum insured per day. Cataract is capped at ₹40,000 per eye. Changes made at renewal do not apply to a stay before the renewal date."
  tasks:
    - task: "Verify and read the policy"
      calls:
        - "verify_caller(name=Sravani Goud, dob=12 Dec 1991) → verified; proposer on KV-H-940117"
        - "get_policy(policy_no=KV-H-940117) → parents' policy: Narasimha Rao (66), Rajeshwari (61); ₹5,00,000; room rent 1% a day; cataract ₹40,000 per eye; renews 28 Oct, premium ₹38,800"
    - task: "Which hospitals are cashless"
      calls:
        - "check_network_hospital(policy_no=KV-H-940117, hospital=Medisree Hospital, Kukatpally) → not in network"
        - "check_network_hospital(policy_no=KV-H-940117, hospital=Apex Ortho Hospital, Begumpet) → cashless yes"
        - "check_network_hospital(policy_no=KV-H-940117, hospital=Netra Eye Hospital, Ameerpet) → cashless yes"
    - task: "Two cashless requests"
      calls:
        - "request_cashless(policy_no=KV-H-940117, member=Narasimha Rao, hospital=Apex Ortho Hospital, Begumpet, estimate=₹3,20,000) → pre-authorisation PA 94101; ₹2,80,000 approved (room-rent limit)"
        - "request_cashless(policy_no=KV-H-940117, member=Rajeshwari, hospital=Netra Eye Hospital, Ameerpet, estimate=₹55,000) → pre-authorisation PA 94102; ₹40,000 approved (cataract limit)"
    - task: "Documents for each"
      calls:
        - "send_document_link(claim_id=PA 94101, document=doctor's recommendation) → upload link sent by SMS"
        - "send_document_link(claim_id=PA 94101, document=X-ray and MRI reports) → upload link sent by SMS"
        - "send_document_link(claim_id=PA 94101, document=ID proof) → upload link sent by SMS"
        - "send_document_link(claim_id=PA 94102, document=eye test report) → upload link sent by SMS"
        - "send_document_link(claim_id=PA 94102, document=ID proof) → upload link sent by SMS"
    - task: "Last month's physio claim"
      calls:
        - "get_claim(claim_id=KC 93880) → Narasimha Rao physiotherapy; settled ₹12,400 on 2 Sep"
    - task: "Early renewal with more cover"
      calls:
        - "change_sum_insured(policy_no=KV-H-940117, sum_insured=₹10,00,000) → from renewal; premium +₹9,800"
