# Ecommerce & Retail — tool-heavy scenarios ret-125 … ret-132 (RET-5 Kartly Fresh, RET-6 Memberships & subscriptions, RET-2 Checkout).
code: ret
scenarios:

- id: ret-125
  g: RET-5
  lang: hg
  diff: Medium
  dir: in
  title: "Son's birthday party tomorrow — five substitutes decided, ten items added, earlier slot full"
  basis: "Party grocery orders get substitutions before packing, and customers keep adding items up to the slot."
  caller: "F 26-45 · mother in Delhi planning her son's birthday party for 20 children, excited and in a rush"
  goal: "Decide each substitute, add everything still missing for the party, and get the order earlier tomorrow."
  role: "You handle Kartly Fresh. Read each substitute before she decides."
  context: "Order FR-81500 is booked for Tue 6 Oct, 4-6 pm."
  tasks:
    - task: "Read the order"
      calls:
        - "get_fresh_order(order_id=FR-81500) → slot Tue 6 Oct 4-6 pm; substitutes waiting: Coca-Cola 2 L ×3 → Pepsi 2.25 L ×3; Lay's Classic 52 g ×10 → Lay's Magic Masala 52 g ×10; Amul vanilla 1 L ×2 → Kwality Walls vanilla 1 L ×2; number-7 birthday candle → plain candles; paper plates 50 → paper plates 25 ×2"
    - task: "Decide each substitute"
      calls:
        - "approve_substitution(order_id=FR-81500, item_id=Coca-Cola 2 L, accept=yes) → kept; +₹45"
        - "approve_substitution(order_id=FR-81500, item_id=Lay's Classic 52 g, accept=yes) → kept; ₹0"
        - "approve_substitution(order_id=FR-81500, item_id=Amul vanilla 1 L, accept=yes) → kept; +₹20"
        - "approve_substitution(order_id=FR-81500, item_id=number-7 birthday candle, accept=no) → removed; −₹49"
        - "approve_substitution(order_id=FR-81500, item_id=paper plates 50, accept=yes) → kept; +₹10"
    - task: "Add the rest of the party list"
      calls:
        - "add_fresh_item(order_id=FR-81500, sku=balloons pack of 50, qty=2) → added, ₹298"
        - "add_fresh_item(order_id=FR-81500, sku=party hats pack of 20, qty=1) → out of stock"
        - "add_fresh_item(order_id=FR-81500, sku=party poppers pack of 10, qty=2) → added, ₹240"
        - "add_fresh_item(order_id=FR-81500, sku=fruit juice 200 ml ×6, qty=4) → added, ₹480"
        - "add_fresh_item(order_id=FR-81500, sku=chocolate bars ×10, qty=2) → added, ₹400"
        - "add_fresh_item(order_id=FR-81500, sku=paper napkins 100, qty=2) → added, ₹120"
        - "add_fresh_item(order_id=FR-81500, sku=popcorn ready-to-eat 100 g, qty=6) → added, ₹270"
        - "add_fresh_item(order_id=FR-81500, sku=paper cups 50, qty=1) → added, ₹85"
        - "add_fresh_item(order_id=FR-81500, sku=number-7 candle (any colour), qty=1) → added, ₹59"
        - "add_fresh_item(order_id=FR-81500, sku=sparkler candles ×4, qty=1) → added, ₹60"
    - task: "Earlier slot"
      calls:
        - "book_fresh_slot(order_id=FR-81500, date=Tue 6 Oct, slot=12-2 pm) → error: slot full"
        - "book_fresh_slot(order_id=FR-81500, date=Tue 6 Oct, slot=2-4 pm) → slot booked"
    - task: "Wallet and summary"
      calls:
        - "get_wallet() → Kartly balance ₹600; the order total of ₹3,618 will use it first"
        - "send_sms(template=fresh_order_summary) → sent"
  forbid: ["approve_substitution(order_id=FR-81500, item_id=number-7 birthday candle, accept=yes)"]
  noise: {bed: kids_home, snr_db: 13}
  lines:
    - [open, "Hi! Kal mere bete ka birthday hai, Kartly Fresh ka order hai kal ke liye. App bol raha hai kuch cheezein badal rahi hain.", "Hi! It's my son's birthday tomorrow, and I have a Kartly Fresh order for tomorrow. The app says some items are being swapped."]
    - [after, "Ek-ek karke bataiye kya badla hai.", "Tell me one by one what's changed."]
    - [after, "Pepsi chalega, Magic Masala bhi chalega, Kwality Walls bhi theek hai, plates bhi.", "Pepsi is fine, Magic Masala is fine too, Kwality Walls is okay, and the plates."]
    - [after, "Par saat number wali candle chahiye hi chahiye, plain candles nahi. Woh hata do.", "But I absolutely need the number-7 candle, not plain candles. Remove that."]
    - [after, "Ab aur cheezein — do packet balloons, party hats bees wala, do packet party poppers.", "Now more things — two packs of balloons, the twenty party hats, two packs of party poppers."]
    - [after, "Hats nahi hain? Chalo koi baat nahi. Juice ke chaar packet, chhe-chhe wale. Chocolates ke do dabbe. Napkins do.", "No hats? Fine, never mind. Four packs of juice, the six-pack ones. Two boxes of chocolates. Two napkin packs."]
    - [pause 1500, "Chhe popcorn, ek packet cups. Aur saat number ki koi bhi candle, kisi bhi rang ki. Aur sparkler candles.", "Six popcorns, one pack of cups. And any number-7 candle, in any colour. And sparkler candles."]
    - [after, "Kal order baarah se do ke beech aa sakta hai? Party chaar baje hai. Agar woh full hai toh do se chaar.", "Can the order come tomorrow between twelve and two? The party is at four. If that's full, then two to four."]
    - [after, "Total kitna hua? Mere balance se kat jayega na?", "What's the total? It'll come out of my balance, right?"]
    - [after, "Theek hai, baaki UPI se de doongi delivery pe.", "Okay, I'll pay the rest by UPI on delivery."]
    - [after, "SMS bhej do. Thank you, aapne party bacha li!", "Send an SMS. Thank you, you saved the party!"]
    - [after, "Bye!", "Bye!"]
  key:
    - "Reads each substitute; keeps Pepsi, Magic Masala, Kwality Walls and the plates; removes the plain candles"
    - "Adds balloons, poppers, juice, chocolates, napkins, popcorn, cups, a number-7 candle and sparkler candles; says party hats are out of stock"
    - "When 12-2 pm is full, says so and books 2-4 pm tomorrow"
    - "States the ₹3,618 total, ₹600 from balance and ₹3,018 to pay"
  checks: {lang: hg, digits: ["3,618"], say: [["3,018", "teen hazaar atthaarah", "three thousand eighteen"]], tool_order: [approve_substitution, book_fresh_slot]}
  guard: "Each substitute is named in her reply, so any reading order fits; the slot fallback comes with the request; L6 reacts to the out-of-stock hats the agent must report."

- id: ret-126
  g: RET-5
  lang: hi
  diff: Medium
  dir: out
  title: "Picker calls before packing — seven items out, each substitute accepted or refused, extras added, slot moved"
  basis: "Grocery pickers call customers before packing when items are out of stock, item by item."
  caller: "F 60+ · retired homemaker in Varanasi, careful, asks for prices"
  goal: "Decide each of seven substitutes with prices, add a few things, and move the delivery to when she is home."
  role: "You are calling from Kartly Fresh before packing order FR-82200 because seven items are out of stock and have substitutes. Open the call: greet, name Kartly Fresh, say why you are calling. Give each substitute's price difference."
  context: ""
  tasks:
    - task: "Read the order"
      calls:
        - "get_fresh_order(order_id=FR-82200) → order total ₹2,480; slot Tue 6 Oct 9-11 am; out of stock with substitutes: Aashirvaad atta 5 kg → Pillsbury atta 5 kg (+₹15); toor dal 1 kg (Tata) → toor dal 1 kg (Fortune) (−₹8); Amul ghee 1 L → Patanjali ghee 1 L (−₹40); Surf Excel 1 kg → Tide 1 kg (−₹20); Parle-G 800 g → Britannia Marie 600 g (+₹10); mustard oil 1 L (Fortune) → mustard oil 1 L (Patanjali) (+₹5); Red Label tea 500 g → Taj Mahal tea 500 g (+₹60)"
    - task: "Decide each"
      calls:
        - "approve_substitution(order_id=FR-82200, item_id=Aashirvaad atta 5 kg, accept=yes) → kept; +₹15"
        - "approve_substitution(order_id=FR-82200, item_id=toor dal 1 kg, accept=yes) → kept; −₹8"
        - "approve_substitution(order_id=FR-82200, item_id=Amul ghee 1 L, accept=no) → removed; −₹650"
        - "approve_substitution(order_id=FR-82200, item_id=Surf Excel 1 kg, accept=yes) → kept; −₹20"
        - "approve_substitution(order_id=FR-82200, item_id=Parle-G 800 g, accept=no) → removed; −₹90"
        - "approve_substitution(order_id=FR-82200, item_id=mustard oil 1 L, accept=yes) → kept; +₹5"
        - "approve_substitution(order_id=FR-82200, item_id=Red Label tea 500 g, accept=no) → removed; −₹290"
    - task: "Extras"
      calls:
        - "add_fresh_item(order_id=FR-82200, sku=Amul ghee 500 ml, qty=2) → added, ₹660"
        - "add_fresh_item(order_id=FR-82200, sku=Parle-G 250 g, qty=3) → added, ₹90"
        - "add_fresh_item(order_id=FR-82200, sku=Red Label tea 250 g, qty=2) → added, ₹300"
        - "add_fresh_item(order_id=FR-82200, sku=besan 1 kg, qty=1) → added, ₹110"
        - "add_fresh_item(order_id=FR-82200, sku=sugar 1 kg, qty=2) → added, ₹96"
        - "add_fresh_item(order_id=FR-82200, sku=coriander, qty=1) → added, ₹20"
        - "add_fresh_item(order_id=FR-82200, sku=green chillies 100 g, qty=1) → added, ₹15"
        - "add_fresh_item(order_id=FR-82200, sku=curd 400 g, qty=1) → added, ₹45"
        - "add_fresh_item(order_id=FR-82200, sku=lemons 4, qty=1) → added, ₹40"
    - task: "Slot, balance, summary"
      calls:
        - "book_fresh_slot(order_id=FR-82200, date=Tue 6 Oct, slot=5-7 pm) → slot booked"
        - "get_wallet() → Kartly balance ₹0; payment by cash on delivery"
        - "send_sms(template=fresh_order_summary) → sent"
  forbid: ["approve_substitution(order_id=FR-82200, item_id=Amul ghee 1 L, accept=yes)"]
  lines:
    - [open, "हैलो?", "Hello?"]
    - [after, "हाँ, मैं सरला मिश्रा बोल रही हूँ। क्या नहीं है?", "Yes, Sarla Mishra speaking. What isn't available?"]
    - [after, "एक-एक करके बताइए, और दाम में क्या फ़र्क़ है वो भी।", "Tell me one by one, and the price difference too."]
    - [after, "आटा चलेगा, दाल भी चलेगी। घी पतंजलि का नहीं, वो हटा दीजिए।", "The atta is fine, the dal is fine too. Not Patanjali ghee — remove that."]
    - [after, "Tide चलेगा। मैरी बिस्कुट नहीं, हटाइए। सरसों का तेल ठीक है। चाय ताजमहल नहीं, हमें रेड लेबल ही चाहिए।", "Tide is fine. Not Marie biscuits — remove them. The mustard oil is fine. Not Taj Mahal tea, we only want Red Label."]
    - [after, "अमूल घी छोटे डिब्बे में है? तो आधा-आधा लीटर के दो डाल दीजिए।", "Is Amul ghee there in a smaller pack? Then put two half-litre ones."]
    - [after, "पारले-जी छोटे पैकेट तीन, और रेड लेबल छोटे पैकेट दो।", "Three small packets of Parle-G, and two small packs of Red Label."]
    - [after, "और एक किलो बेसन, दो किलो चीनी, धनिया, हरी मिर्च, एक दही और चार नींबू।", "And one kilo of besan, two kilos of sugar, coriander, green chillies, one curd and four lemons."]
    - [after, "सुबह मैं मंदिर जाती हूँ। शाम को पाँच से सात के बीच भेज दीजिए।", "I go to the temple in the morning. Send it between five and seven in the evening."]
    - [after, "कुल कितना हुआ? मैं नकद दूँगी।", "What's the total? I'll pay cash."]
    - [after, "ठीक है बेटा, SMS भेज देना।", "Okay dear, send an SMS."]
    - [after, "धन्यवाद, आपने फ़ोन करके पूछा, अच्छा लगा।", "Thank you, it was nice of you to call and ask."]
  key:
    - "Opens naming Kartly Fresh and the seven out-of-stock items; gives each substitute's price difference"
    - "Keeps atta, dal, Tide and mustard oil; removes the Patanjali ghee, Marie biscuits and Taj Mahal tea"
    - "Adds two 500 ml Amul ghee, three small Parle-G, two small Red Label, besan, two kg sugar, coriander, chillies, curd and lemons"
    - "Moves delivery to Tue 6 Oct, 5-7 pm; gives the new total ₹2,818 for cash on delivery"
  checks: {lang: hi, say: [["2,818", "दो हज़ार आठ सौ अठारह", "अट्ठाईस सौ अठारह"]], tool_order: [approve_substitution, add_fresh_item]}
  guard: "Every decision names the item, so it fits any reading order; L6–L7 react to items she has just refused; L10 asks for the total whatever was said."

- id: ret-127
  g: RET-5
  lang: te
  script: te-mix
  diff: Medium
  dir: in
  title: "Monthly stock-up — last delivery's four problems fixed, then sixteen items for the month, slot and balance"
  basis: "Families do one big monthly grocery order and sort out the last delivery's problems in the same call."
  caller: "F 46-60 · homemaker in Vijayawada with a joint family, reads from a written list"
  goal: "Get refunds or replacements for yesterday's problems, then place the whole month's list for Saturday morning using her balance."
  role: "You handle Kartly Fresh."
  context: ""
  tasks:
    - task: "Yesterday's delivery"
      calls:
        - "get_fresh_order(order_id=FR-83010) → delivered Sun 4 Oct; rice 10 kg, sunflower oil 2 L, onions 2 kg, tomatoes 1 kg, eggs 30, milk 2 L, curd 1 kg"
        - "report_quality_issue(order_id=FR-83010, item_id=onions 2 kg, issue=half rotten) → ₹70 to Kartly balance"
        - "report_quality_issue(order_id=FR-83010, item_id=sunflower oil 2 L, issue=pouch leaking) → ₹310 to Kartly balance"
        - "report_quality_issue(order_id=FR-83010, item_id=eggs 30, issue=six broken) → ₹42 to Kartly balance"
        - "report_missing_item(order_id=FR-83010, item_id=curd 1 kg) → ₹110 to Kartly balance"
    - task: "The month's list"
      calls:
        - "get_fresh_order(order_id=FR-83055) → new draft order; empty"
        - "add_fresh_item(order_id=FR-83055, sku=sona masoori rice 25 kg, qty=1) → added, ₹1,650"
        - "add_fresh_item(order_id=FR-83055, sku=toor dal 1 kg, qty=2) → added, ₹330"
        - "add_fresh_item(order_id=FR-83055, sku=moong dal 1 kg, qty=1) → added, ₹150"
        - "add_fresh_item(order_id=FR-83055, sku=urad dal 1 kg, qty=1) → added, ₹160"
        - "add_fresh_item(order_id=FR-83055, sku=sunflower oil 5 L, qty=1) → added, ₹780"
        - "add_fresh_item(order_id=FR-83055, sku=groundnut oil 1 L, qty=1) → added, ₹210"
        - "add_fresh_item(order_id=FR-83055, sku=tamarind 500 g, qty=1) → added, ₹120"
        - "add_fresh_item(order_id=FR-83055, sku=red chilli powder 500 g, qty=1) → added, ₹180"
        - "add_fresh_item(order_id=FR-83055, sku=turmeric 200 g, qty=1) → added, ₹60"
        - "add_fresh_item(order_id=FR-83055, sku=mustard seeds 200 g, qty=1) → added, ₹40"
        - "add_fresh_item(order_id=FR-83055, sku=jaggery 1 kg, qty=1) → added, ₹90"
        - "add_fresh_item(order_id=FR-83055, sku=sugar 2 kg, qty=1) → added, ₹96"
        - "add_fresh_item(order_id=FR-83055, sku=filter coffee powder 500 g, qty=1) → added, ₹280"
        - "add_fresh_item(order_id=FR-83055, sku=dish soap bar ×4, qty=1) → added, ₹80"
        - "add_fresh_item(order_id=FR-83055, sku=detergent 2 kg, qty=1) → added, ₹380"
        - "add_fresh_item(order_id=FR-83055, sku=bath soap ×6, qty=1) → added, ₹240"
    - task: "Slot, balance, summary"
      calls:
        - "book_fresh_slot(order_id=FR-83055, date=Sat 10 Oct, slot=7-9 am) → slot booked"
        - "get_wallet() → Kartly balance ₹532; the ₹4,846 order uses it first, ₹4,314 to pay"
        - "send_sms(template=fresh_order_summary) → sent"
  forbid: ["report_missing_item(order_id=FR-83010, item_id=milk 2 L)"]
  lines:
    - [open, "నమస్కారం. నిన్నటి Kartly Fresh order లో కొన్ని సమస్యలు ఉన్నాయి. తర్వాత ఈ నెల సరుకుల list కూడా order చేయాలి.", "Hello. There are some problems with yesterday's Kartly Fresh order. After that I also need to order this month's grocery list."]
    - [after, "ఉల్లిపాయలు సగం కుళ్ళిపోయాయి. Oil packet leak అవుతోంది. ఆరు గుడ్లు పగిలాయి. పెరుగు అసలు రాలేదు.", "The onions are half rotten. The oil pouch is leaking. Six eggs are broken. The curd never came at all."]
    - [after, "డబ్బు Kartly balance లో వేయండి, నెల సరుకుల్లో వాడుకుంటాను.", "Put the money in my Kartly balance; I'll use it on the month's groceries."]
    - [after, "ఇప్పుడు list. Sona masoori బియ్యం ఇరవై ఐదు కిలోలు. కంది పప్పు రెండు కిలోలు, పెసర పప్పు ఒకటి, మినప పప్పు ఒకటి.", "Now the list. Sona masoori rice, twenty-five kilos. Toor dal two kilos, moong dal one, urad dal one."]
    - [after, "Sunflower oil ఐదు లీటర్లు, పల్లీ నూనె ఒక లీటరు. చింతపండు అర కిలో.", "Sunflower oil five litres, groundnut oil one litre. Tamarind half a kilo."]
    - [pause 2000, "కారం అర కిలో, పసుపు రెండు వందల గ్రాములు, ఆవాలు రెండు వందల గ్రాములు. బెల్లం ఒక కిలో, చక్కెర రెండు కిలోలు.", "Chilli powder half a kilo, turmeric two hundred grams, mustard seeds two hundred grams. Jaggery one kilo, sugar two kilos."]
    - [after, "Filter coffee powder అర కిలో. Dish soap bars నాలుగు, detergent రెండు కిలోలు, స్నానం soaps ఆరు.", "Filter coffee powder half a kilo. Four dish soap bars, two kilos of detergent, six bath soaps."]
    - [after, "అంతే. ఇది శనివారం పొద్దున ఏడు నుంచి తొమ్మిది మధ్య రావాలి.", "That's all. It should come on Saturday morning between seven and nine."]
    - [after, "Balance ఎంత ఉంది? మొత్తం ఎంత, ఇంకా ఎంత కట్టాలి?", "How much is in the balance? What's the total, and how much more do I pay?"]
    - [after, "List ఒకసారి చదివి చెప్పండి, ఏదైనా మిస్ అయిందేమో.", "Read the list back once, in case anything was missed."]
    - [after, "సరే, SMS పంపండి.", "Okay, send an SMS."]
    - [after, "ధన్యవాదాలు.", "Thank you."]
  key:
    - "Reports the onions, oil and eggs as quality issues and the curd as missing, one call each: ₹532 to Kartly balance"
    - "Adds all sixteen items on her list with the right quantities"
    - "Books Sat 10 Oct, 7-9 am"
    - "States the ₹4,846 total, ₹532 from balance and ₹4,314 to pay"
    - "Reads the list back; speaks Telugu, keeping her English words"
  checks: {lang: te, digits: ["4,846", "532"], say: [["4,314", "నాలుగు వేల మూడు వందల పద్నాలుగు"]], tool_order: [report_quality_issue, add_fresh_item]}
  guard: "The problems come in one line; the list comes in batches that each hold after any reply; L9 asks for the money split whatever was said."

- id: ret-128
  g: RET-5
  lang: ta
  script: ta-mix
  diff: Hard
  dir: in
  title: "Housewarming lunch for forty — bulk grocery order, a per-order limit, two out of stock swapped, early slot"
  basis: "Function cooking needs bulk groceries; quick-commerce order limits and stock gaps have to be worked around item by item."
  caller: "F 46-60 · mother organising a housewarming (grihapravesam) lunch in Chennai, the cook beside her"
  goal: "Order everything the cook needs for forty people, work around the rice limit and two missing items, and get it delivered at dawn on the function day."
  role: "You handle Kartly Fresh. Some items have a per-order limit."
  context: "The function is on Thu 8 Oct; lunch at 12."
  tasks:
    - task: "New order"
      calls:
        - "get_fresh_order(order_id=FR-84100) → new draft order; empty"
    - task: "Staples"
      calls:
        - "add_fresh_item(order_id=FR-84100, sku=ponni rice 25 kg, qty=3) → error: limit 2 bags of 25 kg per order"
        - "add_fresh_item(order_id=FR-84100, sku=ponni rice 25 kg, qty=2) → added, ₹3,300"
        - "add_fresh_item(order_id=FR-84100, sku=ponni rice 10 kg, qty=1) → added, ₹690"
        - "add_fresh_item(order_id=FR-84100, sku=toor dal 1 kg, qty=4) → added, ₹660"
