        - "add_meal(pnr=YT7G2H, passenger=Swathi Rao, flight_no=YA 301, meal=veg) → added, ₹350"
        - "add_meal(pnr=YT7G2H, passenger=Anvi Rao, flight_no=YA 301, meal=veg) → added, ₹350"
