  lines:
    - [open, "Hello, I want to move our family trip to Delhi by one day, both ways. P N R Y T seven G two H. Five of us."]
    - [after, "We're on the Thursday morning flight on the fifteenth. Can all five go on Friday instead?"]
    - [after, "And the return, from the twenty-second to Friday the twenty-third. Everyone."]
    - [after, "What's the difference in fare?"]
    - [after, "Okay, go ahead with both, all five."]
    - [after, "Seats on the Friday flight, one row. Anvi at the window, then my wife Swathi, then me on the aisle, and across the aisle my mother, then my father."]
    - [after b, "హలో, నేను పద్మ, కిరణ్ వాళ్ళ అమ్మని. మా ఆయనకి మోకాలి నొప్పి. ఆయనకి wheelchair కావాలి, వెళ్ళేటప్పుడు, వచ్చేటప్పుడు.", "Hello, I'm Padma, Kiran's mother. My husband has knee pain. He needs a wheelchair, going and coming back."]
    - [after b, "అందరికీ veg భోజనం పెట్టండి, వెళ్ళే flight లో.", "Put veg meals for everyone on the flight there."]
    - [after b, "సరే, ఫోన్ కిరణ్ కి ఇస్తున్నాను. తెలుగులోనే మాట్లాడండి, నేను పక్కనే వింటున్నాను.", "Okay, I'm giving the phone to Kiran. Keep speaking in Telugu, I'm listening right here."]
    - [after, "అమ్మ చెప్పింది కదా, తెలుగులోనే చెప్పండి. మొత్తం ఎంత అయింది?", "As Amma said, please tell me in Telugu. What's the total?"]
    - [after, "సరే, payment link పంపండి.", "Okay, send the payment link."]
    - [after, "Seats ఒకసారి చెప్పండి.", "Tell me the seats once."]
    - [after, "Itinerary కూడా SMS చేయండి. Thanks.", "SMS the itinerary too. Thanks."]
  key:
    - "Gives both Friday options and moves all five to YA 301 Friday 16 October (+₹700 each)"
    - "Moves all five returns to YA 306 Friday 23 October at no extra fare"
    - "Seats Anvi 21A, Swathi 21B, Kiran 21C, Padma 21D, Venkat 21E"
    - "Answers the mother: wheelchair for Venkat on both flights; veg meals for all five on YA 301"
    - "States ₹5,250 (fares ₹3,500, meals ₹1,750) and sends one link"
    - "Reads the seats back in Telugu"
  checks: {lang_from: {L7: te}, digits: ["5,250"], say: [["5,250", "ఐదు వేల రెండు వందల యాభై"]], tool_order: [search_flights, change_flight]}
  guard: "The mother's requests are new and true whatever the agent said; the son asks for Telugu himself in L10, so the switch holds even if the agent drifted back."

