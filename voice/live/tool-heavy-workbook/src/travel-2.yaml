      calls:
        - "request_wheelchair(pnr=YT7G2H, passenger=Venkat Rao, flight_no=YA 301) → booked at departure and arrival"
        - "request_wheelchair(pnr=YT7G2H, passenger=Venkat Rao, flight_no=YA 306) → booked at departure and arrival"
