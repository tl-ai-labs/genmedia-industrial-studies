        - "change_flight(pnr=YT7G2H, passenger=Padma Rao, new_flight=YA 306 Fri 23 Oct) → changed, ₹0"
        - "change_flight(pnr=YT7G2H, passenger=Venkat Rao, new_flight=YA 306 Fri 23 Oct) → changed, ₹0"
