  guard: "The caller states the situation and asks for the evening flight himself; L9 doubts the gate whatever was said, so the agent must restate it."

- id: trv-115
  g: TRV-2
  lang: hi
  diff: Medium
  dir: in
  title: "Eight bags on one flight — six missing, two damaged: trace, claim, deliver"
  basis: "Families returning with many bags file one claim per bag; damaged and missing bags follow different routes."
  caller: "M 46-60 · father, tired after a family wedding trip"
  goal: "Find the six missing bags, claim each, deliver the found ones home, escalate the untraced one, claim the two damaged."
  role: "You handle baggage. One claim per bag."
  context: "Damaged-bag claims are inspected at the address within 3 working days."
  tasks:
    - task: "Find the booking"
      calls:
        - "get_booking(pnr=YT3B7L) → Manoj Saxena, Rekha Saxena, Ishita Saxena, Kusum Saxena; YA 812 Bengaluru-Lucknow Sun 4 Oct; 8 bags: 778201-778202 Manoj, 778203-778204 Rekha, 778205 Ishita, 778206-778208 Kusum"
    - task: "Trace the six missing bags"
      calls:
        - "get_baggage_status(tag=778201) → at Bengaluru, arrives Lucknow on YA 810 Tue 6 Oct"
        - "get_baggage_status(tag=778202) → at Bengaluru, arrives Lucknow on YA 810 Tue 6 Oct"
        - "get_baggage_status(tag=778203) → at Bengaluru, arrives Lucknow on YA 810 Tue 6 Oct"
        - "get_baggage_status(tag=778204) → at Bengaluru, arrives Lucknow on YA 810 Tue 6 Oct"
        - "get_baggage_status(tag=778205) → at Bengaluru, arrives Lucknow on YA 810 Tue 6 Oct"
        - "get_baggage_status(tag=778206) → not traced yet"
    - task: "One claim per missing bag"
      calls:
        - "raise_baggage_claim(pnr=YT3B7L, passenger=Manoj Saxena, tag=778201, description=delayed) → claim BC 51201"
        - "raise_baggage_claim(pnr=YT3B7L, passenger=Manoj Saxena, tag=778202, description=delayed) → claim BC 51202"
        - "raise_baggage_claim(pnr=YT3B7L, passenger=Rekha Saxena, tag=778203, description=delayed) → claim BC 51203"
        - "raise_baggage_claim(pnr=YT3B7L, passenger=Rekha Saxena, tag=778204, description=delayed) → claim BC 51204"
        - "raise_baggage_claim(pnr=YT3B7L, passenger=Ishita Saxena, tag=778205, description=delayed) → claim BC 51205"
        - "raise_baggage_claim(pnr=YT3B7L, passenger=Kusum Saxena, tag=778206, description=missing, medicines inside) → claim BC 51206"
    - task: "Deliver the five found bags home"
      calls:
        - "arrange_bag_delivery(claim_id=BC 51201, address=Flat 302 Gomti Apartments Gomti Nagar Lucknow 226010, slot=Tue 6 Oct 6-9 pm) → delivery booked"
        - "arrange_bag_delivery(claim_id=BC 51202, address=Flat 302 Gomti Apartments Gomti Nagar Lucknow 226010, slot=Tue 6 Oct 6-9 pm) → delivery booked"
        - "arrange_bag_delivery(claim_id=BC 51203, address=Flat 302 Gomti Apartments Gomti Nagar Lucknow 226010, slot=Tue 6 Oct 6-9 pm) → delivery booked"
        - "arrange_bag_delivery(claim_id=BC 51204, address=Flat 302 Gomti Apartments Gomti Nagar Lucknow 226010, slot=Tue 6 Oct 6-9 pm) → delivery booked"
        - "arrange_bag_delivery(claim_id=BC 51205, address=Flat 302 Gomti Apartments Gomti Nagar Lucknow 226010, slot=Tue 6 Oct 6-9 pm) → delivery booked"
    - task: "Escalate the untraced bag"
      calls:
        - "raise_ticket(category=untraced bag, summary=778206 not traced; medicines inside for Kusum Saxena) → ticket TK 90471, priority, update within 24 hours"
    - task: "Damage claims for the two damaged bags"
      calls:
        - "raise_damage_claim(pnr=YT3B7L, passenger=Rekha Saxena, tag=778207, damage=handle broken) → claim DC 3307, inspection at the address within 3 working days"
        - "raise_damage_claim(pnr=YT3B7L, passenger=Kusum Saxena, tag=778208, damage=wheel broken) → claim DC 3308, inspection at the address within 3 working days"
    - task: "Send all claim numbers"
      calls:
        - "send_sms(template=baggage_claims_summary) → sent"
  forbid: ["arrange_bag_delivery(claim_id=BC 51206)", cancel_booking]
  lines:
    - [open, "नमस्ते, हम कल बेंगलुरु से लखनऊ आए हैं, हमारा सामान नहीं आया। पीएनआर है वाई टी तीन बी सात एल।", "Hello, we came from Bengaluru to Lucknow yesterday and our luggage hasn't come. The PNR is YT3B7L."]
    - [after, "आठ बैग थे। टैग सात सात आठ दो शून्य एक से लेकर दो शून्य आठ तक, लगातार। इनमें से पहले छह नहीं आए।", "There were eight bags. Tags 778201 to 778208, in a row. The first six of them didn't come."]
    - [after, "और जो दो आए, सात और आठ नंबर वाले, वो दोनों टूटे हुए हैं। एक का हैंडल, एक का पहिया।", "And the two that came, numbers seven and eight, are both broken. One's handle, one's wheel."]
    - [after, "पहले बताइए, जो छह नहीं आए वो कहाँ हैं?", "First tell me, where are the six that didn't come?"]
    - [after, "छहों की शिकायत दर्ज कर दीजिए।", "Register complaints for all six."]
    - [after, "जो मिल गए हैं, वो घर भेज दीजिए। पता है फ़्लैट तीन सौ दो, गोमती अपार्टमेंट, गोमती नगर, लखनऊ, दो दो छह शून्य एक शून्य।", "Send the ones that have been found home. The address is Flat 302, Gomti Apartments, Gomti Nagar, Lucknow, 226010."]
    - [after, "मंगलवार शाम छह से नौ के बीच ठीक रहेगा।", "Tuesday evening between six and nine will be fine."]
    - [after, "और जो नहीं मिला, उसका क्या होगा? उसमें माँ की दवाइयाँ हैं।", "And what about the one that hasn't been found? My mother's medicines are in it."]
    - [after, "टूटे हुए दोनों बैग की भी शिकायत कर दीजिए।", "Register complaints for the two broken bags too."]
    - [after, "सारे शिकायत नंबर एक बार बता दीजिए।", "Tell me all the complaint numbers once."]
    - [after, "ये सब मैसेज में भी भेज दीजिए।", "Send all of this by message too."]
    - [after, "ठीक है, धन्यवाद।", "Okay, thank you."]
  key:
    - "Traces all six: five arrive on YA 810 Tuesday 6 October; 778206 not traced yet"
    - "Raises six claims, BC 51201 to BC 51206, each under the right passenger"
    - "Books delivery of the five found bags to Flat 302, Gomti Apartments, Tuesday 6-9 pm; not the untraced one"
    - "Escalates 778206 with the medicines noted, ticket TK 90471, update within 24 hours"
    - "Raises damage claims DC 3307 (handle) and DC 3308 (wheel); inspection within 3 working days"
    - "Reads all claim numbers back and sends them"
    - "Empathetic about the medicines; promises nothing beyond the tool results"
  checks: {lang: hi, digits: ["BC 51206", "TK 90471", "DC 3307", "DC 3308"], tool_order: [raise_baggage_claim, arrange_bag_delivery]}
  guard: "The tags are given as a range and split into missing and damaged before any lookup; every later line is a request that fits any reply."

- id: trv-116
  g: TRV-2
  lang: ta
  script: ta-mix
  diff: Hard
  dir: in
  title: "Eight-hour delay — parents cancel for a full refund, family moves to tomorrow with cabs"
  basis: "Long delays split families: some cancel for a refund, the rest rebook, and everyone needs a way home."
  caller: "M 26-45 · son at the airport with wife, child and parents, stressed"
  goal: "Full refund for his parents on the second booking, his family on tomorrow's first flight with seats, meals and check-in, food now, and three cabs."
  role: "You handle disruptions. A Yatri Air delay over 6 hours allows a free change or a full refund. Cancel only after a clear yes."
  context: "Meal vouchers are given at the airport after a 2-hour delay. Cabs are booked for the customer to pay."
  tasks:
    - task: "Find both bookings and the delay"
      calls:
        - "get_booking(pnr=YT1Q4W) → Karthik Raman, Priya Karthik, Aadhav Karthik (child, 8); YA 128 Chennai-Kolkata Mon 5 Oct 1:30 pm"
        - "get_booking(pnr=YT1Q5X) → Raman S, Saroja Raman; YA 128 Chennai-Kolkata Mon 5 Oct 1:30 pm"
        - "get_flight_status(flight_no=YA 128, date=Mon 5 Oct) → delayed to 9:45 pm (8 hours 15 minutes)"
    - task: "Cancel the parents for a full refund"
      calls:
        - "cancel_passenger(pnr=YT1Q5X, passenger=Raman S) → cancelled; full refund ₹6,420 to the original card in 5-7 working days"
        - "cancel_passenger(pnr=YT1Q5X, passenger=Saroja Raman) → cancelled; full refund ₹6,420 to the original card in 5-7 working days"
    - task: "Move the family to tomorrow's first flight"
      calls:
        - "search_flights(from=MAA, to=CCU, date=Tue 6 Oct) → YA 126 6:30 am, 6 seats; YA 130 2:10 pm, 12 seats"
        - "rebook_disrupted(pnr=YT1Q4W, passenger=Karthik Raman, new_flight=YA 126 Tue 6 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT1Q4W, passenger=Priya Karthik, new_flight=YA 126 Tue 6 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT1Q4W, passenger=Aadhav Karthik, new_flight=YA 126 Tue 6 Oct) → rebooked, ₹0"
    - task: "Three seats together"
      calls:
        - "get_seat_map(flight_no=YA 126, date=Tue 6 Oct) → 7A-7C free; 8C (aisle) free"
        - "assign_seat(pnr=YT1Q4W, passenger=Aadhav Karthik, flight_no=YA 126, seat=7A) → assigned, ₹0"
        - "assign_seat(pnr=YT1Q4W, passenger=Priya Karthik, flight_no=YA 126, seat=7B) → assigned, ₹0"
        - "assign_seat(pnr=YT1Q4W, passenger=Karthik Raman, flight_no=YA 126, seat=7C) → error: 7C was taken a moment ago"
        - "assign_seat(pnr=YT1Q4W, passenger=Karthik Raman, flight_no=YA 126, seat=8C) → assigned, ₹0"
    - task: "Breakfast on the new flight"
      calls:
        - "add_meal(pnr=YT1Q4W, passenger=Karthik Raman, flight_no=YA 126, meal=breakfast) → added, ₹0"
        - "add_meal(pnr=YT1Q4W, passenger=Priya Karthik, flight_no=YA 126, meal=breakfast) → added, ₹0"
        - "add_meal(pnr=YT1Q4W, passenger=Aadhav Karthik, flight_no=YA 126, meal=breakfast) → added, ₹0"
    - task: "Food now"
      calls:
        - "issue_meal_voucher(pnr=YT1Q4W, passenger=Karthik Raman) → voucher MV 3301, ₹400"
        - "issue_meal_voucher(pnr=YT1Q4W, passenger=Priya Karthik) → voucher MV 3302, ₹400"
        - "issue_meal_voucher(pnr=YT1Q4W, passenger=Aadhav Karthik) → voucher MV 3303, ₹400"
    - task: "Three cabs"
      calls:
        - "book_cab(pickup=Chennai airport T1, drop=Adyar, date=Mon 5 Oct, time=now, car_type=sedan) → ride RC 3311, about ₹520"
        - "book_cab(pickup=Chennai airport T1, drop=Velachery, date=Mon 5 Oct, time=now, car_type=sedan) → ride RC 3312, about ₹480"
        - "book_cab(pickup=Velachery, drop=Chennai airport T1, date=Tue 6 Oct, time=4:30 am, car_type=sedan) → ride RC 3313, about ₹480"
    - task: "Check in and send everything"
      calls:
        - "web_check_in(pnr=YT1Q4W, passenger=Karthik Raman, flight_no=YA 126) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT1Q4W, passenger=Priya Karthik, flight_no=YA 126) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT1Q4W, passenger=Aadhav Karthik, flight_no=YA 126) → checked in, boarding pass sent by SMS"
        - "send_sms(template=disruption_summary) → sent"
  forbid: ["cancel_booking(pnr=YT1Q4W)", "cancel_passenger(pnr=YT1Q4W, passenger=Karthik Raman)"]
  lines:
    - [open, "வணக்கம், Kolkata flight எட்டு மணி நேரம் late-னு message வந்துச்சு. ரெண்டு booking இருக்கு — Y T one Q four W, அப்புறம் Y T one Q five X.", "Hello, I got a message that the Kolkata flight is eight hours late. There are two bookings — YT1Q4W, and YT1Q5X."]
    - [after, "இவ்வளவு late-ஆனா என்ன option இருக்கு?", "With such a long delay, what options are there?"]
    - [after, "என் அப்பா அம்மா போகல. Second booking-ல இருக்கற அவங்க ரெண்டு பேருக்கும் cancel பண்ணுங்க, முழு refund வேணும்.", "My father and mother won't go. Cancel the two of them on the second booking, we want a full refund."]
    - [after, "நாங்க மூணு பேரும் நாளைக்கு காலை முதல் flight-ல போறோம். மாத்துங்க.", "The three of us will take tomorrow morning's first flight. Change it."]
    - [after, "Seats மூணும் சேர்ந்து வேணும். பையன் window, அப்புறம் என் wife, அப்புறம் நான். என் seat கிடைக்கலன்னா பின்னாடி row-ல aisle போடுங்க.", "All three seats together. The boy at the window, then my wife, then me. If my seat isn't available, put me on the aisle in the row behind."]
    - [after, "காலைல சாப்பாடும் போடுங்க, மூணு பேருக்கும்.", "Add breakfast too, for all three."]
    - [after, "இப்போ airport-ல தான் இருக்கோம். சாப்பிட ஏதாவது voucher கிடைக்குமா? நாங்க மூணு பேர்.", "We're at the airport right now. Can we get a voucher for food? The three of us."]
    - [after, "அப்பா அம்மாவுக்கு airport-ல இருந்து Adyar-க்கு ஒரு cab book பண்ணுங்க.", "Book a cab for my parents from the airport to Adyar."]
    - [after, "எங்களுக்கும் இப்போ Velachery-க்கு ஒரு cab, நாளைக்கு காலை நாலரை மணிக்கு திரும்ப airport-க்கு ஒரு cab.", "And for us, one cab to Velachery now, and one back to the airport tomorrow at four thirty in the morning."]
    - [after, "மூணு பேருக்கும் check-in பண்ணிடுங்க.", "Check in all three."]
    - [after, "அப்பா அம்மா refund எவ்வளவு, எப்போ வரும்?", "How much is my parents' refund, and when will it come?"]
    - [after, "எல்லாத்தையும் SMS பண்ணுங்க.", "SMS everything."]
    - [after, "சரி, நன்றி.", "Okay, thanks."]
  key:
    - "Explains the delay (9:45 pm) and both choices: free change or full refund"
    - "Cancels Raman S and Saroja Raman only, on YT1Q5X; refund ₹6,420 each in 5-7 working days"
    - "Gives both Tuesday options and rebooks the family free on YA 126, 6:30 am"
    - "Seats Aadhav 7A and Priya 7B; when 7C fails, says so and gives Karthik 8C"
    - "Adds breakfast for three and issues meal vouchers MV 3301 to 3303"
    - "Books RC 3311 to Adyar, RC 3312 to Velachery and RC 3313 at 4:30 am Tuesday"
    - "Checks the family in; sends the summary"
  checks: {lang: ta, digits: ["6,420", "YA 126", "8C", "RC 3313"], say: [["6,420", "ஆறாயிரத்து நானூற்று இருபது"]], tool_order: [get_flight_status, cancel_passenger]}
  guard: "The caller decides cancel-versus-rebook himself in L3–L4 after asking the options; each cab request names its route and time."
