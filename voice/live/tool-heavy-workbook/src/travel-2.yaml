        - "assign_seat(pnr=YT7G2H, passenger=Anvi Rao, flight_no=YA 301, seat=21A) → assigned, ₹0"
        - "assign_seat(pnr=YT7G2H, passenger=Swathi Rao, flight_no=YA 301, seat=21B) → assigned, ₹0"
        - "assign_seat(pnr=YT7G2H, passenger=Kiran Rao, flight_no=YA 301, seat=21C) → assigned, ₹0"
        - "assign_seat(pnr=YT7G2H, passenger=Padma Rao, flight_no=YA 301, seat=21D) → assigned, ₹0"
        - "assign_seat(pnr=YT7G2H, passenger=Venkat Rao, flight_no=YA 301, seat=21E) → assigned, ₹0"
