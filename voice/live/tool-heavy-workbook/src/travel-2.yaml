      calls:
        - "search_flights(from=DEL, to=HYD, date=Fri 23 Oct) → YA 306 8:40 pm, no fare difference"
        - "change_flight(pnr=YT7G2H, passenger=Kiran Rao, new_flight=YA 306 Fri 23 Oct) → changed, ₹0"
