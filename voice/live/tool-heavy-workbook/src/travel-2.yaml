  g: TRV-1
  lang: tx
  script: en → te-mix
  diff: Hard
  dir: in
  switch: "L7: English → Telugu (his mother takes the phone, then he stays in Telugu)"
  title: "Family of five — both flights moved, seats, wheelchair, meals; mother joins in Telugu"
  basis: "Joint-family date changes: the son calls in English and a parent joins in Telugu with their own requests."
  caller: "M 26-45 · son booking for the family, in English; speaker b: F 46-60 · his mother, Telugu only"
  goal: "Move the Delhi trip a day later both ways for all five, seats in one row, a wheelchair for his father, veg meals, pay once."
