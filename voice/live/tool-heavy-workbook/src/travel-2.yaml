  context: "Flexi fare: date changes free, fare difference only. Seats free. Meals ₹350."
  tasks:
    - task: "Find the booking"
      calls:
        - "get_booking(pnr=YT7G2H) → Kiran Rao, Swathi Rao, Anvi Rao (child, 7), Padma Rao, Venkat Rao; YA 301 Hyderabad-Delhi Thu 15 Oct 6:50 am; YA 306 Delhi-Hyderabad Thu 22 Oct 8:40 pm; Flexi fare"
    - task: "All five out on Friday 16 October"
      calls:
        - "search_flights(from=HYD, to=DEL, date=Fri 16 Oct) → YA 301 6:50 am, +₹700 per person; YA 305 1:20 pm, +₹1,900 per person"
        - "change_flight(pnr=YT7G2H, passenger=Kiran Rao, new_flight=YA 301 Fri 16 Oct) → changed, +₹700"
        - "change_flight(pnr=YT7G2H, passenger=Swathi Rao, new_flight=YA 301 Fri 16 Oct) → changed, +₹700"
