    - [open, "வணக்கம், நாளைக்கு Pune flight cancel-னு message வந்துச்சு. ரெண்டு booking — Y T seven F one C, Y T seven F two D.", "Hello, I got a message that tomorrow's Pune flight is cancelled. Two bookings — YT7F1C and YT7F2D."]
    - [after, "மழையால தானே? இப்போ என்ன பண்ணலாம்?", "It's because of the rain, right? What can we do now?"]
    - [after, "என் family மூணு பேர், first booking. புதன்கிழமை காலை flight-க்கு மாத்துங்க.", "My family is three people, the first booking. Move us to Wednesday's morning flight."]
    - [after, "என் தங்கச்சியும் அவங்க husband-உம், second booking, இப்போ போகல. அவங்களுக்கு அடுத்த தடவைக்கு credit-ஆ வச்சிடுங்க, refund வேண்டாம்.", "My sister and her husband, the second booking, won't go now. Keep it as credit for next time for them, no refund."]
    - [after, "Credit எவ்வளவு, எப்போ வரைக்கும் valid?", "How much is the credit, and until when is it valid?"]
    - [after, "Seats மூணும் சேர்ந்து — பையன் window, நான் நடுவுல, wife aisle. ஒண்ணு போனா அந்த ஆள பின்னாடி row-ல அதே இடத்துல போடுங்க.", "All three seats together — the boy at the window, me in the middle, my wife on the aisle. If one goes, put that person in the same place in the row behind."]
    - [after, "மூணு பேருக்கும் breakfast.", "Breakfast for all three."]
    - [after, "காலைல அஞ்சு மணிக்கு Anna Nagar-ல இருந்து airport-க்கு ஒரு cab.", "A cab from Anna Nagar to the airport at five in the morning."]
    - [after, "Check-in-உம் பண்ணிடுங்க, மூணு பேருக்கும்.", "Do the check-in too, for all three."]
    - [after, "Flight time, seats எல்லாம் ஒரு தடவை சொல்லுங்க.", "Tell me the flight time and seats once."]
    - [after, "SMS அனுப்புங்க.", "Send an SMS."]
    - [after, "நன்றி.", "Thanks."]
  key:
    - "Confirms the rain cancellation and the three choices"
    - "Rebooks only Arun, Deepa and Kavin on YA 524, Wednesday 7 October 7:05 am"
    - "Turns Meena and Gopal into credits TC 30551 and TC 30552, ₹5,980 each, valid until 6 October 2027; no refund, no rebooking"
    - "Seats Kavin 11A and Arun 11B; when 11C fails, says so and gives Deepa 12C"
    - "Adds breakfast, books RC 4471 at 5:00 am, checks all three in"
  checks: {lang: ta, digits: ["YA 524", "TC 30551", "TC 30552", "5,980", "12C"], tool_order: [get_flight_status, rebook_disrupted]}
  guard: "The caller chooses per booking himself; the seat fallback comes with the seat request; the rain is under every line."

- id: trv-123
  g: TRV-2
  lang: en
  diff: Medium
  dir: in
  title: "Family bumped from an overbooked flight — rebook, compensation, food, bags, seats, car"
  basis: "Denied boarding on overbooked flights: rebooking, compensation and care for every passenger."
  caller: "M 46-60 · father at the airport, frustrated but civil"
  goal: "Get all four on the next flight, compensation, food, find the bags, seats together, and a car at Bagdogra."
  role: "You handle disruptions. Passengers denied boarding on an overbooked flight are rebooked free."
  context: "Cabs are booked for the customer to pay."
  tasks:
    - task: "Find the booking and the flight"
      calls:
        - "get_booking(pnr=YT4B9G) → Debashish Roy, Moumita Roy, Rik Roy (child, 13), Tia Roy (child, 9); YA 655 Kolkata-Bagdogra Mon 5 Oct 7:45 am; bags 330451, 330452, 330453"
        - "get_flight_status(flight_no=YA 655, date=Mon 5 Oct) → departed 7:45 am; 4 passengers denied boarding (overbooked)"
    - task: "Rebook all four"
      calls:
        - "search_flights(from=CCU, to=IXB, date=Mon 5 Oct) → YA 657 4:50 pm, lands 6:05 pm, 7 seats"
        - "rebook_disrupted(pnr=YT4B9G, passenger=Debashish Roy, new_flight=YA 657 Mon 5 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT4B9G, passenger=Moumita Roy, new_flight=YA 657 Mon 5 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT4B9G, passenger=Rik Roy, new_flight=YA 657 Mon 5 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT4B9G, passenger=Tia Roy, new_flight=YA 657 Mon 5 Oct) → rebooked, ₹0"
    - task: "Where the bags are"
      calls:
        - "get_baggage_status(tag=330451) → flew on YA 655; held at Bagdogra arrivals for collection"
        - "get_baggage_status(tag=330452) → flew on YA 655; held at Bagdogra arrivals for collection"
        - "get_baggage_status(tag=330453) → flew on YA 655; held at Bagdogra arrivals for collection"
    - task: "Denied-boarding compensation for all four"
      calls:
        - "file_compensation_claim(pnr=YT4B9G, passenger=Debashish Roy, reason=denied boarding) → claim CC 3301; eligible ₹10,000, paid in 7-10 working days"
        - "file_compensation_claim(pnr=YT4B9G, passenger=Moumita Roy, reason=denied boarding) → claim CC 3302; eligible ₹10,000, paid in 7-10 working days"
        - "file_compensation_claim(pnr=YT4B9G, passenger=Rik Roy, reason=denied boarding) → claim CC 3303; eligible ₹10,000, paid in 7-10 working days"
        - "file_compensation_claim(pnr=YT4B9G, passenger=Tia Roy, reason=denied boarding) → claim CC 3304; eligible ₹10,000, paid in 7-10 working days"
    - task: "Meal vouchers for all four"
      calls:
        - "issue_meal_voucher(pnr=YT4B9G, passenger=Debashish Roy) → voucher MV 9121, ₹500"
        - "issue_meal_voucher(pnr=YT4B9G, passenger=Moumita Roy) → voucher MV 9122, ₹500"
        - "issue_meal_voucher(pnr=YT4B9G, passenger=Rik Roy) → voucher MV 9123, ₹500"
        - "issue_meal_voucher(pnr=YT4B9G, passenger=Tia Roy) → voucher MV 9124, ₹500"
    - task: "Seats together"
      calls:
        - "get_seat_map(flight_no=YA 657, date=Mon 5 Oct) → 17A-17D free; 17A window, 17C and 17D aisle"
        - "assign_seat(pnr=YT4B9G, passenger=Tia Roy, flight_no=YA 657, seat=17A) → assigned, ₹0"
        - "assign_seat(pnr=YT4B9G, passenger=Rik Roy, flight_no=YA 657, seat=17B) → assigned, ₹0"
        - "assign_seat(pnr=YT4B9G, passenger=Moumita Roy, flight_no=YA 657, seat=17C) → assigned, ₹0"
        - "assign_seat(pnr=YT4B9G, passenger=Debashish Roy, flight_no=YA 657, seat=17D) → assigned, ₹0"
    - task: "Car at Bagdogra, then the summary"
      calls:
        - "book_cab(pickup=Bagdogra airport, drop=Darjeeling Mall Road, date=Mon 5 Oct, time=7:00 pm, car_type=SUV) → ride RC 8812, about ₹3,400"
        - "send_sms(template=disruption_summary) → sent"
  forbid: [cancel_booking, "rebook_disrupted(pnr=YT4B9G, passenger=Tia Roy, new_flight=YA 655 Mon 5 Oct)"]
  lines:
    - [open, "Hi, I'm at Kolkata airport. They didn't let my family board the Bagdogra flight, they said it's overbooked. P N R Y T four B nine G."]
    - [after, "There are four of us, two kids. When's the next flight?"]
    - [after, "Put all four on the four-fifty."]
    - [after, "Our bags already went on the earlier flight. Tags three three zero four five one, four five two and four five three. Where are they now?"]
    - [after, "We were bumped through no fault of ours. Is there compensation?"]
    - [after, "Then file it for all four."]
    - [after, "We've been here since six. Can we get something to eat? All four of us."]
    - [after, "Seats on the four-fifty, together. Tia at the window, Rik next to her, then my wife, me on the aisle."]
    - [after, "And our car to Darjeeling was booked for two o'clock. Can you get us a cab from Bagdogra when we land? A big one, with our bags."]
    - [after, "Seven o'clock pickup is fine, to Mall Road."]
    - [after, "Send all of it to my number."]
    - [after, "Thank you."]
  key:
    - "Confirms they were denied boarding on an overbooked YA 655; no blame on the family"
    - "Rebooks all four free on YA 657, 4:50 pm, landing 6:05 pm"
    - "Says the three bags are held at Bagdogra arrivals"
    - "Files CC 3301 to CC 3304, ₹10,000 each, paid in 7-10 working days, as the tool states"
    - "Issues meal vouchers MV 9121 to MV 9124"
    - "Seats Tia 17A, Rik 17B, Moumita 17C, Debashish 17D"
    - "Books RC 8812 at 7:00 pm to Darjeeling Mall Road; says the fare is about ₹3,400 and is the family's"
  checks: {digits: ["YA 657", "RC 8812", "10,000"], say: [["10,000", "ten thousand"], ["6:05", "six oh five", "five past six"]], tool_order: [get_flight_status, rebook_disrupted]}
  guard: "The caller asks for each item himself; L10 gives the pickup time and place whether or not the agent asked."

- id: trv-124
  g: TRV-2
  lang: hg
  diff: Hard
  dir: in
  title: "Honeymoon couple misses the only Port Blair flight — overnight, bags, seats, claims, return moved"
