        - "change_flight(pnr=YT2N7H, passenger=Aditya Khanna, new_flight=YA 594 Sun 11 Oct) → changed, ₹0"
        - "change_flight(pnr=YT2N7H, passenger=Ishita Khanna, new_flight=YA 594 Sun 11 Oct) → changed, ₹0"
