    - "Moves both returns to Sunday 11 October: YA 594 1:30 pm and YA 129 6:45 pm, at no cost"
    - "Books RC 6103 at 12:45 pm to Coral Cove resort; checks both in"
  checks: {lang: hg, keep_talking: L5, digits: ["HV 5521", "RC 6102", "RC 6103", "9F", "CC 4472"], say: [["4,000", "chaar hazaar", "four thousand"]], tool_order: [get_flight_status, rebook_disrupted]}
  guard: "The acknowledgement lands during the hotel reply whatever it says; every later request names what it is for and the seat fallback comes with the seat request."
