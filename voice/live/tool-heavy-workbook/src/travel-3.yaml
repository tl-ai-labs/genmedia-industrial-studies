# Travel — tool-heavy scenarios trv-117 … trv-124 (TRV-2 Disruptions & baggage).
code: trv
scenarios:

- id: trv-117
  g: TRV-2
  lang: en
  diff: Hard
  dir: in
  title: "Diverted overnight — six people, two bookings: one family moves, friends wait for the plane"
  basis: "Diversions strand mixed groups; each booking chooses differently, and every service is per person."
  caller: "M 46-60 · father travelling with his family and friends, tired"
  goal: "Move only his family to the first flight tomorrow, keep the friends on the continuing plane, and sort hotel, food, cabs, seats, bags and check-in."
  role: "You handle disruptions. Rebooking after a diversion is free."
  context: "When a diverted flight continues the next day, Yatri Air gives a hotel (one room per two passengers), meal vouchers and cabs. Weather diversions carry no compensation."
  tasks:
    - task: "Find both bookings and the diversion"
      calls:
        - "get_booking(pnr=YT2H6M) → Ravi Shankar, Meena Shankar, Nikita Shankar (child, 15), Varun Shankar (child, 12); YA 350 Mumbai-Hyderabad Mon 5 Oct; bags 552301, 552302, 552303"
        - "get_booking(pnr=YT2H6N) → Joseph D'Souza, Anita D'Souza; YA 350 Mumbai-Hyderabad Mon 5 Oct"
        - "get_flight_status(flight_no=YA 350, date=Mon 5 Oct) → diverted to Nagpur (weather at Hyderabad); continues Tue 6 Oct 9:00 am"
    - task: "Move only the family to the first flight"
      calls:
        - "search_flights(from=NAG, to=HYD, date=Tue 6 Oct) → YA 352 7:15 am, 9 seats; nothing tonight"
        - "rebook_disrupted(pnr=YT2H6M, passenger=Ravi Shankar, new_flight=YA 352 Tue 6 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT2H6M, passenger=Meena Shankar, new_flight=YA 352 Tue 6 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT2H6M, passenger=Nikita Shankar, new_flight=YA 352 Tue 6 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT2H6M, passenger=Varun Shankar, new_flight=YA 352 Tue 6 Oct) → rebooked, ₹0"
    - task: "Hotel rooms for six"
      calls:
        - "issue_hotel_voucher(pnr=YT2H6M, room_for=Ravi Shankar and Meena Shankar) → Hotel Orange City Residency, Wardha Road, voucher HV 7701"
        - "issue_hotel_voucher(pnr=YT2H6M, room_for=Nikita Shankar and Varun Shankar) → Hotel Orange City Residency, connecting room, voucher HV 7702"
        - "issue_hotel_voucher(pnr=YT2H6N, room_for=Joseph D'Souza and Anita D'Souza) → Hotel Orange City Residency, voucher HV 7703"
    - task: "Meal vouchers for six"
      calls:
        - "issue_meal_voucher(pnr=YT2H6M, passenger=Ravi Shankar) → voucher MV 4401, ₹600"
        - "issue_meal_voucher(pnr=YT2H6M, passenger=Meena Shankar) → voucher MV 4402, ₹600"
        - "issue_meal_voucher(pnr=YT2H6M, passenger=Nikita Shankar) → voucher MV 4403, ₹600"
        - "issue_meal_voucher(pnr=YT2H6M, passenger=Varun Shankar) → voucher MV 4404, ₹600"
        - "issue_meal_voucher(pnr=YT2H6N, passenger=Joseph D'Souza) → voucher MV 4405, ₹600"
        - "issue_meal_voucher(pnr=YT2H6N, passenger=Anita D'Souza) → voucher MV 4406, ₹600"
    - task: "Three cabs"
      calls:
        - "book_cab(pickup=Nagpur airport, drop=Hotel Orange City Residency, date=Mon 5 Oct, time=now, car_type=tempo traveller) → ride RC 9901, paid by Yatri Air"
        - "book_cab(pickup=Hotel Orange City Residency, drop=Nagpur airport, date=Tue 6 Oct, time=5:15 am, car_type=SUV) → ride RC 9902, paid by Yatri Air"
        - "book_cab(pickup=Hotel Orange City Residency, drop=Nagpur airport, date=Tue 6 Oct, time=7:00 am, car_type=sedan) → ride RC 9903, paid by Yatri Air"
    - task: "Family seats on the morning flight"
      calls:
        - "get_seat_map(flight_no=YA 352, date=Tue 6 Oct) → row 12 A-F free; 13A free; A is window"
        - "assign_seat(pnr=YT2H6M, passenger=Nikita Shankar, flight_no=YA 352, seat=12A) → error: 12A was taken a moment ago; 13A (window, row behind) is free"
        - "assign_seat(pnr=YT2H6M, passenger=Nikita Shankar, flight_no=YA 352, seat=13A) → assigned, ₹0"
        - "assign_seat(pnr=YT2H6M, passenger=Varun Shankar, flight_no=YA 352, seat=12B) → assigned, ₹0"
        - "assign_seat(pnr=YT2H6M, passenger=Meena Shankar, flight_no=YA 352, seat=12C) → assigned, ₹0"
        - "assign_seat(pnr=YT2H6M, passenger=Ravi Shankar, flight_no=YA 352, seat=12D) → assigned, ₹0"
    - task: "The family's bags"
      calls:
        - "get_baggage_status(tag=552301) → in the YA 350 hold at Nagpur; will be moved to YA 352"
        - "get_baggage_status(tag=552302) → in the YA 350 hold at Nagpur; will be moved to YA 352"
        - "get_baggage_status(tag=552303) → in the YA 350 hold at Nagpur; will be moved to YA 352"
    - task: "Check the family in, then the summary"
      calls:
        - "web_check_in(pnr=YT2H6M, passenger=Ravi Shankar, flight_no=YA 352) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT2H6M, passenger=Meena Shankar, flight_no=YA 352) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT2H6M, passenger=Nikita Shankar, flight_no=YA 352) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT2H6M, passenger=Varun Shankar, flight_no=YA 352) → checked in, boarding pass sent by SMS"
        - "send_sms(template=disruption_summary) → sent for both bookings"
  forbid: ["rebook_disrupted(pnr=YT2H6N, passenger=Joseph D'Souza, new_flight=YA 352 Tue 6 Oct)", "rebook_disrupted(pnr=YT2H6N, passenger=Anita D'Souza, new_flight=YA 352 Tue 6 Oct)", file_compensation_claim]
  lines:
    - [open, "Hi, our flight to Hyderabad just landed in Nagpur instead. Six of us, two bookings: Y T two H six M and Y T two H six N."]
    - [after, "What's happening with this plane? Is it going on to Hyderabad tonight?"]
    - [after, "So what are the options for us?"]
    - [cut 1800 L3, "Sorry — not all of us. Only my family, the four on the first booking, needs to be in Hyderabad early. Our friends the D'Souzas will wait and go on this plane."]
    - [after, "Then put my family on the first flight tomorrow morning."]
    - [after, "Where do we stay tonight? There are six of us."]
    - [after, "And food, for all six. Nobody has eaten."]
    - [after, "A cab to the hotel now for all six, with bags. And tomorrow, one early for my family, and one for the D'Souzas in time for this plane."]
    - [after, "Seats for my family tomorrow: Nikita by the window, Varun next to her, then my wife, then me. If the window goes, give Nikita the window right behind."]
    - [after, "Our checked bags — tags five five two three zero one, three zero two and three zero three. Will they come with us on the new flight?"]
    - [after, "Check the four of us in for the morning flight too."]
    - [after, "Is there any compensation for this?"]
    - [after, "Fine. What time are the two cabs tomorrow?"]
    - [after, "Send everything to my number, for both bookings."]
    - [after, "Okay. Thank you."]
  key:
    - "Explains the diversion: YA 350 continues Tuesday 6 October at 9:00 am"
    - "After the cut-in: rebooks only the four on YT2H6M to YA 352, 7:15 am; leaves the D'Souzas on YA 350"
    - "Issues hotel vouchers HV 7701, HV 7702 and HV 7703 and meal vouchers MV 4401 to 4406"
    - "Books RC 9901 now, RC 9902 at 5:15 am and RC 9903 at 7:00 am"
    - "When 12A fails, says so and gives Nikita 13A; Varun 12B, Meena 12C, Ravi 12D"
    - "Says the three bags move to YA 352; checks the family in"
    - "Says weather diversions carry no compensation; files no claim"
  checks: {digits: ["YA 352", "HV 7703", "RC 9902", "RC 9903", "13A"], say: [["5:15", "five fifteen"], ["7:00", "seven"]], tool_order: [get_flight_status, rebook_disrupted]}
  guard: "L4 cuts in while the agent explains options, so it lands whatever the options were; the caller then names who moves and who waits; the seat fallback comes with the request."

- id: trv-118
  g: TRV-2
  lang: hg
  diff: Medium
  dir: out
  title: "Schedule change call-back — split five friends across two flights, move all returns"
  basis: "Airlines call to announce retimed flights; groups split, accept or move, and seats and meals must be redone."
  caller: "M 18-25 · college student organising a friends' trip, easy-going"
  goal: "Put two friends on the early flight, keep three on the retimed one, move all five returns earlier, redo seats and meals, book two cabs."
  role: "You are calling the customer because both flights on YT8S2Q are retimed. Open the call: greet, name Yatri Air, say why you are calling. After a schedule change, moving to another Yatri Air flight is free. Seats and meals were cleared by the change."
  context: "Cabs are booked for the customer to pay."
  tasks:
    - task: "Check the booking and the new times"
      calls:
        - "get_booking(pnr=YT8S2Q) → Ishaan Malhotra, Tara Menon, Kabir Sinha, Riya Desai, Dev Arora; YA 742 Bengaluru-Jaipur Sat 17 Oct; YA 745 Jaipur-Bengaluru Tue 20 Oct"
        - "get_flight_status(flight_no=YA 742, date=Sat 17 Oct) → retimed from 10:00 am to 3:40 pm"
        - "get_flight_status(flight_no=YA 745, date=Tue 20 Oct) → retimed from 7:00 pm to 11:50 pm"
    - task: "Ishaan and Tara on the early flight"
      calls:
        - "search_flights(from=BLR, to=JAI, date=Sat 17 Oct) → YA 740 6:20 am, 5 seats; YA 742 3:40 pm"
        - "rebook_disrupted(pnr=YT8S2Q, passenger=Ishaan Malhotra, new_flight=YA 740 Sat 17 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT8S2Q, passenger=Tara Menon, new_flight=YA 740 Sat 17 Oct) → rebooked, ₹0"
    - task: "All five back earlier on Tuesday"
      calls:
        - "search_flights(from=JAI, to=BLR, date=Tue 20 Oct) → YA 743 4:10 pm, 9 seats; YA 745 11:50 pm"
        - "rebook_disrupted(pnr=YT8S2Q, passenger=Ishaan Malhotra, new_flight=YA 743 Tue 20 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT8S2Q, passenger=Tara Menon, new_flight=YA 743 Tue 20 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT8S2Q, passenger=Kabir Sinha, new_flight=YA 743 Tue 20 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT8S2Q, passenger=Riya Desai, new_flight=YA 743 Tue 20 Oct) → rebooked, ₹0"
        - "rebook_disrupted(pnr=YT8S2Q, passenger=Dev Arora, new_flight=YA 743 Tue 20 Oct) → rebooked, ₹0"
    - task: "Seats again on both outbound flights"
      calls:
        - "get_seat_map(flight_no=YA 740, date=Sat 17 Oct) → 4A-4B free; 4A window"
        - "assign_seat(pnr=YT8S2Q, passenger=Tara Menon, flight_no=YA 740, seat=4A) → assigned, ₹0"
        - "assign_seat(pnr=YT8S2Q, passenger=Ishaan Malhotra, flight_no=YA 740, seat=4B) → assigned, ₹0"
        - "get_seat_map(flight_no=YA 742, date=Sat 17 Oct) → 15D-15F free; 15D aisle"
        - "assign_seat(pnr=YT8S2Q, passenger=Kabir Sinha, flight_no=YA 742, seat=15D) → assigned, ₹0"
        - "assign_seat(pnr=YT8S2Q, passenger=Riya Desai, flight_no=YA 742, seat=15E) → assigned, ₹0"
        - "assign_seat(pnr=YT8S2Q, passenger=Dev Arora, flight_no=YA 742, seat=15F) → assigned, ₹0"
    - task: "Meals again"
      calls:
        - "add_meal(pnr=YT8S2Q, passenger=Ishaan Malhotra, flight_no=YA 740, meal=breakfast) → added, ₹0"
        - "add_meal(pnr=YT8S2Q, passenger=Tara Menon, flight_no=YA 740, meal=breakfast) → added, ₹0"
        - "add_meal(pnr=YT8S2Q, passenger=Kabir Sinha, flight_no=YA 742, meal=lunch) → added, ₹0"
        - "add_meal(pnr=YT8S2Q, passenger=Riya Desai, flight_no=YA 742, meal=lunch) → added, ₹0"
        - "add_meal(pnr=YT8S2Q, passenger=Dev Arora, flight_no=YA 742, meal=lunch) → added, ₹0"
    - task: "Two cabs to the airport"
      calls:
        - "book_cab(pickup=Koramangala, drop=Bengaluru airport, date=Sat 17 Oct, time=4:00 am, car_type=sedan) → ride RC 2241, about ₹1,150"
        - "book_cab(pickup=Koramangala, drop=Bengaluru airport, date=Sat 17 Oct, time=12:45 pm, car_type=SUV) → ride RC 2242, about ₹1,600"
    - task: "Send the new plan"
      calls:
        - "send_sms(template=schedule_change_summary) → sent"
  forbid: [cancel_booking, "rebook_disrupted(pnr=YT8S2Q, passenger=Kabir Sinha, new_flight=YA 740 Sat 17 Oct)"]
  lines:
    - [open, "Hello?", "Hello?"]
    - [after, "Haan, boliye. Kya badla hai?", "Yes, go on. What has changed?"]
    - [after, "Teen-chaalis? Hum do log, main aur Tara, subah jaldi pahunchna chahte hain, family function hai. Subah wali koi flight hai?", "Three-forty? Two of us, me and Tara, want to reach early in the morning, there's a family function. Is there a morning flight?"]
    - [after, "Chhe-bees wali mein hum dono ko daal do. Baaki teen — Kabir, Riya, Dev — teen-chaalis wali theek hai.", "Put the two of us on the six-twenty. The other three — Kabir, Riya, Dev — are fine on the three-forty."]
    - [after, "Aur wapsi wali bhi badli hai na? Gyarah-pachaas bahut late hai. Tuesday ko usse pehle kuch hai?", "And the return has changed too? Eleven-fifty is very late. Is there anything earlier on Tuesday?"]
    - [after, "Chaar-das wali mein paanchon ko daal do.", "Put all five on the four-ten."]
    - [after, "Seats phir se lagani padengi? Subah wali mein Tara window, main bagal mein. Dopahar wali mein teeno ek saath — Kabir aisle pe, Riya beech mein, Dev window.", "Do the seats need doing again? On the morning flight, Tara at the window, me next to her. On the afternoon one, all three together — Kabir on the aisle, Riya in the middle, Dev at the window."]
    - [after, "Subah wali mein hum dono ka breakfast, aur dopahar wali mein teeno ka lunch.", "Breakfast for the two of us on the morning flight, and lunch for the three on the afternoon one."]
    - [after, "Kisi cheez ke paise lagenge?", "Will anything cost money?"]
    - [after, "Cab bhi book kar do. Subah chaar baje Koramangala se airport, hum dono ke liye. Aur dopahar paune ek baje ek badi gaadi, teeno ke liye, wahi se.", "Book cabs too. At four in the morning from Koramangala to the airport, for the two of us. And at a quarter to one in the afternoon a big car for the three, from the same place."]
    - [after, "Sab kuch ek baar repeat kar do.", "Repeat everything once."]
    - [after, "Sab SMS kar do, main group mein daal deta hoon.", "SMS everything, I'll put it in the group."]
    - [after, "Theek hai, thanks for calling.", "Okay, thanks for calling."]
  key:
    - "Opens by naming Yatri Air and both retimings (3:40 pm out, 11:50 pm back)"
    - "Moves only Ishaan and Tara to YA 740, 6:20 am; Kabir, Riya and Dev stay on YA 742"
    - "Moves all five returns to YA 743, 4:10 pm"
    - "YA 740: Tara 4A, Ishaan 4B. YA 742: Kabir 15D, Riya 15E, Dev 15F"
    - "Adds breakfast for two on YA 740 and lunch for three on YA 742; says the changes cost nothing"
    - "Books RC 2241 at 4:00 am and RC 2242 at 12:45 pm; says the cab fares are the customer's"
  checks: {lang: hg, digits: ["YA 740", "YA 743", "RC 2241", "RC 2242"], say: [["6:20", "chhe bees", "six twenty"], ["4:10", "chaar das", "four ten"]], tool_order: [get_flight_status, rebook_disrupted]}
  guard: "Every line reacts to the retiming news, which the agent must give; the caller names who goes when and what seat."

- id: trv-119
  g: TRV-2
  lang: te
  script: te-mix
  diff: Hard
  dir: in
  title: "Bags delayed before an onward trip — hotel delivery, forward one bag, stroller claim, onward seats and check-in"
  basis: "Delayed bags clash with the next leg of a trip: some go to the hotel tonight, one follows the family."
  caller: "F 26-45 · mother of two, tired, organised"
  goal: "Claims for three delayed bags, two delivered to the hotel tonight, one forwarded to Tirupati, a stroller damage claim, seats and check-in for tomorrow's flight."
  role: "You handle baggage and bookings. One claim per bag."
  context: "Damaged-item claims for strollers are assessed from photos within 7 working days."
  tasks:
    - task: "Find both bookings"
      calls:
        - "get_booking(pnr=YT5R1D) → Sravani Reddy, Mahesh Reddy, Charan Reddy (child, 9), Sahasra Reddy (child, 4); YA 288 Delhi-Hyderabad Sun 4 Oct; bags 609111, 609112, 609113; stroller 609114"
        - "get_booking(pnr=YT5R2E) → same four; YA 471 Hyderabad-Tirupati Tue 6 Oct 9:40 am"
    - task: "Trace the three bags"
      calls:
        - "get_baggage_status(tag=609111) → at Delhi, arrives Hyderabad on YA 290 tonight 8:30 pm"
        - "get_baggage_status(tag=609112) → at Delhi, arrives Hyderabad on YA 290 tonight 8:30 pm"
        - "get_baggage_status(tag=609113) → at Delhi, arrives Hyderabad on YA 292 Tue 6 Oct 11:00 am"
    - task: "One claim per bag"
      calls:
        - "raise_baggage_claim(pnr=YT5R1D, passenger=Sravani Reddy, tag=609111, description=delayed) → claim BC 62111"
        - "raise_baggage_claim(pnr=YT5R1D, passenger=Mahesh Reddy, tag=609112, description=delayed) → claim BC 62112"
        - "raise_baggage_claim(pnr=YT5R1D, passenger=Mahesh Reddy, tag=609113, description=delayed) → claim BC 62113"
    - task: "Two bags to the hotel tonight, one to Tirupati"
      calls:
        - "arrange_bag_delivery(claim_id=BC 62111, address=Hotel Banjara Residency Road No 1 Banjara Hills, slot=Mon 5 Oct 9-11 pm) → error: 9-11 pm slot full; 11 pm-1 am free"
        - "arrange_bag_delivery(claim_id=BC 62111, address=Hotel Banjara Residency Road No 1 Banjara Hills, slot=Mon 5 Oct 11 pm-1 am) → delivery booked"
        - "arrange_bag_delivery(claim_id=BC 62112, address=Hotel Banjara Residency Road No 1 Banjara Hills, slot=Mon 5 Oct 11 pm-1 am) → delivery booked"
        - "arrange_bag_delivery(claim_id=BC 62113, address=Hotel Govinda Nilayam Tirupati, slot=Tue 6 Oct 6-9 pm) → delivery booked"
    - task: "Stroller damage claim"
      calls:
        - "raise_damage_claim(pnr=YT5R1D, passenger=Sravani Reddy, tag=609114, damage=stroller frame broken) → claim DC 4410, assessed from photos within 7 working days"
    - task: "Seats and check-in for tomorrow"
      calls:
        - "get_seat_map(flight_no=YA 471, date=Tue 6 Oct) → row 6 A-F free; 6A window, 6C and 6D aisle"
        - "assign_seat(pnr=YT5R2E, passenger=Charan Reddy, flight_no=YA 471, seat=6A) → assigned, ₹0"
        - "assign_seat(pnr=YT5R2E, passenger=Sahasra Reddy, flight_no=YA 471, seat=6B) → assigned, ₹0"
        - "assign_seat(pnr=YT5R2E, passenger=Sravani Reddy, flight_no=YA 471, seat=6C) → assigned, ₹0"
        - "assign_seat(pnr=YT5R2E, passenger=Mahesh Reddy, flight_no=YA 471, seat=6D) → assigned, ₹0"
        - "web_check_in(pnr=YT5R2E, passenger=Sravani Reddy, flight_no=YA 471) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT5R2E, passenger=Mahesh Reddy, flight_no=YA 471) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT5R2E, passenger=Charan Reddy, flight_no=YA 471) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT5R2E, passenger=Sahasra Reddy, flight_no=YA 471) → checked in, boarding pass sent by SMS"
    - task: "Send everything"
      calls:
        - "send_sms(template=baggage_claims_summary) → sent"
  forbid: ["arrange_bag_delivery(claim_id=BC 62113, address=Hotel Banjara Residency Road No 1 Banjara Hills)", cancel_booking]
  lines:
    - [open, "హలో, నిన్న Delhi నుంచి Hyderabad వచ్చాం, మా bags రాలేదు. PNR Y T five R one D.", "Hello, we came from Delhi to Hyderabad yesterday and our bags didn't come. PNR YT5R1D."]
    - [after, "మూడు bags రాలేదు. Tags six zero nine one one one, one one two, one one three. ఇంకా stroller వచ్చింది కానీ విరిగిపోయింది, దాని tag six zero nine one one four.", "Three bags didn't come. Tags 609111, 609112, 609113. And the stroller came, but it's broken, its tag is 609114."]
    - [after, "అవి ఎక్కడ ఉన్నాయి? ఎప్పుడు వస్తాయి?", "Where are they? When will they come?"]
    - [after, "మూడింటికీ complaint రాయండి.", "Register complaints for all three."]
    - [after, "రేపు ఉదయం మేం Tirupati వెళ్తున్నాం, వేరే booking — Y T five R two E. ఈ రోజు వచ్చేవి hotel కి పంపండి: Hotel Banjara Residency, Road number one, Banjara Hills. పదకొండు లోపు కుదరకపోతే పదకొండు తర్వాత అయినా పర్లేదు, మేం మేలుకునే ఉంటాం.", "Tomorrow morning we're going to Tirupati, a different booking — YT5R2E. Send the ones coming today to the hotel: Hotel Banjara Residency, Road No. 1, Banjara Hills. If it can't be before eleven, after eleven is fine too, we'll be awake."]
