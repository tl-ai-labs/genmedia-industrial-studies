        - "assign_seat(pnr=YT2N7H, passenger=Ishita Khanna, flight_no=YA 591, seat=6A) → assigned, ₹0"
        - "assign_seat(pnr=YT2N7H, passenger=Aditya Khanna, flight_no=YA 591, seat=6B) → error: 6B was taken a moment ago; 9E-9F still free together"
        - "assign_seat(pnr=YT2N7H, passenger=Ishita Khanna, flight_no=YA 591, seat=9F) → assigned, ₹0; 6A released"
