        - "book_cab(pickup=Hotel Marina Bay Inn Egmore, drop=Chennai airport T1, date=Tue 6 Oct, time=7:15 am, car_type=sedan) → ride RC 6102, paid by Yatri Air"
    - task: "Where the bags are"
      calls:
