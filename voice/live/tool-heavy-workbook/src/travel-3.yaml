        - "web_check_in(pnr=YT2N7H, passenger=Aditya Khanna, flight_no=YA 591) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT2N7H, passenger=Ishita Khanna, flight_no=YA 591) → checked in, boarding pass sent by SMS"
        - "send_sms(template=disruption_summary) → sent"
  forbid: [cancel_booking, "convert_to_credit(pnr=YT2N7H, passenger=Aditya Khanna)"]
  lines:
    - [open, "Hi, hum Chennai airport pe hain. Delhi wali flight late thi, Port Blair wali chhoot gayi. PNR Y T two N seven H. Hum do log hain.", "Hi, we're at Chennai airport. The Delhi flight was late and we missed the Port Blair one. PNR YT2N7H. There are two of us."]
    - [after, "Aaj ka koi aur flight hai Port Blair ka?", "Is there another flight to Port Blair today?"]
    - [after, "Theek hai, kal subah wali hi kar do, dono ki.", "Okay, put both of us on tomorrow morning's then."]
    - [after, "Toh aaj raat kahan rukenge? Hamari honeymoon trip hai yaar.", "So where do we stay tonight? It's our honeymoon."]
    - [bc 2000 L4, "Haan haan.", "Yes, yes."]
    - [after, "Aur khana? Subah se kuch nahi khaya.", "And food? We haven't eaten since morning."]
    - [after, "Hotel tak cab, aur kal subah wapas airport ke liye bhi.", "A cab to the hotel, and one back to the airport tomorrow morning too."]
    - [after, "Hamare do bags hain, tags seven seven one zero zero one aur zero zero two. Woh kahan hain?", "We have two bags, tags 771001 and 771002. Where are they?"]
    - [after, "Kal ki flight mein window aur uske bagal wali seat, saath mein. Ishita window pe. Agar saath na mile toh kisi aur window wali jodi mein dono ko daal do.", "On tomorrow's flight, a window seat and the one next to it, together. Ishita at the window. If we can't get them together, put us both in another pair with a window."]
    - [after, "Dono ka lunch bhi laga do kal ki flight mein.", "Add lunch for both of us on tomorrow's flight too."]
    - [after, "Is delay ka koi compensation milega? File kar do dono ka.", "Is there any compensation for this delay? File it for both of us."]
    - [after, "Ek din kam ho gaya trip ka. Wapsi bhi ek din aage kar sakte ho? Port Blair se Chennai aur Chennai se Delhi, dono flights, Sunday ko, same time.", "We've lost a day of the trip. Can the return also move a day later? Port Blair-Chennai and Chennai-Delhi, both flights, on Sunday, same times."]
    - [after, "Port Blair pahunch ke resort ke liye cab chahiye. Coral Cove resort. Landing ke baad.", "We need a cab to the resort when we reach Port Blair. Coral Cove resort. After landing."]
    - [after, "Kal ka check-in bhi kar do dono ka. Aur sab SMS kar do.", "Do the check-in for tomorrow for both of us too. And SMS everything."]
    - [after, "Thank you, aapne din bacha liya.", "Thank you, you've saved the day."]
  key:
    - "Confirms the YA 117 delay caused the miss; YA 591 tomorrow 10:15 am is the only flight; rebooks both free"
    - "Keeps talking through 'haan haan'; issues hotel voucher HV 5521, meal vouchers MV 5531-5532 and cabs RC 6101 and RC 6102 (7:15 am)"
    - "Says both bags are held at Chennai and go on YA 591 tomorrow"
    - "When 6B fails, says so and moves the couple to 9F and 9E; Ishita at the window"
