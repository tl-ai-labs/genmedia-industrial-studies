  goal: "Tomorrow's Port Blair flight with hotel, food and cabs tonight; bags, seats, meals, compensation; return moved by a day; a cab to the resort; check-in."
  role: "You handle disruptions. A connection missed because of a Yatri Air delay is rebooked free, with a hotel, meal vouchers and airport cabs for an overnight wait. Because of this disruption, one free change to the return is allowed."
