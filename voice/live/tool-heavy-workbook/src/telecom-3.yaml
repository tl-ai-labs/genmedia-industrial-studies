# Telecom — tool-heavy scenarios tel-117 … tel-127 (TEL-3 Network, TEL-4 SIM & roaming, TEL-5 Small business).
code: tel
scenarios:

- id: tel-117
  g: TEL-3
  lang: ta
  script: ta-mix
  diff: Hard
  dir: in
  title: "After the storm — fibre down, two TV dishes off, mobile tower out: a complaint and visit per service, credits, Wi-Fi calling"
  basis: "Heavy rain knocks out several services at once; each needs its own complaint and fix, and an elderly patient needs a working phone."
  caller: "M 26-45 · son in Chennai caring for his father on home dialysis, worried"
  goal: "Get the fibre, both TV boxes and calls working again as fast as possible, with priority for his father, and credit for the days lost."
  role: "You handle faults. Check outages first. Raise one complaint per service and book a visit for each."
  context: "A medical-priority request moves a fibre visit ahead of the queue."
  noise: {bed: rain_window, snr_db: 10}
  tasks:
    - task: "What is down"
      calls:
        - "list_connections() → mobiles 98840 77101 (Senthil), 98840 77102 (Appa), 98840 77103 (Amma), 98840 77104 (Meena); Fiber FB-77100; TV boxes TV-7711 (hall), TV-7712 (Appa's room)"
        - "check_outage(pincode=600091) → mobile tower TN-0912 down (power), restore Wed 7 Oct; no fibre outage in the area"
        - "get_account(mobile=98840 77101) → served by TN-0912"
        - "get_account(mobile=98840 77102) → served by TN-0912"
        - "get_account(mobile=98840 77103) → served by TN-0912"
        - "get_account(mobile=98840 77104) → served by TN-0912"
        - "raise_complaint(type=no mobile signal, mobile_or_fibre=98840 77102, pincode=600091, details=medical priority, home dialysis; tower TN-0912) → complaint NC 77131; tower restore prioritised"
    - task: "Fibre"
      calls:
        - "run_line_test(fibre_id=FB-77100) → no signal on the line (LOS)"
        - "remote_reboot(fibre_id=FB-77100) → restarted; still LOS"
        - "get_complaint(complaint_id=CF 77050) → raised by the customer yesterday, no visit yet"
        - "raise_ticket(category=medical priority, summary=FB-77100 CF 77050; father on home dialysis needs a working line) → ticket MP 77110; fibre visit prioritised"
        - "schedule_technician(complaint_id=CF 77050, date=Mon 5 Oct, slot=2-5 pm) → error: slot full"
        - "schedule_technician(complaint_id=CF 77050, date=Tue 6 Oct, slot=8-11 am) → visit booked, first visit of the day"
    - task: "Both TV boxes"
      calls:
        - "get_dth(box_id=TV-7711) → no signal since Sun 4 Oct"
        - "get_dth(box_id=TV-7712) → no signal since Sun 4 Oct"
        - "raise_complaint(type=DTH no signal, mobile_or_fibre=TV-7711, pincode=600091, details=dish moved in the storm) → complaint TC 77121"
        - "raise_complaint(type=DTH no signal, mobile_or_fibre=TV-7712, pincode=600091, details=dish moved in the storm) → complaint TC 77122"
        - "schedule_technician(complaint_id=TC 77121, date=Wed 7 Oct, slot=10 am-1 pm) → visit booked"
        - "schedule_technician(complaint_id=TC 77122, date=Wed 7 Oct, slot=10 am-1 pm) → visit booked, same technician"
    - task: "Calls once the fibre is back"
      calls:
        - "enable_wifi_calling(mobile=98840 77101) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98840 77102) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98840 77103) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98840 77104) → Wi-Fi calling on"
        - "order_fibre_addon(fibre_id=FB-77100, addon=4G backup router) → added, ₹199 a month, delivered Tue 6 Oct with the visit"
    - task: "Credits, escalation, summary"
      calls:
        - "apply_service_credit(account_or_fibre=FB-77100, amount=₹200, reason=storm outage) → ₹200 credit on the next bill"
        - "apply_service_credit(account_or_fibre=TV-7711, amount=₹100, reason=no signal 3 days) → ₹100 credit"
        - "apply_service_credit(account_or_fibre=TV-7712, amount=₹100, reason=no signal 3 days) → ₹100 credit"
        - "schedule_callback(date=Tue 6 Oct, slot=12-1 pm, topic=fibre restored, MP 77110) → booked"
        - "schedule_callback(date=Wed 7 Oct, slot=12-1 pm, topic=tower TN-0912 restored, NC 77131) → booked"
        - "send_sms(template=storm_faults_summary) → sent"
  forbid: ["schedule_technician(complaint_id=TC 77121, date=Mon 5 Oct)", "shift_connection"]
  lines:
    - [open, "வணக்கம். நேத்து ராத்திரி மழையில எல்லாமே போச்சு — fibre இல்ல, ரெண்டு TV யும் வரலை, phone ல signal யே இல்ல.", "Hello. Everything went in last night's rain — no fibre, neither TV works, and no signal on the phones."]
    - [after, "அப்பா வீட்டுல dialysis பண்றார். Doctor கூட பேசணும்னா phone அவசியம். ப்ளீஸ், அவசரம்.", "My father does dialysis at home. The phone is essential to talk to the doctor. Please, it's urgent."]
    - [after, "Area ல ஏதாவது பிரச்சனையா? நாலு phone லயும் signal இல்ல. அப்பா number க்கு priority போடுங்க.", "Is there a problem in the area? None of the four phones has signal. Put priority on Appa's number."]
    - [after, "Fibre ஐ ஒரு தடவை restart பண்ணி பாருங்க.", "Try restarting the fibre once."]
    - [after, "நேத்தே complaint போட்டேன், யாரும் வரலை. இன்னைக்கு மதியம் யாராவது வரணும். இல்லன்னா நாளைக்கு காலைல முதல் visit.", "I complained yesterday too, nobody came. Someone must come this afternoon. If not, the first visit tomorrow morning."]
    - [after, "ரெண்டு TV dish உம் காத்துல திரும்பிடுச்சு போல. ரெண்டுக்கும் complaint போட்டு ஒரே நாள்ல ஆள் அனுப்புங்க.", "Both TV dishes seem to have turned in the wind. File complaints for both and send someone on one day."]
    - [after, "Fibre வந்தா phone call அதுல போகுமா? நாலு phone க்கும் அதை on பண்ணுங்க.", "When the fibre's back, can calls go over it? Turn that on for all four phones."]
    - [after, "அடுத்த தடவை fibre போனா கூட backup ஏதாவது இருக்கா?", "Is there some backup for the next time the fibre goes?"]
    - [after, "அதையும் போடுங்க. மூணு நாள் service இல்லாததுக்கு எதாவது?", "Add that too. Anything for three days without service?"]
    - [after, "நாளைக்கு மதியம் fibre வந்துச்சான்னு call பண்ணுங்க. Tower சரியானதும் இன்னொரு call.", "Call tomorrow afternoon to check the fibre's back. And another call once the tower is fixed."]
    - [after, "SMS அனுப்புங்க. ரொம்ப நன்றி.", "Send an SMS. Thank you very much."]
    - [after, "சரி.", "Okay."]
  key:
    - "Checks the outage: tower TN-0912 down until 7 Oct; no fibre outage; all four phones on that tower; raises priority complaint NC 77131 for Appa's number"
    - "Tests and reboots the fibre, finds yesterday's CF 77050 without a visit, raises medical priority MP 77110"
    - "When this afternoon is full, says so and books the first visit Tue 6 Oct, 8-11 am"
    - "Raises one complaint per TV box (TC 77121, TC 77122) with one technician on Wed 7 Oct"
    - "Turns on Wi-Fi calling on all four phones and adds the 4G backup router"
    - "Credits ₹200 on the fibre and ₹100 on each box; books the call-back; speaks Tamil, keeping his English words"
  checks: {lang: ta, digits: ["MP 77110", "TC 77122", "Tue 6 Oct"], tool_order: [check_outage, run_line_test]}
  guard: "The visit fallback comes with the request; L6 asks for both boxes on one day; L9 asks for credit whatever the agent offered."

- id: tel-118
  g: TEL-3
  lang: en
  diff: Medium
  dir: out
  title: "Technician follow-up — fibre better but slow upstairs, TV remote dead, calls drop: each fixed on the call"
  basis: "Operators call after a repair visit; customers raise everything still wrong, one connection at a time."
  caller: "F 46-60 · homemaker in Pune, chatty, has a list ready"
  goal: "Confirm the repair and get the remaining problems fixed: weak Wi-Fi upstairs, a TV box issue, call drops, and a bill question."
  role: "You are calling from Tarang to follow up on fibre complaint CF 88010, repaired on Sat 3 Oct. Open the call: greet, name Tarang, say why you are calling."
  context: "Fiber FB-88000; TV box TV-8801; mobiles 98500 88001 (Lata), 98500 88002 (Vinod), 98500 88003 (Rohan)."
  tasks:
    - task: "The repair"
      calls:
        - "get_complaint(complaint_id=CF 88010) → fibre cut repaired Sat 3 Oct; closed"
        - "check_outage(pincode=411038) → no outage"
        - "run_line_test(fibre_id=FB-88000) → line up, 100 Mbps at the router; drops to 8 Mbps upstairs"
        - "remote_reboot(fibre_id=FB-88000) → restarted"
        - "run_line_test(fibre_id=FB-88000) → 100 Mbps at the router; upstairs still weak"
    - task: "Upstairs Wi-Fi"
      calls:
        - "order_fibre_addon(fibre_id=FB-88000, addon=mesh extender upstairs) → ₹99 a month, install Thu 8 Oct"
        - "order_fibre_addon(fibre_id=FB-88000, addon=mesh extender terrace room) → ₹99 a month, install Thu 8 Oct"
        - "change_fibre_plan(fibre_id=FB-88000, plan_id=Fiber 200) → from Tue 6 Oct, ₹849"
    - task: "The TV box"
      calls:
        - "get_dth(box_id=TV-8801) → Marathi Value ₹329; box working"
        - "raise_complaint(type=DTH remote not working, mobile_or_fibre=TV-8801, pincode=411038, details=remote dead after new batteries) → complaint TC 88021; replacement remote by courier Wed 7 Oct"
        - "add_channel(box_id=TV-8801, channel=Colors Marathi HD) → added, ₹22 a month"
    - task: "Calls drop"
      calls:
        - "enable_wifi_calling(mobile=98500 88001) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98500 88002) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98500 88003) → Wi-Fi calling on"
    - task: "The bill"
      calls:
        - "get_bill(account=FB-88000, month=September) → ₹1,180 including ₹250 for the visit"
        - "apply_service_credit(account_or_fibre=FB-88000, amount=₹250, reason=visit charged for a cable fault) → ₹250 credit on the next bill"
        - "send_payment_link(account=FB-88000, amount=₹930) → link sent by SMS"
        - "set_autopay(account=FB-88000, method=saved UPI) → autopay on"
    - task: "Follow-up and summary"
      calls:
        - "schedule_callback(date=Thu 8 Oct, slot=6-7 pm, topic=upstairs Wi-Fi after mesh install) → booked"
        - "send_sms(template=follow_up_summary) → sent"
  forbid: ["change_fibre_plan(fibre_id=FB-88000, plan_id=Fiber 500)"]
  lines:
    - [open, "Hello?"]
    - [after, "Oh yes, the technician came on Saturday. It works downstairs, but upstairs it's very slow."]
    - [after, "Can you check it from there? Restart if you need to."]
    - [after, "Still slow upstairs? We have a room on the terrace too, where my son studies."]
    - [after, "Put one on each, then. And is our plan enough? Something a bit faster, not too expensive."]
    - [after, "Fine. Another thing — the TV remote died. New batteries, nothing."]
    - [after, "And add Colors Marathi HD while you're at it."]
    - [after, "Our calls also cut inside the house, all three phones."]
    - [after, "One more — the bill charged us for the technician. It was your cable that was cut!"]
    - [after, "So what do I pay now? Send me the link, and set autopay on my UPI."]
    - [after, "Call me on Thursday after the extenders are in."]
    - [after, "Send me everything on SMS. Thanks for calling back, that's nice."]
  key:
    - "Opens naming Tarang and complaint CF 88010; confirms the repair"
    - "Tests, reboots and tests again; orders two mesh extenders (upstairs, terrace) for Thu 8 Oct and moves to Fiber 200 (₹849), not 500"
    - "Raises TC 88021 for the remote (replacement Wed 7 Oct) and adds Colors Marathi HD"
    - "Turns on Wi-Fi calling for all three phones"
    - "Credits the ₹250 visit charge, sends a ₹930 link and sets UPI autopay"
  checks: {digits: ["TC 88021", "930"], tool_order: [run_line_test, order_fibre_addon]}
  guard: "Each line raises one problem, true whatever the agent said before; L5 asks for a modest upgrade; L10 asks for the amount after the credit the agent must give."

- id: tel-119
  g: TEL-4
  lang: en
  diff: Hard
  dir: in
  title: "Family of five to Europe — a roaming pack per traveller with their own dates, one number barred, Swiss add-on, kids capped"
  basis: "Family trips abroad need a pack per traveller with their own dates; barred numbers and extra countries trip people up."
  caller: "M 46-60 · doctor in Mumbai planning a three-week Europe trip, precise"
  goal: "Have every family member covered from the day they land, with the right pack, limits on the children's lines and Wi-Fi calling as backup."
  role: "You handle roaming. Give each pack's price and dates before activating."
  context: "The EU pack covers France, Italy and Germany but not Switzerland."
  tasks:
    - task: "Travellers and packs"
      calls:
        - "list_connections() → postpaid family TF-30330: Rahul 98200 33301, Nisha 98200 33302, Ira 98200 33303, Kabir 98200 33304, Nana 98200 33305"
        - "get_roaming_packs(country=Europe) → EU21 ₹4,999 21 days 15 GB 300 min; EU14 ₹3,499 14 days 10 GB 200 min"
        - "get_roaming_packs(country=Switzerland) → CH3 ₹999 3 days 3 GB 60 min"
        - "get_account(mobile=98200 33301) → postpaid, roaming on"
        - "get_account(mobile=98200 33302) → postpaid, roaming on"
        - "get_account(mobile=98200 33303) → postpaid, roaming on"
        - "get_account(mobile=98200 33304) → postpaid, roaming barred (set in 2025)"
        - "get_account(mobile=98200 33305) → postpaid, roaming on"
    - task: "A pack per traveller"
      calls:
        - "activate_roaming_pack(mobile=98200 33301, pack_id=EU21, start_date=Sat 10 Oct) → active Sat 10 Oct to Fri 30 Oct, ₹4,999"
        - "activate_roaming_pack(mobile=98200 33302, pack_id=EU21, start_date=Sun 11 Oct) → active Sun 11 Oct to Sat 31 Oct, ₹4,999"
        - "activate_roaming_pack(mobile=98200 33304, pack_id=EU21, start_date=Sun 11 Oct) → error: roaming is barred on this number"
        - "set_call_barring(mobile=98200 33304, type=roaming, enabled=no) → roaming barring off"
        - "activate_roaming_pack(mobile=98200 33304, pack_id=EU21, start_date=Sun 11 Oct) → active Sun 11 Oct to Sat 31 Oct, ₹4,999"
        - "activate_roaming_pack(mobile=98200 33303, pack_id=EU21, start_date=Sun 11 Oct) → active Sun 11 Oct to Sat 31 Oct, ₹4,999"
        - "activate_roaming_pack(mobile=98200 33305, pack_id=EU14, start_date=Sun 11 Oct) → active Sun 11 Oct to Sat 24 Oct, ₹3,499"
        - "activate_roaming_pack(mobile=98200 33301, pack_id=CH3, start_date=Mon 19 Oct) → active Mon 19 Oct to Wed 21 Oct, ₹999"
    - task: "Protect the children's lines"
      calls:
        - "set_call_barring(mobile=98200 33303, type=premium-rate, enabled=yes) → barring on"
        - "set_call_barring(mobile=98200 33304, type=premium-rate, enabled=yes) → barring on"
        - "set_usage_limit(mobile=98200 33303, limit=₹6,000) → set"
        - "set_usage_limit(mobile=98200 33304, limit=₹6,000) → set"
    - task: "Wi-Fi calling as backup, eSIM for Nisha"
      calls:
        - "enable_wifi_calling(mobile=98200 33301) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98200 33302) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98200 33303) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98200 33304) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98200 33305) → Wi-Fi calling on"
        - "convert_esim(mobile=98200 33302, device=iPhone 16) → eSIM QR sent by email after SMS confirmation"
    - task: "Summary"
      calls:
        - "send_sms(template=roaming_summary) → sent"
  forbid: ["activate_roaming_pack(mobile=98200 33305, pack_id=EU21)", "activate_roaming_pack(mobile=98200 33302, pack_id=CH3)"]
  lines:
    - [open, "Hi, five of us are going to Europe and I want everyone's roaming sorted. All on our family postpaid."]
    - [after, "What packs do you have for Europe?"]
    - [after, "I fly on the tenth for a conference; the others join on the eleventh. Twenty-one days for me, my wife and both kids, from their own day."]
    - [after, "My father-in-law is coming back early, after two weeks. The shorter pack for him, from the eleventh."]
    - [after, "Wait — does that cover Switzerland? I'll be in Zurich for three days from the nineteenth. Only me."]
    - [after, "Kabir's number had roaming blocked, I think — we did that last year. Unblock it if needed."]
    - [after, "On both kids' numbers, block premium-rate numbers and keep a limit of six thousand each."]
    - [after, "Can we call on hotel Wi-Fi too? Switch that on for all five."]
    - [after, "My wife has a new iPhone. Can her number move to eSIM before we go?"]
    - [after, "What's the total for all the packs?"]
    - [after, "Read me each person's dates once more."]
    - [after, "Send the summary to my phone. Thanks a lot."]
  key:
    - "Checks all five lines and finds Kabir's roaming barred"
    - "Activates EU21 for Rahul from Sat 10 Oct and for Nisha, Ira and Kabir from Sun 11 Oct; EU14 for Nana from Sun 11 Oct"
    - "When Kabir's pack fails, says roaming is barred, lifts the barring and activates"
    - "Adds CH3 for Rahul only, from Mon 19 Oct"
    - "Bars premium-rate numbers and sets ₹6,000 limits on both children's lines; turns on Wi-Fi calling for all five; starts Nisha's eSIM"
    - "States ₹24,494 for the packs and reads every traveller's dates"
  checks: {digits: ["Fri 30 Oct", "Sat 24 Oct"], say: [["24,494", "twenty-four thousand four hundred ninety-four", "twenty four thousand four hundred and ninety four"]], tool_order: [get_roaming_packs, activate_roaming_pack]}
  guard: "Every traveller's pack and start date comes before activation; L5 asks about Switzerland whatever was said; L6 offers the barring fix before it is needed."

- id: tel-120
  g: TEL-4
  lang: hg
  diff: Hard
  dir: in
  title: "Two phones stolen at a concert — both SIMs blocked, charges after the theft disputed, replacements at a store with stock"
  basis: "When phones are stolen, each number is blocked, misuse is disputed and a replacement SIM is arranged with ID."
  caller: "M 46-60 · father in Mumbai whose wife's and daughter's phones were stolen last night, calling from his own phone"
  goal: "Block both stolen numbers, get any charges after the theft reversed, report the handsets, and get both numbers back on new SIMs tomorrow."
  role: "You handle lost and stolen phones. A replacement SIM needs the user's ID at a store; never do a SIM swap on the phone."
  context: "Family account TF-40220. Stolen: 98330 40222 (Kavita) and 98330 40223 (Tanya), Sun 4 Oct around 10 pm."
  tasks:
    - task: "The two numbers"
      calls:
        - "list_connections() → TF-40220: Rakesh 98330 40221 (owner), Kavita 98330 40222, Tanya 98330 40223"
        - "get_account(mobile=98330 40222) → postpaid, active; last used today 1:40 am"
        - "get_account(mobile=98330 40223) → postpaid, active; last used Sun 4 Oct 10:05 pm"
        - "get_data_usage(mobile=98330 40222) → 3.2 GB used since 10 pm last night"
        - "get_data_usage(mobile=98330 40223) → nothing since 10:05 pm"
    - task: "Block both"
      calls:
        - "block_sim(mobile=98330 40222, reason=phone stolen) → blocked, BS 40231"
        - "block_sim(mobile=98330 40223, reason=phone stolen) → blocked, BS 40232"
    - task: "Charges after the theft"
      calls:
        - "get_bill(account=TF-40220, month=October so far) → Kavita: ISD calls to +880 today 12:10 am-1:40 am ₹2,760; premium SMS ₹300"
        - "raise_bill_dispute(account=TF-40220, item=Kavita ISD calls after theft, reason=phone stolen 4 Oct 10 pm) → dispute BD 40241; provisional credit ₹2,760"
        - "raise_bill_dispute(account=TF-40220, item=Kavita premium SMS after theft, reason=phone stolen 4 Oct 10 pm) → dispute BD 40242; provisional credit ₹300"
    - task: "Report the handsets"
      calls:
        - "raise_complaint(type=stolen handset, mobile_or_fibre=98330 40222, pincode=400051, details=iPhone 14, stolen at concert, Bandra) → complaint SH 40251; IMEI block request forwarded"
        - "raise_complaint(type=stolen handset, mobile_or_fibre=98330 40223, pincode=400051, details=Samsung S23, stolen at concert, Bandra) → complaint SH 40252; IMEI block request forwarded"
    - task: "Replacement SIMs"
      calls:
        - "find_store(pincode=400050) → Tarang Bandra West ST-0511, 10 am-9 pm; Tarang Khar ST-0518, 10 am-8 pm"
        - "request_sim_replacement(mobile=98330 40222, store_id=ST-0511) → error: Bandra West store has no SIM stock until Thu 8 Oct"
        - "request_sim_replacement(mobile=98330 40222, store_id=ST-0518) → replacement ready at Khar; Kavita's ID needed"
        - "request_sim_replacement(mobile=98330 40223, store_id=ST-0518) → replacement ready at Khar; Tanya's ID needed"
        - "book_store_visit(store_id=ST-0518, date=Tue 6 Oct, slot=11:00 am, purpose=two replacement SIMs) → appointment SV 40260"
    - task: "Once the new SIMs are in"
      calls:
        - "set_call_barring(mobile=98330 40222, type=international, enabled=yes) → barring on from reactivation"
        - "set_call_barring(mobile=98330 40223, type=international, enabled=yes) → barring on from reactivation"
        - "set_call_barring(mobile=98330 40222, type=premium-rate, enabled=yes) → barring on from reactivation"
        - "set_call_barring(mobile=98330 40223, type=premium-rate, enabled=yes) → barring on from reactivation"
        - "set_usage_limit(mobile=98330 40222, limit=₹1,500) → set"
        - "set_usage_limit(mobile=98330 40223, limit=₹1,000) → set"
        - "schedule_callback(date=Tue 6 Oct, slot=4-5 pm, topic=both numbers working on new SIMs) → booked"
        - "send_sms(template=stolen_phones_summary) → sent to 98330 40221"
  forbid: ["convert_esim(mobile=98330 40222)", "request_sim_replacement(mobile=98330 40221)"]
  lines:
    - [open, "Hello, kal raat concert mein meri wife aur beti ke phone chori ho gaye. Main apne phone se bol raha hoon. Dono numbers band karne hain.", "Hello, my wife's and daughter's phones were stolen at a concert last night. I'm calling from my own phone. Both numbers need blocking."]
    - [after, "Pehle dekho, chori ke baad kisi ne use toh nahi kiya?", "First check — has anyone used them since the theft?"]
    - [after, "Kavita ka raat ko use hua? Turant dono block karo.", "Kavita's was used during the night? Block both immediately."]
    - [after, "Bill mein kuch laga kya uske baad?", "Has anything been charged on the bill after that?"]
    - [after, "Woh hum ne nahi kiya. Dono pe dispute daalo.", "We didn't do that. Raise disputes on both."]
