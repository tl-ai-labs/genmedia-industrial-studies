    - [after, "Kal shaam ko check karna sab chal raha hai ya nahi.", "Check tomorrow evening whether everything's working."]
    - [after, "SMS mere number pe bhej do. Shukriya.", "Send the SMS to my number. Thanks."]
  key:
    - "Checks both numbers' use since the theft (Kavita's used until 1:40 am) and blocks both (BS 40231, BS 40232)"
    - "Disputes the ₹2,760 ISD calls and ₹300 premium SMS after the theft (BD 40241, BD 40242)"
    - "Raises stolen-handset complaints SH 40251 and SH 40252"
    - "Refuses to swap the SIM on the phone or take an OTP; explains ID at a store"
    - "When Bandra West has no stock, says so and arranges both replacements at Khar; books Tue 6 Oct at 11:00 am (SV 40260)"
    - "Sets international and premium-rate barring and the two limits from reactivation; books the call-back"
  checks: {lang: hg, digits: ["BD 40241", "SV 40260", "SH 40252"], not_say: ["tell me the OTP", "OTP batao"], tool_order: [block_sim, request_sim_replacement]}
