    - [after, "Sahithi కి smartwatch కూడా కొన్నాం. దాన్ని eSIM తో తన number కి కలపాలి.", "We also bought Sahithi a smartwatch. It needs to be linked to her number with an eSIM."]
    - [after b, "Amma, code వచ్చింది కానీ type చేసేలోపు అయిపోయింది.", "Amma, the code came but it expired before I could type it."]
    - [after, "ఇంకోసారి పంపండి, ఈసారి త్వరగా చేస్తుంది.", "Send it once more; she'll be quick this time."]
    - [after, "నెలకి ఎంత extra అవుతుంది?", "How much extra will it be per month?"]
    - [after, "వచ్చే సోమవారం ఒకసారి call చేసి అన్నీ సరిగా ఉన్నాయా అడగండి.", "Call next Monday once to ask if everything is fine."]
    - [after, "SMS పంపండి. Thanks.", "Send an SMS. Thanks."]
