    - [after, "क्लिनिक में अंदर सिग्नल नहीं आता। मेरे और रिसेप्शन के फ़ोन पर वाई-फ़ाई कॉलिंग चालू कर दीजिए।", "There's no signal inside the clinic. Turn on Wi-Fi calling on my phone and reception's."]
    - [after, "इंटरनेट भी पिछले हफ़्ते बार-बार जा रहा था, अपॉइंटमेंट सिस्टम बंद हो जाता है।", "The internet kept going last week too; the appointment system shuts down."]
    - [after, "बैकअप वाला लगा दीजिए।", "Put the backup one in."]
    - [after, "मरीज़ बैठे हैं, SMS कर दीजिए।", "Patients are waiting, SMS it."]
    - [after, "धन्यवाद।", "Thank you."]
