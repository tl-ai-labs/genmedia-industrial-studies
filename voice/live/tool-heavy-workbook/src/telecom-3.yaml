    - [after, "అది ఆపేయండి. ఇద్దరినీ నా family postpaid లోకి మార్చండి.", "Stop that. Move both of them onto my family postpaid."]
    - [after, "ఇద్దరికీ నెలకి మూడు వందలు limit. International, premium calls రెండూ block.", "A limit of three hundred a month for both. Block international and premium calls on both."]
