- id: tel-121
  g: TEL-4
  lang: hi
  diff: Medium
  dir: in
  title: "Parents and uncle off on Umrah — a roaming pack each, long recharges, Wi-Fi calling, barring, and an ISD pack for the son"
  basis: "Pilgrim families need each traveller's number to stay alive and reachable abroad, number by number."
  caller: "M 26-45 · son in Lucknow arranging his parents' and uncle's Umrah trip, careful"
  goal: "Make sure all three travellers can be reached for the whole 40 days without bill shocks, and that he can call them cheaply."
  role: "You handle roaming. Give each pack's price and dates. Prepaid numbers must stay valid through the trip."
  context: "Travel Mon 12 Oct to Fri 20 Nov (40 days)."
  tasks:
    - task: "Travellers"
      calls:
        - "list_connections() → prepaid: Salim (son) 94150 12101, Abbu 94150 12102, Ammi 94150 12103, Chacha 94150 12104"
        - "get_account(mobile=94150 12102) → P299, valid until Sat 17 Oct"
        - "get_account(mobile=94150 12103) → P299, valid until Sat 17 Oct"
        - "get_account(mobile=94150 12104) → P155, valid until Thu 29 Oct"
        - "get_roaming_packs(country=Saudi Arabia) → SA45 ₹3,999 45 days 5 GB 150 min incoming free; SA30 ₹2,999 30 days 3 GB 100 min"
    - task: "Keep each number valid, then a pack each"
      calls:
        - "recharge(mobile=94150 12102, plan_id=P859, payment=saved UPI) → recharged, valid until Sat 9 Jan 2027"
        - "recharge(mobile=94150 12103, plan_id=P859, payment=saved UPI) → recharged, valid until Sat 9 Jan 2027"
        - "recharge(mobile=94150 12104, plan_id=P479, payment=saved UPI) → recharged, valid until Thu 21 Jan 2027"
        - "activate_roaming_pack(mobile=94150 12102, pack_id=SA45, start_date=Mon 12 Oct) → active Mon 12 Oct to Wed 25 Nov, ₹3,999"
        - "activate_roaming_pack(mobile=94150 12103, pack_id=SA45, start_date=Mon 12 Oct) → active Mon 12 Oct to Wed 25 Nov, ₹3,999"
        - "activate_roaming_pack(mobile=94150 12104, pack_id=SA45, start_date=Mon 12 Oct) → active Mon 12 Oct to Wed 25 Nov, ₹3,999"
    - task: "Backups and protection"
      calls:
        - "enable_wifi_calling(mobile=94150 12102) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=94150 12103) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=94150 12104) → Wi-Fi calling on"
        - "set_call_barring(mobile=94150 12102, type=premium-rate, enabled=yes) → barring on"
        - "set_call_barring(mobile=94150 12103, type=premium-rate, enabled=yes) → barring on"
        - "set_call_barring(mobile=94150 12104, type=premium-rate, enabled=yes) → barring on"
    - task: "Son's ISD pack"
      calls:
        - "activate_pack(mobile=94150 12101, pack_id=ISD Saudi 300 minutes 45 days) → active Mon 12 Oct to Wed 25 Nov, ₹599"
        - "schedule_callback(date=Sat 10 Oct, slot=11 am-12 pm, topic=check everything before travel) → booked"
        - "send_sms(template=roaming_summary) → sent"
  forbid: ["activate_roaming_pack(mobile=94150 12102, pack_id=SA30)", "set_call_barring(mobile=94150 12102, type=roaming, enabled=yes)"]
  lines:
    - [open, "अस्सलाम अलैकुम। मेरे अम्मी-अब्बू और चाचा उमरा पर जा रहे हैं, बारह अक्टूबर से चालीस दिन। तीनों के फ़ोन का इंतज़ाम करना है।", "Peace be upon you. My parents and uncle are going on Umrah — forty days from the twelfth of October. I need to arrange all three phones."]
    - [after, "तीनों नंबर कब तक चालू हैं, देखिए।", "Check how long all three numbers are valid."]
    - [after, "सऊदी के लिए कौन-से पैक हैं?", "Which packs are there for Saudi?"]
    - [after, "पैंतालीस दिन वाला, तीनों को, बारह तारीख़ से।", "The forty-five-day one for all three, from the twelfth."]
    - [after, "पर बीच में नंबर बंद न हो जाए। अब्बू-अम्मी का चौरासी दिन वाला, चाचा का सस्ता वाला लंबा। सब UPI से।", "But the numbers mustn't lapse in between. The eighty-four-day one for Abbu and Ammi, the cheap long one for Chacha. All by UPI."]
    - [after, "होटल में वाई-फ़ाई होगा। उस पर कॉल हो सके, तीनों पर चालू कर दीजिए।", "The hotel will have Wi-Fi. Turn on calling over it for all three."]
    - [after, "और कोई महँगे नंबर पर कॉल न लगे, तीनों पर वो बंद कर दीजिए।", "And so no call goes to expensive numbers, block those on all three."]
    - [after, "मुझे यहाँ से उन्हें रोज़ फ़ोन करना होगा। मेरे नंबर पर सऊदी का कोई कॉल पैक?", "I'll have to call them every day from here. A Saudi calling pack on my number?"]
    - [after, "हाँ, वो लगा दीजिए।", "Yes, add that."]
    - [after, "कुल कितना ख़र्च हुआ?", "How much was spent in total?"]
    - [after, "जाने से पहले शनिवार को एक बार फ़ोन करके सब जाँच लीजिए।", "Call once on Saturday before they leave to check everything."]
    - [after, "शुक्रिया, SMS भेज दीजिए।", "Thank you, send an SMS."]
  key:
    - "Reads each number's validity; recharges Abbu and Ammi on P859 and Chacha on P479 so all stay valid past 20 Nov"
    - "Activates SA45 for all three from Mon 12 Oct (to 25 Nov)"
    - "Turns on Wi-Fi calling and premium-rate barring on all three"
    - "Adds the Saudi ISD pack on Salim's number (₹599)"
    - "States ₹14,793 in all and books Saturday's check"
  checks: {lang: hi, digits: ["Wed 25 Nov", "9 Jan 2027"], say: [["14,793", "चौदह हज़ार सात सौ तिरानवे"]], tool_order: [recharge, activate_roaming_pack]}
  guard: "Each traveller's plan is named; L5 asks for validity cover whatever the agent offered; L10 asks for the total whatever was said."

