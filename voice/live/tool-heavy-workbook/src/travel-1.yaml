# Travel — tool-heavy scenarios trv-101 … trv-108 (TRV-1 Flights).
code: trv
scenarios:

- id: trv-101
  g: TRV-1
  lang: en
  diff: Hard
  dir: in
  title: "Family of four — move the whole trip by a day, seats, meals, bag"
  basis: "Family date changes are one booking but every change, seat and meal is per passenger."
  caller: "M 26-45 · father booking for his family, organised, has the PNR ready"
  goal: "Move the Goa trip to Saturday and back a day later, four seats together, kids' meals, one extra bag, pay once."
  role: "You handle bookings. State the fare difference before changing anything."
  context: "Flexi fare: date changes are free; the passenger pays only the fare difference."
  tasks:
    - task: "Find the booking"
      calls:
        - "get_booking(pnr=YT5H2N) → Arjun Mehta, Neha Mehta, Kabir Mehta (child, 9), Ira Mehta (child, 6); YA 211 Delhi-Goa Fri 9 Oct 6:20 am; YA 214 Goa-Delhi Fri 16 Oct 4:50 pm; Flexi fare"
    - task: "Move all four to Saturday 10 October"
      calls:
        - "search_flights(from=DEL, to=GOI, date=Sat 10 Oct) → YA 211 6:20 am, 9 seats left, +₹900 per person; YA 215 2:05 pm, +₹2,300 per person"
        - "change_flight(pnr=YT5H2N, passenger=Arjun Mehta, new_flight=YA 211 Sat 10 Oct) → changed, +₹900"
        - "change_flight(pnr=YT5H2N, passenger=Neha Mehta, new_flight=YA 211 Sat 10 Oct) → changed, +₹900"
        - "change_flight(pnr=YT5H2N, passenger=Kabir Mehta, new_flight=YA 211 Sat 10 Oct) → changed, +₹900"
        - "change_flight(pnr=YT5H2N, passenger=Ira Mehta, new_flight=YA 211 Sat 10 Oct) → changed, +₹900"
    - task: "Move all four returns to Saturday 17 October"
      calls:
        - "search_flights(from=GOI, to=DEL, date=Sat 17 Oct) → YA 214 4:50 pm, no fare difference; YA 218 9:30 pm, +₹600 per person"
        - "change_flight(pnr=YT5H2N, passenger=Arjun Mehta, new_flight=YA 214 Sat 17 Oct) → changed, ₹0"
        - "change_flight(pnr=YT5H2N, passenger=Neha Mehta, new_flight=YA 214 Sat 17 Oct) → changed, ₹0"
        - "change_flight(pnr=YT5H2N, passenger=Kabir Mehta, new_flight=YA 214 Sat 17 Oct) → changed, ₹0"
        - "change_flight(pnr=YT5H2N, passenger=Ira Mehta, new_flight=YA 214 Sat 17 Oct) → changed, ₹0"
    - task: "Four seats together on the Saturday flight"
      calls:
        - "get_seat_map(flight_no=YA 211, date=Sat 10 Oct) → row 18 A-F free (the only row with four together); 18A window"
        - "assign_seat(pnr=YT5H2N, passenger=Ira Mehta, flight_no=YA 211, seat=18A) → assigned, ₹0"
        - "assign_seat(pnr=YT5H2N, passenger=Kabir Mehta, flight_no=YA 211, seat=18B) → assigned, ₹0"
        - "assign_seat(pnr=YT5H2N, passenger=Neha Mehta, flight_no=YA 211, seat=18C) → assigned, ₹0"
        - "assign_seat(pnr=YT5H2N, passenger=Arjun Mehta, flight_no=YA 211, seat=18D) → error: 18D was taken a moment ago; 18E is still free"
        - "assign_seat(pnr=YT5H2N, passenger=Arjun Mehta, flight_no=YA 211, seat=18E) → assigned, ₹0"
    - task: "Kids' veg meals on the way out"
      calls:
        - "add_meal(pnr=YT5H2N, passenger=Kabir Mehta, flight_no=YA 211, meal=kids veg) → added, ₹350"
        - "add_meal(pnr=YT5H2N, passenger=Ira Mehta, flight_no=YA 211, meal=kids veg) → added, ₹350"
    - task: "15 kg extra for Arjun on the way out"
      calls:
        - "add_baggage(pnr=YT5H2N, passenger=Arjun Mehta, flight_no=YA 211, kg=15) → added, ₹1,800"
    - task: "Pay once, then the itinerary"
      calls:
        - "send_payment_link(pnr=YT5H2N, amount=₹6,100) → link sent by SMS, valid 2 hours"
        - "send_sms(template=updated_itinerary) → sent"
  forbid: [cancel_booking, "change_flight(pnr=YT5H2N, passenger=Arjun Mehta, new_flight=YA 215 Sat 10 Oct)"]
  lines:
    - [open, "Hi, I need to move my family's Goa trip by one day. P N R Y T five H two N. There are four of us."]
    - [after, "We're on the Friday morning flight to Goa. Can all four of us go on Saturday instead, same time if possible?"]
    - [after, "And push the return by a day too, to Saturday the seventeenth. All four of us."]
    - [after, "Okay. What's the extra for all that?"]
    - [after, "Fine, go ahead and change both flights for all four."]
    - [after, "Now seats. All four of us together in one row on the Saturday flight."]
    - [cut 1500 L6, "Wait — Ira by the window, Kabir next to her, then my wife, then me. And if a seat goes while you're booking, take the next free one in that row."]
    - [after, "Great. The kids eat vegetarian. Can you add kids' veg meals for both of them on the way out?"]
    - [after, "And one extra bag for me, fifteen kilos, on the way out only."]
    - [after, "How much is it altogether, and how do I pay?"]
    - [after, "Send the link, I'll pay right away. And the new itinerary to my phone as well."]
    - [after, "That's everything. Thanks a lot."]
  key:
    - "Finds YT5H2N: four passengers on YA 211 Friday 9 October and YA 214 Friday 16 October"
    - "Gives the Saturday options (YA 211 +₹900 a person, YA 215 +₹2,300) and moves all four to YA 211 Saturday 10 October"
    - "Moves all four returns to YA 214 Saturday 17 October at no extra fare"
    - "After the cut-in: seats Ira 18A, Kabir 18B, Neha 18C; when 18D fails, says so and gives Arjun 18E"
    - "Adds kids' veg meals for Kabir and Ira and 15 kg for Arjun, all on YA 211"
    - "States the total ₹6,100 (₹3,600 fares, ₹700 meals, ₹1,800 bag) and sends one payment link"
    - "Sends the updated itinerary; cancels nothing"
  checks: {digits: ["6,100", "18E"], say: [["6,100", "six thousand one hundred", "sixty-one hundred"]], tool_order: [search_flights, change_flight]}
  guard: "The caller gives every name, the seat order and the fallback before the seats are booked; L4–L5 accept whatever total is quoted; L10–L11 ask for the total and link whether or not the agent offered them."

- id: trv-102
  g: TRV-1
  lang: hg
  diff: Hard
  dir: in
  title: "Wedding group of six — names, bags, seats in one row, web check-in"
  basis: "Group bookings for weddings: name typos, extra baggage for outfits and everyone checked in together."
  caller: "M 26-45 · organising a wedding trip for his cousins, cheerful; speaker b: F 18-25 · his cousin Tanya"
  goal: "Fix two names, add bags for three, seat all six in one row, pay once and check everyone in."
  role: "You handle bookings. Name corrections of up to 3 letters are free. Check in only after names and seats are done."
  context: "Web check-in for YA 731 is open (it opens 48 hours before departure)."
  tasks:
    - task: "Find the booking"
      calls:
        - "get_booking(pnr=YT9W4B) → Rohan Kapoor, Simran Kapor, Karan Malhotra, Tanya Malhotra, Aditya Sethee, Meher Sethi; YA 731 Mumbai-Udaipur Wed 7 Oct 10:15 am; Saver fare, 15 kg each"
    - task: "Correct two names"
      calls:
        - "update_name(pnr=YT9W4B, passenger=Simran Kapor, corrected_name=Simran Kapoor) → corrected, ₹0"
        - "update_name(pnr=YT9W4B, passenger=Aditya Sethee, corrected_name=Aditya Sethi) → corrected, ₹0"
    - task: "10 kg extra for Simran, Tanya and Meher"
      calls:
        - "add_baggage(pnr=YT9W4B, passenger=Simran Kapoor, flight_no=YA 731, kg=10) → added, ₹1,200"
        - "add_baggage(pnr=YT9W4B, passenger=Tanya Malhotra, flight_no=YA 731, kg=10) → added, ₹1,200"
        - "add_baggage(pnr=YT9W4B, passenger=Meher Sethi, flight_no=YA 731, kg=10) → added, ₹1,200"
    - task: "All six in one row"
      calls:
        - "get_seat_map(flight_no=YA 731, date=Wed 7 Oct) → row 24 A-F free (the only full row free); row 25 A, B, C, E free"
        - "assign_seat(pnr=YT9W4B, passenger=Simran Kapoor, flight_no=YA 731, seat=24A) → assigned, ₹250"
        - "assign_seat(pnr=YT9W4B, passenger=Tanya Malhotra, flight_no=YA 731, seat=24B) → assigned, ₹250"
        - "assign_seat(pnr=YT9W4B, passenger=Meher Sethi, flight_no=YA 731, seat=24C) → error: 24C was taken a moment ago"
        - "assign_seat(pnr=YT9W4B, passenger=Meher Sethi, flight_no=YA 731, seat=25C) → assigned, ₹250"
        - "assign_seat(pnr=YT9W4B, passenger=Rohan Kapoor, flight_no=YA 731, seat=24D) → assigned, ₹250"
        - "assign_seat(pnr=YT9W4B, passenger=Karan Malhotra, flight_no=YA 731, seat=24E) → assigned, ₹250"
        - "assign_seat(pnr=YT9W4B, passenger=Aditya Sethi, flight_no=YA 731, seat=24F) → assigned, ₹250"
    - task: "Pay for bags and seats"
      calls:
        - "send_payment_link(pnr=YT9W4B, amount=₹5,100) → link sent by SMS"
    - task: "Check all six in"
      calls:
        - "web_check_in(pnr=YT9W4B, passenger=Rohan Kapoor, flight_no=YA 731) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT9W4B, passenger=Simran Kapoor, flight_no=YA 731) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT9W4B, passenger=Karan Malhotra, flight_no=YA 731) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT9W4B, passenger=Tanya Malhotra, flight_no=YA 731) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT9W4B, passenger=Aditya Sethi, flight_no=YA 731) → checked in, boarding pass sent by SMS"
        - "web_check_in(pnr=YT9W4B, passenger=Meher Sethi, flight_no=YA 731) → checked in, boarding pass sent by SMS"
    - task: "Send the itinerary"
      calls:
        - "send_sms(template=updated_itinerary) → sent"
  forbid: [cancel_booking, add_travel_insurance]
  lines:
    - [open, "Hello, main Rohan bol raha hoon. Hum chhe log Udaipur ja rahe hain shaadi ke liye. PNR hai Y T nine W four B.", "Hello, this is Rohan. Six of us are going to Udaipur for a wedding. The PNR is YT9W4B."]
    - [after, "Pehle do naam theek karne hain. Simran ka surname 'Kapor' likha hai, sahi hai K A P O O R. Aur Aditya ka 'Sethee' likha hai, sahi hai S E T H I.", "First, two names need fixing. Simran's surname says 'Kapor', it should be K-A-P-O-O-R. And Aditya's says 'Sethee', it should be S-E-T-H-I."]
    - [after, "Iska koi charge lagega kya?", "Is there any charge for that?"]
    - [after, "Achha. Teeno ladkiyon ke liye das-das kilo extra baggage chahiye — Simran, Tanya aur Meher.", "Okay. The three girls need ten kilos extra each — Simran, Tanya and Meher."]
    - [after, "Ab seats. Sab ek hi row mein. Ladkiyaan A, B, C — Simran, Tanya, Meher. Ladke D, E, F — main, Karan, Aditya. Agar beech mein koi seat chali jaaye, toh us bande ko peeche wali row mein same letter de dena.", "Now seats. All in one row. Girls in A, B, C — Simran, Tanya, Meher. Boys in D, E, F — me, Karan, Aditya. If a seat goes while you book, give that person the same letter in the row behind."]
    - [after, "Total kitna hua?", "What's the total?"]
    - [after, "Theek hai, link bhej do, main abhi pay kar deta hoon.", "Fine, send the link, I'll pay now."]
    - [after, "Aur sab ka web check-in bhi kar do, airport pe line nahi chahiye.", "And do everyone's web check-in too, we don't want the queue at the airport."]
    - [after b, "Hi, main Tanya. Mera das kilo wala bag add ho gaya na?", "Hi, I'm Tanya. My ten-kilo bag has been added, right?"]
    - [after b, "Perfect. Main phone wapas Rohan ko de rahi hoon.", "Perfect. I'm giving the phone back to Rohan."]
    - [after, "Haan, main wapas. Boarding pass sab ke phone pe aayenge?", "Yes, I'm back. Will everyone get the boarding passes on their phones?"]
    - [after, "Aur poori itinerary mere number pe bhej dena.", "And send the full itinerary to my number."]
    - [after, "Bas itna hi. Thank you!", "That's all. Thank you!"]
  key:
    - "Corrects Simran Kapoor and Aditya Sethi at no charge"
    - "Adds 10 kg for Simran, Tanya and Meher (₹1,200 each)"
    - "Seats Simran 24A, Tanya 24B, Rohan 24D, Karan 24E, Aditya 24F; when 24C fails, says so and gives Meher 25C"
    - "States the total ₹5,100 and sends the payment link"
    - "Checks in all six only after the names and seats are done"
    - "Answers Tanya directly: her 10 kg is added"
    - "Sends the itinerary; adds nothing unasked"
  checks: {lang: hg, digits: ["5,100", "25C"], say: [["5,100", "paanch hazaar ek sau", "fifty-one hundred"]], tool_order: [update_name, web_check_in]}
  guard: "Every name, seat letter and the fallback come in L2 and L5, before any seat is booked; Tanya's question is true whatever was said; L11–L12 make sense after any check-in reply."

- id: trv-103
  g: TRV-1
  lang: hi
  diff: Medium
  dir: in
  title: "Elderly parents on a connecting trip — wheelchairs, assistance, seats, meals"
  basis: "Children book special assistance for older parents; every service is per passenger and per flight."
  caller: "M 26-45 · son booking for his parents, calm and thorough"
  goal: "Wheelchairs and help at the Delhi transfer for both parents, front aisle seats, diabetic meals, frequent-flyer numbers, and his own number on the booking."
  role: "You handle bookings and special assistance."
  context: "Wheelchairs, meet-and-assist, seats and special meals are free for passengers over 60."
  tasks:
    - task: "Find the booking"
      calls:
        - "get_booking(pnr=YT4L8D) → Ramesh Tiwari (72), Kamla Tiwari (68); YA 402 Lucknow-Delhi Thu 8 Oct 7:00 am, lands 8:20 am; YA 515 Delhi-Bengaluru Thu 8 Oct 11:30 am"
    - task: "Wheelchairs on both flights for both"
      calls:
        - "request_wheelchair(pnr=YT4L8D, passenger=Ramesh Tiwari, flight_no=YA 402) → booked at departure and arrival"
        - "request_wheelchair(pnr=YT4L8D, passenger=Kamla Tiwari, flight_no=YA 402) → booked at departure and arrival"
        - "request_wheelchair(pnr=YT4L8D, passenger=Ramesh Tiwari, flight_no=YA 515) → booked at departure and arrival"
        - "request_wheelchair(pnr=YT4L8D, passenger=Kamla Tiwari, flight_no=YA 515) → booked at departure and arrival"
    - task: "Help at the Delhi transfer"
      calls:
        - "add_special_service(pnr=YT4L8D, passenger=Ramesh Tiwari, flight_no=YA 515, service=meet-and-assist) → booked"
        - "add_special_service(pnr=YT4L8D, passenger=Kamla Tiwari, flight_no=YA 515, service=meet-and-assist) → booked"
    - task: "Front aisle seats side by side"
      calls:
        - "get_seat_map(flight_no=YA 402, date=Thu 8 Oct) → 3C and 3D free (aisle seats across the aisle, front-most pair)"
        - "assign_seat(pnr=YT4L8D, passenger=Ramesh Tiwari, flight_no=YA 402, seat=3C) → assigned, ₹0"
        - "assign_seat(pnr=YT4L8D, passenger=Kamla Tiwari, flight_no=YA 402, seat=3D) → assigned, ₹0"
        - "get_seat_map(flight_no=YA 515, date=Thu 8 Oct) → 5C and 5D free (aisle seats across the aisle, front-most pair)"
        - "assign_seat(pnr=YT4L8D, passenger=Ramesh Tiwari, flight_no=YA 515, seat=5C) → assigned, ₹0"
        - "assign_seat(pnr=YT4L8D, passenger=Kamla Tiwari, flight_no=YA 515, seat=5D) → assigned, ₹0"
    - task: "Diabetic meals on both flights"
      calls:
        - "add_meal(pnr=YT4L8D, passenger=Ramesh Tiwari, flight_no=YA 402, meal=diabetic) → added, ₹0"
        - "add_meal(pnr=YT4L8D, passenger=Kamla Tiwari, flight_no=YA 402, meal=diabetic) → added, ₹0"
        - "add_meal(pnr=YT4L8D, passenger=Ramesh Tiwari, flight_no=YA 515, meal=diabetic) → added, ₹0"
        - "add_meal(pnr=YT4L8D, passenger=Kamla Tiwari, flight_no=YA 515, meal=diabetic) → added, ₹0"
    - task: "Frequent-flyer numbers"
      calls:
        - "add_frequent_flyer(pnr=YT4L8D, passenger=Ramesh Tiwari, ff_no=YF 3381 0027) → added"
        - "add_frequent_flyer(pnr=YT4L8D, passenger=Kamla Tiwari, ff_no=YF 3381 0035) → added"
    - task: "Son's number for messages, then the summary"
      calls:
        - "update_contact(pnr=YT4L8D, mobile=98390 44120) → contact updated"
        - "send_sms(template=updated_itinerary) → sent to 98390 44120"
  forbid: [add_travel_insurance, cancel_booking]
  lines:
    - [open, "नमस्ते, मुझे अपने माता-पिता की फ़्लाइट के बारे में बात करनी है। पीएनआर है वाई टी चार एल आठ डी।", "Hello, I need to talk about my parents' flight. The PNR is YT4L8D."]
    - [after, "दोनों की उम्र सत्तर के आसपास है। दोनों फ़्लाइट में, लखनऊ में भी और दिल्ली में भी, दोनों के लिए व्हीलचेयर चाहिए।", "Both are around seventy. They need wheelchairs on both flights, in Lucknow and in Delhi, for both of them."]
    - [after, "दिल्ली में फ़्लाइट बदलनी है। वहाँ कोई उन्हें अगली फ़्लाइट तक ले जाने वाला मिल जाएगा क्या? दोनों के लिए।", "They change flights in Delhi. Can someone take them to the next flight there? For both."]
    - [after, "सीट आगे की तरफ़ चाहिए, रास्ते वाली, दोनों पास-पास। बीच में रास्ता हो तो भी चलेगा। दोनों फ़्लाइट में।", "Seats near the front, on the aisle, close together. Across the aisle is fine. On both flights."]
    - [after, "दोनों को शुगर है, तो दोनों फ़्लाइट में डायबिटिक खाना लगा दीजिए।", "Both are diabetic, so please put diabetic meals on both flights."]
    - [after, "उनके फ़्रीक्वेंट फ़्लायर नंबर भी जोड़ दीजिए। पापा का है वाई एफ तीन तीन आठ एक,", "Add their frequent-flyer numbers too. Papa's is YF 3381,"]
    - [pause 1900, "शून्य शून्य दो सात। और मम्मी का वाई एफ तीन तीन आठ एक, शून्य शून्य तीन पाँच।", "zero zero two seven. And Mummy's is YF 3381, zero zero three five."]
    - [after, "संपर्क नंबर मेरा डाल दीजिए, ताकि सारे मैसेज मुझे आएँ। नौ आठ तीन नौ शून्य, चार चार एक दो शून्य।", "Put my contact number on it so all messages come to me. 98390 44120."]
    - [after, "इन सब का कोई पैसा लगेगा क्या?", "Will any of this cost money?"]
    - [after, "ठीक है। दिल्ली में उन्हें अगली फ़्लाइट के लिए कितना समय मिलेगा?", "Okay. How much time will they have in Delhi for the next flight?"]
    - [after, "पूरी जानकारी मेरे नंबर पर भेज दीजिए।", "Send all the details to my number."]
    - [after, "बहुत-बहुत धन्यवाद, आपने बड़ी मदद की।", "Thank you very much, you've been a great help."]
  key:
    - "Books wheelchairs for both parents on YA 402 and YA 515"
    - "Books meet-and-assist for both at the Delhi transfer"
    - "Seats 3C and 3D on YA 402, 5C and 5D on YA 515"
    - "Adds diabetic meals for both on both flights"
    - "Adds YF 3381 0027 for Ramesh and YF 3381 0035 for Kamla, read back exactly"
    - "Puts 98390 44120 on the booking"
    - "Says none of it costs anything"
    - "Gives the Delhi gap: lands 8:20 am, next flight 11:30 am, about 3 hours 10 minutes"
  checks: {lang: hi, no_jump_in: L7, digits: ["3381 0027", "3381 0035", "98390 44120"]}
  guard: "The son lists every service in his own words, one per line; L9 and L10 are questions that fit any earlier reply."

- id: trv-104
  g: TRV-1
  lang: te
  script: te-mix
  diff: Hard
  dir: in
  title: "Friends' trip — one drops out, two fly a day later on a split booking"
  basis: "Group plans change: one traveller cancels, some move dates, so the booking is split."
  caller: "M 18-25 · organising a friends' trip, quick talker"
  goal: "Cancel Divya, move Praveen and Harsha to Saturday on their own booking, seat himself with Lahari, meals, bags, FF numbers, and one payment link per booking."
  role: "You handle bookings. State refunds and charges before cancelling or changing."
  context: "Saver fare: change fee ₹2,250 per passenger per flight plus any fare difference; cancellation ₹3,000 per passenger per flight. Seats and pre-booked meals cost nothing on this fare."
  tasks:
    - task: "Find the booking and the fare rules"
      calls:
        - "get_booking(pnr=YT2K7P) → Sai Kiran Reddy, Praveen Kumar, Harsha Vardhan, Divya Sri, Lahari Rao; YA 622 Hyderabad-Goa Fri 9 Oct 9:05 am; YA 627 Goa-Hyderabad Mon 12 Oct 8:10 pm; Saver"
        - "get_fare_rules(pnr=YT2K7P) → change ₹2,250 per passenger per flight plus fare difference; cancellation ₹3,000 per passenger per flight"
    - task: "Cancel Divya, both ways"
      calls:
        - "cancel_passenger(pnr=YT2K7P, passenger=Divya Sri) → cancelled on both flights; refund ₹2,840 to the original card in 5-7 working days"
    - task: "Praveen and Harsha to Saturday, on their own booking"
      calls:
        - "split_pnr(pnr=YT2K7P, passengers=Praveen Kumar, Harsha Vardhan) → moved to new PNR YT2K9M; return YA 627 unchanged"
        - "search_flights(from=HYD, to=GOI, date=Sat 10 Oct) → YA 624 7:40 am, +₹1,100 per person; YA 626 6:15 pm, +₹400 per person"
