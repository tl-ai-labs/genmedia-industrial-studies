- id: tel-113
  g: TEL-3
  lang: en
  diff: Hard
  dir: in
  title: "Fibre down on a work-from-home day — tests, reboot, complaint, technician slot full, data for both phones, repeat-fault escalation"
  basis: "Fibre outages hit couples working from home; the agent tests, books a visit and keeps both of them online meanwhile."
  caller: "F 26-45 · software engineer in Bengaluru with a client call in an hour, stressed but cooperative"
  goal: "Get the fibre fixed today or tomorrow, stay online on mobile data meanwhile, and get credit and an escalation because it keeps happening."
  role: "You handle fibre faults. Check for an outage and test the line before raising a complaint."
  context: "Fibre FB-55120; mobiles 99860 55121 (Anjali) and 99860 55122 (Rohan)."
  tasks:
    - task: "Diagnose"
      calls:
        - "check_outage(pincode=560102) → no area outage"
        - "run_line_test(fibre_id=FB-55120) → router online, no signal on the fibre line (LOS)"
        - "remote_reboot(fibre_id=FB-55120) → router restarted; still no signal on the line"
        - "run_line_test(fibre_id=FB-55120) → LOS persists; likely fibre cut between pole and flat"
        - "get_complaint(complaint_id=CF 50880) → same fault on Mon 7 Sep, fixed Wed 9 Sep"
    - task: "Complaint and visit"
      calls:
        - "raise_complaint(type=fibre down, mobile_or_fibre=FB-55120, pincode=560102, details=LOS after reboot; repeat of CF 50880) → complaint CF 55130; target 24 hours"
        - "schedule_technician(complaint_id=CF 55130, date=Mon 5 Oct, slot=2-5 pm) → error: slot full"
        - "schedule_technician(complaint_id=CF 55130, date=Tue 6 Oct, slot=8-11 am) → visit booked"
        - "raise_ticket(category=repeat fibre fault, summary=FB-55120 second fibre cut in a month; CF 50880, CF 55130) → ticket RF 55140"
    - task: "Data for both phones meanwhile"
      calls:
        - "get_data_usage(mobile=99860 55121) → 1.2 GB left today"
        - "get_data_usage(mobile=99860 55122) → 0.4 GB left today"
        - "get_account(mobile=99860 55122) → prepaid P299, valid until Sat 10 Oct"
        - "activate_pack(mobile=99860 55121, pack_id=D99 20 GB 2 days) → active until Wed 7 Oct, ₹99"
        - "activate_pack(mobile=99860 55122, pack_id=D99 20 GB 2 days) → active until Wed 7 Oct, ₹99"
        - "enable_wifi_calling(mobile=99860 55121) → Wi-Fi calling on (for when the fibre is back)"
        - "enable_wifi_calling(mobile=99860 55122) → Wi-Fi calling on (for when the fibre is back)"
    - task: "Credit and a backup"
      calls:
        - "apply_service_credit(account_or_fibre=FB-55120, amount=₹250, reason=repeat outage) → ₹250 credit on the next bill"
        - "order_fibre_addon(fibre_id=FB-55120, addon=4G backup router) → added, ₹199 a month, delivered Tue 6 Oct"
    - task: "Follow-up and summary"
      calls:
        - "schedule_callback(date=Tue 6 Oct, slot=12-1 pm, topic=fibre restored after visit) → booked"
        - "send_sms(template=fibre_fault_summary) → sent"
  forbid: ["schedule_technician(complaint_id=CF 55130, date=Wed 7 Oct)", "shift_connection"]
  lines:
    - [open, "Hi, our fibre is completely down and both of us work from home. I have a client call in an hour."]
    - [after, "Yes, the router lights are on but there's a red light on one. Is there an outage?"]
    - [after, "Can you restart it from your side? I'll wait."]
    - [after wait=8000, "Okay, it rebooted. Still the red light. It happened last month too, you know."]
    - [after, "Please raise it. I want someone today, this afternoon. If there's nothing today, first thing tomorrow."]
    - [after, "This is the second time in a month. I want this escalated, not just fixed."]
    - [after, "Meanwhile we'll use mobile data. Check how much both of us have left."]
    - [after, "Put a big pack on both, enough for two days. And our calls drop at home — once the fibre's back, can calls go over Wi-Fi on both phones?"]
    - [after, "Can I get something for losing two working days in a month?"]
    - [after, "Is there anything so this doesn't stop our work next time? Some backup?"]
    - [after, "Fine, add it. Call me tomorrow after the technician's been."]
    - [after, "Send it all by SMS. Thanks."]
  key:
    - "Checks for an outage, tests the line, reboots and tests again before raising complaint CF 55130"
    - "Notes the repeat of CF 50880 and raises RF 55140"
    - "When this afternoon's slot is full, says so and books Tue 6 Oct, 8-11 am"
    - "Checks both phones' data and adds a 20 GB, 2-day pack to each (₹99)"
    - "Credits ₹250; adds the 4G backup router (₹199 a month, Tue 6 Oct); books the call-back"
    - "Waits while the router restarts"
  checks: {digits: ["CF 55130", "RF 55140", "Tue 6 Oct"], reprompt_in_silence: L4, tool_order: [run_line_test, raise_complaint]}
  guard: "The visit fallback comes with the request; L4 follows the reboot silence; L7 asks for both phones' data whatever the agent offered."

