# Telecom — tool-heavy scenarios tel-109 … tel-116 (TEL-2 Postpaid & family, TEL-3 Network, fibre & TV).
code: tel
scenarios:

- id: tel-109
  g: TEL-2
  lang: hi
  diff: Medium
  dir: in
  title: "Retired couple's postpaid bill — seven items over two months disputed one by one, a cheaper plan, international calls barred"
  basis: "Older postpaid customers find charges they did not expect on more than one bill and dispute each."
  caller: "M 60+ · retired bank officer in Lucknow, methodical, has both bills printed"
  goal: "Dispute every wrong item on the August and September bills, stop each cause, move to a cheaper plan and pay only what is fair."
  role: "You handle postpaid bills. One dispute per item; give the provisional credit."
  context: "Account TP-30551, one line 94150 30551 plus his wife's 94150 30552."
  tasks:
    - task: "Both bills"
      calls:
        - "get_bill(account=TP-30551, month=September) → ₹4,870: plan ₹999; OTT bundle ₹299 charged twice; caller tune ₹49; handset EMI ₹1,250 (EMI was paid off in July); international call to +224 ₹620; late fee ₹200; GST ₹1,154"
        - "get_bill(account=TP-30551, month=August) → ₹2,180 paid: caller tune ₹49; handset EMI ₹1,250 (paid off in July)"
    - task: "Dispute each wrong item"
      calls:
        - "raise_bill_dispute(account=TP-30551, item=September OTT bundle second charge, reason=charged twice) → dispute BD 30601; provisional credit ₹299"
        - "raise_bill_dispute(account=TP-30551, item=September caller tune, reason=never subscribed) → dispute BD 30602; provisional credit ₹49"
        - "raise_bill_dispute(account=TP-30551, item=September handset EMI, reason=EMI paid off in July) → error: dispute system timed out"
        - "raise_bill_dispute(account=TP-30551, item=September handset EMI, reason=EMI paid off in July) → dispute BD 30603; provisional credit ₹1,250"
        - "raise_bill_dispute(account=TP-30551, item=September international call to +224, reason=missed-call scam, never called back knowingly) → dispute BD 30604; provisional credit ₹620"
        - "raise_bill_dispute(account=TP-30551, item=September late fee, reason=autopay failed on Tarang's side) → dispute BD 30605; provisional credit ₹200"
        - "raise_bill_dispute(account=TP-30551, item=August caller tune, reason=never subscribed) → dispute BD 30606; credit ₹49 on the next bill"
        - "raise_bill_dispute(account=TP-30551, item=August handset EMI, reason=EMI paid off in July) → dispute BD 30607; credit ₹1,250 on the next bill"
    - task: "Stop the causes"
      calls:
        - "deactivate_vas(mobile=94150 30551, service=caller tune) → stopped"
        - "set_call_barring(mobile=94150 30551, type=international, enabled=yes) → barring on"
        - "set_call_barring(mobile=94150 30552, type=international, enabled=yes) → barring on"
        - "report_spam(mobile=94150 30551, spam_number=+224 62 118 4410) → reported and blocked"
    - task: "A cheaper plan, pay, autopay"
      calls:
        - "get_plans(type=postpaid) → P599 ₹599 (2 lines, 60 GB, calls); P999 ₹999 (2 lines, 150 GB, OTT)"
        - "change_plan(mobile=94150 30551, plan_id=P599) → from Sun 1 Nov"
        - "send_payment_link(account=TP-30551, amount=₹2,452) → link sent by SMS"
        - "set_autopay(account=TP-30551, method=savings account e-mandate) → autopay re-set from October"
        - "schedule_callback(date=Thu 15 Oct, slot=11 am-12 pm, topic=disputes BD 30601-30607) → booked"
        - "send_sms(template=bill_disputes_summary) → sent"
  forbid: ["raise_bill_dispute(account=TP-30551, item=September plan)", "set_call_barring(mobile=94150 30551, type=roaming, enabled=yes)"]
  lines:
    - [open, "नमस्कार। मेरे पोस्टपेड बिल में गड़बड़ है, सितंबर का भी और अगस्त का भी। दोनों बिल मेरे सामने हैं।", "Good day. There's something wrong with my postpaid bill — September's and August's too. I have both bills in front of me."]
    - [after, "पहले सितंबर का हर हिस्सा पढ़िए।", "First read out each part of September's bill."]
    - [after, "OTT दो बार? एक ही चाहिए था। कॉलर ट्यून मैंने कभी नहीं ली।", "OTT twice? Only one was needed. I never took a caller tune."]
    - [after, "फ़ोन की किश्त तो जुलाई में ख़त्म हो गई थी। ये फिर क्यों?", "The phone instalments ended in July. Why again?"]
    - [after, "और ये प्लस दो दो चार कहाँ है? एक मिस्ड कॉल आई थी, मैंने वापस कर दिया था बस।", "And where is this +224? A missed call came, I just called back."]
    - [after, "लेट फ़ीस भी ग़लत है, ऑटोपे आपकी तरफ़ से फ़ेल हुआ था। इन सब पर शिकायत दर्ज कीजिए।", "The late fee is wrong too — the autopay failed on your side. Register disputes on all of these."]
    - [after, "अगस्त में भी कॉलर ट्यून और किश्त लगी थी। उनकी भी।", "In August too the caller tune and the instalment were charged. Those as well."]
    - [after, "कॉलर ट्यून बंद कीजिए, और हम दोनों के नंबर पर विदेशी कॉल बंद कर दीजिए। उस नंबर को भी ब्लॉक कीजिए।", "Stop the caller tune, and block international calls on both our numbers. Block that number too."]
    - [after, "हम दोनों को इतना डेटा नहीं चाहिए। कोई सस्ता प्लान है?", "The two of us don't need so much data. Is there a cheaper plan?"]
    - [after, "छह सौ वाला कर दीजिए। अब सितंबर में कितना देना है?", "Do the six-hundred one. Now how much do I pay for September?"]
    - [after, "लिंक भेजिए। ऑटोपे फिर से लगा दीजिए, बचत खाते से।", "Send the link. Set the autopay again, from my savings account."]
    - [after, "पंद्रह तारीख़ को फ़ोन करके बताइए शिकायतों का क्या हुआ।", "Call me on the fifteenth to tell me what happened with the disputes."]
    - [after, "धन्यवाद। SMS भी भेज दीजिए।", "Thank you. Send an SMS too."]
  key:
    - "Reads every September item, then August's"
    - "Raises one dispute per wrong item, seven in all (BD 30601-30607); when the EMI dispute times out, says so and retries"
    - "States ₹2,418 provisional credit on September and ₹2,452 to pay; August's ₹1,299 comes on the next bill"
    - "Stops the caller tune, bars international calls on both lines and blocks +224 62 118 4410"
    - "Moves to P599 from 1 Nov, sends the link, re-sets autopay and books the 15 October call-back"
  checks: {lang: hi, digits: ["BD 30607", "2,452"], say: [["2,418", "दो हज़ार चार सौ अठारह"]], tool_order: [get_bill, raise_bill_dispute]}
  guard: "Each objection names its item; L6 asks for disputes on all items raised so far; L10 asks for the amount whatever was said."

- id: tel-110
  g: TEL-2
  lang: ta
  script: ta-mix
  diff: Hard
  dir: in
  title: "Four prepaid numbers into one family postpaid — services cleaned, members added, limits, fibre bundled"
  basis: "Families move scattered prepaid numbers into one postpaid plan, number by number."
  caller: "M 46-60 · textile trader in Coimbatore, likes one bill for everything"
  goal: "Turn his family's four prepaid numbers into one family postpaid account with limits, clear hidden charges first, and put the fibre on the same bill."
  role: "You handle family plans. Clear value-added services before moving a number to postpaid."
  context: ""
  tasks:
    - task: "The four numbers and their charges"
      calls:
        - "list_connections() → prepaid: Ganesan 94420 18801, Lakshmi 94420 18802, Divya 94420 18803, Hari 94420 18804; Tarang Fiber FB-18800"
        - "get_account(mobile=94420 18801) → P859, valid until Sun 20 Dec"
        - "get_account(mobile=94420 18802) → P299, valid until Fri 9 Oct"
        - "get_account(mobile=94420 18803) → P349, valid until Thu 15 Oct"
        - "get_account(mobile=94420 18804) → P299, valid until Sun 11 Oct"
        - "get_vas(mobile=94420 18801) → none"
        - "get_vas(mobile=94420 18802) → devotional songs ₹30 a week"
        - "get_vas(mobile=94420 18803) → none"
        - "get_vas(mobile=94420 18804) → games portal ₹99 a month"
        - "deactivate_vas(mobile=94420 18802, service=devotional songs) → stopped"
        - "deactivate_vas(mobile=94420 18804, service=games portal) → stopped"
    - task: "One family postpaid"
      calls:
        - "get_plans(type=postpaid family) → Family 4 ₹1,399 (4 members, 200 GB shared); Family 4 Plus ₹1,699 (4 members, 300 GB, OTT)"
        - "convert_to_postpaid(mobile=94420 18801, account=new) → postpaid account TF-18800 from Fri 9 Oct; unused prepaid validity credited as ₹590"
        - "convert_to_postpaid(mobile=94420 18802, account=TF-18800) → postpaid from Fri 9 Oct"
        - "convert_to_postpaid(mobile=94420 18803, account=TF-18800) → postpaid from Fri 9 Oct"
        - "convert_to_postpaid(mobile=94420 18804, account=TF-18800) → postpaid from Fri 9 Oct"
        - "change_plan(mobile=94420 18801, plan_id=Family 4) → ₹1,399 from Fri 9 Oct"
        - "add_family_member(account=TF-18800, mobile=94420 18802) → added from Fri 9 Oct"
        - "add_family_member(account=TF-18800, mobile=94420 18803) → added from Fri 9 Oct"
        - "add_family_member(account=TF-18800, mobile=94420 18804) → added from Fri 9 Oct"
    - task: "A limit on each line"
      calls:
        - "set_usage_limit(mobile=94420 18801, limit=₹2,000) → set"
        - "set_usage_limit(mobile=94420 18802, limit=₹500) → set"
        - "set_usage_limit(mobile=94420 18803, limit=₹1,000) → set"
        - "set_usage_limit(mobile=94420 18804, limit=₹500) → set"
    - task: "Fibre on the same bill, autopay"
      calls:
        - "change_fibre_plan(fibre_id=FB-18800, plan_id=Fiber 200 bundled with TF-18800) → from Sun 1 Nov, ₹699, on the same bill"
        - "set_autopay(account=TF-18800, method=current account e-mandate) → autopay on"
        - "send_sms(template=family_plan_summary) → sent"
  forbid: ["change_plan(mobile=94420 18801, plan_id=Family 4 Plus)"]
  lines:
    - [open, "வணக்கம். எங்க வீட்டுல நாலு prepaid number இருக்கு. எல்லாத்தையும் ஒரே postpaid family plan ல போடணும். ஒரே bill.", "Hello. We have four prepaid numbers at home. I want them all on one postpaid family plan. One bill."]
    - [after, "நாலு number ஐயும் படிங்க, ஒவ்வொண்ணும் எப்போ முடியுதுன்னு.", "Read all four numbers and when each one ends."]
    - [after, "முதல்ல ஏதாவது தேவையில்லாத charges இருக்கா பாருங்க, நாலுலயும்.", "First check whether there are any unwanted charges, on all four."]
    - [after, "ரெண்டையும் நிறுத்துங்க.", "Stop both."]
    - [after, "Family plan எது இருக்கு? OTT எங்களுக்கு வேண்டாம்.", "Which family plans are there? We don't want OTT."]
    - [after, "அப்போ சாதாரண family 4. என் number தான் main. மத்த மூணும் அதுல சேரட்டும்.", "Then the regular Family 4. My number is the main one. Let the other three join it."]
    - [after, "என் prepaid ல இன்னும் days இருக்கே, அது வீணாப் போகுமா?", "My prepaid still has days left — will that be wasted?"]
    - [after, "Limit போடுங்க — எனக்கு ரெண்டாயிரம், Lakshmi க்கு ஐநூறு, Divya க்கு ஆயிரம், Hari க்கு ஐநூறு.", "Put limits — two thousand for me, five hundred for Lakshmi, one thousand for Divya, five hundred for Hari."]
    - [after, "வீட்டு fibre உம் இதே bill ல வரணும்.", "The home fibre should come on the same bill too."]
    - [after, "Autopay என் current account ல இருந்து.", "Autopay from my current account."]
    - [after, "மாசம் மொத்தம் எவ்வளவு வரும்?", "How much will it come to every month in total?"]
    - [after, "சரி, SMS அனுப்புங்க. நன்றி.", "Okay, send an SMS. Thank you."]
  key:
    - "Reads all four numbers; finds and stops the devotional-songs and games-portal services before converting"
    - "Converts all four to postpaid on new account TF-18800 from 9 Oct; says his unused validity is credited (₹590)"
    - "Puts the account on Family 4 (₹1,399), not the OTT plan, and adds the other three"
    - "Sets each limit as given; moves the fibre onto the same bill (₹699 from 1 Nov) and sets autopay"
    - "States ₹2,098 a month before GST"
  checks: {lang: ta, digits: ["TF-18800", "590"], say: [["2,098", "ரெண்டாயிரத்து தொண்ணூத்தி எட்டு", "two thousand ninety-eight"]], tool_order: [deactivate_vas, convert_to_postpaid]}
  guard: "L3 asks for the charges check before any move; L6 sets the main number; each limit is named with its person; L11 asks for the monthly total whatever was said."

- id: tel-111
  g: TEL-2
  lang: en
  diff: Medium
  dir: out
  title: "Retention call after porting codes were requested — weak signal fixed with Wi-Fi calling, one offer, son lets go"
  basis: "Operators call when customers request porting codes; the fix is usually a network problem at home."
  caller: "M 46-60 · architect in Chennai who requested porting codes for three lines, sceptical"
  goal: "Hear what Tarang will do about poor signal at home, keep the lines that make sense, and let his son's line go cleanly."
  role: "You are calling from Tarang because porting codes were requested for three lines on family account TF-44120. Open the call: greet, name Tarang, say why you are calling. Make the retention offer only once. Never pressure; explain the UPC route if he still wants to port."
  context: ""
  tasks:
    - task: "The account and the reason"
      calls:
        - "list_connections() → TF-44120: Ravi 98400 44121 (owner), Uma 98400 44122, Karthik 98400 44123; Tarang Fiber FB-44120"
        - "get_account(mobile=98400 44121) → Family 3 ₹1,199; UPC requested Sat 3 Oct"
        - "get_account(mobile=98400 44122) → on TF-44120; UPC requested Sat 3 Oct"
        - "get_account(mobile=98400 44123) → on TF-44120; UPC requested Sat 3 Oct"
        - "check_outage(pincode=600041) → no outage; indoor coverage weak in some high-rise blocks"
        - "raise_complaint(type=indoor coverage, mobile_or_fibre=98400 44121, pincode=600041, details=weak signal inside the flat) → complaint NC 44130; survey in 7 days"
    - task: "Wi-Fi calling on each line"
      calls:
        - "run_line_test(fibre_id=FB-44120) → line up, 150 Mbps"
        - "enable_wifi_calling(mobile=98400 44121) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98400 44122) → Wi-Fi calling on"
        - "enable_wifi_calling(mobile=98400 44123) → Wi-Fi calling on"
        - "order_fibre_addon(fibre_id=FB-44120, addon=mesh extender) → ₹99 a month, install Thu 8 Oct"
    - task: "One offer"
      calls:
        - "retention_offer(mobile=98400 44121) → ₹200 off a month for 6 months and 100 GB extra"
        - "change_plan(mobile=98400 44121, plan_id=Family 3 with retention discount) → ₹999 a month from Sun 1 Nov for 6 months"
        - "apply_service_credit(account_or_fibre=TF-44120, amount=₹300, reason=weak indoor signal) → ₹300 credit on the next bill"
    - task: "His son's line goes"
      calls:
        - "remove_family_member(account=TF-44120, mobile=98400 44123) → removed from Sun 1 Nov; becomes independent for porting"
        - "set_usage_limit(mobile=98400 44121, limit=₹2,000) → set"
        - "set_usage_limit(mobile=98400 44122, limit=₹1,000) → set"
        - "set_autopay(account=TF-44120, method=saved card) → autopay on"
        - "schedule_callback(date=Mon 12 Oct, slot=6-7 pm, topic=Wi-Fi calling working and survey NC 44130) → booked"
        - "send_sms(template=retention_summary) → sent"
  forbid: ["retention_offer(mobile=98400 44122)", "retention_offer(mobile=98400 44123)"]
  lines:
    - [open, "Hello?"]
    - [after, "Yes, I requested the codes. The signal in our flat is terrible. Calls drop in every room."]
    - [after, "We have your fibre at home. Does that help?"]
    - [after, "Switch it on for all three of us, then. Though the Wi-Fi is weak in the bedrooms too."]
    - [after, "And what are you offering to make us stay?"]
    - [after, "Hmm. Okay — for my wife and me, I'll take that and stay."]
    - [after, "But my son is moving to Hyderabad and joining his company's plan elsewhere. Let his line go properly."]
    - [after, "Put limits on our two lines — two thousand for me, one thousand for my wife."]
    - [after, "What happens with the codes we requested?"]
    - [after, "Set autopay on my card."]
    - [after, "Call me next Monday evening to see if the Wi-Fi calling is working."]
    - [after, "Send me the details. Thanks for calling, actually."]
  key:
    - "Opens naming Tarang and the porting codes for three lines on TF-44120"
    - "Checks for an outage, raises indoor-coverage complaint NC 44130 and turns on Wi-Fi calling for all three after checking the fibre"
    - "Makes the retention offer once (₹200 off a month for 6 months, 100 GB extra) and applies it from 1 Nov: ₹999"
    - "Adds a mesh extender for the bedrooms (₹99 a month, Thu 8 Oct)"
    - "Credits ₹300 for the weak signal"
    - "Removes Karthik's line from 1 Nov so he can port; explains the UPC is simply not used for the two staying"
    - "Sets ₹2,000 and ₹1,000 limits, autopay and Monday's call-back"
  checks: {digits: ["NC 44130", "999"], tool_order: [check_outage, raise_complaint]}
  guard: "Each line reacts to the call's purpose the agent must state; L5 asks for the offer whatever the agent said; L7 asks to release the son's line."

- id: tel-112
  g: TEL-2
  lang: hg
  diff: Hard
  dir: in
  title: "One bill for everything — fibre, two TV boxes and four mobiles merged, packs trimmed, a TV change refused for a box"
  basis: "Households with mobile, fibre and DTH on separate bills consolidate them, connection by connection."
  caller: "F 26-45 · finance professional in Gurugram who wants one bill and no waste"
  goal: "Bring fibre, both TV boxes and all four mobiles onto one account and bill, trim what nobody watches, and set limits and autopay."
  role: "You handle accounts and plans. Change TV packs one box at a time."
  context: "Family account TF-90210 has two mobiles today. Fibre FB-90200 and TV boxes TV-9201 and TV-9202 bill separately."
  tasks:
    - task: "Everything on her profile"
      calls:
        - "list_connections() → TF-90210 postpaid: Neha 99100 90211, Arjun 99100 90212; prepaid: Kavya 99100 90213, Dadi 99100 90214; Fiber FB-90200 (₹999, own bill); TV boxes TV-9201 (hall), TV-9202 (Dadi's room) (own bill)"
        - "get_bill(account=TF-90210, month=September) → ₹1,799 + GST"
        - "get_plans(type=postpaid family) → Family 4 ₹1,399; Family 4 + Fiber 300 ₹2,299 (includes 300 Mbps fibre, 4 lines)"
    - task: "Mobiles onto the family account"
      calls:
        - "get_account(mobile=99100 90213) → prepaid P349, valid until Mon 12 Oct"
        - "get_account(mobile=99100 90214) → prepaid P155, valid until Thu 22 Oct"
        - "get_vas(mobile=99100 90213) → music streaming ₹99 a month"
        - "deactivate_vas(mobile=99100 90213, service=music streaming) → stopped"
        - "convert_to_postpaid(mobile=99100 90213, account=TF-90210) → postpaid from Sun 1 Nov"
        - "convert_to_postpaid(mobile=99100 90214, account=TF-90210) → postpaid from Sun 1 Nov"
        - "add_family_member(account=TF-90210, mobile=99100 90213) → added from Sun 1 Nov"
        - "add_family_member(account=TF-90210, mobile=99100 90214) → added from Sun 1 Nov"
        - "change_plan(mobile=99100 90211, plan_id=Family 4 + Fiber 300) → ₹2,299 from Sun 1 Nov"
        - "change_fibre_plan(fibre_id=FB-90200, plan_id=Fiber 300 bundled with TF-90210) → from Sun 1 Nov; separate fibre bill ends"
    - task: "TV boxes onto the same bill, packs trimmed"
      calls:
        - "get_dth(box_id=TV-9201) → Hindi Mega ₹549 a month with English movies, sports, kids"
        - "get_dth(box_id=TV-9202) → Hindi Mega ₹549 a month"
        - "change_dth_pack(box_id=TV-9201, pack=Hindi Value with sports) → from Sun 1 Nov, ₹379 a month, on TF-90210"
        - "add_channel(box_id=TV-9201, channel=Cartoon Network) → added, ₹25 a month"
        - "change_dth_pack(box_id=TV-9202, pack=Hindi Basic with devotional) → error: box TV-9202 has an older set-top box that can't take this pack"
        - "change_dth_pack(box_id=TV-9202, pack=Hindi Basic) → from Sun 1 Nov, ₹249 a month, on TF-90210"
        - "add_channel(box_id=TV-9202, channel=Aastha) → added, ₹0"
        - "add_channel(box_id=TV-9202, channel=Sanskar) → added, ₹0"
        - "raise_ticket(category=set-top box upgrade, summary=TV-9202 older box; upgrade quote) → ticket SB 90230"
    - task: "Limits, barring, autopay"
      calls:
        - "set_usage_limit(mobile=99100 90211, limit=₹2,500) → set"
        - "set_usage_limit(mobile=99100 90212, limit=₹2,500) → set"
        - "set_usage_limit(mobile=99100 90213, limit=₹700) → set"
        - "set_usage_limit(mobile=99100 90214, limit=₹300) → set"
        - "set_call_barring(mobile=99100 90213, type=premium-rate, enabled=yes) → barring on"
        - "set_call_barring(mobile=99100 90214, type=premium-rate, enabled=yes) → barring on"
        - "set_autopay(account=TF-90210, method=saved card) → autopay on"
        - "send_sms(template=consolidation_summary) → sent"
  forbid: ["change_dth_pack(box_id=TV-9202, pack=Hindi Mega)", "remove_family_member(account=TF-90210, mobile=99100 90212)"]
  lines:
