  lines:
    - [open, "నమస్కారం. వచ్చే శనివారం మేము కొత్త flat కి shift అవుతున్నాం. Fibre, రెండు TV boxes అన్నీ మార్చాలి.", "Hello. We're moving to a new flat next Saturday. The fibre and both TV boxes all need moving."]
    - [after, "కొత్త address — Flat five zero two, Aparna Towers, Narsingi, five zero zero zero eight nine. అక్కడ Tarang fibre వస్తుందా?", "The new address — Flat 502, Aparna Towers, Narsingi, 500089. Does Tarang fibre reach there?"]
    - [after, "శనివారమే shift చేయండి. అప్పుడే plan కూడా మూడు వందల Mbps కి పెంచండి. కొత్త flat పెద్దది, ఒక extender కూడా.", "Shift it on Saturday itself. Raise the plan to 300 Mbps at the same time. The new flat is bigger — an extender too."]
    - [after, "ఇప్పుడు TV. రెండు boxes ఏ pack లో ఉన్నాయి?", "Now the TV. Which pack are the two boxes on?"]
    - [after, "రెండూ శనివారం కొత్త flat కి రావాలి.", "Both should come to the new flat on Saturday."]
    - [after, "Bedroom box — అమ్మది — basic చేయండి, Bhakti TV మాత్రం ఉండాలి. Hall box అలాగే ఉంచండి, Star Sports Telugu add చేయండి.", "The bedroom box — Amma's — make it basic, but Bhakti TV must be there. Keep the hall box as it is, and add Star Sports Telugu."]
    - [after, "పాత address లో ఏమైనా bill బాకీ ఉందా?", "Is any bill pending at the old address?"]
    - [after, "Link పంపండి. ఇక నుంచి autopay పెట్టండి, UPI తో.", "Send the link. Set autopay from now on, with UPI."]
    - [after, "కొత్త flat లో signal సరిగా రాదని విన్నాను. రెండు phones కి Wi-Fi calling పెట్టండి.", "I've heard the signal is poor in the new flat. Turn on Wi-Fi calling on both phones."]
    - [after, "శనివారం సాయంత్రం అన్నీ పనిచేస్తున్నాయా అని ఒకసారి call చేయండి.", "Call once on Saturday evening to check everything is working."]
    - [after, "SMS పంపండి. Thanks అండి.", "Send an SMS. Thank you."]
    - [after, "సరే, bye.", "Okay, bye."]
  key:
    - "Checks the new pincode and shifting feasibility; books shifting SH 60320 for Sat 10 Oct (₹500)"
    - "Moves the plan to Fiber 300 and adds a mesh extender from moving day"
    - "Raises a shifting ticket for each TV box (DS 60331, DS 60332)"
    - "Sets the bedroom box to Telugu Basic with Bhakti TV, keeps the hall box and adds Star Sports 1 Telugu"
    - "Sends the ₹826 link, sets UPI autopay, turns on Wi-Fi calling for both phones and books Saturday's call-back"
  checks: {lang: te, digits: ["SH 60320", "DS 60332", "826"], tool_order: [shift_connection, change_fibre_plan]}
  guard: "The address comes before the feasibility question; each box's change names the room; L7 asks about the old bill whatever the agent said."
