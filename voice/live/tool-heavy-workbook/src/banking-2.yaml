        - "raise_dispute(txn_ref=IM 8015 0940, reason=fraud, OTP obtained by a fake KYC call) → dispute DS 83310, receiving bank asked to hold funds"
        - "raise_dispute(txn_ref=IM 8015 0952, reason=fraud, OTP obtained by a fake KYC call) → dispute DS 83311, receiving bank asked to hold funds"
        - "raise_dispute(txn_ref=DC 8023 1015, reason=fraud, OTP obtained by a fake KYC call) → dispute DS 83312"
    - task: "Her card and the payee"
      calls:
