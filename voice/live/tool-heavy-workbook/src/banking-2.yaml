    - [after b, "ఎవరో ఫోన్ చేసి KYC అయిపోయిందన్నారు. OTP అడిగారు, చెప్పేశాను. అన్నీ ఆపేయండమ్మా.", "Someone called and said my KYC had run out. They asked for the OTP and I told them. Please stop everything."]
    - [after b, "ఎంత డబ్బు పోయింది?", "How much money has gone?"]
    - [after b, "అన్నిటికీ complaint పెట్టండి.", "Put complaints on all of them."]
