# Banking & insurance — tool-heavy scenarios bank-109 … bank-116 (BANK-4 Fraud, BANK-2 Payments).
code: bank
scenarios:

- id: bank-109
  g: BANK-4
  lang: hi
  diff: Hard
  dir: in
  title: "SIM swap on an elderly father — two accounts, UPI, IMPS and a card charge, nothing sent to the stolen number"
  basis: "SIM-swap fraud takes over the registered mobile; the family has to freeze every channel without using that number."
  caller: "M 26-45 · son in Jaipur, angry and anxious; speaker b: M 60+ · his father, the account holder, slow and confused"
  goal: "Stop every channel on both accounts and both cards, complain about every debit, remove the fraudster's payee, check the FD and arrange the branch visit."
  role: "You handle fraud. The father's SIM has been taken over, so the registered mobile is with the fraudster: send nothing to it. Verify the father, whose accounts these are. Contact details change only at a branch."
  context: "Statements can be emailed; the email on the account was not changed."
  tasks:
    - task: "Verify the father and see what happened"
      calls:
        - "verify_caller(name=Mohanlal Sharma, dob=4 Jul 1952) → verified"
        - "get_accounts(holder=Mohanlal Sharma) → pension savings 6021 with debit card 6047; savings 6039; credit card 1188; FD 7730"
        - "get_login_activity() → Sun 4 Oct 7:05 pm mobile banking registered on a new SIM; 7:10 pm device Vivo Y20 in Asansol; 7:14 pm payee Deepak K added"
    - task: "Freeze every channel"
      calls:
        - "block_netbanking(reason=SIM swap) → frozen, NB 41180"
        - "logout_device(device=Vivo Y20, Asansol) → session ended, device removed"
        - "set_upi_status(account_last4=6021, enabled=no) → UPI off"
        - "set_upi_status(account_last4=6039, enabled=no) → UPI off"
    - task: "Complaints for the UPI debits on the pension account"
      calls:
        - "get_transactions(account_last4=6021, from_date=Sun 4 Oct, to_date=Mon 5 Oct) → Sun 4 Oct 7:20 pm UPI ₹40,000 to Deepak K, UTR 6278 4410 1101; 7:35 pm UPI ₹40,000, UTR 6278 4410 1102; today 8:15 am UPI ₹20,000, UTR 6278 4410 1103"
        - "raise_upi_complaint(utr=6278 4410 1101, reason=SIM swap fraud) → complaint UC 31001, 30 days"
        - "raise_upi_complaint(utr=6278 4410 1102, reason=SIM swap fraud) → complaint UC 31002, 30 days"
        - "raise_upi_complaint(utr=6278 4410 1103, reason=SIM swap fraud) → complaint UC 31003, 30 days"
    - task: "The IMPS from the second account"
      calls:
        - "get_transactions(account_last4=6039, from_date=Sun 4 Oct, to_date=Mon 5 Oct) → today 8:40 am IMPS ₹49,500 to Deepak K, ref IM 6039 0840"
        - "raise_dispute(txn_ref=IM 6039 0840, reason=SIM swap fraud) → dispute DS 31010, receiving bank asked to hold funds"
    - task: "Remove the fraudster's payee"
      calls:
        - "get_beneficiaries(account_last4=6021) → Deepak K (added Sun 4 Oct), Sunita Sharma (2019)"
        - "delete_beneficiary(account_last4=6021, name=Deepak K) → removed"
    - task: "Both cards"
      calls:
        - "block_card(card_last4=6047, reason=SIM swap fraud) → blocked, BL 31020"
        - "block_card(card_last4=1188, reason=SIM swap fraud) → blocked, BL 31021"
        - "get_transactions(card_last4=1188, from_date=Sun 4 Oct, to_date=Mon 5 Oct) → today 9:02 am ₹24,999 Amazon gift card, ref CC 1188 0902"
        - "raise_dispute(txn_ref=CC 1188 0902, reason=SIM swap fraud) → dispute DS 31011"
        - "reissue_card(card_last4=6047, deliver_to=home) → new card ending 6055, dispatched Wed 7 Oct"
        - "reissue_card(card_last4=1188, deliver_to=home) → new card ending 1196, dispatched Wed 7 Oct"
    - task: "The FD"
      calls:
        - "get_fd(fd_last4=7730) → ₹5,00,000 at 7.4%, matures 12 Mar 2027; a premature closure was requested online today at 9:20 am and is on hold: it needs a signature at the branch"
    - task: "Report, branch visit, statements by email"
      calls:
        - "raise_ticket(category=cyber fraud, summary=SIM swap; three UPI, one IMPS and one card charge) → ticket FR 66214"
        - "find_branch(area=Malviya Nagar, Jaipur) → Kosh Bank Malviya Nagar, KB-0219, 9:30 am-4:30 pm"
        - "book_branch_visit(branch_id=KB-0219, date=Tue 6 Oct, slot=11:00 am, purpose=register new SIM, cancel the FD closure request, reopen netbanking) → appointment BV 31044"
        - "request_statement(account_last4=6021, kind=last 7 days, by email) → emailed"
        - "request_statement(account_last4=6039, kind=last 7 days, by email) → emailed"
  forbid: [send_sms, update_contact]
  lines:
    - [open, "नमस्ते, मेरे पिताजी के खाते से पैसे निकल गए हैं। कल शाम से उनका फ़ोन बंद है, सिम काम नहीं कर रहा। मैं उनका बेटा अजय बोल रहा हूँ।", "Hello, money has gone from my father's account. His phone has been dead since yesterday evening, the SIM isn't working. This is his son Ajay."]
    - [after, "पापा मेरे साथ ही हैं, उनसे बात कर लीजिए।", "Papa is right here with me, speak to him."]
    - [after b, "हाँ जी, मैं मोहनलाल शर्मा। जन्मतिथि चार जुलाई उन्नीस सौ बावन।", "Yes, I'm Mohanlal Sharma. Date of birth fourth July 1952."]
    - [after b, "मुझे तो कुछ समझ नहीं आ रहा। जो भी हो रहा है, सब रोक दीजिए।", "I don't understand any of this. Whatever is happening, stop it all."]
    - [after, "पापा के दो बचत खाते हैं, दोनों में UPI बंद कर दीजिए। कितने पैसे गए हैं?", "Papa has two savings accounts; turn off UPI on both. How much money has gone?"]
    - [after, "सबकी शिकायत डाल दीजिए। ये दीपक कौन है? उसे हटा दीजिए। सुनीता मेरी बहन है, उसे रहने दीजिए।", "Raise complaints on all of them. Who is this Deepak? Remove him. Sunita is my sister, leave her."]
    - [after b, "मेरे दोनों कार्ड भी बंद कर दो — एटीएम वाला और क्रेडिट कार्ड।", "Block both my cards as well — the ATM card and the credit card."]
    - [after, "क्रेडिट कार्ड पर भी कुछ ख़र्च हुआ है क्या?", "Has anything been spent on the credit card too?"]
    - [after, "उसकी भी शिकायत कीजिए। नए कार्ड घर भेज दीजिए।", "Raise a complaint on that too. Send new cards home."]
    - [after b, "मेरी पाँच लाख की एफ़डी है, वो ठीक है न?", "I have a five-lakh FD — that's safe, isn't it?"]
    - [after, "उस नंबर पर कोई SMS मत भेजिए, वो अब उनके पास है। मेरे नंबर पर भेज दीजिए — नौ आठ दो नौ...", "Don't send any SMS to that number, they have it now. Send it to my number — nine eight two nine..."]
    - [after, "तो अब नया सिम लेकर क्या करना है?", "So what do we do now with a new SIM?"]
    - [after, "मालवीय नगर ब्रांच पास है। कल सुबह ग्यारह बजे हो सकता है?", "The Malviya Nagar branch is close. Can it be tomorrow at eleven in the morning?"]
    - [after, "दोनों खातों का स्टेटमेंट ईमेल पर भेज दीजिए, पुलिस को देना है।", "Email the statements for both accounts; we need to give them to the police."]
    - [after, "ठीक है, धन्यवाद।", "Okay, thank you."]
  key:
    - "Verifies the father, then freezes netbanking, logs out the Asansol device and turns UPI off on 6021 and 6039"
    - "Raises one UPI complaint per debit (UC 31001-31003) and disputes the ₹49,500 IMPS (DS 31010)"
    - "Removes Deepak K, keeps Sunita; blocks 6047 and 1188, disputes the ₹24,999 charge and reissues both"
    - "Says the FD is safe and its closure request is on hold until a branch signature"
    - "Sends nothing to the stolen number and does not add the son's number; explains the branch will register the new SIM"
    - "Books Malviya Nagar for Tue 6 Oct at 11:00 am (BV 31044), emails both statements, tells them to report it on 1930"
  checks: {lang: hi, digits: ["UC 31003", "DS 31010", "BV 31044"], say: [["1930", "उन्नीस सौ तीस", "एक नौ तीन शून्य"]], tool_order: [block_netbanking, raise_upi_complaint]}
  guard: "Father and son each ask only for what their earlier lines set up; L11 is refused whatever the agent offered before; L13 proposes a time whether or not the agent named a branch."

- id: bank-110
  g: BANK-4
  lang: hg
  diff: Hard
  dir: in
  title: "Screen-sharing app scam — devices out, UPI checks and complaints, card replaced, UPI kept off"
  basis: "Fake customer-care numbers get people to install remote-access apps and then move money while they watch."
  caller: "M 26-45 · shop owner in Lucknow, embarrassed and in a hurry"
  goal: "Cut off the scammer, complain about every payment that went through, replace his card and get his UPI back for the shop."
  role: "You handle fraud. After a remote-access scam, UPI and netbanking stay off until the phone is reset and the customer re-registers at a branch."
  context: ""
  tasks:
    - task: "Verify and see the sessions"
      calls:
        - "verify_caller(name=Imran Qureshi, dob=19 Apr 1984) → verified"
        - "get_login_activity() → today 9:50 am login on his Samsung M31 with a screen-sharing app running; 10:02 am payee Rakesh Mishra added; 10:05 am unknown laptop in Ranchi"
    - task: "Cut the scammer off"
      calls:
        - "logout_device(device=unknown laptop, Ranchi) → session ended, device removed"
        - "logout_device(device=Samsung M31) → session ended, device removed"
        - "block_netbanking(reason=remote-access scam) → frozen, NB 52201"
        - "set_upi_status(account_last4=3356, enabled=no) → UPI off"
    - task: "Check each payment"
      calls:
        - "get_transactions(account_last4=3356, from_date=Mon 5 Oct, to_date=Mon 5 Oct) → 10:04 am UPI ₹25,000 to rakesh.m@ybl, UTR 6281 0042 7701; 10:07 am UPI ₹25,000, UTR 6281 0042 7702; 10:11 am UPI ₹9,999, UTR 6281 0042 7703; 10:15 am IMPS ₹45,000 to Rakesh Mishra, ref IM 3356 1015"
        - "check_upi_txn(utr=6281 0042 7701) → success, credited to rakesh.m@ybl"
        - "check_upi_txn(utr=6281 0042 7702) → success, credited to rakesh.m@ybl"
        - "check_upi_txn(utr=6281 0042 7703) → failed at the payee bank; ₹9,999 will be reversed by Wed 7 Oct"
    - task: "Complaints and dispute for what went through"
      calls:
        - "raise_upi_complaint(utr=6281 0042 7701, reason=remote-access fraud) → error: complaint system timed out"
        - "raise_upi_complaint(utr=6281 0042 7701, reason=remote-access fraud) → complaint UC 52110, 30 days"
        - "raise_upi_complaint(utr=6281 0042 7702, reason=remote-access fraud) → complaint UC 52111, 30 days"
        - "raise_dispute(txn_ref=IM 3356 1015, reason=remote-access fraud) → dispute DS 52120, receiving bank asked to hold funds"
    - task: "Remove the payee"
      calls:
        - "get_beneficiaries(account_last4=3356) → Rakesh Mishra (added today), Qureshi Traders (2020)"
        - "delete_beneficiary(account_last4=3356, name=Rakesh Mishra) → removed"
    - task: "His debit card was on the screen"
      calls:
        - "block_card(card_last4=3364, reason=card shown during remote-access fraud) → blocked, BL 52130"
        - "reissue_card(card_last4=3364, deliver_to=home) → new card ending 3372, dispatched Wed 7 Oct"
    - task: "Report, follow-up, summary"
      calls:
        - "raise_ticket(category=cyber fraud, summary=remote-access app; two UPI and one IMPS) → ticket FR 52140"
        - "schedule_callback(date=Wed 7 Oct, slot=5-6 pm, topic=UPI reversal 6281 0042 7703 and fraud complaints) → booked"
        - "send_sms(template=fraud_case_summary) → sent"
  forbid: ["set_upi_status(account_last4=3356, enabled=yes)", transfer_funds]
  lines:
    - [open, "Hello, mujhse fraud ho gaya hai. Ek customer care wale ne app download karwaya, aur ab paise kat rahe hain.", "Hello, I've been defrauded. A customer-care person made me download an app, and now money is being taken."]
    - [after, "Imran Qureshi. Date of birth unnees April unnees sau chauraasi.", "Imran Qureshi. Date of birth nineteenth April 1984."]
    - [after, "Woh app abhi bhi phone pe hai. Kya karoon? Pehle sab band karo!", "That app is still on my phone. What do I do? Shut everything first!"]
    - [after, "Haan, uninstall kar raha hoon. Ab bataiye kitne paise gaye?", "Yes, I'm uninstalling it. Now tell me how much has gone?"]
    - [after, "Chaaron check karo, kaun sa gaya kaun sa nahi.", "Check all four, which went through and which didn't."]
    - [after, "Jo gaye hain un sab pe complaint daalo.", "Raise complaints on all the ones that went through."]
    - [after, "Usne Rakesh Mishra naam ka payee bhi add kiya tha. Qureshi Traders mera hai.", "He also added a payee called Rakesh Mishra. Qureshi Traders is mine."]
    - [after, "Mera debit card bhi screen pe dikh gaya tha. Usko band karke naya bhejo.", "My debit card showed on the screen too. Block it and send a new one."]
    - [after, "Ek baat — dukaan ke payments UPI pe aate hain. UPI aaj hi wapas chalu kar do na, please.", "One thing — the shop's payments come on UPI. Please switch UPI back on today."]
    - [after, "Achha, toh phone reset karke branch jaana padega. Theek hai.", "Okay, so I have to reset the phone and go to the branch. Fine."]
    - [after, "Woh nau hazaar wala kab wapas aayega?", "When will the nine-thousand one come back?"]
    - [after, "Mujhe Wednesday shaam ko call kar dena, sab ka update dena.", "Call me on Wednesday evening with an update on everything."]
    - [after, "Aur SMS bhej do. Thank you, bhai.", "And send an SMS. Thank you, brother."]
  key:
    - "Logs out the Ranchi laptop and his own phone, freezes netbanking and turns UPI off before anything else"
    - "Checks each UPI payment: 7701 and 7702 went through, 7703 failed and will be reversed by 7 October"
    - "Raises complaints on 7701 (after the timeout, says so and retries) and 7702, and disputes the ₹45,000 IMPS"
    - "Removes Rakesh Mishra, keeps Qureshi Traders; blocks 3364 and reissues as 3372"
    - "Refuses to switch UPI back on today and explains the reset and branch step"
    - "Tells him to report it on 1930, books the Wednesday call-back and sends the SMS; never asks for an OTP"
  checks: {lang: hg, digits: ["UC 52110", "UC 52111", "DS 52120", "3372"], say: [["1930", "unnees sau tees", "nineteen thirty", "one nine three zero"]], tool_order: [logout_device, raise_upi_complaint]}
  guard: "L3 asks to stop everything whatever the agent said about the app; L5 asks for every payment checked; L9 must be refused; L10 accepts any explanation of the branch step."

- id: bank-111
  g: BANK-4
  lang: ta
  script: ta-mix
  diff: Medium
  dir: in
  title: "Lost phone, calling from a friend's — UPI and wallets off, bills that run on UPI rearranged"
  basis: "A lost phone carries UPI, wallets and card tokens; bills paid by UPI then need another route until the new SIM comes."
  caller: "F 26-45 · office worker in Chennai, calling from a colleague's phone, composed"
  goal: "Shut UPI and phone payments on both accounts and both cards, check nothing was misused, keep rent, the cook and school fees going, and get UPI back after the new SIM."
  role: "You handle security. The caller is not on the registered mobile: verify her by name and date of birth. The registered mobile is the lost phone, so send nothing to it."
  context: "Rent and the cook's salary normally go by UPI on the 7th."
  tasks:
    - task: "Verify and check the phone's sessions"
      calls:
        - "verify_caller(name=Lakshmi Narayanan, dob=23 Mar 1991) → verified"
        - "get_accounts() → savings 6610 with debit card 6636; salary savings 6628; credit card 4490"
        - "get_login_activity() → OnePlus 11 last active today 8:20 am in Chennai; no new devices or changes"
    - task: "Shut the phone out"
      calls:
        - "logout_device(device=OnePlus 11) → session ended, device removed"
        - "set_upi_status(account_last4=6610, enabled=no) → UPI off"
        - "set_upi_status(account_last4=6628, enabled=no) → UPI off"
        - "set_card_control(card_last4=6636, channel=phone wallet, enabled=no) → updated"
        - "set_card_control(card_last4=4490, channel=phone wallet, enabled=no) → updated"
    - task: "Check nothing was misused"
      calls:
        - "get_transactions(account_last4=6610, from_date=Sun 4 Oct, to_date=Mon 5 Oct) → only her usual payments; nothing after 8:20 am"
        - "get_transactions(card_last4=4490, from_date=Sun 4 Oct, to_date=Mon 5 Oct) → only her usual payments; nothing after 8:20 am"
    - task: "Autopays"
      calls:
        - "get_mandates(account_last4=6628) → none"
        - "get_mandates(account_last4=6610) → MD 4101 electricity ₹2,100 on the 7th; MD 4102 Jio postpaid on the 8th; MD 4103 SIP ₹5,000 on the 10th; MD 4104 old gym, failing since August"
        - "cancel_mandate(mandate_id=MD 4104) → cancelled"
    - task: "Rent and the cook by standing instruction, school fee by NEFT"
      calls:
        - "get_beneficiaries(account_last4=6610) → Raghavan (landlord, 2023), Ponni (cook, 2024)"
        - "set_standing_instruction(from_account_last4=6610, to=Raghavan, amount=₹18,000, day=7) → SI 64471, first on 7 Oct"
        - "set_standing_instruction(from_account_last4=6610, to=Ponni, amount=₹6,000, day=7) → SI 64472, first on 7 Oct"
        - "add_beneficiary(account_last4=6610, name=Vidya Mandir School, account_no=4412 0098 7731, ifsc=IOBA0001288) → added; up to ₹50,000 in the first 24 hours"
        - "transfer_funds(from_account_last4=6610, to=Vidya Mandir School, amount=₹14,500, mode=NEFT) → sent, ref NF 64480"
    - task: "Record it and the call-back for UPI"
      calls:
        - "raise_ticket(category=lost phone, summary=UPI and wallets off on 6610, 6628, 6636, 4490) → ticket LP 64490"
        - "schedule_callback(date=Tue 6 Oct, slot=6-7 pm, topic=switch UPI back on after the new SIM) → booked"
  forbid: [send_sms, update_contact]
  lines:
    - [open, "வணக்கம். என் phone தொலைஞ்சு போச்சு, இது என் colleague phone. என் bank account ல UPI எல்லாம் இருக்கு, உடனே நிறுத்தணும்.", "Hello. I lost my phone; this is my colleague's phone. My bank accounts have UPI on it all, I need to stop it right away."]
    - [after, "Lakshmi Narayanan. Date of birth இருபத்தி மூணு March, ஆயிரத்து தொள்ளாயிரத்து தொண்ணூத்தி ஒண்ணு.", "Lakshmi Narayanan. Date of birth twenty-third March 1991."]
    - [after, "காலைல எட்டு மணிக்கு bus ல போச்சுன்னு நினைக்கிறேன். ரெண்டு account லயும் UPI off பண்ணுங்க.", "I think it went on the bus at around eight this morning. Turn UPI off on both accounts."]
    - [after, "என் debit card, credit card ரெண்டும் phone ல tap-to-pay க்கு save பண்ணி இருக்கேன். அதையும் நிறுத்துங்க. Cards என் கிட்ட தான் இருக்கு.", "My debit card and credit card are both saved on the phone for tap-to-pay. Stop that too. The cards themselves are with me."]
    - [after, "யாராவது ஏதாவது பணம் எடுத்திருக்காங்களா? Savings, credit card ரெண்டையும் பாருங்க.", "Has anyone taken any money? Check both the savings account and the credit card."]
    - [after, "நல்லது. இப்போ ஒரு பிரச்சனை — இந்த மாசம் rent, சமையல்காரம்மா சம்பளம் எல்லாம் UPI ல தான் அனுப்புவேன், ஏழாம் தேதி.", "Good. Now one problem — I send the rent and the cook's salary by UPI, on the seventh."]
    - [after, "அப்போ ரெண்டையும் ஏழாம் தேதி automatic ஆ போற மாதிரி பண்ணுங்க. Rent பதினெட்டாயிரம், Ponni க்கு ஆறாயிரம்.", "Then make both go automatically on the seventh. Rent eighteen thousand, six thousand to Ponni."]
    - [after, "School fee பதினாலாயிரத்து ஐநூறு இந்த வாரம் கட்டணும். School account number four four one two, zero zero nine eight, seven seven three one. IFSC I O B A zero zero zero one two eight eight.", "The school fee of fourteen thousand five hundred is due this week. School account number 4412 0098 7731. IFSC IOBA0001288."]
    - [after, "அதை இப்பவே அனுப்புங்க.", "Send it right now."]
    - [after, "ரெண்டு account லயும் இருக்கற autopays ஓடுமா? எதாவது பிரச்சனை ஆகுமா?", "Will the autopays on both accounts run? Will anything be a problem?"]
    - [after, "அந்த gym பழையது, அதை cancel பண்ணிடுங்க.", "That gym one is old, cancel it."]
    - [after, "நாளைக்கு புது SIM வந்துடும். அப்புறம் UPI திரும்ப on பண்ண எனக்கு நாளைக்கு சாயங்காலம் call பண்ணுங்க.", "The new SIM will come tomorrow. Call me tomorrow evening to switch UPI back on."]
    - [after, "எல்லாத்துக்கும் ஒரு SMS அனுப்புங்க.", "Send an SMS for all of it."]
