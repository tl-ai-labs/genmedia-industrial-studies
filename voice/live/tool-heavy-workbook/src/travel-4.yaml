  lines:
    - [open, "Hello, main shaadi ke mehmaanon ki travel sambhal raha hoon. Teen train bookings hain, sab Wednesday ko Jaipur aa rahe hain.", "Hello, I'm handling travel for the wedding guests. There are three train bookings, everyone arrives in Jaipur on Wednesday."]
    - [after, "Pehla PNR six two zero three, one four five, five seven one. Doosra six two zero three, one four five, five eight eight. Teesra six two zero three, one four six, zero zero two.", "First PNR 6203 145 571. Second 6203 145 588. Third 6203 146 002."]
    - [after, "Sab confirm hain na? Aur kaun kab pahunch raha hai?", "Are they all confirmed? And who is arriving when?"]
    - [after, "Har train ke liye station se Hotel Amer View tak ek badi gaadi chahiye, train aane ke pandrah minute baad.", "For each train I need a big car from the station to Hotel Amer View, fifteen minutes after the train arrives."]
    - [after, "Thursday ko sab dasson ko Udaipur jaana hai, subah bus se, Sindhi Camp se.", "On Thursday all ten have to go to Udaipur, by bus in the morning, from Sindhi Camp."]
    - [after, "Seats ek se das tak — jo pehle pahunch rahe hain woh pehle: Bhatt family, phir Mathur, phir Mehta. Family ke andar jaise booking mein naam hain.", "Seats one to ten — whoever arrives first goes first: the Bhatt family, then the Mathurs, then the Mehtas. Within each family, in the order the names are on the booking."]
    - [after, "Thursday subah hotel se Sindhi Camp tak do badi gaadiyan, sawa saat baje.", "On Thursday morning, two big cars from the hotel to Sindhi Camp, at a quarter past seven."]
    - [after, "Aur Sunday ko Bhatt aur Mathur family Udaipur se wapas Jaipur aayegi, subah bus se. Same order, seat ek se.", "And on Sunday the Bhatt and Mathur families come back from Udaipur to Jaipur, by bus in the morning. Same order, from seat one."]
    - [after, "Mehta family apne aap jaayegi, unka wapsi ka kuch mat karna.", "The Mehta family will go on their own, don't book anything for their return."]
    - [after, "Bus ka total kitna hua dono taraf ka?", "What's the bus total for both ways?"]
    - [after, "Sab gaadiyon ke number aur time ek baar bata do.", "Tell me all the car numbers and times once."]
    - [after, "Sab mere number pe SMS kar do.", "SMS everything to my number."]
    - [after, "Thank you, kaam bahut aasaan ho gaya.", "Thank you, that made the job much easier."]
  key:
    - "Confirms all three bookings are CNF and gives each arrival: Bhatts 6:40 am, Mathurs 11:20 am, Mehtas 3:05 pm"
    - "Books RC 7301 at 6:55 am, RC 7302 at 11:35 am, RC 7303 at 3:20 pm"
    - "Books RB 7720 Thursday 8:00 am, seats 1-10: Vijay, Sheela, Ronak Bhatt; Anil, Kiran, Neeraj, Pooja Mathur; Harsh, Nisha, Om Mehta"
