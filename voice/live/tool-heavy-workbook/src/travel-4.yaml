  forbid: ["cancel_train_ticket(pnr=4521776355, passenger=Rajesh Gupta)", "cancel_train_ticket(pnr=4521776355, passenger=Kamla Devi Gupta)"]
  lines:
    - [open, "Hi, I have a Safar train booking for five people to Haridwar on Saturday, and two of us are still waitlisted. P N R four five two one, seven seven six, three zero nine."]
    - [after, "Seven and eight on the waitlist? That won't clear. Is there another train that morning with five seats?"]
    - [after, "Then move all five of us to that train. Cancel all five on the current one. We travel together."]
    - [after, "On the new train, my mother by a window, then me, my wife, and the two kids. If the coach fills up while you're booking, put whoever's left in the next coach."]
    - [after, "How much do we get back for the cancelled tickets, and what's the new fare?"]
    - [after wait=7000, "Sorry, I was checking with my wife. The return is also a problem — P N R four five two one, seven seven six, three five five. The kids are waitlisted there too."]
    - [after, "My wife will come back earlier with the kids. Move the three of them to the afternoon train. Keep my mother and me on ours."]
    - [after, "And on Sunday we want a day trip to Rishikesh by bus. Five seats, in the morning, from Haridwar bus stand."]
    - [after, "Mother in seat one, then me, my wife, Mohit, Pari."]
    - [after, "Cabs: Saturday early from our house in Rohini Sector nine to New Delhi station. Then from Haridwar station to Hotel Har Ki Pauri View when we arrive."]
    - [after, "And on Tuesday, from the hotel to Haridwar station — one cab for my wife and kids in time for their train, and one for my mother and me for ours."]
    - [after, "Okay. Give me all the new coach and seat numbers once."]
    - [after, "Send everything to my phone."]
    - [after, "Thanks, that's a load off my mind."]
  key:
    - "Says plainly that WL 7 and WL 8 are unlikely to clear"
    - "Cancels all five on 29417 (refunds ₹640 ×3 and ₹705 ×2) and books 29419: Kamla C3-21, Rajesh C3-22, Anju C3-23"
    - "When coach C3 fills, says so and books Mohit C4-11 and Pari C4-12"
    - "Checks in once during the 7-second silence"
    - "On the return, moves only Anju, Mohit and Pari to 29458 at 3:10 pm (C1-31 to 33); Rajesh and Kamla stay"
    - "Books bus RB 2201 Sunday 9:00 am, seats 1-5 in the order given"
    - "Books RC 1101 (5:30 am), RC 1102 (12:20 pm), RC 1103 (2:15 pm) and RC 1104 (4:45 pm)"
  checks: {reprompt_in_silence: L6, digits: ["4521 776 309", "C4-11", "C4-12", "29458", "RC 1104"], tool_order: [search_trains, cancel_train_ticket]}
  guard: "The caller decides each move himself and gives the coach fallback with the seat request; the silence comes before a line that starts with an apology, so it fits any check-in."

- id: trv-126
