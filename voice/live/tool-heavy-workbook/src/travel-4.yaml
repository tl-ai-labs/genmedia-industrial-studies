- id: trv-125
  g: TRV-3
  lang: en
  diff: Hard
  dir: in
  title: "Waitlisted family trip — move all five to another train, split the return, a bus day trip, four cabs"
  basis: "Families with part-waitlisted rail tickets rebuild the whole trip so they travel together, with cabs at both ends."
  caller: "M 46-60 · father planning a family pilgrimage, methodical"
  goal: "All five on one train with seats, his wife and kids back earlier, a Rishikesh bus day trip, and cabs for every transfer."
  role: "You handle Safar train and bus bookings and Raahi Cabs. Read 10-digit PNRs in groups. Waitlisted tickets after the chart are not confirmed; say so plainly. State refunds before cancelling."
