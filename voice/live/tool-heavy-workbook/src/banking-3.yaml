    - [after, "ठीक है। पुराने खाते में जो पैसा बचा है, सब नए खाते में डाल दीजिए।", "Fine. Move whatever money is left in the old account to the new one."]
    - [after, "बाइक लोन थोड़ा ही बचा है। उसे बंद कर दीजिए, नए खाते से। पहले रकम बताइए।", "There's only a little left on the bike loan. Close it, from the new account. Tell me the amount first."]
    - [after, "हाँ, बंद कीजिए। NOC भी चाहिए, आरटीओ वाला भी।", "Yes, close it. I need the NOC too, the RTO one as well."]
    - [after, "अब EMI के ऑटो-डेबिट पुराने खाते से हैं। सब नए खाते पर कर दीजिए। बाइक वाला तो अब बंद ही कर दीजिए।", "Now the EMI auto-debits are on the old account. Put them all on the new account. The bike one, just cancel it now."]
    - [after, "पर्सनल लोन में एक लाख जमा कर दूँ तो EMI कितनी हो जाएगी? अवधि वही रखनी है।", "If I pay one lakh into the personal loan, what will the EMI become? I want to keep the same tenure."]
    - [cut 1400 L9, "बस, कर दीजिए, एक लाख, नए खाते से।", "Just do it, one lakh, from the new account."]
    - [after, "होम लोन का ब्याज प्रमाणपत्र और पर्सनल लोन का नया शेड्यूल ईमेल कर दीजिए।", "Email the home-loan interest certificate and the personal loan's new schedule."]
    - [after, "आख़िर में बताइए, नवंबर से कौन-सी EMI किस तारीख़ को और कितनी?", "Finally, tell me: from November, which EMI on which date and how much?"]
    - [after, "ठीक है, SMS भेज दीजिए। धन्यवाद।", "Okay, send the SMS. Thank you."]
  key:
    - "Moves the home and personal loans to the 10th; when the car loan refuses 10, says so and uses 15, as he asked"
    - "States the broken-period interest: ₹8,240, ₹2,110 and ₹1,350, ₹11,700 in all"
    - "Moves the ₹1,62,000 to 7360, quotes ₹38,760 and then closes TW-2209; requests the NOC and RTO letter"
    - "Moves the three EMI mandates to 7360 and cancels the bike one"
    - "Prepays ₹1,00,000 on PL-4420 keeping the tenure: EMI ₹9,800 to ₹5,720"
    - "Reads back from November: home ₹31,800 on the 10th, car ₹12,600 on the 15th, personal ₹5,720 on the 10th"
  checks: {lang: hi, digits: ["5,720", "38,760", "FC 22091"], say: [["11,700", "ग्यारह हज़ार सात सौ"]], tool_order: [get_foreclosure_quote, foreclose_loan]}
  guard: "The fallback day comes with the request; the cut-in confirms the prepayment whether or not the agent finished quoting; L12 asks for the full read-back."

- id: bank-123
  g: BANK-3
  lang: en
  diff: Medium
  dir: out
  title: "FD maturity call — four deposits, four different instructions, nominees on all, one new FD"
  basis: "Banks call customers before deposits mature without instructions or nominees; each deposit is decided separately."
  caller: "M 60+ · retired customs officer in Goa, friendly, unhurried"
  goal: "Decide what happens to each of four FDs maturing this week, add his wife as nominee everywhere and open one more FD."
  role: "You are calling from Kosh Bank because four of the customer's FDs mature this week with no maturity instruction and no nominee. Open the call: greet, name Kosh Bank, say why you are calling. Verify before giving any amount."
  context: ""
  tasks:
    - task: "Verify and read the four FDs"
      calls:
        - "verify_caller(name=Sunil Fernandes, dob=9 Mar 1958) → verified"
        - "get_fd(fd_last4=4401) → ₹2,00,000, matures Tue 6 Oct, maturity ₹2,15,600; no instruction, no nominee"
        - "get_fd(fd_last4=4419) → ₹3,00,000, matures Wed 7 Oct, maturity ₹3,22,800; no instruction, no nominee"
        - "get_fd(fd_last4=4427) → ₹1,50,000, matures Thu 8 Oct, maturity ₹1,61,400; no instruction, no nominee"
        - "get_fd(fd_last4=4435) → ₹2,50,000, matures Sat 10 Oct, maturity ₹2,69,500; no instruction, no nominee"
    - task: "Rates"
      calls:
        - "get_fd_rates(tenure_months=12, senior=yes) → 7.6%"
        - "get_fd_rates(tenure_months=36, senior=yes) → 7.8%"
    - task: "Instruction for each"
      calls:
        - "set_fd_maturity(fd_last4=4401, instruction=renew principal for 12 months, interest to savings 4380) → instruction set"
        - "set_fd_maturity(fd_last4=4419, instruction=renew all for 36 months) → instruction set"
        - "set_fd_maturity(fd_last4=4427, instruction=pay out to savings 4380) → instruction set"
        - "set_fd_maturity(fd_last4=4435, instruction=renew principal for 12 months, interest to savings 4380) → instruction set"
    - task: "Nominee on each"
      calls:
        - "update_nominee(fd_last4=4401, nominee=Maria Fernandes, relation=wife, share=100%) → nominee updated"
        - "update_nominee(fd_last4=4419, nominee=Maria Fernandes, relation=wife, share=100%) → nominee updated"
        - "update_nominee(fd_last4=4427, nominee=Maria Fernandes, relation=wife, share=100%) → nominee updated"
        - "update_nominee(fd_last4=4435, nominee=Maria Fernandes, relation=wife, share=100%) → nominee updated"
    - task: "One more FD from savings"
      calls:
        - "get_account(account_last4=4380) → balance ₹1,84,000"
        - "open_fd(amount=₹1,00,000, tenure_months=12, from_account_last4=4380, senior=yes) → FD 4443, 7.6%, maturity ₹1,07,819"
        - "update_nominee(fd_last4=4443, nominee=Maria Fernandes, relation=wife, share=100%) → nominee updated"
    - task: "Certificate and summary"
      calls:
        - "request_statement(account_last4=4380, kind=FD interest and TDS certificate) → emailed"
        - "send_sms(template=fd_instructions_summary) → sent"
  forbid: [break_fd]
  lines:
    - [open, "Hello? Fernandes speaking."]
    - [after, "Oh, my deposits, yes. Ninth March, nineteen fifty-eight."]
    - [after, "Four of them this week? Read them out for me, one by one."]
    - [after, "What are you giving seniors now — one year and three years?"]
    - [after, "Right. The one on Tuesday — keep the principal for another year, interest to my savings. The three-lakh one — put the whole thing back for three years."]
    - [after, "The Thursday one, pay it all into savings. I'm buying my grandson a scooter."]
    - [after, "And the last one, Saturday's — same as Tuesday's."]
    - [after, "No nominee on any of them? My wife, Maria Fernandes. On all four, the full share."]
    - [after, "How much is sitting in savings right now?"]
    - [after, "Put one lakh of that in a fresh FD for a year as well. Maria as nominee there too."]
    - [after, "Can you email me the interest and TDS certificate? My son does my taxes."]
    - [after, "Lovely. Send me a message with all this."]
    - [after, "Thank you for calling, very kind of you."]
  key:
    - "Opens naming Kosh Bank and the four maturing FDs; verifies before reading amounts"
    - "Reads each FD's date and maturity amount; gives 7.6% for 12 months and 7.8% for 36"
    - "Sets 4401 and 4435 to renew principal for 12 months with interest to 4380, 4419 to renew all for 36 months, 4427 to pay out"
    - "Adds Maria Fernandes as 100% nominee on all four"
    - "Gives the ₹1,84,000 balance and opens FD 4443 for ₹1,00,000 with Maria as nominee"
    - "Emails the certificate and sends the summary"
  checks: {digits: ["4443", "1,84,000"], say: [["7.6", "seven point six"], ["7.8", "seven point eight"]], tool_order: [verify_caller, get_fd]}
  guard: "Each FD is named by its day and amount, which the agent must read out first; L7 refers back to L5's instruction, so it holds whatever wording the agent used."

- id: bank-124
  g: BANK-3
  lang: hg
  diff: Hard
  dir: in
  title: "Father passed away — mother as nominee: cards, autopays, deposit and insurance claims, loan cover, her own nominee"
  basis: "After a death, the family has to stop every charge on the deceased's products and start one claim per account, deposit and policy."
  caller: "M 26-45 · son in Delhi, steady but grieving; speaker b: F 46-60 · his mother Sushila, the nominee, quiet"
  goal: "Stop everything that would keep charging on his father's products, start every nominee and insurance claim with the right documents, deal with the car loan and update his mother's own nominee."
  role: "You handle bereavement cases. Speak gently. Verify the nominee, the mother, before acting. Nothing is paid out until a claim is settled. Move, don't cancel, anything the household still needs."
  context: "Suresh Bansal died on Mon 21 Sep. Sushila Bansal is the nominee on his savings account, both FDs and both policies."
  tasks:
    - task: "Verify the nominee and read his products"
      calls:
        - "verify_caller(name=Sushila Bansal, dob=3 Mar 1962) → verified; nominee on Suresh Bansal's products"
        - "get_accounts(holder=Suresh Bansal) → savings 1029 with debit card 1053; credit card 7716; FDs 1037 and 1045; car loan CL-6620; Kavach term policy KV-T-550231; Kavach health floater KV-H-550248"
    - task: "Stop his cards and UPI"
      calls:
        - "block_card(card_last4=1053, reason=card holder deceased) → blocked"
        - "block_card(card_last4=7716, reason=card holder deceased) → blocked"
        - "set_upi_status(account_last4=1029, enabled=no) → UPI off"
    - task: "Autopays and the standing instruction"
      calls:
        - "get_mandates(account_last4=1029) → MD 8801 Netflix; MD 8802 Airtel mobile (his number); MD 8803 Cult.fit; MD 8804 BSES electricity (the house); MD 8805 SIP ₹10,000. Standing instruction SI 61104: ₹5,000 monthly to Mahesh Bansal"
        - "cancel_mandate(mandate_id=MD 8801) → cancelled"
        - "cancel_mandate(mandate_id=MD 8802) → cancelled"
        - "cancel_mandate(mandate_id=MD 8803) → cancelled"
        - "cancel_mandate(mandate_id=MD 8805) → cancelled"
        - "move_mandate(mandate_id=MD 8804, to_account_last4=2210) → moved to Sushila Bansal's savings, from the next bill"
        - "cancel_standing_instruction(si_no=SI 61104) → cancelled"
    - task: "Nominee claims on the account and deposits"
      calls:
        - "register_nominee_claim(account_last4=1029, nominee=Sushila Bansal) → claim NC 40101; documents: death certificate, nominee's ID"
        - "register_nominee_claim(fd_last4=1037, nominee=Sushila Bansal) → error: claim system timed out"
        - "register_nominee_claim(fd_last4=1037, nominee=Sushila Bansal) → claim NC 40102; documents: death certificate, nominee's ID"
        - "register_nominee_claim(fd_last4=1045, nominee=Sushila Bansal) → claim NC 40103; documents: death certificate, nominee's ID"
    - task: "The term-insurance claim"
      calls:
        - "get_policy(policy_no=KV-T-550231) → Kavach term cover ₹50,00,000, nominee Sushila Bansal, in force"
        - "register_claim(policy_no=KV-T-550231, member=Suresh Bansal, kind=death, amount=₹50,00,000) → claim TC 88010; documents: death certificate, nominee ID, bank proof"
        - "send_document_link(claim_id=TC 88010, document=death certificate) → upload link sent by SMS"
        - "send_document_link(claim_id=TC 88010, document=nominee ID) → upload link sent by SMS"
        - "send_document_link(claim_id=TC 88010, document=bank proof) → upload link sent by SMS"
        - "set_claim_payout(claim_id=TC 88010, account_last4=2210) → payout account set"
    - task: "The health floater"
      calls:
        - "get_policy(policy_no=KV-H-550248) → floater for Suresh and Sushila Bansal, renews 1 Dec, premium ₹31,600"
        - "remove_policy_member(policy_no=KV-H-550248, member=Suresh Bansal) → removed from the 1 Dec renewal; premium ₹18,200"
    - task: "Car loan and card dues"
      calls:
        - "get_loan(loan_id=CL-6620) → car loan, outstanding ₹3,10,000; covered by loan-protection insurance"
        - "raise_ticket(category=loan protection claim, summary=CL-6620 borrower deceased 21 Sep; nominee Sushila Bansal) → ticket LP 66201"
        - "get_card_statement(card_last4=7716) → outstanding ₹23,400; no further interest once the death is recorded"
    - task: "Branch visit, her own nominee, summary"
      calls:
        - "find_branch(area=Rajouri Garden, Delhi) → Kosh Bank Rajouri Garden, KB-0108, 9:30 am-4:30 pm"
        - "book_branch_visit(branch_id=KB-0108, date=Thu 8 Oct, slot=11:00 am, purpose=original death certificate for claims NC 40101-40103) → appointment BV 40120"
        - "update_nominee(account_last4=2210, nominee=Rohit Bansal, relation=son, share=100%) → nominee updated"
        - "send_sms(template=bereavement_case_summary) → sent"
  forbid: ["cancel_mandate(mandate_id=MD 8804)", transfer_funds]
  lines:
    - [open, "Hello. Mere papa, Suresh Bansal, ka do hafte pehle dehaant ho gaya. Unke accounts ke baare mein baat karni hai. Main unka beta Rohit.", "Hello. My father, Suresh Bansal, passed away two weeks ago. I need to talk about his accounts. I'm his son, Rohit."]
    - [after, "Mummy nominee hain, woh mere saath hain. Unse baat kar lijiye.", "Mummy is the nominee; she's with me. Please speak to her."]
    - [after b, "Ji, main Sushila Bansal. Janam tithi teen March unnees sau baasath.", "Yes, I'm Sushila Bansal. Date of birth third March 1962."]
    - [after b, "Unke card band kar dijiye. UPI bhi.", "Please close his cards. UPI too."]
    - [after, "Unke account se kaafi cheezein katti hain — Netflix, unka mobile, gym, SIP. Sab band kar dijiye. Bas bijli ka bill ghar ka hai, woh Mummy ke account se kaatna chahiye.", "A lot of things are debited from his account — Netflix, his mobile, the gym, the SIP. Stop all of them. Only the electricity bill is the house's; that should come from Mummy's account."]
    - [after, "Chacha ji ko har mahine paanch hazaar jaate the, woh bhi abhi rok dijiye.", "Five thousand went to my uncle every month; stop that too for now."]
    - [after, "Ab account aur dono FD ke liye Mummy ka claim kaise hoga?", "Now how will Mummy claim the account and both FDs?"]
    - [after, "Papa ki term insurance bhi thi. Uska claim bhi shuru kar dijiye. Documents ke link bhej dijiye.", "Papa also had term insurance. Please start that claim too. Send links for the documents."]
    - [after b, "Paisa mere account mein aaye. Mera account do do ek shunya.", "The money should come into my account. My account is 2210."]
    - [after, "Health policy dono ki saath mein thi. Usmein ab sirf Mummy rahengi.", "The health policy was for both of them together. Now only Mummy will be on it."]
    - [after, "Car loan bhi chal raha hai. Uska kya hoga?", "There's a car loan running too. What happens to it?"]
    - [after, "Aur credit card pe kuch baaki hai kya?", "And is anything due on the credit card?"]
    - [after, "Original death certificate kahan dena hai? Rajouri Garden branch paas hai. Guruvaar subah gyarah baje?", "Where do we give the original death certificate? The Rajouri Garden branch is close. Thursday at eleven in the morning?"]
    - [after b, "Mere apne account mein nominee unhi ka naam tha. Ab Rohit ka kar dijiye.", "On my own account, the nominee was his name. Please make it Rohit now."]
    - [after, "Sab kuch SMS kar dijiye. Aapne bahut aaram se samjhaya, thank you.", "SMS everything. You explained it very gently, thank you."]
  key:
    - "Offers condolences; verifies Sushila as nominee before acting"
    - "Blocks 1053 and 7716 and turns off UPI; cancels Netflix, Airtel, Cult.fit and the SIP; moves the electricity mandate to 2210; cancels SI 61104"
    - "Registers nominee claims on 1029, 1037 (after the timeout, says so and retries) and 1045, and lists the documents"
    - "Registers the ₹50,00,000 term claim TC 88010, sends three document links and sets the payout to 2210"
    - "Removes Suresh from the floater from 1 Dec (premium ₹18,200)"
    - "Explains the car loan's protection cover and raises LP 66201; gives the ₹23,400 card dues"
    - "Books Rajouri Garden for Thu 8 Oct at 11:00 am (BV 40120) and sets Rohit as nominee on 2210"
  checks: {lang: hg, digits: ["NC 40102", "TC 88010", "LP 66201", "BV 40120"], tool_order: [verify_caller, block_card]}
  guard: "The son describes and the mother authorises; each line asks about one product by what it is; the electricity exception comes in the same line as the cancellations."
