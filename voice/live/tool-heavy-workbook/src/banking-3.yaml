    - [after, "సరే, చేయండి. GITAM కి fee మూడు లక్షల నలభై వేలు పంపండి. Account ఇంతకు ముందే ఉంది.", "Okay, do it. Send the fee of three lakh forty thousand to GITAM. The account is already there."]
    - [after, "మిగతాది మళ్ళీ FD వేయాలి. మూడు లక్షలు ఆ పదిహేను నెలల special scheme లో. అది లేకపోతే ఒక సంవత్సరం.", "The rest must go back into FDs. Three lakh in that fifteen-month special scheme. If that's not there, one year."]
    - [after, "ఇంకో రెండు లక్షలు రెండు సంవత్సరాలకి.", "Another two lakh for two years."]
    - [after, "Saturday వచ్చే FD renew చేయొద్దు, savings లోకి వేయండి.", "Don't renew the FD coming on Saturday; put it into savings."]
    - [after, "కొత్త FD లో — మూడు లక్షల దానికి నా భార్య Annapurna nominee. రెండు లక్షల దానికి మనవరాలు Sahithi. Savings account కి కూడా Sahithi నే పెట్టండి.", "On the new FDs — my wife Annapurna as nominee on the three-lakh one. Our granddaughter Sahithi on the two-lakh one. Put Sahithi on the savings account too."]
    - [after b, "నమస్కారం, నేను Annapurna. నా KYC ఏదో అయిపోయిందని message వచ్చింది. పుట్టిన తేదీ పద్నాలుగు August, పంతొమ్మిది వందల యాభై తొమ్మిది.", "Hello, I'm Annapurna. I got a message that my KYC has run out or something. Date of birth fourteenth August 1959."]
