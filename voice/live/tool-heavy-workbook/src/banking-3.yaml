    - [after, "ఇప్పుడు savings లో ఎంత ఉంది?", "How much is in savings now?"]
    - [after, "Fee college కి చేరిందో లేదో గురువారం ఒకసారి phone చేసి చెప్పండి.", "Call me on Thursday to say whether the fee reached the college."]
    - [after, "SMS పంపండి. చాలా ధన్యవాదాలు.", "Send an SMS. Thank you very much."]
