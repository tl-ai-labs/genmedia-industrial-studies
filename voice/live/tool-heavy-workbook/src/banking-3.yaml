# Banking & insurance — tool-heavy scenarios bank-117 … bank-124 (BANK-2 Payments, BANK-3 Loans, deposits & accounts).
code: bank
scenarios:

- id: bank-117
  g: BANK-2
  lang: hi
  diff: Medium
  dir: in
  title: "Retired teacher sets up his pension account — payees, standing instructions, premium autopays, nominee"
  basis: "Retirees want pension money to go out automatically each month and their policies paid from the same account."
  caller: "M 60+ · retired teacher in Lucknow, slow and formal, pauses to find papers"
  goal: "Pay society dues, his grandson's coaching and his daughter automatically, put both health premiums on autopay, clear dead autopays, add his wife as nominee and book his life-certificate visit."
  role: "You handle payments. Speak slowly and confirm each amount and date."
  context: "Pension is credited on the 1st. Life certificates for pensioners are due in November."
  tasks:
    - task: "Verify and read the account"
      calls:
        - "verify_caller(name=Shyam Sundar Tripathi, dob=2 Feb 1958) → verified"
        - "get_account(account_last4=4420) → pension savings, balance ₹2,10,500, no nominee"
        - "get_beneficiaries(account_last4=4420) → Sneha Tripathi (daughter, 2021)"
    - task: "Two new payees"
      calls:
        - "add_beneficiary(account_last4=4420, name=Gomti Apartments RWA, account_no=0711 2045 8890, ifsc=SBIN0000711) → added"
        - "add_beneficiary(account_last4=4420, name=Vidyapeeth Coaching, account_no=5520 1009 3341, ifsc=PUNB0552000) → added"
    - task: "Three standing instructions"
      calls:
        - "set_standing_instruction(from_account_last4=4420, to=Gomti Apartments RWA, amount=₹3,500, day=5) → SI 22310, first on 5 Nov"
        - "set_standing_instruction(from_account_last4=4420, to=Vidyapeeth Coaching, amount=₹15,000, day=10) → SI 22311, first on 10 Oct"
        - "set_standing_instruction(from_account_last4=4420, to=Sneha Tripathi, amount=₹10,000, day=2) → SI 22312, first on 2 Nov"
    - task: "Both health premiums on autopay"
      calls:
        - "get_policy(policy_no=KV-H-301144) → Kavach senior health for Shyam Sundar Tripathi, premium ₹28,400, renews 15 Nov, no autopay"
        - "get_policy(policy_no=KV-H-301152) → Kavach senior health for Kusum Tripathi, premium ₹34,900, renews 2 Dec, no autopay"
        - "set_premium_autopay(policy_no=KV-H-301144, account_last4=4420) → autopay set from the 15 Nov renewal"
        - "set_premium_autopay(policy_no=KV-H-301152, account_last4=4420) → autopay set from the 2 Dec renewal"
    - task: "Dead autopays"
      calls:
        - "get_mandates(account_last4=4420) → MD 2201 BSNL landline, failing since June (line disconnected); MD 2202 LESA electricity; MD 2203 Tata Play, failing since July (connection closed)"
        - "cancel_mandate(mandate_id=MD 2201) → cancelled"
        - "cancel_mandate(mandate_id=MD 2203) → cancelled"
    - task: "Nominee and tax certificate"
      calls:
        - "update_nominee(account_last4=4420, nominee=Kusum Tripathi, relation=wife, share=100%) → nominee updated"
        - "request_statement(account_last4=4420, kind=interest certificate for income tax) → emailed"
    - task: "Life-certificate visit, summary"
      calls:
        - "find_branch(area=Aliganj, Lucknow) → Kosh Bank Aliganj, KB-0377, 10:00 am-4:00 pm"
        - "book_branch_visit(branch_id=KB-0377, date=Mon 2 Nov, slot=11:00 am, purpose=pensioner life certificate) → appointment BV 22340"
        - "send_sms(template=pension_setup_summary) → sent"
  forbid: ["cancel_mandate(mandate_id=MD 2202)"]
  lines:
    - [open, "नमस्कार। मैं श्याम सुंदर त्रिपाठी, लखनऊ से। सेवानिवृत्त अध्यापक हूँ। अपने पेंशन खाते में कुछ इंतज़ाम करवाने हैं।", "Good day. I am Shyam Sundar Tripathi, from Lucknow. I am a retired teacher. I need a few arrangements made on my pension account."]
    - [after, "जन्मतिथि दो फ़रवरी उन्नीस सौ अट्ठावन। खाता चार चार दो शून्य।", "Date of birth second February 1958. The account is 4420."]
    - [after, "हर महीने तीन भुगतान अपने आप होने चाहिए। पहला, सोसाइटी का रखरखाव — साढ़े तीन हज़ार, पाँच तारीख़ को।", "Three payments should go every month by themselves. First, the society maintenance — three and a half thousand, on the fifth."]
    - [pause 2000, "सोसाइटी का खाता शून्य सात एक एक, दो शून्य चार पाँच, आठ आठ नौ शून्य। IFSC एस बी आई एन शून्य शून्य शून्य शून्य सात एक एक।", "The society's account is 0711 2045 8890. IFSC SBIN0000711."]
    - [after, "दूसरा, पोते की कोचिंग — पंद्रह हज़ार, दस तारीख़ को। खाता पाँच पाँच दो शून्य, एक शून्य शून्य नौ, तीन तीन चार एक। IFSC पी यू एन बी शून्य पाँच पाँच दो शून्य शून्य शून्य।", "Second, my grandson's coaching — fifteen thousand, on the tenth. Account 5520 1009 3341. IFSC PUNB0552000."]
    - [after, "तीसरा, बेटी स्नेहा को दस हज़ार, दो तारीख़ को। वो पहले से जुड़ी हुई है।", "Third, ten thousand to my daughter Sneha, on the second. She is already added."]
    - [after, "हम दोनों की कवच की स्वास्थ्य पॉलिसी है। उनकी किश्त भी इसी खाते से अपने आप जानी चाहिए।", "We both have Kavach health policies. Their premiums should also go from this account automatically."]
    - [after wait=8000, "क्षमा कीजिए, कागज़ ढूँढ रहा था। हाँ, दोनों के नंबर आपके पास हैं न?", "Forgive me, I was looking for the papers. Yes, you have both the numbers, don't you?"]
    - [after, "कुछ पुराने कटौती वाले भी हैं — बीएसएनएल का फ़ोन कट चुका है, टाटा प्ले भी बंद है। उन्हें हटा दीजिए। बिजली वाला रहने दीजिए।", "There are some old deductions too — the BSNL phone has been disconnected, Tata Play is closed too. Remove those. Leave the electricity one."]
    - [after, "खाते में नॉमिनी नहीं है। मेरी पत्नी कुसुम त्रिपाठी को रख दीजिए, पूरा।", "There is no nominee on the account. Put my wife Kusum Tripathi, the whole share."]
    - [after, "आयकर के लिए ब्याज का प्रमाणपत्र ईमेल पर भेज दीजिए।", "Email the interest certificate for income tax."]
    - [after, "नवंबर में जीवन प्रमाणपत्र देना है। अलीगंज शाखा में दो नवंबर, सुबह ग्यारह बजे का समय मिल सकता है?", "I have to give the life certificate in November. Can I get a time at the Aliganj branch on the second of November, at eleven in the morning?"]
    - [after, "सब एक बार दोहरा दीजिए, धीरे-धीरे।", "Repeat everything once, slowly."]
    - [after, "बहुत-बहुत धन्यवाद। SMS भी भेज दीजिए।", "Thank you very much. Send an SMS as well."]
  key:
    - "Adds Gomti Apartments RWA and Vidyapeeth Coaching as read"
    - "Sets ₹3,500 on the 5th (SI 22310), ₹15,000 on the 10th (SI 22311) and ₹10,000 to Sneha on the 2nd (SI 22312)"
    - "Puts both Kavach premiums (₹28,400 and ₹34,900) on autopay from 4420"
    - "Cancels the BSNL and Tata Play mandates; keeps the electricity one"
    - "Sets Kusum Tripathi as 100% nominee and emails the interest certificate"
    - "Books Aliganj for Mon 2 Nov at 11:00 am (BV 22340); waits while he finds his papers; repeats slowly"
  checks: {lang: hi, reprompt_in_silence: L8, digits: ["SI 22310", "SI 22311", "SI 22312", "BV 22340"], tool_order: [add_beneficiary, set_standing_instruction]}
  guard: "Each payment comes with its payee details, amount and day; L8 follows the silence whatever the agent asked; L13 asks for a repeat whatever was said."

- id: bank-118
  g: BANK-2
  lang: ta
  script: ta-mix
  diff: Hard
  dir: in
  title: "Textile shop pays six staff — new payees, a closed account, failed UPI refunds, salaries on standing instruction"
  basis: "Small businesses pay staff by NEFT each month; a closed staff account bounces and new hires need adding."
  caller: "M 46-60 · textile shop owner in Coimbatore, brisk, used to giving instructions"
  goal: "Pay all six staff today, fix one who changed bank, sort two failed customer refunds and make salaries automatic from next month."
  role: "You handle business payments. Read the total before sending."
  context: "A new payee can receive up to ₹50,000 in the first 24 hours."
  tasks:
    - task: "Verify, balance, payees"
      calls:
        - "verify_caller(name=Muthukumar Velusamy, dob=30 Aug 1976) → verified"
        - "get_account(account_last4=7004) → Velu Textiles current account, balance ₹4,12,000"
        - "get_beneficiaries(account_last4=7004) → Murugan (IOB, account ending 2210), Selvi, Karthik, Anitha"
    - task: "Add the two new staff"
      calls:
        - "add_beneficiary(account_last4=7004, name=Ramesh, account_no=6021 4410 0782, ifsc=CNRB0006021) → added"
        - "add_beneficiary(account_last4=7004, name=Kavitha, account_no=1180 3390 2215, ifsc=IOBA0001180) → added"
    - task: "Murugan's salary — his old account is closed"
      calls:
        - "transfer_funds(from_account_last4=7004, to=Murugan (IOB 2210), amount=₹18,000, mode=NEFT) → error: beneficiary account closed; money not sent"
        - "add_beneficiary(account_last4=7004, name=Murugan (Indian Bank), account_no=7741 0098 5531, ifsc=IDIB000C112) → added"
        - "transfer_funds(from_account_last4=7004, to=Murugan (Indian Bank), amount=₹18,000, mode=NEFT) → sent, ref NF 11801"
        - "delete_beneficiary(account_last4=7004, name=Murugan (IOB 2210)) → removed"
    - task: "Everyone else's salary"
      calls:
        - "transfer_funds(from_account_last4=7004, to=Selvi, amount=₹16,000, mode=NEFT) → sent, ref NF 11802"
        - "transfer_funds(from_account_last4=7004, to=Karthik, amount=₹22,000, mode=NEFT) → sent, ref NF 11803"
        - "transfer_funds(from_account_last4=7004, to=Anitha, amount=₹16,000, mode=NEFT) → sent, ref NF 11804"
        - "transfer_funds(from_account_last4=7004, to=Ramesh, amount=₹14,000, mode=NEFT) → sent, ref NF 11805"
        - "transfer_funds(from_account_last4=7004, to=Kavitha, amount=₹14,000, mode=NEFT) → sent, ref NF 11806"
    - task: "Two failed UPI refunds to customers"
      calls:
        - "check_upi_txn(utr=6280 3300 4411) → failed; ₹2,450 reversed on 3 Oct"
        - "check_upi_txn(utr=6280 3300 4412) → failed; ₹3,800 not reversed"
        - "raise_upi_complaint(utr=6280 3300 4412, reason=debited, not reversed) → complaint UC 11810"
    - task: "Salaries by standing instruction from next month"
      calls:
        - "set_standing_instruction(from_account_last4=7004, to=Murugan (Indian Bank), amount=₹18,000, day=5) → SI 11821, first on 5 Nov"
        - "set_standing_instruction(from_account_last4=7004, to=Selvi, amount=₹16,000, day=5) → SI 11822, first on 5 Nov"
        - "set_standing_instruction(from_account_last4=7004, to=Karthik, amount=₹22,000, day=5) → SI 11823, first on 5 Nov"
        - "set_standing_instruction(from_account_last4=7004, to=Anitha, amount=₹16,000, day=5) → SI 11824, first on 5 Nov"
        - "set_standing_instruction(from_account_last4=7004, to=Ramesh, amount=₹14,000, day=5) → SI 11825, first on 5 Nov"
        - "set_standing_instruction(from_account_last4=7004, to=Kavitha, amount=₹14,000, day=5) → SI 11826, first on 5 Nov"
    - task: "Statement and SMS"
      calls:
        - "request_statement(account_last4=7004, kind=this month's salary transfers) → emailed"
        - "send_sms(template=salary_summary) → sent"
  forbid: ["raise_upi_complaint(utr=6280 3300 4411)"]
  lines:
    - [open, "வணக்கம், நான் Velu Textiles, Coimbatore ல இருந்து Muthukumar. இன்னைக்கு staff சம்பளம் போடணும், ஆறு பேர்.", "Hello, I'm Muthukumar from Velu Textiles, Coimbatore. I need to pay staff salaries today, six people."]
    - [after, "Date of birth முப்பது August, ஆயிரத்து தொள்ளாயிரத்து எழுபத்தி ஆறு.", "Date of birth thirtieth August 1976."]
    - [after, "ரெண்டு பேர் புதுசு. Ramesh — account six zero two one, four four one zero, zero seven eight two. IFSC C N R B zero zero zero six zero two one.", "Two are new. Ramesh — account 6021 4410 0782. IFSC CNRB0006021."]
    - [after, "Kavitha — one one eight zero, three three nine zero, two two one five. IFSC I O B A zero zero zero one one eight zero.", "Kavitha — 1180 3390 2215. IFSC IOBA0001180."]
    - [after, "சம்பளம்: Murugan பதினெட்டாயிரம், Selvi பதினாறாயிரம், Karthik இருபத்தி ரெண்டாயிரம், Anitha பதினாறாயிரம், Ramesh, Kavitha ரெண்டு பேருக்கும் பதினாலாயிரம்.", "Salaries: Murugan eighteen thousand, Selvi sixteen thousand, Karthik twenty-two thousand, Anitha sixteen thousand, Ramesh and Kavitha fourteen thousand each."]
    - [after, "Murugan பழைய account close பண்ணிட்டான்னு சொன்னான். அது bounce ஆனா, அவனோட Indian Bank account க்கு போடுங்க — seven seven four one, zero zero nine eight, five five three one. IFSC I D I B zero zero zero C one one two.", "Murugan said he closed his old account. If it bounces, send it to his Indian Bank account — 7741 0098 5531. IFSC IDIB000C112."]
    - [after, "மொத்தம் எவ்வளவு போச்சு?", "How much went in total?"]
    - [after, "பழைய Murugan account ஐ list ல இருந்து எடுத்துடுங்க.", "Take the old Murugan account off the list."]
    - [after, "இன்னொன்னு — ரெண்டு customer க்கு UPI ல refund அனுப்பினேன், ரெண்டும் fail. UTR six two eight zero, three three zero zero, four four one one. இன்னொன்னு அதே, கடைசி four four one two.", "Another thing — I sent UPI refunds to two customers and both failed. UTR 6280 3300 4411. The other is the same, ending 4412."]
    - [after, "சரி, வராததுக்கு complaint போடுங்க.", "Okay, raise a complaint for the one that didn't come back."]
    - [after, "அடுத்த மாசத்துல இருந்து சம்பளம் automatic ஆ அஞ்சாம் தேதி போகணும். ஆறு பேருக்கும், இதே amount.", "From next month the salaries should go automatically on the fifth. All six, the same amounts."]
    - [after, "இந்த மாச salary list ஐ email பண்ணுங்க, accountant க்கு.", "Email this month's salary list, for the accountant."]
    - [after, "SMS உம் அனுப்புங்க. நன்றி.", "Send an SMS too. Thank you."]
  key:
    - "Adds Ramesh and Kavitha as read"
    - "When Murugan's IOB account bounces, says so, adds his Indian Bank account, pays him there and removes the old payee"
    - "Pays all six; states the total ₹1,00,000"
    - "Finds 4411 already reversed and 4412 not; raises a complaint only for 4412 (UC 11810)"
    - "Sets six salary SIs on the 5th from 5 Nov (SI 11821-11826), Murugan's to the Indian Bank account"
    - "Emails the salary list and sends the SMS; speaks Tamil, keeping his English words"
  checks: {lang: ta, digits: ["NF 11801", "UC 11810", "SI 11826"], say: [["1,00,000", "ஒரு லட்சம்", "one lakh"]], tool_order: [add_beneficiary, transfer_funds]}
  guard: "Murugan's fallback account comes before any transfer; L7 asks for the total whatever the agent said; L10 says 'the one that didn't come back', so it holds whichever the agent named."

- id: bank-119
  g: BANK-3
  lang: en
  diff: Hard
  dir: in
  title: "Bonus day — close two loans, part-prepay the home loan, move its EMI date, break one FD, NOCs and certificates"
  basis: "A bonus or windfall leads customers to close small loans, prepay the home loan and clean up autopays, loan by loan."
  caller: "M 26-45 · finance manager in Bengaluru, numerate, wants every figure"
  goal: "Close the personal and car loans, prepay ₹5 lakh on the home loan keeping the EMI, move the EMI date, pay the gold-loan interest and get every NOC and certificate."
  role: "You handle loans. Give each quote before acting, and compare prepayment options when asked."
  context: "Foreclosure quotes are valid until Wed 7 Oct. Breaking an FD early costs 1% of the rate."
  tasks:
    - task: "Verify and read everything"
      calls:
        - "verify_caller(name=Aditya Kulkarni, dob=15 Nov 1982) → verified"
        - "get_accounts() → savings 8812; FDs 6101 and 6119; loans HL-220871 (home), CL-5512 (car), PL-9034 (personal), GL-3381 (gold)"
        - "get_account(account_last4=8812) → balance ₹9,20,000"
        - "get_loan(loan_id=HL-220871) → home loan, outstanding ₹38,40,000, EMI ₹42,300 on the 5th, 8.6%, ends Jun 2041"
        - "get_loan(loan_id=CL-5512) → car loan, outstanding ₹2,85,000, EMI ₹14,900, 9.2%"
        - "get_loan(loan_id=PL-9034) → personal loan, outstanding ₹1,62,000, EMI ₹11,200, 13.5%"
        - "get_loan(loan_id=GL-3381) → gold loan ₹1,50,000, interest due ₹6,480 by 12 Oct"
    - task: "Break the longer FD"
      calls:
        - "get_fd(fd_last4=6101) → ₹3,00,000 at 7.1%, matures 20 Nov 2026"
        - "get_fd(fd_last4=6119) → ₹2,00,000 at 7.3%, matures Mar 2028; payout if broken today ₹2,08,900 after penalty"
        - "break_fd(fd_last4=6119, to_account_last4=8812) → error: service timed out, please try again"
        - "break_fd(fd_last4=6119, to_account_last4=8812) → ₹2,08,900 credited to 8812"
    - task: "Close the personal and car loans"
      calls:
        - "get_foreclosure_quote(loan_id=PL-9034) → ₹1,65,240 including 2% charge, valid until Wed 7 Oct"
        - "foreclose_loan(loan_id=PL-9034, from_account_last4=8812) → closed, ref FC 90341"
        - "get_foreclosure_quote(loan_id=CL-5512) → ₹2,88,100, valid until Wed 7 Oct"
        - "foreclose_loan(loan_id=CL-5512, from_account_last4=8812) → closed, ref FC 55121"
        - "request_noc(loan_id=PL-9034) → NOC emailed within 2 working days"
        - "request_noc(loan_id=CL-5512) → NOC and hypothecation-removal letter dispatched by 15 Oct"
    - task: "Home loan prepayment"
      calls:
        - "calculate_prepayment(loan_id=HL-220871, amount=₹5,00,000, keep=emi) → ends Jan 2038 instead of Jun 2041; interest saved ₹11,85,000"
        - "calculate_prepayment(loan_id=HL-220871, amount=₹5,00,000, keep=tenure) → EMI falls to ₹36,790; interest saved ₹4,95,000"
        - "make_prepayment(loan_id=HL-220871, amount=₹5,00,000, from_account_last4=8812, keep=emi) → paid, ref PP 22087; loan now ends Jan 2038"
        - "change_emi_date(loan_id=HL-220871, new_day=10) → from November; broken-period interest ₹5,300 with the first EMI"
    - task: "Gold-loan interest"
      calls:
        - "create_payment_link(loan_id=GL-3381, amount=₹6,480) → link sent by SMS"
    - task: "Autopays for the closed loans"
      calls:
        - "get_mandates(account_last4=8812) → MD 9101 car loan EMI; MD 9102 personal loan EMI; MD 9103 home loan EMI"
        - "cancel_mandate(mandate_id=MD 9101) → cancelled"
        - "cancel_mandate(mandate_id=MD 9102) → cancelled"
    - task: "The other FD, certificates, balance"
      calls:
        - "set_fd_maturity(fd_last4=6101, instruction=pay out to 8812) → instruction set"
        - "request_statement(loan_id=HL-220871, kind=interest certificate) → emailed"
        - "request_statement(loan_id=PL-9034, kind=closure statement) → emailed"
        - "request_statement(loan_id=CL-5512, kind=closure statement) → emailed"
        - "get_account(account_last4=8812) → balance ₹1,75,560"
        - "send_sms(template=loans_summary) → sent"
  forbid: ["break_fd(fd_last4=6101)", "cancel_mandate(mandate_id=MD 9103)"]
  lines:
    - [open, "Hi. I've had a bonus and I want to clean up my loans in one go. Can you read me everything I have — loans, deposits, balance?"]
    - [after, "Aditya Kulkarni, fifteenth November nineteen eighty-two."]
    - [after, "Okay. Break the FD that runs till twenty twenty-eight. The one maturing next month, leave it. What do I get from it?"]
    - [after, "Go ahead. Then close the personal loan and the car loan completely. Give me both figures first."]
    - [after, "Fine, close both."]
    - [after, "I'll need NOCs for both, and for the car the letter for the RTO."]
    - [after, "Now the home loan. If I prepay five lakh, compare keeping the EMI against keeping the tenure."]
    - [after, "Keep the EMI. Shorter loan. Do it."]
