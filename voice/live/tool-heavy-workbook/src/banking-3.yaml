  lines:
    - [open, "నమస్కారం. నా పేరు Venkateswara Rao, Vizag నుంచి. మా మనవరాలి college fee కట్టాలి. మా FDs గురించి మాట్లాడాలి.", "Good day. My name is Venkateswara Rao, from Vizag. I need to pay my granddaughter's college fee. I want to talk about our FDs."]
