  forbid: [cancel_order, "cancel_return(return_id=RT-62980)", "cancel_item(order_id=KT-63022, item_id=air fryer)"]
  lines:
    - [open, "வணக்கம், நான் Vignesh. நாளைக்கு Singapore போறேன், இரண்டு வாரம். Kartly ல நிறைய parcel வந்துட்டு இருக்கு. எதுவும் return ஆகக்கூடாது.", "Hello, I'm Vignesh. I'm going to Singapore tomorrow for two weeks. Lots of Kartly parcels are on the way. None of them should go back."]
    - [after, "எல்லா order ஐயும் பாருங்க, ஒவ்வொரு parcel உம் எப்போ வருதுன்னு சொல்லுங்க.", "Look at all the orders and tell me when each parcel is coming."]
    - [after, "Headphones உம் books உம் நாளைக்கு காலைல ஏழு மணிக்குள்ள வந்தா நான் எடுத்துக்குவேன். Flight பத்து மணிக்கு.", "If the headphones and books come early tomorrow morning, from seven, I'll take them. My flight is at ten."]
    - [after, "Shirts உம் shoes உம் நான் வர்ற வரைக்கும் hold பண்ணுங்க, பத்தொன்பதாம் தேதி வரைக்கும். அவ்ளோ நாள் முடியலைன்னா, முடிஞ்ச வரைக்கும் hold பண்ணுங்க, என் தம்பி போய் வாங்கிக்குவான்.", "Hold the shirts and shoes until I'm back, until the nineteenth. If that's too long, hold them as long as you can, and my brother will go and collect them."]
    - [after, "Air fryer பெருசு, அது cash on delivery. என் தம்பி Anna Nagar ல இருக்கான், அதை அங்க ஒரு pickup point க்கு அனுப்புங்க.", "The air fryer is big, and it's cash on delivery. My brother lives in Anna Nagar — send it to a pickup point there."]
    - [after, "அவன் பணம் கட்ட வேண்டாம். இப்பவே online ஆ மாத்துங்க, நான் கட்டிடுறேன்.", "He shouldn't have to pay. Make it online now, I'll pay."]
    - [after, "கட்டிட்டேன். வந்துச்சா பாருங்க.", "I've paid. Check whether it came through."]
    - [after, "Chair உம் lamp உம் இன்னும் pack ஆகிட்டு இருக்கா? அப்போ அதை நேரா அவன் வீட்டுக்கு அனுப்புங்க — Karthik Ramasamy, eighteen, third street, Anna Nagar, six zero zero zero four zero.", "Are the chair and lamp still being packed? Then send them straight to his house — Karthik Ramasamy, 18, 3rd Street, Anna Nagar, 600040."]
    - [after, "இன்னொன்னு — ஒரு jacket return பண்ணியிருக்கேன், புதன்கிழமை pickup. நான் இருக்க மாட்டேன். திரும்பி வந்ததும், பத்தொன்பதாம் தேதி வர சொல்லுங்க.", "One more — I've returned a jacket, pickup on Wednesday. I won't be there. Have them come on the nineteenth, after I'm back."]
    - [after, "Return cancel ஆகாது இல்ல? அந்த பணம் எனக்கு வேணும்.", "The return won't get cancelled, right? I need that money."]
    - [after, "எல்லாம் ஒரு தடவை சொல்லுங்க — எது எங்க, எப்போ.", "Tell me everything once — what goes where, and when."]
    - [after, "SMS அனுப்புங்க. நன்றி, ரொம்ப உதவியா இருந்தீங்க.", "Send an SMS. Thank you, that was a big help."]
