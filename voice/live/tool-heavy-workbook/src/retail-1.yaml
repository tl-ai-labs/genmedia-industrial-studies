  caller: "M 26-45 · consultant in Chennai flying to Singapore tomorrow, rushed"
  goal: "Make sure none of seven parcels comes back unclaimed while he is away: hold some, send some to his brother, take two tomorrow morning, and make COD prepaid so his brother can receive it."
  role: "You handle delivery. Holds last up to 7 days."
  context: ""
  tasks:
    - task: "Find everything in flight"
