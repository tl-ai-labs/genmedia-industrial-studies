        - "reschedule_delivery(awb=EK 6620 1004, date=Wed 7 Oct, slot=4-8 pm) → rescheduled"
    - task: "Summary"
      calls:
        - "send_sms(template=order_changes_summary) → sent"
  forbid: ["cancel_item(order_id=KT-62550, item_id=silver pooja thali set)", cancel_order]
  lines:
    - [open, "హలో, మా అమ్మాయి పెళ్ళి పద్దెనిమిదో తేదీ, Sunday. Kartly లో పెళ్ళి సామాన్లు order చేశాను, కొన్ని late అని చూపిస్తోంది. Order K T six two five five zero.", "Hello, my daughter's wedding is on Sunday the eighteenth. I ordered wedding things on Kartly, and some are showing as late. Order KT-62550."]
    - [after, "పెళ్ళి తర్వాత వచ్చేవి ఏవీ వద్దు. అవి cancel చేసి, డబ్బు Kartly balance లో వేయండి. ఈ వారంలో వచ్చే వేరేవి చూపించండి.", "I don't want anything that comes after the wedding. Cancel those and put the money in my Kartly balance. Show me others that come this week."]
    - [after, "Kurta కి silk ది, clutch కి ఆ ఒక్కటే, frame కి wooden ది. మూడూ order చేయండి, balance నుంచి. తక్కువ పడితే UPI.", "The silk one for the kurta, that one clutch, the wooden frame. Order all three, from the balance. If it falls short, UPI."]
    - [after, "Return gifts, diyas — ఇవి రెండూ ఇంటికి కాదు, function hall కి పంపాలి. Sri Lakshmi Convention Hall, Road number two, Banjara Hills, five zero zero zero three four.", "The return gifts and the diyas — both should go to the function hall, not home. Sri Lakshmi Convention Hall, Road No. 2, Banjara Hills, 500034."]
    - [after, "రెండింటికీ gift wrap చేయండి, message — 'With love, Keerthi weds Sandeep'.", "Gift-wrap both, message — 'With love, Keerthi weds Sandeep'."]
    - [after, "Pooja thali మాత్రం ఇంటికే రావాలి. అది ఎప్పుడు వస్తుంది?", "But the pooja thali must come home. When will it come?"]
    - [after, "Hall లో మేనేజర్ ఉంటాడు, అతను తీసుకుంటాడు. ఏమైనా చెప్పాలా?", "The manager at the hall will receive it. Do I need to tell him anything?"]
    - [after, "Juttis ఎప్పుడు వస్తాయి? రేపు నేను ఇంట్లో ఉండను. బుధవారం సాయంత్రం పంపించండి.", "When are the juttis coming? I won't be home tomorrow. Send them Wednesday evening."]
    - [after, "కొత్త order కి ఎంత అయింది? Balance ఎంత పోయింది, UPI ఎంత?", "How much did the new order come to? How much from the balance, how much UPI?"]
    - [after, "Gift wrap కి ఎంత అయింది?", "How much did the gift wrap cost?"]
    - [after, "అన్నీ పెళ్ళి ముందే వస్తాయి కదా? ఒకసారి చెప్పండి.", "Everything will come before the wedding, right? Tell me once."]
    - [after, "SMS పంపండి. చాలా thanks అండి.", "Send an SMS. Thank you so much."]
  key:
    - "Cancels only the three late items (kurta, clutch, frame) to Kartly balance; keeps the thali and juttis"
    - "Orders the silk kurta, embellished clutch and wooden frame (KT-62781, ₹7,390): ₹7,048 from balance, ₹342 by UPI; delivery by Sat 10 Oct"
    - "Sends the return gifts and diyas to Sri Lakshmi Convention Hall 500034 and wraps both with the message"
    - "Moves the juttis to Wed 7 Oct, 4-8 pm"
    - "Confirms everything arrives before 18 October; speaks Telugu, keeping her English words"
  checks: {lang: te, digits: ["KT-62781", "7,048"], say: [["342", "మూడు వందల నలభై రెండు", "three forty-two"], ["7,390", "ఏడు వేల మూడు వందల తొంభై"]], tool_order: [cancel_item, place_order]}
  guard: "L3 names each choice by kind, which fits the alternatives the agent must read; the hall address and the message come before any change; L8 asks for the split whatever the agent said."

- id: ret-105
