        - "list_orders() → KT-63010 (headphones, books), KT-63022 (air fryer, cash on delivery), KT-63045 (shirts ×2 in one shipment, shoes), KT-63060 (office chair, not dispatched; desk lamp, not dispatched)"
        - "get_order(order_id=KT-63010) → AWBs DL 5520 9901 (headphones, Tue 6 Oct), DL 5520 9902 (books, Wed 7 Oct)"
        - "get_order(order_id=KT-63022) → AWB DL 5520 9910 (air fryer, Thu 8 Oct), cash on delivery ₹6,499"
