# Ecommerce & Retail — tool-heavy scenarios ret-101 … ret-108 (RET-1 Orders & delivery, RET-2 Checkout & payments).
code: ret
scenarios:

- id: ret-101
  g: RET-1
  lang: en
  diff: Hard
  dir: in
  title: "Diwali order turned into gifts — three addresses, gift wrap, a dispatched item, a late lamp, kids' parcels moved"
  basis: "Festive orders are bought to one address and then split into gifts; each item's address, wrap and timing is changed on its own."
  caller: "F 26-45 · marketing manager in Kolkata, quick, has the app open"
  goal: "Send three items to three relatives gift-wrapped with messages, replace a lamp that will come after Puja, and move her other order's parcels to Saturday."
  role: "You handle orders and delivery. An address can change only before an item is dispatched."
  context: "Gift wrap is ₹49 an item."
  tasks:
    - task: "Read the order"
      calls:
        - "get_order(order_id=KT-58120) → Banarasi silk saree ₹6,400 (packed); smartwatch ₹4,999 (dispatched, AWB EK 7710 2201); perfume gift set ₹2,350 (packed); Bluetooth speaker ₹3,199 (packed); kitchen set ₹1,899 (packed); table lamp ₹1,650 (delayed, now Thu 22 Oct); paid by card; all to 7 CK Block, Salt Lake, Kolkata 700091"
    - task: "Three items to three relatives"
      calls:
        - "update_delivery_address(order_id=KT-58120, item_id=Banarasi silk saree, address=Rina Ghosh, 14 Lake Road, Ballygunge, Kolkata 700019) → updated; delivery Thu 8 Oct"
        - "update_delivery_address(order_id=KT-58120, item_id=perfume gift set, address=Priya Bose, Flat 5B, Kalyani Nagar, Pune 411006) → updated; delivery Sat 10 Oct"
        - "update_delivery_address(order_id=KT-58120, item_id=Bluetooth speaker, address=Arjun Dey, 22 G T Road, Howrah 711101) → error: pincode 711101 is not served by this seller"
        - "update_delivery_address(order_id=KT-58120, item_id=Bluetooth speaker, address=Arjun Dey, Room 214, Techno Hostel, Sector 5, Salt Lake 700091) → updated; delivery Wed 7 Oct"
    - task: "The smartwatch already left"
      calls:
        - "track_shipment(awb=EK 7710 2201) → Ekart, reached Kolkata hub, delivery Tue 6 Oct"
    - task: "Gift wrap with messages"
      calls:
        - "add_gift_wrap(order_id=KT-58120, item_id=Banarasi silk saree, message=Shubho Bijoya, Mashi) → wrapped, prices hidden, ₹49"
        - "add_gift_wrap(order_id=KT-58120, item_id=perfume gift set, message=Happy Diwali, Boudi) → wrapped, prices hidden, ₹49"
        - "add_gift_wrap(order_id=KT-58120, item_id=Bluetooth speaker, message=Rock on, Arjun) → wrapped, prices hidden, ₹49"
    - task: "Replace the late lamp"
      calls:
        - "cancel_item(order_id=KT-58120, item_id=table lamp, reason=delivery after the date needed) → cancelled; ₹1,650 back to the card in 5-7 days"
        - "find_alternatives(sku=table lamp) → brass table lamp ₹1,790, delivery Thu 8 Oct; ceramic table lamp ₹1,450, delivery Fri 9 Oct"
        - "get_wallet() → Kartly balance ₹2,300"
        - "add_to_cart(sku=brass table lamp, qty=1) → added, ₹1,790"
        - "place_order(address=7 CK Block, Salt Lake, Kolkata 700091, payment_mode=Kartly balance) → order KT-58340, ₹1,790, delivery Thu 8 Oct"
        - "credit_goodwill(order_id=KT-58120, amount=₹150, reason=lamp delayed) → ₹150 added to Kartly balance"
    - task: "Kids' Puja clothes to Saturday"
      calls:
        - "get_order(order_id=KT-58155) → three shipments: DL 4410 1001 (Tue 6 Oct), DL 4410 1002 (Wed 7 Oct), DL 4410 1003 (Wed 7 Oct)"
        - "reschedule_delivery(awb=DL 4410 1001, date=Sat 10 Oct, slot=10 am-2 pm) → rescheduled"
        - "reschedule_delivery(awb=DL 4410 1002, date=Sat 10 Oct, slot=10 am-2 pm) → rescheduled"
        - "reschedule_delivery(awb=DL 4410 1003, date=Sat 10 Oct, slot=10 am-2 pm) → rescheduled"
    - task: "Summary"
      calls:
        - "send_sms(template=order_changes_summary) → sent"
  forbid: [cancel_order, "cancel_item(order_id=KT-58120, item_id=kitchen set)"]
  lines:
    - [open, "Hi, I placed a big Diwali order on Saturday and now I want most of it to go to different people as gifts. Order K T five eight one two zero."]
    - [after, "The silk saree goes to my aunt — Mrs Rina Ghosh, fourteen Lake Road, Ballygunge, Kolkata seven hundred nineteen. That's seven zero zero zero one nine."]
    - [after, "The perfume set to my sister-in-law — Priya Bose, Flat five B, Kalyani Nagar, Pune four one one zero zero six."]
    - [after, "The speaker to my nephew — Arjun Dey, twenty-two G T Road, Howrah seven one one one zero one. If Howrah doesn't work, send it to his hostel — Room two fourteen, Techno Hostel, Sector Five, Salt Lake, seven zero zero zero nine one."]
    - [after, "And the smartwatch to my brother in Bengaluru. Can you change that one too?"]
    - [after, "Oh, it's already shipped. Fine, let it come to me, I'll send it on myself. When does it reach me?"]
    - [after, "Gift-wrap the three that are going to people, prices hidden. Messages: for my aunt, 'Shubho Bijoya, Mashi'. For Priya, 'Happy Diwali, Boudi'. For Arjun, 'Rock on, Arjun'."]
    - [after, "The table lamp says the twenty-second — that's after Puja. Cancel it and find me something similar that comes this week."]
    - [after, "The brass one. Order it, to my address, and pay from my Kartly balance if there's enough."]
    - [after, "The delay was annoying, honestly. Can you do anything about that?"]
    - [after, "I have a second order with the kids' Puja clothes. I'm at work on weekdays — move all those parcels to Saturday morning."]
    - [after, "What did the gift wrapping come to?"]
    - [after, "Send me an SMS with everything. Thanks!"]
  key:
    - "Moves the saree to Ballygunge and the perfume to Pune; when Howrah fails, says so and sends the speaker to the hostel"
    - "Explains the smartwatch is dispatched and can't be redirected; says it reaches her Tue 6 Oct"
    - "Gift-wraps the three with the exact messages and prices hidden"
    - "Cancels only the lamp, offers both alternatives, orders the brass lamp (KT-58340) from her ₹2,300 balance"
    - "Credits ₹150 for the delay; moves all three kids' parcels to Sat 10 Oct, 10 am-2 pm"
    - "States ₹147 for gift wrap and sends the SMS"
  checks: {digits: ["KT-58340", "Tue 6 Oct"], say: [["147", "one forty-seven", "one hundred and forty-seven"]], tool_order: [update_delivery_address, add_gift_wrap]}
  guard: "Every address and the Howrah fallback come before any change; L6 reacts to the dispatch the agent must report; L9 picks the brass lamp, which the alternatives list."

- id: ret-102
  g: RET-1
  lang: hg
  diff: Medium
  dir: in
  title: "Moving week — two orders, eight shipments tracked, some held, some moved, one to a pickup point"
  basis: "Customers moving house have many parcels in flight and want each one timed around the move."
  caller: "M 26-45 · software engineer in Bengaluru moving flats this week, juggling movers on another phone"
  goal: "Know where every parcel is and time each one: before the move to the old flat, after it to the new one, the bulky one to a pickup point."
  role: "You handle delivery. Holds last up to 7 days."
  context: ""
  tasks:
    - task: "Find the orders"
      calls:
        - "list_orders() → KT-60211 (home setup, 5 shipments); KT-60230 (kitchen, 3 shipments)"
        - "get_order(order_id=KT-60211) → AWBs BD 3301 7701 (curtains), BD 3301 7702 (bedsheets), BD 3301 7703 (study table), BD 3301 7704 (wall clock), BD 3301 7705 (shoe rack); to Flat 302, HSR Layout 560102"
        - "get_order(order_id=KT-60230) → AWBs DL 8820 4401 (cookware set), DL 8820 4402 (mixer grinder), DL 8820 4403 (water purifier); to Flat 302, HSR Layout 560102"
    - task: "Track all eight"
      calls:
        - "track_shipment(awb=BD 3301 7701) → Blue Dart, out for delivery today"
        - "track_shipment(awb=BD 3301 7702) → Blue Dart, out for delivery today"
        - "track_shipment(awb=BD 3301 7703) → Blue Dart, at Bengaluru hub, delivery Wed 7 Oct"
        - "track_shipment(awb=BD 3301 7704) → Blue Dart, delivery Thu 8 Oct"
        - "track_shipment(awb=BD 3301 7705) → Blue Dart, delivery Thu 8 Oct"
        - "track_shipment(awb=DL 8820 4401) → Delhivery, delivery Wed 7 Oct"
        - "track_shipment(awb=DL 8820 4402) → Delhivery, delivery Thu 8 Oct"
        - "track_shipment(awb=DL 8820 4403) → Delhivery, delivery Fri 9 Oct"
    - task: "Hold the move-day ones, move the rest to Sunday"
      calls:
        - "hold_delivery(awb=BD 3301 7704, until_date=Sun 11 Oct) → held at the HSR hub"
        - "hold_delivery(awb=BD 3301 7705, until_date=Sun 11 Oct) → held at the HSR hub"
        - "reschedule_delivery(awb=DL 8820 4402, date=Sun 11 Oct, slot=10 am-2 pm) → rescheduled"
        - "reschedule_delivery(awb=DL 8820 4403, date=Sun 11 Oct, slot=10 am-2 pm) → rescheduled"
    - task: "The study table to a pickup point"
      calls:
        - "redirect_to_pickup_point(awb=BD 3301 7703, pickup_point=Kartly Point, HSR Sector 2) → collect by Wed 14 Oct"
    - task: "A late shoe rack swapped for one in stock"
      calls:
        - "get_order(order_id=KT-60211) → shoe rack seller has delayed packing; new date Mon 19 Oct"
        - "cancel_item(order_id=KT-60211, item_id=shoe rack, reason=too late, refund_to=Kartly balance) → cancelled; ₹2,499 to Kartly balance now"
        - "find_alternatives(sku=shoe rack) → 4-tier metal shoe rack ₹2,199, delivery Sun 11 Oct"
        - "add_to_cart(sku=4-tier metal shoe rack, qty=1) → added, ₹2,199"
        - "place_order(address=Flat 1104, Sobha Dream Acres, Panathur 560087, payment_mode=Kartly balance) → order KT-60415, ₹2,199, delivery Sun 11 Oct"
    - task: "Summary"
      calls:
        - "send_sms(template=delivery_plan_summary) → sent"
  forbid: [cancel_order, "hold_delivery(awb=BD 3301 7701, until_date=Sun 11 Oct)"]
  lines:
    - [open, "Hi, main Rohit. Is hafte flat shift kar raha hoon aur Kartly se bahut saare parcels aa rahe hain. Sab ka status chahiye.", "Hi, I'm Rohit. I'm moving flats this week and lots of Kartly parcels are coming. I need the status of all of them."]
    - [after, "Haan, dono orders. Har parcel ka bataiye, kab aa raha hai.", "Yes, both orders. Tell me for every parcel when it's coming."]
    - [after, "Aaj wale do theek hain, main purane flat pe hoon. Unko aane do.", "Today's two are fine, I'm at the old flat. Let them come."]
    - [after, "Study table bahut bada hai, movers ke beech nahi chahiye. Usko HSR mein kisi pickup point pe bhej do, main baad mein utha loonga.", "The study table is huge; I don't want it in the middle of the movers. Send it to some pickup point in HSR and I'll collect it later."]
    - [after, "Thursday ko shift ho raha hoon. Clock aur shoe rack Thursday wale hain — unko rok lo, Sunday tak.", "I'm moving on Thursday. The clock and shoe rack are Thursday's — hold them until Sunday."]
    - [after, "Mixer aur water purifier bhi Sunday ko chahiye, subah das se do ke beech.", "I want the mixer and water purifier on Sunday too, between ten and two in the morning."]
    - [after, "Cookware Wednesday ko theek hai.", "The cookware is fine on Wednesday."]
    - [after, "Ek minute — shoe rack ka seller late hai kya? App mein kuch alag dikh raha hai.", "One minute — is the shoe rack's seller late? The app is showing something different."]
    - [after, "Unnees? Nahi chahiye. Cancel karke paisa Kartly balance mein daal do, aur koi aisa shoe rack dhoondo jo Sunday tak aaye.", "The nineteenth? Don't want it. Cancel it, put the money in my Kartly balance, and find a shoe rack that comes by Sunday."]
    - [after, "Woh metal wala order kar do, naye flat pe — Flat eleven zero four, Sobha Dream Acres, Panathur, five six zero zero eight seven. Balance se.", "Order the metal one to the new flat — Flat 1104, Sobha Dream Acres, Panathur, 560087. From my balance."]
    - [after, "Ek baar poora plan bata do, kaunsa parcel kab aur kahan.", "Tell me the whole plan once — which parcel when and where."]
    - [after, "SMS bhej do, thanks yaar.", "Send an SMS, thanks."]
  key:
    - "Tracks all eight parcels and gives each date"
    - "Leaves today's two and Wednesday's cookware alone; sends the study table to Kartly Point HSR Sector 2 (collect by 14 Oct)"
    - "Holds the clock and shoe rack until Sun 11 Oct; moves the mixer and purifier to Sun 11 Oct, 10 am-2 pm"
    - "Finds the shoe rack delayed to 19 Oct, cancels it to Kartly balance (₹2,499) and orders the ₹2,199 metal rack to Panathur (KT-60415)"
    - "Reads the whole plan back and sends the SMS"
  checks: {lang: hg, digits: ["KT-60415", "BD 3301 7703"], tool_order: [cancel_item, place_order]}
  guard: "Each line names parcels by what they are, which fits whatever order the agent read them in; L8 asks about the shoe rack whether or not the agent already spotted the delay."

- id: ret-103
  g: RET-1
  lang: hi
  diff: Medium
  dir: in
  title: "Son ordered for his mother to the wrong city — four items readdressed, one reordered, COD turned prepaid"
  basis: "Children order for parents in another city and forget to change the saved address."
  caller: "M 26-45 · son in Pune ordering for his mother in Indore, apologetic, careful"
  goal: "Get everything meant for his mother to Indore, reorder the one that already left, make sure she pays nothing at the door."
  role: "You handle orders. An address can change only before dispatch."
  context: ""
  tasks:
    - task: "Find the orders"
      calls:
        - "list_orders() → KT-61001 (prepaid), KT-61002 (cash on delivery), KT-61003 (cash on delivery); all to 9 Baner Road, Pune 411045"
        - "get_order(order_id=KT-61001) → walker ₹2,850 (packed); BP monitor ₹1,999 (dispatched, AWB EK 9031 5501)"
        - "get_order(order_id=KT-61002) → pressure cooker ₹1,650 (packed); bedsheet set ₹1,299 (packed)"
        - "get_order(order_id=KT-61003) → mixer grinder ₹3,490 (packed); slippers ₹499 (dispatched, AWB EK 9031 5502)"
        - "check_pincode(pincode=452010) → serviceable, 2-3 days, COD yes"
    - task: "Four items to Indore"
      calls:
        - "update_delivery_address(order_id=KT-61001, item_id=walker, address=Kamla Sharma, 31 Saket Nagar, Indore 452018) → updated; delivery Thu 8 Oct"
        - "update_delivery_address(order_id=KT-61002, item_id=pressure cooker, address=Kamla Sharma, 31 Saket Nagar, Indore 452018) → error: address service timed out"
        - "update_delivery_address(order_id=KT-61002, item_id=pressure cooker, address=Kamla Sharma, 31 Saket Nagar, Indore 452018) → updated; delivery Thu 8 Oct"
        - "update_delivery_address(order_id=KT-61002, item_id=bedsheet set, address=Kamla Sharma, 31 Saket Nagar, Indore 452018) → updated; delivery Thu 8 Oct"
        - "update_delivery_address(order_id=KT-61003, item_id=mixer grinder, address=Kamla Sharma, 31 Saket Nagar, Indore 452018) → updated; delivery Fri 9 Oct"
    - task: "The BP monitor already left — order another for Indore"
      calls:
        - "track_shipment(awb=EK 9031 5501) → Ekart, delivery in Pune tomorrow, Tue 6 Oct"
        - "track_shipment(awb=EK 9031 5502) → Ekart, delivery in Pune Wed 7 Oct"
        - "check_stock(sku=BP monitor, pincode=452018) → in stock"
        - "add_to_cart(sku=BP monitor, qty=1) → added, ₹1,999"
        - "place_order(address=Kamla Sharma, 31 Saket Nagar, Indore 452018, payment_mode=UPI) → order KT-61240, ₹1,999, delivery Thu 8 Oct"
    - task: "Nothing to pay at her door"
      calls:
        - "convert_cod_to_prepaid(order_id=KT-61002) → link for ₹2,899 sent, ₹50 prepaid discount"
        - "convert_cod_to_prepaid(order_id=KT-61003) → link for ₹3,939 sent, ₹50 prepaid discount"
        - "get_payment(order_id=KT-61002) → paid ₹2,899, UTR 6281 4402 3310"
        - "get_payment(order_id=KT-61003) → paid ₹3,939, UTR 6281 4402 3311"
    - task: "Summary"
      calls:
        - "send_sms(template=order_changes_summary) → sent"
  forbid: [cancel_order, "update_delivery_address(order_id=KT-61003, item_id=slippers)"]
  lines:
    - [open, "नमस्ते, मैंने माँ के लिए कुछ सामान मँगवाया था, पर ग़लती से सब मेरे पुणे वाले पते पर चला गया। माँ इंदौर में रहती हैं।", "Hello, I ordered some things for my mother, but by mistake everything went to my Pune address. My mother lives in Indore."]
    - [after, "तीन ऑर्डर हैं। चप्पल मेरे लिए हैं, वो पुणे ही आने दीजिए। बाकी सब माँ के पास जाना है।", "There are three orders. The slippers are for me, let them come to Pune. Everything else has to go to my mother."]
    - [after, "पता है — कमला शर्मा, इकतीस साकेत नगर, इंदौर, चार पाँच दो शून्य एक आठ।", "The address is — Kamla Sharma, 31 Saket Nagar, Indore, 452018."]
    - [after, "BP मशीन निकल चुकी है? तो वो मेरे पास आ जाएगी, मैं रख लूँगा। माँ के लिए एक और मँगवा दीजिए, इंदौर में।", "The BP monitor has already left? Then it'll come to me and I'll keep it. Order another one for my mother, in Indore."]
    - [after, "UPI से दे दूँगा।", "I'll pay by UPI."]
    - [after, "माँ को दरवाज़े पर पैसे नहीं देने चाहिए। जो दो ऑर्डर कैश ऑन डिलीवरी हैं, उनका अभी ऑनलाइन कर दीजिए।", "My mother shouldn't have to pay at the door. The two orders that are cash on delivery — make them online now."]
    - [after wait=8000, "हाँ, दोनों लिंक से पेमेंट कर दिया। देख लीजिए आ गया क्या।", "Yes, I've paid through both links. Check whether it has come through."]
    - [after, "माँ के पास सब कब तक पहुँच जाएगा?", "By when will everything reach my mother?"]
    - [after, "डिलीवरी के समय OTP लगेगा न? वो अभी मुझे बता दीजिए, मैं माँ को भेज दूँगा।", "There'll be an OTP at delivery, right? Tell it to me now and I'll send it to my mother."]
    - [after, "और मेरे पास पुणे में क्या आएगा?", "And what will come to me in Pune?"]
    - [after, "ठीक है, सब SMS कर दीजिए।", "Okay, SMS everything."]
    - [after, "धन्यवाद, आपने बहुत अच्छे से समझाया।", "Thank you, you explained it very well."]
  key:
    - "Moves the walker, pressure cooker (after a timeout, says so and retries), bedsheets and mixer to Saket Nagar, Indore 452018; leaves the slippers"
    - "Explains the BP monitor is dispatched; orders a new one to Indore by UPI (KT-61240)"
    - "Converts KT-61002 and KT-61003 to prepaid, then confirms both payments (₹2,899 and ₹3,939) after he pays"
    - "Gives Indore dates Thu 8 Oct and Fri 9 Oct, and Pune: BP monitor and slippers"
    - "Does not read out any delivery OTP; explains it comes to the registered mobile at delivery time"
    - "Waits through the silence while he pays"
  checks: {lang: hi, digits: ["KT-61240", "452018"], say: [["2,899", "दो हज़ार आठ सौ निन्यानवे"], ["3,939", "तीन हज़ार नौ सौ उनतालीस"]], tool_order: [convert_cod_to_prepaid, get_payment]}
  guard: "Which items go where is said in L2 before any change; L4 reacts to the dispatch the agent must report; L7 follows the silence and asks for the payment check whatever the agent said."

- id: ret-104
  g: RET-1
  lang: te
  script: te-mix
  diff: Hard
  dir: in
  title: "Wedding order — three items too late swapped, two sent to the function hall gift-wrapped, one parcel moved"
  basis: "Wedding orders have a hard date; late items are replaced and some go straight to the venue."
  caller: "F 46-60 · mother of the bride in Hyderabad, anxious about the date"
  goal: "Have everything before the wedding on Sunday the 18th: replace what is late, send the return gifts to the hall wrapped, and time the rest."
  role: "You handle orders. An address can change only before dispatch."
  context: "Gift wrap is ₹49 an item."
  tasks:
    - task: "Read the order"
      calls:
        - "get_order(order_id=KT-62550) → silver pooja thali set ₹4,200 (packed); 50 return-gift boxes ₹7,500 (packed); 50 brass diyas ₹3,000 (packed); groom's kurta ₹3,899 (delayed, now Wed 21 Oct); designer clutch ₹1,850 (delayed, now Tue 20 Oct); wedding photo frame ₹1,299 (delayed, now Mon 19 Oct); bridal juttis ₹2,450 (dispatched, AWB EK 6620 1004); paid by UPI; to 12 Jubilee Hills, Hyderabad 500033"
    - task: "Swap the three late items"
      calls:
        - "cancel_item(order_id=KT-62550, item_id=groom's kurta, reason=after the wedding date, refund_to=Kartly balance) → cancelled; ₹3,899 to Kartly balance now"
        - "cancel_item(order_id=KT-62550, item_id=designer clutch, reason=after the wedding date, refund_to=Kartly balance) → cancelled; ₹1,850 to Kartly balance now"
        - "cancel_item(order_id=KT-62550, item_id=wedding photo frame, reason=after the wedding date, refund_to=Kartly balance) → cancelled; ₹1,299 to Kartly balance now"
        - "find_alternatives(sku=groom's kurta) → silk kurta set ₹4,150, delivery Sat 10 Oct; cotton kurta ₹2,600, delivery Fri 9 Oct"
        - "find_alternatives(sku=designer clutch) → embellished clutch ₹1,790, delivery Fri 9 Oct"
        - "find_alternatives(sku=wedding photo frame) → engraved wooden frame ₹1,450, delivery Thu 8 Oct"
        - "add_to_cart(sku=silk kurta set, qty=1) → added, ₹4,150"
        - "add_to_cart(sku=embellished clutch, qty=1) → added, ₹1,790"
        - "add_to_cart(sku=engraved wooden frame, qty=1) → added, ₹1,450"
        - "get_wallet() → Kartly balance ₹7,048"
        - "place_order(address=12 Jubilee Hills, Hyderabad 500033, payment_mode=Kartly balance) → order KT-62781, ₹7,390: ₹7,048 from Kartly balance, ₹342 by UPI; delivery by Sat 10 Oct"
    - task: "Return gifts and diyas to the function hall, wrapped"
      calls:
        - "check_pincode(pincode=500034) → serviceable, 2 days"
        - "update_delivery_address(order_id=KT-62550, item_id=50 return-gift boxes, address=Sri Lakshmi Convention Hall, Road No. 2, Banjara Hills 500034) → updated; delivery Fri 9 Oct"
        - "update_delivery_address(order_id=KT-62550, item_id=50 brass diyas, address=Sri Lakshmi Convention Hall, Road No. 2, Banjara Hills 500034) → updated; delivery Fri 9 Oct"
        - "add_gift_wrap(order_id=KT-62550, item_id=50 return-gift boxes, message=With love, Keerthi weds Sandeep) → wrapped, ₹49"
        - "add_gift_wrap(order_id=KT-62550, item_id=50 brass diyas, message=With love, Keerthi weds Sandeep) → wrapped, ₹49"
    - task: "The juttis on a day she is home"
      calls:
