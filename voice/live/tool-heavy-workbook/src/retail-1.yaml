- id: ret-108
  g: RET-2
  lang: en
  diff: Medium
  dir: in
  title: "Sale-day payment chaos — five orders: debited but failed, pending, re-paid by link, coupons re-checked"
  basis: "On big sale days payments time out and customers are left unsure which orders went through."
  caller: "M 18-25 · college student in Pune who shopped the midnight sale, worried about money"
  goal: "Know which of five orders actually went through, get his money back where it was taken twice or for nothing, and complete the ones he still wants."
  role: "You handle payments. A debit for an order that failed is refunded automatically within 3 working days."
  context: "Coupons stay valid on a re-paid order for 24 hours."
  tasks:
    - task: "Check each order's payment"
      calls:
        - "list_orders() → KT-66001 earbuds, KT-66002 backpack, KT-66003 sneakers, KT-66004 hoodie, KT-66005 power bank; all placed today between 12:02 am and 12:20 am"
        - "get_payment(order_id=KT-66001) → paid ₹1,799, UTR 6284 0012 1101; order confirmed"
        - "get_payment(order_id=KT-66002) → debited ₹1,299, UTR 6284 0012 1102; order failed; refund due by Thu 8 Oct"
        - "get_payment(order_id=KT-66003) → payment pending; order on hold for 24 hours"
        - "get_payment(order_id=KT-66004) → not debited; order failed"
        - "get_payment(order_id=KT-66005) → paid twice: ₹999, UTR 6284 0012 1105 and ₹999, UTR 6284 0012 1106; order confirmed"
    - task: "Refund status for the money taken for nothing"
      calls:
        - "check_refund(order_id=KT-66002, item_id=backpack) → ₹1,299 to UPI by Thu 8 Oct, ref RF 7702"
        - "check_refund(order_id=KT-66005, item_id=power bank) → ₹999 second payment to UPI by Wed 7 Oct, ref RF 7705"
    - task: "Re-pay the ones he still wants"
      calls:
        - "validate_coupon(code=SALE15, cart_value=₹2,999) → valid on the re-paid sneakers order; ₹450 off"
        - "send_payment_link(order_id=KT-66003, amount=₹2,549) → link sent by SMS"
        - "validate_coupon(code=SALE15, cart_value=₹1,499) → valid on the re-paid hoodie order; ₹225 off"
        - "send_payment_link(order_id=KT-66004, amount=₹1,274) → link sent by SMS"
        - "send_payment_link(order_id=KT-66002, amount=₹1,299) → link sent by SMS"
        - "get_payment(order_id=KT-66003) → paid ₹2,549; order confirmed"
        - "get_payment(order_id=KT-66004) → error: payment status service timed out"
        - "get_payment(order_id=KT-66004) → paid ₹1,274; order confirmed"
        - "get_payment(order_id=KT-66002) → paid ₹1,299; order confirmed"
    - task: "Something for the trouble, ticket, summary"
      calls:
        - "credit_goodwill(order_id=KT-66005, amount=₹100, reason=double charge on sale day) → ₹100 added to Kartly balance"
        - "raise_ticket(category=duplicate payment, summary=KT-66005 charged twice, UTR 6284 0012 1106) → ticket PY 66050"
        - "send_sms(template=payments_summary) → sent"
  forbid: ["cancel_order(order_id=KT-66001)", "send_payment_link(order_id=KT-66005)"]
  lines:
    - [open, "Hi, I shopped the midnight sale and the payments went crazy. Five orders. Some show money gone, some say failed. I don't know what I've paid for."]
    - [after, "Can you check all five, one by one?"]
    - [after, "So the backpack money is gone but the order failed? Will I get it back?"]
    - [after, "And the power bank charged me twice?! Get that back."]
    - [after, "I still want the backpack, the sneakers and the hoodie. Can I pay again? I had a SALE fifteen coupon — does that still work?"]
    - [after wait=9000, "Okay, I've paid all three links. Can you check they went through?"]
    - [after, "Phew. So what's the total I've actually paid today, for things I'm getting?"]
    - [after, "Can I get anything for the double charge mess?"]
    - [after, "And when exactly do I get the two refunds?"]
    - [after, "Is the earbuds order fine? I don't want to lose that one."]
    - [after, "Send me all of it on SMS please."]
    - [after, "Thanks, you saved my month."]
  key:
    - "Checks all five: earbuds paid; backpack debited but failed (refund by Thu 8 Oct); sneakers pending; hoodie not debited; power bank paid twice"
    - "Confirms both refunds: ₹1,299 by Thu 8 Oct and the duplicate ₹999 by Wed 7 Oct"
    - "Re-checks SALE15 on each re-paid order and sends links: sneakers ₹2,549, hoodie ₹1,274, backpack ₹1,299"
    - "Confirms all three payments after he pays; when the hoodie check times out, says so and checks again"
    - "States ₹7,920 paid for the five items he gets; credits ₹100 and raises PY 66050"
  checks: {digits: ["2,549", "1,274", "PY 66050"], say: [["7,920", "seven thousand nine hundred and twenty", "seven thousand nine hundred twenty"]], tool_order: [send_payment_link, get_payment]}
  guard: "L3–L4 react to results the agent must give; L6 follows a silence while he pays and asks for the checks; L7 asks for the total whatever was said."
