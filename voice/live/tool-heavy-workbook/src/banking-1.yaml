    - [after, "University fee எண்பத்தி நாலாயிரம் என் card ல கட்டினேன். அதை பன்னிரண்டு மாசம் EMI ஆக்குங்க.", "I paid the university fee of eighty-four thousand on my card. Make it twelve months' EMI."]
    - [after, "அந்த fee க்கு foreign currency charge போட்டிருக்காங்க. அதை waive பண்ண முடியுமா?", "There's a foreign currency charge on that fee. Can you waive it?"]
    - [after, "சரி. இன்னொன்னு — மாசா மாசம் ஒன்னாம் தேதி அவ account க்கு இருபத்தஞ்சாயிரம் போகணும். என் savings ல இருந்து.", "Okay. One more — twenty-five thousand should go to her account on the first of every month. From my savings."]
