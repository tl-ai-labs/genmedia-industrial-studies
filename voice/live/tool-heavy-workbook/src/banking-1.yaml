# Banking & insurance — tool-heavy scenarios bank-101 … bank-108 (BANK-1 Cards, BANK-4 Fraud).
code: bank
scenarios:

- id: bank-101
  g: BANK-1
  lang: en
  diff: Hard
  dir: in
  title: "Lost wallet — block three cards, dispute six charges, reissue, new controls"
  basis: "A lost wallet means every card blocked, every unknown charge disputed one by one and new cards set up again."
  caller: "M 26-45 · office worker who lost his wallet at a railway station, hurried but clear"
  goal: "Block his two cards and his wife's add-on, dispute every charge made after the loss, get new cards and set limits on them."
  role: "You handle cards. Block first, then look at the charges."
  context: "Disputes for charges after a card is reported lost are raised one per transaction."
  noise: {bed: street_traffic, snr_db: 12}
  tasks:
    - task: "Verify and find the cards"
      calls:
        - "verify_caller(name=Rahul Iyer, dob=12 Mar 1986) → verified"
        - "get_accounts() → joint savings 1190 (Rahul Iyer, Lakshmi Iyer) with debit cards 8823 (Rahul) and 8840 (Lakshmi); credit card 4417 (Rahul)"
        - "get_card(card_last4=4417) → Kosh Gold credit card, limit ₹2,50,000, add-on 4425 for Lakshmi Iyer"
    - task: "Block the three cards that were in the wallet"
      calls:
        - "block_card(card_last4=4417, reason=lost) → blocked, BL 70311"
        - "block_card(card_last4=8823, reason=lost) → blocked, BL 70312"
        - "block_card(card_last4=4425, reason=lost) → blocked, BL 70313"
    - task: "Charges since the loss"
      calls:
        - "get_transactions(card_last4=4417, from_date=Sun 4 Oct, to_date=Mon 5 Oct) → Sun 4 Oct ₹1,240 Swiggy; today 9:12 am ₹18,450 Croma online, ref CC 7741 2001; 9:47 am ₹6,999 Zivame, ref CC 7741 2002; 10:05 am ₹1,180 Uber, ref CC 7741 2003; 10:20 am ₹2,400 BookMyShow, ref CC 7741 2004"
        - "get_transactions(card_last4=8823, from_date=Sun 4 Oct, to_date=Mon 5 Oct) → Sun 4 Oct ₹2,300 DMart; today 9:25 am ATM withdrawal ₹10,000 at Dadar, ref AT 5521 0091"
        - "get_transactions(card_last4=4425, from_date=Sun 4 Oct, to_date=Mon 5 Oct) → today 10:32 am ₹4,999 Myntra, ref CC 7745 3310"
    - task: "Dispute the six charges after the loss"
      calls:
        - "raise_dispute(txn_ref=CC 7741 2001, reason=card lost, not made by customer) → dispute DS 40211, decision within 30 days"
        - "raise_dispute(txn_ref=CC 7741 2002, reason=card lost, not made by customer) → dispute DS 40212, decision within 30 days"
        - "raise_dispute(txn_ref=CC 7741 2003, reason=card lost, not made by customer) → dispute DS 40213, decision within 30 days"
        - "raise_dispute(txn_ref=CC 7741 2004, reason=card lost, not made by customer) → dispute DS 40214, decision within 30 days"
        - "raise_dispute(txn_ref=AT 5521 0091, reason=card lost, not made by customer) → dispute DS 40215, decision within 30 days"
        - "raise_dispute(txn_ref=CC 7745 3310, reason=card lost, not made by customer) → dispute DS 40216, decision within 30 days"
    - task: "New cards — his two to the office, hers home"
      calls:
        - "reissue_card(card_last4=4417, deliver_to=office) → error: no office address on the credit card account; home address is on file"
        - "reissue_card(card_last4=4417, deliver_to=home) → new card ending 6630, dispatched Tue 6 Oct"
        - "reissue_card(card_last4=8823, deliver_to=office) → new card ending 2291, dispatched Tue 6 Oct to the Powai office"
        - "reissue_card(card_last4=4425, deliver_to=home) → new card ending 6648, dispatched Tue 6 Oct"
    - task: "Controls on the new cards"
      calls:
        - "set_card_control(card_last4=6630, channel=international, enabled=no) → updated"
        - "set_card_control(card_last4=6648, channel=international, enabled=no) → updated"
        - "set_card_control(card_last4=6648, channel=online, enabled=yes, limit=₹10,000) → updated"
        - "set_card_control(card_last4=2291, channel=ATM, enabled=yes, limit=₹10,000) → updated"
        - "set_card_control(card_last4=2291, channel=contactless, enabled=no) → updated"
    - task: "Summary"
      calls:
        - "send_sms(template=block_and_reissue_summary) → sent"
  forbid: ["block_card(card_last4=8840)", update_contact]
  lines:
    - [open, "Hi, I lost my wallet at Dadar station this morning, around eight thirty. All my cards were in it. Please block them."]
    - [after, "Rahul Iyer. Date of birth twelfth March nineteen eighty-six."]
    - [after, "My credit card, my debit card, and my wife's add-on card on my credit card. Her own debit card is at home with her — leave that one alone."]
    - [after, "Are there any charges this morning? I haven't used a single card today."]
    - [after, "None of those are mine. Not one. Dispute every charge from this morning."]
    - [after, "How much is that altogether?"]
    - [after, "Okay. Now the new cards. Send my two to my office in Powai, and my wife's to home. If the office address doesn't work for a card, send that one home."]
    - [after, "What do the new cards end in?"]
    - [after, "On the new cards, switch off international on both credit cards. And my wife's online limit — ten thousand."]
    - [pause 1600, "And on my new debit card, ATM up to ten thousand a day, and turn off tap-to-pay."]
    - [after, "When do they arrive?"]
    - [after, "Should I do anything else? Police complaint or something?"]
    - [after, "Send me a summary by SMS, please."]
    - [after, "That's all. Thanks for the quick help."]
  key:
    - "Verifies Rahul before acting; blocks 4417, 8823 and add-on 4425, and leaves Lakshmi's 8840 alone"
    - "Reads the morning charges and disputes all six, one dispute each (DS 40211 to DS 40216)"
    - "States the disputed total ₹44,028"
    - "When the office address fails for 4417, says so and sends it home (6630); 2291 goes to the Powai office, 6648 home"
    - "Sets international off on 6630 and 6648, ₹10,000 online on 6648, ₹10,000 ATM and tap-to-pay off on 2291"
    - "Suggests reporting it on 1930 and to the police; sends the summary"
  checks: {digits: ["6630", "2291", "6648"], say: [["44,028", "forty-four thousand and twenty-eight", "forty four thousand twenty eight"]], tool_order: [block_card, raise_dispute]}
  guard: "Which cards, which address and the fallback are given before any reissue; L4–L5 ask for every morning charge whatever the agent reads out; L9–L10 name each control on each new card by role, so any card numbers the agent quoted fit."

- id: bank-102
  g: BANK-1
  lang: hg
  diff: Medium
  dir: in
  title: "Add-on cards for the family — limits, controls per card, a card for a minor refused"
  basis: "Customers add family members to a credit card and want a different limit and set of controls for each one."
  caller: "M 46-60 · father of two, businessman, decisive"
  goal: "Add-on cards for his wife, mother and son with their own limits and controls, a higher limit for himself and a purchase moved to EMI."
  role: "You handle cards. Add-on cards are only for family members aged 18 or over."
  context: "Add-on cards are free. Their limits come out of the primary card's limit."
  tasks:
    - task: "Verify and check the card"
      calls:
        - "verify_caller(name=Vikas Malhotra, dob=3 Aug 1974) → verified"
        - "get_card(card_last4=5512) → Kosh Platinum credit card, limit ₹3,00,000, ₹1,12,000 used, no add-ons"
    - task: "Three add-on cards"
      calls:
        - "request_addon_card(card_last4=5512, member=Sunita Malhotra, limit=₹1,00,000) → add-on ending 5520, dispatched Wed 7 Oct"
        - "request_addon_card(card_last4=5512, member=Kamla Devi Malhotra, limit=₹25,000) → add-on ending 5538, dispatched Wed 7 Oct"
        - "request_addon_card(card_last4=5512, member=Aarav Malhotra, limit=₹20,000) → add-on ending 5546, dispatched Wed 7 Oct"
    - task: "Aarav's card: online only, no gaming"
      calls:
        - "set_card_control(card_last4=5546, channel=international, enabled=no) → updated"
        - "set_card_control(card_last4=5546, channel=ATM, enabled=no) → updated"
        - "set_card_control(card_last4=5546, channel=contactless, enabled=no) → updated"
        - "set_card_control(card_last4=5546, channel=online, enabled=yes, limit=₹10,000) → updated"
        - "block_merchant(card_last4=5546, merchant=Dream11) → blocked"
        - "block_merchant(card_last4=5546, merchant=MPL) → blocked"
    - task: "His mother's card: tap in shops only"
      calls:
        - "set_card_control(card_last4=5538, channel=online, enabled=no) → updated"
        - "set_card_control(card_last4=5538, channel=ATM, enabled=no) → updated"
        - "set_card_control(card_last4=5538, channel=contactless, enabled=yes, limit=₹2,000) → updated"
    - task: "Sunita's card: international"
      calls:
        - "set_card_control(card_last4=5520, channel=international, enabled=yes, limit=₹50,000) → updated"
    - task: "His own limit"
      calls:
        - "check_limit_offer(card_last4=5512) → pre-approved increase to ₹4,00,000"
        - "set_credit_limit(card_last4=5512, limit=₹4,00,000) → limit changed"
    - task: "Fridge purchase to EMI"
      calls:
        - "get_transactions(card_last4=5512, from_date=1 Sep, to_date=30 Sep) → Sat 26 Sep ₹48,900 Croma, ref CC 5512 0926; other purchases under ₹5,000"
        - "get_emi_options(txn_ref=CC 5512 0926) → 6 months ₹8,511 a month; 12 months ₹4,414 a month; 15% a year; ₹499 processing fee"
        - "convert_to_emi(txn_ref=CC 5512 0926, tenure_months=12) → ₹4,414 a month from the 18 Oct statement"
    - task: "Summary"
      calls:
        - "send_sms(template=addon_card_summary) → sent"
  forbid: ["request_addon_card(card_last4=5512, member=Riya Malhotra)"]
  lines:
    - [open, "Hello, main Vikas Malhotra bol raha hoon. Mere credit card pe family ke liye add-on cards chahiye. Card ending five five one two.", "Hello, this is Vikas Malhotra. I want add-on cards for my family on my credit card. Card ending 5512."]
    - [after, "Date of birth teen August unnees sau chauhattar.", "Date of birth third August 1974."]
    - [after, "Teen log. Wife Sunita — ek lakh limit. Mummy, Kamla Devi — pachchees hazaar. Aur beta Aarav, unnees saal ka — bees hazaar.", "Three people. My wife Sunita — one lakh limit. My mother, Kamla Devi — twenty-five thousand. And my son Aarav, nineteen — twenty thousand."]
    - [after, "Aur meri beti Riya ke liye bhi ek bana do. Woh solah saal ki hai.", "And make one for my daughter Riya too. She's sixteen."]
    - [after, "Achha, theek hai, uska baad mein dekhenge. Aarav ke card pe international, ATM aur tap-to-pay band rakhna. Online chalu, par das hazaar tak.", "Okay, fine, we'll see about hers later. On Aarav's card keep international, ATM and tap-to-pay off. Online on, but up to ten thousand."]
    - [after, "Aur uske card pe Dream11 aur MPL block kar do. Gaming wale.", "And block Dream11 and MPL on his card. The gaming ones."]
    - [after, "Mummy ke card pe online band, ATM bhi band. Sirf dukaan pe tap karke chalaye, do hazaar tak.", "On my mother's card, online off, ATM off too. She should only tap in shops, up to two thousand."]
    - [after, "Sunita ke card pe international chalu kar do, pachaas hazaar tak.", "Switch on international on Sunita's card, up to fifty thousand."]
    - [after, "Ek aur baat — mera apna limit badh sakta hai kya?", "One more thing — can my own limit go up?"]
    - [bc 1500 L9, "Haan haan.", "Yes, yes."]
    - [after, "Theek hai, badha do.", "Okay, increase it."]
    - [after, "Pichhle mahine Croma se fridge liya tha. Usko EMI mein kar sakte ho?", "Last month I bought a fridge from Croma. Can you put it on EMI?"]
    - [after, "Baara mahine wala kar do.", "Do the twelve-month one."]
    - [after, "Cards kab tak aayenge? Sab ka summary SMS kar dena.", "When will the cards arrive? SMS a summary of everything."]
    - [after, "Bas, thank you ji.", "That's all, thank you."]
  key:
    - "Verifies Vikas; adds add-ons for Sunita (₹1,00,000, 5520), Kamla Devi (₹25,000, 5538) and Aarav (₹20,000, 5546)"
    - "Explains Riya cannot have an add-on until she is 18 and does not request one"
    - "On 5546: international, ATM and tap-to-pay off, online on up to ₹10,000; Dream11 and MPL blocked"
    - "On 5538: online and ATM off, tap-to-pay on up to ₹2,000. On 5520: international on up to ₹50,000"
    - "Raises 5512's limit to the pre-approved ₹4,00,000 once he agrees"
    - "Converts the ₹48,900 Croma purchase to 12 months at ₹4,414 a month and mentions the ₹499 fee"
    - "Gives the dispatch date and sends the summary"
  checks: {lang: hg, digits: ["5520", "5538", "5546"], say: [["4,414", "chaar hazaar chaar sau chaudah", "four thousand four hundred fourteen"]], tool_order: [verify_caller, request_addon_card]}
  guard: "Each line names whose card it is; L5 accepts the refusal whatever words it came in; L11 accepts any offer the agent quoted."

- id: bank-103
  g: BANK-1
  lang: hi
  diff: Medium
  dir: in
  title: "Daughter's wedding on the card — five purchases to EMI, one not eligible, fees, autopay"
  basis: "Big family expenses go on a credit card and customers then convert each purchase to EMI separately."
  caller: "M 46-60 · father planning his daughter's wedding, careful with money"
  goal: "Move each big wedding purchase to EMI, get fees waived, raise his limit and pay the bill automatically."
  role: "You handle cards. Give the monthly amount before converting anything."
  context: "Jewellery purchases cannot be converted to EMI. A late fee can be reversed once in 12 months."
  tasks:
    - task: "Verify and read the statement"
      calls:
        - "verify_caller(name=Ramesh Chandra Gupta, dob=21 Jan 1968) → verified"
        - "get_card_statement(card_last4=7781) → total due ₹5,32,600, minimum due ₹26,630, due 18 Oct; fees: late fee ₹1,000, cash withdrawal fee ₹500"
    - task: "Find the wedding purchases"
      calls:
        - "get_transactions(card_last4=7781, from_date=1 Aug, to_date=31 Aug) → 15 Aug ₹1,85,000 Tanishq, ref CC 7781 0815; 22 Aug ₹48,000 Nalli Silks, ref CC 7781 0822"
        - "get_transactions(card_last4=7781, from_date=1 Sep, to_date=30 Sep) → 2 Sep ₹1,20,000 Shree Caterers, ref CC 7781 0902; 5 Sep ₹65,000 Royal Tent House, ref CC 7781 0905; 12 Sep ₹92,000 Vijay Sales, ref CC 7781 0912"
    - task: "EMI options for each"
      calls:
        - "get_emi_options(txn_ref=CC 7781 0815) → not eligible: jewellery purchases can't be converted to EMI"
        - "get_emi_options(txn_ref=CC 7781 0822) → 6 months ₹8,354 a month; 12 months ₹4,332 a month; 15% a year; ₹199 fee"
        - "get_emi_options(txn_ref=CC 7781 0902) → 6 months ₹20,884 a month; 12 months ₹10,831 a month; 15% a year; ₹199 fee"
        - "get_emi_options(txn_ref=CC 7781 0905) → 6 months ₹11,312 a month; 12 months ₹5,867 a month; 15% a year; ₹199 fee"
        - "get_emi_options(txn_ref=CC 7781 0912) → 6 months ₹16,011 a month; 12 months ₹8,304 a month; 15% a year; ₹199 fee"
    - task: "Convert four: sarees over 6 months, the rest over 12"
      calls:
        - "convert_to_emi(txn_ref=CC 7781 0822, tenure_months=6) → ₹8,354 a month from the 18 Oct statement"
        - "convert_to_emi(txn_ref=CC 7781 0902, tenure_months=12) → ₹10,831 a month from the 18 Oct statement"
        - "convert_to_emi(txn_ref=CC 7781 0905, tenure_months=12) → ₹5,867 a month from the 18 Oct statement"
        - "convert_to_emi(txn_ref=CC 7781 0912, tenure_months=12) → ₹8,304 a month from the 18 Oct statement"
    - task: "Fees"
      calls:
        - "reverse_fee(card_last4=7781, fee=late fee) → reversed ₹1,000 (first in 12 months)"
        - "reverse_fee(card_last4=7781, fee=cash withdrawal fee) → not eligible: cash withdrawal fees are not reversed"
    - task: "Higher limit before the wedding"
      calls:
        - "check_limit_offer(card_last4=7781) → pre-approved increase from ₹6,00,000 to ₹8,00,000"
        - "set_credit_limit(card_last4=7781, limit=₹8,00,000) → limit changed"
    - task: "Pay the bill automatically, schedule by email, SMS"
      calls:
        - "set_standing_instruction(from_account_last4=3304, to=credit card 7781, amount=full amount due, day=15) → SI 66120, first on 15 Oct"
        - "request_statement(card_last4=7781, kind=EMI schedule) → emailed"
        - "send_sms(template=emi_summary) → sent"
  forbid: ["convert_to_emi(txn_ref=CC 7781 0815)"]
  lines:
    - [open, "नमस्ते, मेरा नाम रमेश चंद्र गुप्ता है। बेटी की शादी है, सारा खर्च क्रेडिट कार्ड पर हुआ है। कार्ड सात सात आठ एक पर ख़त्म होता है।", "Hello, my name is Ramesh Chandra Gupta. My daughter is getting married and all the spending went on my credit card. The card ends 7781."]
    - [after, "जन्मतिथि इक्कीस जनवरी उन्नीस सौ अड़सठ।", "Date of birth twenty-first January 1968."]
    - [after, "अगस्त और सितंबर में जितनी बड़ी ख़रीदारी हुई — ज़ेवर, साड़ियाँ, कैटरर, टेंट, और टीवी-फ्रिज — सबको EMI में करना है।", "All the big purchases in August and September — jewellery, sarees, caterer, tent, and TV and fridge — I want all of them on EMI."]
    - [after, "ज़ेवर वाला नहीं होगा? अच्छा। बाकी चारों की किश्त कितनी बनेगी?", "The jewellery one can't be done? Okay. What will the instalments be for the other four?"]
    - [after, "साड़ियों वाला छह महीने में कर दीजिए, बाकी सब बारह महीने में।", "Do the sarees over six months, and all the rest over twelve months."]
    - [after, "तो हर महीने कुल कितनी किश्त जाएगी?", "So how much will go in instalments every month in total?"]
    - [after wait=7000, "माफ़ कीजिए, लिख रहा था। ठीक है।", "Sorry, I was writing it down. Okay."]
    - [after, "बिल में लेट फ़ीस लगी है, और एक कैश निकालने की फ़ीस भी। दोनों हटा सकते हैं?", "There's a late fee on the bill, and a cash withdrawal fee too. Can you remove both?"]
    - [after, "चलिए, जो हो सकता है वो कीजिए। शादी नवंबर में है, लिमिट थोड़ी बढ़ सकती है?", "Fine, do what you can. The wedding is in November — can the limit go up a bit?"]
    - [after, "हाँ, बढ़ा दीजिए।", "Yes, increase it."]
    - [after, "आगे से बिल अपने आप भरना चाहिए, मेरे बचत खाते तीन तीन शून्य चार से। पंद्रह तारीख़ को, पूरा बिल।", "From now on the bill should pay itself, from my savings account 3304. On the fifteenth, the full bill."]
    - [after, "किश्तों की पूरी सूची ईमेल पर भेज दीजिए।", "Email me the full list of instalments."]
    - [after, "और एक SMS भी।", "And an SMS as well."]
    - [after, "बहुत धन्यवाद, आपने बड़ी मदद की।", "Thank you very much, you've been a great help."]
  key:
    - "Finds all five purchases; says the ₹1,85,000 Tanishq purchase cannot go on EMI and does not convert it"
    - "Gives the monthly amounts before converting: sarees 6 months ₹8,354; caterer ₹10,831, tent ₹5,867 and Vijay Sales ₹8,304 over 12 months"
    - "States the monthly total ₹33,356 and mentions the ₹199 fee on each"
    - "Reverses the ₹1,000 late fee; explains the ₹500 cash withdrawal fee cannot be reversed"
    - "Raises the limit to ₹8,00,000 once he agrees; sets the full-bill standing instruction from 3304 on the 15th"
    - "Emails the EMI schedule and sends the SMS; patient while he writes"
  checks: {lang: hi, reprompt_in_silence: L7, digits: ["66120"], say: [["33,356", "तैंतीस हज़ार तीन सौ छप्पन"], ["8,00,000", "आठ लाख"]], tool_order: [get_emi_options, convert_to_emi]}
  guard: "L3 names every purchase, L5 every tenure; L4 reacts to the jewellery refusal the agent must give; L6 asks for the total whatever was said."

- id: bank-104
  g: BANK-1
  lang: te
  script: te-mix
  diff: Hard
  dir: in
  title: "Family trip abroad — international on four cards, travel notices, fee reversal, flights to EMI"
  basis: "Before a foreign trip, every card in the family needs international use, limits and a travel notice, card by card."
  caller: "F 26-45 · software engineer in Hyderabad, organised; speaker b: M 26-45 · her husband Kiran"
  goal: "Make every card work in Singapore and Malaysia with set limits, get the annual fee waived, put the flights on EMI, and set up her husband's own card."
  role: "You handle cards. An add-on card's international limit cannot be above ₹40,000. Verify the husband before touching his own card."
  context: "The annual fee is reversed when the year's spend is above ₹3,00,000."
  tasks:
    - task: "Verify and find her cards"
      calls:
        - "verify_caller(name=Swathi Reddy, dob=9 Feb 1990) → verified"
        - "get_accounts() → credit card 6604 (Swathi) with add-on 6612 (Kiran Reddy); savings 7015 with debit card 2210 (Swathi)"
    - task: "Her credit card abroad"
      calls:
        - "set_card_control(card_last4=6604, channel=international, enabled=yes, limit=₹1,50,000) → updated"
        - "set_card_control(card_last4=6604, channel=contactless, enabled=yes) → updated"
        - "set_travel_notice(card_last4=6604, countries=Singapore and Malaysia, from_date=Sat 17 Oct, to_date=Sun 25 Oct) → on file; international switches off after 25 Oct"
    - task: "Kiran's add-on abroad"
      calls:
        - "set_card_control(card_last4=6612, channel=international, enabled=yes, limit=₹50,000) → error: an add-on card's international limit can't be above ₹40,000"
        - "set_card_control(card_last4=6612, channel=international, enabled=yes, limit=₹40,000) → updated"
        - "set_travel_notice(card_last4=6612, countries=Singapore and Malaysia, from_date=Sat 17 Oct, to_date=Sun 25 Oct) → on file; international switches off after 25 Oct"
    - task: "Her debit card abroad, with ATM"
      calls:
        - "set_card_control(card_last4=2210, channel=international, enabled=yes) → updated"
        - "set_card_control(card_last4=2210, channel=ATM, enabled=yes, limit=₹40,000) → updated, international ATM allowed"
        - "set_travel_notice(card_last4=2210, countries=Singapore and Malaysia, from_date=Sat 17 Oct, to_date=Sun 25 Oct) → on file; international switches off after 25 Oct"
    - task: "Annual fee"
      calls:
