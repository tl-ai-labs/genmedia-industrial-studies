    - [after, "அவ அங்க அடுத்த வருஷம் June வரைக்கும் இருப்பா. அது bank க்கு தெரியணும், இல்லன்னா மறுபடியும் block ஆகும்.", "She'll be there until June next year. The bank should know, or it will get blocked again."]
    - [after, "இன்னொன்னு — அவ flight ticket க்கு ரெண்டு தடவை பணம் போயிருக்கு. பாருங்க.", "Another thing — her flight ticket was charged twice. Please check."]
    - [after, "ஆமா, ஒன்னு தான் எங்களோடது. இன்னொன்னுக்கு dispute போடுங்க.", "Yes, only one is ours. Raise a dispute for the other."]
    - [after, "அவ இங்க இருந்தப்போ gym, mobile postpaid, Spotify எல்லாம் அவ card ல இருந்தது. அந்த மூணையும் நிறுத்துங்க.", "When she was here, the gym, mobile postpaid and Spotify were all on her card. Stop all three."]
    - [after, "என் card limit கூட கொஞ்சம் ஏத்த முடியுமா?", "Can my own card limit go up a bit too?"]
