- id: bank-108
  g: BANK-4
  lang: en
  diff: Hard
  dir: in
  title: "Phishing link — freeze, two unknown devices, three transfers and a card charge disputed, payees removed"
  basis: "Fake electricity-bill SMS links steal netbanking logins; the fraudster adds payees, moves money and sets up repeat transfers."
  caller: "F 26-45 · teacher in Kochi, shaken, speaks quickly"
  goal: "Stop the fraud everywhere, dispute every transfer and charge, remove what the fraudster added and know what happens next."
  role: "You handle fraud. Freeze first, then dispute. On a fraud call, contact details are changed only at a branch."
  context: ""
  tasks:
    - task: "Verify and see what happened"
      calls:
        - "verify_caller(name=Priya Nair, dob=2 Oct 1988) → verified"
        - "get_login_activity() → Sun 4 Oct 11:42 pm new device Redmi Note in Kolkata; 11:46 pm Windows PC in Kolkata; payees R Kumar (11:50 pm) and Sunil Traders (11:52 pm) added; email changed 11:55 pm; standing instruction SI 88310 for ₹9,999 monthly created 11:58 pm. Her own iPhone in Kochi"
        - "get_account(account_last4=1182) → savings, balance ₹12,430"
    - task: "Freeze"
      calls:
        - "block_netbanking(reason=phishing) → frozen, NB 30917"
        - "logout_device(device=Redmi Note, Kolkata) → session ended, device removed"
        - "logout_device(device=Windows PC, Kolkata) → session ended, device removed"
        - "set_upi_status(account_last4=1182, enabled=no) → UPI off"
    - task: "Dispute the three transfers"
      calls:
        - "get_transactions(account_last4=1182, from_date=Sun 4 Oct, to_date=Mon 5 Oct) → today 12:05 am IMPS ₹49,000 to R Kumar, ref IM 4410 2201; 12:09 am IMPS ₹48,500 to Sunil Traders, ref IM 4410 2202; 6:30 am IMPS ₹25,000 to R Kumar, ref IM 4410 2203"
        - "raise_dispute(txn_ref=IM 4410 2201, reason=fraud, account taken over) → dispute DS 93101, receiving bank asked to hold funds"
        - "raise_dispute(txn_ref=IM 4410 2202, reason=fraud, account taken over) → error: dispute system timed out"
        - "raise_dispute(txn_ref=IM 4410 2202, reason=fraud, account taken over) → dispute DS 93102, receiving bank asked to hold funds"
        - "raise_dispute(txn_ref=IM 4410 2203, reason=fraud, account taken over) → dispute DS 93103, receiving bank asked to hold funds"
    - task: "Remove what the fraudster added"
      calls:
        - "get_beneficiaries(account_last4=1182) → R Kumar (added Sun 4 Oct), Sunil Traders (added Sun 4 Oct), Amma (2021), Electricity board (2022)"
        - "delete_beneficiary(account_last4=1182, name=R Kumar) → removed"
        - "delete_beneficiary(account_last4=1182, name=Sunil Traders) → removed"
        - "cancel_standing_instruction(si_no=SI 88310) → cancelled"
    - task: "Her credit card"
      calls:
        - "get_card(card_last4=4471) → Kosh credit card, active"
        - "block_card(card_last4=4471, reason=card details entered on a phishing site) → blocked, BL 93120"
        - "get_transactions(card_last4=4471, from_date=Sun 4 Oct, to_date=Mon 5 Oct) → today 12:30 am ₹19,999 Flipkart, ref CC 4471 0005"
        - "raise_dispute(txn_ref=CC 4471 0005, reason=fraud, card details stolen) → dispute DS 93104"
        - "reissue_card(card_last4=4471, deliver_to=home) → new card ending 4497, dispatched Wed 7 Oct"
    - task: "Report, branch visit for the email, follow-up"
      calls:
        - "raise_ticket(category=cyber fraud, summary=phishing; three IMPS and one card charge disputed) → ticket FR 55210"
        - "find_branch(area=Kakkanad, Kochi) → Kosh Bank Kakkanad, KB-0412, 9:30 am-4:30 pm"
        - "book_branch_visit(branch_id=KB-0412, date=Tue 6 Oct, slot=10:00 am, purpose=restore email and reopen netbanking) → appointment BV 20716"
        - "schedule_callback(date=Thu 8 Oct, slot=4-5 pm, topic=fraud disputes DS 93101-93104) → booked"
        - "send_sms(template=fraud_case_summary) → sent"
  forbid: [update_contact, transfer_funds]
  lines:
    - [open, "Hello, I think I've been hacked. I clicked a link in an electricity bill SMS last night and money has gone from my account!"]
    - [after, "Priya Nair, second October nineteen eighty-eight. Please hurry."]
    - [after, "I typed my netbanking login and my credit card number on that page. I didn't give any OTP, I swear."]
    - [after, "Kolkata? I've never been there. Please stop everything — netbanking, UPI, all of it."]
    - [after, "How much has gone? I see messages for three transfers."]
    - [after, "Dispute all three. Can I get it back?"]
    - [after, "They added people to my payees, the SMS said. Remove anyone I didn't add. My mother and the electricity board are mine."]
    - [after, "There's also something about a standing instruction for nine thousand nine hundred and ninety-nine. That's not me either."]
    - [after, "And my credit card — I typed it on that page too. Block it. Is there any charge on it?"]
    - [after, "Dispute that one too and send me a new card at home."]
    - [after, "They changed my email as well. Can you change it back right now? It's priya dot nair eighty-eight at gmail."]
    - [after, "Okay, the branch then. Kakkanad is closest. Tomorrow morning, ten o'clock?"]
    - [after, "What else should I do?"]
    - [after, "Will someone call me about the disputes?"]
    - [after, "Send me everything by SMS. Thank you, I was so scared."]
  key:
    - "Verifies, then freezes netbanking, logs out both Kolkata devices and turns off UPI before disputing"
    - "Disputes all three IMPS transfers (₹1,22,500); when the second times out, says so and retries (DS 93101-93103)"
    - "Removes R Kumar and Sunil Traders, keeps Amma and the electricity board, cancels SI 88310"
    - "Blocks 4471, disputes the ₹19,999 Flipkart charge (DS 93104) and reissues as 4497"
    - "Does not change the email on the call; books the Kakkanad branch for Tue 6 Oct at 10:00 am (BV 20716)"
    - "Tells her to report it on 1930 and with the police, raises ticket FR 55210, books the call-back and sends the summary; never asks for an OTP"
  checks: {digits: ["DS 93102", "4497", "BV 20716"], say: [["1930", "nineteen thirty", "one nine three zero"], ["1,22,500", "one lakh twenty-two thousand five hundred"]], not_say: ["tell me the OTP", "share the OTP"], tool_order: [block_netbanking, raise_dispute]}
  guard: "Each line is a new request that holds whatever the agent said before; L11's request has to be refused whatever the agent offered; L12 accepts a branch whether or not the agent named one."
