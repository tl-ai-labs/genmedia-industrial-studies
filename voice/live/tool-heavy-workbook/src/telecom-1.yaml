- id: tel-105
  g: TEL-1
  lang: ta
  script: ta-mix
  diff: Medium
  dir: in
  title: "Exam month — data for three children and the mother, one pack not allowed on a plan, TV channels cut"
  basis: "Families with children studying online add data number by number and cut TV during exams."
  caller: "F 46-60 · mother in Madurai with three school and college children, firm"
  goal: "Make sure each child has enough data for online classes, top up her own, and switch off entertainment channels till exams end."
  role: "You handle recharges, packs and TV."
  context: "Pack D251 (50 GB) works only on plans of ₹299 or more."
  tasks:
    - task: "Who uses what"
      calls:
        - "list_connections() → prepaid: Meenakshi 94430 71101, Karthik 94430 71102, Priya 94430 71103, Arjun 94430 71104; Tarang TV box TV-7101"
        - "get_data_usage(mobile=94430 71102) → 1.5 GB a day plan; used up by 2 pm daily"
        - "get_data_usage(mobile=94430 71103) → 1.5 GB a day plan; used up by evening"
        - "get_data_usage(mobile=94430 71104) → 1 GB a day plan (P199); used up by noon"
        - "get_data_usage(mobile=94430 71101) → 1 GB a day; usually left over"
        - "get_plans(type=data packs) → D251 50 GB 30 days ₹251 (plans ₹299+); D121 12 GB valid with plan ₹121; D61 6 GB ₹61"
    - task: "Packs and a plan change"
      calls:
        - "activate_pack(mobile=94430 71102, pack_id=D251) → active 30 days, ₹251"
        - "activate_pack(mobile=94430 71103, pack_id=D251) → active 30 days, ₹251"
        - "activate_pack(mobile=94430 71104, pack_id=D251) → error: D251 needs a plan of ₹299 or more"
        - "activate_pack(mobile=94430 71104, pack_id=D121) → active with the plan, ₹121"
        - "activate_pack(mobile=94430 71101, pack_id=D61) → active with the plan, ₹61"
        - "get_account(mobile=94430 71102) → P299, valid until Sat 17 Oct"
        - "change_plan(mobile=94430 71102, plan_id=P399 3 GB/day) → from Sun 18 Oct, ₹399"
    - task: "Cut TV till exams end"
      calls:
        - "get_dth(box_id=TV-7101) → Tamil Mega pack with Sun Movies, Star Vijay Super, Cartoon Network; balance ₹620"
        - "remove_channel(box_id=TV-7101, channel=Sun Movies) → removed from next cycle"
        - "remove_channel(box_id=TV-7101, channel=Star Vijay Super) → removed from next cycle"
        - "remove_channel(box_id=TV-7101, channel=Cartoon Network) → removed from next cycle"
        - "get_account(mobile=94430 71104) → P199, valid until Fri 23 Oct"
        - "get_account(mobile=94430 71103) → P299, valid until Sun 25 Oct"
    - task: "Summary"
      calls:
        - "send_sms(template=packs_summary) → sent"
  forbid: ["remove_channel(box_id=TV-7101, channel=Sun News)", "change_plan(mobile=94430 71103, plan_id=P399 3 GB/day)"]
  lines:
    - [open, "வணக்கம். என் மூணு பசங்களுக்கும் online class, exam. Data பத்தவே மாட்டேங்குது. நாலு number ம் என் profile ல தான்.", "Hello. My three children have online classes and exams. The data is never enough. All four numbers are on my profile."]
    - [after, "ஒவ்வொருத்தருக்கும் data எப்போ தீர்ந்து போகுதுன்னு பாருங்க. என்னோடதும்.", "Check when each one's data runs out. Mine too."]
    - [after, "என்ன pack இருக்கு?", "What packs are there?"]
    - [after, "மூணு பசங்களுக்கும் அந்த ஐம்பது GB pack போடுங்க. எந்த number க்காவது முடியலைன்னா, அடுத்த பெரிய pack.", "Put that 50 GB pack on all three children. If it doesn't work on any number, the next biggest pack."]
    - [after, "எனக்கு சின்ன pack போதும், ஆறு GB.", "A small pack is enough for me, six GB."]
    - [after, "Karthik க்கு daily data யே பத்தலை. அவனோட plan முடிஞ்சதும் பெரிய plan க்கு மாத்துங்க.", "Even the daily data isn't enough for Karthik. When his plan ends, move him to a bigger plan."]
    - [after, "Arjun, Priya ரெண்டு பேரோட plan எப்போ முடியுது?", "When do Arjun's and Priya's plans end?"]
    - [after, "இப்போ TV. Exam முடியற வரைக்கும் movies, Vijay Super, cartoon மூணும் எடுத்துடுங்க. News இருக்கட்டும்.", "Now the TV. Until the exams are over, take off the movies, Vijay Super and cartoons. Keep the news."]
    - [after, "மொத்தம் இன்னைக்கு எவ்வளவு?", "How much is it in total today?"]
    - [after, "Exam முடிஞ்சதும் channels திரும்ப வேணும்னா என்ன பண்ணணும்?", "What do I do to get the channels back when exams are over?"]
    - [after, "சரி, SMS அனுப்புங்க.", "Okay, send an SMS."]
    - [after, "நன்றி.", "Thank you."]
  key:
    - "Checks all four numbers' data use"
    - "Adds D251 for Karthik and Priya; when it fails on Arjun's ₹199 plan, says so and adds D121 instead"
    - "Adds D61 for Meenakshi; moves Karthik to P399 from Sun 18 Oct, when his plan ends"
    - "Removes Sun Movies, Star Vijay Super and Cartoon Network from next cycle; keeps the news"
    - "States ₹684 for today's packs; explains channels can be added back by call or app"
  checks: {lang: ta, digits: ["Sun 18 Oct", "Fri 23 Oct"], say: [["684", "அறுநூற்று எண்பத்தி நாலு", "six hundred eighty-four"]], tool_order: [get_data_usage, activate_pack]}
  guard: "The pack fallback comes with the request; each child is named; L8 names the channels to cut and to keep, true whatever the agent read out."

- id: tel-106
  g: TEL-1
  lang: tx
  script: en → te-mix
  diff: Hard
  dir: in
  switch: "L5: English → Telugu (her father takes the phone)"
  title: "Father tricked into five subscriptions — daughter starts in English, father lists them in Telugu"
  basis: "Older users are pushed into paid services by calls and pop-ups; the family has to stop each one and block the source."
  caller: "F 26-45 · daughter in Bengaluru, angry on her father's behalf; speaker b: M 60+ · her father in Warangal, Telugu only"
  goal: "Stop every paid service on her father's number, get back what can be refunded, block premium numbers and the callers, and recharge him."
  role: "You handle services. Act on the father's number for him; he is the account holder and is on the call."
  context: "Services started in the last 7 days are refunded."
  tasks:
    - task: "What is running"
      calls:
        - "get_account(mobile=94400 61201) → prepaid P299, valid until Wed 7 Oct; balance ₹12"
        - "get_vas(mobile=94400 61201) → news alerts ₹5 a day (since Fri 2 Oct); devotional caller tune ₹49 (Sat 3 Oct); quiz contest ₹99 a week (Sat 3 Oct); jokes portal ₹30 a week (August); health tips ₹2 a day (July)"
    - task: "Stop each"
      calls:
        - "deactivate_vas(mobile=94400 61201, service=news alerts) → stopped; ₹20 refunded"
        - "deactivate_vas(mobile=94400 61201, service=devotional caller tune) → stopped; ₹49 refunded"
        - "deactivate_vas(mobile=94400 61201, service=quiz contest) → error: service system timed out"
        - "deactivate_vas(mobile=94400 61201, service=quiz contest) → stopped; ₹99 refunded"
        - "deactivate_vas(mobile=94400 61201, service=jokes portal) → stopped; no refund"
        - "deactivate_vas(mobile=94400 61201, service=health tips) → stopped; no refund"
        - "raise_ticket(category=VAS without consent, summary=jokes portal and health tips started without consent; refund review) → ticket VA 61210"
    - task: "His wife's number too"
      calls:
        - "get_vas(mobile=94400 61202) → devotional caller tune ₹49 (since August)"
        - "deactivate_vas(mobile=94400 61202, service=devotional caller tune) → stopped; no refund"
        - "set_dnd(mobile=94400 61202, categories=all promotional) → set, effective in 24 hours"
    - task: "Block the sources"
      calls:
        - "set_call_barring(mobile=94400 61201, type=premium-rate, enabled=yes) → barring on"
        - "set_dnd(mobile=94400 61201, categories=all promotional) → set, effective in 24 hours"
        - "report_spam(mobile=94400 61201, spam_number=140 66 21 7750) → reported and blocked"
        - "report_spam(mobile=94400 61201, spam_number=91770 35514) → reported and blocked"
    - task: "Recharge him"
      calls:
        - "get_plans(type=prepaid) → P479 ₹479 84 days 6 GB; P859 ₹859 84 days 2 GB/day"
        - "recharge(mobile=94400 61201, plan_id=P479, payment=daughter's UPI) → recharged, valid until Wed 30 Dec"
        - "get_data_usage(mobile=94400 61201) → about 100 MB a day"
    - task: "Summary to the daughter's number"
      calls:
        - "send_sms(template=vas_cleanup_summary) → sent"
  forbid: ["recharge(mobile=94400 61201, plan_id=P859)"]
  lines:
    - [open, "Hi, I'm calling about my father's number. He's been signed up for a bunch of paid services he never wanted. He's here with me on speaker."]
    - [after, "I'll pay for his recharge after this, by my UPI. He hardly uses data — just WhatsApp."]
    - [after, "He doesn't speak English well. Is it okay if he tells you in Telugu what he's been getting?"]
    - [after, "Great, here he is. Nanna, matladandi."]
    - [after b, "నమస్కారం. రోజూ ఏదో news messages, ఏదో quiz, joke messages వస్తున్నాయి. Phone చేస్తే పాట వస్తోంది. డబ్బులు కట్ అవుతున్నాయి.", "Hello. Every day some news messages, some quiz, joke messages come. When someone calls me a song plays. Money is getting cut."]
    - [after b, "అన్నీ ఆపేయండమ్మా. ఏదీ నేను అడగలేదు.", "Stop all of it. I didn't ask for any of it."]
    - [after b, "డబ్బులు తిరిగి వస్తాయా?", "Will the money come back?"]
    - [after b, "పాతవాటికి కూడా complaint పెట్టండి. నా భార్య number కూడా చూడండి — nine four four zero zero, six one two zero two. దానికీ promotional calls ఆపేయండి.", "File a complaint for the old ones too. Check my wife's number as well — 94400 61202. Stop promotional calls on hers too."]
    - [after b, "ఇవి ఎక్కడ నుంచి వస్తున్నాయి? ఆ numbers ఆపేయండి. ఒకటి one four zero six six two one seven seven five zero. ఇంకోటి nine one seven seven zero, three five five one four.", "Where are these coming from? Block those numbers. One is 140 66 21 7750. The other is 91770 35514."]
    - [after b, "అమ్మాయి recharge చేస్తుందన్నది. తక్కువ data, ఎక్కువ రోజులు ఉండేది వేయండి.", "My daughter said she'd recharge. Put one with little data and lots of days."]
    - [after b, "సరే. Message అమ్మాయికి పంపండి.", "Okay. Send the message to my daughter."]
    - [after b, "చాలా thanks అమ్మా.", "Thank you so much."]
