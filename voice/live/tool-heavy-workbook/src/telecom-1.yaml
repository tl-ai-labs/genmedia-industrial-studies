    - "Replies in Telugu from L5, slowly and simply"
    - "Lists all five services and stops each; when the quiz contest times out, says so and retries"
    - "Refunds ₹168 for the three recent ones; explains the older two aren't refundable and raises VA 61210"
    - "Stops the caller tune on his wife's number and sets DND there too"
    - "Turns on premium-rate barring and DND and blocks both numbers"
    - "Recharges P479 (84 days, 6 GB) with the daughter's UPI, not P859"
    - "Explains the SMS goes to the father's number, not the daughter's"
  checks: {lang_from: {L5: te}, digits: ["VA 61210", "Wed 30 Dec"], say: [["168", "నూట అరవై ఎనిమిది", "one sixty-eight"]], tool_order: [get_vas, deactivate_vas]}
  guard: "The daughter's English lines set payment and need before the handover; the father's lines name the services by what they do; L11 asks for the SMS to the daughter, which the agent must correct."

- id: tel-107
  g: TEL-2
  lang: en
  diff: Hard
  dir: in
  title: "₹18,940 family bill — roaming without a pack, VAS on three lines, premium calls: eight disputes, limits and barring on five lines"
  basis: "Family postpaid bill shock usually comes from several lines at once; each item is disputed and each line is capped."
  caller: "F 46-60 · school principal in Pune, account owner of a five-line family plan, controlled anger"
  goal: "Dispute every wrong item, stop it happening again on every line, cover her daughter abroad properly, and pay only what is fair."
  role: "You handle postpaid bills. One dispute per item; give the provisional credit."
  context: "Family account TF-55210. September bill ₹18,940, due Thu 15 Oct."
  tasks:
    - task: "Read the bill"
      calls:
        - "get_bill(account=TF-55210, month=September) → ₹18,940: plan ₹1,499; Ira's roaming in the UK without a pack ₹9,820; VAS on Meera ₹180, Kabir ₹297, Dadi ₹120; premium-rate calls on Kabir ₹1,450; Ira's international SMS ₹640; late fee ₹300; GST ₹2,889; extra data on Kabir ₹1,745"
        - "get_account(mobile=98220 40101) → Shalini (owner), postpaid, on TF-55210"
        - "get_account(mobile=98220 40102) → Meera, postpaid, on TF-55210"
        - "get_account(mobile=98220 40103) → Kabir (16), postpaid, on TF-55210"
        - "get_account(mobile=98220 40104) → Ira, postpaid, on TF-55210, roaming in the UK since Mon 14 Sep"
        - "get_account(mobile=98220 40105) → Dadi, postpaid, on TF-55210"
    - task: "Dispute each wrong item"
      calls:
        - "raise_bill_dispute(account=TF-55210, item=Ira roaming without a pack, reason=no pack offered on arrival) → dispute BD 55301; provisional credit ₹7,000; decision by Thu 15 Oct"
        - "raise_bill_dispute(account=TF-55210, item=Ira international SMS, reason=sent automatically by apps) → dispute BD 55302; provisional credit ₹640"
        - "raise_bill_dispute(account=TF-55210, item=VAS on Meera, reason=not subscribed) → dispute BD 55303; provisional credit ₹180"
        - "raise_bill_dispute(account=TF-55210, item=VAS on Kabir, reason=not subscribed) → error: dispute system timed out"
        - "raise_bill_dispute(account=TF-55210, item=VAS on Kabir, reason=not subscribed) → dispute BD 55304; provisional credit ₹297"
        - "raise_bill_dispute(account=TF-55210, item=VAS on Dadi, reason=not subscribed) → dispute BD 55305; provisional credit ₹120"
        - "raise_bill_dispute(account=TF-55210, item=premium-rate calls on Kabir, reason=minor's line, premium-rate should be barred) → dispute BD 55306; provisional credit ₹1,450"
        - "raise_bill_dispute(account=TF-55210, item=late fee, reason=bill delivered late) → dispute BD 55307; provisional credit ₹300"
    - task: "Cover Ira properly in the UK"
      calls:
        - "get_roaming_packs(country=UK) → IR30 ₹2,999 30 days 10 GB 200 min; IR10 ₹1,499 10 days 3 GB"
        - "activate_roaming_pack(mobile=98220 40104, pack_id=IR30, start_date=Mon 5 Oct) → active until Tue 3 Nov, ₹2,999"
    - task: "Stop VAS and premium calls on every line"
      calls:
        - "deactivate_vas(mobile=98220 40102, service=all) → stopped"
        - "deactivate_vas(mobile=98220 40103, service=all) → stopped"
        - "deactivate_vas(mobile=98220 40105, service=all) → stopped"
        - "set_call_barring(mobile=98220 40103, type=premium-rate, enabled=yes) → barring on"
        - "set_call_barring(mobile=98220 40105, type=premium-rate, enabled=yes) → barring on"
        - "set_call_barring(mobile=98220 40102, type=premium-rate, enabled=yes) → barring on"
    - task: "A limit on each line"
      calls:
        - "set_usage_limit(mobile=98220 40101, limit=₹3,000) → set"
        - "set_usage_limit(mobile=98220 40102, limit=₹1,000) → set"
        - "set_usage_limit(mobile=98220 40103, limit=₹500) → set"
        - "set_usage_limit(mobile=98220 40104, limit=₹4,000) → set"
        - "set_usage_limit(mobile=98220 40105, limit=₹500) → set"
    - task: "Pay the rest, autopay, summary"
      calls:
        - "send_payment_link(account=TF-55210, amount=₹8,953) → link sent by SMS"
        - "set_autopay(account=TF-55210, method=saved card) → autopay from the October bill"
        - "send_sms(template=bill_disputes_summary) → sent"
  forbid: ["raise_bill_dispute(account=TF-55210, item=plan)", "raise_bill_dispute(account=TF-55210, item=extra data on Kabir)"]
  lines:
    - [open, "Hello. My family's postpaid bill is eighteen thousand nine hundred and forty rupees. It's usually two thousand. I want every item explained."]
    - [after, "Ira went to the UK for her master's. Nobody told her she needed a pack. Dispute that, and the international SMS too."]
    - [after, "These services on Meera's, Kabir's and my mother-in-law's lines — nobody asked for them. Dispute all three."]
    - [after, "Kabir is sixteen. Premium-rate calls? That should never have been allowed. Dispute it."]
    - [after, "And the late fee — the bill came by email after the due date. Dispute that too."]
    - [after, "The extra data on Kabir — fine, that's him, we'll pay it."]
    - [after, "Ira is in the UK till early November. Put a proper pack on her from today."]
    - [after, "Stop all those services on the three lines, and block premium-rate numbers on them."]
    - [after, "And put a spending limit on every line. Mine three thousand, Meera one thousand, Kabir five hundred, Ira four thousand, Dadi five hundred."]
    - [pause 1700, "Kabir especially. Five hundred, not a rupee more."]
    - [after, "So what do I actually have to pay now?"]
    - [after, "Send me the link. And set autopay on my card from next month."]
    - [after, "Send the dispute numbers by SMS."]
    - [after, "Thank you. I hope the disputes go through."]
  key:
    - "Reads every bill item; disputes the seven she names, one each (BD 55301-55307); when Kabir's VAS dispute times out, says so and retries"
    - "Does not dispute the plan or Kabir's extra data"
    - "States provisional credits of ₹9,987 and ₹8,953 left to pay"
    - "Activates the UK pack IR30 for Ira from today (₹2,999, until 3 Nov)"
    - "Stops VAS and bars premium-rate numbers on Meera's, Kabir's and Dadi's lines"
    - "Sets each limit: ₹3,000, ₹1,000, ₹500, ₹4,000, ₹500; sends the link and sets autopay"
  checks: {digits: ["BD 55306", "8,953"], say: [["9,987", "nine thousand nine hundred eighty-seven", "nine thousand nine hundred and eighty-seven"]], tool_order: [get_bill, raise_bill_dispute]}
  guard: "Each dispute line names its item; L6 accepts the data charge whatever the agent said; L9 gives every limit with its person."

