# Telecom — tool-heavy scenarios tel-101 … tel-108 (TEL-1 Recharge & plans, TEL-2 Postpaid & family).
code: tel
scenarios:

- id: tel-101
  g: TEL-1
  lang: en
  diff: Hard
  dir: in
  title: "Five prepaid numbers expiring this week — a plan for each, card limit hit, packs, the mother's hidden charges"
  basis: "Heads of family recharge everyone's prepaid numbers together and pick a different plan for each."
  caller: "M 46-60 · father in Kochi who pays for the whole family's phones, careful with money"
  goal: "Recharge all five numbers with the right plan for each person, add a data pack and an ISD pack, and stop charges on his mother's phone."
  role: "You handle recharges. Give the price and validity before each recharge."
  context: "Plans: P299 ₹299, 28 days, 2 GB a day. P349 ₹349, 28 days, 2.5 GB a day with OTT. P859 ₹859, 84 days, 2 GB a day. P1799 ₹1,799, 365 days, 24 GB in all, unlimited calls."
  tasks:
    - task: "Read the five numbers"
      calls:
        - "list_connections() → prepaid: Arun 98470 11201, Susan 98470 11202, Anna 98470 11203, Joel 98470 11204, Mariamma 98470 11205"
        - "get_plans(type=prepaid) → P299 ₹299 28 days 2 GB/day; P349 ₹349 28 days 2.5 GB/day + OTT; P859 ₹859 84 days 2 GB/day; P1799 ₹1,799 365 days 24 GB"
        - "get_account(mobile=98470 11201) → P299, valid until today"
        - "get_account(mobile=98470 11202) → P299, valid until Tue 6 Oct"
        - "get_account(mobile=98470 11203) → P299, valid until Wed 7 Oct"
        - "get_account(mobile=98470 11204) → P299, valid until Thu 8 Oct"
        - "get_account(mobile=98470 11205) → expired Sat 3 Oct; incoming stopped"
        - "get_data_usage(mobile=98470 11203) → 2 GB a day used up by noon most days"
        - "get_data_usage(mobile=98470 11204) → under 1 GB a day"
    - task: "Recharge each — card first, UPI if the card fails"
      calls:
        - "recharge(mobile=98470 11201, plan_id=P859, payment=saved card) → recharged, valid until Sun 27 Dec"
        - "recharge(mobile=98470 11202, plan_id=P859, payment=saved card) → recharged, valid until Mon 28 Dec"
        - "recharge(mobile=98470 11205, plan_id=P1799, payment=saved card) → error: card declined, daily online limit reached"
        - "recharge(mobile=98470 11205, plan_id=P1799, payment=saved UPI) → recharged, valid until 4 Oct 2027"
        - "recharge(mobile=98470 11203, plan_id=P349, payment=saved UPI) → recharged, valid until Tue 3 Nov"
        - "recharge(mobile=98470 11204, plan_id=P299, payment=saved UPI) → recharged, valid until Wed 4 Nov"
    - task: "Packs"
      calls:
        - "activate_pack(mobile=98470 11203, pack_id=D101 10 GB) → active until Tue 3 Nov, ₹101"
        - "activate_pack(mobile=98470 11202, pack_id=IS149 ISD UAE 60 minutes) → active 28 days, ₹149"
    - task: "Hidden charges"
      calls:
        - "get_vas(mobile=98470 11201) → none"
        - "get_vas(mobile=98470 11202) → none"
        - "get_vas(mobile=98470 11203) → none"
        - "get_vas(mobile=98470 11204) → none"
        - "get_vas(mobile=98470 11205) → caller tune ₹49 a month (started Thu 1 Oct); astrology alerts ₹30 a week (since August)"
        - "deactivate_vas(mobile=98470 11205, service=caller tune) → stopped; ₹49 refunded"
        - "deactivate_vas(mobile=98470 11205, service=astrology alerts) → stopped; no refund (older than 7 days)"
        - "set_dnd(mobile=98470 11205, categories=all promotional) → set, effective in 24 hours"
    - task: "Summary"
      calls:
        - "send_sms(template=recharges_summary) → sent"
  forbid: ["recharge(mobile=98470 11205, plan_id=P299)", "activate_pack(mobile=98470 11204, pack_id=D101 10 GB)"]
  lines:
    - [open, "Hi, all five of our family's numbers are running out this week and I want to sort them in one go."]
    - [after, "Read me the numbers and when each one expires."]
    - [after, "My mother's has already stopped? Okay, she's first priority. What plans do you have?"]
    - [after, "My wife and I — the eighty-four day one. My mother — the yearly one, she hardly uses data."]
    - [after, "My daughter is always running out of data. Check her usage and my son's, then suggest something."]
    - [after, "Okay, the OTT one for Anna and the basic one for Joel. Use my saved card — if it fails, my UPI for that one and the rest."]
    - [after, "Anna also needs an extra ten GB pack. And Susan needs an ISD pack — her sister is in Dubai."]
    - [after, "My mother keeps getting charged for something. Check all five numbers for anything like that."]
    - [after, "Stop both on her number. And stop the promotional calls on hers too, she gets confused."]
    - [after, "What's the total I've paid today?"]
    - [after, "And everyone's new expiry dates, please."]
    - [after, "Send me the summary. Thank you."]
  key:
    - "Reads all five numbers with their expiry; says Mariamma's has expired"
    - "Gives price and validity before each recharge: P859 for Arun and Susan, P1799 for Mariamma, P349 for Anna, P299 for Joel"
    - "When the card hits its daily limit on Mariamma's recharge, says so and uses UPI for it and the rest"
    - "Adds 10 GB for Anna and the UAE ISD pack for Susan"
    - "Checks all five for VAS; stops both on Mariamma's number (₹49 refunded, astrology not refundable) and sets DND"
    - "States ₹4,415 paid today and reads each new expiry date"
  checks: {digits: ["4 Oct 2027", "Tue 3 Nov"], say: [["4,415", "four thousand four hundred fifteen", "four thousand four hundred and fifteen"]], tool_order: [get_plans, recharge]}
  guard: "Each person's plan comes in their own line; the card fallback comes before any recharge; L8 asks for all five to be checked whatever the agent offered."

- id: tel-102
  g: TEL-1
  lang: hg
  diff: Medium
  dir: in
  title: "Son sorts his parents' and grandmother's phones — charges stopped, yearly recharges, DND, two spam numbers"
  basis: "Children manage elderly relatives' prepaid numbers from their own profile, number by number."
  caller: "M 26-45 · son in Delhi managing his family's numbers in Jaipur, patient"
  goal: "Stop every unwanted charge on three elderly relatives' numbers, recharge each for a long time, and stop the spam calls."
  role: "You handle recharges and services."
  context: "These numbers are on his profile; he is the account owner."
  tasks:
    - task: "Read the three numbers"
      calls:
        - "list_connections() → prepaid on his profile: father 94140 22301, mother 94140 22302, grandmother 94140 22303"
        - "get_account(mobile=94140 22301) → P299, valid until Fri 9 Oct"
        - "get_account(mobile=94140 22302) → P299, valid until Fri 9 Oct"
        - "get_account(mobile=94140 22303) → P155 ₹155 28 days, valid until Wed 7 Oct"
    - task: "Charges on each"
      calls:
        - "get_vas(mobile=94140 22301) → cricket score alerts ₹2 a day; caller tune ₹49 a month"
        - "get_vas(mobile=94140 22302) → bhakti songs ₹30 a week"
        - "get_vas(mobile=94140 22303) → games portal ₹99 a month (started Sat 3 Oct)"
        - "deactivate_vas(mobile=94140 22301, service=cricket score alerts) → stopped; no refund"
        - "deactivate_vas(mobile=94140 22301, service=caller tune) → stopped; no refund"
        - "deactivate_vas(mobile=94140 22302, service=bhakti songs) → stopped; no refund"
        - "deactivate_vas(mobile=94140 22303, service=games portal) → stopped; ₹99 refunded"
    - task: "Long recharges"
      calls:
        - "get_plans(type=prepaid) → P1799 ₹1,799 365 days 24 GB; P859 ₹859 84 days 2 GB/day; P479 ₹479 84 days 6 GB, calls"
        - "recharge(mobile=94140 22301, plan_id=P1799, payment=saved UPI) → recharged, valid until 8 Oct 2027"
        - "recharge(mobile=94140 22302, plan_id=P1799, payment=saved UPI) → recharged, valid until 8 Oct 2027"
        - "recharge(mobile=94140 22303, plan_id=P479, payment=saved UPI) → recharged, valid until Wed 30 Dec"
    - task: "Spam and DND"
      calls:
        - "set_dnd(mobile=94140 22301, categories=all promotional) → set, effective in 24 hours"
        - "set_dnd(mobile=94140 22302, categories=all promotional) → set, effective in 24 hours"
        - "set_dnd(mobile=94140 22303, categories=all promotional) → set, effective in 24 hours"
        - "report_spam(mobile=94140 22302, spam_number=70141 88213) → reported and blocked"
        - "report_spam(mobile=94140 22302, spam_number=85120 44190) → reported and blocked"
    - task: "Summary"
      calls:
        - "send_sms(template=family_numbers_summary) → sent"
  forbid: ["recharge(mobile=94140 22303, plan_id=P1799)"]
  lines:
    - [open, "Hello, main Manish. Mere mummy-papa aur dadi ke numbers mere profile pe hain, Jaipur mein. Teeno ka kuch karna hai.", "Hello, I'm Manish. My parents' and grandmother's numbers are on my profile, in Jaipur. I need to sort out all three."]
    - [after, "Teeno ka plan aur kab tak chalega, bata do.", "Tell me each one's plan and how long it runs."]
    - [after, "Papa keh rahe the paise kat-te rehte hain. Teeno numbers pe check karo kya-kya chalu hai.", "Papa was saying money keeps getting deducted. Check what's active on all three numbers."]
    - [after, "Sab band kar do. Kisi ne bhi kuch nahi maanga tha.", "Stop all of them. None of them asked for anything."]
    - [after, "Ab recharge. Mummy-papa ka saal bhar wala.", "Now the recharge. A full-year one for Mummy and Papa."]
    - [after, "Dadi ko bas calls chahiye, data nahi. Unke liye koi sasta lamba wala?", "Grandma only needs calls, no data. Something cheap and long for her?"]
    - [after, "Haan, woh chaurasi din wala theek hai. Teeno UPI se.", "Yes, that 84-day one is fine. All three by UPI."]
    - [after, "Teeno pe promotional calls band kar do.", "Stop promotional calls on all three."]
    - [after, "Aur mummy ko do number se roz pareshan karne wale calls aate hain. Saat shunya ek chaar ek, aath aath do ek teen. Aur aath paanch ek do shunya, chaar chaar ek nau shunya.", "And two numbers harass my mother every day. 70141 88213. And 85120 44190."]
    - [after, "Kitna paisa laga aur kitna wapas aaya?", "How much did it cost and how much came back?"]
    - [after, "SMS kar do sab, main papa ko forward kar doonga.", "SMS it all, I'll forward it to Papa."]
    - [after, "Thanks, bhai.", "Thanks."]
  key:
    - "Reads all three numbers and their validity"
    - "Finds the four services and stops each (₹99 refunded on the games portal, the others too old)"
    - "Recharges both parents on P1799 and the grandmother on the cheaper long P479, not P1799"
    - "Sets DND on all three and reports and blocks both numbers on the mother's line"
    - "States ₹4,077 paid and ₹99 refunded"
  checks: {lang: hg, digits: ["8 Oct 2027", "Wed 30 Dec"], say: [["4,077", "chaar hazaar sattattar", "four thousand seventy-seven"]], tool_order: [get_vas, deactivate_vas]}
  guard: "L3 asks for all three numbers checked; L6 states her need, so the agent must choose P479; L9 reads both spam numbers in one line."

- id: tel-103
  g: TEL-1
  lang: hi
  diff: Medium
  dir: in
  title: "Family moves to yearly plans before a price rise — three numbers, son's data, two TV boxes repacked"
  basis: "Ahead of tariff hikes, households lock in yearly plans for every number and tidy their TV packs at the same time."
  caller: "M 46-60 · shopkeeper in Patna, practical, wants the best price"
  goal: "Put all three numbers on yearly plans before the price rise, add data for his son's studies, and recharge and rearrange both TV boxes."
  role: "You handle recharges and TV packs."
  context: "Prices rise on Thu 15 Oct."
  tasks:
    - task: "Numbers and plans"
      calls:
        - "list_connections() → prepaid: Rajesh 99340 51201, Anita 99340 51202, Rohit (in Kota) 99340 51203; Tarang TV boxes TV-5501 (hall), TV-5502 (bedroom)"
        - "get_plans(type=prepaid yearly) → P1799 ₹1,799 365 days 24 GB; P2999 ₹2,999 365 days 2.5 GB/day"
        - "get_account(mobile=99340 51201) → P299, valid until Sat 10 Oct"
        - "get_account(mobile=99340 51202) → P299, valid until Sat 10 Oct"
        - "get_account(mobile=99340 51203) → P349, valid until Tue 13 Oct"
        - "get_data_usage(mobile=99340 51203) → 2.5 GB a day used up most days"
    - task: "Yearly recharges"
      calls:
        - "recharge(mobile=99340 51201, plan_id=P1799, payment=saved UPI) → recharged, valid until 9 Oct 2027"
        - "recharge(mobile=99340 51202, plan_id=P1799, payment=saved UPI) → error: payment timed out, not debited"
        - "recharge(mobile=99340 51202, plan_id=P1799, payment=saved UPI) → recharged, valid until 9 Oct 2027"
        - "recharge(mobile=99340 51203, plan_id=P2999, payment=saved UPI) → recharged, valid until 12 Oct 2027"
        - "activate_pack(mobile=99340 51203, pack_id=D181 30 GB) → active 30 days, ₹181"
    - task: "His wife's number"
      calls:
        - "get_vas(mobile=99340 51202) → recipe tips ₹20 a week"
        - "deactivate_vas(mobile=99340 51202, service=recipe tips) → stopped; no refund"
    - task: "Two TV boxes"
      calls:
        - "get_dth(box_id=TV-5501) → Hindi Super pack ₹399 a month; balance ₹80; next debit Thu 8 Oct"
        - "get_dth(box_id=TV-5502) → Hindi Super pack ₹399 a month; balance ₹40; next debit Thu 8 Oct"
        - "recharge_dth(box_id=TV-5501, amount=₹1,200, payment=saved UPI) → recharged, balance ₹1,280"
        - "change_dth_pack(box_id=TV-5502, pack=Hindi Basic) → from Thu 8 Oct, ₹249 a month"
        - "add_channel(box_id=TV-5502, channel=Star Sports 1 Hindi) → added, ₹19 a month"
        - "add_channel(box_id=TV-5501, channel=Aastha Bhajan) → added, ₹0"
        - "recharge_dth(box_id=TV-5502, amount=₹600, payment=saved UPI) → recharged, balance ₹640"
    - task: "Summary"
      calls:
        - "send_sms(template=recharges_summary) → sent"
  forbid: ["recharge(mobile=99340 51203, plan_id=P1799)", "change_dth_pack(box_id=TV-5501, pack=Hindi Basic)"]
  lines:
    - [open, "नमस्ते। सुना है पंद्रह तारीख़ से दाम बढ़ रहे हैं। घर के तीनों नंबर अभी सालभर के लिए रिचार्ज करने हैं।", "Hello. I hear prices are going up from the fifteenth. I want to recharge all three numbers at home for a full year now."]
    - [after, "सालभर वाले कौन-से प्लान हैं?", "What are the yearly plans?"]
    - [after, "मेरा और पत्नी का सस्ता वाला। बेटा रोहित कोटा में पढ़ता है, उसका डेटा देखकर बताइए।", "The cheaper one for me and my wife. My son Rohit studies in Kota — look at his data and tell me."]
    - [after, "तो उसे रोज़ वाला ढाई जीबी दीजिए। ऊपर से तीस जीबी का पैक भी, परीक्षा है।", "Then give him the 2.5 GB a day one. And a 30 GB pack on top, he has exams."]
    - [after, "सब UPI से।", "All by UPI."]
    - [after, "पत्नी के नंबर पर कुछ कटता रहता है, देखिए।", "Something keeps getting deducted on my wife's number — please check."]
    - [after, "बंद कीजिए। अब टीवी। दोनों बॉक्स देखिए।", "Stop it. Now the TV. Check both boxes."]
    - [after, "हॉल वाले में बारह सौ डाल दीजिए, और आस्था भजन चैनल जोड़ दीजिए, माँ के लिए।", "Put twelve hundred into the hall one, and add the Aastha Bhajan channel, for my mother."]
    - [after, "बेडरूम वाले में इतना महँगा पैक नहीं चाहिए, बेसिक कर दीजिए। बस स्टार स्पोर्ट्स हिंदी जोड़ दीजिए। और छह सौ डाल दीजिए।", "The bedroom one doesn't need such an expensive pack — make it basic. Just add Star Sports Hindi. And put in six hundred."]
    - [after, "आज कुल कितना ख़र्च हुआ?", "How much was spent in total today?"]
    - [after, "SMS कर दीजिए।", "SMS it."]
    - [after, "धन्यवाद।", "Thank you."]
  key:
    - "Gives both yearly plans; recharges Rajesh and Anita on P1799 (after Anita's timeout, says so and retries) and Rohit on P2999"
    - "Checks Rohit's usage before suggesting; adds the 30 GB pack (₹181)"
    - "Stops the recipe-tips service on Anita's number"
    - "Hall box: ₹1,200 recharge and Aastha Bhajan; bedroom box: Hindi Basic ₹249, Star Sports 1 Hindi ₹19, ₹600 recharge"
    - "States ₹8,578 spent today"
  checks: {lang: hi, digits: ["9 Oct 2027", "12 Oct 2027"], say: [["8,578", "आठ हज़ार पाँच सौ अठहत्तर"]], tool_order: [get_plans, recharge]}
  guard: "Each person's plan and each box's change come in their own line; L3 asks for Rohit's usage before choosing; L10 asks for the total whatever was said."

- id: tel-104
  g: TEL-1
  lang: te
  script: te-mix
  diff: Hard
  dir: in
  title: "Seven numbers on the father's ID — three he never took blocked, two closed, two kept and cleaned"
  basis: "People find SIMs issued on their ID that they never took; each number has to be checked, blocked, closed or kept."
  caller: "M 26-45 · son in Hyderabad calling from his father's number with his father beside him, alarmed"
  goal: "Find every number on his father's ID, block the ones they don't know, close the unused ones, and keep and tidy the two in use."
  role: "You handle numbers on a customer's ID. Numbers the customer didn't take are blocked and reported; verifying the ID happens at a store."
  context: "The profile belongs to the father, Ramakrishna Rao, whose number is calling."
  tasks:
    - task: "Every number on the ID"
      calls:
        - "list_connections() → on Ramakrishna Rao's ID: 98490 30101, 98490 30102, 98490 30103, 70130 88411, 70130 88412, 70130 88413, 63000 52177"
        - "get_account(mobile=98490 30101) → prepaid, active, used daily (this phone)"
        - "get_account(mobile=98490 30102) → prepaid, active, used daily"
        - "get_account(mobile=98490 30103) → prepaid, validity ended June, unused since"
        - "get_account(mobile=70130 88411) → prepaid, activated Mon 14 Sep in Kolkata"
        - "get_account(mobile=70130 88412) → prepaid, activated Mon 14 Sep in Kolkata"
        - "get_account(mobile=70130 88413) → prepaid, activated Mon 14 Sep in Kolkata"
        - "get_account(mobile=63000 52177) → prepaid, balance ₹42, unused since March"
    - task: "Block the three they never took"
      calls:
        - "block_sim(mobile=70130 88411, reason=not taken by ID holder) → blocked, BS 30411"
        - "block_sim(mobile=70130 88412, reason=not taken by ID holder) → blocked, BS 30412"
        - "block_sim(mobile=70130 88413, reason=not taken by ID holder) → blocked, BS 30413"
        - "raise_ticket(category=SIMs issued without consent, summary=three numbers activated 14 Sep in Kolkata on Ramakrishna Rao's ID) → ticket ID 30420"
    - task: "Close the two unused ones"
      calls:
        - "disconnect_number(mobile=98490 30103, reason=not needed) → closed"
        - "disconnect_number(mobile=63000 52177, reason=not needed) → closed; ₹42 balance refunded"
    - task: "Keep and tidy the two in use"
      calls:
        - "get_vas(mobile=98490 30101) → devotional songs ₹30 a week"
        - "get_vas(mobile=98490 30102) → none"
        - "deactivate_vas(mobile=98490 30101, service=devotional songs) → stopped; no refund"
        - "recharge(mobile=98490 30101, plan_id=P859, payment=saved UPI) → recharged, valid until Mon 28 Dec"
        - "recharge(mobile=98490 30102, plan_id=P859, payment=saved UPI) → recharged, valid until Mon 28 Dec"
        - "set_dnd(mobile=98490 30101, categories=all promotional) → set, effective in 24 hours"
        - "set_dnd(mobile=98490 30102, categories=all promotional) → set, effective in 24 hours"
    - task: "ID check at a store"
      calls:
        - "find_store(pincode=500038) → Tarang store Ameerpet, ST-0381, 10 am-8 pm"
        - "book_store_visit(store_id=ST-0381, date=Tue 6 Oct, slot=11:00 am, purpose=ID verification for SIMs issued without consent) → appointment SV 30430"
        - "schedule_callback(date=Tue 6 Oct, slot=4-5 pm, topic=outcome of the ID check and ticket ID 30420) → booked"
        - "send_sms(template=id_numbers_summary) → sent"
  forbid: ["disconnect_number(mobile=98490 30102)", "recharge(mobile=70130 88411)"]
  lines:
    - [open, "హలో, మా నాన్నగారి ID మీద ఎన్ని numbers ఉన్నాయో చూడాలి. Government site లో ఏడు numbers చూపిస్తోంది, మాకు రెండే తెలుసు!", "Hello, I need to check how many numbers are on my father's ID. The government site shows seven numbers, and we only know of two!"]
    - [after, "నాన్నగారు నా పక్కనే ఉన్నారు, ఈ phone ఆయనదే. ఏడూ చదివి, ఒక్కొక్కటి ఎప్పుడు, ఎక్కడ activate అయిందో చెప్పండి.", "My father is right beside me; this phone is his. Read all seven and tell me when and where each one was activated."]
    - [after, "Kolkata? మేము ఎప్పుడూ వెళ్ళలేదు. ఆ మూడూ వెంటనే block చేయండి.", "Kolkata? We've never been there. Block those three immediately."]
    - [after, "దీని మీద complaint కూడా పెట్టండి.", "File a complaint about it too."]
    - [after, "June నుంచి వాడని number, March నుంచి వాడని number — ఆ రెండూ పాతవి, మూసేయండి.", "The number unused since June and the one unused since March — those two are old, close them."]
    - [after, "మిగతా రెండూ మావే — ఈ phone, అమ్మ phone. వాటి మీద ఏమైనా charges ఉన్నాయేమో చూడండి.", "The other two are ours — this phone and my mother's phone. Check whether there are any charges on them."]
    - [after, "అది ఆపేయండి. రెండిటికీ ఎనభై నాలుగు రోజుల plan వేయండి, UPI తో.", "Stop that. Put the eighty-four-day plan on both, by UPI."]
    - [after, "రెండిటికీ promotional calls ఆపేయండి.", "Stop promotional calls on both."]
