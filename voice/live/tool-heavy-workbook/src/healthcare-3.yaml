- id: hlt-119
  g: HLT-3
  lang: tx
  script: en → te-mix
  diff: Medium
  dir: in
  switch: "L5: English → Telugu (her father takes the phone)"
  title: "Father's reports and next tests — daughter books in English, father asks in Telugu what his numbers mean"
  basis: "Older patients want their results explained; the agent must route that to a clinician while still booking what is needed."
  caller: "F 26-45 · daughter in Bengaluru booking for her father in Warangal; speaker b: M 60+ · her father, Telugu only, worried about his sugar"
  goal: "Get the father's last reports to his doctor and his daughter, book the next tests and a review, and get his questions answered by a nurse."
  role: "You handle lab bookings and reports. Never interpret values; offer the nurse."
  context: ""
  tasks:
    - task: "Last month's reports"
      calls:
        - "get_patient(patient=Ramulu G) → UHID WG-991200, 68; linked to the caller"
        - "get_lab_order(order_id=LB 99110) → HbA1c, fasting glucose, kidney function; collected Thu 10 Sep"
        - "get_report_status(order_id=LB 99110, test=HbA1c) → ready"
        - "get_report_status(order_id=LB 99110, test=fasting glucose) → ready"
        - "get_report_status(order_id=LB 99110, test=kidney function) → ready"
        - "send_report(order_id=LB 99110, test=all, to=Dr Srinivas Rao) → sent"
        - "send_report(order_id=LB 99110, test=all, to=Lavanya G) → sent (linked family member)"
    - task: "Next tests"
      calls:
        - "get_collection_slots(pincode=506002, date=Thu 8 Oct) → 7-8 am"
        - "book_home_collection(tests=fasting glucose, post-meal glucose, pincode=506002, date=Thu 8 Oct, slot=7-8 am, patient=Ramulu G) → error: slot full"
        - "get_collection_slots(pincode=506002, date=Fri 9 Oct) → 7-8 am, 8-9 am"
        - "book_home_collection(tests=fasting glucose, post-meal glucose, pincode=506002, date=Fri 9 Oct, slot=7-8 am, patient=Ramulu G) → HC 99130; 10-12 hours fasting; second sample 2 hours after breakfast"
        - "add_test(collection_id=HC 99130, test=urine microalbumin) → added, ₹600"
        - "add_test(collection_id=HC 99130, test=lipid profile) → added, ₹700"
        - "add_test(collection_id=HC 99130, test=vitamin B12) → added, ₹800"
    - task: "Review and the nurse"
      calls:
        - "find_doctor(speciality=diabetology, branch=Hanamkonda) → Dr Srinivas Rao (D-9910)"
        - "get_slots(doctor_id=D-9910, date=Mon 12 Oct) → 10:00 am, 11:00 am"
        - "book_appointment(doctor_id=D-9910, date=Mon 12 Oct, slot=10:00 am, patient=Ramulu G) → AP 99140, ₹700"
        - "send_report(order_id=HC 99130, test=all, to=Dr Srinivas Rao) → will be sent when ready"
        - "transfer_to_nurse(reason=patient wants his sugar and kidney results explained) → nurse joins"
        - "send_sms(template=tests_and_review_summary) → sent"
  forbid: [transfer_to_pharmacist]
  lines:
    - [open, "Hi, I'm calling about my father's lab tests. He's in Warangal, I'm in Bangalore. He's on my account."]
    - [after, "Can you check if last month's reports are ready? Send them to his doctor, Dr Srinivas Rao, and to me."]
    - [after, "The doctor wants new tests — fasting and after-breakfast sugar. Thursday morning at home, or Friday if Thursday's full. Also add urine microalbumin, lipid profile and B12."]
    - [after, "And a review with Dr Srinivas Rao on Monday morning, after the results. My father wants to say something — he speaks Telugu."]
    - [after b, "నమస్కారం అమ్మా. నా sugar రిపోర్ట్ లో ఎంత వచ్చింది? ప్రమాదమా?", "Hello. What did my sugar report show? Is it dangerous?"]
    - [after b, "Kidney టెస్ట్ కూడా బాగుందా?", "Is the kidney test also fine?"]
    - [after b, "సరే, nurse తో మాట్లాడతాను. టెస్ట్ కి ముందు రోజు రాత్రి ఏం తినకూడదు?", "Okay, I'll talk to the nurse. What should I not eat the night before the test?"]
    - [after b, "Breakfast తర్వాత మళ్ళీ వస్తారా?", "Will they come again after breakfast?"]
    - [after b, "Monday డాక్టర్ దగ్గరికి ఎన్ని గంటలకి?", "What time at the doctor on Monday?"]
    - [after b, "సరే. Message అమ్మాయికి పంపండి.", "Okay. Send the message to my daughter."]
    - [after b, "ఇప్పుడు nurse ని కలపండి.", "Now connect the nurse."]
    - [after b, "Thanks అమ్మా.", "Thank you."]
  key:
    - "Finds last month's three reports ready and sends them to Dr Srinivas Rao and to Lavanya"
    - "When Thursday is full, says so and books Fri 9 Oct 7-8 am; adds microalbumin, lipid profile and B12"
    - "Books the review Mon 12 Oct 10:00 am with the new reports going to the doctor"
    - "Replies in Telugu from L5; does not read or judge his sugar or kidney values; connects the nurse"
    - "Explains the fast and the second sample 2 hours after breakfast"
  checks: {lang_from: {L5: te}, digits: ["HC 99130", "AP 99140", "Fri 9 Oct"], tool_order: [get_report_status, send_report]}
  guard: "The daughter sets the recipients, test fallback and review in English before the handover; the father's first two questions must not be answered with values."

- id: hlt-120
  g: HLT-3
  lang: hg
  diff: Hard
  dir: in
  title: "Warfarin patient — four weekly INR tests at home, extra tests, every result to the doctor, a video review, a bruising question"
  basis: "Patients on blood thinners need regular INR checks; each week's collection and report is booked separately."
  caller: "F 46-60 · daughter-in-law in Chandigarh caring for her father-in-law after a valve replacement, methodical"
  goal: "Set up four weekly home INR tests with every result going to the cardiologist, a video review after the month, the warfarin refill, and the bruising question answered by a nurse."
  role: "You handle lab bookings. Never interpret INR values or advise on warfarin doses; offer the nurse."
  context: ""
  tasks:
    - task: "Patient and medicine"
      calls:
        - "get_patient(patient=Balwant Singh) → UHID CD-120400, 74; valve replacement in August"
        - "get_prescription(rx_id=RX 12041) → warfarin 3 mg once a day (dose by INR); metoprolol 25 mg; furosemide 20 mg"
        - "request_medical_records(patient=Balwant Singh, record=INR results since August) → emailed"
