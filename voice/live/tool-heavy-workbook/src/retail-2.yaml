- id: ret-114
  g: RET-3
  lang: hi
  diff: Medium
  dir: in
  title: "Six September returns, money not back — each traced, two pickups redone, routes switched, one escalated"
  basis: "Customers with several returns lose track of which refunds came; each return has to be traced separately."
  caller: "F 46-60 · school teacher in Kanpur, firm, keeps a notebook of returns"
  goal: "Know where each of six refunds is, fix the stuck ones, get the slow ones moved to Kartly balance and escalate the one marked paid but not received."
  role: "You handle refunds. A refund marked paid with a UTR is investigated with a ticket."
  context: ""
  tasks:
    - task: "Find the six returns"
      calls:
        - "list_orders() → returns RT-72001 (kurti), RT-72002 (mixer jar), RT-72003 (bedsheet), RT-72004 (sandals), RT-72005 (tiffin), RT-72006 (handbag)"
        - "get_return(return_id=RT-72001) → picked up Fri 18 Sep"
        - "get_return(return_id=RT-72002) → picked up Mon 21 Sep"
        - "get_return(return_id=RT-72003) → pickup failed twice (Tue 29 Sep, Thu 1 Oct), marked customer unavailable"
        - "get_return(return_id=RT-72004) → picked up Sat 26 Sep"
        - "get_return(return_id=RT-72005) → pickup failed once (Fri 2 Oct)"
        - "get_return(return_id=RT-72006) → picked up Tue 22 Sep"
    - task: "Refund for each one picked up"
      calls:
        - "check_refund(order_id=KT-71501, item_id=kurti) → ₹899 refunded to UPI on Tue 22 Sep, UTR 6285 0091 2201"
        - "check_refund(order_id=KT-71522, item_id=mixer jar) → error: refund service timed out"
        - "check_refund(order_id=KT-71522, item_id=mixer jar) → ₹1,250 to bank account, processing, due Wed 7 Oct"
        - "check_refund(order_id=KT-71530, item_id=sandals) → ₹1,499 to card, due Tue 6 Oct"
        - "check_refund(order_id=KT-71544, item_id=handbag) → ₹2,199 refunded to UPI on Sat 26 Sep, UTR 6285 0091 2206"
    - task: "Switch the two slow ones to Kartly balance"
      calls:
        - "set_refund_route(return_id=RT-72002, route=Kartly balance) → ₹1,250 credited now"
        - "set_refund_route(return_id=RT-72004, route=Kartly balance) → ₹1,499 credited now"
    - task: "The two failed pickups"
      calls:
        - "reschedule_pickup(return_id=RT-72003, date=Wed 7 Oct) → pickup Wed 7 Oct, 4-7 pm"
        - "cancel_return(return_id=RT-72005) → return cancelled; she keeps the tiffin"
    - task: "The handbag refund she never got"
      calls:
        - "raise_ticket(category=refund not received, summary=RT-72006 ₹2,199 marked paid 26 Sep, UTR 6285 0091 2206; not in customer's account) → ticket RF 72060"
        - "credit_goodwill(order_id=KT-71510, amount=₹150, reason=two failed pickups) → ₹150 added to Kartly balance"
        - "get_wallet() → Kartly balance ₹2,899"
        - "schedule_callback(date=Fri 9 Oct, slot=4-5 pm, topic=ticket RF 72060) → booked"
        - "send_sms(template=refunds_summary) → sent"
  forbid: ["cancel_return(return_id=RT-72003)", "set_refund_route(return_id=RT-72001, route=Kartly balance)"]
  lines:
    - [open, "नमस्ते, सितंबर में मैंने छह चीज़ें वापस की थीं। कुछ के पैसे आए, कुछ के नहीं। मेरी कॉपी में सब लिखा है, एक-एक करके देखिए।", "Hello, I returned six things in September. Money came for some, not for others. I've written it all in my notebook — please check them one by one."]
    - [after, "कुर्ती, मिक्सर जार, बेडशीट, सैंडल, टिफ़िन और हैंडबैग।", "The kurti, the mixer jar, the bedsheet, the sandals, the tiffin and the handbag."]
    - [after, "जिनका पैसा अभी तक नहीं आया, उन्हें Kartly बैलेंस में डाल दीजिए, अभी चाहिए।", "For the ones whose money hasn't come yet, put it in my Kartly balance — I need it now."]
    - [after, "बेडशीट वाले दो बार आए ही नहीं, और लिख दिया मैं घर पर नहीं थी! बुधवार शाम को भेजिए, मैं रहूँगी।", "For the bedsheet they never came, twice, and wrote that I wasn't home! Send them Wednesday evening, I'll be there."]
    - [after, "टिफ़िन रहने दीजिए, वो रख लेती हूँ। उसकी वापसी बंद कर दीजिए।", "Leave the tiffin, I'll keep it. Cancel that return."]
    - [after, "हैंडबैग का आप कह रहे हैं पैसा चला गया? मेरे खाते में नहीं आया।", "You're saying the handbag money has been sent? It hasn't come into my account."]
    - [pause 1600, "UTR बताइए, मैं बैंक में भी पूछ लूँगी।", "Tell me the UTR, I'll ask at the bank too."]
    - [after, "इसकी शिकायत दर्ज कीजिए। और इतनी परेशानी हुई, उसका कुछ?", "Register a complaint about it. And for all this trouble — anything?"]
    - [after, "अब मेरे Kartly बैलेंस में कुल कितना है?", "Now how much is in my Kartly balance in total?"]
    - [after, "शुक्रवार शाम को शिकायत का जवाब बताइएगा।", "Tell me the answer on the complaint on Friday evening."]
    - [after, "ठीक है, सब SMS कर दीजिए।", "Okay, SMS everything."]
    - [after, "धन्यवाद।", "Thank you."]
  key:
    - "Traces all six: kurti refunded 22 Sep; mixer jar and sandals still due; bedsheet and tiffin pickups failed; handbag marked paid 26 Sep"
    - "When the mixer-jar check times out, says so and checks again"
    - "Switches the mixer jar (₹1,250) and sandals (₹1,499) to Kartly balance; leaves the paid kurti"
    - "Reschedules the bedsheet pickup to Wed 7 Oct, 4-7 pm; cancels only the tiffin return"
    - "Reads UTR 6285 0091 2206, raises RF 72060, credits ₹150, gives the ₹2,899 balance and books Friday's call-back"
  checks: {lang: hi, digits: ["6285 0091 2206", "RF 72060", "2,899"], tool_order: [get_return, check_refund]}
  guard: "Every item is named by what it is; L3 asks for any refund still pending, whatever the agent found; L6 reacts to the paid status the agent must report."

