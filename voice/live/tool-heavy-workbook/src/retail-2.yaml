# Ecommerce & Retail — tool-heavy scenarios ret-109 … ret-116 (RET-2 Checkout & payments, RET-3 Returns, refunds & exchanges).
code: ret
scenarios:

- id: ret-109
  g: RET-2
  lang: hi
  diff: Hard
  dir: in
  title: "Five office gift cards — redeemed one by one, coins and balance spent on family gifts to two cities"
  basis: "Festive gift cards from employers arrive in bulk; customers redeem each and split the spend across orders and addresses."
  caller: "M 26-45 · bank officer in Bhopal, methodical, reads codes slowly"
  goal: "Redeem all five gift cards, use his expiring coins, buy four gifts for two cities with the least UPI, and get the used card looked into."
  role: "You handle payments and orders. One coupon per order. Kart Coins are worth ₹1 each."
  context: "Gift wrap is free this week. Coupon GIFT200 gives ₹200 off an order of ₹5,000 or more."
  tasks:
    - task: "Wallet and cart"
      calls:
        - "get_wallet() → Kartly balance ₹650; Kart Coins 1,200, expiring 31 Oct"
        - "get_cart() → empty"
    - task: "Redeem each gift card"
      calls:
        - "redeem_gift_card(code=KGC-4410-7781) → ₹2,000 added to Kartly balance"
        - "redeem_gift_card(code=KGC-4410-7782) → ₹2,000 added to Kartly balance"
        - "redeem_gift_card(code=KGC-4410-7783) → already used on Fri 2 Oct"
        - "redeem_gift_card(code=KGC-4410-7784) → ₹2,000 added to Kartly balance"
        - "redeem_gift_card(code=KGC-4410-7785) → ₹2,000 added to Kartly balance"
        - "get_wallet() → Kartly balance ₹8,650; Kart Coins 1,200"
        - "raise_ticket(category=gift card, summary=KGC-4410-7783 shows used on 2 Oct; customer says never redeemed) → ticket GC 70921"
    - task: "Check and add the four gifts"
      calls:
        - "check_stock(sku=Chanderi silk saree, pincode=474001) → in stock"
        - "check_stock(sku=analog wristwatch, pincode=474001) → in stock"
        - "check_stock(sku=remote-control car, pincode=462016) → in stock"
        - "check_stock(sku=perfume gift set, pincode=462016) → in stock"
        - "add_to_cart(sku=Chanderi silk saree, qty=1) → added, ₹3,200"
        - "add_to_cart(sku=analog wristwatch, qty=1) → added, ₹4,500"
    - task: "Order for his parents in Gwalior"
      calls:
        - "validate_coupon(code=GIFT200, cart_value=₹7,700) → valid; ₹200 off"
        - "place_order(address=Ram Prasad Mishra, 8 Lashkar, Gwalior 474001, payment_mode=Kartly balance, coupon=GIFT200) → order KT-67102, ₹7,500 from Kartly balance; delivery Fri 9 Oct"
        - "add_gift_wrap(order_id=KT-67102, item_id=Chanderi silk saree, message=Happy Diwali Amma) → wrapped, ₹0"
        - "add_gift_wrap(order_id=KT-67102, item_id=analog wristwatch, message=Happy Diwali Papa) → wrapped, ₹0"
    - task: "Order for home in Bhopal"
      calls:
        - "add_to_cart(sku=remote-control car, qty=1) → added, ₹1,800"
        - "add_to_cart(sku=perfume gift set, qty=1) → added, ₹2,450"
        - "place_order(address=22 Arera Colony, Bhopal 462016, payment_mode=Kart Coins then Kartly balance then UPI) → order KT-67118, ₹4,250: ₹1,200 coins, ₹1,150 balance, ₹1,900 UPI; delivery Thu 8 Oct"
        - "add_gift_wrap(order_id=KT-67118, item_id=perfume gift set, message=For Neha, with love) → wrapped, ₹0"
        - "add_gift_wrap(order_id=KT-67118, item_id=remote-control car, message=Happy Diwali Chintu) → wrapped, ₹0"
    - task: "Summary"
      calls:
        - "send_sms(template=gift_orders_summary) → sent"
  forbid: ["validate_coupon(code=GIFT200, cart_value=₹4,250)"]
  lines:
    - [open, "नमस्ते, मुझे ऑफ़िस से दिवाली पर पाँच Kartly गिफ़्ट कार्ड मिले हैं। सब बैलेंस में डालने हैं और फिर कुछ तोहफ़े ख़रीदने हैं।", "Hello, I got five Kartly gift cards from the office for Diwali. I want to put them all into my balance and then buy some gifts."]
    - [after, "पहले बताइए अभी बैलेंस कितना है।", "First tell me what the balance is right now."]
    - [after, "कोड हैं — के जी सी चार चार एक शून्य, सात सात आठ एक। फिर वही, आख़िर में आठ दो, आठ तीन, आठ चार, आठ पाँच।", "The codes are — KGC-4410-7781. Then the same, ending 82, 83, 84 and 85."]
    - [after, "तीसरा पहले इस्तेमाल हो चुका? मैंने तो कभी नहीं किया। इसकी शिकायत दर्ज कीजिए।", "The third one is already used? I never used it. Please register a complaint."]
    - [after, "अब तोहफ़े। ग्वालियर में माँ के लिए चंदेरी सिल्क साड़ी और पापा के लिए घड़ी। ग्वालियर का पिनकोड चार सात चार शून्य शून्य एक।", "Now the gifts. In Gwalior, a Chanderi silk saree for my mother and a watch for my father. Gwalior's pincode is 474001."]
    - [after, "भोपाल में घर पर — भतीजे के लिए रिमोट वाली कार और पत्नी के लिए परफ़्यूम सेट। यहाँ का पिनकोड चार छह दो शून्य एक छह।", "At home in Bhopal — a remote-control car for my nephew and a perfume set for my wife. The pincode here is 462016."]
    - [after, "ग्वालियर वाला पता — राम प्रसाद मिश्रा, आठ लश्कर, ग्वालियर। कोई कूपन लगता है क्या?", "The Gwalior address — Ram Prasad Mishra, 8 Lashkar, Gwalior. Does any coupon apply?"]
    - [after, "ठीक है, उसे बैलेंस से कर दीजिए। दोनों को गिफ़्ट रैप — माँ के लिए 'हैप्पी दिवाली अम्मा', पापा के लिए 'हैप्पी दिवाली पापा'।", "Fine, pay that one from the balance. Gift-wrap both — for my mother 'Happy Diwali Amma', for my father 'Happy Diwali Papa'."]
    - [after, "भोपाल वाला — बाईस अरेरा कॉलोनी। पहले कॉइन लगाइए, जो ख़त्म होने वाले हैं, फिर बैलेंस, बाकी UPI।", "The Bhopal one — 22 Arera Colony. Use the coins first, the ones that are expiring, then the balance, the rest by UPI."]
    - [after, "परफ़्यूम पर 'फ़ॉर नेहा, विद लव', और कार पर 'हैप्पी दिवाली चिंटू'।", "On the perfume 'For Neha, with love', and on the car 'Happy Diwali Chintu'."]
    - [after, "तो UPI से कितना देना पड़ा?", "So how much did I have to pay by UPI?"]
    - [after, "ठीक है। SMS भेज दीजिए। धन्यवाद।", "Okay. Send an SMS. Thank you."]
  key:
    - "Redeems the four valid cards (₹8,000) and says 7783 was already used on 2 October; raises GC 70921"
    - "Checks stock for all four gifts at their pincodes"
    - "Applies GIFT200 to the Gwalior order (₹7,500 from balance, KT-67102) and not to the Bhopal order, which is under ₹5,000"
    - "Pays the Bhopal order with coins, then balance, then UPI: ₹1,200, ₹1,150, ₹1,900 (KT-67118)"
    - "Gift-wraps all four with the exact messages at no charge"
    - "States ₹1,900 by UPI"
  checks: {lang: hi, digits: ["KT-67102", "KT-67118", "GC 70921"], say: [["1,900", "उन्नीस सौ", "एक हज़ार नौ सौ"]], tool_order: [redeem_gift_card, place_order]}
  guard: "The codes come in one line; L4 reacts to the used card the agent must report; each order's address, payment order and messages come before it is placed."

- id: ret-110
  g: RET-2
  lang: tx
  script: en → te-mix
  diff: Hard
  dir: in
  switch: "L5: English → Telugu (his father takes the phone)"
  title: "Son abroad orders Dasara things for his parents — father picks in Telugu, son's card declined, installation booked"
  basis: "Children working abroad pay for their parents' shopping; the parent chooses and the agent has to switch language."
  caller: "M 26-45 · son in New Jersey on a call with his father, organised; speaker b: M 60+ · his father in Vijayawada, Telugu only, decides slowly"
  goal: "Order what his father wants for Dasara to Vijayawada, paid by the son, with the water purifier installed."
  role: "You handle orders. Check stock at the parents' pincode before adding anything."
  context: ""
  tasks:
    - task: "Cart and pincode"
      calls:
        - "get_cart() → old item: phone tripod ₹699"
        - "remove_from_cart(sku=phone tripod) → removed"
        - "check_pincode(pincode=520010) → serviceable, 2-3 days, installation available"
    - task: "Stock for the father's list"
      calls:
        - "check_stock(sku=water purifier RO+UV, pincode=520010) → in stock"
        - "check_stock(sku=silver pooja lamp pair, pincode=520010) → in stock"
        - "check_stock(sku=wet grinder 2 L, pincode=520010) → out of stock, back Fri 23 Oct"
        - "check_stock(sku=cotton dhoti set, pincode=520010) → in stock"
        - "check_stock(sku=steel tiffin box set, pincode=520010) → in stock"
        - "find_alternatives(sku=wet grinder 2 L) → tilting wet grinder 2 L ₹5,250, delivery Thu 8 Oct"
    - task: "Add everything"
      calls:
        - "add_to_cart(sku=water purifier RO+UV, qty=1) → added, ₹13,499"
        - "add_to_cart(sku=silver pooja lamp pair, qty=1) → added, ₹3,800"
        - "add_to_cart(sku=tilting wet grinder 2 L, qty=1) → added, ₹5,250"
        - "add_to_cart(sku=cotton dhoti set, qty=2) → added, ₹1,980"
        - "add_to_cart(sku=steel tiffin box set, qty=1) → added, ₹899"
        - "validate_coupon(code=FESTIVE5, cart_value=₹25,428) → valid; ₹1,271 off (5%)"
    - task: "Pay — US card first, Indian debit card if it fails"
      calls:
        - "place_order(address=K. Satyanarayana, 12-4 Benz Circle, Vijayawada 520010, payment_mode=international credit card, coupon=FESTIVE5) → error: international card declined for this merchant"
        - "place_order(address=K. Satyanarayana, 12-4 Benz Circle, Vijayawada 520010, payment_mode=Indian debit card, coupon=FESTIVE5) → order KT-68030, ₹24,157; delivery Thu 8 Oct"
    - task: "Installation and warranty for the purifier"
      calls:
        - "book_installation(order_id=KT-68030, item_id=water purifier RO+UV, date=Sat 10 Oct, slot=10 am-1 pm) → technician visit booked"
        - "add_extended_warranty(order_id=KT-68030, item_id=water purifier RO+UV, years=2) → plan added, ₹1,199"
        - "send_sms(template=order_summary) → sent"
  forbid: ["add_to_cart(sku=wet grinder 2 L)"]
  lines:
    - [open, "Hi, I'm calling from the US. I want to place an order for my parents in Vijayawada for Dasara. I'll pay, but my father will tell you what he wants."]
    - [after, "There's some old thing in the cart, clear it out. The pincode is five two zero zero one zero."]
    - [after, "I'll pay with my US credit card. If that doesn't go through, use my Indian debit card, it's saved."]
    - [after, "Okay, I'm putting my father on. He speaks Telugu."]
    - [after b, "నమస్కారం అమ్మా. నాకు ఒక water purifier కావాలి, RO ఉన్నది. ఇంకా పూజ కోసం వెండి దీపాల జత.", "Hello. I want a water purifier, one with RO. And a pair of silver lamps for pooja."]
    - [after b, "ఒక wet grinder, రెండు లీటర్లది. రెండు dhoti sets, ఒక steel tiffin box set.", "A wet grinder, a two-litre one. Two dhoti sets, and one steel tiffin box set."]
    - [after b, "Grinder లేదా? ఇంకోటి ఏదైనా ఉంటే అదే పెట్టండి, పండగ ముందే రావాలి.", "No grinder? If there's another one, put that, it must come before the festival."]
    - [after b, "మొత్తం ఎంత అయింది?", "How much is it altogether?"]
    - [after b, "అడ్రస్ — K. Satyanarayana, పన్నెండు డాష్ నాలుగు, Benz Circle, Vijayawada.", "The address — K. Satyanarayana, 12-4, Benz Circle, Vijayawada."]
    - [after b, "Purifier పెట్టడానికి ఎవరైనా వస్తారా? శనివారం పొద్దున రమ్మనండి.", "Will someone come to fit the purifier? Ask them to come Saturday morning."]
    - [after b, "దానికి ఇంకా రెండేళ్ళు warranty పెట్టండి.", "Add two more years of warranty on it."]
    - [after b, "అబ్బాయి card పనిచేసిందా? అన్నీ ఎప్పుడు వస్తాయి?", "Did my son's card work? When will everything come?"]
    - [after b, "సరే, SMS పంపండి. చాలా సంతోషం.", "Okay, send an SMS. Very happy."]
  key:
    - "Clears the tripod; checks every item's stock at 520010"
    - "Replies in Telugu from L5; offers the tilting wet grinder (₹5,250) when the 2 L one is out of stock"
    - "Applies FESTIVE5 and states ₹24,157"
    - "When the US card is declined, says so and pays with the Indian debit card (KT-68030)"
    - "Books the purifier installation for Sat 10 Oct, 10 am-1 pm, and adds the 2-year warranty (₹1,199)"
    - "Patient with the father; gives the 8 October delivery date"
  checks: {lang_from: {L5: te}, digits: ["KT-68030", "24,157"], tool_order: [check_stock, add_to_cart]}
  guard: "The son's English lines set address pincode, payer and card fallback before the handover; the father's lines each name what they want, true after any reply."

- id: ret-111
  g: RET-2
  lang: hg
  diff: Medium
  dir: in
  title: "Student stretches her budget — coupons tested one by one, out-of-stock swap, cart split into two orders"
  basis: "Price-sensitive shoppers try several coupons and split carts so each coupon's rules are met."
  caller: "F 18-25 · college student in Jaipur, chatty, very price-aware"
  goal: "Pay the least for her cart: test each coupon, swap what is out of stock, split the order so two coupons apply, and wrap a birthday gift."
  role: "You handle orders. One coupon per order; say why a coupon does not apply."
  context: "STUDENT10: 10% up to ₹300, any order. FASHION300: ₹300 off fashion orders of ₹2,999 or more. FIRST50: first order only."
  tasks:
    - task: "Cart and wallet"
      calls:
        - "get_cart() → kurta set ₹1,499; jeans ₹1,299; sneakers ₹2,199; bluetooth earbuds ₹1,799; laptop sleeve ₹699; desk lamp ₹1,099; cart value ₹8,594"
        - "get_wallet() → Kartly balance ₹420"
    - task: "Stock for each item"
      calls:
        - "check_stock(sku=kurta set, pincode=302017) → in stock"
        - "check_stock(sku=jeans, pincode=302017) → in stock"
        - "check_stock(sku=sneakers, pincode=302017) → in stock"
        - "check_stock(sku=bluetooth earbuds, pincode=302017) → in stock"
        - "check_stock(sku=laptop sleeve, pincode=302017) → out of stock, back Mon 26 Oct"
        - "check_stock(sku=desk lamp, pincode=302017) → in stock"
    - task: "Swap the laptop sleeve"
      calls:
        - "remove_from_cart(sku=laptop sleeve) → removed"
        - "find_alternatives(sku=laptop sleeve) → padded laptop sleeve ₹649, in stock"
        - "check_stock(sku=padded laptop sleeve, pincode=302017) → in stock"
        - "add_to_cart(sku=padded laptop sleeve, qty=1) → added, ₹649"
        - "notify_restock(sku=laptop sleeve) → alert set"
    - task: "Test the coupons"
      calls:
        - "validate_coupon(code=FIRST50, cart_value=₹8,544) → not valid: first order only"
        - "validate_coupon(code=FASHION300, cart_value=₹4,997) → valid on the fashion items (kurta, jeans, sneakers); ₹300 off"
        - "validate_coupon(code=STUDENT10, cart_value=₹3,547) → valid on the other items; ₹300 off (capped)"
    - task: "Two orders"
      calls:
        - "place_order(address=Room 12, Girls Hostel, Malviya Nagar, Jaipur 302017, payment_mode=UPI, coupon=FASHION300) → order KT-69021 (kurta set, jeans, sneakers), ₹4,697; delivery Thu 8 Oct"
        - "place_order(address=Room 12, Girls Hostel, Malviya Nagar, Jaipur 302017, payment_mode=Kartly balance then UPI, coupon=STUDENT10) → order KT-69022 (earbuds, padded laptop sleeve, desk lamp), ₹3,247: ₹420 balance, ₹2,827 UPI; delivery Fri 9 Oct"
        - "add_gift_wrap(order_id=KT-69022, item_id=bluetooth earbuds, message=Happy birthday Tanvi!) → wrapped, ₹49"
    - task: "Summary"
      calls:
        - "send_sms(template=order_summary) → sent"
  forbid: ["add_to_cart(sku=laptop sleeve)"]
  lines:
    - [open, "Hi! Mera cart ready hai par mujhe sabse sasta karna hai. Help karoge?", "Hi! My cart is ready but I want to make it as cheap as possible. Will you help?"]
    - [after, "Cart mein jo hai padh do. Aur mere Kartly balance mein kitna hai?", "Read me what's in the cart. And how much is in my Kartly balance?"]
    - [after, "Pincode three zero two zero one seven. Sab available hai na?", "Pincode 302017. Everything is available, right?"]
    - [after, "Laptop sleeve nahi hai? Hata do, koi aur sasta sa daal do. Aur jab woh wapas aaye toh mujhe bata dena.", "No laptop sleeve? Remove it and put in some other cheap one. And let me know when that one is back."]
    - [after, "Ab coupons. Mere paas teen hain — FIRST fifty, FASHION three hundred, STUDENT ten. Ek-ek check karo.", "Now coupons. I have three — FIRST50, FASHION300, STUDENT10. Check each one."]
    - [after, "Ek order mein ek hi coupon? Toh do order bana do — kapde ek mein, baaki doosre mein. Dono coupon lag jayenge na?", "Only one coupon per order? Then make two orders — clothes in one, the rest in the other. Both coupons will apply then, right?"]
    - [after, "Pata — Room twelve, Girls Hostel, Malviya Nagar, Jaipur. Kapdon wala UPI se.", "Address — Room 12, Girls Hostel, Malviya Nagar, Jaipur. The clothes one by UPI."]
    - [after, "Doosre mein pehle mera balance lagao, baaki UPI.", "In the second, use my balance first, the rest by UPI."]
    - [after, "Earbuds meri dost ka birthday gift hai. Gift wrap kar do — 'Happy birthday Tanvi!'", "The earbuds are my friend's birthday gift. Gift-wrap them — 'Happy birthday Tanvi!'"]
    - [after, "Total kitna bacha maine?", "How much did I save in total?"]
    - [after, "Kab tak aayega sab?", "When will it all come?"]
    - [after, "Yay! SMS kar do. Thank you!", "Yay! SMS it. Thank you!"]
  key:
    - "Checks stock for all six; removes the laptop sleeve, adds the padded one (₹649) after checking it, and sets a restock alert"
    - "Says FIRST50 is for first orders only; FASHION300 works on the clothes and STUDENT10 on the rest (capped at ₹300)"
    - "Places KT-69021 (₹4,697, UPI) and KT-69022 (₹3,247: ₹420 balance, ₹2,827 UPI)"
    - "Wraps the earbuds with 'Happy birthday Tanvi!' (₹49)"
    - "States she saved ₹650: ₹600 in coupons and ₹50 on the cheaper sleeve"
  checks: {lang: hg, digits: ["KT-69021", "KT-69022", "2,827"], say: [["650", "chhe sau pachaas", "six hundred fifty"]], tool_order: [validate_coupon, place_order]}
  guard: "L4 reacts to the stock result the agent must give; L6 proposes the split whatever the agent suggested first; payment for each order comes before it is placed."

- id: ret-112
  g: RET-3
  lang: en
  diff: Hard
  dir: in
  title: "After the wedding — seven outfits: returns, exchanges, a size out of stock, a badly stitched blouse, pickup day full"
  basis: "Wedding wardrobes are bought in bulk and returned item by item, each with its own rule."
  caller: "F 26-45 · bride's sister in Mumbai returning most of the wedding shopping, organised"
  goal: "Send back everything she can in one pickup, exchange two sizes, get refunds where she wants them, and complain about a blouse stitched wrong."
  role: "You handle returns. Check each item's eligibility first. Stitched-to-measure items can't be returned but can be reported if stitched wrong."
  context: ""
  tasks:
    - task: "Read both orders"
      calls:
        - "get_order(order_id=KT-70110) → lehenga ₹12,500; sherwani ₹9,800; dupatta ₹1,800; delivered Sat 26 Sep; paid by card"
        - "get_order(order_id=KT-70144) → kurta set ₹2,400; juttis ₹1,950; stitched blouse ₹3,200; bangles set ₹899; delivered Mon 28 Sep; paid by UPI"
    - task: "Eligibility for each"
      calls:
        - "check_return_eligibility(order_id=KT-70110, item_id=lehenga) → exchange or return until Mon 12 Oct"
        - "check_return_eligibility(order_id=KT-70110, item_id=sherwani) → exchange or return until Mon 12 Oct"
        - "check_return_eligibility(order_id=KT-70110, item_id=dupatta) → returnable until Mon 12 Oct"
        - "check_return_eligibility(order_id=KT-70144, item_id=kurta set) → returnable until Wed 14 Oct"
        - "check_return_eligibility(order_id=KT-70144, item_id=juttis) → returnable until Wed 14 Oct"
        - "check_return_eligibility(order_id=KT-70144, item_id=stitched blouse) → not returnable: stitched to measure"
        - "check_return_eligibility(order_id=KT-70144, item_id=bangles set) → not returnable: jewellery"
    - task: "Exchanges"
      calls:
