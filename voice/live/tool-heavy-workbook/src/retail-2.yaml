    - [after, "Photos తీశాను, ఒక్కో దానికి link పంపండి.", "I've taken photos — send a link for each one."]
    - [after, "Chairs, showcase, dinner set — కొత్తవి పంపండి. Showcase వచ్చాక ఎవరైనా బిగించాలి, ఆదివారం పొద్దున.", "Chairs, showcase, dinner set — send new ones. Once the showcase comes, someone has to assemble it, Sunday morning."]
    - [after, "Table మార్చడానికి వారాలు పడుతుందా? వద్దు, table ఉంచుకుంటాను, ఏదైనా discount ఇవ్వండి.", "Will changing the table take weeks? No, I'll keep the table — give some discount."]
    - [after, "Fridge మాత్రం వద్దు, వెనక్కి తీసుకోండి. డబ్బు Kartly balance లో వేయండి. వేరే brand ఏది ఉంది?", "But I don't want the fridge — take it back. Put the money in my Kartly balance. Which other brand is there?"]
    - [after, "LG ది తీసుకుంటాను, card తో. అడ్రస్ అదే — Plot forty one, Kondapur.", "I'll take the LG, by card. Same address — Plot 41, Kondapur."]
    - [after, "Sofa, bed ఇంకా రాలేదు. రెండూ ఒకే రోజు, శనివారం పొద్దున రావాలి.", "The sofa and bed haven't come yet. Both should come the same day, Saturday morning."]
    - [after, "అన్నీ ఎప్పుడెప్పుడు వస్తాయో ఒకసారి చెప్పండి.", "Tell me once when each thing will come."]
    - [after, "Kartly balance లో మొత్తం ఎంత వస్తుంది?", "How much will come into my Kartly balance in total?"]
    - [after, "SMS పంపండి. Thanks.", "Send an SMS. Thanks."]
  key:
    - "Files six damage reports, one per piece, each with a photo link"
    - "Replaces both chairs, the showcase and the dinner set, and books showcase assembly for Sun 11 Oct, 10 am-1 pm"
    - "Keeps the table and credits ₹2,500"
    - "Returns the fridge to Kartly balance (RT-73301, ₹32,990) and orders the LG 343 L by card (KT-73420)"
    - "Moves the sofa and bed to Sat 10 Oct, 9 am-1 pm"
    - "Reads all dates back; states ₹35,490 to Kartly balance; speaks Telugu, keeping his English words"
  checks: {lang: te, digits: ["KT-73420", "RT-73301", "DR-73106"], say: [["35,490", "ముప్పై ఐదు వేల నాలుగు వందల తొంభై"]], tool_order: [report_damage, create_replacement]}
  guard: "All damage is described in L2–L3 before any report; each later line decides one outcome, true whatever the agent said; L8 picks a brand the alternatives list."

- id: ret-116
  g: RET-3
  lang: ta
  script: ta-mix
  diff: Medium
  dir: in
  title: "Pickups that never came — three returns rescheduled (one day full), one cancelled, refunds routed, a new return"
  basis: "Returns stall when couriers mark customers unavailable; each return has to be rescheduled or dropped."
  caller: "F 26-45 · IT employee in Coimbatore working from home, annoyed"
  goal: "Get three stuck pickups done this week, drop one return, send refunds where she wants and start one more return."
  role: "You handle returns."
  context: ""
  tasks:
    - task: "Find the returns"
      calls:
        - "list_orders() → returns RT-74001 (saree), RT-74002 (air purifier), RT-74003 (yoga mat), RT-74004 (water bottle); order KT-74080 (wall clock, delivered Fri 2 Oct)"
        - "get_return(return_id=RT-74001) → pickup failed Thu 1 Oct, marked customer unavailable"
        - "get_return(return_id=RT-74002) → pickup failed Fri 2 Oct, marked customer unavailable"
        - "get_return(return_id=RT-74003) → pickup failed Sat 3 Oct, marked customer unavailable"
        - "get_return(return_id=RT-74004) → picked up Mon 28 Sep"
    - task: "Reschedule the three"
      calls:
        - "reschedule_pickup(return_id=RT-74001, date=Wed 7 Oct) → error: no pickup slots on Wed 7 Oct for 641035"
        - "reschedule_pickup(return_id=RT-74001, date=Thu 8 Oct) → pickup Thu 8 Oct, 10 am-1 pm"
        - "reschedule_pickup(return_id=RT-74002, date=Thu 8 Oct) → pickup Thu 8 Oct, 10 am-1 pm"
        - "cancel_return(return_id=RT-74003) → return cancelled"
    - task: "Refunds"
      calls:
        - "check_refund(order_id=KT-73960, item_id=water bottle) → ₹749 to card, due Wed 7 Oct"
        - "set_refund_route(return_id=RT-74004, route=Kartly balance) → ₹749 credited now"
        - "set_refund_route(return_id=RT-74001, route=original payment) → UPI, 2-3 days after pickup"
        - "set_refund_route(return_id=RT-74002, route=Kartly balance) → instant after pickup"
    - task: "A new return"
      calls:
        - "check_return_eligibility(order_id=KT-74080, item_id=wall clock) → returnable until Fri 16 Oct"
        - "create_return(order_id=KT-74080, item_id=wall clock, reason=stopped working, pickup_date=Thu 8 Oct) → return RT-74120; pickup Thu 8 Oct, 10 am-1 pm; refund ₹1,299"
        - "set_refund_route(return_id=RT-74120, route=Kartly balance) → instant after pickup"
    - task: "Complaint, goodwill, follow-up"
      calls:
        - "raise_ticket(category=pickup marked unavailable, summary=RT-74001, 74002, 74003 marked customer unavailable; customer was home) → ticket PK 74130"
        - "credit_goodwill(order_id=KT-74080, amount=₹200, reason=three failed pickups) → ₹200 added to Kartly balance"
        - "schedule_callback(date=Thu 8 Oct, slot=2-3 pm, topic=confirm pickups RT-74001, 74002, 74120 done) → booked"
        - "send_sms(template=returns_summary) → sent"
  forbid: ["cancel_return(return_id=RT-74001)", "cancel_return(return_id=RT-74002)"]
  lines:
    - [open, "வணக்கம். மூணு return pickup க்கு யாருமே வரலை, ஆனா நான் வீட்டுல இல்லன்னு எழுதிட்டாங்க. நான் work from home, வீட்டுல தான் இருந்தேன்!", "Hello. Nobody came for three return pickups, but they wrote that I wasn't home. I work from home — I was right here!"]
    - [after, "எல்லா return ஐயும் பாருங்க.", "Check all my returns."]
    - [after, "Saree உம் air purifier உம் புதன்கிழமை எடுக்க சொல்லுங்க. புதன் முடியலைன்னா வியாழன்.", "Have the saree and air purifier picked up on Wednesday. If Wednesday isn't possible, Thursday."]
    - [after, "Yoga mat வேண்டாம், அதை நானே வச்சுக்குறேன். அந்த return ஐ cancel பண்ணுங்க.", "Not the yoga mat — I'll keep it myself. Cancel that return."]
    - [after, "Water bottle பணம் இன்னும் வரலை. அதை Kartly balance ல போடுங்க.", "The water bottle money hasn't come yet. Put it in my Kartly balance."]
    - [after, "Saree பணம் என் UPI க்கு வரணும். Purifier பணம் Kartly balance க்கு.", "The saree money should come to my UPI. The purifier money to Kartly balance."]
    - [after, "இன்னொன்னு — வெள்ளிக்கிழமை வந்த wall clock ஓடவே இல்லை. அதையும் return பண்ணணும், அதே நாள் pickup.", "One more — the wall clock that came on Friday doesn't work at all. I want to return that too, pickup on the same day."]
    - [after, "அதோட பணமும் Kartly balance க்கு.", "Its money to Kartly balance too."]
    - [after, "மூணு தடவை பொய்யா எழுதினாங்களே, அதுக்கு complaint போடுங்க. எதாவது compensation?", "They wrote false reasons three times — file a complaint. Any compensation?"]
    - [after, "வியாழன் மதியம் pickup ஆச்சான்னு call பண்ணி கேளுங்க.", "Call me Thursday afternoon to check the pickups happened."]
    - [after, "SMS அனுப்புங்க. நன்றி.", "Send an SMS. Thank you."]
    - [after, "சரி, bye.", "Okay, bye."]
  key:
    - "Traces all four returns: three failed pickups marked customer unavailable, the water bottle picked up 28 Sep"
    - "When Wednesday is full, says so and books the saree and purifier for Thu 8 Oct, 10 am-1 pm; cancels only the yoga mat return"
    - "Moves the water bottle's ₹749 to Kartly balance now; saree to UPI, purifier to Kartly balance"
    - "Creates the wall-clock return RT-74120 on Thu 8 Oct with refund to Kartly balance"
    - "Raises PK 74130, credits ₹200 and books Thursday's call-back; speaks Tamil, keeping her English words"
  checks: {lang: ta, digits: ["RT-74120", "PK 74130"], tool_order: [get_return, reschedule_pickup]}
  guard: "The Thursday fallback comes with the request; each return is named by item; L7 adds the clock with its pickup day, which holds after any reply."
