# VR-ADS-03 - One campaign across Indian markets
# BLOCKED - AND NOW EVIDENCED, not assumed (probed 2026-09-03).
#   The blocker is NOT "we need a multilingual ASR". We have one, it is
#   multilingual, and it still cannot measure this. Both arms generated this
#   script and the shipped recogniser was run over the audio three ways:
#
#     language="hi"   transliterated EVERYTHING into Devanagari, including
#                     the English -  "please collect from counter two" came
#                     back as "प्लीस कलेक्ट फरम काूंटर टू".
#     language="en"   TRANSLATED rather than transcribed - "Aapka order ready
#                     hai" became "Your order is ready."
#     auto-detect     detected Hindi, same as the first.
#
#   The reference is romanized Hinglish. Devanagari scores ~100% WER against
#   it however well the model spoke, and a translation is not a transcript.
#   There is no configuration that preserves the code-switch, so per-segment
#   WER cannot be computed - and a whole-clip WER here would measure the
#   recogniser's script choice, not either model.
#
# NEEDS: a recogniser that transcribes code-switched speech VERBATIM, in the
#   script it was written in, without transliterating or translating. Google's
#   USM/Chirp does this - but it is Google, and this comparison has a Google
#   arm, which is the vendor overlap that already changed one answer here.
#   A neutral code-switch ASR, or native-speaker transcription, is the
#   honest unblock. Native review was always part of this scenario anyway.
#
# WORTH KNOWING, though it is not a measurement: under the translating mode
#   Gemini rendered "6 baje" as "6 pm" and ElevenLabs as "7 o'clock" - one of
#   them changed the number. That is a real difference and it is NOT reported
#   as a result, because it arrived through an instrument that was translating.
#   Same blocker as vr-ecom-05, probed on that scenario's audio.
#
# REAL APPLICATION. Indian campaigns run across language markets with the
# brand name held constant; regional-language capability is a stated
# differentiator among Indian voice vendors.
#   Source: SquadStack and Indian voice-agent market comparisons, 2026.
# CLAIM IF IT PASSES: "One brand voice across every Indian market, with local
#   numbering and your brand name intact."
id: vr-ads-03
modality: voice
task: styled_tts
title: "One campaign line across Indian markets - Ads"
input:
  script: |
    This Diwali, bring home a Voltas Beko refrigerator for just Rs 4,99,999 across all Croma stores. Voltas Beko. Croma. Offer ends Sunday.
  language: en-IN
  style: "festive retail campaign read, warm and celebratory"
params: {voice: female_mid_warm, format: wav, sample_rate: 24000, speed: 1.0}
expected: |
  1) Rs 4,99,999 in the Indian system - four lakh ninety nine thousand
  2) "Voltas Beko" and "Croma" intact and unchanged in every language
  3) The same brand voice identity in Hindi, Tamil and English
  4) A native listener in each market accepts it as locally produced
checks:
  duration_s: {min: 6.0, max: 26.0}
  max_silence_s: 1.0
  no_clipping: true
  max_wer: 0.10
  must_say: ["lakh"]
  must_not_say: ["four hundred ninety nine thousand", "four hundred and ninety nine thousand"]
tags: [ads, india, multilingual, indian-numbering, blocked, vr-ads-03]
