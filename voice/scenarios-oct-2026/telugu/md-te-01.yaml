id: md-te-01
modality: voice
task: styled_tts
title: "Apology to mother — Telugu script - Telugu"

input:
  script: |
    అమ్మా, నేను అన్నదంతా తప్పే. I was angry, I didn't mean it. నన్ను క్షమించు.
  language: te-IN
  style: "soft, apologetic, hopeful"

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Telugu segments pronounced correctly (judge)

checks:
  duration_s: {min: 2.6, max: 15.4}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

