# bank-te-05 - Home-loan EMI — Telugu mixed script — mixed script (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-te-05: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-te-05
# LANGUAGE. Telugu (Mixed script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Loans & EMI - EMI reminders, approvals, prepayment, gold loans, collections.
# TARGET CUSTOMER. Retail Banks, NBFCs & Lenders.
# WHAT THIS TESTS. A raw amount and a Telugu date phrase, Telugu in both scripts — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: amounts, dates/times; Pronunciation: brands, acronyms.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-te-05
modality: voice
task: text_to_speech
title: "Home-loan EMI — Telugu mixed script — mixed script - Telugu"

input:
  script: |
    మీ SBI home loan EMI ₹41,250, prathi nela పదో తేదీన auto-debit avutundi. Balance సరిపడా unchandi.
  language: te-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) Amount recoverable
  2) Date recoverable
  3) "EMI" as letters
  4) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  5) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  # Minimum lowered from 6.0 s on 2026-10-10 (round 1), before running: a
  # complete read of a short line can come in under 6 s. Now 0.2 s a word,
  # as in the drama scenarios (a read faster than 5 words a second is too short).
  duration_s: {min: 3.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, telugu, banking-financial-services, loans-emi, hard, gemini-lean, v2-bank]
