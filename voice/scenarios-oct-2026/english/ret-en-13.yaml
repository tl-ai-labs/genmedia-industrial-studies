# ret-en-13 - Two packages, two couriers, two tracking codes (Ecommerce & Retail)
#
# SOURCE. New English scenario written for this run, modelled on v2 ret-hi-18 (https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-18): same industry, use case, speaker, tests and difficulty.
# LANGUAGE. English (Indian English). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Order confirmation & tracking - order IDs, AWBs, couriers, delays.
# TARGET CUSTOMER. E-commerce Marketplaces, Logistics & Courier Companies.
# SPEECH SKILLS. Numbers: codes; Pronunciation: brands, acronyms.
# PICKED AS. Even contest.

id: ret-en-13
modality: voice
task: text_to_speech
title: "Two packages, two couriers, two tracking codes - English"

input:
  script: |
    You have two packages. The first is with Ekart, tracking FMPC09114. The second is with Blue Dart, AWB 660231458. Both will arrive by tomorrow evening.
  language: en-IN

params:
  voice: female_young
  format: wav
  sample_rate: 24000

expected: |
  1) "FMPC09114" recoverable character for character
  2) AWB "660231458" recoverable
  3) The two codes clearly separated

checks:
  duration_s: {min: 5.0, max: 26.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  max_wer: 0.05

tags: [oct-2026, english, ecommerce-retail, order-confirmation-tracking, hard, even-contest, new-english]
