# hlt-hi-07 - Schedule H1 drug — prescription required (Healthcare & pharma)
#
# SOURCE. v2 text-to-speech bank, scenario hlt-hi-07: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/hlt-hi-07
# LANGUAGE. Hindi (Native script). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Pharmacy - medicine names, strengths, dosing, refills.
# TARGET CUSTOMER. Online Pharmacies.
# WHAT THIS TESTS. A drug name with a decimal strength and a regulatory schedule code, in Devanagari
# SPEECH SKILLS. Numbers: units/%; Pronunciation: brands.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: hlt-hi-07
modality: voice
task: text_to_speech
title: "Schedule H1 drug — prescription required - Hindi"

input:
  script: |
    यह दवा, Clonazepam 0.5 mg, Schedule H1 में आती है, इसलिए order के लिए doctor का valid prescription upload करना ज़रूरी है।
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) "Clonazepam" recoverable
  2) "0.5 mg" read as "point five M G"
  3) "H1" read as "H one"

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, healthcare-pharma, pharmacy, medium, even-contest, v2-bank]
