# md-hi-21 - First crush — excited and unsure (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-21: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-21
# LANGUAGE. Hindi (Native script). DIFFICULTY. Medium. SETTING. Serialised drama.
# USE CASE. Romance & coming-of-age.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms, Audiobook Platforms.
# WHAT THIS TESTS. Excited teenage chatter with self-doubt, across the switch
# SPEECH SKILLS. Emotion.
# PICKED AS. Gemini-lean - delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-21
modality: voice
task: styled_tts
title: "First crush — excited and unsure - Hindi"

input:
  script: |
    पता है, आज Riya ने मुझसे मेरा notebook माँगा... और उसने smile भी किया! Bro, I think she likes me. या फिर उसे बस notes चाहिए थे?
  language: hi-IN
  style: "excited, giddy, then unsure"

params:
  voice: male_teen
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) Sounds like a teenager (judge)
  5) The turn to self-doubt lands (judge)

checks:
  duration_s: {min: 5.4, max: 27.8}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hindi, micro-drama-entertainment, romance-coming-of-age, medium, gemini-lean, v2-bank]
