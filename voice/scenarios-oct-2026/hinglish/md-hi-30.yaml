# md-hi-30 - Startup pitch, confident hustle (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-30: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-30
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Serialised drama.
# USE CASE. Corporate / business.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms, Audiobook Platforms.
# WHAT THIS TESTS. A large number (lakh) delivered inside a confident, fast-paced pitch register
# SPEECH SKILLS. Numbers: amounts, dates/times; Emotion.
# PICKED AS. Gemini-lean - lakh / crore amounts (ElevenLabs garbled these in Sept); delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-30
modality: voice
task: styled_tts
title: "Startup pitch, confident hustle - Hinglish"

input:
  script: |
    Investors, hamara product already do lakh users tak pahunch chuka hai, sirf teen mahine mein — aur yeh sirf shuruaat hai. Give us the funding, and we'll show you real scale.
  language: hi-IN
  style: "confident, energetic pitch delivery"

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) One continuous prosody; the emotion does not reset at the language switch

checks:
  duration_s: {min: 6.2, max: 31.3}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, micro-drama-entertainment, corporate-business, medium, gemini-lean, v2-bank]
