# bank-hi-12 - RTGS cut-off time, two bank brands, lakh amount (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-hi-12: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-hi-12
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Payments & transfers - UPI ID, IFSC, NEFT/IMPS/RTGS, cheques.
# TARGET CUSTOMER. Retail Banks, Payment Apps.
# WHAT THIS TESTS. A clock time, two bank brand names (one an acronym-led brand) and a raw lakh numeral stacked in one Hinglish sentence
# SPEECH SKILLS. Numbers: amounts, dates/times; Pronunciation: brands, acronyms.
# PICKED AS. Gemini-lean - lakh / crore amounts (ElevenLabs garbled these in Sept); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-hi-12
modality: voice
task: text_to_speech
title: "RTGS cut-off time, two bank brands, lakh amount - Hinglish"

input:
  script: |
    Aaj ka RTGS cut-off time shaam saadhe paanch baje hai. Axis Bank se IDFC FIRST Bank mein Rs 3,40,000 bhejne ke liye, please uske pehle request submit kar dijiye.
  language: hi-IN

params:
  voice: female_mid
  format: wav
  sample_rate: 24000

expected: |
  1) Amount spoken in the Indian system (lakh/crore), not the international convention — the numeral was sent as-written, the model decides how to say it
  2) "IDFC FIRST" read with IDFC as letters and FIRST as a word (judge)
  3) "saadhe paanch baje" recoverable
  4) "RTGS" as individual letters

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false
  # Expected item: the lakh reading. Added 2026-10-09 so it is checked, as
  # in English; listed in both writing systems because the transcript of a
  # Hinglish read comes back in Roman letters or in Devanagari.
  must_say_any:
    - ["lakh", "लाख"]
  must_not_say:
    - "three hundred forty thousand"

tags: [oct-2026, hinglish, banking-financial-services, payments-transfers, hard, gemini-lean, v2-bank]
