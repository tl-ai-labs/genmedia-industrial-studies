# md-hi-23 - Antagonist monologue (Micro-drama & entertainment)
#
# SOURCE. v2 text-to-speech bank, scenario md-hi-23: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/md-hi-23
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Hard. SETTING. Serialised drama.
# USE CASE. Thriller / crime.
# TARGET CUSTOMER. Audio Series & Micro-drama Platforms, Audiobook Platforms.
# WHAT THIS TESTS. A calm, menacing register that must not soften or brighten at the English clause
# SPEECH SKILLS. Emotion.
# PICKED AS. Even contest - delivery directions to follow (Gemini held pace and tone); Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: md-hi-23
modality: voice
task: styled_tts
title: "Antagonist monologue - Hinglish"

input:
  script: |
    Tumhe laga tumne jeet liya? Yeh toh sirf shuruaat hai — the real game hasn't even started yet, aur is baar main haarunga nahi.
  language: hi-IN
  style: "calm, menacing, controlled dark intensity"

params:
  voice: male_older
  format: wav
  sample_rate: 24000

expected: |
  1) Full text read across both languages, nothing dropped
  2) The code-switch stays native under the target emotion — no register break (judge)
  3) Hindi segments pronounced correctly (judge)
  4) One continuous prosody; the emotion does not reset at the language switch

checks:
  duration_s: {min: 4.8, max: 25.1}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, micro-drama-entertainment, thriller-crime, hard, even-contest, v2-bank]
