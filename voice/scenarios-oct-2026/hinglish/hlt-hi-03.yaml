# hlt-hi-03 - OPD appointment rescheduled — mixed script (Healthcare & pharma)
#
# SOURCE. v2 text-to-speech bank, scenario hlt-hi-03: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/hlt-hi-03
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Easy. SETTING. Call centre.
# USE CASE. Appointments & teleconsults.
# TARGET CUSTOMER. Hospital Chains, Telehealth Platforms.
# WHAT THIS TESTS. A doctor name, an acronym (OPD) and a time in a short Devanagari passage — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: dates/times; Pronunciation: names, acronyms.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: hlt-hi-03
modality: voice
task: text_to_speech
title: "OPD appointment rescheduled — mixed script - Hinglish"

input:
  script: |
    माफ़ कीजिए, Dr. Aggarwal aaj OPD में nahi हैं। आपका appointment कल dopahar 3 बजे shift kar diya गया है।
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) "OPD" as letters
  2) "तीन बजे" recoverable
  3) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  4) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, healthcare-pharma, appointments-teleconsults, easy, even-contest, v2-bank]
