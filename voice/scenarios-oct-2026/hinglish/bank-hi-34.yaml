# bank-hi-34 - Insurance premium due reminder (Banking & financial services)
#
# SOURCE. v2 text-to-speech bank, scenario bank-hi-34: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/bank-hi-34
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Deposits, wealth & insurance - FD, SIP, policies, health claims, RM callbacks.
# TARGET CUSTOMER. Insurers, Investment & Wealth Platforms.
# WHAT THIS TESTS. A financial-brand name plus a currency amount and a date, stacked in one sentence
# SPEECH SKILLS. Numbers: amounts, dates/times; Pronunciation: brands, acronyms.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: bank-hi-34
modality: voice
task: text_to_speech
title: "Insurance premium due reminder - Hinglish"

input:
  script: |
    Aapki LIC policy ka premium, aath hazaar do sau pachaas rupaye, is mahine ki bais tareek tak due hai.
  language: hi-IN

params:
  voice: female_older
  format: wav
  sample_rate: 24000

expected: |
  1) Amount stated in the Indian numbering system, not the international convention
  2) Date/validity phrase ("bais tareek") recoverable exactly
  3) English domain terms (EMI/due/auto-debit etc.) stay intelligible inside the Hindi sentence
  4) Calm, unhurried call-centre pace, every digit distinct

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, banking-financial-services, deposits-wealth-insurance, medium, gemini-lean, v2-bank]
