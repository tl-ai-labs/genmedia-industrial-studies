# ret-hi-15 - Shipment left hub — 12-digit AWB and two cities — mixed script (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-15: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-15
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Hard. SETTING. Call centre.
# USE CASE. Order confirmation & tracking - order IDs, AWBs, couriers, delays.
# TARGET CUSTOMER. E-commerce Marketplaces, Logistics & Courier Companies.
# WHAT THIS TESTS. A courier brand, a hub town, a 12-digit AWB and a destination city in one passage — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: codes; Pronunciation: names, brands, acronyms.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-15
modality: voice
task: text_to_speech
title: "Shipment left hub — 12-digit AWB and two cities — mixed script - Hinglish"

input:
  script: |
    आपका shipment Delhivery ke Bhiwandi hub से nikal chuka है। AWB number hai one, four, three, four, four, zero, nine, eight, seven, six, two, two, और yeh कल तक Indore pahunch jaayega।
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) AWB "143440987622" recoverable digit-for-digit
  2) "Delhivery", "Bhiwandi", "Indore" natural (judge)
  3) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  4) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, ecommerce-retail, order-confirmation-tracking, hard, even-contest, v2-bank]
