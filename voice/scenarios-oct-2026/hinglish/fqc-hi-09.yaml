# fqc-hi-09 - Diwali greeting with festive coupon (Food & quick commerce)
#
# SOURCE. v2 text-to-speech bank, scenario fqc-hi-09: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/fqc-hi-09
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Refunds & coupons.
# TARGET CUSTOMER. Food Delivery Apps.
# WHAT THIS TESTS. A warm, celebratory register carrying a letter/digit coupon code, a percentage and two sweet-shop brands
# SPEECH SKILLS. Numbers: units/%; Pronunciation: brands; Emotion.
# PICKED AS. Even contest - Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: fqc-hi-09
modality: voice
task: text_to_speech
title: "Diwali greeting with festive coupon - Hinglish"

input:
  script: |
    Happy Diwali! Aapke liye Swiggy ki taraf se ek special gift — code D, I, W, A, L, I, two, five se Haldiram's aur Bikanervala ki mithai par 25% off!
  language: hi-IN

params:
  voice: female_young
  format: wav
  sample_rate: 24000

expected: |
  1) Warm festive energy (judge)
  2) "DIWALI25" recoverable character-for-character
  3) "Haldiram's", "Bikanervala" natural

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, food-quick-commerce, refunds-coupons, medium, even-contest, v2-bank]
