# ret-hi-38 - NeuCoins expiring — partner brands (Ecommerce & Retail)
#
# SOURCE. v2 text-to-speech bank, scenario ret-hi-38: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/ret-hi-38
# LANGUAGE. Hinglish (Romanised). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Loyalty & subscriptions - SuperCoins, Prime, tiers, NeuCoins.
# TARGET CUSTOMER. E-commerce Marketplaces.
# WHAT THIS TESTS. A raw amount, a date phrase and two partner brands in a Hinglish sentence
# SPEECH SKILLS. Numbers: amounts, dates/times; Pronunciation: brands.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: ret-hi-38
modality: voice
task: text_to_speech
title: "NeuCoins expiring — partner brands - Hinglish"

input:
  script: |
    Aapke Tata Neu account mein Rs 1,280 ke NeuCoins is mahine ki athaais tareek ko expire ho jaayenge. Inhe BigBasket ya Croma par use kar lijiye.
  language: hi-IN

params:
  voice: female_young
  format: wav
  sample_rate: 24000

expected: |
  1) Amount recoverable
  2) Date "athaais tareek" recoverable
  3) "NeuCoins", "BigBasket", "Croma" natural

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, ecommerce-retail, loyalty-subscriptions, medium, gemini-lean, v2-bank]
