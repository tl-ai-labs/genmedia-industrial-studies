# fqc-hi-10 - Missing item — wallet refund — mixed script (Food & quick commerce)
#
# SOURCE. v2 text-to-speech bank, scenario fqc-hi-10: https://studies.adlc.tilicho.in/studies/genmedia-model-comparison/meta/product-view/scenario-bank/v2/voice/fqc-hi-10
# LANGUAGE. Hinglish (Mixed script). DIFFICULTY. Medium. SETTING. Call centre.
# USE CASE. Refunds & coupons.
# TARGET CUSTOMER. Food Delivery Apps.
# WHAT THIS TESTS. A dish name, a raw amount and a wallet brand, Hindi in both scripts — the local language written in both native script and Latin letters in one prompt
# SPEECH SKILLS. Numbers: amounts; Pronunciation: brands; Emotion.
# PICKED AS. Gemini-lean - rupee amounts; Hindi–English code-switch.
#
# TRANSCRIPT NOT SCORED (asr_scored: false). Whisper writes Hindi and Telugu
# audio in their own scripts, so this script and the transcript are in
# different writing systems; a WER here would measure the recogniser's
# spelling. The transcript is kept as evidence. Accuracy comes from the
# checklist below, judged by listeners and the judge.

id: fqc-hi-10
modality: voice
task: text_to_speech
title: "Missing item — wallet refund — mixed script - Hinglish"

input:
  script: |
    Sorry! आपके Zomato order mein raita missing था। ₹49 का refund आपके Zomato wallet mein aa गया है।
  language: hi-IN

params:
  voice: male_young
  format: wav
  sample_rate: 24000

expected: |
  1) Amount "उनचास" recoverable
  2) Apologetic, light register
  3) Words written in Latin letters but belonging to the local language are pronounced as that language, not read as English spellings (judge)
  4) No seam, accent change or pause where the script switches mid-sentence (judge)

checks:
  duration_s: {min: 6.0, max: 30.0}
  max_silence_s: 2.5
  no_clipping: true
  measure_ttfa: true
  asr_scored: false

tags: [oct-2026, hinglish, food-quick-commerce, refunds-coupons, medium, gemini-lean, v2-bank]
