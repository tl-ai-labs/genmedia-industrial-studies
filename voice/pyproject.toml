[project]
name = "genmedia-eval"
version = "0.2.0"
description = "GenMedia model comparison — image and voice lanes on one local runner (plan v1.2)"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "numpy>=1.26",
  "soundfile>=0.12",
  "jiwer>=3.0",
  "num2words>=0.5",
  # The default ASR. A CORE dependency, not an extra, because the transcript
  # it produces is what every WER number and every phrase gate is measured
  # against - a fresh clone that cannot transcribe cannot measure anything.
  # It is heavier than the rest combined; the offline test suite never
  # imports it (the backend loads the model lazily), so `pytest` stays fast.
  "faster-whisper>=1.0",
]

[project.optional-dependencies]
# Provider SDKs are optional so the offline test suite installs in seconds and
# a lane you are not running never forces a dependency you do not have.
openai = ["openai>=1.40"]
google = ["google-genai>=0.3"]
# A real DNSMOS/NISQA ONNX predictor. Absent, the audio_quality criterion
# falls back to the signal-metric predictor and SAYS SO in the report.
mos = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
