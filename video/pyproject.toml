[project]
name = "genmedia-eval-video"
version = "0.1.0"
description = "GenMedia model comparison — video evaluation runner (sibling of ../image)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "pillow>=10.3",          # judge-side image stripping + report thumbnails only
    "openpyxl>=3.1",
    "google-genai>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["runner", "runner.adapters", "runner.video"]

[tool.setuptools.package-data]
runner = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
