# Character continuity in motion — Film, OTT & micro-drama scenarios. Slots: vchr.yaml.
code: VCHR
scenarios:

- id: VCHR-FLM-07
  seed: true
  title: "Three siblings in three clips together; faces never borrow from each other as they move"
  persona: "Showrunner of a Lucknow family drama making motion tests of the three leads from their casting photo."
  evidence: "Earlier bank IMG-GAME-12 (three references, zero blending) was high tier for stills; in motion, faces that turn and cross each other blend more."
  levers: [set, identity, count, layout, locale, continuity]
  inputs:
    - {source: SRC-VREF-SIBLINGS, role: character, note: "the three siblings, left to right: eldest, sister, youngest"}
  prompt: |
    This casting photo shows three siblings: the eldest, a heavy-set man of forty-five with a full grey
    beard in a white kurta and black Nehru jacket; the sister, forty, tall and thin with a short bob and
    round gold glasses in a mustard saree; the youngest, thirty, clean-shaven with curly hair, a denim
    shirt and a silver chain. Make one clip of the three together, as described below, cinematic, warm
    natural colour. Each keeps their own face, build and look as they move, turn and pass each other;
    no feature passes from one face to another, and the eldest's beard and the sister's glasses never
    vanish or move to another face. 16:9, no text, no one else in focus.
  clip: {duration: 6, aspect: "16:9", camera: "per clip as described"}
  set_members:
    mode: separate
    must_stay_same:
      - "Three faces exactly as in the photo"
      - "Beard on the eldest, glasses on the sister, chain on the youngest"
      - "Their clothes and builds"
    members:
      - {name: "The courtyard argument", prompt: "Afternoon in an old Lucknow courtyard. The eldest and the youngest argue face to face, circling each other; the sister steps between them. Handheld, medium wide.", checks: [[prompt_adherence, "Are all three in the clip?"], [reference_fidelity, "Do the eldest and youngest keep distinct faces as they circle?"]]}
      - {name: "The rooftop", prompt: "Dusk on a rooftop with kites in the sky. The sister and the youngest sit on the parapet; the eldest walks into frame behind them and puts a hand on each shoulder. Slow push in.", checks: [[prompt_adherence, "Does the eldest stand behind the other two at the end?"], [set_consistency, "Are the glasses on the sister throughout?"]]}
      - {name: "The dinner", prompt: "Night, at a dining table lit by a warm pendant lamp. The three sit side by side, eldest, sister, youngest, left to right, passing a dish of kebabs from right to left.", checks: [[prompt_adherence, "Are they seated in the order eldest, sister, youngest from left?"], [motion_coherence, "Does the dish pass right to left from hand to hand?"]]}
  deliverable: "Three 6-second clips, 16:9."
  checks:
    - [set_consistency, "Is each sibling the person in the photo in every clip?"]
    - [set_consistency, "Do the three faces stay distinct throughout, with no blending?"]
    - [set_consistency, "Is the grey beard on the eldest only, in every clip?"]
    - [set_consistency, "Are the round gold glasses on the sister only, in every clip?"]
    - [set_consistency, "Is the silver chain on the youngest in every clip where visible?"]
    - [set_consistency, "Are clothes the same in all three clips?"]
    - [temporal_consistency, "Do faces stay stable as heads turn, with no morphing?"]
    - [motion_coherence, "Are movements natural: circling, walking, passing a dish?"]
    - [prompt_adherence, "Are exactly three people in focus in each clip?"]
    - [prompt_adherence, "Does each clip have its described light?"]
    - [prompt_adherence, "Do the settings read as Lucknow?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are hands natural, especially passing the dish?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: partly, note: "Each clip is one image-to-video call with the casting photo as a character reference; whole-set identity needs the set review."}

- id: VCHR-FLM-01
  title: "The lead in three action clips: sprinting through rain, a fight at an autorickshaw stand, dancing at a baraat"
  persona: "Casting director making motion tests of the lead actor before the producer signs off."
  evidence: "Earlier image bank CHR-FLM-01 held the face in stills; fast action makes faces morph mid-clip."
  levers: [set, identity, physics, locale, light-lock]
  inputs: [{source: SRC-ACTOR-M, role: character}]
  prompt: |
    The image is the lead actor: about thirty-four, medium-brown skin, short wavy hair parted on his
    left, a thick black moustache, light stubble, a small pale scar cutting through his RIGHT eyebrow, a
    white shirt with sleeves rolled and a steel kada on his RIGHT wrist. Make three 5-second clips of him
    in fast action, cinematic, each in its own light. His face does not change mid-clip however fast he
    moves or turns: the scar stays on the right eyebrow, the kada on the right wrist. 2.39:1, no text.
  clip: {duration: 5, aspect: "2.39:1", camera: "per clip as described"}
  set_members:
    mode: separate
    must_stay_same:
      - "His face, moustache and the scar through the right eyebrow"
      - "Steel kada on the right wrist"
      - "White shirt with rolled sleeves"
    members:
      - {name: "Rain sprint", prompt: "Night, neon-lit Mumbai street in heavy rain: he sprints towards the camera, which backs away, shirt soaked.", checks: [[physics_plausibility, "Is the shirt soaked and clinging?"], [motion_coherence, "Is the sprint natural?"]]}
      - {name: "Auto-stand fight", prompt: "Dusk at an autorickshaw stand: he blocks a punch and shoves an attacker against a yellow-green auto, handheld.", checks: [[reference_fidelity, "Is the kada on his right wrist?"], [physics_plausibility, "Does the auto rock with the impact?"]]}
      - {name: "Baraat dance", prompt: "Night baraat on a street lit by tube-light chandeliers carried on heads: he dances with arms up in the middle of the crowd.", checks: [[reference_fidelity, "Is the scar on his right eyebrow?"], [motion_coherence, "Is the dancing natural?"]]}
  deliverable: "Three 5-second clips, 2.39:1."
  checks:
    - [set_consistency, "Is it the actor in the photo in all three?"]
    - [temporal_consistency, "Does his face stay stable mid-clip, with no morphing?"]
    - [set_consistency, "Is the scar on the right eyebrow in every clip?"]
    - [set_consistency, "Is the kada on the right wrist in every clip?"]
    - [set_consistency, "Is the shirt the same in all three?"]
    - [prompt_adherence, "Does each clip have its own described light?"]
    - [set_consistency, "Does his skin tone stay the same across the lights?"]
    - [physics_plausibility, "Do rain and impacts behave believably?"]
    - [prompt_adherence, "Do the settings read as Indian?"]
    - [prompt_adherence, "Is he clearly the subject in each clip?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are hands natural?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: partly, note: "Three image-to-video calls with one character reference; identity across clips needs the set review."}

- id: VCHR-FLM-02
  title: "The headphone man in three clips: metro, hospital corridor, dawn beach; headphones and shirt held through movement"
  persona: "Director of a short film placing the protagonist from the key art into three new scenes."
  evidence: "Earlier image bank CHR-FLM-07: props like headphones vanish or change once the head turns."
  levers: [set, identity, unseen, light-lock, camera]
  inputs: [{source: SRC-CROSSWALK, role: character, note: "the man on the crossing"}]
  prompt: |
    The man in this photo stands on a zebra crossing: about thirty, a mustard-yellow short-sleeved
    camp-collar shirt, dark jeans and black over-ear headphones. Make three 5-second clips of him in new
    places, each with its own light. The headphones stay on his head, over his ears, in every clip, and
    turn with his head; the shirt keeps its colour and collar. His back, never shown, is plain mustard with no print. His
    hair, short and black, stays the same length and parting throughout. Cinematic grade, natural motion.
    No text, nobody else in focus.
  clip: {duration: 5, aspect: "16:9", camera: "per clip as described"}
  set_members:
    mode: separate
    must_stay_same:
      - "His face and build"
      - "Black over-ear headphones over his ears"
      - "Mustard camp-collar shirt and dark jeans"
    members:
      - {name: "Metro", prompt: "Night, a near-empty metro carriage: he stands holding a strap, swaying as the train brakes, then turns to look out of the window.", checks: [[physics_plausibility, "Does he sway believably as the train brakes?"], [reference_fidelity, "Do the headphones turn with his head?"]]}
      - {name: "Hospital corridor", prompt: "Cold fluorescent hospital corridor: he walks away from camera, then stops and turns back.", checks: [[reference_fidelity, "Is his back plain mustard?"], [prompt_adherence, "Is the light cold fluorescent?"]]}
      - {name: "Dawn beach", prompt: "Dawn on an empty beach: he walks along the waterline towards camera, wind in his shirt, lifting the headphones off and around his neck at the end.", checks: [[physics_plausibility, "Does the wind move the shirt?"], [motion_coherence, "Does he lift the headphones naturally?"]]}
  deliverable: "Three 5-second clips, 16:9."
  checks:
    - [set_consistency, "Is it the man from the photo in all three?"]
    - [set_consistency, "Are the headphones the same black over-ear pair in all three?"]
    - [set_consistency, "Is the shirt mustard with a camp collar in all three?"]
    - [motion_coherence, "Do the headphones stay on his ears as he turns, until lifted?"]
    - [prompt_adherence, "Does each clip have its own described light?"]
    - [prompt_adherence, "Does each clip's framing match its description?"]
    - [motion_coherence, "Is his movement natural?"]
    - [physics_plausibility, "Is the train sway believable?"]
    - [prompt_adherence, "Is he the only person in focus?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Is his face free of artefacts?"]
    - [set_consistency, "Does his skin tone hold across the lights?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: partly, note: "Three image-to-video calls with one reference; set agreement needs the set review."}

- id: VCHR-FLM-03
  title: "The astronaut in three clips deeper in the forest; band and device stay on the left arm while moving"
  persona: "Director of the sci-fi short extending the forest sequence with new shots."
  evidence: "Earlier image bank CHR-FLM-08: arm-side details flip when the figure turns."
  levers: [set, identity, layout, light-lock, physics]
  inputs: [{source: SRC-ASTRO-FOREST, role: character}]
  prompt: |
    The astronaut in this still wears a bulky white suit with ONE orange band round the upper LEFT arm, a
    grey life-support pack, a small rectangular device with a green screen strapped to the LEFT forearm,
    and a gold-tinted visor. Make three 5-second clips deeper in the same glowing forest: tall dark trunks
    with teal veins, glowing moss, floating spores. The band and the device stay on the left arm as the
    astronaut walks, kneels and turns. Teal and black, film grain, no text.
  clip: {duration: 5, aspect: "2.39:1", camera: "per clip as described"}
  set_members:
    mode: separate
    must_stay_same:
      - "Orange band on the upper left arm"
      - "Device with green screen on the left forearm"
      - "Gold visor, white suit, grey pack"
    members:
      - {name: "Walk", prompt: "Side tracking shot as the astronaut walks left to right between trunks, left arm towards camera.", checks: [[prompt_adherence, "Is the band on the arm towards camera, the left?"], [motion_coherence, "Is the walk heavy and believable in the suit?"]]}
      - {name: "Kneel", prompt: "Medium shot from the front: the astronaut kneels and touches the glowing moss with the right glove; the moss brightens under it.", checks: [[prompt_adherence, "Is the device on the left forearm, away from the touching hand?"], [prompt_adherence, "Does the moss brighten under the glove?"]]}
      - {name: "Turn", prompt: "From behind, the astronaut turns a full circle slowly, looking up at the canopy.", checks: [[prompt_adherence, "Does the band stay on the left arm through the turn?"], [physics_plausibility, "Do spores drift around the turning figure?"]]}
  deliverable: "Three 5-second clips, 2.39:1."
  checks:
    - [set_consistency, "Is the orange band on the upper left arm in every clip?"]
    - [set_consistency, "Is the device on the left forearm in every clip?"]
    - [prompt_adherence, "Is there only one orange band?"]
    - [set_consistency, "Is the suit the same in all three?"]
    - [set_consistency, "Is the forest the same as the still?"]
    - [prompt_adherence, "Is the teal glow consistent across clips?"]
    - [temporal_consistency, "Is there no morphing of the suit as it moves?"]
    - [physics_plausibility, "Is the suit's weight believable?"]
    - [prompt_adherence, "Does each clip match its framing?"]
    - [style, "Is there film grain in all three?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are the gloves clean?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: partly, note: "Three image-to-video calls with one reference; set agreement needs the set review."}

- id: VCHR-FLM-04
  title: "Three performance clips of the wanderer: grief building, anger breaking, release; identity held through the acting"
  persona: "Director testing whether a generated performance can carry a scene for the beat-sheet short."
  evidence: "Strong expressions pull faces off model; the beard and weathering must hold through the acting."
  levers: [set, identity, timing, light-lock, camera]
  inputs: [{source: SRC-RIDGE-WANDERER, role: character}]
  prompt: |
    The man in this still is in his late fifties with a short grey beard, a weathered face, a dark
    charcoal coat and a rust scarf. Make three 6-second performance clips in close-up on the same fog-
    filled ridge at dawn, the light pale gold from the left. In each he goes through one emotion over the
    clip, with real acting: small, building, not mugging. His face, beard and the lines of his face stay
    his through every expression. Muted grade, fine grain, no text.
  clip: {duration: 6, aspect: "2.39:1", camera: "close-up, slow push in"}
  set_members:
    mode: separate
    must_stay_same:
      - "His face, beard and weathering"
      - "Coat collar and rust scarf"
      - "Pale gold light from the left"
    members:
      - {name: "Grief", prompt: "He looks down at the radio; his jaw trembles and his eyes fill, building to a single tear by 5 seconds.", checks: [[prompt_adherence, "Does the tear fall at about 5 seconds?"], [set_consistency, "Is it the same face through the grief?"]]}
      - {name: "Anger", prompt: "He stares out, breath fast; at 3 seconds he shouts once into the valley, veins on his neck.", checks: [[prompt_adherence, "Does he shout at about 3 seconds?"], [motion_coherence, "Is the shout natural, with no face distortion?"]]}
      - {name: "Release", prompt: "He closes his eyes, breathes out slowly, and a small smile comes.", checks: [[motion_coherence, "Is the release subtle and natural?"], [reference_fidelity, "Is the beard unchanged?"]]}
  deliverable: "Three 6-second clips, 2.39:1."
  checks:
    - [set_consistency, "Is it the man in the still in all three?"]
    - [motion_coherence, "Does his face stay on model through every expression?"]
    - [set_consistency, "Is the beard the same in all three?"]
    - [set_consistency, "Are the coat and scarf the same in all three?"]
    - [prompt_adherence, "Is the light pale gold from the left in all three?"]
    - [prompt_adherence, "Is each emotion readable and building, not mugging?"]
    - [prompt_adherence, "Do the timed moments land?"]
    - [prompt_adherence, "Is each a close-up with a slow push in?"]
    - [style, "Is the grade muted with fine grain?"]
    - [prompt_adherence, "Is he alone?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are eyes and teeth natural?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: partly, note: "Three image-to-video calls with one reference; set agreement needs the set review."}

