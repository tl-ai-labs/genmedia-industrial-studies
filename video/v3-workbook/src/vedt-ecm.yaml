- id: VEDT-ECM-09
  title: "Change two prices on the moving shelf tags; the other tags' text untouched"
  persona: "Retail chain's marketing editor updating a promo video after a price change."
  evidence: "Small text on passing tags: edits re-spell neighbouring tags."
  levers: [exact-text, small-text, keep-rest, timing, count]
  inputs: [{source: SRC-VCLIP-SHELF-PAN, role: source}]
  prompt: |
    This 6-second dolly passes six white price tags, one a second. Change only two of them, on every frame
    where they appear. The Toor Dal tag now reads "Toor Dal 1 kg | ₹159 | ₹15.90/100 g". The Moong Dal tag
    now reads "Moong Dal 500 g | ₹89 | ₹17.80/100 g". Same black font, same sizes, the price still the
    largest line, perspective matching the moving tag. The Basmati Rice, Sona Masoori, Chana Dal and Masoor
    Dal tags keep their text exactly as in the source; the bags, the light and the dolly are unchanged.
  exact_text: ["Toor Dal 1 kg | ₹159 | ₹15.90/100 g", "Moong Dal 500 g | ₹89 | ₹17.80/100 g"]
  clip: {duration: 6, aspect: "16:9", camera: "unchanged dolly right"}
  deliverable: "One 6-second clip at the source's size and frame rate."
  checks:
    - [text_accuracy, "Does the Toor Dal tag read ₹159 and ₹15.90/100 g?"]
    - [text_accuracy, "Does the Moong Dal tag read ₹89 and ₹17.80/100 g?"]
    - [preservation, "Are the other four tags' text unchanged?"]
    - [text_accuracy, "Is the price the largest line on the edited tags?"]
    - [motion_coherence, "Does the new text track the moving tags without sliding?"]
    - [temporal_consistency, "Is there no flicker or re-spelling between frames?"]
    - [prompt_adherence, "Are there six tags?"]
    - [preservation, "Does a tag still enter about once a second?"]
    - [preservation, "Are the bags unchanged?"]
    - [prompt_adherence, "Does the text take the fluorescent light?"]
    - [preservation, "Is the dolly unchanged?"]
    - [visual_quality, "Is the text crisp?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One video edit with the source clip."}
