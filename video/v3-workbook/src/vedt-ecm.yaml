# Precision video edits — E-commerce, D2C & retail scenarios. Slots: vedt.yaml.
code: VEDT
scenarios:

- id: VEDT-ECM-02
  seed: true
  title: "Recolour the kurta to bottle green as she walks and turns; the print and buttons stay white"
  persona: "Retoucher at an ethnic-wear marketplace making the green colourway's video from the mustard shoot."
  evidence: "The image seed EDT-ECM-02 recolours a still; on a walk and a full turn the print and folds move every frame and tools re-draw the model."
  levers: [keep-rest, identity, camera, locale, multi-step]
  inputs:
    - {source: SRC-VCLIP-RUNWAY-WALK, role: source, note: "the 6-second catalogue walk"}
  prompt: |
    In this 6-second catalogue video, recolour the model's kurta from mustard to bottle green, #2E6B4F,
    on every frame, and change nothing else. The small white floral block print stays white and stays
    in exactly the same pattern, moving with the fabric; the five white buttons stay white; the folds,
    shading and swing of the kurta as she walks, stops at 4 s and turns a full circle by 5.5 s are
    unchanged. Her face, skin tone, hair, the white palazzos, the white dupatta over her left shoulder,
    the beige cyclorama and the light are unchanged. The recolour must not flicker, must not spill onto
    her skin, dupatta or the backdrop, and must not slip at the garment's edges during the turn. No
    smoothing or re-drawing of the model.
  clip: {duration: 6, aspect: "16:9", camera: "as the source: locked off, wide"}
  deliverable: "One 6-second clip at the source's size and frame rate."
  checks:
    - [prompt_adherence, "Is the kurta bottle green close to #2E6B4F on every frame?"]
    - [preservation, "Does the white print keep the same pattern and stay white as the fabric moves?"]
    - [preservation, "Are the five buttons still white?"]
    - [temporal_consistency, "Is the recolour stable with no flicker?"]
    - [motion_coherence, "Do the garment edges stay clean during the turn, with no slip or halo?"]
    - [preservation, "Is there no green on her skin, dupatta or the backdrop?"]
    - [reference_fidelity, "Is her face unchanged on every frame?"]
    - [reference_fidelity, "Is her skin tone unchanged?"]
    - [preservation, "Does she still stop at 4 s and finish the turn by 5.5 s?"]
    - [preservation, "Are the palazzos and dupatta unchanged?"]
    - [preservation, "Is the light unchanged?"]
    - [visual_quality, "Are hands and feet natural on every frame?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One video edit with the source clip."}

- id: VEDT-ECM-01
  title: "Recolour the box from pale blue to sage and the seal from orange to gold, through the unboxing"
  persona: "D2C brand's editor updating an unboxing video after a packaging refresh."
  evidence: "Recolouring an object that is opened and handled spills onto hands and tissue."
  levers: [multi-step, keep-rest, physics, timing, light-lock]
  inputs: [{source: SRC-VCLIP-UNBOX-HANDS, role: source}]
  prompt: |
    Make exactly these two changes to this 8-second top-down unboxing, on every frame, and nothing else.
    1. Recolour the matte pale-blue box and its lid to a matte sage green, inside and out.
    2. Recolour the round orange sticker seal to a metallic gold, including the torn halves after the
       thumbnail slits it from 2 seconds.
    The hands and their skin, the white tissue paper, the white case lifted out from 4 to 7 seconds, the
    oak desk, the notebook and pen, the soft daylight from the left and all timings are unchanged.
  clip: {duration: 8, aspect: "16:9", camera: "unchanged top-down"}
  deliverable: "One 8-second clip at the source's size and frame rate."
  checks:
    - [prompt_adherence, "Is the box matte sage inside and out on every frame?"]
    - [prompt_adherence, "Is the seal metallic gold, including the torn halves?"]
    - [prompt_adherence, "Does the gold catch the window light?"]
    - [preservation, "Are the hands' skin tones unchanged?"]
    - [preservation, "Is the tissue still white?"]
    - [preservation, "Is the case still white?"]
    - [preservation, "Are all timings unchanged?"]
    - [motion_coherence, "Does the colour stay on the box as the lid moves?"]
    - [preservation, "Are the desk, notebook and pen unchanged?"]
    - [prompt_adherence, "Are both changes made?"]
    - [preservation, "Is the framing unchanged?"]
    - [visual_quality, "Is there no colour flicker?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One video edit with the source clip."}

