# Storyboard to shot — Film, OTT & micro-drama scenarios. Slots: vstb.yaml.
code: VSTB
scenarios:

- id: VSTB-FLM-01
  seed: true
  sahil: storyboard
  title: "Storyboard panel 4, the visor ECU reflecting the forest, as a live shot"
  persona: "Director of a sci-fi short turning the approved board into shots, panel by panel."
  evidence: "Sahil's screen-share (screenshots 234–235): customers make videos from storyboards like these; the shot must honour the panel's size and move and the key frame's world."
  levers: [camera, identity, physics, multi-ref, layout, exclude]
  inputs:
    - {source: SRC-VBOARD-ASTRO, role: still1, note: "the board; this shot is panel 4"}
    - {source: SRC-ASTRO-FOREST, role: environment, note: "the key frame: suit, forest and light"}
  prompt: |
    The first image is the storyboard; this shot is its panel 4, "Trees reflected in the visor · ECU ·
    Static". The second image is the key frame for the look. Make the live-action shot for panel 4:
    an extreme close-up of the astronaut's gold-tinted visor, locked off, filling the 2.39:1 frame as
    the panel does, the visor's curve running from frame left to right. In the visor we see the forest
    reflected and curved by the glass: tall straight dark trunks with glowing teal veins, floating
    spores, and the single shaft of white light from the upper right of the key frame, which appears in
    the reflection mirrored on the visor's left. Over six seconds the spores drift through the
    reflection and the veins pulse once, slowly, at about three seconds; the astronaut's breath fogs
    the inside of the visor faintly at the bottom edge and clears. The face behind the visor is never
    seen. The orange band on the left arm and the wrist device are out of frame. Teal and black, film
    grain, no text.
  clip: {duration: 6, aspect: "2.39:1", camera: "locked off, extreme close-up"}
  deliverable: "One 6-second clip, 2.39:1."
  checks:
    - [prompt_adherence, "Is it an extreme close-up of the visor, filling the frame like panel 4?"]
    - [prompt_adherence, "Is the camera locked off?"]
    - [composition, "Does the visor's curve run across the frame as in the panel?"]
    - [physics_plausibility, "Does the visor reflect the forest, curved by the glass?"]
    - [physics_plausibility, "Is the light shaft reflected mirrored, on the visor's left?"]
    - [reference_fidelity, "Do the trunks, teal veins and spores match the key frame?"]
    - [prompt_adherence, "Do the veins pulse once at about 3 seconds?"]
    - [temporal_consistency, "Do spores drift smoothly through the reflection?"]
    - [physics_plausibility, "Does breath fog the inside of the visor faintly and clear?"]
    - [prompt_adherence, "Is the face behind the visor never seen?"]
    - [style, "Is it teal and black with film grain, matching the key frame?"]
    - [temporal_consistency, "Is there no morphing of the visor's shape?"]
    - [text_accuracy, "Is there no text or caption in the shot?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with two reference images."}
  video_followon: ""

- id: VSTB-FLM-02
  title: "Panel 8, the whole forest pulsing, as a crane up that leaves the astronaut tiny"
  persona: "Director of a sci-fi short turning the approved board into shots, panel by panel."
  evidence: "Board arrows name a move; generated cameras often push in or orbit instead of craning."
  levers: [camera-move, multi-ref, off-centre, light-lock, timing]
  inputs:
    - {source: SRC-VBOARD-ASTRO, role: still1, note: "the board; this shot is panel 8"}
    - {source: SRC-ASTRO-FOREST, role: environment, note: "the key frame: suit, forest and light"}
  prompt: |
    The first image is the storyboard; this shot is its panel 8, "Whole forest pulses at once · EWS ·
    Crane up". The second image is the key frame for the look. Make the live-action shot: start at
    the astronaut's waist height, the astronaut standing still on the left third, and over eight
    seconds crane straight up past the trunks until the camera is above the canopy edge, looking down,
    the astronaut a tiny white figure off-centre at lower left in a sea of dark trunks. At 5 seconds
    every teal vein in every trunk pulses brighter at once, a single wave of light, then fades back.
    The shaft of white light stays at the upper right. Spores drift. Teal and black, film grain, no
    text.
  clip: {duration: 8, aspect: "2.39:1", camera: "crane straight up from waist height to above the canopy edge"}
  deliverable: "One 8-second clip, 2.39:1."
  checks:
    - [prompt_adherence, "Does the camera crane straight up rather than push in or orbit?"]
    - [prompt_adherence, "Does it end as an extreme wide looking down?"]
    - [composition, "Is the astronaut tiny and off-centre at lower left at the end?"]
    - [prompt_adherence, "Do all the veins pulse together at about 5 seconds?"]
    - [prompt_adherence, "Does the light shaft stay at the upper right?"]
    - [reference_fidelity, "Do the suit and orange band match the key frame?"]
    - [reference_fidelity, "Do the trunks and veins match the key frame?"]
    - [motion_coherence, "Does the astronaut stay still while the camera rises?"]
    - [physics_plausibility, "Do the trunks pass with correct parallax as the camera rises?"]
    - [temporal_consistency, "Is there no morphing of the trunks?"]
    - [style, "Is it teal and black with film grain?"]
    - [text_accuracy, "Is there no text?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with two reference images."}

- id: VSTB-FLM-03
  title: "Chase panel 2: the hoodie man bolts left to right from the chai stall in the rain, pan right"
  persona: "First AD on a Hindi OTT thriller, previewing the chase from the board and the location still."
  evidence: "Screen direction across a chase must hold; models often flip the runner's direction."
  levers: [multi-ref, camera-move, continuity, physics, locale, layout]
  inputs:
    - {source: SRC-VBOARD-CHASE, role: still1, note: "the board; this shot is panel 2"}
    - {source: SRC-CHAI-STALL, role: environment, note: "the location: the stall, the rain, the light"}
  prompt: |
    The first image is the chase storyboard; this shot is its panel 2, "The hoodie man bolts left to
    right · WS · Pan right". The second image is the tea stall where the chase begins. Make a 6-second
    wide shot: the young man in the wet grey hoodie springs up from the blue stool at the stall and runs
    left to right along the lane, small in the frame as in the panel; the camera pans right to follow
    him, the stall sliding out of frame left. The delivery rider in the red jacket stays at the counter
    and turns his head to watch. Heavy rain, puddles splashing under his feet, the cyan-white tube light
    on the wet road. He never runs towards camera or right to left. No text other than the stall board.
  clip: {duration: 6, aspect: "2.39:1", camera: "wide, pan right following the runner"}
  deliverable: "One 6-second clip, 2.39:1."
  checks:
    - [motion_coherence, "Does the hoodie man run left to right throughout?"]
    - [prompt_adherence, "Does the camera pan right to follow him?"]
    - [composition, "Is he small in a wide frame as in panel 2?"]
    - [prompt_adherence, "Does the stall slide out of frame left?"]
    - [reference_fidelity, "Is he in the wet grey hoodie from the location still?"]
    - [reference_fidelity, "Does the rider in the red jacket stay at the counter?"]
    - [physics_plausibility, "Do puddles splash under his feet?"]
    - [physics_plausibility, "Does the rain fall consistently?"]
    - [prompt_adherence, "Is the cyan-white tube light reflected on the wet road?"]
    - [motion_coherence, "Is his run natural, without limb glitches?"]
    - [prompt_adherence, "Is the rider turning to watch?"]
    - [text_accuracy, "Is there no text other than the stall board?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with two reference images."}

- id: VSTB-FLM-04
  title: "Chase panel 5: the vault over the banana handcart, same hoodie, same direction"
  persona: "Stunt coordinator checking the vault from the board before the rehearsal."
  evidence: "A vault needs believable weight; the handcart and bananas must react without passing through him."
  levers: [physics, continuity, camera, layout, locale]
  inputs: [{source: SRC-VBOARD-CHASE, role: first_frame, note: "panel 5 is cropped and used as the start"}]
  prompt: |
    This is the chase storyboard; make the live-action shot for panel 5, "Hoodie man vaults a handcart ·
    MS · Static", starting from the framing panel 5 shows. A locked-off medium shot in heavy rain on a
    Mumbai lane at night: the young man in the wet grey hoodie runs in from frame left, plants both
    hands on the edge of a wooden handcart heaped with green and yellow banana bunches, swings his legs
    over to the right, lands on the far side and keeps running out of frame right. The cart rocks once
    and two bananas fall onto the road. His hands never pass through the bananas. Rain and puddles,
    cyan street light. Photoreal live action, not a drawing.
  clip: {duration: 5, aspect: "2.39:1", camera: "locked off, medium shot"}
  deliverable: "One 5-second clip, 2.39:1, photoreal."
  checks:
    - [motion_coherence, "Does he run in from the left and leave to the right?"]
    - [physics_plausibility, "Does he plant his hands on the cart's edge and vault with believable weight?"]
    - [physics_plausibility, "Do his hands and legs never pass through the cart or bananas?"]
    - [physics_plausibility, "Does the cart rock once and do two bananas fall?"]
    - [prompt_adherence, "Is the camera locked off?"]
    - [composition, "Is it a medium shot as in panel 5?"]
    - [reference_fidelity, "Is he in a wet grey hoodie?"]
    - [style, "Is it photoreal, not a drawing?"]
    - [physics_plausibility, "Does the rain fall consistently and puddles splash?"]
    - [visual_quality, "Are his hands natural?"]
    - [prompt_adherence, "Are exactly two bananas knocked off?"]
    - [text_accuracy, "Is there no text?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call; the panel crop is the first frame."}

