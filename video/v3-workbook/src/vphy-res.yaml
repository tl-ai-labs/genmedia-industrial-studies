  persona: "Villa developer previewing a lap pool on existing drone footage for buyers."
  evidence: "Added water must reflect the building from the drone's changing angle on every frame."
  levers: [physics, parallax, keep-rest, light-lock, camera-move]
  inputs: [{source: SRC-VCLIP-VILLA-ORBIT, role: source}]
  prompt: |
    In this 10-second drone quarter orbit round a villa, add a long rectangular lap pool in the front lawn,
    parallel to the house, about 12 by 3 metres, with a grey stone coping and still blue-green water. On every
    frame the water reflects the villa, the sky and the frangipani from the drone's current angle, so the
    reflection shifts and changes as the drone orbits; a light breeze makes small ripples. The pool is locked
    to the ground with the right perspective throughout. The house, the swing centred at 5 seconds, the gate,
    the mid-morning light and the orbit are unchanged.
  clip: {duration: 10, aspect: "16:9", camera: "unchanged quarter orbit"}
  deliverable: "One 10-second clip at the source's size and frame rate."
  checks:
    - [prompt_adherence, "Is there a rectangular lap pool in the front lawn, parallel to the house?"]
    - [physics_plausibility, "Does the water reflect the villa and sky from the current angle?"]
    - [physics_plausibility, "Does the reflection shift as the drone orbits?"]
    - [physics_plausibility, "Is the pool locked to the ground with correct perspective?"]
    - [physics_plausibility, "Are there small ripples?"]
    - [preservation, "Is the house unchanged?"]
    - [prompt_adherence, "Is the swing centred at 5 seconds?"]
    - [prompt_adherence, "Does the pool sit in the mid-morning light?"]
    - [preservation, "Is the orbit unchanged?"]
    - [motion_coherence, "Is there no sliding of the pool?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Is the coping clean?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One video edit with the source clip."}
