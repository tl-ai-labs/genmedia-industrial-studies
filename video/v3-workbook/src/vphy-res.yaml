    - [prompt_adherence, "Does it swing three times, getting smaller?"]
    - [physics_plausibility, "Does her sari's end sway with the motion?"]
    - [prompt_adherence, "Does she push with her right foot?"]
    - [motion_coherence, "Is the swing's motion a smooth pendulum?"]
    - [prompt_adherence, "Is it locked off?"]
    - [prompt_adherence, "Does it read as a Kerala verandah?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are her hands natural on the book?"]
