  runnable_today: {status: "yes", note: "One text-to-video call."}

- id: VPHY-RES-06
  title: "A door slams and the ring chandelier sways and settles; its reflection in the terrazzo sways with it"
  persona: "Hospitality designer testing the chandelier's look in motion for the lobby film."
  evidence: "A swinging light changes every highlight and its reflection must move in step."
  levers: [physics, timing, light-lock, keep-rest, layout]
  inputs: [{source: SRC-RES-HOTEL-LOBBY, role: first_frame}]
  prompt: |
    Start on this hotel lobby photo and make an 8-second locked-off clip. At 1 second an unseen door slams
    off to the left; the ring chandelier of brass hoops begins to sway gently front to back on its rod, about
    a hand's width, and settles over the next six seconds. As it sways, its reflection in the polished
    terrazzo floor sways in step, mirrored, and the warm light it casts on the green velvet sofas and the
    bookshelves shifts slightly with it. The backlit onyx panel and the rest of the lobby do not move. No
    people, no readable signs.
  clip: {duration: 8, aspect: "3:2", camera: "locked off"}
  deliverable: "One 8-second clip, 3:2."
  checks:
    - [prompt_adherence, "Does the sway start at about 1 second?"]
    - [physics_plausibility, "Does the chandelier sway front to back and settle?"]
    - [physics_plausibility, "Does its reflection sway in step, mirrored?"]
    - [prompt_adherence, "Does the light on the sofas shift slightly with the sway?"]
    - [preservation, "Does the rest of the lobby stay still?"]
    - [prompt_adherence, "Is the lobby as in the photo?"]
    - [prompt_adherence, "Is it locked off?"]
    - [motion_coherence, "Is the settling gradual?"]
    - [prompt_adherence, "Are there no people?"]
    - [text_accuracy, "Are there no readable signs?"]
    - [visual_quality, "Is the brass clean?"]
    - [prompt_adherence, "Is the onyx panel backlit?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a first frame."}

- id: VPHY-RES-07
