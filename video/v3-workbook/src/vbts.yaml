# V3 — Story beats: first and last frame, consecutive beats (header). Built on image family SHT.
# Scenarios: vbts-*.yaml.

family: Story beats
code: VBTS
number: 3
about: "Consecutive beats as clips that start and end on given frames and cut together: action timed to the second, identity and light carried across the cuts."
outputs: "3 clips (set)"
set: {min: 3, max: 4, required: true}

rubric:
  weights: {set_consistency: 4, prompt_adherence: 3, motion_coherence: 2, physics_plausibility: 2, reference_fidelity: 2, text_accuracy: 1, visual_quality: 1, style: 1, composition: 1, temporal_consistency: 2}
  gate: [set_consistency]
  gate_rule: "No character, prop or place may change between beats."

targets:
  end-frame: "A clip does not land on the given last frame"
  jump: "Consecutive clips do not join at the cut"
  identity-drift: "The character changes across the beats"
  timing: "An action happens at the wrong second or takes the wrong time"
  light-drift: "Light changes between beats when it should not, or fails to change when it should"
  prop-drift: "A prop appears, vanishes or moves across the cut"

slots:
  # Film, OTT & micro-drama — 8 (8 i2v · 5 hard, 3 extreme)
  - {id: VBTS-FLM-01, task: i2v, subject: person, style: cinematic, light: fog-rain, locale: global, diff: extreme, target: timing, sources: [SRC-RIDGE-WANDERER], from_image: SHT-FLM-01, idea: "Sahil's beat-sheet test in motion: beats B4–B6 of 'The Last Transmission' as three chained clips timed to the sheet"}
  - {id: VBTS-FLM-02, task: i2v, subject: group, style: cinematic, light: daylight, locale: IN, diff: hard, target: jump, sources: [SRC-HALDI], from_image: SHT-FLM-02, idea: "Three haldi beats: the water pour, a phone rings, the grandfather stands; each cut joins"}
  - {id: VBTS-FLM-03, task: i2v, subject: interior, style: cinematic, light: daylight, locale: IN, diff: hard, target: light-drift, sources: [SRC-TRAIN], idea: "Three beats in the sleeper bay: newspaper lowered, tiffin offered, the train enters a tunnel and the light goes"}
  - {id: VBTS-FLM-04, task: i2v, subject: person, style: cinematic, light: night, locale: IN, diff: extreme, target: end-frame, sources: [SRC-ROOFTOP, SRC-VFRAME-ROOFTOP-DOOR], idea: "Three rooftop beats that must end exactly on the given door frame"}
  - {id: VBTS-FLM-05, task: i2v, subject: group, style: cinematic, light: practical, locale: IN, diff: hard, target: prop-drift, sources: [SRC-INTERROGATION], idea: "Three interrogation beats: the photo slides across, he looks, he breaks; the photo stays where it lands"}
  - {id: VBTS-FLM-06, task: i2v, subject: food, style: cinematic, light: practical, locale: IN, diff: hard, target: prop-drift, sources: [SRC-THALI-DINNER], idea: "Three dinner beats: sambar served, a tumbler knocked over, everyone laughs; the spill stays"}
  - {id: VBTS-FLM-07, task: i2v, subject: person, style: cinematic, light: fog-rain, locale: IN, diff: hard, target: identity-drift, sources: [SRC-ACTOR-F, SRC-COSTUME-REF], idea: "Three beats of the actor in the 1940s costume running through paddy in the rain"}
  - {id: VBTS-FLM-08, task: i2v, subject: person, style: cinematic, light: daylight, locale: IN, diff: extreme, target: jump, sources: [SRC-THUMBS-CHASE, SRC-ACTOR-M], idea: "Thumbnails 3 to 5 of the market chase as three cut-together beats with the actor as the runner"}
