# V4 — Character continuity and performance, no lip-sync (header). Built on image family CHR.
# Scenarios: vchr-*.yaml.

family: Character continuity in motion
code: VCHR
number: 4
about: "The same character across 3 clips of action and performance: face, body, costume and marks held while they move. No lip-sync is judged."
outputs: "3 clips (set)"
set: {min: 3, max: 4, required: true}

rubric:
  weights: {set_consistency: 4, reference_fidelity: 3, prompt_adherence: 2, motion_coherence: 2, preservation: 2, physics_plausibility: 1, text_accuracy: 1, visual_quality: 1, style: 1, composition: 1, temporal_consistency: 2}
  gate: [set_consistency]
  gate_rule: "The character must be the same person in every clip."

targets:
  identity-drift: "The face or design changes between clips"
  morph: "The face or body morphs during a clip"
  wardrobe-drift: "Costume details change when they should not"
  prop-drift: "A signature prop or mark moves, flips sides or disappears"
  expression: "The asked-for performance is not delivered"
  ensemble-blend: "Features blend between characters sharing a frame"
  skin-tone: "Skin tone drifts across clips or light changes"

slots:
