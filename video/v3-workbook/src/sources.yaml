# Video v3 — video-only sources: source clips for edits, and any new images the image bank
# does not already have. Shape and rules: ../README.md. Written one industry at a time.
#
# Reuse image sources (image/v3-workbook/src/sources.yaml) by id; do not redefine them here.
# A base scene's uses across the image and video banks are capped at 5.
#
# kind: image | clip      role: scene | reference
# A clip also states duration (seconds), camera_move and action_timing.
# used_by must list exactly the video slots that name this source (the build checks both ways).

sources:

# ------------------------------------------------------------ Film, OTT & micro-drama
# Source clips (for video edits)

- id: SRC-VCLIP-CHAI-POUR
  kind: clip
  role: scene
  used_by: [VEDT-FLM-01]
  aspect: "16:9"
  resolution: "1920x1080, 24 fps"
  duration: 6
  camera_move: "Locked off at standing eye level from across the lane, 35 mm."
  action_timing: "0–4 s the vendor pours tea from a height between two steel pots; 4–6 s he hands a glass across the counter to the rider. The young man on the stool scrolls his phone throughout."
  source_prompt: |
    A six-second shot of a Mumbai roadside tea stall on a monsoon night in heavy rain, framed exactly
    like a still of the same stall: a narrow tin shed facing the camera; a painted white board above
    it reading "RAJU TEA STALL" in red block capitals; a round wall clock behind the vendor at ten
    past nine; a large dented aluminium kettle on a kerosene stove at counter left with no steam; one
    bare cyan-white tube light under the awning as the key light. The vendor, a wiry man of about
    fifty in a vest and checked lungi, pours tea from a height between two steel pots, then hands a
    glass across the counter. On frame left a young man in a wet grey hoodie sits on a blue plastic
    stool scrolling a smartphone in his right hand, its screen lighting his face; on frame right a
    delivery rider in a red rain jacket stands and takes the glass. Rain streaks continuously;
    puddles in the foreground reflect the tube light and the red board.
  avoid: ["any other people", "readable text other than the sign", "brand logos", "watermark", "camera movement"]
  must_contain:
    - "Sign reads exactly RAJU TEA STALL in every frame"
    - "Phone in the young man's right hand throughout"
    - "Pour from 0 to 4 s, hand-over from 4 to 6 s"
    - "Rain and puddle reflections throughout"
  alt_real: "Real footage shot to this layout with the sign painted for the shoot is preferred."

