  - {id: VCAM-FLM-04, task: edit, subject: child-elderly, style: cinematic, light: daylight, locale: IN, diff: extreme, target: reframe-lost, sources: [SRC-VCLIP-MARKET-WALK], idea: "Reframe the market Steadicam shot from 16:9 to 9:16, following the old man and keeping the tomato beat"}
