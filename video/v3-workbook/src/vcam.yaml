# V8 — Cinematography and composition in motion (header). Built on image family CMP. Scenarios: vcam-*.yaml.

family: Camera work
code: VCAM
number: 8
about: "Composition held through a camera move, named moves executed with the right path and speed, lens character, and reframes from 16:9 to vertical."
outputs: "1 clip"

rubric:
  weights: {composition: 4, prompt_adherence: 3, motion_coherence: 3, preservation: 2, physics_plausibility: 1, visual_quality: 1, text_accuracy: 1, temporal_consistency: 1, style: 1, reference_fidelity: 1}
  gate: [composition, motion_coherence]
  gate_rule: "The framing must be the one described, and the camera move must hold its path without warping."

targets:
  centre-bias: "The subject drifts to the centre during the move"
  move-wrong: "The named move is not executed (path, direction or end position)"
  lens-look: "The perspective does not match the named lens"
  horizon: "The horizon is not where, or at the tilt, the brief asks"
  reframe-lost: "A reframe loses the subject or the action"
  speed: "The move's speed or easing is not as described"

slots:
