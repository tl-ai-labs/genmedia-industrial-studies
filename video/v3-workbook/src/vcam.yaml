  - {id: VCAM-FLM-01, task: t2v, subject: landscape, style: cinematic, light: golden, locale: global, diff: extreme, target: centre-bias, sources: [], from_image: CMP-FLM-01, idea: "Sahil's composition test in motion: the lone rider at sunset, a slow lateral move that keeps him on the left third"}
  - {id: VCAM-FLM-02, task: t2v, subject: person, style: cinematic, light: practical, locale: IN, diff: hard, target: move-wrong, sources: [], idea: "A dolly zoom on a woman in a long haveli corridor: she stays the same size while the corridor stretches"}
