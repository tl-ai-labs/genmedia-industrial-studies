# V5 — Product and ad spots (header). Built on image family PRD. Scenarios: vspt-*.yaml.

family: Product and ad spots
code: VSPT
number: 5
about: "Short multi-shot spots in which a real product stays exact through motion: label, shape, logo, colour; packshots that land on time; vertical variants."
outputs: "1 multi-shot clip"

rubric:
  weights: {reference_fidelity: 4, text_accuracy: 3, prompt_adherence: 3, motion_coherence: 2, physics_plausibility: 2, preservation: 2, visual_quality: 1, style: 1, temporal_consistency: 1, composition: 1}
  gate: [reference_fidelity, text_accuracy]
  gate_rule: "The product, its logo and its label text must stay exactly the real ones through the motion."

targets:
  label-drift: "Label text or artwork changes or melts during the motion"
  shape-drift: "The product's shape or proportions change during the motion"
  logo-geometry: "The logo distorts as it moves or turns"
  colour-drift: "Brand or product colours shift across the spot"
  integration: "Light, shadow or reflections on the product do not match the scene as it moves"
  timing: "The packshot or beat lands at the wrong second"
  aspect-reframe: "A vertical or square variant loses the product or the action"

slots:
