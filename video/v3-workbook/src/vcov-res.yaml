# Coverage and camera move — Real estate, interiors & architecture scenarios. Slots: vcov.yaml.
code: VCOV
scenarios:

- id: VCOV-RES-01
  seed: true
  title: "One walkthrough of the listing room: entrance to balcony, then a turn back to the unseen entrance wall"
  persona: "Listing videographer for a Mumbai property portal who has one wide photo and needs the walkthrough video."
  evidence: "Call at 17:26: 'five shots of the same setup ... the video they want is a camera moving across the same room from different angles'. The image seed COV-RES-01 holds the room across five stills; here it must hold as the camera walks through it and turns round."
  levers: [camera-move, unseen, layout, parallax, light-lock, keep-rest, locale]
  inputs:
    - {source: SRC-RES-LIVING-FLAT, role: first_frame, note: "the listing photo from the entrance corner"}
  prompt: |
    Start exactly on this listing photo of a lived-in living room and make a 12-second gimbal
    walkthrough at chest height, verticals kept straight, daylight only from the balcony door, ceiling
    lights off. 0–6 s: walk forward across the room towards the sliding balcony door, the grey sofa with
    newspapers on its left cushion passing on the left, the TV over the white console with hanging
    wires on the right, the round table on the beige rug passing below. 6–9 s: stop just inside the
    balcony door, the laundry rack outside, and turn slowly 180 degrees to the left. 9–12 s: hold on the
    room seen from the balcony end: now the sofa is on the right, the TV wall on the left, and the
    entrance wall the photo never shows is ahead: a plain wooden front door with a shoe rack beside it
    and a light switch. Nothing is tidied, added or moved; the daylight now comes from behind the camera.
    No people, no text.
  clip: {duration: 12, aspect: "16:9", camera: "gimbal walk forward 0–6 s, 180-degree turn left 6–9 s, hold 9–12 s"}
  deliverable: "One 12-second clip, 16:9, starting on the photo."
  checks:
    - [prompt_adherence, "Does the clip start on the photo's framing?"]
    - [prompt_adherence, "Does it walk forward, turn about 180 degrees left, and hold, in that order?"]
    - [prompt_adherence, "Do the phases land near 0–6, 6–9 and 9–12 s?"]
    - [prompt_adherence, "After the turn, is the sofa on the right and the TV wall on the left?"]
    - [prompt_adherence, "Is the entrance wall a wooden door with a shoe rack and a switch?"]
    - [temporal_consistency, "Are the newspapers, wires and laundry rack still there throughout?"]
    - [physics_plausibility, "Do the furniture pieces pass at speeds set by their distance as the camera walks?"]
    - [prompt_adherence, "Does daylight come from the balcony, and from behind the camera after the turn?"]
    - [visual_quality, "Do verticals stay straight throughout?"]
    - [motion_coherence, "Is the move smooth, with no warping walls or furniture?"]
    - [physics_plausibility, "Does the room keep a plausible size as it is revealed?"]
    - [prompt_adherence, "Are there no people?"]
    - [text_accuracy, "Is there no text?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a first frame."}

- id: VCOV-RES-02
  title: "A slow 360-degree pan from the middle of the empty bedroom; window, wardrobe and door come round in order"
  persona: "Builder's sales team making a 360 video of a show-flat bedroom from one photo."
  evidence: "Empty rooms give few cues; a full pan reveals walls the photo never showed and must keep their order."
  levers: [camera-move, unseen, layout, light-lock, physics]
  inputs: [{source: SRC-RES-BEDROOM, role: first_frame}]
  prompt: |
    Start on this photo of an empty bedroom at golden hour, taken from the doorway, then move the camera
    to the middle of the room and make a 12-second slow 360-degree pan to the right at chest height,
    verticals straight. In order the camera sees: the wide three-pane window on the far wall with the hill
    view and three panels of sunlight on the floor; the white three-shutter wardrobe on the right wall;
    the door wall, never shown, with a plain white door and a light switch; the left wall with a
    switchboard and an air-conditioner outlet; and back to the window. The room stays about 3.5 by 4
    metres; the sun panels stay fixed on the floor. No furniture, no people.
  clip: {duration: 12, aspect: "16:9", camera: "360-degree pan right from the room's middle"}
  deliverable: "One 12-second clip, 16:9."
  checks:
    - [prompt_adherence, "Is it a full 360-degree pan at an even speed?"]
    - [prompt_adherence, "Do the walls come round in the stated order?"]
    - [prompt_adherence, "Is the door wall a plain white door with a switch?"]
    - [prompt_adherence, "Does the window have three panes and the wardrobe three shutters?"]
    - [prompt_adherence, "Do the sun panels stay fixed on the floor?"]
    - [physics_plausibility, "Does the room keep a plausible size?"]
    - [visual_quality, "Are verticals straight throughout?"]
    - [motion_coherence, "Is there no warping of walls?"]
    - [prompt_adherence, "Is the room empty?"]
    - [temporal_consistency, "Does the window view stay the same?"]
    - [text_accuracy, "Is there no text?"]
    - [style, "Is the grade consistent?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a first frame."}

- id: VCOV-RES-03
  title: "A drone orbit from the villa's front round its side to the rear garden and pool it never showed"
  persona: "Developer's marketing lead who has only the front photo and needs the orbit for the brochure film."
  evidence: "Earlier bank IMG-VIEW-31 (front to side elevation) and IMG-VIEW-08 (street to drone) were high tier."
  levers: [camera-move, unseen, layout, light-lock, locale]
  inputs: [{source: SRC-RES-VILLA-EXT, role: first_frame}]
  prompt: |
    Start on this front elevation of a contemporary two-storey villa and make a 12-second drone move: rise
    to 10 metres and orbit 180 degrees to the right round the house, ending behind it. Front: white ground
    floor with a teak wall on the left and a glass door on the right, concrete upper floor overhanging the
    right side, an empty swing under the overhang, a frangipani on the front lawn. The right side, the
    rear and the roof, never shown, use the same materials: the rear has a full-width glass wall onto a
    lawn with a small plunge pool. The mid-morning sun stays fixed at the front-left of the house, so the
    rear ends in partial shade. No people, no cars, no text.
  clip: {duration: 12, aspect: "16:9", camera: "rise to 10 m and 180-degree orbit right"}
  deliverable: "One 12-second clip, 16:9."
  checks:
    - [prompt_adherence, "Does the drone rise and orbit 180 degrees to end behind the house?"]
    - [prompt_adherence, "Is the overhang on the right side of the front throughout?"]
    - [prompt_adherence, "Is the rear a full-width glass wall with a lawn and plunge pool?"]
    - [reference_fidelity, "Are materials consistent on every side?"]
    - [prompt_adherence, "Does the sun stay at the front-left, leaving the rear in partial shade?"]
    - [physics_plausibility, "Does the house keep its proportions as it turns?"]
    - [motion_coherence, "Is there no warping of walls or roofline?"]
    - [reference_fidelity, "Is the swing under the overhang when visible?"]
    - [prompt_adherence, "Are there no people or cars?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are lines straight?"]
    - [prompt_adherence, "Does it read as a Bengaluru gated community?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a first frame."}

