# V6 — Precision video edits on real footage (header). Built on image family EDT. Scenarios: vedt-*.yaml.

family: Precision video edits
code: VEDT
number: 6
about: "Remove, recolour, replace or add on a real source clip, with the edit tracking the motion and everything else left as it was."
outputs: "1 clip"

rubric:
  weights: {preservation: 4, prompt_adherence: 4, reference_fidelity: 3, motion_coherence: 2, physics_plausibility: 2, text_accuracy: 2, visual_quality: 1, style: 1, temporal_consistency: 3}
  gate: [preservation]
  gate_rule: "Nothing outside the asked-for change may be altered, in any frame."

targets:
  spill: "Something outside the asked-for change is altered"
  step-missed: "One of the asked-for changes is not made, or not for the whole clip"
  identity-drift: "A face or product in the clip changes"
  text-damage: "Existing text is damaged, or new text is wrong"
  motion-break: "The edit slips, flickers or fails to track the motion"
  over-edit: "The clip is regenerated or restyled instead of edited"

