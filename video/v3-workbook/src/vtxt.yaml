  - {id: VTXT-ECM-02, task: edit, subject: interior, style: photoreal, light: practical, locale: IN, diff: extreme, target: track-loss, sources: [SRC-VCLIP-SHELF-PAN], script: tamil, idea: "Make the moving shelf tags bilingual: a Tamil product name added above each, stuck to the tag through the dolly"}
