# V9 — Text and graphics in motion, multi-script (header). Built on image family TYP. Scenarios: vtxt-*.yaml.

family: Text in motion
code: VTXT
number: 9
about: "Titles, supers and on-surface text in Latin, Devanagari, Telugu and Tamil that stay exact on every frame, animate on time and stick to moving surfaces."
outputs: "1 clip"
text_family: true

rubric:
  weights: {text_accuracy: 4, prompt_adherence: 3, motion_coherence: 2, preservation: 2, physics_plausibility: 1, visual_quality: 1, style: 1, temporal_consistency: 2}
  gate: [text_accuracy]
  gate_rule: "Every letter must be right in every frame it is on screen."

targets:
  string-exact: "A word is misspelled, missing, doubled or invented at any frame"
  script-render: "Devanagari, Telugu or Tamil letters are malformed at any frame"
  flicker: "Text shimmers, morphs or re-spells itself between frames"
  track-loss: "Text does not stick to the moving surface it is on"
  timing: "Text arrives or leaves at the wrong second"
  layout-kept: "A replaced super loses the original layout or style"

slots:
  # Film, OTT & micro-drama — 1 (1 edit · 1 hard)
  - {id: VTXT-FLM-01, task: edit, subject: architecture, style: cinematic, light: night, locale: IN, diff: hard, target: track-loss, sources: [SRC-VCLIP-STATION-SIGN], script: mixed, idea: "Rename the station on the moving board in three scripts; the new text sticks to the board through the dolly"}
  # Advertising & agencies — 1 (1 t2v · 1 extreme)
  - {id: VTXT-ADS-01, task: t2v, subject: vehicle, style: graphic, light: daylight, locale: IN, diff: extreme, target: timing, sources: [], script: mixed, from_image: TYP-ADS-01, idea: "The scooter launch end card: English headline, Hindi line, price and fine print arrive on cue"}
