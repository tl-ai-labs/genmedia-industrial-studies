    and green chillies, steel dabbas on open shelves, a brass spice box on the right end of the counter.
    Make three chained clips, each starting on the last frame of the one before, 4 + 3 + 4 seconds. A cook
    in a sage apron whose face is not shown does the work. The kitchen keeps its layout in every shot.
    Late-morning daylight from the window. No text.
