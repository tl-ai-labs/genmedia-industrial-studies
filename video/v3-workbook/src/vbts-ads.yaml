      - {name: "Beat 2 · Seeds (3 s)", prompt: "Close-up into the kadhai: mustard seeds from the spice box drop in and crackle, jumping.", checks: [[physics_plausibility, "Do the seeds crackle and jump?"], [prompt_adherence, "Does it last about 3 seconds?"]]}
      - {name: "Beat 3 · Tadka (4 s)", prompt: "Medium: the cook pours the sizzling tadka over a bowl of yellow dal on the counter; smoke curls up.", checks: [[physics_plausibility, "Does the tadka sizzle and smoke as it hits the dal?"], [prompt_adherence, "Is the bowl on the counter by the stove?"]]}
  deliverable: "Three chained clips, 4, 3 and 4 seconds, 16:9."
  checks:
