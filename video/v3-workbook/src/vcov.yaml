# V1 — Coverage clips and a camera move through a space (header). Built on image family COV.
# Scenarios: vcov-*.yaml. Slot fields and rules: ../README.md.

family: Coverage and camera move
code: VCOV
number: 1
about: "The same moment or space as a set of coverage clips from several positions, or one continuous camera move through it. The space must hold in 3D as the camera travels."
outputs: "4 clips (set) or 1 move"
set: {min: 3, max: 5, required: false}

rubric:
  weights: {prompt_adherence: 3, motion_coherence: 3, set_consistency: 3, physics_plausibility: 2, reference_fidelity: 2, temporal_consistency: 2, text_accuracy: 1, visual_quality: 1, style: 1, preservation: 1, composition: 1}
  gate: [motion_coherence, temporal_consistency, set_consistency]
  gate_rule: "The space must hold together as the camera moves, with no warping or morphing, and the clips of a set must agree."

targets:
  angle-wrong: "A clip's camera position is not the one asked for"
  layout-drift: "Objects or people move between clips or during the move"
  identity-drift: "Faces, wardrobe or object details change between clips or during the move"
  light-drift: "The light direction does not follow the camera"
  unseen-invent: "What the start frame never shows is invented inconsistently as it comes into view"
  headcount: "People appear or vanish during the move or between clips"
  move-wrong: "The camera move is not the one described (wrong direction, speed or path)"
  parallax-flat: "The space does not hold depth as the camera moves; layers slide together like a flat picture"

