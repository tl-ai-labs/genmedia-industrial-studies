# Product and ad spots — E-commerce, D2C & retail scenarios. Slots: vspt.yaml.
code: VSPT
scenarios:

- id: VSPT-ECM-01
  seed: true
  sahil: product-bible
  title: "The production bible's storyboard, frames 2 to 5, as one 8-second soda spot"
  persona: "Producer at a D2C beverage brand who sent the studio one bible sheet and expects the film to match it."
  evidence: "Sahil's product-bible example (screenshots 232–233): one product photo became a bible with a storyboard strip. The film made from it must keep the can exact through ice, opening, fizz and pour."
  levers: [identity, multi-ref, exact-text, timing, physics, light-lock, long-brief]
  inputs:
    - {source: SRC-ECM-SODA-CAN, role: product, note: "the real can"}
    - {source: SRC-VBIBLE-ANANAS, role: still1, note: "the production bible: set, lighting and storyboard"}
  prompt: |
    The first image is the product; the second is its production bible. Make the 8-second spot from
    the bible's storyboard frames 2 to 5, on the bible's set (dark slate plinth, navy cyclorama, a block
    of clear ice) with its lighting (key upper left, rim behind right, fill front right), in four
    timed shots cut together. 0–2 s, "2 Can rises from the ice": the can rises slowly out of crushed
    ice, shards sliding off. 2–4 s, "3 Ring-pull opens": a macro of the silver ring-pull lifting, a
    puff of cold vapour. 4–6 s, "4 Fizz in macro": bubbles racing up at the can's mouth. 6–8 s, "5
    Pour into glass": the drink pours into a tall glass of ice beside the can. In every shot it is
    exactly this can: matte cobalt blue, "Ananas" in yellow script running diagonally upward,
    "PINEAPPLE FIZZ" and "330 ml" in white, the white line-drawn pineapple on the right, condensation
    on the lower two-thirds. Cold, crisp, high contrast, as the bible's notes say. No other text.
  exact_text: ["Ananas", "PINEAPPLE FIZZ", "330 ml"]
  clip: {duration: 8, aspect: "16:9", camera: "slow rise, macro, macro, locked-off medium; four cuts"}
  deliverable: "One 8-second clip with four shots, 16:9."
  checks:
    - [prompt_adherence, "Are the four shots at about 0–2, 2–4, 4–6 and 6–8 s?"]
    - [prompt_adherence, "Do the shots follow the bible's frames 2 to 5 in order?"]
    - [reference_fidelity, "Is the can exactly the product in every shot it appears in?"]
    - [text_accuracy, "Do Ananas, PINEAPPLE FIZZ and 330 ml stay exact and readable whenever visible?"]
    - [temporal_consistency, "Does the script never melt, swim or re-spell as the can moves?"]
    - [reference_fidelity, "Does the script run diagonally upward in every shot?"]
    - [physics_plausibility, "Do ice shards slide off as the can rises?"]
    - [physics_plausibility, "Does vapour puff as the ring-pull lifts?"]
    - [physics_plausibility, "Does the pour fill the glass naturally around the ice?"]
    - [prompt_adherence, "Is the set the bible's: slate plinth, navy cyclorama, ice block?"]
    - [prompt_adherence, "Is the lighting key upper left with a rim behind right, as the diagram shows?"]
    - [style, "Is the look cold, crisp and high contrast?"]
    - [text_accuracy, "Is there no other text?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with two references; four cuts in one clip depend on the model's support for cuts."}

