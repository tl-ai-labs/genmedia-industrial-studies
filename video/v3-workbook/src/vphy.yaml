# V7 — Physics, parallax and depth (header). Built on image family PHY. Scenarios: vphy-*.yaml.

family: Physics and depth in motion
code: VPHY
number: 7
about: "Contact, collision, fluids, gravity, reflections, shadows and parallax that a physics-literate viewer would catch over time."
outputs: "1 clip"

rubric:
  weights: {physics_plausibility: 4, prompt_adherence: 3, motion_coherence: 3, preservation: 2, text_accuracy: 1, visual_quality: 1, composition: 1, style: 1, reference_fidelity: 1, temporal_consistency: 1}
  gate: [physics_plausibility]
  gate_rule: "No reflection, shadow, parallax or contact may contradict the scene at any moment."

targets:
  contact: "Objects float, slide or sink where they should touch and hold"
  collision: "Objects pass through each other"
  fluid: "Liquids, smoke or cloth move unnaturally"
  gravity: "Falls, throws or bounces break gravity"
  reflection: "Reflections do not move with what they reflect"
  shadow-direction: "Shadows do not move with their light or object"
  parallax: "Layers at different depths move at the wrong relative speeds"

