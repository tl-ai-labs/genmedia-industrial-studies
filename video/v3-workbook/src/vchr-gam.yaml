- id: VCHR-GAM-09
  title: "Three re-skins of the gameplay run: monsoon, damaged, gold; her silhouette and moves untouched"
  persona: "Game studio's monetisation lead previewing three skins on one gameplay capture."
  evidence: "Re-skins regenerate the character and the interface; both must survive."
  levers: [set, keep-rest, timing, small-text, identity]
  inputs: [{source: SRC-VCLIP-GAME-CITY, role: source}]
  prompt: |
    This 8-second gameplay capture shows the heroine running down a wet neon street, vaulting a barrier at 3
    seconds and sliding under a shutter at 6 seconds, the camera behind her right shoulder, the interface on
    screen: health and stamina bars top left, minimap top right, ammo counter bottom left, three ability
    icons bottom right. Make three edited versions, each re-skinning ONLY her armour as described. Her
    silhouette, ponytail, sash-cape on the right shoulder, sword, moves, timings, the street and every
    interface element stay exactly as in the capture.
  clip: {duration: 8, aspect: "16:9", camera: "unchanged third-person follow"}
  set_members:
    mode: separate
    must_stay_same:
      - "Her silhouette, ponytail, sash-cape on the right shoulder, sword"
      - "Vault at 3 s; slide at 6 s"
      - "The interface, untouched"
    members:
      - {name: "Monsoon", prompt: "A dark-green waxed rain cloak over the armour with a hood down.", checks: [[prompt_adherence, "Is there a green rain cloak?"], [preservation, "Is the interface unchanged?"]]}
      - {name: "Damaged", prompt: "The same armour scratched, dented and scorched, a copper plate missing on the left shin.", checks: [[prompt_adherence, "Is the armour battle-damaged?"], [prompt_adherence, "Does she vault at 3 s?"]]}
      - {name: "Gold", prompt: "Polished gold armour with white enamel edges.", checks: [[prompt_adherence, "Does the gold reflect the neon?"], [preservation, "Is the ammo counter unchanged?"]]}
  deliverable: "Three 8-second clips, 16:9."
  checks:
    - [preservation, "Is the interface unchanged in all three?"]
    - [preservation, "Is her silhouette unchanged?"]
    - [prompt_adherence, "Do the vault and slide keep their timing in all three?"]
    - [preservation, "Is the sash-cape still on her right shoulder?"]
    - [preservation, "Is the street unchanged?"]
    - [set_consistency, "Is each skin stable through the clip?"]
    - [prompt_adherence, "Does each skin take the neon light?"]
    - [temporal_consistency, "Is there no flicker at the armour edges?"]
    - [reference_fidelity, "Is the ponytail with three rings unchanged?"]
    - [preservation, "Is the camera unchanged?"]
    - [text_accuracy, "Is there no new text?"]
    - [visual_quality, "Is the clip free of artefacts?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: partly, note: "Three video edits of one source clip; set agreement needs the set review."}
