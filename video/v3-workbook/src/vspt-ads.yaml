# Product and ad spots — Advertising & agencies scenarios. Slots: vspt.yaml.
code: VSPT
scenarios:

- id: VSPT-ADS-02
  seed: true
  title: "An 8-second scooter spot in three cuts that lands the packshot at exactly 6 seconds"
  persona: "Agency producer finishing a bumper ad whose packshot must sit at a fixed second for the media plan."
  evidence: "Spots are cut to time; product spots fail on timing and on the product drifting between cuts."
  levers: [timing, identity, exact-text, camera-move, light-lock, locale]
  inputs:
    - {source: SRC-ADS-SCOOTER, role: product, note: "the Hawa E1 scooter"}
  prompt: |
    An 8-second commercial for this exact scooter, the Hawa E1, in three cuts, golden hour on a
    tree-lined Bengaluru street. Cut 1, 0–2.5 s: a low tracking shot beside the front wheel as a woman
    in a white kurta and denim jacket rides past, the black five-spoke wheel turning, the white apron
    catching the sun. Cut 2, 2.5–6 s: a side tracking shot of the whole scooter and rider from its left,
    keeping pace, the "HAWA" on the side panel readable, trees streaming behind. Cut 3, 6–8 s: a
    locked-off packshot, starting exactly at 6 s, of the scooter parked on its side stand in left
    profile on the same street, no rider, sun behind the camera, a long shadow to the right. The
    scooter's matte teal body, white apron, round headlamp, tan seat and silver grab rail are the same
    in all three cuts. No other text, no logos.
  exact_text: ["HAWA"]
  clip: {duration: 8, aspect: "16:9", camera: "low track, side track, locked-off packshot"}
  deliverable: "One 8-second clip with three cuts, 16:9."
  checks:
    - [prompt_adherence, "Are the cuts at about 2.5 s and exactly 6 s?"]
    - [prompt_adherence, "Does the packshot hold from 6 to 8 s?"]
    - [reference_fidelity, "Is the scooter the same in all three cuts?"]
    - [text_accuracy, "Is HAWA on the side panel readable and correct in cut 2?"]
    - [prompt_adherence, "Is cut 1 a low track by the front wheel and cut 2 a side track?"]
    - [prompt_adherence, "Is cut 3 locked off with the scooter in left profile?"]
    - [motion_coherence, "Do the wheels turn plausibly for the speed?"]
    - [temporal_consistency, "Is there no morphing of the scooter or rider?"]
    - [prompt_adherence, "Is it golden hour throughout, with the packshot's shadow to the right?"]
    - [physics_plausibility, "Does the parked scooter lean correctly on its side stand?"]
    - [prompt_adherence, "Is there no rider in the packshot?"]
    - [prompt_adherence, "Is there no other text or logo?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a product reference; multi-cut output depends on the model's support for cuts within a clip."}

- id: VSPT-ADS-01
  title: "A 6-second ghee spot: the jar turns, the lid lifts, ghee pours on rice, packshot at 5 s; the Devanagari label never melts"
  persona: "Agency producer making the ghee brand's 6-second bumper."
  evidence: "Earlier image bank PRD-ADS-07: Devanagari on a tilted label garbles; turning in motion melts it."
  levers: [exact-text, script, timing, identity, physics, locale]
  inputs: [{source: SRC-ADS-GHEE-JAR, role: product}]
  prompt: |
    A 6-second commercial for this exact ghee jar in a warm Indian kitchen at morning, window light from
    the left. 0–2 s: the jar turns slowly on the counter from a quarter-turn to face the camera, so the deep
    red label comes round with "साँझ" in large gold Devanagari and "SAANJH GHEE" in small gold capitals
    below. 2–3.5 s: a hand lifts the gold lid. 3.5–5 s: a spoon pours golden ghee over a mound of hot rice
    on a brass plate, glistening and melting in. 5–6 s: a locked-off packshot of the jar beside the plate,
    label to camera. The label's letters never change as the jar turns. No other text.
  exact_text: ["साँझ", "SAANJH GHEE"]
  clip: {duration: 6, aspect: "4:5", camera: "close turntable, insert, locked-off packshot"}
  deliverable: "One 6-second clip, 4:5."
  checks:
    - [text_accuracy, "Does the label read साँझ in correctly formed Devanagari throughout?"]
    - [text_accuracy, "Does SAANJH GHEE read correctly under it?"]
    - [motion_coherence, "Does the label stay intact as the jar turns, without melting letters?"]
    - [prompt_adherence, "Does the packshot start at about 5 seconds?"]
    - [prompt_adherence, "Does the lid lift at about 2 seconds?"]
    - [physics_plausibility, "Does the ghee melt into the hot rice believably?"]
    - [reference_fidelity, "Is it the real jar with its gold lid and 500 ml badge?"]
    - [prompt_adherence, "Is it window light from the left throughout?"]
    - [visual_quality, "Is the hand natural?"]
    - [prompt_adherence, "Does it read as an Indian kitchen?"]
    - [text_accuracy, "Is there no other text?"]
    - [visual_quality, "Is the glass free of warping?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a product reference."}

- id: VSPT-ADS-03
