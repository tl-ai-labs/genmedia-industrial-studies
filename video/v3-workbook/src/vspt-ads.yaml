    - [reference_fidelity, "Is the myna facing right with a saffron beak?"]
    - [prompt_adherence, "Does the ad stay locked to the panel's perspective as the camera moves?"]
    - [physics_plausibility, "Does the circle stay a correctly foreshortened circle?"]
    - [prompt_adherence, "Is the wordmark's cap height half the circle's diameter?"]
    - [prompt_adherence, "Does the ad animate on at about 2 seconds?"]
    - [prompt_adherence, "Is it a push in from the road?"]
    - [prompt_adherence, "Do the lamp-bracket shadows stay on the top edge?"]
    - [motion_coherence, "Is the traffic below natural?"]
    - [temporal_consistency, "Is there no swimming of the logo?"]
    - [text_accuracy, "Is there no other text?"]
    - [visual_quality, "Are the logo's edges clean?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a first frame and a logo reference."}

- id: VSPT-ADS-05
