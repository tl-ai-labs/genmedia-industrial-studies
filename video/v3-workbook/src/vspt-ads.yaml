  persona: "Phone brand's launch producer making the hero teaser."
  evidence: "Products interacting with water and reflections are where generated spots lose realism."
  levers: [physics, identity, timing, light-lock, multi-step]
  inputs: [{source: SRC-VREF-PHONE, role: product}]
  prompt: |
    A 6-second launch teaser for this exact phone on a black set with one wide softbox overhead. 0–3 s: the
    phone flips slowly end over end in mid-air in slow motion, alternating its violet-gradient screen and
    its sage-green frosted back with the camera island in the top-left corner holding three lenses in a
    vertical line. 3–4 s: it lands flat on its back on a slab of wet black slate, throwing a crown of
    droplets. 4–6 s: it rests; the screen faces up, and the slate's thin water film reflects it. The
    reflection matches the phone; the droplets fall back. No text on the screen.
  clip: {duration: 6, aspect: "9:16", camera: "locked off, slow motion"}
  deliverable: "One 6-second clip, 9:16."
  checks:
    - [reference_fidelity, "Is it the real phone: sage frosted back, island top left, three lenses in a line?"]
    - [prompt_adherence, "Are there three lenses in a vertical line?"]
    - [motion_coherence, "Does it flip end over end smoothly?"]
    - [prompt_adherence, "Does it land at about 3 seconds?"]
    - [physics_plausibility, "Does it throw a crown of droplets on landing?"]
    - [physics_plausibility, "Does the water film reflect the phone correctly?"]
    - [physics_plausibility, "Do the droplets fall back believably?"]
    - [prompt_adherence, "Is there one wide softbox overhead?"]
    - [reference_fidelity, "Does the phone keep its shape throughout?"]
    - [prompt_adherence, "Is the screen showing a violet gradient with no text?"]
    - [text_accuracy, "Is there no text?"]
    - [visual_quality, "Are the edges clean?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a product reference."}

