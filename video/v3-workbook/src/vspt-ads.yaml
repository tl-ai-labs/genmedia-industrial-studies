    A 6-second commercial for this exact running shoe, right foot, on a dark studio set with one hard
    white key from the left and a coral rim from behind. 0–2 s: the shoe alone on a turntable rotating 180
    degrees, from toe-right to toe-left, the single navy stripe running the midsole's full length.
    2–3.5 s: a foot is inside it and the flat white laces pull tight on their own. 3.5–6 s: extreme slow
    motion of the foot striking a black rubber floor: the foam midsole compresses and springs back, the
    knit creases, and the shoe returns exactly to its shape. The small heel tab stays navy. No other text.
  clip: {duration: 6, aspect: "16:9", camera: "turntable, close, slow-motion side"}
  deliverable: "One 6-second clip, 16:9."
  checks:
    - [reference_fidelity, "Is it the real shoe: coral to off-white knit, white midsole, one navy stripe?"]
    - [prompt_adherence, "Is there one navy stripe, never two?"]
    - [prompt_adherence, "Does the turntable rotate 180 degrees in the first 2 seconds?"]
    - [physics_plausibility, "Do the laces tighten believably?"]
    - [physics_plausibility, "Does the midsole compress and spring back?"]
    - [reference_fidelity, "Does the shoe return exactly to its shape after the strike?"]
    - [prompt_adherence, "Do the three parts land at about 2 and 3.5 seconds?"]
    - [prompt_adherence, "Is the key hard from the left with a coral rim?"]
    - [motion_coherence, "Is the slow motion smooth?"]
    - [reference_fidelity, "Is the heel tab navy?"]
    - [text_accuracy, "Is there no text other than the heel tab?"]
    - [visual_quality, "Is the knit texture stable?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a product reference."}

