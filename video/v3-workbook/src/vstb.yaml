  - {id: VSTB-FLM-02, task: i2v, subject: landscape, style: cinematic, light: night, locale: global, diff: hard, target: move-wrong, sources: [SRC-VBOARD-ASTRO, SRC-ASTRO-FOREST], from_image: STB-FLM-01, idea: "Panel 8, the whole forest pulsing, as a crane up that leaves the astronaut tiny"}
