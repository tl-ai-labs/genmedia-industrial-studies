# V2 — Storyboard panel to shot (header). Built on image family STB. Scenarios: vstb-*.yaml.

family: Storyboard to shot
code: VSTB
number: 2
about: "A storyboard panel or frame becomes a shot that honours its shot size, camera move, action and screen direction."
outputs: "1 clip"

rubric:
  weights: {reference_fidelity: 3, prompt_adherence: 3, motion_coherence: 2, composition: 2, physics_plausibility: 2, text_accuracy: 1, style: 1, visual_quality: 1, temporal_consistency: 2}
  gate: [reference_fidelity, composition]
  gate_rule: "The clip must keep the panel's characters, setting and framing."

targets:
  shot-size: "The clip's framing does not match the panel's shot size"
  move-wrong: "The camera move does not match the panel's move"
  panel-ignored: "The clip drifts from the panel's composition or staging"
  continuity: "A character, prop or costume detail changes from the panel"
  style-drift: "The clip's look drifts from the board's world"
  axis-break: "Screen direction flips against the board"

slots:
