# Coverage and camera move — Film, OTT & micro-drama scenarios. Slots: vcov.yaml.
code: VCOV
scenarios:

- id: VCOV-FLM-01
  seed: true
  sahil: angles
  title: "One continuous arc round the banyan, from the two-shot to the reverse behind the children"
  persona: "Director of a Kannada coming-of-age feature previewing the one big camera move of the tree scene before the crane is booked."
  evidence: "Call at 17:26: 'the video they want is a camera moving across the same room from different angles'. Sahil's angles example (screenshots 239–243) used this base; the video version must hold every angle in one unbroken move."
  levers: [camera-move, unseen, parallax, light-lock, identity, layout, locale]
  inputs:
    - {source: SRC-KIDS-TREE, role: first_frame, note: "the approved still; the move starts here"}
  prompt: |
    Start exactly on this still of two schoolchildren sitting on a banyan root at golden hour and make
    one continuous ten-second camera move through the scene, as if on a crane with a slow, steady arc.
    0–3 s: push in gently from the still's position to a two-shot, the children from mid-thigh up.
    3–8 s: arc round to the right of the tree at the same height, keeping the children in frame, the
    camera travelling about 180 degrees around them. 8–10 s: settle behind them, looking past the
    backs of their heads at what the still never shows: a dry field sloping down to a dirt track and a
    line of palms. The children stay still, breathing, the girl's plaits with red ribbons unmoved, the
    bag beside her. The low sun stays behind the tree: as the camera arcs it moves from backlight to
    behind the camera, warming the backs of their heads at the end, their shadows falling forward
    into the frame. The aerial roots and fence pass in front of and behind them at the right depths.
    Cinematic, the still's grain and colour, no cuts, no other people, no text.
  clip: {duration: 10, aspect: "16:9", camera: "push in 0–3 s, 180-degree arc right 3–8 s, settle behind 8–10 s"}
  deliverable: "One 10-second clip, 16:9, starting on the still."
  checks:
    - [prompt_adherence, "Does the clip start on the still's framing?"]
    - [prompt_adherence, "Does the camera push in, arc about 180 degrees to the right, and settle behind them, in that order?"]
    - [prompt_adherence, "Do the three phases land near 0–3 s, 3–8 s and 8–10 s?"]
    - [temporal_consistency, "Is it one continuous move with no cut, jump or morph?"]
    - [reference_fidelity, "Are the two children the same two children from start to end?"]
    - [temporal_consistency, "Do the ribbons, uniforms and bag stay the same throughout?"]
    - [prompt_adherence, "Does the boy end up on frame right and the girl on frame left behind them, as a true reverse?"]
    - [prompt_adherence, "Does the end view show a field sloping to a track and palms, with no fence in front?"]
    - [physics_plausibility, "Do the roots and fence move past at the right depths (parallax)?"]
    - [prompt_adherence, "Does the sun stay fixed behind the tree, ending behind the camera?"]
    - [physics_plausibility, "Do their shadows fall forward into the frame at the end?"]
    - [prompt_adherence, "Are there exactly two people throughout?"]
    - [motion_coherence, "Do the children stay still apart from breathing?"]
    - [text_accuracy, "Is there no text?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a first frame."}

- id: VCOV-FLM-02
  title: "Four coverage clips of the headphone man: reverse, profile, high, low"
  persona: "Second-unit director on an OTT drama shooting coverage of the crossing scene from one approved frame."
  evidence: "Sahil's 'Facing Headphone Man (Opposite Side)' (screenshot 244). In motion, each angle must also show the same second of action."
  levers: [set, unseen, camera, identity, light-lock]
  inputs: [{source: SRC-CROSSWALK, role: first_frame, note: "the approved frame"}]
  prompt: |
    This frame shows a man of about thirty in a mustard camp-collar shirt and black over-ear headphones
    standing on a zebra crossing, a two-car accident with steam and three arguing men behind him, low sun
    from the left. Make four 4-second clips of the same moment from four camera positions, as if four
    cameras rolled at once. In every clip he slowly takes the headphones off and lets them rest round his
    neck between 1 and 3 seconds; the three men keep arguing; the steam keeps rising. The street behind
    the original camera, never shown, is a row of low shops with blank awnings, a bus stop and parked
    scooters, the same in every clip that sees it. No readable text or plates.
  clip: {duration: 4, aspect: "16:9", camera: "per clip as described"}
  set_members:
    mode: separate
    must_stay_same:
      - "His face, shirt, jeans and headphones"
      - "The two damaged cars, the steam and the three men"
      - "Sun from the left of the original frame"
      - "The headphones come off between 1 and 3 s"
    members:
      - {name: "Reverse", prompt: "From behind the accident, past the sedan's roof, looking back at him; the unseen street behind him.", checks: [[prompt_adherence, "Is the camera behind the accident looking back at him?"], [prompt_adherence, "Is the street behind him shops, a bus stop and scooters?"]]}
      - {name: "Profile", prompt: "A clean side profile from the kerb, 85 mm.", checks: [[prompt_adherence, "Is it a clean profile?"], [prompt_adherence, "Do the headphones come off between 1 and 3 s?"]]}
      - {name: "High", prompt: "From a first-floor balcony six metres up, looking down at the crossing.", checks: [[prompt_adherence, "Are there three men by the cars?"], [physics_plausibility, "Do shadows fall the same way as in the frame?"]]}
      - {name: "Low", prompt: "From kerb height in front of him, 20 mm, looking up, steam against the sky.", checks: [[prompt_adherence, "Is it low looking up?"], [motion_coherence, "Is the steam rising continuously?"]]}
  deliverable: "Four 4-second clips, 16:9."
  checks:
    - [set_consistency, "Is he the same man in all four clips?"]
    - [set_consistency, "Do the headphones come off at the same moment in all four?"]
    - [set_consistency, "Are the cars, steam and three men consistent across the four angles?"]
    - [set_consistency, "Is the invented street the same in the clips that show it?"]
    - [prompt_adherence, "Does the sun stay on one side of the scene in all four?"]
    - [physics_plausibility, "Do shadows agree with that sun in all four?"]
    - [prompt_adherence, "Does each clip come from its described position?"]
    - [motion_coherence, "Is his movement natural with no morphing?"]
    - [motion_coherence, "Do the arguing men move naturally?"]
    - [text_accuracy, "Are there no readable signs or plates?"]
    - [visual_quality, "Are hands and faces clean?"]
    - [prompt_adherence, "Are there exactly four people in focus wherever the whole scene shows?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: partly, note: "Four image-to-video calls from the same frame; set agreement needs the set review."}

