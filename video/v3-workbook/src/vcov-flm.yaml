    detective in a maroon kurta on frame left with a brown file, the suspect in a torn grey T-shirt with
    a bruise on his left cheekbone on frame right, hands flat on the steel table, a khaki constable at the
    door. Make four 4-second clips of the same moment. In every clip, at 2 seconds the detective slides
    a photograph across the table to the suspect and he looks down at it. The lamp swings very slightly
