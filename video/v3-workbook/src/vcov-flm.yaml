- id: VCOV-FLM-04
  title: "Crane up from puddle height to a first-floor window; the tube light keeps lighting the stall from where it hangs"
  persona: "Gaffer on a Mumbai noir series checking light continuity through a crane move."
  evidence: "Light that follows the camera rather than its source is the giveaway in generated crane shots."
  levers: [camera-move, light-lock, physics, locale, end-frame]
  inputs: [{source: SRC-CHAI-STALL, role: first_frame}]
  prompt: |
    Start on this frame of a rainy chai stall at night and crane up for 8 seconds, from puddle height
    in the foreground to the height of a first-floor window across the lane, ending looking down on the
    stall. The single cyan-white tube under the awning stays the only key light: from every height it
    lights the vendor, the two customers and the counter from where it hangs, and as the camera rises
    the light pools on the wet road and on the tin roof become visible from above. The puddles in the
    foreground reflect the tube and the red board until they leave the frame. The vendor keeps pouring;
    rain keeps falling. Only the board's own text is readable.
  clip: {duration: 8, aspect: "16:9", camera: "crane up from puddle height to first-floor height"}
  deliverable: "One 8-second clip, 16:9."
  checks:
    - [prompt_adherence, "Does the camera rise steadily from puddle height to first-floor height?"]
    - [prompt_adherence, "Does the tube light stay the only key, lighting from where it hangs?"]
    - [prompt_adherence, "Do the light pools on the road and roof appear from above as expected?"]
    - [physics_plausibility, "Do the puddles reflect the tube and board correctly until they leave frame?"]
    - [motion_coherence, "Does the vendor keep pouring?"]
    - [physics_plausibility, "Does rain fall continuously?"]
    - [temporal_consistency, "Are the three people in the same places throughout?"]
    - [prompt_adherence, "Does it end looking down on the stall?"]
    - [motion_coherence, "Is there no warping of the shed as the camera rises?"]
    - [temporal_consistency, "Is the board the same red-on-white board?"]
    - [text_accuracy, "Is no other text readable?"]
    - [visual_quality, "Are faces and hands clean?"]
  competitor: "Seedance 2.5"
  runnable_today: {status: "yes", note: "One image-to-video call with a first frame."}

