      - {name: "Hands insert", prompt: "Close on the table as the photo slides into his hands.", checks: [[visual_quality, "Are both his hands natural?"], [prompt_adherence, "Does the hard top light sway with the lamp?"]]}
  deliverable: "Four 4-second clips, 16:9."
