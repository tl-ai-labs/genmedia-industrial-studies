    - [reference_fidelity, "Does the rider stay the same man throughout?"]
    - [physics_plausibility, "Do the short shadows stay under bike and rider without swinging?"]
    - [temporal_consistency, "Does the bike keep its shape all the way round, with no morphing?"]
    - [physics_plausibility, "Is there heat haze on the road?"]
    - [prompt_adherence, "Are there no brand marks or plate text?"]
