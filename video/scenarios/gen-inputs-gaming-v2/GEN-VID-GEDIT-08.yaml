id: GEN-VID-GEDIT-08-v2
modality: video
task: text_to_video
title: 'Source clip for VID-GEDIT-08: Smooth a choppy six'
prompt: 'Broadcast view from behind the bowler, the camera tilting up to follow the ball. The batter lofts the ball high for six and the camera follows it over the boundary into the crowd. No graphics or score bar on screen. Realistic mobile-game render look, sharp and clean, no text, no logos, no watermark. One continuous shot, six seconds.'
params:
