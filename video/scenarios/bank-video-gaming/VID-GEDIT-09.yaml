# Test type: EDIT-08 Change time of day or weather with correct light on people and objects
id: VID-GEDIT-09
modality: video
task: video_edit
title: 'Day drive turned to night'
prompt: 'Convert this daytime exterior into a night scene lit by sodium street lamps. Deep blue shadows, warm orange pools of light on the pavement, visible falloff between them. Keep the subject''s face, clothing, and every movement identical. Do not alter camera path, framing, or pacing. Any reflective surface should pick up the new light sources consistently.'
inputs:
  source: assets/bank/gaming/video/VID-GEDIT-09-source.mp4
params:
  audio: false
expected: 'Day drive turned to night. Capability under test: Change time of day or weather with correct light on people and objects. Adherence clauses, check each: 1) Night in every frame  2) Orange lamp pools with dark falloff between  3) Car reflections match the new lights  4) Route and camera unchanged  5) No flicker'
checks:
  min_width: 1280
  min_height: 720
