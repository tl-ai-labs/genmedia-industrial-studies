# Gaming pilot scenario VID-GEDIT-02 (BGMI, Video Editing). Built from
# docs/sheets/gaming-scenarios-video.xlsx.
# Prompt origin: Real-based.
# Prompt source: https://www.kapwing.com/tools/blur
# Test type: EDIT-16 Blur player names, chat or kill feed everywhere they appear
id: VID-GEDIT-02
modality: video
task: video_edit
title: 'Blur names in kill feed and tags'
prompt: 'Blur the names in the kill feed and the name tags above players, in every frame, and keep everything else sharp.'
inputs:
  source: assets/bank/gaming/video/VID-GEDIT-02-source.mp4
params:
  audio: false
expected: 'Blur names in kill feed and tags. Capability under test: Blur player names, chat or kill feed everywhere they appear. Adherence clauses, check each: 1) No player name is readable in any frame  2) Blur follows moving name tags without lag  3) The rest of the frame stays sharp  4) Kill feed background and icons still visible  5) No blur spills onto faces or the minimap'
checks:
  min_width: 1280
  min_height: 720
tags:
- gaming-pilot
- bgmi
- real-based
- video-editing
