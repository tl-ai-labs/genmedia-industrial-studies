# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row VID-I2V-10 (sheet row 104) — prompt verbatim.
# Industry: Ads (also: Ecommerce & Retail, Micro-drama & entertainment, Gaming)
# Sheet run settings: '5-8s; 3 seeds; reference images required'.
# Input assets required: Three reference stills | source: VBench-I2V image suite | link: open
# Runnable in v1: no — task reserved in v1 (needs assets and/or audio+lip-sync rubric).
# task 'image_to_video' is RESERVED in v1: schema-legal, no check suite, no
# model lists it in `supports`, so the matrix marks it skipped (n/a) — never
# billed. Assets are deliberately NOT declared under `inputs:` until they
# exist on disk, so a run containing this file is not rejected outright.
id: VID-I2V-10
modality: video
task: image_to_video
title: Three stills to a sequence
prompt: Using these three supplied stills in order as key moments, generate a continuous eight-second
  sequence that moves through all three.
inputs:
  still1: assets/bank/VID-I2V-10-still1.png
  still2: assets/bank/VID-I2V-10-still2.png
  still3: assets/bank/VID-I2V-10-still3.png
params:
  duration_s: 8
  resolution: 1080p
  aspect_ratio: '16:9'
  audio: false
expected: 'Three stills to a sequence. Capability under test: Multi-shot assembly from references.
  Adherence clauses, check each: 1) All three states appear, in the supplied order  2) Transitions
  between them are continuous  3) Subject consistent throughout  4) No content invented beyond
  the references'
checks:
  min_duration_s: 4.5
  max_duration_s: 9.0
  min_width: 1280
  min_height: 720
tags:
- image-to-video-first-last-frame
- scenario-bank
- pending-assets
