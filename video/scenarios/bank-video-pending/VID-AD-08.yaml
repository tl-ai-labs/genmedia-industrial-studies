# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row VID-AD-08 (sheet row 82) — prompt verbatim.
# Industry: Ads (also: Ecommerce & Retail)
# Sheet run settings: '6-8s; 1080p; 3 seeds; product reference required'.
# Input assets required: Three product references | source: Google Scanned Objects (CC BY 4.0) | link: open
# Runnable in v1: no — task reserved in v1 (needs assets and/or audio+lip-sync rubric).
# task 'image_to_video' is RESERVED in v1: schema-legal, no check suite, no
# model lists it in `supports`, so the matrix marks it skipped (n/a) — never
# billed. Assets are deliberately NOT declared under `inputs:` until they
# exist on disk, so a run containing this file is not rejected outright.
id: VID-AD-08
modality: video
task: image_to_video
title: SKU line-up pan
prompt: A slow lateral pan across the three supplied product variants arranged on a shelf.
  All three stay accurate and their labels stay readable.
inputs:
  reference1: assets/bank/VID-AD-08-reference1.png
  reference2: assets/bank/VID-AD-08-reference2.png
  reference3: assets/bank/VID-AD-08-reference3.png
params:
  duration_s: 8
  resolution: 1080p
  aspect_ratio: '16:9'
  audio: false
expected: 'SKU line-up pan. Capability under test: Multiple references under camera motion.
  Adherence clauses, check each: 1) All three products present and correct  2) Smooth lateral
  pan  3) Labels readable as each passes centre  4) No product morphing during the pan'
checks:
  min_duration_s: 5.5
  max_duration_s: 9.0
  min_width: 1280
  min_height: 720
tags:
- advertising-product-video
- scenario-bank
- pending-assets
