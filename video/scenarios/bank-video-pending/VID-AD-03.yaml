id: VID-AD-03
modality: video
task: image_to_video
title: Packshot with supers
prompt: 'The supplied product on a gradient background. Text appears reading exactly: NEW
  - 40% MORE. Text stays fixed and legible for four seconds.'
inputs:
  reference: assets/bank/VID-AD-03-reference.png
params:
  duration_s: 8
  resolution: 1080p
  aspect_ratio: '16:9'
  audio: false
expected: 'Packshot with supers. Capability under test: On-screen text stability. Adherence
  clauses, check each: 1) Text string exact  2) Text stable, no drift or warp  3) Product
  unaltered  4) Text legible against background'
checks:
  min_duration_s: 5.5
  max_duration_s: 9.0
  min_width: 1280
  min_height: 720
tags:
- advertising-product-video
- scenario-bank
- pending-assets
