# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row VID-I2V-02 (sheet row 96) — prompt verbatim.
# Industry: Ads (also: Ecommerce & Retail, Micro-drama & entertainment, Gaming)
# Sheet run settings: '5-8s; 3 seeds; reference images required'.
# Input assets required: Reference image | source: VBench-I2V image suite | link: open
# Runnable in v1: no — task reserved in v1 (needs assets and/or audio+lip-sync rubric).
# task 'image_to_video' is RESERVED in v1: schema-legal, no check suite, no
# model lists it in `supports`, so the matrix marks it skipped (n/a) — never
# billed. Assets are deliberately NOT declared under `inputs:` until they
# exist on disk, so a run containing this file is not rejected outright.
id: VID-I2V-02
modality: video
task: image_to_video
title: First frame continuation
prompt: Use this image as the exact first frame. Continue it for five seconds with the person
  turning to look out of the window.
inputs:
  first_frame: assets/bank/VID-I2V-02-first_frame.png
params:
  duration_s: 8
  resolution: 1080p
  aspect_ratio: '16:9'
  audio: false
expected: 'First frame continuation. Capability under test: Faithful start-state adherence.
  Adherence clauses, check each: 1) First frame matches the supplied image  2) Turn action
  completes  3) Identity consistent  4) Scene consistent'
checks:
  min_duration_s: 4.5
  max_duration_s: 9.0
  min_width: 1280
  min_height: 720
tags:
- image-to-video-first-last-frame
- scenario-bank
- pending-assets
