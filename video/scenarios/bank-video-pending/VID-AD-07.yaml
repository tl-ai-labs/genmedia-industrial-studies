id: VID-AD-07
modality: video
task: image_to_video
title: Product against moving background
prompt: The supplied product remains static and sharp in the centre while a colourful abstract
  background moves behind it. Clean edges, no fringing.
inputs:
  reference: assets/bank/VID-AD-07-reference.png
params:
  duration_s: 8
  resolution: 1080p
  aspect_ratio: '16:9'
  audio: false
expected: 'Product against moving background. Capability under test: Edge quality under motion.
  Adherence clauses, check each: 1) Product static and sharp  2) Background in motion  3)
  No edge fringing or halo  4) Product unaltered'
checks:
  min_duration_s: 5.5
  max_duration_s: 9.0
  min_width: 1280
  min_height: 720
tags:
- advertising-product-video
- scenario-bank
- pending-assets
