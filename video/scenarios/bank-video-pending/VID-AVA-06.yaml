  product: assets/bank/VID-AVA-06-product.png
params:
  duration_s: 8
  resolution: 1080p
  aspect_ratio: '16:9'
  audio: true
expected: 'Presenter with product. Capability under test: Held-object stability during speech.
  Adherence clauses, check each: 1) Product matches reference  2) Grip plausible and stable  3)
  Product does not morph  4) Speech and sync correct'
checks:
  min_duration_s: 7.0
  max_duration_s: 16.0
  min_width: 1280
  min_height: 720
