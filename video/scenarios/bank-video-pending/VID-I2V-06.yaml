# Source: genmedia_validation_rubrics_with_industry_mappings.xlsx
# Scenario bank row VID-I2V-06 (sheet row 100) — prompt verbatim.
# Industry: Ads (also: Ecommerce & Retail, Micro-drama & entertainment, Gaming)
# Sheet run settings: '5-8s; 3 seeds; reference images required'.
# Input assets required: Landscape photograph | source: Pexels / Unsplash (free commercial) | link: open
# Runnable in v1: no — task reserved in v1 (needs assets and/or audio+lip-sync rubric).
# task 'image_to_video' is RESERVED in v1: schema-legal, no check suite, no
# model lists it in `supports`, so the matrix marks it skipped (n/a) — never
# billed. Assets are deliberately NOT declared under `inputs:` until they
# exist on disk, so a run containing this file is not rejected outright.
id: VID-I2V-06
modality: video
task: image_to_video
title: Landscape parallax
prompt: Add a slow lateral camera move to this landscape photograph so that foreground and
  background separate with natural parallax.
inputs:
  landscape: assets/bank/VID-I2V-06-landscape.png
params:
  duration_s: 8
  resolution: 1080p
  aspect_ratio: '16:9'
  audio: false
expected: 'Landscape parallax. Capability under test: Depth inference from a flat image. Adherence
  clauses, check each: 1) Lateral camera move present  2) Foreground moves faster than background  3)
  No warping or tearing  4) Scene content unchanged'
checks:
  min_duration_s: 4.5
  max_duration_s: 9.0
  min_width: 1280
  min_height: 720
tags:
- image-to-video-first-last-frame
- scenario-bank
- pending-assets
